android.useAndroidX=true
org.gradle.jvmargs=-Xmx3096m -Dfile.encoding=UTF-8
org.gradle.daemon=false
# R8 FULL MODE, stated rather than inherited. AGP 9 defaults it to true, so this
# line changes nothing today -- it is here because proguard-rules.pro is WRITTEN
# for full mode (-allowaccessmodification, -repackageclasses) and would quietly
# stop paying for itself if a future AGP flipped the default back. Full mode is
# what allows cross-class inlining, class merging and the aggressive devirtual-
# isation; compat mode keeps far more than this app needs.
android.enableR8.fullMode=true

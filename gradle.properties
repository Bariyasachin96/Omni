org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.daemon=false
# Gradle's own current recommendations (Gradle 9): the configuration cache --
# the build's task graph is kept and reused when nothing that configures it
# changed -- and the build cache, which reuses task outputs across builds.
org.gradle.configuration-cache=true
org.gradle.caching=true
# R8 FULL MODE, stated rather than inherited. AGP 9 defaults it to true, so this
# line changes nothing today -- it is here because proguard-rules.pro is WRITTEN
# for full mode (-allowaccessmodification, -repackageclasses) and would quietly
# stop paying for itself if a future AGP flipped the default back.
android.enableR8.fullMode=true

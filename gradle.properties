android.useAndroidX=true
org.gradle.jvmargs=-Xmx3096m -Dfile.encoding=UTF-8
org.gradle.daemon=false
# R8 FULL MODE, stated rather than inherited. AGP 9 defaults it to true, so this
# line changes nothing today -- it is here because proguard-rules.pro is WRITTEN
# for full mode (-allowaccessmodification, -repackageclasses) and would quietly
# stop paying for itself if a future AGP flipped the default back. Full mode is
# what allows cross-class inlining, class merging and the aggressive devirtual-
# isation; compat mode keeps far more than this app needs.
android.enableR8.fullMode=true

# THE accessibility JOB'S DEPENDENCY FAILURE, and AGP 9.4.0 was wrongly blamed.
#
# Builds 849-854 all failed :app:mergeDebugAndroidTestAssets with
#
#   Could not resolve com.google.guava:listenablefuture:{strictly 1.0}
#   Could not resolve androidx.concurrent:concurrent-futures:{strictly 1.1.0}
#
# The `{strictly}` is AGP's CONSISTENT RESOLUTION: VariantDependenciesBuilder.
# maybeAddDependencyConstraints() pins the androidTest classpath to whatever the
# app's runtime classpath resolved, and the two graphs genuinely disagree --
# measured with tools/fetch-deps.py rather than assumed:
#
#   artifact                          app            app + androidTest
#   androidx.concurrent:concurrent-futures   1.1.0   1.2.0  (androidx.test:core 1.7.0)
#   com.google.guava:guava                   absent  31.0.1-android  (ATF 4.1.1)
#
# and guava requires listenablefuture 9999.0-empty-to-avoid-conflict-with-guava,
# which `strictly 1.0` can never accept.
#
# IT IS NOT AGP 9.4.0. That was the first diagnosis and build 854 refutes it:
# AGP was already back at 9.3.2 and the error is identical. It is not
# core-splashscreen 1.2.0 either -- resolved both ways above, and neither
# artifact moves. By elimination the version that changed the behaviour is
# GRADLE 9.5.0 -> 9.7.1; nothing else in that batch can touch dependency
# resolution. Both conflicts are older than the batch and were simply tolerated.
#
# Turning AGP's constraints off is the targeted fix, and the option was read out
# of the AGP 9.3.2 jar rather than recalled: BooleanOption.USE_DEPENDENCY_
# CONSTRAINTS = "android.dependency.useConstraints", ApiStage.Stable, and it is
# what maybeAddDependencyConstraints() gates on.
#
# What it costs: the androidTest APK may resolve a different version of a shared
# library than the app APK. Inert here -- neither our test code nor Google's
# Accessibility Test Framework touches ListenableFuture or concurrent-futures
# across that boundary, and CallbackToFutureAdapter/ResolvableFuture exist in
# both 1.1.0 and 1.2.0. It affects the debug/androidTest classpath only; the
# RELEASE APK the owner installs is built by the `build` job, which has passed
# every one of these runs and does not go through this configuration.
android.dependency.useConstraints=false

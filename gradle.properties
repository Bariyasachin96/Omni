android.useAndroidX=true
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.daemon=false
# R8 FULL MODE, stated rather than inherited. AGP 9 defaults it to true, so this
# line changes nothing today -- it is here because proguard-rules.pro is WRITTEN
# for full mode (-allowaccessmodification, -repackageclasses) and would quietly
# stop paying for itself if a future AGP flipped the default back.
android.enableR8.fullMode=true
# The accessibility job's old dependency failure (builds 849-857) is fixed in
# app/build.gradle.kts -- concurrent-futures declared in the app, guava's empty
# listenablefuture excluded from the androidTest configurations. It was never a
# Gradle, AGP or gradle.properties setting; the long note that stood here said
# Gradle was held at 9.5.0, which stopped being true on 2026-09-10 (9.7.1).

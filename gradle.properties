android.useAndroidX=true
org.gradle.jvmargs=-Xmx3096m -Dfile.encoding=UTF-8
org.gradle.daemon=false
# R8 FULL MODE, stated rather than inherited. AGP 9 defaults it to true, so this
# line changes nothing today -- it is here because proguard-rules.pro is WRITTEN
# for full mode (-allowaccessmodification, -repackageclasses) and would quietly
# stop paying for itself if a future AGP flipped the default back. Full mode is
# what allows cross-class inlining, class merging and the aggressive devirtual-
# isation; compat mode keeps far more than this app needs.
android.enableR8.fullMode=true

# THE accessibility JOB'S DEPENDENCY FAILURE -- TWO WRONG DIAGNOSES, THEN THE
# ONE THE EVIDENCE ACTUALLY SUPPORTS. Read this before touching Gradle again.
#
# Builds 849-856 all failed :app:mergeDebugAndroidTestAssets on
#
#   Could not resolve com.google.guava:listenablefuture:{strictly 1.0}
#   Could not resolve androidx.concurrent:concurrent-futures:{strictly 1.1.0}
#
# Wrong diagnosis 1: "AGP 9.4.0 applies consistent resolution harder." Build 854
# refutes it -- AGP was already back at 9.3.2 and the error was identical.
# Wrong diagnosis 2: "android.dependency.useConstraints=false turns AGP's
# constraints off." The option is real (read out of the AGP 9.3.2 jar:
# BooleanOption.USE_DEPENDENCY_CONSTRAINTS, ApiStage.Stable, gating
# VariantDependenciesBuilder.maybeAddDependencyConstraints) and build 856 set it
# and failed with the SAME message, still reasoned "by consistent resolution".
# So it does not gate what that message comes from. The line is gone rather than
# left in as dead config.
#
# What the two graphs actually hold, measured with tools/fetch-deps.py:
#
#   artifact                                app       app + androidTest
#   androidx.concurrent:concurrent-futures  1.1.0     1.2.0  (androidx.test:core 1.7.0)
#   com.google.guava:guava                  absent    31.0.1-android  (ATF 4.1.1)
#
# and guava requires listenablefuture 9999.0-empty-to-avoid-conflict-with-guava,
# which `strictly 1.0` can never accept. BOTH conflicts are older than the
# "latest stable" batch and were simply tolerated before it.
#
# THE ONE VARIABLE THAT CHANGED IS GRADLE, and that is now by elimination plus a
# measurement rather than a guess: AGP is back at 9.3.2 and still fails;
# core-splashscreen 1.2.0 was resolved at both versions and moves neither
# artifact; Kotlin, NDK, CMake and build-tools cannot touch dependency
# resolution. Gradle is at 9.5.0 again -- the version build 848 proved green
# with this exact graph.
#
# This is the same carve-out as lifecycle 2.12.0-alpha and it is the owner's own
# rule: "latest" means the newest version that actually works, and one that fails
# the accessibility gate is not one. The real repair is to make the two graphs
# agree -- align concurrent-futures in the app, and keep guava's listenablefuture
# marker off the androidTest classpath -- and that is worth doing on a green
# baseline, not while every attempt costs a thirteen-minute run.

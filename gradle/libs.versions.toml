# EVERY VERSION THE BUILD USES, IN ONE PLACE (owner, 2026-10-08: "sab kuchh
# latest aur naya ... kuchh bhi purana nahin rakhna"). Gradle's version catalog
# is the current standard for Android builds -- Android Studio's own new-project
# template writes this file -- and it replaces versions typed into each
# build.gradle.kts. The build scripts name a dependency through `libs.`, and the
# tools and CI read the toolchain versions below out of this file, so nothing
# can drift between them.
#
# THE RULE: the latest STABLE release of everything (no alpha, beta or rc),
# checked against each artifact's maven-metadata.xml on 2026-10-13.

[versions]
# --- toolchain -------------------------------------------------------------
# AGP 9.4.1 needs Gradle 9.6.0 or newer (gradle/wrapper says which Gradle).
agp = "9.4.1"
# Kotlin: AGP 9 compiles Kotlin itself (built-in Kotlin) and depends on KGP
# 2.2.10; a newer KGP goes on the buildscript classpath, the documented way
# (AGP 9.0 release notes, "Use a higher KGP or KSP version"). The Compose
# compiler plugin ships with Kotlin and must match it exactly.
kotlin = "2.4.21"
# The NDK, CMake and build-tools the native core and the APK are built with.
# CI installs exactly these (tools/ci/install-sdk.sh reads them from here).
ndk = "30.0.16248370"
cmake = "4.1.2"
buildTools = "37.0.0"
baselineprofile = "1.5.0"
# --- libraries -------------------------------------------------------------
desugarJdkLibs = "2.1.5"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
activityCompose = "1.13.0"
coreSplashscreen = "1.2.0"
datastore = "1.2.1"
startup = "1.2.0"
profileinstaller = "1.4.1"
concurrentFutures = "1.3.0"
# compose.ui and compose.foundation 1.12.1, material3 1.4.0.
composeBom = "2026.09.00"
# Window size classes: NOT in the Compose BOM, so it carries its own version.
material3Adaptive = "1.3.0"
# --- the libraries nothing here declares, raised by constraints -------------
annotationExperimental = "1.6.0"
appcompatResources = "1.8.0"
autofill = "1.3.0"
collection = "1.7.0"
customviewPoolingcontainer = "1.1.0"
emoji2 = "1.7.0"
graphicsPath = "1.1.0"
navigationevent = "1.2.0"
savedstate = "1.5.0"
tracing = "2.0.4"
vectordrawable = "1.2.0"
versionedparcelable = "1.2.1"
window = "1.5.1"
kotlinxSerialization = "1.12.0"
jspecify = "1.0.1"
# --- tests -----------------------------------------------------------------
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
uiautomator = "2.4.0"
benchmarkMacro = "1.5.0"

[libraries]
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-startup-runtime = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures", version.ref = "concurrentFutures" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-junit4-accessibility = { group = "androidx.compose.ui", name = "ui-test-junit4-accessibility" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
# constraints only (app/build.gradle.kts): each raises a module already in the graph
androidx-annotation-experimental = { group = "androidx.annotation", name = "annotation-experimental", version.ref = "annotationExperimental" }
androidx-appcompat-resources = { group = "androidx.appcompat", name = "appcompat-resources", version.ref = "appcompatResources" }
androidx-autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
androidx-collection = { group = "androidx.collection", name = "collection", version.ref = "collection" }
androidx-customview-poolingcontainer = { group = "androidx.customview", name = "customview-poolingcontainer", version.ref = "customviewPoolingcontainer" }
androidx-emoji2 = { group = "androidx.emoji2", name = "emoji2", version.ref = "emoji2" }
androidx-graphics-path = { group = "androidx.graphics", name = "graphics-path", version.ref = "graphicsPath" }
androidx-navigationevent = { group = "androidx.navigationevent", name = "navigationevent", version.ref = "navigationevent" }
androidx-navigationevent-compose = { group = "androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationevent" }
androidx-savedstate = { group = "androidx.savedstate", name = "savedstate", version.ref = "savedstate" }
androidx-savedstate-compose = { group = "androidx.savedstate", name = "savedstate-compose", version.ref = "savedstate" }
androidx-savedstate-ktx = { group = "androidx.savedstate", name = "savedstate-ktx", version.ref = "savedstate" }
androidx-tracing = { group = "androidx.tracing", name = "tracing", version.ref = "tracing" }
androidx-vectordrawable = { group = "androidx.vectordrawable", name = "vectordrawable", version.ref = "vectordrawable" }
androidx-vectordrawable-animated = { group = "androidx.vectordrawable", name = "vectordrawable-animated", version.ref = "vectordrawable" }
androidx-versionedparcelable = { group = "androidx.versionedparcelable", name = "versionedparcelable", version.ref = "versionedparcelable" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-window-core = { group = "androidx.window", name = "window-core", version.ref = "window" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

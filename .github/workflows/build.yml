          write_source("app/src/main/res/values/styles.xml",
          "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
          "<resources>\n"
          "    <!-- This app draws its entire UI with Jetpack Compose, and every colour it\n"
          "         uses comes from EvColorScheme in ComposeTheme.kt. The only job left for\n"
          "         an XML theme is dressing the window before Compose's first frame: the\n"
          "         background (so there is no flash) and the system bars.\n"
          "\n"
          "         The parent is therefore the FRAMEWORK theme, not\n"
          "         Theme.Material3.Dark.NoActionBar from com.google.android.material. That\n"
          "         View library and androidx.appcompat were pulled in for this one line and\n"
          "         are now gone from the build; the activities are ComponentActivity, which\n"
          "         needs no AppCompat theme. Only android: attributes remain, because the\n"
          "         colorPrimary / colorSurfaceVariant / colorOutline family are Material\n"
          "         Components attributes that do not exist outside that library. -->\n"
          "    <style name=\"AppTheme\" parent=\"@android:style/Theme.Material.NoActionBar\">\n"
          "        <item name=\"android:colorBackground\">@color/ev_background</item>\n"
          "        <item name=\"android:windowBackground\">@color/ev_background</item>\n"
          "        <item name=\"android:statusBarColor\">@color/ev_background</item>\n"
          "        <item name=\"android:navigationBarColor\">@color/ev_background</item>\n"
          "        <item name=\"android:windowLightStatusBar\">false</item>\n"
          "    </style>\n"
          "    <!-- The manifest names this one. The parent already has no action bar, so\n"
          "         windowActionBar / windowNoTitle (AppCompat attributes) are not needed.\n"
          "         AppTheme.AppBarOverlay is deleted; nothing referenced it. -->\n"
          "    <style name=\"AppTheme.NoActionBar\" parent=\"@style/AppTheme\" />\n"
          "</resources>\n"
          )




          "    }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.CENTER_HORIZONTAL })\n"
          "    // AutoTTS wires this straight to o.a() — truncate the file, no toast, no feedback.\n"
          "    logButtonRow.addView(fullWidthButton(\"Clear logs\") {\n"
          "        EasyVoiceLogger.clear()\n"
          "    }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.CENTER_HORIZONTAL })\n"
          "    return scroll\n"
          "}\n"
          "// Exact port of fragment_license.xml + c3.j.S2().\n"
          "// The XML is: fillViewport ScrollView -> vertical LinearLayout with NO padding -> the\n"
          "// #ff293842 bar (TextView Medium, white, layout_margin 5dip, @string/tab_text_5) ->\n"
          "// @id/licences_text, fill_parent, layout_margin 5dip on all four sides, Small.\n"
          "// S2() is Html.fromHtml(@string/autotts_license, 0) + LinkMovementMethod, nothing else.\n"
          "fun buildLicensesTabView(context: Context): View {\n"
          "    val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL }\n"

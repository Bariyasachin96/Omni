          static std::string javaFamilyFallback(const std::string& primary, const std::vector<std::string>& fallbacks, const std::unordered_set<std::string>& enabled){
              std::vector<std::string> full; full.push_back(primary); for(auto& f: fallbacks) full.push_back(f);
              int initCap=(int)(full.size()/0.75)+1; if(initCap<16) initCap=16;
              std::vector<std::string> famOrder = jHashSetOrder(full, initCap);
              std::vector<std::string> fi; for(auto& s: famOrder) if(enabled.count(s)) fi.push_back(s);
              std::vector<std::string> r = jHashSetOrder(fi, -1);
              for(auto& s: r) if(enabled.count(s)) return s;
              return "";
          }
          static std::string scriptLangFilteredC(int cp, const std::unordered_set<std::string>& enabled, std::string* lb){

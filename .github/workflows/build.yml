          "        }\n"
          "        return\n"
          "    }\n"
          "    var searchQuery by remember { mutableStateOf(\"\") }\n"
          "    // AutoTTS c3/i.java M2()/Q2(): a filter button toggles the list between all languages and\n"
          "    // selected-only, its label swapping between \"Show selected\" and \"Show all\".\n"
          "    var showSelectedOnly by remember { mutableStateOf(false) }\n"
          "    var scannedLangs by remember { mutableStateOf<Set<String>>(emptySet()) }\n"
          "    var scanning by remember { mutableStateOf(true) }\n"
          "    LaunchedEffect(readingMode) {\n"
          "        // AutoTTS M2(): Google mode (L=3) → only Google TTS's languages; Auto/Mix → all engines.\n"

          "            if (restoringIndex != -1) { EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \" -Restoring in progress...\"); return }\n"
          "            // AutoTTS i0 matches f0.e() (the NORMALIZED pkg) against the raw incoming name, ignoring case\n"

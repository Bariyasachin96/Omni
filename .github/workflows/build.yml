          "            EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Init \" + (if (initIndex < enginePool.size) enginePool[initIndex].pkg else \"\"))\n"
          "            EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"res \" + status)\n"

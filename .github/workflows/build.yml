          "                    val dictMap = cachedDictMap\n"
          "                    VhLogger.d(\"[SERVICE] dual mode: lat=$latFall nonLat=$nonLatFall punc=$mixPuncLang num=$mixNumLang\")\n"
          "                    val tBytes = trimmedText.toByteArray(Charsets.UTF_8)\n"

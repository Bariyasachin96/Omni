          "    }\n"
          "    private fun bindEngineKeepAlive(pkg: String) {\n"
          "        if (pkg.isEmpty() || engineBinders.containsKey(pkg)) return\n"
          "        try {\n"
          "            val intent = android.content.Intent(\"android.intent.action.TTS_SERVICE\").setPackage(pkg)\n"
          "            val ri = packageManager.resolveService(intent, 0)\n"
          "            if (ri == null || ri.serviceInfo == null) { EasyVoiceLogger.d(\"[ENGINE] No TTS service found in $pkg\"); return }\n"
          "            intent.component = android.content.ComponentName(ri.serviceInfo.packageName, ri.serviceInfo.name)\n"
          "            val conn = object : android.content.ServiceConnection {\n"
          "                override fun onServiceConnected(name: android.content.ComponentName?, service: android.os.IBinder?) { EasyVoiceLogger.d(\"[ENGINE] Keep-alive bound to $pkg\") }\n"
          "                override fun onServiceDisconnected(name: android.content.ComponentName?) { EasyVoiceLogger.d(\"[ENGINE] Engine process died: $pkg\"); restoreEngine(pkg) }\n"
          "                override fun onBindingDied(name: android.content.ComponentName?) { EasyVoiceLogger.d(\"[ENGINE] Binding died: $pkg\"); unbindEngineKeepAlive(pkg); bindEngineKeepAlive(pkg) }\n"
          "                override fun onNullBinding(name: android.content.ComponentName?) { EasyVoiceLogger.d(\"[ENGINE] Service returned null binding: $pkg\"); unbindEngineKeepAlive(pkg) }\n"
          "            }\n"
          "            val ok = try { bindService(intent, conn, android.content.Context.BIND_AUTO_CREATE or android.content.Context.BIND_IMPORTANT) } catch (_: Exception) { false }\n"
          "            if (ok) engineBinders[pkg] = conn else { EasyVoiceLogger.d(\"[ENGINE] bindService failed for $pkg\"); try { unbindService(conn) } catch (_: Exception) {} }\n"
          "        } catch (_: Exception) { EasyVoiceLogger.e(\"[ENGINE] bindService error for $pkg\") }\n"
          "    }\n"
          "    private fun unbindEngineKeepAlive(pkg: String) {\n"
          "        val conn = engineBinders.remove(pkg) ?: return\n"
          "        try { unbindService(conn) } catch (_: Exception) {}\n"
          "    }\n"
          "    private fun unbindAllEngineKeepAlive() { for (k in engineBinders.keys.toList()) unbindEngineKeepAlive(k) }\n"
          "    override fun onGetLanguage(): Array<String> {\n"
          "        val locale = try { java.util.Locale.getDefault() } catch (_: Exception) { return arrayOf(\"zxx\") }\n"
          "        if (locale == null) return arrayOf(\"zxx\")\n"
          "        val iso3 = try { locale.isO3Language } catch (_: Exception) { \"zxx\" }\n"
          "        return arrayOf(when (iso3) { \"cmn\", \"lzh\", \"gan\", \"hak\" -> \"zho\"; else -> iso3 })\n"
          "    }\n"
          "    override fun onIsLanguageAvailable(l: String?, c: String?, v: String?): Int {\n"
          "        EasyVoiceLogger.d(\"[LANG] onIsLanguageAvailable l=$l c=$c v=$v\")\n"
          "        val raw = l ?: \"\"\n"
          "        val result = if (prefs.getLanguageList().contains(raw) && !prefs.isLanguageDisabled(raw)) TextToSpeech.LANG_AVAILABLE else TextToSpeech.LANG_NOT_SUPPORTED\n"
          "        EasyVoiceLogger.d(\"[LANG] onIsLanguageAvailable l=$l → result=$result\")\n"
          "        return result\n"
          "    }\n"
          "    override fun onLoadLanguage(l: String?, c: String?, v: String?): Int {\n"
          "        EasyVoiceLogger.d(\"[LANG] onLoadLanguage l=$l c=$c v=$v\")\n"
          "        return synchronized(this) {\n"
          "            val result = onIsLanguageAvailable(l, c, v)\n"
          "            EasyVoiceLogger.d(\"[LANG] onLoadLanguage isAvail=$result l=$l\")\n"
          "            if ((result == TextToSpeech.LANG_AVAILABLE || result == TextToSpeech.LANG_COUNTRY_AVAILABLE || result == TextToSpeech.LANG_COUNTRY_VAR_AVAILABLE) && !l.isNullOrEmpty() && ::prefs.isInitialized) {\n"
          "                val lang = prefs.toIso3(l.lowercase())\n"
          "                if (modeInt == 3) {\n"
          "                    try { loadVoice(\"com.google.android.tts\", Locale(lang), v ?: \"\", dedicatedEnginesFlag) } catch (_: Exception) {}\n"
          "                    EasyVoiceLogger.d(\"[LANG] onLoadLanguage modeInt=3 → loadVoice(google, $lang) engineIndex=$engineIndex\")\n"
          "                    return@synchronized result\n"
          "                }\n"
          "                val vStr = v ?: \"\"\n"
          "                val paramVariant = if (vStr.isEmpty()) prefs.getVoiceName(lang) else vStr\n"
          "                try {\n"
          "                    var enginePkg = prefs.getEngineForLanguage(lang)\n"
          "                    var voiceLang = lang\n"
          "                    if (enginePkg == \"NOT_SET\") {\n"
          "                        val cLang = prefs.toIso3(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { localeIso3() })\n"
          "                        enginePkg = prefs.getEngineForLanguage(cLang)\n"
          "                        voiceLang = cLang\n"
          "                    }\n"
          "                    val savedLocTag = prefs.getLocaleForLangPkg(voiceLang, enginePkg)\n"
          "                    val saved = parseVoiceNameAsLocale(savedLocTag) ?: return@synchronized TextToSpeech.LANG_NOT_SUPPORTED\n"
          "                    val savedLangMatches = try { localeIso3(saved).lowercase() == lang } catch (_: Exception) { false }\n"
          "                    if (savedLangMatches) {\n"
          "                        EasyVoiceLogger.d(\"[LANG] onLoadLanguage V pkg=$enginePkg locale=$saved variant=$paramVariant dedicatedEnginesFlag=$dedicatedEnginesFlag\")\n"
          "                        loadVoice(if (enginePkg == \"NOT_SET\") \"\" else enginePkg, saved, paramVariant, dedicatedEnginesFlag)\n"
          "                    } else {\n"
          "                        val langOnly = Locale(lang)\n"
          "                        val foundPkg = findEngineForLocale(langOnly)\n"
          "                        EasyVoiceLogger.d(\"[LANG] onLoadLanguage saved-lang mismatch → findEngineForLocale scan pkg='$foundPkg' locale=$langOnly\")\n"
          "                        loadVoice(foundPkg, langOnly, paramVariant, dedicatedEnginesFlag)\n"
          "                    }\n"
          "                } catch (_: Exception) {}\n"
          "            }\n"
          "            EasyVoiceLogger.d(\"[LANG] onLoadLanguage l=$l → $result engineIndex=$engineIndex\")\n"
          "            result\n"
          "        }\n"
          "    }\n"
          "    override fun onGetDefaultVoiceNameFor(l: String?, c: String?, v: String?): String {\n"
          "        return l ?: \"\"\n"
          "    }\n"
          "    override fun onGetVoices(): MutableList<Voice> {\n"
          "        val list = mutableListOf<Voice>()\n"
          "        try {\n"
          "            for (iso in prefs.getLanguageList()) {\n"
          "                if (prefs.isLanguageDisabled(iso)) continue\n"
          "                val locale = Locale(iso)\n"
          "                val voice = Voice(\n"
          "                    iso,\n"
          "                    locale,\n"
          "                    400,\n"
          "                    100,\n"
          "                    false,\n"
          "                    emptySet()\n"
          "                )\n"
          "                list.add(voice)\n"
          "            }\n"
          "        } catch (e: Exception) { EasyVoiceLogger.e(\"[SERVICE] onGetVoices failed: ${e.message}\") }\n"
          "        return list\n"
          "    }\n"
          "    private fun isKnownVoiceName(name: String?): Boolean {\n"
          "        if (name == null) return false\n"
          "        val iso = name.lowercase()\n"
          "        return prefs.getLanguageList().contains(iso) && !prefs.isLanguageDisabled(iso)\n"
          "    }\n"
          "    override fun onIsValidVoiceName(name: String?): Int =\n"
          "        if (isKnownVoiceName(name)) TextToSpeech.SUCCESS else TextToSpeech.ERROR\n"
          "    private fun parseVoiceNameAsLocale(voiceName: String?): java.util.Locale? {\n"
          "        if (voiceName == null) return null\n"
          "        return try {\n"
          "            val parts = voiceName.split(\"_\")\n"
          "            when (parts.size) {\n"
          "                1 -> java.util.Locale(parts[0])\n"
          "                2 -> java.util.Locale(parts[0], parts[1])\n"
          "                3 -> if (parts[2].isEmpty()) java.util.Locale(parts[0], parts[1]) else java.util.Locale(parts[0], parts[1], parts[2])\n"
          "                else -> null\n"
          "            }\n"
          "        } catch (_: Exception) { null }\n"
          "    }\n"
          "    private fun findEngineForLocale(locale: java.util.Locale): String {\n"
          "        val lang0 = localeIso3(locale)\n"
          "        val country0 = try { locale.isO3Country } catch (_: Exception) { \"\" }\n"
          "        val variant0 = locale.variant\n"
          "        for (n in 0 until voiceList.size) {\n"
          "            val parts = voiceList[n].split(\"#\")\n"
          "            if (parts.size != 2 && parts.size != 3) continue\n"
          "            val locale2 = parseVoiceNameAsLocale(parts[1]) ?: return \"\"\n"
          "            val country2 = try { locale2.isO3Country } catch (_: Exception) { \"\" }\n"
          "            if (lang0 == localeIso3(locale2) && country0 == country2 && variant0 == locale2.variant) return parts[0]\n"
          "        }\n"
          "        for (n in 0 until voiceList.size) {\n"
          "            val parts = voiceList[n].split(\"#\")\n"
          "            if (parts.size != 2 && parts.size != 3) continue\n"
          "            val locale2 = parseVoiceNameAsLocale(parts[1]) ?: return \"\"\n"
          "            val country2 = try { locale2.isO3Country } catch (_: Exception) { \"\" }\n"
          "            if (lang0 == localeIso3(locale2) && country0 == country2) return parts[0]\n"
          "        }\n"
          "        for (n in 0 until voiceList.size) {\n"
          "            val parts = voiceList[n].split(\"#\")\n"
          "            if (parts.size != 2 && parts.size != 3) continue\n"
          "            val locale2 = parseVoiceNameAsLocale(parts[1]) ?: return \"\"\n"
          "            if (lang0 == localeIso3(locale2)) return parts[0]\n"
          "        }\n"
          "        return \"\"\n"
          "    }\n"
          "    override fun onLoadVoice(name: String?): Int {\n"
          "        lastLoadVoiceName = name ?: \"\"\n"
          "        if (name == null) return TextToSpeech.ERROR\n"
          "        val locale = parseVoiceNameAsLocale(name) ?: return TextToSpeech.ERROR\n"
          "        val rawIso3 = try { locale.isO3Language } catch (_: Exception) { return TextToSpeech.ERROR }\n"
          "        val iso3Lang = if (rawIso3 == \"cmn\" || rawIso3 == \"lzh\" || rawIso3 == \"gan\" || rawIso3 == \"hak\") \"zho\" else rawIso3\n"
          "        val iso3Country = try { locale.isO3Country } catch (_: Exception) { \"\" }\n"
          "        val variantStr = locale.variant\n"
          "        val loadRes = onLoadLanguage(iso3Lang, iso3Country, variantStr)\n"
          "        return if (loadRes == TextToSpeech.LANG_AVAILABLE ||\n"
          "                   loadRes == TextToSpeech.LANG_COUNTRY_AVAILABLE ||\n"
          "                   loadRes == TextToSpeech.LANG_COUNTRY_VAR_AVAILABLE) TextToSpeech.SUCCESS\n"
          "        else TextToSpeech.ERROR\n"
          "    }\n"
          "    override fun onStop() {\n"
          "        synchronized(chunkQueue) { chunkQueue.clear() }\n"
          "        EasyVoiceLogger.d(\"[SERVICE] onStop — enginePool.size=${enginePool.size}\")\n"
          "        var n = 0\n"
          "        while (n < enginePool.size) {\n"
          "            val wrapper = enginePool[n]\n"
          "            if (wrapper.state == 2 && wrapper.listenerSet && wrapper.tts?.isSpeaking == true) {\n"
          "                EasyVoiceLogger.d(\"[SERVICE] onStop — stopping ${wrapper.pkg}\"); EasyVoiceLogger.d(\"stop $utteranceIdStr\")\n"
          "                val ae = wrapper.tts; wrapper.stopExec.execute { try { ae?.stop() } catch (_: Exception) {} }\n"
          "            }\n"
          "            n++\n"
          "        }\n"
          "        synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "        synchronized(syncLock) { isFlushed = true; syncLock.notifyAll() }\n"
          "    }\n"
          "    // AutoTTS c3.z.g(CharSequence) — the locale_spans (AutoTtsService.Q) check lives INSIDE\n"
          "    private fun splitByLocaleSpans(input: CharSequence): MutableList<TextChunk> {\n"
          "        val result = mutableListOf<TextChunk>()\n"
          "        if (localeSpansFlag) {\n"
          "            val span = SpannableString(input)\n"
          "            val spans = span.getSpans(0, span.length - 1, LocaleSpan::class.java)\n"
          "            var prevEnd = 0\n"
          "            for (ls in spans) {\n"
          "                val start = span.getSpanStart(ls)\n"
          "                val end   = span.getSpanEnd(ls)\n"
          "                if (start > prevEnd) {\n"
          "                    result.add(TextChunk(span.subSequence(prevEnd, start).toString(), \"UNKNOWN\"))\n"
          "                }\n"
          "                result.add(TextChunk(span.subSequence(start, end).toString(), ls.locale?.language ?: \"UNKNOWN\"))\n"
          "                prevEnd = end + 1\n"
          "            }\n"
          "            if (prevEnd < span.length) {\n"
          "                result.add(TextChunk(span.subSequence(prevEnd, span.length).toString(), \"UNKNOWN\"))\n"
          "            }\n"
          "            return result\n"
          "        }\n"
          "        result.add(TextChunk(input.toString(), \"UNKNOWN\"))\n"
          "        return result\n"
          "    }\n"
          "    private fun detectLanguage(text: String, latFall: String, nonLatFall: String): String {\n"
          "        if (text.isEmpty()) return \"UNKNOWN\"\n"
          "        if (text.length == 1 && prefs.isQuickCharacterReading()) return \"UNKNOWN\"\n"
          "        run {\n"
          "            try {\n"
          "                initIsoMaps()\n"
          "                val detectOk = scannedLangsIso3.filter { !prefs.isLanguageDisabled(it) }.toTypedArray()\n"
          "                val enabledOk = enabledLangs.filter { !prefs.isLanguageDisabled(it) }.toTypedArray()\n"
          "                val out = NativeEngine.detectLanguageFull(text, latFall, nonLatFall, prefs.isDisableAdvancedDetection(), detectOk, enabledOk, prefs.isLoggingEnabled(), prefs.isUseCld3())\n"
          "                val sep = out.indexOf('\\u0001')\n"
          "                if (sep >= 0) {\n"
          "                    if (sep + 1 < out.length) for (line in out.substring(sep + 1).split('\\n')) if (line.isNotEmpty()) EasyVoiceLogger.d(line)\n"
          "                    return out.substring(0, sep)\n"
          "                }\n"
          "                return out\n"
          "            } catch (_: Throwable) {  }\n"
          "        }\n"
          "        val isDisableAdv = prefs.isDisableAdvancedDetection()\n"
          "        val textLen = text.length\n"
          "        var winStart = 0\n"
          "        while (winStart < textLen) {\n"
          "            val winEnd = winStart + 64\n"
          "            val window = text.substring(winStart, minOf(winEnd, textLen))\n"
          "            try {\n"
          "                val cldResult = cld2DetectWindow(window, latFall, nonLatFall, isDisableAdv)\n"
          "                if (cldResult != null && cldResult != \"UNKNOWN\") {\n"
          "                    if (isDisableAdv) {\n"
          "                        return cldResult\n"
          "                    }\n"
          "                    if (isEnabled(cldResult)) {\n"
          "                        return cldResult\n"
          "                    }\n"
          "                    val winCp = firstValidCodepoint(window)\n"
          "                    if (winCp != -1) {\n"
          "                        val primary = getScriptLangFiltered(winCp, enabledLangs)\n"
          "                        if (primary != null) {\n"
          "                            return primary\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            } catch (_: Exception) {\n"
          "            }\n"
          "            winStart = winEnd\n"
          "        }\n"
          "        if (isDisableAdv) {\n"
          "            return \"UNKNOWN\"\n"
          "        }\n"
          "        val firstCp = firstValidCodepoint(text)\n"
          "        if (firstCp == -1) {\n"
          "            return \"UNKNOWN\"\n"
          "        }\n"
          "        val primary = getScriptLangFiltered(firstCp, enabledLangs)\n"
          "        if (primary != null) {\n"
          "            return primary\n"
          "        }\n"
          "        return \"UNKNOWN\"\n"
          "    }\n"
          "    private fun cld2DetectWindow(window: String, latFall: String, nonLatFall: String, isDisableAdv: Boolean): String? {\n"
          "        EasyVoiceLogger.d(\"[CLD2] cld2DetectWindow windowLen=${window.length} latFall=$latFall nonLatFall=$nonLatFall isDisableAdv=$isDisableAdv snip='${window.take(30)}'\")\n"
          "        val bytes = window.toByteArray(Charsets.UTF_8)\n"
          "        val buf = ByteBuffer.allocateDirect(bytes.size)\n"
          "        buf.put(bytes); buf.position(0)\n"
          "        val out = NativeEngine.processDirect(\n"
          "            buf, bytes.size,\n"
          "            latFall, nonLatFall, \"auto\",\n"
          "            \"auto\", \"auto\", \"auto\",\n"
          "            latFall,\n"
          "            isDisableAdv, prefs.isUseCld3()\n"
          "        )\n"
          "        val parts = out.split(\"|\", limit = 2)\n"
          "        val result = if (parts.size == 2 && parts[0].isNotBlank()) parts[0] else null\n"
          "        EasyVoiceLogger.d(\"[CLD2] cld2DetectWindow rawOut='$out' → result=$result\")\n"
          "        return result\n"
          "    }\n"
          "    private fun firstValidCodepoint(text: String): Int {\n"
          "        var j = 0\n"
          "        while (j < text.length) {\n"
          "            val c = text[j]\n"
          "            if (!Character.isWhitespace(c) && (c < '0' || c > '9') && !isLatinPunct(c)) {\n"
          "                return text.codePointAt(j)\n"
          "            }\n"
          "            j++\n"
          "        }\n"
          "        return -1\n"
          "    }\n"
          "    private val scriptLangCache = ConcurrentHashMap<Int, String>(1024)\n"
          "    private fun getScriptLang(cp: Int): String? {\n"
          "        scriptLangCache[cp]?.let { EasyVoiceLogger.d(\"[SCRIPT] getScriptLang cp=U+${cp.toString(16)} → $it (cached)\"); return it.ifEmpty { null } }\n"
          "        val lang: String? = NativeEngine.scriptLang(cp).ifEmpty { null }\n"
          "        scriptLangCache[cp] = lang ?: \"\"\n"
          "        EasyVoiceLogger.d(\"[SCRIPT] getScriptLang cp=U+${cp.toString(16)} → $lang (computed)\")\n"
          "        return lang\n"
          "    }\n"
          "    private fun getForceEnabledLangs(mode: String, latFall: String, nonLatFall: String): Set<String> = when (mode) {\n"
          "        \"auto\", \"google\" -> setOf(latFall)\n"
          "        \"mix\"  -> setOf(latFall, nonLatFall)\n"
          "        \"dual\" -> setOf(latFall, nonLatFall)\n"
          "        else   -> emptySet()\n"
          "    }\n"
          "    private fun jStrHash(s: String): Int { var h = 0; for (c in s) h = h * 31 + c.code; return h }\n"
          "    private fun jSpread(h: Int): Int = h xor (h ushr 16)\n"
          "    private fun jTableSizeFor(c: Int): Int { if (c <= 1) return 1; var n = c - 1; n = n or (n shr 1); n = n or (n shr 2); n = n or (n shr 4); n = n or (n shr 8); n = n or (n shr 16); return n + 1 }\n"
          "    private fun jHashSetOrder(ins: List<String>, initCap: Int): List<String> {\n"
          "        var cap = 0; var threshold = if (initCap >= 0) jTableSizeFor(initCap) else 0; var size = 0\n"
          "        var buckets: Array<MutableList<String>>? = null\n"
          "        val keys = HashSet<String>()\n"
          "        fun resize() {\n"
          "            val nc: Int; val nt: Int\n"
          "            if (cap > 0) { nc = cap * 2; nt = threshold * 2 } else if (threshold > 0) { nc = threshold; nt = (nc * 0.75).toInt() } else { nc = 16; nt = 12 }\n"
          "            val nb = Array(nc) { mutableListOf<String>() }\n"
          "            buckets?.let { for (b in it) for (k in b) nb[jSpread(jStrHash(k)) and (nc - 1)].add(k) }\n"
          "            buckets = nb; cap = nc; threshold = nt\n"
          "        }\n"
          "        for (k in ins) {\n"
          "            if (!keys.add(k)) continue\n"
          "            if (buckets == null) resize()\n"
          "            buckets!![jSpread(jStrHash(k)) and (cap - 1)].add(k)\n"
          "            size++\n"
          "            if (size > threshold) resize()\n"
          "        }\n"
          "        val out = mutableListOf<String>()\n"
          "        buckets?.let { for (b in it) out.addAll(b) }\n"
          "        return out\n"
          "    }\n"
          "    private fun javaFamilyFallback(primary: String, fallbacks: List<String>, enabled: Set<String>): String? {\n"
          "        fun ok(s: String) = s in enabled && !prefs.isLanguageDisabled(s)\n"
          "        val full = mutableListOf(primary); full.addAll(fallbacks)\n"
          "        var initCap = (full.size / 0.75).toInt() + 1; if (initCap < 16) initCap = 16\n"
          "        val famOrder = jHashSetOrder(full, initCap)\n"
          "        val fi = famOrder.filter { ok(it) }\n"
          "        val r = jHashSetOrder(fi, -1)\n"
          "        return r.firstOrNull { ok(it) }\n"
          "    }\n"
          "    private fun getScriptLangFiltered(cp: Int, enabled: Set<String>): String? {\n"
          "        val primary = getScriptLang(cp)\n"
          "        if (primary == null) {\n"
          "            EasyVoiceLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} → null (no primary script)\")\n"
          "            return null\n"
          "        }\n"
          "        if (cp in 0x10000..0x1007F || cp in 0x10300..0x1034F || cp in 0x10400..0x1044F ||\n"
          "            cp in 0x10800..0x1083F || cp in 0x10A00..0x10A5F || cp in 0x12000..0x1247F ||\n"
          "            cp in 0x13000..0x1345F) {\n"
          "            EasyVoiceLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} → null (archaic script dropped in filtered path)\")\n"
          "            return null\n"
          "        }\n"
          "        if (primary in enabled && !prefs.isLanguageDisabled(primary)) {\n"
          "            EasyVoiceLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → $primary (in enabled, k.o ok)\")\n"
          "            return primary\n"
          "        }\n"
          "        val fallbacks = when {\n"
          "            primary == \"ru\" && (cp == 0x401 || cp == 0x451 || cp == 0x42D || cp == 0x44D || cp == 0x42B || cp == 0x44B) -> listOf(\"be\")\n"
          "            primary == \"ur\" && (cp == 0x0679 || cp == 0x0688 || cp == 0x0691 || cp == 0x06C1 || cp == 0x06D2) -> listOf(\"pa\")\n"
          "            primary == \"ja\" && ((cp in 0x3040..0x309F) || (cp in 0x1B000..0x1B12F)) -> emptyList()\n"
          "            primary == \"en\" && (cp in 0x10400..0x1044F) -> emptyList()\n"
          "            else -> getScriptLangFallbacks(primary)\n"
          "        }\n"
          "        val fbres = javaFamilyFallback(primary, fallbacks, enabled)\n"
          "        if (fbres != null) {\n"
          "            EasyVoiceLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → fallback=$fbres (k.o ok, java-order)\")\n"
          "            return fbres\n"
          "        }\n"
          "        EasyVoiceLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → null (no enabled fallback found)\")\n"
          "        return null\n"
          "    }\n"
          "    private fun getScriptLangFallbacks(primary: String): List<String> = NativeEngine.scriptLangFallbacks(primary).toList()\n"
          "    private fun isLatinPunct(c: Char): Boolean {\n"
          "        val v = c.code\n"
          "        return (v in 33..47) || (v in 58..64) || (v in 91..96) || (v in 123..126)\n"
          "    }\n"
          "    private fun isLatinPunct(cp: Int) = (cp in 33..47) || (cp in 58..64) || (cp in 91..96) || (cp in 123..126)\n"
          "    private fun initIsoMaps() {\n"
          "        if (isoToIso3.isNotEmpty()) return\n"
          "        for (iso in Locale.getISOLanguages()) {\n"
          "            try {\n"
          "                val iso3 = localeIso3(Locale(iso))\n"
          "                isoToIso3[iso] = iso3\n"
          "                iso3ToIso[iso3] = iso\n"
          "            } catch (_: Exception) {}\n"
          "        }\n"
          "        try {\n"
          "            val entries = isoToIso3.entries.toList()\n"
          "            NativeEngine.setIsoMap(entries.map { it.key }.toTypedArray(), entries.map { it.value }.toTypedArray())\n"
          "        } catch (_: Throwable) {}\n"
          "    }\n"
          "    private data class MLChunk(val lang: String, val latin: Boolean, val text: String)\n"
          "    private fun isLatinCommonInherited(cp: Int): Boolean {\n"
          "        val s = Character.UnicodeScript.of(cp)\n"
          "        return s == Character.UnicodeScript.LATIN || s == Character.UnicodeScript.COMMON || s == Character.UnicodeScript.INHERITED\n"
          "    }\n"
          "    private fun multilingualChunks(text: String): List<MLChunk> {\n"
          "        if (text.isEmpty()) return listOf(MLChunk(\"un\", false, \"\"))\n"
          "        if (prefs.isQuickCharacterReading() && text.length == 1) {\n"
          "            return listOf(MLChunk(\"un\", isLatinCommonInherited(text.codePointAt(0)), text))\n"
          "        }\n"
          "        val flat = try { NativeEngine.nativeGetLanguages(text) } catch (_: Throwable) { emptyArray<String>() }\n"
          "        val out = mutableListOf<MLChunk>()\n"
          "        var i = 0\n"
          "        while (i + 2 < flat.size) {\n"
          "            out.add(MLChunk(flat[i], flat[i + 1] == \"1\", flat[i + 2]))\n"
          "            i += 3\n"
          "        }\n"
          "        return out\n"
          "    }\n"
          "    private fun resolveMultilingualChunk(mc: MLChunk, latFall: String, nonLatFall: String): String {\n"
          "        val det = mc.lang\n"
          "        if (isKnownIso2(det) && isLangRoutable(det)) return det\n"
          "        return if (mc.latin) latFall else nonLatFall\n"
          "    }\n"
          "    private fun isEngineAvailable(lang: String): Boolean {\n"
          "        val lookupKey = if (lang.length == 3) iso3ToIso[lang] ?: lang else lang\n"
          "        val engine = prefs.getEngineForLanguage(lookupKey)\n"
          "        val result = engine != \"NOT_SET\" && engine != \"Disable\"\n"
          "        EasyVoiceLogger.d(\"[ENGINE] isEngineAvailable lang=$lang lookupKey=$lookupKey engine=$engine → $result\")\n"
          "        return result\n"
          "    }\n"
          "    private fun isLangRoutable(lang: String): Boolean = isEngineAvailable(lang) && !prefs.isLanguageDisabled(lang)\n"
          "    private fun isKnownIso2(code: String): Boolean = code.length == 2 && code in java.util.Locale.getISOLanguages()\n"
          "    private fun isLangRoutableRaw(lang: String): Boolean {\n"
          "        if (lang.isEmpty() || !prefs.getLanguageList().contains(lang)) return false\n"
          "        if (prefs.getBoolean(\"${lang}_disabled\", false)) return false\n"
          "        val rawEngine = prefs.getString(lang, \"\").split(\"#\", limit = 2).getOrElse(0) { \"\" }\n"
          "        return rawEngine.isNotEmpty() && rawEngine != \"Disable\"\n"
          "    }\n"
          "    private fun isEnabled(lang: String): Boolean = prefs.toIso3(lang) in scannedLangsIso3 && !prefs.isLanguageDisabled(lang)\n"
          "    private fun modeIntToLang(mode: Int, latFall: String, nonLatFall: String): String =\n"
          "        try { NativeEngine.modeLang(mode, latFall, nonLatFall) } catch (_: Throwable) {\n"
          "            when (mode) { 1 -> latFall; 2 -> nonLatFall; else -> \"auto\" }\n"
          "        }\n"
          "    private fun buildEngineList() {\n"
          "        synchronized(this) {\n"
          "            val newM = ArrayList<String>()\n"
          "            val isGoogleMode = prefs.getReadingMode() == \"google\"\n"
          "            val defaultEngine = if (isGoogleMode) \"com.google.android.tts\" else prefs.getEngineForLanguage(localeIso3())\n"
          "            var n = 0\n"
          "            while (true) {\n"
          "                val pkg = prefs.getString(\"engine_$n\", \"\")\n"
          "                if (pkg.isEmpty() || pkg == \"end\") break\n"
          "                if (pkg != defaultEngine) newM.add(pkg)\n"
          "                n++\n"
          "            }\n"
          "            if (defaultEngine.isNotEmpty() && defaultEngine != \"NOT_SET\" && defaultEngine != \"Disable\") {\n"
          "                newM.add(0, defaultEngine)\n"
          "            }\n"
          "            if (newM.isEmpty() && (try { packageManager.getPackageInfo(\"com.google.android.tts\", 0); true } catch (_: Exception) { false })) {\n"
          "                newM.add(\"com.google.android.tts\")\n"
          "            }\n"
          "            engineList = newM\n"
          "            EasyVoiceLogger.d(\"[SERVICE] buildEngineList (AutoTTS S()): engineList=$newM\")\n"
          "        }\n"
          "    }\n"
          "    private fun buildVoiceList() {\n"
          "        synchronized(this) {\n"
          "            if (!voiceList.isEmpty()) return\n"
          "            val sp = getApplicationContext().getSharedPreferences(\"easy_voice_settings\", 0)\n"
          "            var n = 0\n"
          "            while (true) {\n"
          "                val voice = sp.getString(\"voice_$n\", \"\") ?: \"\"\n"
          "                if (voice.isEmpty()) break\n"
          "                voiceList.add(voice)\n"
          "                n++\n"
          "            }\n"
          "            dedicatedEnginesFlag = sp.getBoolean(\"dedicated_engines\", false)\n"
          "        }\n"
          "    }\n"
          "    private fun eagerLoadPrefs() {\n"
          "        EasyVoiceLogger.d(\"[SERVICE] eagerLoadPrefs start\")\n"
          "        buildEngineList()\n"
          "        buildVoiceList()\n"
          "        prefs.getLanguageList().forEach { prefs.getEngineForLanguage(it) }\n"
          "        prefs.isDedicatedEnginesEnabled()\n"
          "        modeInt = when (prefs.getReadingMode()) { \"google\" -> 3; \"dual\" -> 1; \"mix\" -> 4; \"multilingual\" -> 5; else -> 0 }\n"
          "        val eLatLang = prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { localeIso3() }\n"
          "        val eNonLatLang = prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { localeIso3() }\n"
          "        prefs.getString(\"auto_mode_language\", \"\")\n"
          "        dualLang = prefs.getString(\"dual_mode_language\", \"\").ifEmpty { localeIso3() }\n"
          "        prefs.isShowNotification()\n"
          "        prefs.isDisableAdvancedDetection()\n"
          "        localeSpansFlag = prefs.isLocaleSpansEnabled()\n"
          "        stripAudioAttrFlag = prefs.isStripAudioAttr()\n"
          "        forceAccessibilityFlag = prefs.isForceAccessibilityStream()\n"
          "        numberModeInt = prefs.getNumberModeLang()\n"
          "        puncModeInt = prefs.getPuncModeLang()\n"
          "        emojiModeInt = prefs.getEmojiModeLang()\n"
          "        EasyVoiceLogger.d(\"[SERVICE] eagerLoadPrefs: N(localeSpans)=$localeSpansFlag P(stripAudioAttr)=$stripAudioAttrFlag Q(forceAccessibility)=$forceAccessibilityFlag\")\n"
          "        EasyVoiceLogger.d(\"[SERVICE] eagerLoadPrefs: E(numberMode)=$numberModeInt F(puncMode)=$puncModeInt emojiModeInt=$emojiModeInt\")\n"
          "        EasyVoiceLogger.d(\"[SERVICE] eagerLoadPrefs: readingMode=${prefs.getReadingMode()} dedEngines=${prefs.isDedicatedEnginesEnabled()} disableAdv=${prefs.isDisableAdvancedDetection()}\")\n"
          "        EasyVoiceLogger.d(\"[SERVICE] eagerLoadPrefs: latLang=$eLatLang nonLatLang=$eNonLatLang\")\n"
          "        EasyVoiceLogger.d(\"[SERVICE] eagerLoadPrefs complete (AutoTTS S/Y/initializingTts/R)\")\n"
          "    }\n"
          "    private fun localeIso3(locale: java.util.Locale = java.util.Locale.getDefault()): String {\n"
          "        return try {\n"
          "            val iso3 = locale.isO3Language\n"
          "            if (iso3 in listOf(\"cmn\", \"lzh\", \"gan\", \"hak\")) \"zho\" else iso3\n"
          "        } catch (_: Exception) { \"zxx\" }\n"
          "    }\n"
          "    private fun localeMatchesP(l1: java.util.Locale?, l2: java.util.Locale?): Boolean {\n"
          "        if (l1 == null || l2 == null) return false\n"
          "        return try {\n"
          "            if (l1.isO3Language != l2.isO3Language) return false\n"
          "            val country1 = l1.isO3Country\n"
          "            if (country1.isEmpty()) return true\n"
          "            if (country1 != l2.isO3Country) return false\n"
          "            val variant1 = l1.variant\n"
          "            if (variant1.isEmpty()) return true\n"
          "            variant1 == l2.variant\n"
          "        } catch (_: Exception) { false }\n"
          "    }\n"
          "    private fun normalizeLangCode(code: String): String {\n"
          "        if (code.length <= 2) return code\n"
          "        val folded = when (code.lowercase()) { \"cmn\", \"lzh\", \"gan\", \"hak\" -> \"zho\"; else -> code.lowercase() }\n"
          "        initIsoMaps()\n"
          "        return iso3ToIso[folded] ?: code\n"
          "    }\n"
          "    override fun onSynthesizeText(request: SynthesisRequest?, callback: SynthesisCallback?) {\n"
          "        if (prefs.isShowNotification()) {\n"
          "            startForegroundIfPossible()\n"
          "        } else if (isForegroundActive()) {\n"
          "            stopForegroundSafe()\n"
          "        }\n"
          "        synchronized(syncLock) { isStopped = false; syncLock.notifyAll() }\n"
          "        synchronized(syncLock) { isFlushed = false; syncLock.notifyAll() }\n"
          "        modeInt = when (prefs.getReadingMode()) { \"google\" -> 3; \"dual\" -> 1; \"mix\" -> 4; \"multilingual\" -> 5; else -> 0 }\n"
          "        dualLang = prefs.getString(\"dual_mode_language\", \"\").ifEmpty { localeIso3() }\n"
          "        localeSpansFlag = prefs.isLocaleSpansEnabled(); stripAudioAttrFlag = prefs.isStripAudioAttr(); forceAccessibilityFlag = prefs.isForceAccessibilityStream()\n"
          "        numberModeInt = prefs.getNumberModeLang(); puncModeInt = prefs.getPuncModeLang(); emojiModeInt = prefs.getEmojiModeLang()\n"
          "        dedicatedEnginesFlag = prefs.isDedicatedEnginesEnabled()\n"
          "        EasyVoiceLogger.d(\"[SERVICE] onSynthesizeText textLen=${request?.charSequenceText?.length ?: 0}\")\n"
          "        reqParams = request?.params\n"
          "        reqVolume = reqParams?.getFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, 0f) ?: 0f; if (reqVolume == 0f) reqVolume = 1.0f\n"
          "        val rawCharSeq = request?.charSequenceText ?: \"\"\n"
          "        utteranceIdStr = request?.params?.getString(\"utteranceId\") ?: \"\"\n"
          "        val rawText = rawCharSeq.toString()\n"
          "        reqRate = (request?.speechRate ?: 100) / 100.0f\n"
          "        reqPitch = (request?.pitch ?: 100) / 100.0f\n"
          "        if (rawText.trim().isEmpty()) {\n"
          "            synchronized(chunkQueue) { chunkQueue.clear() }\n"
          "            if (engineIndex >= 0 && engineIndex < enginePool.size) { val w0 = enginePool[engineIndex]; if (w0.state == 2 && w0.listenerSet && w0.tts?.isSpeaking == true) { try { w0.tts?.speak(\"\", TextToSpeech.QUEUE_FLUSH, null, null) } catch (_: Exception) {} } }\n"
          "            synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "            synchronized(syncLock) { isFlushed = true; syncLock.notifyAll() }\n"
          "            if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            if (callback?.hasFinished() == false) callback?.done()\n"
          "            return\n"
          "        }\n"
          "        val readingMode = prefs.getReadingMode()\n"
          "        val isForceAccessibility  = prefs.isForceAccessibilityStream()\n"
          "        val isStripAudioAttr      = prefs.isStripAudioAttr()\n"
          "        val latFall = when (readingMode) {\n"
          "            \"mix\", \"multilingual\"  -> normalizeLangCode(prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { java.util.Locale.getDefault().language })\n"
          "            \"dual\" -> \"en\"\n"
          "            else   -> prefs.getString(\"auto_mode_language\", \"\").ifEmpty { localeIso3() }\n"
          "        }\n"
          "        val nonLatFall = when (readingMode) {\n"
          "            \"mix\", \"multilingual\"  -> normalizeLangCode(prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { java.util.Locale.getDefault().language })\n"
          "            \"dual\" -> prefs.getString(\"dual_mode_language\", \"\").ifEmpty { localeIso3() }\n"
          "            else   -> prefs.getString(\"auto_mode_language\", \"\").ifEmpty { localeIso3() }\n"
          "        }\n"
          "        scannedLangsIso3 = prefs.getScannedLangs()\n"
          "        initIsoMaps()\n"
          "        val baseEnabled = scannedLangsIso3.mapNotNull { iso3ToIso[it] }.filter { !prefs.isLanguageDisabled(it) }.toHashSet()\n"
          "        val forceEnabled = getForceEnabledLangs(readingMode, latFall, nonLatFall)\n"
          "        for (fl in forceEnabled) {\n"
          "            if (prefs.toIso3(fl) in scannedLangsIso3 && prefs.isLanguageDisabled(fl)) {\n"
          "                prefs.setLanguageDisabled(fl, false)\n"
          "            }\n"
          "        }\n"
          "        enabledLangs = (baseEnabled + forceEnabled.filter { prefs.toIso3(it) in scannedLangsIso3 && !prefs.isLanguageDisabled(it) }).toHashSet()\n"
          "        val mixNumLang        = modeIntToLang(prefs.getNumberModeLang(), latFall, nonLatFall)\n"
          "        val mixPuncLang       = modeIntToLang(prefs.getPuncModeLang(), latFall, nonLatFall)\n"
          "        val mixEmojiLang      = \"auto\"\n"
          "        val chunks = mutableListOf<TextChunk>()\n"
          "        val trimmedText = rawText.trim()\n"
          "        val bypassPrefix = trimmedText.length >= 11 && trimmedText.startsWith(\"[EasyVoice:\")\n"
          "        var bypassed = false\n"
          "        if (bypassPrefix) {\n"
          "            val splitParts = trimmedText.split(\"]\")\n"
          "            if (splitParts.size == 2) {\n"
          "                var forcedEng: String? = null\n"
          "                var forcedLoc: String? = null\n"
          "                var forcedVariant: String? = null\n"
          "                val innerParts = splitParts[0].substring(1).split(\":\")\n"
          "                if (innerParts.size == 4) {\n"
          "                    forcedEng     = innerParts[1].takeIf { it.isNotBlank() }\n"
          "                    forcedLoc     = innerParts[2].takeIf { it.isNotBlank() }\n"
          "                    forcedVariant = innerParts[3].takeIf { it.isNotBlank() }\n"
          "                }\n"
          "                val stripped = splitParts[1]\n"
          "                val baseLang: String = run {\n"
          "                    val loc = forcedLoc\n"
          "                    if (loc == null || loc.isBlank()) normalizeLangCode((request?.language ?: \"\").ifBlank { latFall })\n"
          "                    else try {\n"
          "                        val p = loc.split(\"_\")\n"
          "                        val locale: Locale = when (p.size) {\n"
          "                            1 -> Locale(p[0])\n"
          "                            2 -> Locale(p[0], p[1])\n"
          "                            else -> if (p[2].isNotEmpty()) Locale(p[0], p[1], p[2]) else Locale(p[0], p[1])\n"
          "                        }\n"
          "                        val iso3 = locale.getISO3Language()\n"
          "                        when {\n"
          "                            iso3 == \"cmn\" || iso3 == \"lzh\" || iso3 == \"gan\" || iso3 == \"hak\" -> \"zho\"\n"
          "                            iso3.isEmpty() -> latFall\n"
          "                            else -> iso3\n"
          "                        }\n"
          "                    } catch (_: Exception) { latFall }\n"
          "                }\n"
          "                if (stripped.isNotEmpty()) {\n"
          "                    val chunk = TextChunk(stripped, baseLang, forcedEngine = forcedEng, forcedLocale = forcedLoc, forcedVariant = forcedVariant)\n"
          "                    chunks.add(chunk)\n"
          "                    EasyVoiceLogger.d(\"[SERVICE] [EasyVoice:] bypass eng=$forcedEng loc=$forcedLoc var=$forcedVariant\")\n"
          "                }\n"
          "                bypassed = true\n"
          "            }\n"
          "        }\n"
          "        val forceGoogle = readingMode == \"google\"\n"
          "        val reqLang0 = request?.language ?: \"\"\n"
          "        val effectiveMode = when {\n"
          "            forceGoogle -> \"auto\"\n"
          "            readingMode == \"none\" -> if (reqLang0.isEmpty() || reqLang0 == \"zxx\") \"auto\" else \"none\"\n"
          "            readingMode == \"auto\" || (reqLang0 == \"zxx\" && readingMode != \"dual\") -> \"auto\"\n"
          "            else -> readingMode\n"
          "        }\n"
          "        try {\n"
          "        if (!bypassed) when (effectiveMode) {\n"
          "            \"none\" -> {\n"
          "                val noneLang = normalizeLangCode(request?.language ?: latFall)\n"
          "                chunks.add(TextChunk(rawText, noneLang))\n"
          "                EasyVoiceLogger.d(\"[SERVICE] none mode — caller language=$noneLang (no detection)\")\n"
          "            }\n"
          "            \"mix\" -> {\n"
          "                // AutoTtsService O==4 \"Mixed mode\": M.clear(); z.g(text); per-span M()/F fallback else y.g(span)\n"
          "                val localeChunks = splitByLocaleSpans(rawCharSeq)\n"
          "                EasyVoiceLogger.d(\"[SERVICE] mix mode: z.g produced ${localeChunks.size} chunks\")\n"
          "                val neutralDefault = if (localeIso3() == prefs.toIso3(nonLatFall)) nonLatFall else latFall\n"
          "                val disableAdvDet = prefs.isDisableAdvancedDetection()\n"
          "                val autoModeC = normalizeLangCode(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { localeIso3() })\n"
          "                for (lc in localeChunks) {\n"
          "                    if (isFlushed) break\n"
          "                    if (!lc.lang.equals(\"unknown\", ignoreCase = true) && lc.lang != \"\") {\n"
          "                        val resolved = if (isLangRoutableRaw(lc.lang)) lc.lang else autoModeC\n"
          "                        chunks.add(TextChunk(lc.text, resolved))\n"
          "                    } else {\n"
          "                        val tBytes = lc.text.toByteArray(Charsets.UTF_8)\n"
          "                        val tBuf = ByteBuffer.allocateDirect(tBytes.size)\n"
          "                        tBuf.put(tBytes); tBuf.position(0)\n"
          "                        val tOut = NativeEngine.processDirect(\n"
          "                            tBuf, tBytes.size,\n"
          "                            latFall, nonLatFall, \"mix\",\n"
          "                            mixPuncLang, mixNumLang, mixEmojiLang,\n"
          "                            neutralDefault, disableAdvDet, prefs.isUseCld3()\n"
          "                        )\n"
          "                        for (chunkStr in tOut.split(\"||\").filter { it.isNotBlank() }) {\n"
          "                            val parts = chunkStr.split(\"|\", limit = 2)\n"
          "                            if (parts.size == 2 && parts[0].isNotBlank()) {\n"
          "                                val typeFb = normalizeLangCode(parts[0])\n"
          "                                chunks.add(TextChunk(parts[1], typeFb, mixPendingDetect = true, mixTypeFallback = typeFb))\n"
          "                            }\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            \"multilingual\" -> {\n"
          "                // AutoTtsService O==5 \"Multilingual mode\": M.clear(); z.g(text); routable span kept as-is else clsCLD2.c(span)\n"
          "                val localeChunks = splitByLocaleSpans(rawCharSeq)\n"
          "                EasyVoiceLogger.d(\"[SERVICE] multilingual mode: z.g produced ${localeChunks.size} chunks\")\n"
          "                for (lc in localeChunks) {\n"
          "                    if (isFlushed) break\n"
          "                    if (!lc.lang.equals(\"unknown\", ignoreCase = true) && lc.lang.isNotEmpty() && isLangRoutableRaw(lc.lang)) {\n"
          "                        chunks.add(TextChunk(lc.text, lc.lang))\n"
          "                    } else {\n"
          "                        for (mc in multilingualChunks(lc.text)) {\n"
          "                            chunks.add(TextChunk(mc.text, resolveMultilingualChunk(mc, latFall, nonLatFall)))\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            \"dual\" -> {\n"
          "                run {\n"
          "                    EasyVoiceLogger.d(\"[SERVICE] dual mode: lat=$latFall nonLat=$nonLatFall punc=$mixPuncLang num=$mixNumLang\")\n"
          "                    val tBytes = trimmedText.toByteArray(Charsets.UTF_8)\n"
          "                    val tBuf = ByteBuffer.allocateDirect(tBytes.size)\n"
          "                    tBuf.put(tBytes); tBuf.position(0)\n"
          "                    val neutralDefault = if (localeIso3() == prefs.toIso3(nonLatFall)) nonLatFall else latFall\n"
          "                    val disableAdvDet = prefs.isDisableAdvancedDetection()\n"
          "                    val tOut = NativeEngine.processDirect(\n"
          "                        tBuf, tBytes.size,\n"
          "                        latFall, nonLatFall, \"dual\",\n"
          "                        mixPuncLang, mixNumLang, mixEmojiLang,\n"
          "                        neutralDefault, disableAdvDet, prefs.isUseCld3()\n"
          "                    )\n"
          "                    for (chunkStr in tOut.split(\"||\").filter { it.isNotBlank() }) {\n"
          "                        val parts = chunkStr.split(\"|\", limit = 2)\n"
          "                        if (parts.size == 2 && parts[0].isNotBlank()) {\n"
          "                            val resolved = normalizeLangCode(parts[0])\n"
          "                            chunks.add(TextChunk(parts[1], resolved, typeCode = if (resolved == normalizeLangCode(latFall)) 1 else 2))\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            else -> {\n"
          "                // AutoTtsService O==2/3 \"Auto mode || Google mode\": M.clear(); M.addAll(z.g(text)); per-span clsCLD2.b when unknown\n"
          "                val autoModeC = normalizeLangCode(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { localeIso3() })\n"
          "                val localeChunks = splitByLocaleSpans(rawCharSeq)\n"
          "                EasyVoiceLogger.d(\"[SERVICE] auto mode: z.g produced ${localeChunks.size} chunks\")\n"
          "                for (lc in localeChunks) {\n"
          "                    if (isFlushed) break\n"
          "                    val detected = if (lc.lang.equals(\"unknown\", ignoreCase = true)) { val d0 = detectLanguage(lc.text, latFall, nonLatFall); if (d0.length > 2) d0.substring(0, 2) else d0 } else lc.lang\n"
          "                    val resolved = if (isKnownIso2(detected) && (forceGoogle || isLangRoutable(detected))) detected else autoModeC\n"
          "                    EasyVoiceLogger.d(\"[SERVICE] auto mode: detected=$detected resolved=$resolved autoModeC=$autoModeC\")\n"
          "                    chunks.add(TextChunk(lc.text, resolved))\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "        } catch (e: Exception) {\n"
          "            EasyVoiceLogger.e(\"[SERVICE] Synthesis ended with error: ${e.message}\")\n"
          "            if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            if (callback?.hasFinished() == false) callback?.done()\n"
          "            return\n"
          "        }\n"
          "        if (forceGoogle && !bypassed) { chunks.forEach { it.forcedEngine = \"com.google.android.tts\" } }\n"
          "        EasyVoiceLogger.d(\"[SERVICE] mode=$readingMode produced ${chunks.size} chunks\")\n"
          "        if (chunks.isEmpty()) {\n"
          "            if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            if (callback?.hasFinished() == false) callback?.done()\n"
          "            return\n"
          "        }\n"
          "        fun resolveMixChunk(chunk: TextChunk) {\n"
          "            if (!chunk.mixPendingDetect) return\n"
          "            val d0 = detectLanguage(chunk.text, latFall, nonLatFall)\n"
          "            val det = if (d0.length > 2) d0.substring(0, 2) else d0\n"
          "            chunk.lang = if (isKnownIso2(det) && isLangRoutable(det)) det else chunk.mixTypeFallback\n"
          "            chunk.mixPendingDetect = false\n"
          "        }\n"
          "        resolveMixChunk(chunks[0])\n"
          "        val firstChunkForced = bypassed && (chunks[0].forcedEngine != null || chunks[0].forcedLocale != null)\n"
          "        val firstLangLoad = if (firstChunkForced) TextToSpeech.LANG_AVAILABLE else onLoadLanguage(prefs.toIso3(chunks[0].lang), \"\", \"\")\n"
          "        EasyVoiceLogger.d(\"[SERVICE] first-chunk lang='${chunks[0].lang}' loadResult=$firstLangLoad forced=$firstChunkForced\")\n"
          "        if (firstLangLoad == TextToSpeech.LANG_NOT_SUPPORTED || firstLangLoad == TextToSpeech.LANG_MISSING_DATA) {\n"
          "            EasyVoiceLogger.d(\"[SERVICE] first-chunk lang '${chunks[0].lang}' not supported — aborting (AutoTTS F(cb,2))\")\n"
          "            if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            if (callback?.hasFinished() == false) callback?.done()\n"
          "            return\n"
          "        }\n"
          "        val sysRate  = reqRate\n"
          "        val sysPitch = reqPitch\n"
          "        val totalChunks = chunks.size\n"
          "        synchronized(chunkQueue) {\n"
          "            chunkQueue.clear()\n"
          "            chunkQueue.addAll(chunks.mapIndexed { i, c -> (i + 1) to c })\n"
          "        }\n"
          "        fun speakChunk() {\n"
          "            if (isStopped || isFlushed) return\n"
          "            val pair = synchronized(chunkQueue) { if (chunkQueue.isEmpty()) null else chunkQueue.removeAt(0) }\n"
          "            if (pair == null) {\n"
          "                if (prefs.isKeepAliveMode()) return\n"
          "                if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                if (callback?.hasFinished() == false) callback?.done()\n"
          "                synchronized(syncLock) { isFlushed = true; syncLock.notifyAll() }\n"
          "                return\n"
          "            }\n"
          "            val (currentChunk, chunk) = pair\n"
          "            val effectiveLang = when (chunk.typeCode) {\n"
          "                1 -> \"eng\"\n"
          "                2 -> prefs.toIso3(prefs.getString(\"dual_mode_language\", \"\").ifEmpty { localeIso3() })\n"
          "                else -> prefs.toIso3(chunk.lang)\n"
          "            }\n"
          "            val chunkText = chunk.text\n"
          "            val preferredPkg = chunk.forcedEngine ?: prefs.getEngineForLanguage(effectiveLang)\n"
          "            if (bypassed) {\n"
          "                val effPkg = if (preferredPkg == \"NOT_SET\") { if (engineIndex in 0 until enginePool.size) enginePool[engineIndex].pkg else \"NOT_SET\" } else preferredPkg\n"
          "                val savedLocTag = chunk.forcedLocale ?: prefs.getLocaleForLangPkg(effectiveLang, effPkg).ifEmpty { Locale.forLanguageTag(effectiveLang).toLanguageTag() }\n"
          "                val chunkLocale = parseVoiceNameAsLocale(savedLocTag) ?: Locale.forLanguageTag(effectiveLang)\n"
          "                loadVoice(effPkg, chunkLocale, chunk.forcedVariant ?: \"\", false)\n"
          "            }\n"
          "            if (engineIndex < 0 || engineIndex >= enginePool.size) {\n"
          "                EasyVoiceLogger.e(\"[CHUNK-$currentChunk] mTTSIndex out of range engineIndex=$engineIndex\")\n"
          "                val wantedEngine = chunk.forcedEngine ?: prefs.getEngineForLanguage(effectiveLang)\n"
          "                if (wantedEngine.isNotEmpty() && wantedEngine != \"NOT_SET\" && wantedEngine != \"Disable\") {\n"
          "                    val normWanted = wantedEngine.replace(\"-\", \"\").replace(\"_\", \"\")\n"
          "                    val pooled = enginePool.any { it.pkg == normWanted }\n"
          "                    if (!pooled && engineList.contains(wantedEngine)) {\n"
          "                        EasyVoiceLogger.d(\"[CHUNK-$currentChunk] pool missing $wantedEngine but engineList has it — reinit (AutoTTS N())\")\n"
          "                        initAllTTS()\n"
          "                    }\n"
          "                }\n"
          "                if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                if (callback?.hasFinished() == false) callback?.done()\n"
          "                synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                return\n"
          "            }\n"
          "            val wrapper = enginePool[engineIndex]\n"
          "            val tts = wrapper.tts ?: run {\n"
          "                EasyVoiceLogger.e(\"[CHUNK-$currentChunk] engine tts is null — ending (AutoTTS K(cb,10))\")\n"
          "                if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                if (callback?.hasFinished() == false) callback?.done()\n"
          "                synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                return\n"
          "            }\n"
          "            val pkg = preferredPkg\n"
          "            val appRate   = prefs.getInt(\"${effectiveLang}_speed\",  100) / 100.0f\n"
          "            val appPitch  = prefs.getInt(\"${effectiveLang}_pitch\", 100) / 100.0f\n"
          "            val appVolume = prefs.getInt(\"${effectiveLang}_volume\", 100) / 100.0f\n"
          "            val finalRate   = sysRate  * appRate\n"
          "            val finalPitch  = sysPitch * appPitch\n"
          "            val finalVolume = reqVolume * appVolume\n"
          "            tts.setSpeechRate(finalRate); tts.setPitch(finalPitch)\n"
          "            if (currentChunk == 1) chunkCounter = 1\n"
          "            val expectedId = \"${utteranceIdStr}_${chunkCounter}\"\n"
          "            var synthStartTime = 0L\n"
          "            val chunkHandler = android.os.Handler(android.os.Looper.getMainLooper())\n"
          "            tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {\n"
          "                override fun onStart(id: String) {\n"
          "                    if (callback?.hasStarted() == false) { callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1) }\n"
          "                    synthStartTime = System.currentTimeMillis()\n"
          "                }\n"
          "                override fun onDone(id: String) {\n"
          "                    val next = synchronized(chunkQueue) { chunkQueue.firstOrNull()?.second }\n"
          "                    if (next == null) { speakChunk(); return }\n"
          "                    chunkHandler.post {\n"
          "                        chunkCounter++\n"
          "                        resolveMixChunk(next)\n"
          "                        val loadRes = onLoadLanguage(prefs.toIso3(next.lang), \"\", \"\")\n"
          "                        if (loadRes == TextToSpeech.LANG_NOT_SUPPORTED || loadRes == TextToSpeech.LANG_MISSING_DATA) {\n"
          "                            synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                            if (callback?.hasStarted() == true && callback?.hasFinished() == false) callback?.done()\n"
          "                        } else {\n"
          "                            speakChunk()\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "                override fun onError(id: String) {\n"
          "                    synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                    if (callback?.hasStarted() == true && callback?.hasFinished() == false) { callback?.done() }\n"
          "                }\n"
          "                override fun onError(id: String, errorCode: Int) {\n"
          "                    synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                    if (callback?.hasStarted() == true && callback?.hasFinished() == false) { callback?.done() }\n"
          "                }\n"
          "                override fun onStop(id: String, interrupted: Boolean) { EasyVoiceLogger.d(id) }\n"
          "            })\n"
          "            val params = android.os.Bundle(reqParams ?: android.os.Bundle())\n"
          "            params.remove(\"pitch\"); params.remove(\"rate\")\n"
          "            params.remove(\"language\"); params.remove(\"country\")\n"
          "            params.remove(\"variant\"); params.remove(\"voiceName\"); params.remove(\"utteranceId\")\n"
          "            if (isStripAudioAttr) { params.remove(\"streamType\"); params.remove(\"audioAttributes\") }\n"
          "            if (finalVolume != 0f) { params.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, finalVolume) }\n"
          "            if (isStopped || isFlushed) return\n"
          "            wrapper.listenerSet = true\n"
          "            if (isForceAccessibility && !wrapper.audioAttrSet) {\n"
          "                try { tts.setAudioAttributes(android.media.AudioAttributes.Builder().setUsage(11).setContentType(1).build()); wrapper.audioAttrSet = true } catch (_: Exception) {}\n"
          "            }\n"
          "            EasyVoiceLogger.d(\"[SPEAK] id=$expectedId lang=$effectiveLang pkg=$pkg len=${chunkText.length} text='${chunkText}'\")\n"
          "            val speakRunnable = Runnable {\n"
          "                try {\n"
          "                    val speakResult = tts.speak(chunkText, TextToSpeech.QUEUE_FLUSH, params, expectedId)\n"
          "                    if (speakResult != 0) {\n"
          "                        EasyVoiceLogger.e(\"[CHUNK-$currentChunk] Speaking failed!!!\")\n"
          "                        if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                        if (callback?.hasFinished() == false) callback?.done()\n"
          "                        synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                    }\n"
          "                } catch (e: Exception) {\n"
          "                    EasyVoiceLogger.e(\"[CHUNK-$currentChunk] onSynthesis Error: ${e.message}\")\n"
          "                    if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                    if (callback?.hasFinished() == false) callback?.done()\n"
          "                    synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                }\n"
          "            }\n"
          "            android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(speakRunnable, 50L)\n"
          "        }\n"
          "        speakChunk()\n"
          "        if (prefs.isKeepAliveMode()) {\n"
          "            callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            val silenceBuf = ByteArray(32)\n"
          "            val maxBuf = callback?.maxBufferSize ?: silenceBuf.size\n"
          "            keepAlive@ while (!isStopped) {\n"
          "                var off = 0\n"
          "                while (off < silenceBuf.size && !isStopped) {\n"
          "                    val n = kotlin.math.min(maxBuf, silenceBuf.size - off)\n"
          "                    if (callback?.audioAvailable(silenceBuf, off, n) != TextToSpeech.SUCCESS) break@keepAlive\n"
          "                    off += n\n"
          "                }\n"
          "                var kaInterrupted = false\n"
          "                synchronized(syncLock) { try { syncLock.wait(100) } catch (e: InterruptedException) { kaInterrupted = true } }\n"
          "                if (kaInterrupted) break@keepAlive\n"
          "            }\n"
          "        } else {\n"
          "            synchronized(syncLock) {\n"
          "                while (!isStopped && !isFlushed) {\n"
          "                    try { syncLock.wait() } catch (e: InterruptedException) { continue }\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "        EasyVoiceLogger.d(\"onSynthesizeText ended\")\n"
          "        if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "        if (callback?.hasFinished() == false) callback?.done()\n"
          "    }\n"
          "    override fun onDestroy() {\n"
          "        EasyVoiceLogger.d(\"onDestroy\")\n"
          "        try {\n"
          "            stopForegroundSafe()\n"
          "            abandonAudioFocus()\n"
          "            unbindAllEngineKeepAlive()\n"
          "        } catch (e: Exception) { EasyVoiceLogger.e(\"[SERVICE] onDestroy cleanup failed: ${e.message}\") }\n"
          "        for (n in 0 until enginePool.size) { if (enginePool[n].state == 2) { val w0 = enginePool[n]; val ae = w0.tts; try { w0.stopExec.execute { try { ae?.shutdown() } catch (_: Exception) {} } } catch (_: Exception) { try { ae?.shutdown() } catch (_: Exception) {} } } }\n"
          "        super.onDestroy()\n"
          "    }\n"
          "    companion object {\n"
          "        @JvmField val chunkQueue: ArrayList<Pair<Int, TextChunk>> = ArrayList()\n"
          "        @Volatile @JvmField var engineList: ArrayList<String> = ArrayList()\n"
          "        @Volatile @JvmField var voiceList: ArrayList<String> = ArrayList()\n"
          "        @JvmField var dedicatedEnginesFlag = false\n"
          "        @JvmField var lastLoadVoiceName = \"\"\n"
          "        @JvmField var chunkCounter = 0\n"
          "        @Volatile @JvmField var utteranceIdStr = \"\"\n"
          "        @JvmField var initializingTts: TextToSpeech? = null\n"
          "        @Volatile @JvmField var localeSpansFlag = false\n"
          "        @Volatile @JvmField var stripAudioAttrFlag = false\n"
          "        @Volatile @JvmField var forceAccessibilityFlag = false\n"
          "        @JvmField var numberModeInt = 0\n"
          "        @JvmField var puncModeInt = 0\n"
          "        @JvmField var emojiModeInt = 0\n"
          "    }\n"
          "}\n")


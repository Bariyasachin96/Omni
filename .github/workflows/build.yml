          "        radioGroup.addView(radio, RadioGroup.LayoutParams(RadioGroup.LayoutParams.WRAP_CONTENT, RadioGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = d5 })\n"
          "        // <TextView gravity=start fill_parent TextAppearance.Small> — no indent in the XML\n"
          "        val desc = android.widget.TextView(context).apply {\n"
          "            text = description\n"
          "            gravity = android.view.Gravity.START\n"
          "            setTextAppearance(android.R.style.TextAppearance_Small)\n"
          "        }\n"
          "        radioGroup.addView(desc, RadioGroup.LayoutParams(RadioGroup.LayoutParams.MATCH_PARENT, RadioGroup.LayoutParams.WRAP_CONTENT))\n"
          "        // The Google radio and its description carry android:visibility=\"gone\" in the layout;\n"

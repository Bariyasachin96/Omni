          "                try { initializingTts = TextToSpeech(applicationContext, OnInitListenerImpl(), engineList[initIndex]); break } catch (_: Exception) { EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Error when initializing \" + engineList[initIndex]); initIndex++ }\n"
          "            }\n"

          "            cp in 0x1680..0x169F -> \"ga\"\n"
          "            // ── Tagalog ────────────────────────────────────────────────────────────────\n"
          "            cp in 0x1700..0x171F -> \"tl\"\n"
          "            // ── Khmer (+ Symbols 19E0) ─────────────────────────────────────────────────\n"
          "            cp in 0x1780..0x17FF || cp in 0x19E0..0x19FF -> \"km\"\n"
          "            // ── Mongolian (main 1800 + Supplement 11660) ──────────────────────────────\n"
          "            cp in 0x1800..0x18AF || cp in 0x11660..0x1167F -> \"mn\"\n"

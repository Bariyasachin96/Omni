name: Build Easy Voice Native
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the APK as a GitHub Release asset (release assets do NOT count against the Actions artifact-storage quota)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          # sdkmanager occasionally gets a corrupt NDK zip on GitHub runners
          # ("Error on ZipFile unknown archive" → exit 1). Retry with a clean
          # re-download so a flaky mirror doesn't fail the whole build.
          install_pkgs() {
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "ndk;25.1.8937393" "cmake;3.22.1" --sdk_root=$ANDROID_HOME
          }
          n=0
          until [ $n -ge 5 ]; do
            if install_pkgs && [ -d "$ANDROID_HOME/ndk/25.1.8937393" ]; then
              echo "NDK + CMake installed successfully."; break
            fi
            n=$((n+1))
            echo "::warning::NDK/CMake install attempt $n failed (likely corrupt download) — clearing caches and retrying..."
            rm -rf "$ANDROID_HOME/ndk/25.1.8937393" 2>/dev/null || true
            rm -rf "$HOME/.android/cache" "$HOME/.cache/Google/AndroidStudio"*/ 2>/dev/null || true
            sleep $((n * 5))
          done
          if [ ! -d "$ANDROID_HOME/ndk/25.1.8937393" ]; then
            echo "::error::NDK install failed after $n retries."; exit 1
          fi

      - name: Clone CLD2 + CLD3 Native Libraries
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 https://github.com/CLD2Owners/cld2.git app/src/main/cpp/cld2_src
          # CLD3 (optional NN detector — Advanced-tab "Use CLD3" option; CLD2 stays default) + its
          # protobuf-lite runtime, pinned to the runner's protoc so the generated pb sources match.
          git clone --depth 1 https://github.com/google/cld3.git app/src/main/cpp/cld3_src
          git clone --depth 1 -b v3.21.12 https://github.com/protocolbuffers/protobuf.git app/src/main/cpp/protobuf_src
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          protoc --version
          mkdir -p app/src/main/cpp/cld3_gen/cld_3/protos
          protoc -Iapp/src/main/cpp/cld3_src/src --cpp_out=app/src/main/cpp/cld3_gen/cld_3/protos app/src/main/cpp/cld3_src/src/*.proto
          ls app/src/main/cpp/cld3_gen/cld_3/protos

      - name: Generate Complete Project
        run: |
          python3 << 'PYEOF'
          import os, textwrap

          def w(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # ── gradle.properties ────────────────────────────────────────────────
          w("gradle.properties", "android.useAndroidX=true\n"
            "android.enableJetifier=true\n"
            "org.gradle.jvmargs=-Xmx3096m -Dfile.encoding=UTF-8\n"
            "org.gradle.daemon=false\n"
            "android.enableR8.fullMode=true\n")

          # ── settings.gradle.kts ──────────────────────────────────────────────
          w("settings.gradle.kts", """\
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EasyVoice"
          include(":app")
          """)

          # ── build.gradle.kts (root) ──────────────────────────────────────────
          w("build.gradle.kts", """\
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          """)

          # ── app/build.gradle.kts ─────────────────────────────────────────────
          w("app/build.gradle.kts", """\
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.tts.easyvoice"
              compileSdk = 34
              ndkVersion = "25.1.8937393"
              defaultConfig {
                  applicationId = "com.tts.easyvoice"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "16.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += listOf("-std=c++17", "-Wno-narrowing", "-Os", "-g0", "-fvisibility=hidden", "-ffunction-sections", "-fdata-sections")
                          arguments += listOf("-DANDROID_STL=c++_static")
                      }
                  }
                  ndk { abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a")) }
              }
              sourceSets { getByName("main") { java.srcDirs("src/main/java") } }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("easyvoice-release.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "sachin1211"
                      keyAlias = System.getenv("KEY_ALIAS") ?: "sachin"
                      keyPassword = System.getenv("KEY_PASSWORD") ?: "sachin1211"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug { isMinifyEnabled = false }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources { excludes.add("**/libc++_shared.so") } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("androidx.viewpager2:viewpager2:1.1.0")
              implementation("com.google.android.material:material:1.11.0")
              // Declared explicitly so the app bar can name the very style
              // new_settings_activity.xml names — @style/TextAppearance.Widget.AppCompat.Toolbar.Title
              // lives in appcompat. Material 1.11.0 already pulls in appcompat 1.6.1, so this
              // pins nothing new at runtime; it only puts appcompat's R on the compile path.
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          """)

          # ── obfuscation dictionary: R8 draws renamed identifiers from here, so the
          #     decompiled output is a wall of near-identical l/I/O names (hard to read/mod).
          w("app/proguard-dict.txt", """\
          l
          I
          O
          ll
          lI
          Il
          II
          lO
          Ol
          OO
          lll
          llI
          lIl
          lII
          Ill
          IlI
          IIl
          III
          llO
          lOl
          Oll
          OOl
          OlO
          lOO
          OOO
          OII
          IOI
          OIO
          llll
          IIII
          OOOO
          lIlI
          IlIl
          OlOl
          lOlO
          IOOI
          OIIO
          llII
          IIll
          OOII
          """)

          # ── proguard-rules.pro ───────────────────────────────────────────────
          w("app/proguard-rules.pro", """\
          # ── Anti-reverse-engineering hardening ──────────────────────────────
          -optimizationpasses 5
          -allowaccessmodification
          # Collapse every class into the root package (single flat namespace).
          -repackageclasses ''
          # Draw all renamed classes/members/packages from the ambiguous dictionary.
          -obfuscationdictionary proguard-dict.txt
          -classobfuscationdictionary proguard-dict.txt
          -packageobfuscationdictionary proguard-dict.txt
          # Drop source-file names + line numbers from stack traces (no code map leak).
          # (Log calls are kept — EasyVoiceLogger's file log is used for debugging.)
          -renamesourcefileattribute ''
          -keepattributes !SourceFile,!LineNumberTable
          # ── Required keeps ──────────────────────────────────────────────────
          -keep class com.tts.easyvoice.NativeEngine { native <methods>; }
          -keepclassmembers class kotlinx.coroutines.** { volatile <fields>; }
          -dontwarn kotlinx.coroutines.**
          -dontwarn javax.annotation.**
          -dontwarn javax.naming.**
          -dontwarn org.checkerframework.**
          -dontwarn com.google.auto.value.**
          -dontwarn com.google.errorprone.annotations.**
          """)

          # ── CMakeLists.txt ───────────────────────────────────────────────────
          w("app/src/main/cpp/CMakeLists.txt", """\
          cmake_minimum_required(VERSION 3.18.1)
          project("easyvoice_native")
          set(CLD2_DIR ${CMAKE_CURRENT_SOURCE_DIR}/cld2_src/internal)
          # ── CLD3 (optional NN detector) + protobuf-lite, compiled ALONGSIDE CLD2 ──
          set(CLD3_DIR ${CMAKE_CURRENT_SOURCE_DIR}/cld3_src/src)
          set(CLD3_GEN ${CMAKE_CURRENT_SOURCE_DIR}/cld3_gen)
          set(protobuf_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(protobuf_BUILD_PROTOC_BINARIES OFF CACHE BOOL "" FORCE)
          set(protobuf_INSTALL OFF CACHE BOOL "" FORCE)
          set(protobuf_WITH_ZLIB OFF CACHE BOOL "" FORCE)
          # ONE .so ONLY: build protobuf-lite (and CLD3) as STATIC archives that link INTO
          # libeasyvoice_core.so — never a separate libprotobuf-lite.so in the APK. easyvoice_core
          # is declared SHARED explicitly below, so it stays the one and only shared library.
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(protobuf_BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          add_subdirectory(${CMAKE_CURRENT_SOURCE_DIR}/protobuf_src/cmake protobuf_build)
          file(GLOB CLD3_SCRIPT_SPAN ${CLD3_DIR}/script_span/*.cc)
          list(FILTER CLD3_SCRIPT_SPAN EXCLUDE REGEX "test")
          add_library(easyvoice_core SHARED
              tts_engine_core.cpp
              ${CLD2_DIR}/cldutil.cc
              ${CLD2_DIR}/cldutil_shared.cc
              ${CLD2_DIR}/compact_lang_det.cc
              ${CLD2_DIR}/compact_lang_det_hint_code.cc
              ${CLD2_DIR}/compact_lang_det_impl.cc
              ${CLD2_DIR}/debug.cc
              ${CLD2_DIR}/fixunicodevalue.cc
              ${CLD2_DIR}/generated_entities.cc
              ${CLD2_DIR}/generated_language.cc
              ${CLD2_DIR}/generated_ulscript.cc
              ${CLD2_DIR}/getonescriptspan.cc
              ${CLD2_DIR}/lang_script.cc
              ${CLD2_DIR}/offsetmap.cc
              ${CLD2_DIR}/scoreonescriptspan.cc
              ${CLD2_DIR}/tote.cc
              ${CLD2_DIR}/utf8statetable.cc
              ${CLD2_DIR}/cld_generated_cjk_uni_prop_80.cc
              ${CLD2_DIR}/cld2_generated_cjk_compatible.cc
              ${CLD2_DIR}/cld_generated_cjk_delta_bi_4.cc
              ${CLD2_DIR}/generated_distinct_bi_0.cc
              ${CLD2_DIR}/cld2_generated_quadchrome_16.cc
              ${CLD2_DIR}/cld2_generated_deltaoctachrome.cc
              ${CLD2_DIR}/cld2_generated_distinctoctachrome.cc
              ${CLD2_DIR}/cld_generated_score_quad_octa_2.cc
              ${CLD3_GEN}/cld_3/protos/feature_extractor.pb.cc
              ${CLD3_GEN}/cld_3/protos/sentence.pb.cc
              ${CLD3_GEN}/cld_3/protos/task_spec.pb.cc
              ${CLD3_DIR}/base.cc
              ${CLD3_DIR}/embedding_feature_extractor.cc
              ${CLD3_DIR}/embedding_network.cc
              ${CLD3_DIR}/feature_extractor.cc
              ${CLD3_DIR}/feature_types.cc
              ${CLD3_DIR}/fml_parser.cc
              ${CLD3_DIR}/language_identifier_features.cc
              ${CLD3_DIR}/lang_id_nn_params.cc
              ${CLD3_DIR}/nnet_language_identifier.cc
              ${CLD3_DIR}/registry.cc
              ${CLD3_DIR}/relevant_script_feature.cc
              ${CLD3_DIR}/sentence_features.cc
              ${CLD3_DIR}/task_context.cc
              ${CLD3_DIR}/task_context_params.cc
              ${CLD3_DIR}/unicodetext.cc
              ${CLD3_DIR}/utils.cc
              ${CLD3_DIR}/workspace.cc
              ${CLD3_SCRIPT_SPAN}
          )
          target_include_directories(easyvoice_core PRIVATE ${CLD2_DIR}/../public ${CLD2_DIR} ${CLD3_DIR} ${CLD3_GEN})
          find_library(log-lib log)
          target_link_libraries(easyvoice_core libprotobuf-lite ${log-lib})
          # Strip unused code/data (pairs with -ffunction-sections/-fdata-sections) → smaller .so
          target_link_options(easyvoice_core PRIVATE "-Wl,--gc-sections")
          """)

          # ── tts_engine_core.cpp ──────────────────────────────────────────────
          w("app/src/main/cpp/tts_engine_core.cpp", r"""
          #include <jni.h>
          #include <string>
          #include <cstring>
          #include <cstdio>
          #include <vector>
          #include <unordered_map>
          #include <unordered_set>
          #include <stdint.h>
          #include <mutex>
          #include "compact_lang_det.h"
          #include "encodings.h"
          #include "compact_lang_det_impl.h"
          #include "nnet_language_identifier.h"
          JNIEXPORT jint JNI_OnLoad(JavaVM*, void*) {
              return JNI_VERSION_1_6;
          }
          inline int utf8ToCodepoint(const unsigned char* p, int& len) {
              if (p[0] < 0x80)               { len=1; return p[0]; }
              if ((p[0]&0xE0)==0xC0)         { len=2; return ((p[0]&0x1F)<<6)|(p[1]&0x3F); }
              if ((p[0]&0xF0)==0xE0)         { len=3; return ((p[0]&0x0F)<<12)|((p[1]&0x3F)<<6)|(p[2]&0x3F); }
              if ((p[0]&0xF8)==0xF0)         { len=4; return ((p[0]&0x07)<<18)|((p[1]&0x3F)<<12)|((p[2]&0x3F)<<6)|(p[3]&0x3F); }
              len=1; return p[0];
          }
          inline bool isEmoji(int cp) {
              return cp==0x00A9||cp==0x00AE||cp==0x203C||cp==0x2049||cp==0x2122||cp==0x2139||
                     (cp>=0x2194&&cp<=0x2199)||(cp>=0x21A9&&cp<=0x21AA)||
                     cp==0x231A||cp==0x231B||cp==0x2328||cp==0x23CF||(cp>=0x23E9&&cp<=0x23F3)||(cp>=0x23F8&&cp<=0x23FA)||
                     cp==0x24C2||cp==0x25AA||cp==0x25AB||cp==0x25B6||cp==0x25C0||(cp>=0x25FB&&cp<=0x25FE)||
                     (cp>=0x2600&&cp<=0x26FF)||(cp>=0x2700&&cp<=0x27BF)||cp==0x2934||cp==0x2935||
                     (cp>=0x2B05&&cp<=0x2B07)||cp==0x2B1B||cp==0x2B1C||cp==0x2B50||cp==0x2B55||
                     cp==0x3030||cp==0x303D||cp==0x3297||cp==0x3299||cp==0x20E3||cp==0xFE0F||
                     cp==0x1F004||cp==0x1F0CF||
                     cp==0x1F170||cp==0x1F171||cp==0x1F17E||cp==0x1F17F||cp==0x1F18E||(cp>=0x1F191&&cp<=0x1F19A)||
                     (cp>=0x1F1E6&&cp<=0x1F1FF)||
                     cp==0x1F201||cp==0x1F202||cp==0x1F21A||cp==0x1F22F||(cp>=0x1F232&&cp<=0x1F23A)||cp==0x1F250||cp==0x1F251||
                     (cp>=0x1F300&&cp<=0x1F5FF)||(cp>=0x1F600&&cp<=0x1F64F)||(cp>=0x1F680&&cp<=0x1F6FF)||(cp>=0x1F900&&cp<=0x1F9FF);
          }
          struct ChunkResult { std::string lang; std::string text; int type; };
          static std::string cld3DetectRaw(const std::string& u8, bool* reliableOut);
          static std::string cld2WindowDetectC(const std::string& u8, bool useCld3);
          static std::vector<ChunkResult> buildMixChunks(const std::vector<std::string>& sentences, const std::string& latFall, const std::string& nonLatFall, const std::string& puncFall, const std::string& numFall, const std::string& emojiFall, const std::string& neutralDefault, int neutralType, bool disableAdvancedDetection, bool isDual = false) {
              std::vector<ChunkResult> result;
              std::string fullText;
              for (auto& s : sentences) { if (!s.empty()) fullText += s + " "; }
              if (fullText.empty()) return result;
              {
                  {
                      size_t tb = 0, te = fullText.size();
                      while (tb < te && (unsigned char)fullText[tb] <= 0x20) ++tb;
                      while (te > tb && (unsigned char)fullText[te - 1] <= 0x20) --te;
                      if (tb == te) return result;
                      fullText = fullText.substr(tb, te - tb);
                  }
                  auto isUniWs = [](int cp) -> bool {
                      return (cp >= 0x09 && cp <= 0x0D) || cp == 0x20;
                  };
                  std::string collapsed; collapsed.reserve(fullText.size());
                  bool prevWs = false;
                  int cbPos = 0, cbLen = (int)fullText.size();
                  while (cbPos < cbLen) {
                      int cpLen = 0;
                      int cp = utf8ToCodepoint((const unsigned char*)&fullText[cbPos], cpLen);
                      if (cpLen <= 0) cpLen = 1;
                      if (isUniWs(cp)) { if (!prevWs) collapsed += ' '; prevWs = true; }
                      else { collapsed.append(fullText, cbPos, (size_t)cpLen); prevWs = false; }
                      cbPos += cpLen;
                  }
                  fullText = std::move(collapsed);
              }
              if (fullText.empty()) return result;
              {
                  std::string clean;
                  int bytePos = 0, byteLen = (int)fullText.size();
                  while (bytePos < byteLen) {
                      int cpLen = 0;
                      int cp = utf8ToCodepoint((const unsigned char*)&fullText[bytePos], cpLen);
                      if (cp == 0x061C || cp == 0x200E || cp == 0x200F ||
                          (cp >= 0x202A && cp <= 0x202E)) { bytePos += cpLen; continue; }
                      clean += fullText.substr(bytePos, cpLen);
                      bytePos += cpLen;
                  }
                  fullText = clean;
              }
              if (fullText.empty()) return result;
              struct Seg { std::string text; int type; std::string lang; };
              std::vector<Seg> segs;
              {
                  std::string buf;
                  int bufKind = -1;
                  auto flushBuf = [&]() {
                      if (buf.empty()) return;
                      if (bufKind == 1) {
                          segs.push_back({buf, 2, ""});
                      } else {
                          bool allWs = true, allPunct = true, allNumber = true;
                          const unsigned char* p = (const unsigned char*)buf.c_str();
                          int bufLen = (int)buf.size(), j = 0;
                          while (j < bufLen) {
                              int cpLen = 0;
                              int cp = utf8ToCodepoint(p + j, cpLen);
                              { bool isJWs = (cp >= 0x09 && cp <= 0x0D) || (cp >= 0x1C && cp <= 0x1F) ||
                                             cp == 0x20 || cp == 0x1680 ||
                                             (cp >= 0x2000 && cp <= 0x200A && cp != 0x2007) ||
                                             cp == 0x205F || cp == 0x3000 ||
                                             cp == 0x2028 || cp == 0x2029;
                                if (!isJWs) allWs = false; }
                              bool inPunct = (cp >= 0x21 && cp <= 0x2F) || (cp >= 0x3A && cp <= 0x40) ||
                                             cp == 0x5B || (cp >= 0x5D && cp <= 0x60) || (cp >= 0x7B && cp <= 0x7E) ||
                                             cp == 0x20 || (cp >= 0x09 && cp <= 0x0D) ||
                                             (cp >= 0x2000 && cp <= 0x206F);
                              bool inNumber = inPunct || (cp >= '0' && cp <= '9') ||
                                              cp == 0x00B0 || cp == 0x00D7 || cp == 0x00F7 ||
                                              (cp >= 0x20A0 && cp <= 0x20CF);
                              if (!inPunct) allPunct = false;
                              if (!inNumber) allNumber = false;
                              j += cpLen;
                          }
                          segs.push_back({buf, allWs ? 0 : (allPunct ? 4 : (allNumber ? 3 : 1)), ""});
                      }
                      buf.clear(); bufKind = -1;
                  };
                  int len = (int)fullText.size(), i = 0;
                  while (i < len) {
                      int cpLen = 0;
                      int cp = utf8ToCodepoint((const unsigned char*)&fullText[i], cpLen);
                      bool latRange = (cp <= 0x024F) ||
                                      (cp >= 0x1E00 && cp <= 0x1EFF) ||
                                      (cp >= 0x2000 && cp <= 0x206F) ||
                                      (cp >= 0x20A0 && cp <= 0x20CF) ||
                                      (cp >= 0x2C60 && cp <= 0x2C7F) ||
                                      (cp >= 0xA720 && cp <= 0xA7FF) ||
                                      isEmoji(cp);
                      int kind = latRange ? 0 : 1;
                      if (bufKind == -1 || bufKind == kind) { buf += fullText.substr(i, cpLen); bufKind = kind; }
                      else { flushBuf(); buf = fullText.substr(i, cpLen); bufKind = kind; }
                      i += cpLen;
                  }
                  flushBuf();
              }
              {
                  std::vector<Seg> merged2;
                  int segIdx = 0, segCount = (int)segs.size();
                  while (segIdx < segCount) {
                      std::string runText = segs[segIdx].text;
                      int runType = segs[segIdx].type;
                      int runEnd = segIdx + 1;
                      while (runEnd < segCount && segs[runEnd].type != -1 &&
                             (segs[runEnd].type == runType || segs[runEnd].type == 0)) {
                          runText += segs[runEnd].text;
                          runEnd++;
                      }
                      merged2.push_back({runText, runType, ""});
                      segIdx = runEnd;
                  }
                  segs = std::move(merged2);
              }
              if (segs.empty()) return result;
              (void)emojiFall; (void)disableAdvancedDetection;
              for (auto& seg : segs) {
                  if (seg.type == 1) seg.lang = latFall;
                  else if (seg.type == 2) seg.lang = nonLatFall;
              }
              for (int segPos = 0; segPos < (int)segs.size(); segPos++) {
                  int segType = segs[segPos].type;
                  if (segType == 1 || segType == 2) continue;
                  if (segType != 3 && segType != 4) continue;
                  // AutoTTS y.g: d(H)/d(I) when the mode int is set, else d(y.a(...)) for the first
                  // element and d(y.b(...)) for the rest — y.a/y.b return the first/previous type that
                  // is neither 3 nor 4, or 0 when there is none. The TYPE is what later resolution reads.
                  int resolvedType = 0;
                  if (segType == 4 && !puncFall.empty() && puncFall != "auto") {
                      resolvedType = (puncFall == latFall) ? 1 : 2;
                  } else if (segType == 3 && !numFall.empty() && numFall != "auto") {
                      resolvedType = (numFall == latFall) ? 1 : 2;
                  } else if (segPos == 0) {
                      // y.a(): first type that is neither 3 nor 4, else 0 — and element 0 (or a
                      // one-element list) then falls back to defType, NOT to 0.
                      for (int fwd = segPos + 1; fwd < (int)segs.size() && resolvedType == 0; fwd++)
                          if (segs[fwd].type != 3 && segs[fwd].type != 4) resolvedType = segs[fwd].type;
                      if (resolvedType == 0) resolvedType = neutralType;
                  } else {
                      // y.b(): previous type that is neither 3 nor 4; its 0 is used AS IS here
                      for (int bwd = segPos - 1; bwd >= 0 && resolvedType == 0; bwd--)
                          if (segs[bwd].type != 3 && segs[bwd].type != 4) resolvedType = segs[bwd].type;
                  }
                  segs[segPos].type = resolvedType;
                  segs[segPos].lang = (resolvedType == 1) ? latFall
                                    : (resolvedType == 2) ? nonLatFall : neutralDefault;
              }
              // y.g's final loop: merge adjacent equal types, nothing else. AutoTTS has no
              // whitespace-absorption pass here — a whitespace run that did not match pattern
              // d is a plain type-2 segment and must stay one.
              for (auto& seg : segs) {

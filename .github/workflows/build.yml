      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Restore Keystore
        run: |
          KSBASE64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -z "$KSBASE64" ]; then
            KSBASE64=""
          fi
          printf '%s' "$KSBASE64" | base64 -d > easyvoice-release.keystore
          echo "Keystore ready" 
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'sachin1211' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sachin' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sachin1211' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Voice-Native-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

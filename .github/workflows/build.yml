          "        // show_selected=\"Show\\nselected\", show_all=\"Show\\nall\") so the three buttons stack on two lines.\n"
          "        Row(modifier = Modifier.fillMaxWidth()) {\n"
          "            TextButton(onClick = { entries.forEach { prefs.setLanguageDisabled(it.first, false) }; checkedSet = entries.map { it.first }.toSet() }) { Text(\"Select\\nall\") }\n"
          "            Spacer(modifier = Modifier.width(8.dp))\n"
          "            TextButton(onClick = { entries.forEach { prefs.setLanguageDisabled(it.first, !isForceEnabled(it.first)) }; checkedSet = entries.map { it.first }.filter { isForceEnabled(it) }.toSet() }) { Text(\"Clear\\nall\") }  // AutoTTS clear_all \"Clear\\nall\" (force-enabled langs stay checked, others disabled)\n"
          "            Spacer(modifier = Modifier.weight(1f))\n"
          "            TextButton(onClick = { showSelectedOnly = !showSelectedOnly }) { Text(if (showSelectedOnly) \"Show\\nall\" else \"Show\\nselected\") }\n"
          "        }\n"
          "        Spacer(modifier = Modifier.height(8.dp))\n"
          "        OutlinedTextField(\n"
          "            value = searchQuery,\n"
          "            onValueChange = { searchQuery = it },\n"
          "            label = { Text(\"Search languages\") },\n"
          "            leadingIcon = { Icon(Icons.Filled.Search, contentDescription = null) },\n"
          "            trailingIcon = { if (searchQuery.isNotEmpty()) IconButton(onClick = { searchQuery = \"\" }) { Icon(Icons.Filled.Clear, contentDescription = \"Clear text\") } },\n"
          "            modifier = Modifier.fillMaxWidth(),\n"
          "            singleLine = true\n"
          "        )\n"
          "        Spacer(modifier = Modifier.height(4.dp))\n"
          "        if (scanning && entries.isEmpty()) {\n"
          "            Text(\"Loading languages…\", modifier = Modifier.padding(vertical = 16.dp).semantics { liveRegion = LiveRegionMode.Polite }, style = MaterialTheme.typography.bodyLarge)\n"
          "        } else if (entries.isEmpty()) {\n"
          "            Text(\"No TTS engine languages found.\", modifier = Modifier.padding(vertical = 16.dp), style = MaterialTheme.typography.bodyLarge)\n"
          "        }\n"
          "        LazyColumn(modifier = Modifier.fillMaxSize()) {\n"
          "            val filtered = entries.filter { (iso, display) ->\n"
          "                (searchQuery.isBlank() || display.contains(searchQuery, ignoreCase = true)) &&\n"
          "                (!showSelectedOnly || iso in checkedSet)\n"
          "            }\n"
          "            items(filtered.size) { idx ->\n"
          "                val iso = filtered[idx].first\n"
          "                val display = filtered[idx].second\n"
          "                val isAdded = iso in checkedSet\n"
          "                Row(\n"
          "                    modifier = Modifier\n"
          "                        .fillMaxWidth()\n"
          "                        // AutoTTS Languages list uses simple_list_item_multiple_choice (a\n"
          "                        // CheckedTextView in a CHOICE_MODE_MULTIPLE ListView). Use\n"
          "                        // toggleable(role = Checkbox) so TalkBack announces the row EXACTLY like\n"
          "                        // AutoTTS's checkbox — \"<language>, checkbox, checked/not checked\" — rather\n"
          "                        // than a custom string. A force-enabled (k.n) language can't be unchecked\n"
          "                        // (AutoTTS onItemClick forces it back to checked).\n"
          "                        .toggleable(\n"
          "                            value = isAdded,\n"
          "                            role = androidx.compose.ui.semantics.Role.Checkbox,\n"
          "                            onValueChange = {\n"
          "                                val enable = if (isForceEnabled(iso)) true else !isAdded\n"
          "                                prefs.setLanguageDisabled(iso, !enable)\n"
          "                                checkedSet = if (enable) checkedSet + iso else checkedSet - iso\n"
          "                            }\n"
          "                        )\n"
          "                        .padding(vertical = 14.dp, horizontal = 4.dp),\n"
          "                    verticalAlignment = Alignment.CenterVertically\n"
          "                ) {\n"
          "                    Text(display, modifier = Modifier.weight(1f), style = MaterialTheme.typography.bodyLarge)\n"
          "                    Checkbox(checked = isAdded, onCheckedChange = null)\n"
          "                }\n"
          "                Divider()\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "}\n"
          "\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// ConfigurationTabContent — Tab 1: dynamic mode toggle + language list\n"
          "// Tap language → detail screen. Long press → remove dialog.\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "@OptIn(ExperimentalFoundationApi::class)\n"
          "@Composable\n"
          "private fun ConfigurationTabContent(\n"
          "    prefs: SharedPrefsManager,\n"
          "    ttsHolder: () -> android.speech.tts.TextToSpeech?,\n"
          "    setTts: (android.speech.tts.TextToSpeech?) -> Unit,\n"
          "    kgHolder: () -> android.speech.tts.TextToSpeech? = { null },\n"
          "    onDetailOpenChange: (Boolean) -> Unit = {}\n"
          ") {\n"
          "    val context = LocalContext.current\n"
          "    // AutoTTS O2: Voices settings are not available in Auto (\"None\") mode.\n"
          "    if (prefs.getReadingMode() == \"none\") {\n"
          "        Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {\n"
          "            Text(\"Voice Settings\", style = MaterialTheme.typography.headlineSmall, modifier = Modifier.semantics { heading() })\n"
          "            Spacer(modifier = Modifier.height(12.dp))\n"
          "            Text(\"Voices settings aren't available for \\\"None\\\" mode.\", style = MaterialTheme.typography.bodyLarge, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "        }\n"
          "        return\n"
          "    }\n"
          "    val engines = remember { EngineFinder.getEngines(context).toMutableList().apply { add(0, EngineFinder.TTSInfo(\"NOT_SET\", \"--- Not Set ---\")) } }\n"
          "    // AutoTTS c3.k.h()/k.c: the Voices-tab language list = EVERY language that has an installed\n"
          "    // voice (union across all engines), NOT just user-added ones. This is essential for Dual/\n"
          "    // Google modes (Languages tab disabled) so the dual secondary (D) + English primary, and any\n"
          "    // installed-voice language, remain configurable — exactly like AutoTTS.\n"
          "    // AutoTTS O2(): the Voices language spinner source is k.j(\"com.google.android.tts\") in GOOGLE\n"
          "    // mode (L=3) — ONLY Google's languages — and k.j(null)/k.i() (all installed-voice langs) otherwise.\n"
          "    val voicesReadingMode = prefs.getReadingMode()\n"
          "    var scannedLangs by remember(voicesReadingMode) { mutableStateOf(if (voicesReadingMode == \"google\") emptySet() else EngineFinder.lastScan) }\n"
          "    LaunchedEffect(voicesReadingMode) {\n"
          "        onDetailOpenChange(false)\n"
          "        val onlyPkg = if (voicesReadingMode == \"google\") \"com.google.android.tts\" else null\n"
          "        if (scannedLangs.isEmpty()) { try { EngineFinder.scanLanguages(context, onlyPkg) { scannedLangs = it } } catch (_: Exception) {} }\n"
          "    }\n"
          "    DisposableEffect(Unit) { onDispose { onDetailOpenChange(false) } }\n"
          "    val col = remember { java.text.Collator.getInstance() }\n"
          "    val langList = remember(scannedLangs, voicesReadingMode) {\n"
          "        // AutoTTS Voices-tab language list (c3.i.java:1448-1458):\n"
          "        //   dual (L=1)   → k.i()  = eng + dual_mode_language\n"
          "        //   google (L=3) → k.j(\"com.google.android.tts\", false) = Google's NON-DISABLED langs\n"
          "        //   auto/mix     → k.j(null, false) = ALL NON-DISABLED langs\n"
          "        // i.e. ONLY the languages the user SELECTED (not disabled) are shown — not every scanned lang.\n"
          "        val src: List<String> = if (voicesReadingMode == \"dual\") {\n"
          "            val d = prefs.toIso3(prefs.getString(\"dual_mode_language\", \"\").ifEmpty { java.util.Locale.getDefault().language })\n"
          "            // AutoTTS c3.k.d(): the dual list contains eng/D ONLY when a SCANNED VOICE exists for\n"
          "            // that language (k.d iterates the scanned voice entries u and matches eng/D). A language\n"
          "            // with no installed voice does NOT appear. Filter by the scan exactly like that.\n"
          "            listOf(\"eng\", d).distinct().filter { it in scannedLangs }\n"
          "        } else {\n"
          "            (if (scannedLangs.isNotEmpty()) scannedLangs else prefs.getLanguageList().toSet())\n"
          "                .filter { !prefs.isLanguageDisabled(it) }  // AutoTTS k.j(pkg, false): exclude disabled languages\n"
          "        }\n"
          "        fun sortKey(c: String): String {\n"
          "            val n = Languages.map[c] ?: (try { java.util.Locale(c).displayLanguage } catch (_: Exception) { c }).ifEmpty { c }\n"
          "            return java.text.Normalizer.normalize(n, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "        }\n"
          "        src.sortedWith { a, b -> col.compare(sortKey(a), sortKey(b)) }\n"
          "    }\n"
          "    var selectedIso by rememberSaveable(langList) { mutableStateOf(langList.firstOrNull()) }  // AutoTTS: selected-language survives tab switches (fragment alive); resets only when langList changes\n"
          "    Column(modifier = Modifier.fillMaxSize()) {\n"
          "        Column(modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp)) {\n"
          "            Text(\"Voice Settings\", style = MaterialTheme.typography.headlineSmall, modifier = Modifier.semantics { heading() })\n"
          "            Spacer(modifier = Modifier.height(4.dp))\n"
          "            Text(\"Choose an installed voice for each language. Recommendation: Assign ONE engine PER language to avoid switching delay.\", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            if (langList.isEmpty()) {\n"
          "                Text(\"Scanning installed TTS voices…\", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(vertical = 24.dp).semantics { liveRegion = LiveRegionMode.Polite })\n"
          "            } else {\n"
          "                val labels = langList.map { Languages.label(it) }\n"
          "                val sel = selectedIso ?: langList.first()\n"
          "                AccessibleDropdown(\"Select language:\", Languages.label(sel), labels) { idx -> selectedIso = langList[idx] }\n"
          "            }\n"
          "        }\n"
          "        if (langList.isNotEmpty()) {\n"
          "            Divider()\n"
          "            val sel = selectedIso ?: langList.first()\n"
          "            Box(modifier = Modifier.weight(1f)) {\n"
          "                LangDetailScreen(iso = sel, prefs = prefs, engines = engines, ttsHolder = ttsHolder, setTts = setTts, kgHolder = kgHolder, onBack = {}, inline = true)\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "}\n"
          "\n"
          "// AutoTTS voice-list entry (c3.u): one (engine × locale) pair. The voice dropdown (E0)\n"
          "// shows u.d() = \"EngineName, DisplayCountry\" per entry; the variant dropdown (F0) shows\n"
          "// the voice names within the chosen entry. locTag is the specific locale (en-US, en-GB…).\n"
          "private data class VoiceEntry(val pkg: String, val engineName: String, val locTag: String, val label: String)\n"
          "\n"
          "// AutoTTS c3.u.g(): abbreviate a multi-word engine name toward ~15 chars as \"First ... Last\",\n"
          "// growing from both ends alternately. The voice label is u.d() = g() + \", \" + DisplayCountry.\n"
          "private fun abbrevEngineName(name: String): String {\n"
          "    val parts = name.split(\" \")\n"
          "    if (parts.size < 2) return name\n"
          "    val sb1 = StringBuilder(parts[0])\n"
          "    val sb2 = StringBuilder(parts[parts.size - 1])\n"
          "    var n4 = 1\n"
          "    var n3 = parts.size - 2\n"
          "    var obj = \"$sb1 ... $sb2\"\n"
          "    while (n4 < n3) {\n"
          "        if (obj.length > 15) return obj\n"
          "        val cs = \"$sb1 ... $sb2\"\n"
          "        if (cs.length > 15) return if (cs.length >= 20) obj else cs\n"
          "        if (parts[n4].length < parts[n3].length) { sb1.append(\" \").append(parts[n4]); n4++ }\n"
          "        else { sb2.insert(0, parts[n3] + \" \"); n3-- }\n"
          "        obj = cs\n"
          "    }\n"
          "    return if (name.length >= 15) obj else name\n"
          "}\n"
          "\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// LangDetailScreen — full settings screen for one configured language\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "@Composable\n"
          "private fun LangDetailScreen(\n"
          "    iso: String,\n"
          "    prefs: SharedPrefsManager,\n"
          "    engines: List<EngineFinder.TTSInfo>,\n"
          "    ttsHolder: () -> android.speech.tts.TextToSpeech?,\n"
          "    setTts: (android.speech.tts.TextToSpeech?) -> Unit,\n"
          "    kgHolder: () -> android.speech.tts.TextToSpeech? = { null },\n"
          "    onBack: () -> Unit,\n"
          "    inline: Boolean = false\n"
          ") {\n"
          "    val context = LocalContext.current\n"
          "    val langName = Languages.map[iso] ?: iso\n"
          "    var selEngPkg by remember(iso) { mutableStateOf(prefs.getEngineForLanguage(iso)) }\n"
          "    var availableLocales by remember(iso, selEngPkg) { mutableStateOf(listOf<Locale>()) }\n"
          "    var availableVoiceNames by remember(iso, selEngPkg) { mutableStateOf(listOf<String>()) }\n"
          "    var selLocTag by remember(iso, selEngPkg) { mutableStateOf(prefs.getLocaleForLangPkg(iso, selEngPkg)) }\n"
          "    var rate by remember(iso) { mutableIntStateOf(prefs.getInt(\"${prefs.toIso3(iso)}_speed\", 100).coerceIn(0, 500)) }\n"
          "    var pitch by remember(iso) { mutableIntStateOf(prefs.getInt(\"${prefs.toIso3(iso)}_pitch\", 100).coerceIn(0, 200)) }\n"
          "    var vol by remember(iso) { mutableIntStateOf(prefs.getInt(\"${prefs.toIso3(iso)}_volume\", 100).coerceIn(0, 100)) }\n"
          "    var selVoiceName by remember(iso) { mutableStateOf(prefs.getVoiceName(iso)) }\n"
          "    var compatibleEngines by remember(iso) { mutableStateOf<List<String>?>(null) }\n"
          "    // AutoTTS c3.k.e: the voice list for this language = every (engine × supported-locale)\n"
          "    // combination, each shown as \"EngineName, Country\". Built by scanning each installed engine.\n"
          "    var voiceEntries by remember(iso) { mutableStateOf<List<VoiceEntry>?>(null) }\n"
          "    // AutoTTS: dedicated_engines (global O flag) checkbox lives on the per-language voice screen.\n"
          "    var dedicatedEng by remember { mutableStateOf(prefs.isDedicatedEnginesEnabled()) }\n"
          "    fun localeMatchesIso(loc: java.util.Locale): Boolean {\n"
          "        val lang = loc.language.lowercase()\n"
          "        val tag  = loc.toLanguageTag().lowercase()\n"
          "        val target = iso.lowercase()\n"
          "        if (lang == target || tag == target || tag.startsWith(\"\$target-\")) return true\n"
          "        return try {\n"
          "            val targetLocale = java.util.Locale.forLanguageTag(target)\n"
          "            val langMatch = loc.getISO3Language().lowercase() == targetLocale.getISO3Language().lowercase()\n"
          "            if (!langMatch) return false\n"
          "            if (targetLocale.country.isEmpty()) return true\n"
          "            val locCountry = loc.country.lowercase()\n"
          "            val targetCountry = targetLocale.country.lowercase()\n"
          "            if (locCountry == targetCountry) return true\n"
          "            loc.getISO3Country().lowercase() == targetLocale.getISO3Country().lowercase()\n"
          "        } catch (_: Exception) { false }\n"
          "    }\n"
          "    LaunchedEffect(selEngPkg, iso) {\n"
          "        if (selEngPkg != \"NOT_SET\") {\n"
          "            ttsHolder()?.shutdown()\n"
          "            // Use array holder (not var ref) so callback captures the slot, not a null var.\n"
          "            // Some engines (e.g. Eloquence) fire the callback synchronously before the\n"
          "            // var-ref assignment executes, leaving ref=null inside the lambda.\n"
          "            val holder = arrayOfNulls<android.speech.tts.TextToSpeech>(1)\n"
          "            holder[0] = android.speech.tts.TextToSpeech(context, { status ->\n"
          "                if (status == android.speech.tts.TextToSpeech.SUCCESS) {\n"
          "                    val tts = holder[0]\n"
          "                    // Merge voices + availableLanguages so engines like Eloquence show all\n"
          "                    // supported locales (e.g. en-GB, en-AU) not just installed ones (e.g. en-US).\n"
          "                    // distinctBy uses raw language+country fields to avoid toLanguageTag()\n"
          "                    // normalization mismatches between 3-letter codes (eng/GBR) vs 2-letter (en/GB).\n"
          "                    val fromVoices: List<java.util.Locale> = try {\n"
          "                        tts?.voices?.map { it.locale }?.filter { localeMatchesIso(it) } ?: listOf()\n"
          "                    } catch (_: Exception) { listOf() }\n"
          "                    val fromAvail: List<java.util.Locale> = try {\n"
          "                        tts?.availableLanguages?.filter { localeMatchesIso(it) } ?: listOf()\n"
          "                    } catch (_: Exception) { listOf() }\n"
          "                    availableLocales = (fromVoices + fromAvail)\n"
          "                        .distinctBy { it.language.lowercase() + \"_\" + it.country.lowercase() }\n"
          "                        .sortedBy { it.displayName }\n"
          "                    if (selLocTag.isNotEmpty()) {\n"
          "                        availableVoiceNames = try { tts?.voices?.filter { v -> try { localeMatchesIso(v.locale) && v.locale.toLanguageTag() == selLocTag } catch (_: Exception) { false } }?.map { it.name }?.sorted() ?: listOf() } catch (_: Exception) { listOf() }\n"
          "                    }\n"
          "                    // AutoTTS parity: the voice dropdown lists (engine x locale) entries and the user\n"
          "                    // picks the EXACT locale (like AutoTTS E0 O1: d.g = selected voice's locale). We must\n"
          "                    // NOT auto-pick a 'best' locale here — that overrode the user's explicit choice\n"
          "                    // (e.g. picking en-US but the engine's highest-quality English is en-GB snapped the\n"
          "                    // selection back to en-GB/GBR). selLocTag comes solely from the user's pick (or the\n"
          "                    // persisted value); the variant list is computed by the LaunchedEffect(selLocTag) below.\n"
          "                }\n"
          "            }, selEngPkg)\n"
          "            setTts(holder[0])\n"
          "        } else { availableLocales = listOf(); availableVoiceNames = listOf(); ttsHolder()?.shutdown(); setTts(null) }\n"
          "    }\n"
          "    // Voice Variant list for the auto-selected locale (AutoTTS F0 spinner = engine's\n"
          "    // variants for the chosen language/locale). Locale itself is not a dropdown — it comes\n"
          "    // bundled with the engine selection (best locale auto-picked above).\n"
          "    LaunchedEffect(selLocTag) {\n"
          "        val tts = ttsHolder()\n"
          "        availableVoiceNames = if (tts != null && selLocTag.isNotEmpty())\n"
          "            try { tts.voices?.filter { try { it.locale.toLanguageTag() == selLocTag } catch (_: Exception) { false } }?.map { it.name }?.sorted() ?: listOf() } catch (_: Exception) { listOf() }\n"
          "        else listOf()\n"
          "    }\n"
          "    LaunchedEffect(iso, engines) {\n"
          "        compatibleEngines = null\n"
          "        voiceEntries = null\n"
          "        val compatible = mutableListOf<String>()\n"
          "        val entries = mutableListOf<VoiceEntry>()\n"
          "        for (eng in engines) {\n"
          "            if (eng.pkg == \"NOT_SET\") continue\n"
          "            // AutoTTS c3.k.a(): init the engine and collect every locale it supports for this\n"
          "            // language (merged from availableLanguages + voices, like the selected-engine scan).\n"
          "            val locs: List<java.util.Locale> = withTimeoutOrNull(2500L) {\n"
          "                suspendCancellableCoroutine<List<java.util.Locale>> { cont ->\n"
          "                    val h2 = arrayOfNulls<android.speech.tts.TextToSpeech>(1)\n"
          "                    h2[0] = android.speech.tts.TextToSpeech(context, { st2 ->\n"
          "                        val out = mutableListOf<java.util.Locale>()\n"
          "                        if (st2 == android.speech.tts.TextToSpeech.SUCCESS) {\n"
          "                            val t2 = h2[0]\n"
          "                            try { t2?.availableLanguages?.filter { localeMatchesIso(it) }?.let { out.addAll(it) } } catch (_: Exception) {}\n"
          "                            try { t2?.voices?.map { it.locale }?.filter { localeMatchesIso(it) }?.let { out.addAll(it) } } catch (_: Exception) {}\n"
          "                        }\n"
          "                        try { h2[0]?.shutdown() } catch (_: Exception) {}\n"
          "                        if (!cont.isCompleted) cont.resumeWith(Result.success(out.distinctBy { \"${it.language.lowercase()}_${it.country.lowercase()}\" }))\n"
          "                    }, eng.pkg)\n"
          "                }\n"
          "            } ?: listOf()\n"
          "            if (locs.isNotEmpty()) {\n"
          "                compatible.add(eng.pkg)\n"
          "                // AutoTTS u.d(): \"EngineName, DisplayCountry\" (or just EngineName if no country).\n"
          "                for (loc in locs.sortedBy { it.displayName }) {\n"
          "                    val abbr = abbrevEngineName(eng.name)  // AutoTTS u.g()\n"
          "                    val label = if (loc.country.isNotEmpty()) \"$abbr, ${loc.getDisplayCountry()}\" else abbr\n"
          "                    entries.add(VoiceEntry(eng.pkg, eng.name, loc.toLanguageTag(), label))\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "        compatibleEngines = compatible\n"
          "        voiceEntries = entries\n"
          "    }\n"
          "    // AutoTTS R2(): the F0 variant list always contains the persisted variant (d.h) as a selectable\n"
          "    // item, even if it isn't in the new locale's voice set — so the field never shows an orphan value.\n"
          "    val selVoiceOptions = (listOf(\"*Default\") + availableVoiceNames + (if (selVoiceName.isNotEmpty() && selVoiceName != \"*Default\" && selVoiceName !in availableVoiceNames) listOf(selVoiceName) else emptyList())).distinct()\n"
          "    Column(modifier = Modifier.fillMaxSize()) {\n"
          "        if (!inline) {\n"
          "        Row(modifier = Modifier.fillMaxWidth().padding(start = 4.dp, top = 8.dp, end = 16.dp, bottom = 8.dp), verticalAlignment = Alignment.CenterVertically) {\n"
          "            IconButton(onClick = onBack) { Icon(Icons.Filled.ArrowBack, contentDescription = \"Back\") }\n"
          "            Text(\"$langName ($iso)\", style = MaterialTheme.typography.titleLarge, modifier = Modifier.weight(1f))\n"
          "        }\n"
          "        Divider()\n"
          "        }\n"
          "        Column(modifier = Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(16.dp)) {\n"
          "            // AutoTTS E0 voice dropdown: one item per (engine × locale) = \"EngineName, Country\".\n"
          "            // While the background scan runs, fall back to a plain engine list so the UI is never blank.\n"
          "            val vEntries = voiceEntries\n"
          "            if (vEntries != null) {\n"
          "                val vLabels = listOf(\"--- Not Set ---\") + vEntries.map { it.label }\n"
          "                val curLabel = if (selEngPkg == \"NOT_SET\") \"--- Not Set ---\"\n"
          "                    else vEntries.firstOrNull { it.pkg == selEngPkg && it.locTag == selLocTag }?.label\n"
          "                        // Robust fallback: same engine + same language/country even if the tag string\n"
          "                        // differs in format (ISO3 vs ISO2, extra subtags). Prevents snapping to the\n"
          "                        // first (alphabetically-first, e.g. en-GB) entry when the exact string mismatches.\n"
          "                        ?: vEntries.firstOrNull { it.pkg == selEngPkg && selLocTag.isNotEmpty() && try { val a = java.util.Locale.forLanguageTag(it.locTag); val b = java.util.Locale.forLanguageTag(selLocTag); a.language.equals(b.language, true) && a.country.equals(b.country, true) } catch (_: Exception) { false } }?.label\n"
          "                        ?: vEntries.firstOrNull { it.pkg == selEngPkg }?.label\n"
          "                        ?: engines.firstOrNull { it.pkg == selEngPkg }?.name ?: \"--- Not Set ---\"\n"
          "                AccessibleDropdown(\"Choose a voice for above language:\", curLabel, vLabels) { idx ->\n"
          "                    if (idx == 0) { prefs.setLocaleForLangPkg(iso, \"NOT_SET\", \"\"); selEngPkg = \"NOT_SET\"; selLocTag = \"\" }\n"
          "                    else {\n"
          "                        val e = vEntries[idx - 1]\n"
          "                        // Persist engine + locale together (combined key \"pkg#localeTag\"), exactly like\n"
          "                        // AutoTTS storing d.f (engine) + d.b (locale) for the selected voice.\n"
          "                        prefs.setLocaleForLangPkg(iso, e.pkg, e.locTag)\n"
          "                        selEngPkg = e.pkg; selLocTag = e.locTag\n"
          "                    }\n"
          "                }\n"
          "            } else {\n"
          "                val displayEngines = engines\n"
          "                AccessibleDropdown(\"Choose a voice for above language:\", engines.firstOrNull { it.pkg == selEngPkg }?.name ?: \"Not Set\", displayEngines.map { it.name }) { idx ->\n"
          "                    // getLocaleForLangPkg ignores its pkg arg (one combined key/lang), so reusing curLoc would\n"
          "                    // graft the OLD engine's locale onto the new one. Clear it; the real (engine × locale)\n"
          "                    // dropdown resolves the locale once the scan completes.\n"
          "                    selEngPkg = displayEngines[idx].pkg; prefs.setLocaleForLangPkg(iso, selEngPkg, \"\"); selLocTag = \"\"\n"
          "                }\n"
          "            }\n"
          "            // AutoTTS F0 variant dropdown: the voice names within the chosen (engine × locale).\n"
          "            AccessibleDropdown(\"Choose a variant for voice:\", selVoiceName, selVoiceOptions) { idx ->\n"
          "                selVoiceName = selVoiceOptions[idx]; prefs.setVoiceName(iso, selVoiceName)\n"
          "            }\n"
          "            Spacer(modifier = Modifier.height(16.dp))\n"
          "            // AutoTTS Voice Settings: TEST button ABOVE the sliders.\n"
          "            Button(onClick = {\n"
          "                // AutoTTS c3.i.P2() EXACT: speaks \"[AutoTTS:engine:locale:variant]sample\" through\n"
          "                // the PERSISTENT self-engine client k.g (kgHolder) — created once at activity load\n"
          "                // (NewSettingsActivity:481), REUSED every click, never shut down / recreated here.\n"
          "                // P2 guards k.g==null / no engine configured → silently return (P2:1550-1552).\n"
          "                // locale uses underscore form (Locale.toString()) to match AutoTTS's locale.toString().\n"
          "                // The variant goes into the prefix AS SAVED — AutoTTS appends k.c[T0].h raw\n"
          "                // (P2:1570), including \"*Default\"; it does NOT blank it out.\n"
          "                val kg = kgHolder()\n"
          "                if (kg != null && selEngPkg != \"NOT_SET\") {\n"
          "                    val engineTag = selEngPkg\n"
          "                    val locUnderscore = try { java.util.Locale.forLanguageTag(selLocTag.ifEmpty { iso }).toString() } catch (_: Exception) { iso }\n"
          "                    val qualityTag = selVoiceName\n"
          "                    val sample = SampleTexts.get(iso)\n"
          "                    val body = if (sample.isEmpty()) \"Sorry. Sample text for language ${java.util.Locale(iso).getDisplayName(java.util.Locale(\"eng\"))} is missing.\" else sample\n"
          "                    val tagged = \"[AutoTTS:$engineTag:$locUnderscore:$qualityTag]$body\"\n"
          "                    // AutoTTS P2:1575 — k.g.speak(text, QUEUE_FLUSH, null, \"AutoTTS_Test\"), direct.\n"
          "                    kg.speak(tagged, android.speech.tts.TextToSpeech.QUEUE_FLUSH, null, \"AutoTTS_Test\")\n"
          "                }\n"
          "            }, modifier = Modifier.fillMaxWidth()) { Text(\"TEST\") }\n"
          "            Spacer(modifier = Modifier.height(16.dp))\n"
          "            // AutoTTS slider order: Speed, Volume, Pitch (plain labels).\n"
          "            TtsSliderRow(displayText=\"Speed\", value=rate, onValueChange={ rate=it; prefs.setInt(\"${prefs.toIso3(iso)}_speed\", it) }, valueRange=0f..500f, maxValue=500, decreaseDesc=\"Decrease speed\", increaseDesc=\"Increase speed\", minValue=10)\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            TtsSliderRow(displayText=\"Volume\", value=vol, onValueChange={ vol=it; prefs.setInt(\"${prefs.toIso3(iso)}_volume\", it) }, valueRange=0f..100f, maxValue=100, decreaseDesc=\"Decrease volume\", increaseDesc=\"Increase volume\", minValue=10)\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            TtsSliderRow(displayText=\"Pitch\", value=pitch, onValueChange={ pitch=it; prefs.setInt(\"${prefs.toIso3(iso)}_pitch\", it) }, valueRange=0f..200f, maxValue=200, decreaseDesc=\"Decrease pitch\", increaseDesc=\"Increase pitch\", minValue=10)\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            // AutoTTS DEFAULT button — resets Speed/Volume/Pitch to 100.\n"
          "            OutlinedButton(onClick = { rate = 100; pitch = 100; vol = 100; prefs.setInt(\"${prefs.toIso3(iso)}_speed\", 100); prefs.setInt(\"${prefs.toIso3(iso)}_pitch\", 100); prefs.setInt(\"${prefs.toIso3(iso)}_volume\", 100) }, modifier = Modifier.fillMaxWidth()) { Text(\"DEFAULT\") }\n"
          "            Spacer(modifier = Modifier.height(20.dp))\n"
          "            Text(\"Experimental\", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.primary, modifier = Modifier.semantics { heading() })\n"
          "            // AutoTTS c3/i.java O2(): dedicated-engines checkbox enabled when L != 0 && L != 3,\n"
          "            // i.e. Dual, Auto and Mixed modes (disabled only for None and Google-only).\n"
          "            val dedEnabled = prefs.getReadingMode().let { it == \"dual\" || it == \"mix\" || it == \"auto\" }\n"
          "            ToggleRow(\"Dedicated engines\", \"Use this option if YOU ARE SURE that you have dedicated tts engine for each voice AND no other apps will use them!\", dedicatedEng, enabled = dedEnabled) { dedicatedEng = it; prefs.setDedicatedEnginesEnabled(it) }\n"
          "            if (!dedEnabled) Text(\"Available in Dual, Auto and Mix modes only.\", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "        }\n"
          "    }\n"
          "}\n"
          "\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// AdditionalTabContent — 3rd tab: toggles + battery + dictionary + system TTS + logs\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "@Composable\n"
          "@OptIn(ExperimentalMaterial3Api::class)\n"
          "private fun HomeTabContent(prefs: SharedPrefsManager, section: String = \"advanced\", onDetailOpenChange: (Boolean) -> Unit = {}) {\n"
          "    val context = LocalContext.current\n"
          "    val clipboardManager = LocalClipboardManager.current\n"
          "    var readingMode by remember { mutableStateOf(prefs.getReadingMode().let { when(it) { \"mix\", \"dual\", \"google\", \"none\" -> it; else -> \"auto\" } }) }\n"
          "    var brokenProt by remember { mutableStateOf(prefs.isBrokenEngineProtector()) }\n"
          "    var forceAccessibility by remember { mutableStateOf(prefs.isForceAccessibilityStream()) }\n"
          "    var showNotification by remember { mutableStateOf(prefs.isShowNotification()) }\n"
          "    // AutoTTS c3.i P0 launcher + I2(): POST_NOTIFICATIONS is requested ONLY when the\n"
          "    // show-notification checkbox turns ON (SDK>=33 && not yet granted). Result is unused.\n"
          "    val notifPermLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { }\n"
          "    var localeSpans by remember { mutableStateOf(prefs.isLocaleSpansEnabled()) }\n"
          "    var disableAdvancedDet by remember { mutableStateOf(prefs.isDisableAdvancedDetection()) }\n"
          "    var loggingEnabledState by remember { mutableStateOf(prefs.isLoggingEnabled()) }\n"
          "    // Settings backup/restore (AutoTTS parity). Import picks an XML, applies it, then\n"
          "    // offers Play-Store install for any referenced-but-missing TTS engine.\n"
          "    var missingEngines by remember { mutableStateOf<List<String>>(emptyList()) }\n"
          "    // AutoTTS i.java J2(): after import, relaunch + kill the process so ALL cached state (engine list,\n"
          "    // voice list, in-memory settings, UI) reloads with the imported prefs — a Toast 'please restart'\n"
          "    // left everything stale. Flags NEW_TASK|CLEAR_TOP mirror AutoTTS J2's 0x14000000.\n"
          "    val restartApp: () -> Unit = {\n"
          "        try {\n"
          "            val intent = context.packageManager.getLaunchIntentForPackage(context.packageName)\n"
          "            if (intent != null) {\n"
          "                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)\n"
          "                context.startActivity(intent)\n"
          "                android.os.Process.killProcess(android.os.Process.myPid())\n"
          "            }\n"
          "        } catch (_: Exception) {}\n"
          "    }\n"
          "    val importLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->\n"
          "        if (uri != null) {\n"
          "            try {\n"
          "                val xml = context.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: \"\"\n"
          "                val n = prefs.importSettingsXml(xml)\n"
          "                val installed = EngineFinder.getEngines(context).map { it.pkg }.toHashSet()\n"
          "                val missing = prefs.getReferencedEnginePackages().filter { it !in installed }\n"
          "                if (missing.isEmpty()) {\n"
          "                    // AutoTTS y2()→J2(): import then restart immediately.\n"
          "                    Toast.makeText(context, \"Imported $n settings. Restarting…\", Toast.LENGTH_SHORT).show()\n"
          "                    restartApp()\n"
          "                } else {\n"
          "                    // Offer to install missing engines first; restart when the user is done (dialog below).\n"
          "                    missingEngines = missing\n"
          "                }\n"
          "            } catch (e: Exception) { Toast.makeText(context, \"Unable to load configuration. Please verify the file settings.\", Toast.LENGTH_LONG).show() }\n"
          "        }\n"
          "    }\n"
          "    if (missingEngines.isNotEmpty()) {\n"
          "        AlertDialog(\n"
          "            onDismissRequest = { missingEngines = emptyList() },\n"
          "            title = { Text(\"Missing TTS engines\") },\n"
          "            text = { Column { Text(\"These engines are used by the imported settings but are not installed. Tap to install:\"); Spacer(modifier = Modifier.height(8.dp)); missingEngines.forEach { pkg -> TextButton(onClick = { try { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(\"market://details?id=$pkg\")).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) } catch (_: Exception) { try { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(\"https://play.google.com/store/apps/details?id=$pkg\")).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) } catch (_: Exception) {} } }) { Text(\"Install ${EngineFinder.friendlyName(pkg)}\") } } } },\n"
          "            confirmButton = { TextButton(onClick = { missingEngines = emptyList(); restartApp() }) { Text(\"Done & Restart\") } }\n"

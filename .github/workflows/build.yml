      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Restore Keystore
        run: |
          KSBASE64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -z "$KSBASE64" ]; then
            KSBASE64=""
          fi
          printf '%s' "$KSBASE64" | base64 -d > easyvoice-release.keystore
          echo "Keystore ready" 
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'sachin1211' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sachin' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sachin1211' }}

      # Publish the APK to a GitHub Release instead of an Actions artifact.
      # Release assets do NOT count against the Actions artifact-storage quota
      # (which was full), and the APK is downloadable from the repo's Releases
      # page. A fixed tag ("latest-build") is updated on every build, so the
      # Releases page always has the newest APK at the same URL.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # A DISTINCT release per build (unique tag = build number) so each build
          # is easy to tell apart. The newest is always marked "Latest".
          tag_name: build-${{ github.run_number }}
          name: Easy Voice build #${{ github.run_number }}
          body: |
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          "@Composable\n"
          "private fun LanguageTabContent(prefs: SharedPrefsManager) {\n"
          "    val context = LocalContext.current\n"
          "    // AutoTTS M2: language selection is not available in Auto and Dual modes.\n"
          "    val readingMode = prefs.getReadingMode()\n"
          "    if (readingMode == \"none\" || readingMode == \"dual\") {\n"

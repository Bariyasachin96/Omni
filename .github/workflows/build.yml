          "            // ── Tai Le / New Tai Lue ───────────────────────────────────────────────────\n"
          "            cp in 0x1950..0x197F || cp in 0x1980..0x19DF -> \"khb\"\n"
          "            // ── Buginese ───────────────────────────────────────────────────────────────\n"
          "            cp in 0x1A00..0x1A1F -> \"bug\"\n"
          "            // ── Tai Tham (Lanna script — Northern Thai) ───────────────────────────────\n"

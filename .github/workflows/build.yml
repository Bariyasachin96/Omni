          "    // We surface only languages whose engine has actually been set by the user.\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    override fun onGetVoices(): MutableList<Voice> {\n"
          "        val list = mutableListOf<Voice>()\n"
          "        try {\n"
          "            for (iso in Languages.map.keys) {\n"
          "                if (prefs.getEngineForLanguage(iso) == \"NOT_SET\") continue\n"
          "                val locale = try { Locale.forLanguageTag(iso) } catch (_: Exception) { continue }\n"
          "                val voice = Voice(\n"
          "                    \"omni_$iso\",\n"
          "                    locale,\n"
          "                    400,                 // quality — matches original AutoTTS Voice ctor\n"
          "                    100,                 // latency — matches original AutoTTS Voice ctor\n"
          "                    false,\n"
          "                    emptySet()\n"
          "                )\n"
          "                list.add(voice)\n"
          "            }\n"
          "        } catch (e: Exception) { VhLogger.e(\"[SERVICE] onGetVoices failed: ${e.message}\") }\n"
          "        return list\n"
          "    }\n"
          "    private fun isKnownVoiceName(name: String?): Boolean {\n"
          "        if (name == null) return false\n"
          "        if (name.startsWith(\"omni_\")) return true\n"
          "        val iso = name.lowercase()\n"
          "        return Languages.map.containsKey(iso) && prefs.getEngineForLanguage(iso) != \"NOT_SET\"\n"
          "    }\n"
          "    override fun onIsValidVoiceName(name: String?): Int =\n"
          "        if (isKnownVoiceName(name)) TextToSpeech.SUCCESS else TextToSpeech.ERROR\n"
          "    override fun onLoadVoice(name: String?): Int =\n"
          "        if (isKnownVoiceName(name)) TextToSpeech.SUCCESS else TextToSpeech.ERROR\n"
          "    // build-41 multi-level kill switch\n"
          "    override fun onStop() {\n"
          "        VhLogger.markStop()\n"
          "        // Original Z(TRUE) hard-stop: both flags trip inside the SAME lock, then notifyAll.\n"
          "        // Wait predicate is (!isStopped && !isFlushed), so flipping both wakes the waiter\n"
          "        // and signals \"hard stop, no further chunks\".\n"
          "        synchronized(syncLock) {\n"
          "            isStopped = true                    // hard stop primary signal\n"
          "            isFlushed = true                    // matches original — both flags trip\n"
          "            syncLock.notifyAll()                // WAKE UP INSTANTLY\n"
          "        }\n"
          "        activeStop.get().set(true)              // signal current loop to abort\n"
          "        // BUNDLE-C ITEM 3: selective engine stop. Original AutoTtsService.e0(true) only\n"
          "        // calls .stop() on engines where isSpeaking() == true. We were unconditionally\n"
          "        // stopping every engine in the pool (5–10 wasted IPC calls per stop event when\n"
          "        // only 1 engine is actually mid-speech). isSpeaking() itself is a quick local check.\n"
          "        // Async via TtsStop thread (AutoTTS d0.java pattern): each stop() IPC is 5-50ms;\n"
          "        // running on the TTS framework thread causes 150-500ms blocks under TalkBack's\n"
          "        // 30/sec cancel bursts. Snapshot the speaking engines first, then dispatch async.\n"
          "        val engsToStop = enginePool.values.filter { try { it.isSpeaking } catch (_: Exception) { false } }\n"
          "        if (engsToStop.isNotEmpty()) {\n"
          "            stopExecutor.execute {\n"
          "                engsToStop.forEach { try { it.stop() } catch (_: Exception) {} }\n"
          "            }\n"
          "        }\n"
          "        stopForegroundSafe()                    // drop FG notification when nothing's being spoken\n"
          "    }\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    // Auto TTS class t2/l.g(CharSequence):ArrayList<l>  — EXACT PORT\n"
          "    // SpannableString + LocaleSpan splitter (TalkBack passes locale hints!)\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    private fun splitByLocaleSpans(input: CharSequence): MutableList<TextChunk> {\n"
          "        val result = mutableListOf<TextChunk>()\n"
          "        // Auto TTS field G — when true, use SpannableString detection\n"
          "        // Default true for mix mode\n"
          "        val span = SpannableString(input)\n"
          "        val spans = span.getSpans(0, span.length, LocaleSpan::class.java)\n"
          "        if (spans.isEmpty()) {\n"
          "            // No locale hints — whole text as UNKNOWN\n"
          "            result.add(TextChunk(input.toString(), \"UNKNOWN\"))\n"
          "            return result\n"
          "        }\n"
          "        var prevEnd = 0\n"
          "        for (ls in spans) {\n"
          "            val start = span.getSpanStart(ls)\n"
          "            val end   = span.getSpanEnd(ls)\n"
          "            if (start > prevEnd) {\n"
          "                val txt = span.subSequence(prevEnd, start).toString()\n"
          "                if (txt.isNotEmpty()) result.add(TextChunk(txt, \"UNKNOWN\"))\n"
          "            }\n"
          "            val txt = span.subSequence(start, end).toString()\n"
          "            val lang = ls.locale?.language ?: \"UNKNOWN\"\n"
          "            if (txt.isNotEmpty()) result.add(TextChunk(txt, lang))\n"
          "            prevEnd = end\n"
          "        }\n"
          "        if (prevEnd < span.length) {\n"
          "            val txt = span.subSequence(prevEnd, span.length).toString()\n"
          "            if (txt.isNotEmpty()) result.add(TextChunk(txt, \"UNKNOWN\"))\n"
          "        }\n"
          "        return result\n"
          "    }\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    // SENTENCE SEGMENTATION HELPER (used by all 3 reading modes)\n"
          "    // Uses java.text.BreakIterator which is Unicode-aware: respects sentence\n"
          "    // boundaries in Hindi (।), Chinese (。), Arabic (؟), etc. and avoids\n"
          "    // mid-word breaks. This is a significant upgrade over AutoTTS's\n"
          "    // fixed 64-char window approach (which breaks words/sentences mid-way).\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    private fun splitSentences(text: String): List<String> {\n"
          "        if (text.isBlank()) return emptyList()\n"
          "        val result = mutableListOf<String>()\n"
          "        try {\n"
          "            val iter = java.text.BreakIterator.getSentenceInstance()\n"
          "            iter.setText(text)\n"
          "            var st = iter.first(); var en = iter.next()\n"
          "            while (en != java.text.BreakIterator.DONE) {\n"
          "                val s = text.substring(st, en).trim()\n"
          "                if (s.isNotEmpty()) result.add(s)\n"
          "                st = en; en = iter.next()\n"
          "            }\n"
          "        } catch (t: Throwable) {\n"
          "            VhLogger.d(\"[SERVICE] splitSentences failed: ${t.message} — treating as single sentence\")\n"
          "            result.add(text.trim())\n"
          "        }\n"
          "        // Safety: if BreakIterator returned nothing usable, treat input as one sentence.\n"
          "        if (result.isEmpty()) result.add(text.trim())\n"
          "        return result\n"
          "    }\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    // Auto TTS clsCLD2.b(text, R, N, ctx):String — EXACT PORT\n"
          "    // Sliding window CLD2 detection + script-based fallback\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    private fun detectLanguage(text: String, latFall: String, nonLatFall: String): String {\n"
          "        if (text.isEmpty()) return \"UNKNOWN\"\n"
          "        val readingMode = prefs.getReadingMode()\n"
          "        // Auto TTS f6834S: disable_advanced_detection — skip CLD2, go straight to script detection.\n"
          "        if (!prefs.isDisableAdvancedDetection()) {\n"
          "        // Use NativeEngine for CLD2 detection — single chunk auto mode call\n"
          "        try {\n"
          "            val joined = text\n"
          "            val bytes = joined.toByteArray(Charsets.UTF_8)\n"
          "            val buf = ByteBuffer.allocateDirect(bytes.size)\n"
          "            buf.put(bytes); buf.position(0)\n"
          "            val out = NativeEngine.processDirect(\n"
          "                buf, bytes.size,\n"
          "                emptyArray(), emptyArray(),\n"
          "                false, false, false,\n"
          "                latFall, nonLatFall, \"auto\",\n"
          "                \"auto\", \"auto\", \"auto\"\n"
          "            )\n"
          "            // \"auto\" mode returns single chunk: \"lang|text\"\n"
          "            val parts = out.split(\"|\", limit = 2)\n"
          "            val cldResult = if (parts.size == 2 && parts[0].isNotBlank()) parts[0] else null\n"
          "            if (cldResult != null && (prefs.isAllLanguagesMode() || isEngineAvailable(cldResult))) return cldResult\n"
          "            // CLD2 returned a specific but disabled lang → smart script-family fallback (AutoTTS a.c() pattern)\n"
          "            if (cldResult != null && cldResult != \"UNKNOWN\") return smartLangFallback(cldResult, latFall, nonLatFall)\n"
          "        } catch (_: Exception) {}\n"
          "        } // end: !isDisableAdvancedDetection block\n"
          "        // Fallback: full Unicode script detection (port of Auto TTS AbstractC1135a)\n"
          "        // Use Character.codePointAt so supplementary chars (>U+FFFF) are handled as\n"
          "        // single codepoints rather than surrogate pairs — required for historic scripts.\n"
          "        var i = 0\n"
          "        while (i < text.length) {\n"
          "            val cp = Character.codePointAt(text, i)\n"
          "            i += Character.charCount(cp)\n"
          "            if (Character.isWhitespace(cp) || Character.isDigit(cp) || isLatinPunct(cp)) continue\n"
          "            val scriptLang = getScriptLang(cp)\n"
          "            if (scriptLang != null && isEngineAvailable(scriptLang)) return scriptLang\n"
          "            return if (cp in 0x0041..0x024F || cp in 0x1E00..0x1EFF) latFall else nonLatFall\n"
          "        }\n"
          "        return nonLatFall\n"
          "    }\n"
          "    // AbstractC1135a.m7780d() port — maps Unicode codepoint to primary language ISO code.\n"
          "    // Covers all major scripts. Returns null for Latin (handled by latFall).\n"
          "    private val scriptLangCache = ConcurrentHashMap<Int, String?>(1024)\n"
          "    private fun getScriptLang(cp: Int): String? {\n"
          "        scriptLangCache[cp]?.let { return it }\n"
          "        val lang: String? = when {\n"
          "            // ── Latin sub-detection: specific chars uniquely identify language ──────────\n"
          "            cp == 0x00F1 || cp == 0x00D1 -> \"es\"              // ñ Ñ → Spanish\n"
          "            cp == 0x00DF -> \"de\"                               // ß → German\n"
          "            cp == 0x0142 || cp == 0x0141 -> \"pl\"              // ł Ł → Polish\n"
          "            cp == 0x0151 || cp == 0x0150 || cp == 0x0171 || cp == 0x0170 -> \"hu\"  // ő Ő ű Ű → Hungarian\n"
          "            cp == 0x00E7 || cp == 0x00C7 -> pickEnabledLang(\"fr\", \"tr\", \"pt\") ?: \"fr\"  // ç Ç\n"
          "            cp == 0x0103 || cp == 0x0102 -> pickEnabledLang(\"ro\", \"vi\") ?: \"ro\"  // ă Ă\n"
          "            cp in 0x0041..0x024F -> null                       // Latin / Latin-Ext → latFall\n"
          "            cp in 0x1E00..0x1EFF -> \"vi\"                      // Latin Extended Additional (Vietnamese)\n"
          "            // ── Greek ──────────────────────────────────────────────────────────────────\n"
          "            cp in 0x0370..0x03FF || cp in 0x1F00..0x1FFF -> \"el\"\n"
          "            // ── Cyrillic (with sub-detection for unique chars) ──────────────────────────\n"
          "            cp in 0x0400..0x04FF -> when {\n"
          "                cp == 0x0404 || cp == 0x0456 || cp == 0x0407 || cp == 0x0457 || cp == 0x0490 || cp == 0x0491 -> \"uk\"\n"
          "                cp == 0x040C || cp == 0x045C -> \"mk\"           // Macedonian Ќ/ќ\n"
          "                cp == 0x042A || cp == 0x044A -> \"bg\"           // Bulgarian Ъ/ъ (er golam)\n"
          "                cp == 0x049A || cp == 0x049B || cp == 0x04D8 || cp == 0x04D9 ||\n"
          "                cp == 0x04A2 || cp == 0x04A3 || cp == 0x0492 || cp == 0x0493 ||\n"
          "                cp == 0x04B0 || cp == 0x04B1 || cp == 0x04AE || cp == 0x04AF -> \"kk\"  // Kazakh\n"
          "                cp == 0x0402 || cp == 0x0452 || cp == 0x0408 || cp == 0x0458 ||\n"
          "                cp == 0x0409 || cp == 0x0459 || cp == 0x040A || cp == 0x045A ||\n"
          "                cp == 0x040B || cp == 0x045B || cp == 0x040F || cp == 0x045F -> \"sr\"  // Serbian\n"
          "                cp == 0x0401 || cp == 0x0451 -> pickEnabledLang(\"ru\", \"be\") ?: \"ru\"  // Ё/ё\n"
          "                else -> pickEnabledLang(\"ru\", \"uk\", \"bg\", \"mk\", \"kk\", \"sr\", \"be\") ?: \"ru\"\n"
          "            }\n"
          "            // ── Syriac (0700–074F + 0860–086F) ────────────────────────────────────────\n"
          "            cp in 0x0700..0x074F || cp in 0x0860..0x086F -> \"syc\"\n"
          "            // ── Thaana / Dhivehi (FIX: was wrong range 0x1920, correct is 0x0780) ──────\n"
          "            cp in 0x0780..0x07BF -> \"dv\"\n"
          "            // ── NKo ────────────────────────────────────────────────────────────────────\n"
          "            cp in 0x07C0..0x07FF -> \"nqo\"\n"
          "            // ── Arabic (+ Extended-A 08A0–08FF now included) ──────────────────────────\n"
          "            cp in 0x0600..0x06FF || cp in 0x0750..0x077F || cp in 0x08A0..0x08FF ||\n"
          "            cp in 0xFB50..0xFDFF || cp in 0xFE70..0xFEFF || cp in 0x1EE00..0x1EEFF -> when {\n"
          "                cp == 0x0699 || cp == 0x06A9 || cp == 0x06CC || cp == 0x0686 || cp == 0x0698 -> \"fa\"\n"
          "                cp == 0x0679 || cp == 0x0688 || cp == 0x0691 || cp == 0x06BA || cp == 0x06C2 -> \"ur\"\n"
          "                cp == 0x0681 || cp == 0x0685 || cp == 0x0689 || cp == 0x068E || cp == 0x0693 -> \"ps\"\n"
          "                else -> pickEnabledLang(\"ar\", \"ur\", \"fa\", \"ps\") ?: \"ar\"\n"
          "            }\n"
          "            // ── Armenian ───────────────────────────────────────────────────────────────\n"
          "            cp in 0x0530..0x058F -> \"hy\"\n"
          "            // ── Hebrew (0590–05FF + FB1D–FB4F presentation forms only) ─────────────────\n"
          "            cp in 0x0590..0x05FF || cp in 0xFB1D..0xFB4F -> \"he\"\n"
          "            // ── Devanagari + Extended (A8E0–A8FF) ─────────────────────────────────────\n"
          "            cp in 0x0900..0x097F || cp in 0xA8E0..0xA8FF -> when { cp == 0x0933 -> \"mr\"; else -> \"hi\" }\n"
          "            // ── Bengali / Assamese ─────────────────────────────────────────────────────\n"
          "            cp in 0x0980..0x09FF -> \"bn\"\n"
          "            // ── Gurmukhi (Punjabi) ─────────────────────────────────────────────────────\n"
          "            cp in 0x0A00..0x0A7F -> \"pa\"\n"
          "            // ── Gujarati ───────────────────────────────────────────────────────────────\n"
          "            cp in 0x0A80..0x0AFF -> \"gu\"\n"
          "            // ── Odia ───────────────────────────────────────────────────────────────────\n"
          "            cp in 0x0B00..0x0B7F -> \"or\"\n"
          "            // ── Tamil (+ Supplement 11FC0–11FFF + Grantha 11300–1137F) ──────────────────\n"
          "            cp in 0x0B80..0x0BFF || cp in 0x11FC0..0x11FFF || cp in 0x11300..0x1137F -> \"ta\"\n"
          "            // ── Telugu ─────────────────────────────────────────────────────────────────\n"
          "            cp in 0x0C00..0x0C7F -> \"te\"\n"
          "            // ── Kannada ────────────────────────────────────────────────────────────────\n"
          "            cp in 0x0C80..0x0CFF -> \"kn\"\n"
          "            // ── Malayalam ──────────────────────────────────────────────────────────────\n"
          "            cp in 0x0D00..0x0D7F -> \"ml\"\n"
          "            // ── Sinhala (+ Archaic Numbers 111E0–111FF) ────────────────────────────────\n"
          "            cp in 0x0D80..0x0DFF || cp in 0x111E0..0x111FF -> \"si\"\n"
          "            // ── Thai ───────────────────────────────────────────────────────────────────\n"
          "            cp in 0x0E00..0x0E7F -> \"th\"\n"
          "            // ── Lao ────────────────────────────────────────────────────────────────────\n"
          "            cp in 0x0E80..0x0EFF -> \"lo\"\n"
          "            // ── Tibetan (+ Lisu A4D0 + Phags-pa A840 — both used in Tibetan contexts) ──\n"
          "            cp in 0x0F00..0x0FFF || cp in 0xA4D0..0xA4FF || cp in 0xA840..0xA87F -> \"bo\"\n"
          "            // ── Myanmar (main + Extended-A AA60 + Extended-B A9E0) ─────────────────────\n"

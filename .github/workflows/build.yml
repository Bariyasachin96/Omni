          inline int utf8ToCodepoint(const unsigned char* p, int& len) {
              if (p[0] < 0x80)               { len=1; return p[0]; }
              if ((p[0]&0xE0)==0xC0)         { len=2; return ((p[0]&0x1F)<<6)|(p[1]&0x3F); }
              if ((p[0]&0xF0)==0xE0)         { len=3; return ((p[0]&0x0F)<<12)|((p[1]&0x3F)<<6)|(p[2]&0x3F); }
              if ((p[0]&0xF8)==0xF0)         { len=4; return ((p[0]&0x07)<<18)|((p[1]&0x3F)<<12)|((p[2]&0x3F)<<6)|(p[3]&0x3F); }
              len=1; return p[0];
          }

          inline void codepointToUtf8(int cp, std::string& out) {
              if (cp<=0x7F)      { out+=(char)cp; }
              else if(cp<=0x7FF) { out+=(char)((cp>>6)|0xC0); out+=(char)((cp&0x3F)|0x80); }
              else if(cp<=0xFFFF){ out+=(char)((cp>>12)|0xE0); out+=(char)(((cp>>6)&0x3F)|0x80); out+=(char)((cp&0x3F)|0x80); }
              else               { out+=(char)((cp>>18)|0xF0); out+=(char)(((cp>>12)&0x3F)|0x80); out+=(char)(((cp>>6)&0x3F)|0x80); out+=(char)((cp&0x3F)|0x80); }
          }

          inline char mathUnicodeToAscii(int cp) {
              if(cp>=0x1D400&&cp<=0x1D419) return 'A'+(cp-0x1D400);
              if(cp>=0x1D434&&cp<=0x1D44D) return 'A'+(cp-0x1D434);
              if(cp>=0x1D468&&cp<=0x1D481) return 'A'+(cp-0x1D468);
              if(cp>=0x1D5A0&&cp<=0x1D5B9) return 'A'+(cp-0x1D5A0);
              if(cp>=0x1D670&&cp<=0x1D689) return 'A'+(cp-0x1D670);
              if(cp>=0x1D41A&&cp<=0x1D433) return 'a'+(cp-0x1D41A);
              if(cp>=0x1D44E&&cp<=0x1D467) return 'a'+(cp-0x1D44E);
              if(cp>=0x1D482&&cp<=0x1D49B) return 'a'+(cp-0x1D482);
              if(cp>=0x1D5BA&&cp<=0x1D5D3) return 'a'+(cp-0x1D5BA);
              if(cp>=0x1D68A&&cp<=0x1D6A3) return 'a'+(cp-0x1D68A);
              if(cp>=0xFF21&&cp<=0xFF3A)   return 'A'+(cp-0xFF21);
              if(cp>=0xFF41&&cp<=0xFF5A)   return 'a'+(cp-0xFF41);
              if(cp>=0x1D7CE&&cp<=0x1D7D7) return '0'+(cp-0x1D7CE);
              if(cp>=0xFF10&&cp<=0xFF19)   return '0'+(cp-0xFF10);
              return 0;
          }

          inline bool isEmoji(int cp) {
              return (cp>=0x1F300&&cp<=0x1F9FF)||(cp>=0x2600&&cp<=0x27BF)||
                     (cp>=0x2300&&cp<=0x23FF)||(cp>=0x2B50&&cp<=0x2B55)||
                     (cp>=0xFE00&&cp<=0xFE0F)||(cp>=0x1FA00&&cp<=0x1FAFF)||
                     (cp>=0x1F1E0&&cp<=0x1F1FF)||cp==0x200D||cp==0xFE0F;
          }

          inline bool isPunct(int cp) {
              return cp=='.'||cp=='!'||cp=='?'||cp==','||cp==';'||cp==':'||cp=='-'||cp=='*'||cp=='_'
                  ||cp=='='||cp=='+'||cp=='/'||cp=='\\'||cp=='|'||cp=='~'||cp=='^'
                  ||cp=='&'||cp=='@'||cp=='#'||cp=='$'||cp=='%'
                  ||cp=='('||cp==')'||cp=='['||cp==']'||cp=='{'||cp=='}'
                  ||cp=='<'||cp=='>'||cp=='"'||cp=='\'';
          }

          static std::string normalizeText(const std::string& input, bool keepEmoji, bool countEmoji, bool countPunct) {
              std::string result;
              result.reserve(input.size());
              int i=0, len=(int)input.size();
              while(i<len) {
                  int clen=0;
                  int cp=utf8ToCodepoint((const unsigned char*)&input[i], clen);
                  char ascii=mathUnicodeToAscii(cp);
                  if(ascii){ result+=ascii; i+=clen; continue; }
                  if(isEmoji(cp)) {
                      if(!keepEmoji){ i+=clen; continue; }
                      int eCount=1, j=i+clen;
                      while(j<len){ int nl=0; int nc=utf8ToCodepoint((const unsigned char*)&input[j],nl); if(nc==cp){eCount++;j+=nl;}else break; }
                      // BUGFIX: when count enabled, output "N <emoji>" once (not N copies).
                      // TTS engines speak the emoji name once; the count prefix tells the user
                      // there were multiple. Adding leading space ensures the number is read
                      // as a separate word (e.g. "Hello 7 face" not "Hello7 face").
                      if(countEmoji&&eCount>1) {
                          result+=" "+std::to_string(eCount)+" ";
                          codepointToUtf8(cp,result);
                      } else {
                          for(int k=0;k<eCount;k++) codepointToUtf8(cp,result);
                      }
                      i=j; continue;
                  }
                  if(isPunct(cp)&&countPunct) {
                      int pCount=1, j=i+clen;
                      while(j<len){ int nl=0; int nc=utf8ToCodepoint((const unsigned char*)&input[j],nl); if(nc==cp){pCount++;j+=nl;}else break; }
                      // BUGFIX: leading space before count for clean spoken output.
                      // "Hello======" → "Hello 6 =" (TTS reads "Hello 6 equals")
                      if(pCount>1) result+=" "+std::to_string(pCount)+" ";
                      codepointToUtf8(cp,result);
                      i=j; continue;
                  }
                  codepointToUtf8(cp,result);
                  i+=clen;
              }
              return result;
          }

          static std::string applyDictionary(std::string text, const std::vector<std::string>& keys, const std::vector<std::string>& vals) {
              for(size_t i=0;i<keys.size();i++){
                  if(keys[i].empty()) continue;
                  size_t pos=0;
                  while((pos=text.find(keys[i],pos))!=std::string::npos){
                      text.replace(pos,keys[i].size(),vals[i]);
                      pos+=vals[i].size();
                  }
              }
              return text;
          }

          static const char* scriptLookup(int cp) {
              for(int i=0; SCRIPT_BLOCKS[i].lang; i++)
                  if(cp>=SCRIPT_BLOCKS[i].start && cp<=SCRIPT_BLOCKS[i].end)
                      return SCRIPT_BLOCKS[i].lang;
              return nullptr;
          }

          inline bool isUnknownChar(int cp) {
              // Java Character.isWhitespace(): HT LF VT FF CR FS GS RS US SP
              // mirrors clsCLD2.a() which calls Character.isWhitespace(c3)
              if((cp>=0x09&&cp<=0x0D)||(cp>=0x1C&&cp<=0x1F)||cp==0x20) return true;
              // digits 0-9
              if(cp>=0x30&&cp<=0x39) return true;
              // clsCLD2.c() ASCII punct ranges exactly
              if(cp>=0x21&&cp<=0x2F) return true;  // ! " # $ % & ' ( ) * + , - . /
              if(cp>=0x3A&&cp<=0x40) return true;  // : ; < = > ? @
              if(cp>=0x5B&&cp<=0x60) return true;  // [ \ ] ^ _ `
              if(cp>=0x7B&&cp<=0x7E) return true;  // { | } ~
              return false;
          }

          static const char* scriptLookupChar(int cp) {
              if(cp<=0x007F) return "en";
              if(cp>=0x0080&&cp<=0x00FF) return "en";
              if(cp>=0x0100&&cp<=0x024F) return "en";
              return scriptLookup(cp);
          }

          inline bool isLatinChar(int cp) {
              return (cp>=0x0020&&cp<=0x007F)||
                     (cp>=0x0080&&cp<=0x024F)||
                     isUnknownChar(cp);
          }

          // Returns true for non-Latin codepoints that are NOT Unicode \p{L} (Letter category).
          // Used in flushBuf(bufKind==1) to mirror AutoTTS w.c() which uses Java \p{L} regex.
          static bool isNonLatinNonLetter(int cp) {
              // Non-Latin digit blocks (Unicode Nd — not \p{L})
              if(cp>=0x0660&&cp<=0x066B) return true;  // Arabic-Indic digits + decimal/thousands sep
              if(cp>=0x06F0&&cp<=0x06F9) return true;  // Extended Arabic-Indic digits
              if(cp>=0x07C0&&cp<=0x07C9) return true;  // NKo digits
              if(cp>=0x0966&&cp<=0x096F) return true;  // Devanagari digits
              if(cp>=0x09E6&&cp<=0x09EF) return true;  // Bengali digits
              if(cp>=0x0A66&&cp<=0x0A6F) return true;  // Gurmukhi digits
              if(cp>=0x0AE6&&cp<=0x0AEF) return true;  // Gujarati digits
              if(cp>=0x0B66&&cp<=0x0B6F) return true;  // Oriya digits
              if(cp>=0x0BE6&&cp<=0x0BEF) return true;  // Tamil digits
              if(cp>=0x0C66&&cp<=0x0C6F) return true;  // Telugu digits
              if(cp>=0x0CE6&&cp<=0x0CEF) return true;  // Kannada digits
              if(cp>=0x0D66&&cp<=0x0D6F) return true;  // Malayalam digits
              if(cp>=0x0E50&&cp<=0x0E59) return true;  // Thai digits
              if(cp>=0x0ED0&&cp<=0x0ED9) return true;  // Lao digits
              if(cp>=0x0F20&&cp<=0x0F29) return true;  // Tibetan digits
              if(cp>=0x1040&&cp<=0x1049) return true;  // Myanmar digits
              if(cp>=0x1090&&cp<=0x1099) return true;  // Myanmar Shan digits
              if(cp>=0x17E0&&cp<=0x17E9) return true;  // Khmer digits
              if(cp>=0x1810&&cp<=0x1819) return true;  // Mongolian digits
              if(cp>=0xFF10&&cp<=0xFF19) return true;  // Fullwidth digits (also pattern-b)
              // Combining marks (Unicode M category — not \p{L})
              if(cp>=0x0300&&cp<=0x036F) return true;  // Combining Diacritical Marks
              if(cp>=0x1DC0&&cp<=0x1DFF) return true;  // Combining Diacritical Marks Supplement
              if(cp>=0x20D0&&cp<=0x20FF) return true;  // Combining Diacritical Marks for Symbols
              // Non-Latin punct blocks (not in latRange, not \p{L})
              if(cp>=0x2E00&&cp<=0x2E7F) return true;  // Supplemental Punctuation
              if(cp>=0x3000&&cp<=0x303F) return true;  // CJK Symbols and Punctuation
              if(cp>=0xFE10&&cp<=0xFE6F) return true;  // Vertical Forms + CJK Compat + Small Forms
              return false;
          }

          // detectLang: Prioritize SCRIPT_BLOCKS array lookup; CLD2 only if everything is Neutral
          static std::string detectLang(const std::string& text, const std::string& latFall, const std::string& nonLatFall) {
              int len = (int)text.size();
              // PRIORITY 0: Micro-codepoint language hack — single-character markers that
              // unambiguously distinguish Marathi from Hindi (within Devanagari) and Assamese
              // from Bengali (within Bengali block). Run BEFORE the broad SCRIPT_BLOCKS scan
              // so e.g. "ळ" (U+0933) tags the whole phrase as "mr" rather than the default "hi".
              {
                  int i = 0;
                  while(i < len) {
                      int clen = 0;
                      int cp = utf8ToCodepoint((const unsigned char*)&text[i], clen);
                      if (cp == 0x0933) return "mr";                         // ळ — Marathi-only
                      if (cp == 0x09F0 || cp == 0x09F1) return "as";         // ৰ ৱ — Assamese-only
                      i += clen;
                  }
              }
              // PRIORITY 0.5: Latin/Cyrillic/Arabic micro-language detection via per-codepoint
              // accent table — ported from original AutoTTS's a.java::b(int). Distinguishes
              // fr/es/de/no/pl/cs/vi from accented Latin chars, uk/sr/bg/kk from Cyrillic
              // letters, and fa/ur/ps/sd/ku from Arabic letters. First match wins so e.g.
              // "café niño" → fr (because "é" comes before "ñ" — first match priority).
              {
                  int i = 0;
                  while(i < len) {
                      int clen = 0;
                      int cp = utf8ToCodepoint((const unsigned char*)&text[i], clen);
                      // ── Latin diacritics (Latin-1 Supplement + Latin Extended-A) ──
                      if (cp == 192 || cp == 194 || cp == 199 || cp == 200 || cp == 201 || cp == 202 || cp == 203
                          || cp == 206 || cp == 207 || cp == 212 || cp == 217 || cp == 219
                          || cp == 224 || cp == 226 || cp == 231 || cp == 232 || cp == 233 || cp == 234 || cp == 235
                          || cp == 238 || cp == 239 || cp == 244 || cp == 249 || cp == 251 || cp == 338 || cp == 339)
                          return "fr";
                      if (cp == 193 || cp == 205 || cp == 209 || cp == 211 || cp == 218
                          || cp == 225 || cp == 237 || cp == 241 || cp == 243 || cp == 250)
                          return "es";
                      if (cp == 196 || cp == 214 || cp == 220 || cp == 228 || cp == 246 || cp == 252 || cp == 223)
                          return "de";
                      if (cp == 197 || cp == 198 || cp == 216 || cp == 229 || cp == 230 || cp == 248)
                          return "no";
                      if (cp == 260 || cp == 261 || cp == 262 || cp == 263 || cp == 280 || cp == 281
                          || cp == 321 || cp == 322 || cp == 323 || cp == 324 || cp == 346 || cp == 347
                          || cp == 377 || cp == 378 || cp == 379 || cp == 380)
                          return "pl";
                      if (cp == 268 || cp == 269 || cp == 270 || cp == 271 || cp == 282 || cp == 283
                          || cp == 327 || cp == 328 || cp == 344 || cp == 345 || cp == 352 || cp == 353
                          || cp == 356 || cp == 357 || cp == 366 || cp == 367 || cp == 381 || cp == 382)
                          return "cs";
                      if ((cp >= 7840 && cp <= 7929) || cp == 272 || cp == 273
                          || cp == 416 || cp == 417 || cp == 431 || cp == 432)
                          return "vi";
                      // ── Cyrillic micro-language splits ──
                      if (cp == 1028 || cp == 1108 || cp == 1030 || cp == 1110 || cp == 1031 || cp == 1111
                          || cp == 1168 || cp == 1169)
                          return "uk";
                      if (cp == 1026 || cp == 1106 || cp == 1032 || cp == 1112 || cp == 1033 || cp == 1113
                          || cp == 1034 || cp == 1114 || cp == 1035 || cp == 1115 || cp == 1039 || cp == 1119)
                          return "sr";
                      if (cp == 1066 || cp == 1098)
                          return "bg";
                      if (cp == 1186 || cp == 1187 || cp == 1170 || cp == 1171 || cp == 1200 || cp == 1201
                          || cp == 1198 || cp == 1199 || cp == 1240 || cp == 1241)
                          return "kk";
                      // ── Arabic micro-language splits ──
                      if (cp == 1662 || cp == 1670 || cp == 1688 || cp == 1711)
                          return "fa";
                      if (cp == 1657 || cp == 1672 || cp == 1681 || cp == 1722 || cp == 1726 || cp == 1729 || cp == 1746)
                          return "ur";
                      if (cp == 1665 || cp == 1669 || cp == 1673 || cp == 1683 || cp == 1686 || cp == 1690
                          || cp == 1724 || cp == 1744)
                          return "ps";
                      if (cp >= 1658 && cp <= 1661)
                          return "sd";
                      if (cp == 1742 || cp == 1685 || cp == 1717 || cp == 1734 || cp == 1738 || cp == 1739)
                          return "ku";
                      i += clen;
                  }
              }
              // BUNDLE-Y ITEM 10: Common-word language refinement.
              // Before SCRIPT_BLOCKS resolves to a generic "ru"/"hi"/etc, scan for
              // language-distinctive function words (high-frequency particles, conjunctions,
              // pronouns) that disambiguate sibling languages within the same script.
              // Only triggers on TEXT WITH SPACES so we get word boundaries cheaply.
              // Single-word/no-space text falls through to SCRIPT_BLOCKS (current behaviour).
              // Conservative: needs ≥2 hits of the same language's marker to commit; otherwise
              // skipped so this never overrides correct script-based detection on its own.
              if (text.find(' ') != std::string::npos) {
                  // Build a lowercase ASCII-folded copy for fast scanning. Non-ASCII codepoints
                  // are passed through verbatim — Cyrillic/Devanagari markers below will match.
                  std::string lower;
                  lower.reserve(text.size());
                  for (size_t k = 0; k < text.size(); k++) {
                      unsigned char ch = (unsigned char)text[k];
                      if (ch >= 'A' && ch <= 'Z') lower += (char)(ch + 32);
                      else lower += (char)ch;
                  }
                  // helper: count occurrences of " word " in " lower " (with leading/trailing space
                  // so boundaries work). Returns count of distinct positions.
                  auto countWord = [&](const char* w) -> int {
                      std::string needle = " ";
                      needle += w;
                      needle += " ";
                      std::string hay = " ";
                      hay += lower;
                      hay += " ";
                      int c = 0;
                      size_t pos = 0;
                      while ((pos = hay.find(needle, pos)) != std::string::npos) {
                          c++;
                          pos += needle.size() - 1;  // -1 so overlapping " a b " can still trigger
                      }
                      return c;
                  };
                  // Marathi-distinctive vs Hindi: "ahe" (आहे), "tya" (त्या), "ka" (का), "ani" (आणि)
                  // — but those won't appear in Latin form. We need Devanagari markers.
                  // Top distinctive Marathi function words in native script:
                  int mr = countWord("आहे") + countWord("होते") + countWord("त्या") + countWord("आणि");
                  int hi = countWord("है") + countWord("था") + countWord("और") + countWord("नहीं");
                  if (mr >= 2 && mr > hi) return "mr";
                  if (hi >= 2 && hi > mr) return "hi";
                  // Ukrainian-distinctive vs Russian: "що" (that), "це" (this), "не" appears in both,
                  // but "є" (is) and "та" (and) are Ukrainian-leaning, "и" (and) is Russian.
                  int uk = countWord("що") + countWord("це") + countWord("та");
                  int ru = countWord("что") + countWord("это") + countWord("как");
                  if (uk >= 2 && uk > ru) return "uk";
                  if (ru >= 2 && ru > uk) return "ru";
                  // Spanish-distinctive vs Italian (when neither has triggered the diacritic
                  // detection above — usually means no accents present, so disambiguation needed).
                  // Spanish: "que", "los", "las", "para"; Italian: "che", "gli", "del", "una"
                  int es = countWord("que") + countWord("los") + countWord("para");
                  int it = countWord("che") + countWord("gli") + countWord("del");
                  if (es >= 2 && es > it) return "es";
                  if (it >= 2 && it > es) return "it";
              }
              // PRIORITY 1: Scan codepoints and return the first non-Neutral language from SCRIPT_BLOCKS
              int i = 0;
              while(i < len) {
                  int clen = 0;
                  int cp = utf8ToCodepoint((const unsigned char*)&text[i], clen);
                  if(!isUnknownChar(cp)) {
                      const char* sl = scriptLookup(cp);
                      if (sl && strcmp(sl, "Neutral") != 0) {
                          return std::string(sl);
                      }
                  }
                  i += clen;
              }
              // PRIORITY 2: Everything was Neutral / unknown — try CLD2 as a last resort
              const int WINDOW = 64;
              i = 0;
              while(i < len) {
                  int byteStart = i;
                  int charCount = 0;
                  int j = i;
                  while(j < len && charCount < WINDOW) {
                      int clen = 0;
                      utf8ToCodepoint((const unsigned char*)&text[j], clen);
                      j += clen;
                      charCount++;
                  }
                  bool is_rel = false;
                  CLD2::Language lang = CLD2::DetectLanguage(text.c_str() + byteStart, j - byteStart, true, &is_rel);
                  const char* code = CLD2::LanguageCode(lang);
                  if(code && strlen(code) >= 2 && strcmp(code, "un") != 0 && strcmp(code, "xx") != 0 && strcmp(code, "Unknown") != 0) {
                      return std::string(code);
                  }
                  i = j;
              }
              // PRIORITY 3: Final fallback by Latin/Non-Latin classification
              i = 0;
              while(i < len) {
                  int clen = 0;
                  int cp = utf8ToCodepoint((const unsigned char*)&text[i], clen);
                  if(!isUnknownChar(cp)) {
                      if (isLatinChar(cp)) return latFall;
                      return nonLatFall;
                  }
                  i += clen;
              }
              return nonLatFall;
          }

          struct ChunkResult { std::string lang; std::string text; };

          // ISO 639-3 → ISO 639-1 normalization: CLD2 occasionally returns 3-letter codes.
          // Must run immediately after every CLD2 call so all internal comparisons use 2-letter codes.
          static std::string normalizeLangCode(const std::string& code) {
              if (code.size() <= 2) return code;
              static const char* tbl[][2] = {
                  {"zho","zh"},{"hin","hi"},{"ben","bn"},{"ara","ar"},{"por","pt"},
                  {"rus","ru"},{"jpn","ja"},{"kor","ko"},{"deu","de"},{"fra","fr"},
                  {"ita","it"},{"spa","es"},{"nld","nl"},{"tur","tr"},{"pol","pl"},
                  {"vie","vi"},{"fas","fa"},{"tha","th"},{"ind","id"},{"msa","ms"},
                  {"ukr","uk"},{"ces","cs"},{"ron","ro"},{"hun","hu"},{"swe","sv"},
                  {"nor","no"},{"dan","da"},{"fin","fi"},{"ell","el"},{"bul","bg"},
                  {"hrv","hr"},{"slk","sk"},{"slv","sl"},{"srp","sr"},{"mkd","mk"},
                  {"lit","lt"},{"lav","lv"},{"est","et"},{"afr","af"},{"cat","ca"},
                  {"tam","ta"},{"tel","te"},{"mal","ml"},{"kan","kn"},{"guj","gu"},
                  {"mar","mr"},{"pan","pa"},{"urd","ur"},{"nep","ne"},{"sin","si"},
                  {"khm","km"},{"lao","lo"},{"mya","my"},{"amh","am"},{"bod","bo"},
                  {"ori","or"},{"kat","ka"},{"hye","hy"},{"kaz","kk"},{"mon","mn"},
                  {"uzb","uz"},{"heb","he"},{"swa","sw"},{"zul","zu"},{"yor","yo"},
                  {"jav","jv"},{"sun","su"},{"wel","cy"},{"gle","ga"},{"glg","gl"},
                  {"eus","eu"},{"bos","bs"},{"mlt","mt"},{"isl","is"},{"sqi","sq"},
                  {nullptr,nullptr}
              };
              for (int i = 0; tbl[i][0]; i++)
                  if (code == tbl[i][0]) return tbl[i][1];
              return code;
          }

          // Latin-script language check (mirrors Kotlin isLatinScript).
          static bool isLatinScriptLang(const std::string& lang) {
              static const char* lat[] = {
                  "en","fr","de","es","it","pt","nl","sv","da","no","nb","nn",
                  "fi","pl","cs","ro","hu","sk","sl","hr","lt","lv","et","tr",
                  "vi","af","ca","cy","eu","ga","gl","is","lb","mt","sq","sw",
                  "tl","id","ms","bs","az","uz","tk","ky",nullptr
              };
              for (int i = 0; lat[i]; i++) if (lang == lat[i]) return true;
              return false;
          }

          // Auto mode: WHOLE TEXT DETECTION. No length limits. Return as ONE single chunk.
          static std::vector<ChunkResult> buildAutoChunks(const std::vector<std::string>& sentences, const std::string& latFall, const std::string& nonLatFall, bool disableAdvancedDetection) {
              std::vector<ChunkResult> chunks;
              std::string fullText = "";
              for(auto& s: sentences) {
                  if(!s.empty()) {
                      if(!fullText.empty()) fullText += " ";
                      fullText += s;
                  }
              }
              if(fullText.empty()) return chunks;
              std::string dominantLang;
              {
                  bool is_rel = false;
                  CLD2::Language cld2Lang = CLD2::DetectLanguage(fullText.c_str(), (int)fullText.size(), true, &is_rel);
                  const char* code = CLD2::LanguageCode(cld2Lang);
                  if (code && strlen(code) >= 2 && strcmp(code,"un")!=0 && strcmp(code,"xx")!=0)
                      dominantLang = normalizeLangCode(std::string(code));
              }
              // disable_advanced_detection=true: trust CLD2 result blindly, skip codepoint fallback
              if (dominantLang.empty() && !disableAdvancedDetection)
                  dominantLang = detectLang(fullText, latFall, nonLatFall);
              if (dominantLang.empty()) dominantLang = latFall;
              chunks.push_back({dominantLang, fullText});
              return chunks;
          }

          // AutoTTS w.java algorithm: Latin-range runs (cp<=0x024F) vs non-Latin runs.
          // Runs with letters=type1(Latin text), digits/punct-only=type3(neutral), non-Latin=type2.
          // Context-resolve type3: backward scan for non-first segments, forward for first (w.a/w.b).
          static std::vector<ChunkResult> buildMixChunks(const std::vector<std::string>& sentences, const std::string& latFall, const std::string& nonLatFall, const std::string& puncFall, const std::string& numFall, const std::string& emojiFall, const std::string& neutralDefault, bool disableAdvancedDetection) {
              std::vector<ChunkResult> result;

              std::string fullText;
              for (auto& s : sentences) { if (!s.empty()) fullText += s + " "; }
              if (fullText.empty()) return result;

              // Fix A: trim + collapse whitespace (AutoTTS trim().replaceAll("\\s+", " ")).
              // Java \\s = ASCII 0x09-0x0D, 0x20 only.
              {
                  // Trim leading
                  size_t fs = fullText.find_first_not_of(" \t\n\r\x0B\x0C");
                  if (fs == std::string::npos) return result;
                  fullText = fullText.substr(fs);
                  // Trim trailing
                  size_t fe = fullText.find_last_not_of(" \t\n\r\x0B\x0C");
                  if (fe != std::string::npos) fullText = fullText.substr(0, fe + 1);
                  // Collapse internal runs
                  std::string collapsed; collapsed.reserve(fullText.size());
                  bool prevWs = false;
                  for (unsigned char c : fullText) {
                      bool iw = (c == ' ' || c == '\t' || c == '\n' || c == '\r' || c == '\x0B' || c == '\x0C');
                      if (iw) { if (!prevWs) collapsed += ' '; prevWs = true; }
                      else { collapsed += (char)c; prevWs = false; }
                  }
                  fullText = std::move(collapsed);
              }
              if (fullText.empty()) return result;

              // Fix 1: Remove BiDi control characters (AutoTTS w.f() / pattern-e).
              // U+061C Arabic Letter Mark, U+200E LRM, U+200F RLM, U+202A-U+202E directional.
              // These break Latin/non-Latin boundary detection for Arabic/Hebrew/Urdu text.
              {
                  std::string clean;
                  int fi = 0, flen = (int)fullText.size();
                  while (fi < flen) {
                      int cl = 0;
                      int cp2 = utf8ToCodepoint((const unsigned char*)&fullText[fi], cl);
                      if (cp2 == 0x061C || cp2 == 0x200E || cp2 == 0x200F ||
                          (cp2 >= 0x202A && cp2 <= 0x202E)) { fi += cl; continue; }
                      clean += fullText.substr(fi, cl);
                      fi += cl;
                  }
                  fullText = clean;
              }
              if (fullText.empty()) return result;

              // type: -1=forced, 0=whitespace-only, 1=Latin text, 2=non-Latin,
              //        3=neutral(has digits), 4=punct-only(no digits)
              struct Seg { std::string text; int type; std::string lang; };
              std::vector<Seg> segs;

              // Phase 1: scan into Latin-range vs non-Latin runs; forced overrides per character
              {
                  std::string buf;
                  int bufKind = -1; // 0=latin_range, 1=non_latin

                  auto flushBuf = [&]() {
                      if (buf.empty()) return;
                      if (bufKind == 1) {
                          // AutoTTS w.c(): non-Latin buffer classified same as Latin.
                          // \p{L} letter → type-2; fullwidth digits (pattern b) → type-3; else → type-4
                          bool allWs = true, hasNonLatLetter = false, hasFFDigit = false;
                          {
                              const unsigned char* ap = (const unsigned char*)buf.c_str();
                              int ai = 0, alen = (int)buf.size();
                              while (ai < alen) {
                                  int cl2 = 0;
                                  int cp3 = utf8ToCodepoint(ap + ai, cl2);
                                  bool isJWs = (cp3 >= 0x09 && cp3 <= 0x0D) || (cp3 >= 0x1C && cp3 <= 0x1F) ||
                                               cp3 == 0x20 || cp3 == 0x1680 ||
                                               (cp3 >= 0x2000 && cp3 <= 0x200A && cp3 != 0x2007) ||
                                               cp3 == 0x205F || cp3 == 0x3000 ||
                                               cp3 == 0x2028 || cp3 == 0x2029;
                                  if (!isJWs) allWs = false;
                                  if (cp3 >= 0xFF10 && cp3 <= 0xFF19) hasFFDigit = true;
                                  else if (!isJWs && !isNonLatinNonLetter(cp3)) hasNonLatLetter = true;
                                  ai += cl2;
                              }
                          }
                          segs.push_back({buf, allWs ? 0 : (hasNonLatLetter ? 2 : (hasFFDigit ? 3 : 4)), ""});
                      } else {
                          bool allWs = true, hasLetter = false, hasDigit = false;
                          const unsigned char* p = (const unsigned char*)buf.c_str();
                          int blen = (int)buf.size(), j = 0;
                          while (j < blen) {
                              int cl = 0;
                              int cp2 = utf8ToCodepoint(p + j, cl);
                              // Fix C: use codepoint (not first byte) for allWs + Java Character.isWhitespace() set
                              { bool isJWs = (cp2 >= 0x09 && cp2 <= 0x0D) || (cp2 >= 0x1C && cp2 <= 0x1F) ||
                                             cp2 == 0x20 || cp2 == 0x1680 ||
                                             (cp2 >= 0x2000 && cp2 <= 0x200A && cp2 != 0x2007) ||
                                             cp2 == 0x205F || cp2 == 0x3000 ||
                                             cp2 == 0x2028 || cp2 == 0x2029;
                                if (!isJWs) allWs = false; }
                              // AutoTTS w.c(): emoji counts as "letter" (type 1) not neutral
                              // Also covers Latin Extended Additional (U+1E00-U+1EFF, Vietnamese),
                              // Latin Extended-C (U+2C60-U+2C7F), Latin Extended-D (U+A720-U+A7FF)
                              if ((cp2 >= 'a' && cp2 <= 'z') || (cp2 >= 'A' && cp2 <= 'Z') ||
                                  (cp2 >= 0x00C0 && cp2 <= 0x024F) ||
                                  (cp2 >= 0x1E00 && cp2 <= 0x1EFF) ||
                                  (cp2 >= 0x2C60 && cp2 <= 0x2C7F) ||
                                  (cp2 >= 0xA720 && cp2 <= 0xA7FF) ||
                                  isEmoji(cp2))
                                  hasLetter = true;
                              // Fix D: track digits + AutoTTS pattern-b extras: °(0x00B0) ×(0x00D7) ÷(0x00F7) currency(0x20A0-0x20CF)
                              if ((cp2 >= '0' && cp2 <= '9') || (cp2 >= 0xFF10 && cp2 <= 0xFF19) ||
                                  cp2 == 0x00B0 || cp2 == 0x00D7 || cp2 == 0x00F7 ||
                                  (cp2 >= 0x20A0 && cp2 <= 0x20CF))
                                  hasDigit = true;
                              j += cl;
                          }
                          // type 3=has digits, type 4=punct-only(no digits) — mirrors AutoTTS w.c()
                          segs.push_back({buf, allWs ? 0 : (hasLetter ? 1 : (hasDigit ? 3 : 4)), ""});
                      }
                      buf.clear(); bufKind = -1;
                  };

                  int len = (int)fullText.size(), i = 0;
                  while (i < len) {
                      int clen = 0;
                      int cp = utf8ToCodepoint((const unsigned char*)&fullText[i], clen);
                      // Latin range — AutoTTS w.java pattern `d` exactly:
                      //   U+0000-U+024F: Basic Latin + Latin-1 + Latin Extended A/B
                      //   U+1E00-U+1EFF: Latin Extended Additional (Vietnamese: ắ, ề, ổ...)
                      //   U+2000-U+206F: General Punctuation / math symbols
                      //   U+20A0-U+20CF: Currency Symbols (€, ₹, ₩, ₽...)
                      //   U+2C60-U+2C7F: Latin Extended-C
                      //   U+A720-U+A7FF: Latin Extended-D
                      // Emoji are NOT in AutoTTS latRange — they go to non-Latin buffer (kind=1)
                      bool latRange = (cp <= 0x024F) ||
                                      (cp >= 0x1E00 && cp <= 0x1EFF) ||
                                      (cp >= 0x2000 && cp <= 0x206F) ||
                                      (cp >= 0x20A0 && cp <= 0x20CF) ||
                                      (cp >= 0x2C60 && cp <= 0x2C7F) ||
                                      (cp >= 0xA720 && cp <= 0xA7FF);
                      int kind = latRange ? 0 : 1;
                      if (bufKind == -1 || bufKind == kind) { buf += fullText.substr(i, clen); bufKind = kind; }
                      else { flushBuf(); buf = fullText.substr(i, clen); bufKind = kind; }
                      i += clen;
                  }
                  flushBuf();
              }

              // Merge pass — AutoTTS w.java Step 5: merge consecutive same-type segments,
              // absorbing whitespace (type-0) into the surrounding run. This produces large
              // merged non-Latin segments so CLD2 gets enough text to detect reliably.
              // Without this, individual Hindi words (2-5 chars) fool CLD2 into returning "en".
              {
                  std::vector<Seg> merged2;
                  int mi = 0, mtotal = (int)segs.size();
                  while (mi < mtotal) {
                      std::string mtext = segs[mi].text;
                      int mtype = segs[mi].type;
                      int mj = mi + 1;
                      while (mj < mtotal && segs[mj].type != -1 &&
                             (segs[mj].type == mtype || segs[mj].type == 0)) {
                          mtext += segs[mj].text;
                          mj++;
                      }
                      merged2.push_back({mtext, mtype, ""});
                      mi = mj;
                  }
                  segs = std::move(merged2);
              }

              if (segs.empty()) return result;

              // AutoTTS clsCLD2.b(): CLD2 in 64-char windows, return first non-UNKNOWN result.
              // Returns "" if all windows return UNKNOWN.
              auto cld2Detect64 = [](const std::string& text) -> std::string {
                  int slen = (int)text.size(), idx = 0;
                  while (idx < slen) {
                      int windowStart = idx, charCount = 0;
                      while (idx < slen && charCount < 64) {
                          int cl = 0;
                          utf8ToCodepoint((const unsigned char*)text.c_str() + idx, cl);
                          idx += cl; charCount++;
                      }
                      bool is_rel = false;
                      CLD2::Language cld2Lang = CLD2::DetectLanguage(
                          text.c_str() + windowStart, idx - windowStart, true, &is_rel);
                      const char* code = CLD2::LanguageCode(cld2Lang);
                      if (code && strlen(code) >= 2 && strcmp(code,"un")!=0 && strcmp(code,"xx")!=0)
                          return normalizeLangCode(std::string(code));
                  }
                  return "";
              };

              // Phase 2: assign languages to type-1 and type-2 segments
              // MISSING-A: disableAdvancedDetection=true → trust CLD2 blindly (AutoTTS S flag)
              for (auto& seg : segs) {
                  if (seg.type == 1) {
                      std::string detected = cld2Detect64(seg.text);
                      if (disableAdvancedDetection) {
                          // S=true: accept any CLD2 result without script filtering
                          seg.lang = detected.empty() ? latFall : detected;
                      } else {
                          // For Latin segments: reject non-Latin CLD2 results
                          seg.lang = (!detected.empty() && isLatinScriptLang(detected)) ? detected : latFall;
                      }
                  } else if (seg.type == 2) {
                      // AutoTTS: emoji-only non-Latin segment → emojiFall (mirrors puncFall/numFall)
                      if (!emojiFall.empty() && emojiFall != "auto") {
                          bool hasAny = false, allEmoji = true;
                          const unsigned char* ep = (const unsigned char*)seg.text.c_str();
                          int ei = 0, elen = (int)seg.text.size();
                          while (ei < elen) {
                              int cl = 0; int cp3 = utf8ToCodepoint(ep + ei, cl);
                              bool isWs = (cp3>=0x09&&cp3<=0x0D)||(cp3>=0x1C&&cp3<=0x1F)||cp3==0x20;
                              if (!isWs) { hasAny = true; if (!isEmoji(cp3)) { allEmoji = false; break; } }
                              ei += cl;
                          }
                          if (hasAny && allEmoji) { seg.lang = emojiFall; continue; }
                      }
                      std::string detected = cld2Detect64(seg.text);
                      if (disableAdvancedDetection) {
                          // S=true: accept CLD2 result directly
                          seg.lang = detected.empty() ? nonLatFall : detected;
                      } else if (!detected.empty() && !isLatinScriptLang(detected)) {
                          seg.lang = detected;
                      } else {
                          seg.lang = detectLang(seg.text, latFall, nonLatFall);
                      }
                  }
              }

              // Phase 3: resolve type-3 (digits) and type-4 (punct-only) neutral segments.
              // AutoTTS w.g() n3/n4 branches: when numFall/puncFall IS set, the whole
              // segment gets that lang directly — no context scan. When NOT set, use
              // w.a() (forward, pre-real) or w.b() (backward-only, post-real). w.b has
              // NO forward fallback; truly unresolved neutrals fall to neutralDefault.
              bool seenReal = false;
              for (int k = 0; k < (int)segs.size(); k++) {
                  int t = segs[k].type;
                  if (t == 1 || t == 2) { seenReal = true; continue; }
                  if (t != 3 && t != 4) continue;
                  if (t == 4 && !puncFall.empty() && puncFall != "auto") {
                      // AutoTTS w.g() n4 != 0: pure-punct segment → puncFall directly
                      segs[k].lang = puncFall;
                  } else if (t == 3 && !numFall.empty() && numFall != "auto") {
                      // AutoTTS w.g() n3 != 0: digit/neutral segment → numFall directly
                      segs[k].lang = numFall;
                  } else {
                      // AutoTTS w.a (forward, pre-real) / w.b (backward-only, post-real)
                      std::string resolved;
                      if (!seenReal) {
                          for (int f = k + 1; f < (int)segs.size() && resolved.empty(); f++)
                              if (segs[f].type == 1 || segs[f].type == 2) resolved = segs[f].lang;
                      } else {
                          for (int b = k - 1; b >= 0 && resolved.empty(); b--)
                              if (segs[b].type == 1 || segs[b].type == 2) resolved = segs[b].lang;
                      }
                      // Unresolved → neutralDefault: (sysLocale==nonLat) ? nonLat : lat
                      segs[k].lang = resolved.empty() ? neutralDefault : resolved;
                  }
                  segs[k].type = 1; // mark resolved so subsequent backward scans can find it
              }

              // Phase 4: emit output, merge consecutive same-lang, attach whitespace-only to prev
              for (auto& seg : segs) {
                  // Whitespace-only check using full Java isWhitespace set (mirrors flushBuf isJWs)
                  bool wsOnly = true;
                  {
                      const unsigned char* wp = (const unsigned char*)seg.text.c_str();
                      int wi = 0, wlen = (int)seg.text.size();
                      while (wi < wlen) {
                          int cl = 0; int cp4 = utf8ToCodepoint(wp + wi, cl);
                          bool isJWs = (cp4>=0x09&&cp4<=0x0D)||(cp4>=0x1C&&cp4<=0x1F)||
                                       cp4==0x20||cp4==0x1680||
                                       (cp4>=0x2000&&cp4<=0x200A&&cp4!=0x2007)||
                                       cp4==0x205F||cp4==0x3000||
                                       cp4==0x2028||cp4==0x2029;
                          if (!isJWs) { wsOnly = false; break; }
                          wi += cl;
                      }
                  }
                  if (wsOnly) {
                      if (!result.empty()) result.back().text += seg.text;
                      continue;
                  }
                  std::string lang = seg.lang.empty() ? latFall : seg.lang;
                  if (!result.empty() && result.back().lang == lang) result.back().text += seg.text;
                  else result.push_back({lang, seg.text});
              }

              if (!result.empty()) {
                  auto& t = result.back().text;
                  while (!t.empty()) {
                      unsigned char last = (unsigned char)t.back();
                      if (last == 0x20 || (last >= 0x09 && last <= 0x0D) || (last >= 0x1C && last <= 0x1F))
                          t.pop_back();
                      else break;
                  }
              }
              return result;
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_com_easyvoice_tts_NativeEngine_verifyToken(JNIEnv* env, jobject, jbyteArray h) {
              if (!h || env->GetArrayLength(h) != 32) { g_ok = false; return JNI_FALSE; }
              jbyte* b = env->GetByteArrayElements(h, nullptr);
              if (!b) { g_ok = false; return JNI_FALSE; }
              uint8_t ex[32]; s_exp(ex);
              bool ok = true;
              for (int i = 0; i < 32; i++) if ((uint8_t)b[i] != ex[i]) { ok = false; break; }
              env->ReleaseByteArrayElements(h, b, JNI_ABORT);
              g_ok = ok;
              return ok ? JNI_TRUE : JNI_FALSE;
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_easyvoice_tts_NativeEngine_processDirect(
              JNIEnv* env, jobject, jobject directBuffer, jint length,
              jobjectArray jKeys, jobjectArray jVals,
              jboolean keepEmoji, jboolean countEmoji, jboolean countPunct,
              jstring jLat, jstring jNonLat, jstring jMode,
              jstring jPunc, jstring jNum, jstring jEmoji,
              jstring jNeutralDefault, jboolean jDisableAdvancedDetection)
          {
              // Integrity gate — checked in JNI_OnLoad; no Kotlin path can bypass this
              if(!g_ok) return env->NewStringUTF("");
              if(!directBuffer||length<=0) return env->NewStringUTF("");
              void* buf=env->GetDirectBufferAddress(directBuffer);
              if(!buf) return env->NewStringUTF("");
              std::string rawInput((const char*)buf,(size_t)length);

              const char* latC=env->GetStringUTFChars(jLat,nullptr); std::string latFall(latC); env->ReleaseStringUTFChars(jLat,latC);
              const char* nonLatC=env->GetStringUTFChars(jNonLat,nullptr); std::string nonLatFall(nonLatC); env->ReleaseStringUTFChars(jNonLat,nonLatC);
              const char* modeC=env->GetStringUTFChars(jMode,nullptr); std::string mode(modeC); env->ReleaseStringUTFChars(jMode,modeC);
              const char* puncC=env->GetStringUTFChars(jPunc,nullptr); std::string puncFall(puncC); env->ReleaseStringUTFChars(jPunc,puncC);
              const char* numC=env->GetStringUTFChars(jNum,nullptr); std::string numFall(numC); env->ReleaseStringUTFChars(jNum,numC);
              const char* emojiC=env->GetStringUTFChars(jEmoji,nullptr); std::string emojiFall(emojiC); env->ReleaseStringUTFChars(jEmoji,emojiC);
              const char* ndC=env->GetStringUTFChars(jNeutralDefault,nullptr); std::string neutralDefault(ndC); env->ReleaseStringUTFChars(jNeutralDefault,ndC);
              bool disableAdvancedDetection = (jDisableAdvancedDetection == JNI_TRUE);

              std::vector<std::string> keys,vals;
              int dictSize=env->GetArrayLength(jKeys);
              for(int i=0;i<dictSize;i++){
                  jstring jk=(jstring)env->GetObjectArrayElement(jKeys,i); const char* kc=env->GetStringUTFChars(jk,nullptr); keys.push_back(kc); env->ReleaseStringUTFChars(jk,kc); env->DeleteLocalRef(jk);
                  jstring jv=(jstring)env->GetObjectArrayElement(jVals,i); const char* vc=env->GetStringUTFChars(jv,nullptr); vals.push_back(vc); env->ReleaseStringUTFChars(jv,vc); env->DeleteLocalRef(jv);
              }

              std::vector<std::string> sentences;
              size_t start=0, end=rawInput.find('\0');
              while(end!=std::string::npos){ sentences.push_back(rawInput.substr(start,end-start)); start=end+1; end=rawInput.find('\0',start); }
              if(start<rawInput.size()) sentences.push_back(rawInput.substr(start));

              std::vector<std::string> processed; processed.reserve(sentences.size());
              for(auto& s: sentences){
                  if(s.empty()){ processed.push_back(""); continue; }
                  // Processing pipeline order:
                  //   1. applyDictionary    — user-defined word replacements
                  //   2. normalizeText      — emoji / punct / math-unicode normalisation
                  // Note: expandAcronyms was removed in v17.x — caused regressions on TalkBack
                  // content where engines (Eloquence, Vocalizer, Google) already have built-in
                  // acronym pronunciation. Original AutoTTS also doesn't expand acronyms.
                  auto d = applyDictionary(s, keys, vals);
                  d = normalizeText(d, keepEmoji, countEmoji, countPunct);
                  processed.push_back(d);
              }

              std::string result;
              if (mode == "mix") {
                  auto chunks = buildMixChunks(processed, latFall, nonLatFall, puncFall, numFall, emojiFall, neutralDefault, disableAdvancedDetection);
                  for(size_t i=0; i<chunks.size(); i++){ result += chunks[i].lang + "|" + chunks[i].text; if(i+1 < chunks.size()) result += "||"; }
              } else {
                  auto chunks = buildAutoChunks(processed, latFall, nonLatFall, disableAdvancedDetection);
                  for(size_t i=0; i<chunks.size(); i++){ result += chunks[i].lang + "|" + chunks[i].text; if(i+1 < chunks.size()) result += "||"; }
              }
              return env->NewStringUTF(result.c_str());
          }
          """)


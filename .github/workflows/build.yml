          "            // var-ref assignment executes, leaving ref=null inside the lambda.\n"
          "            val holder = arrayOfNulls<android.speech.tts.TextToSpeech>(1)\n"
          "            holder[0] = android.speech.tts.TextToSpeech(context, { status ->\n"
          "                if (status == android.speech.tts.TextToSpeech.SUCCESS) {\n"
          "                    val tts = holder[0]\n"
          "                    // Merge voices + availableLanguages so engines like Eloquence show all\n"
          "                    // supported locales (e.g. en-GB, en-AU) not just installed ones (e.g. en-US).\n"
          "                    // distinctBy uses raw language+country fields to avoid toLanguageTag()\n"
          "                    // normalization mismatches between 3-letter codes (eng/GBR) vs 2-letter (en/GB).\n"
          "                    val fromVoices: List<java.util.Locale> = try {\n"
          "                        tts?.voices?.map { it.locale }?.filter { localeMatchesIso(it) } ?: listOf()\n"
          "                    } catch (_: Exception) { listOf() }\n"
          "                    val fromAvail: List<java.util.Locale> = try {\n"
          "                        tts?.availableLanguages?.filter { localeMatchesIso(it) } ?: listOf()\n"
          "                    } catch (_: Exception) { listOf() }\n"
          "                    availableLocales = (fromVoices + fromAvail)\n"
          "                        .distinctBy { it.language.lowercase() + \"_\" + it.country.lowercase() }\n"
          "                        .sortedBy { it.displayName }\n"
          "                    if (selLocTag.isNotEmpty()) {\n"
          "                        availableVoiceNames = try { tts?.voices?.filter { v -> try { localeMatchesIso(v.locale) && v.locale.toLanguageTag() == selLocTag } catch (_: Exception) { false } }?.map { it.name }?.sorted() ?: listOf() } catch (_: Exception) { listOf() }\n"
          "                    }\n"
          "                    // AutoTTS NewSettingsActivity auto-select pattern: when user assigns a new engine\n"
          "                    // for a language that has no saved locale pref yet, automatically pick the\n"
          "                    // highest quality non-network voice. Strategy: local > network, then quality desc.\n"
          "                    // This mirrors AutoTTS's D0() auto-fill behaviour in the settings activity.\n"
          "                    val savedLocForNewEng = prefs.getLocaleForLangPkg(iso, selEngPkg)\n"
          "                    if (savedLocForNewEng.isEmpty() && availableLocales.isNotEmpty()) {\n"
          "                        val allVoices = try { tts?.voices?.toList() } catch (_: Exception) { null }\n"
          "                        if (!allVoices.isNullOrEmpty()) {\n"
          "                            val best = allVoices\n"
          "                                .filter { v -> try { localeMatchesIso(v.locale) } catch (_: Exception) { false } }\n"
          "                                .sortedWith(compareBy(\n"
          "                                    { if (it.isNetworkConnectionRequired()) 1 else 0 },\n"
          "                                    { -it.quality }\n"
          "                                )).firstOrNull()\n"
          "                            if (best != null) {\n"
          "                                val bestTag = best.locale.toLanguageTag()\n"
          "                                prefs.setLocaleForLangPkg(iso, selEngPkg, bestTag)\n"
          "                                prefs.setVoiceName(iso, best.name)\n"
          "                                selLocTag = bestTag\n"
          "                                availableVoiceNames = allVoices\n"
          "                                    .filter { try { it.locale.toLanguageTag() == bestTag } catch (_: Exception) { false } }\n"
          "                                    .map { it.name }.sorted()\n"
          "                            }\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }, selEngPkg)\n"
          "            setTts(holder[0])\n"
          "        } else { availableLocales = listOf(); availableVoiceNames = listOf(); ttsHolder()?.shutdown(); setTts(null) }\n"
          "    }\n"
          "    LaunchedEffect(selLocTag) {\n"
          "        val tts = ttsHolder()\n"
          "        availableVoiceNames = if (tts != null && selLocTag.isNotEmpty())\n"
          "            try { tts.voices?.filter { try { it.locale.toLanguageTag() == selLocTag } catch (_: Exception) { false } }?.map { it.name }?.sorted() ?: listOf() } catch (_: Exception) { listOf() }\n"
          "        else listOf()\n"
          "    }\n"
          "    LaunchedEffect(iso, engines) {\n"
          "        compatibleEngines = null\n"
          "        val compatible = mutableListOf<String>()\n"
          "        for (eng in engines) {\n"
          "            val has = withTimeoutOrNull(2000L) {\n"
          "                suspendCancellableCoroutine<Boolean> { cont ->\n"
          "                    val h2 = arrayOfNulls<android.speech.tts.TextToSpeech>(1)\n"
          "                    h2[0] = android.speech.tts.TextToSpeech(context, { st2 ->\n"
          "                        var found = false\n"
          "                        if (st2 == android.speech.tts.TextToSpeech.SUCCESS) {\n"
          "                            val t2 = h2[0]\n"
          "                            found = try { t2?.availableLanguages?.any { localeMatchesIso(it) } ?: false } catch (_: Exception) { false }\n"
          "                            if (!found) found = try { t2?.voices?.any { localeMatchesIso(it.locale) } ?: false } catch (_: Exception) { false }\n"
          "                        }\n"
          "                        try { h2[0]?.shutdown() } catch (_: Exception) {}\n"
          "                        if (!cont.isCompleted) cont.resumeWith(Result.success(found))\n"
          "                    }, eng.pkg)\n"
          "                }\n"
          "            } ?: false\n"
          "            if (has) compatible.add(eng.pkg)\n"
          "        }\n"
          "        compatibleEngines = compatible\n"
          "    }\n"
          "    val selVoiceOptions = listOf(\"*Default\") + availableVoiceNames\n"
          "    Column(modifier = Modifier.fillMaxSize()) {\n"
          "        Row(modifier = Modifier.fillMaxWidth().padding(start = 4.dp, top = 8.dp, end = 16.dp, bottom = 8.dp), verticalAlignment = Alignment.CenterVertically) {\n"
          "            IconButton(onClick = onBack) { Icon(Icons.Filled.ArrowBack, contentDescription = \"Back\") }\n"
          "            Text(\"$langName ($iso)\", style = MaterialTheme.typography.titleLarge, modifier = Modifier.weight(1f))\n"
          "        }\n"
          "        Divider()\n"
          "        Column(modifier = Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(16.dp)) {\n"
          "            val displayEngines = compatibleEngines?.let { compat -> engines.filter { it.pkg in compat } }?.takeIf { it.isNotEmpty() } ?: engines\n"
          "            AccessibleDropdown(\"TTS Engine\", displayEngines.find { it.pkg == selEngPkg }?.name ?: engines.find { it.pkg == selEngPkg }?.name ?: \"Not Set\", displayEngines.map { it.name }) { idx ->\n"
          "                selEngPkg = displayEngines[idx].pkg; val curLoc = prefs.getLocaleForLangPkg(iso, selEngPkg); prefs.setLocaleForLangPkg(iso, selEngPkg, curLoc); selLocTag = curLoc\n"
          "            }\n"
          "            if (compatibleEngines == null) Text(\"Scanning compatible engines...\", style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(start = 4.dp, bottom = 4.dp))\n"
          "            val locNames = availableLocales.map { it.displayName }.ifEmpty { listOf(\"Default System Voice\") }\n"
          "            val selLocKey = try { java.util.Locale.forLanguageTag(selLocTag).let { \"${it.language}_${it.country}\".lowercase() } } catch (_: Exception) { \"\" }\n"
          "            AccessibleDropdown(\"Voice / Locale\", availableLocales.find { it.toLanguageTag() == selLocTag || \"${it.language}_${it.country}\".lowercase() == selLocKey }?.displayName ?: \"Default System Voice\", locNames) { idx ->\n"
          "                if (availableLocales.isNotEmpty()) { selLocTag = availableLocales[idx].toLanguageTag(); prefs.setLocaleForLangPkg(iso, selEngPkg, selLocTag) }\n"
          "            }\n"
          "            AccessibleDropdown(\"Voice Variant\", selVoiceName, selVoiceOptions) { idx ->\n"
          "                selVoiceName = selVoiceOptions[idx]; prefs.setVoiceName(iso, selVoiceName)\n"
          "            }\n"
          "            Spacer(modifier = Modifier.height(16.dp))\n"
          "            TtsSliderRow(\n"
          "                displayText=if(rate==100) \"Speech Rate: System Default\" else \"Speech Rate: ${String.format(java.util.Locale.US,\"%.2f\",rate/100f)}x\",\n"
          "                value=rate, onValueChange={ rate=it },\n"
          "                valueRange=10f..500f, maxValue=500,\n"
          "                decreaseDesc=\"Decrease Speech Rate\", increaseDesc=\"Increase Speech Rate\",\n"
          "                minValue=10\n"
          "            )\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            TtsSliderRow(\n"
          "                displayText=if(pitch==100) \"Pitch: System Default\" else \"Pitch: ${String.format(java.util.Locale.US,\"%.2f\",pitch/100f)}x\",\n"
          "                value=pitch, onValueChange={ pitch=it },\n"
          "                valueRange=10f..200f, maxValue=200,\n"
          "                decreaseDesc=\"Decrease Pitch\", increaseDesc=\"Increase Pitch\",\n"
          "                minValue=10\n"
          "            )\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            TtsSliderRow(\n"
          "                displayText=if(vol==100) \"Volume: System Default\" else \"Volume: $vol%\",\n"
          "                value=vol, onValueChange={ vol=it },\n"
          "                valueRange=10f..100f, maxValue=100,\n"
          "                decreaseDesc=\"Decrease Volume\", increaseDesc=\"Increase Volume\",\n"
          "                minValue=10\n"
          "            )\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            OutlinedButton(onClick = {\n"
          "                rate = 100; pitch = 100; vol = 100\n"
          "                prefs.setInt(\"${prefs.toIso3(iso)}_speed\", 100); prefs.setInt(\"${prefs.toIso3(iso)}_pitch\", 100); prefs.setInt(\"${prefs.toIso3(iso)}_volume\", 100)\n"
          "            }, modifier = Modifier.fillMaxWidth()) { Text(\"Reset to Default (Rate / Pitch / Volume)\") }\n"
          "            Spacer(modifier = Modifier.height(12.dp))\n"
          "            Button(onClick = {\n"
          "                val pkg = if(selEngPkg == \"NOT_SET\") null else selEngPkg\n"
          "                ttsHolder()?.shutdown()\n"
          "                var ref: android.speech.tts.TextToSpeech? = null\n"
          "                ref = android.speech.tts.TextToSpeech(context, { status ->\n"
          "                    if(status == android.speech.tts.TextToSpeech.SUCCESS) {\n"
          "                        try { ref?.language = java.util.Locale.forLanguageTag(selLocTag.ifEmpty { iso }) } catch(_: Exception) {}\n"
          "                        ref?.setSpeechRate(rate/100f); ref?.setPitch(pitch/100f)\n"
          "                        val p = android.os.Bundle(); p.putFloat(android.speech.tts.TextToSpeech.Engine.KEY_PARAM_VOLUME, vol/100f)\n"
          "                        val sampleText = SampleTexts.get(iso)\n"
          "                        ref?.speak(sampleText, android.speech.tts.TextToSpeech.QUEUE_FLUSH, p, \"test\")\n"
          "                    }\n"
          "                }, pkg)\n"
          "                setTts(ref)\n"
          "            }, modifier = Modifier.fillMaxWidth()) { Text(\"TEST AUDIO\") }\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "        }\n"
          "        Button(\n"
          "            onClick = {\n"
          "                prefs.setLocaleForLangPkg(iso, selEngPkg, selLocTag)\n"
          "                prefs.setVoiceName(iso, selVoiceName)\n"
          "                prefs.setInt(\"${prefs.toIso3(iso)}_speed\", rate)\n"
          "                prefs.setInt(\"${prefs.toIso3(iso)}_pitch\", pitch)\n"
          "                prefs.setInt(\"${prefs.toIso3(iso)}_volume\", vol)\n"
          "                Toast.makeText(context, \"Saved!\", Toast.LENGTH_SHORT).show()\n"
          "                onBack()\n"
          "            },\n"
          "            modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 12.dp)\n"
          "        ) { Text(\"SAVE\") }\n"
          "    }\n"
          "}\n"
          "\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// AdditionalTabContent — 3rd tab: toggles + battery + dictionary + system TTS + logs\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "@Composable\n"
          "@OptIn(ExperimentalMaterial3Api::class)\n"
          "private fun HomeTabContent(prefs: SharedPrefsManager, onDetailOpenChange: (Boolean) -> Unit = {}) {\n"
          "    val context = LocalContext.current\n"
          "    val clipboardManager = LocalClipboardManager.current\n"
          "    var readingMode by remember { mutableStateOf(prefs.getReadingMode().let { if (it == \"mix\") \"mix\" else \"auto\" }) }\n"
          "    var emojiReading by remember { mutableStateOf(prefs.getBoolean(\"emoji_reading\", true)) }\n"
          "    var emojiCount by remember { mutableStateOf(prefs.getBoolean(\"emoji_count\", false)) }\n"
          "    var punctCount by remember { mutableStateOf(prefs.getBoolean(\"punct_count\", false)) }\n"
          "    var dictEnabled by remember { mutableStateOf(prefs.getBoolean(\"dict_enabled\", false)) }\n"
          "    var btCarMode by remember { mutableStateOf(prefs.isBluetoothCarMode()) }\n"
          "    var brokenProt by remember { mutableStateOf(prefs.isBrokenEngineProtector()) }\n"
          "    var forceAccessibility by remember { mutableStateOf(prefs.isForceAccessibilityStream()) }\n"
          "    var showNotification by remember { mutableStateOf(prefs.isShowNotification()) }\n"
          "    var googleTtsOnly by remember { mutableStateOf(prefs.isGoogleTtsOnly()) }\n"
          "    var dedicatedEng by remember { mutableStateOf(prefs.isDedicatedEnginesEnabled()) }\n"
          "    var localeSpans by remember { mutableStateOf(prefs.isLocaleSpansEnabled()) }\n"
          "    var disableAdvancedDet by remember { mutableStateOf(prefs.isDisableAdvancedDetection()) }\n"
          "    var allLangMode by remember { mutableStateOf(prefs.isAllLanguagesMode()) }\n"
          "    var loggingEnabledState by remember { mutableStateOf(prefs.isLoggingEnabled()) }\n"
          "    val powerManager = remember { context.getSystemService(android.content.Context.POWER_SERVICE) as PowerManager }\n"
          "    var batteryUnrestricted by remember {\n"
          "        mutableStateOf(\n"
          "            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M)\n"
          "                powerManager.isIgnoringBatteryOptimizations(context.packageName)\n"
          "            else true\n"
          "        )\n"
          "    }\n"
          "    var latLangIso by remember { mutableStateOf(prefs.getString(\"mixed_mode_latin_language\", \"en\")) }\n"
          "    var nonLatLangIso by remember { mutableStateOf(prefs.getString(\"mixed_mode_non_latin_language\", \"hi\")) }\n"
          "    var mixNumLang by remember { mutableStateOf(prefs.getString(\"mix_num_lang\", \"auto\")) }\n"
          "    var mixPuncLang by remember { mutableStateOf(prefs.getString(\"mix_punc_lang\", \"auto\")) }\n"
          "    var mixEmojiLang by remember { mutableStateOf(prefs.getString(\"mix_emoji_lang\", \"auto\")) }\n"
          "    var selectedCategory by remember { mutableStateOf<String?>(null) }\n"
          "    LaunchedEffect(selectedCategory) { onDetailOpenChange(selectedCategory != null) }\n"
          "    if (selectedCategory != null) {\n"
          "        BackHandler { selectedCategory = null }\n"
          "        Column(modifier = Modifier.fillMaxSize()) {\n"
          "            Row(modifier = Modifier.fillMaxWidth().padding(start = 4.dp, top = 8.dp, end = 16.dp, bottom = 8.dp), verticalAlignment = Alignment.CenterVertically) {\n"
          "                IconButton(onClick = { selectedCategory = null }) { Icon(Icons.Filled.ArrowBack, contentDescription = \"Back\") }\n"
          "                Text(selectedCategory!!, style = MaterialTheme.typography.titleLarge, modifier = Modifier.weight(1f))\n"
          "            }\n"
          "            Divider()\n"
          "            Column(modifier = Modifier.padding(16.dp).verticalScroll(rememberScrollState())) {\n"
          "                when (selectedCategory) {\n"
          "                    \"Reading\" -> {\n"
          "                        ToggleRow(\"Emoji Reading\", \"Read emojis aloud\", emojiReading) { emojiReading = it; prefs.setBoolean(\"emoji_reading\", it) }\n"
          "                        ToggleRow(\"Repeated Emoji Count\", \"Count repeated emojis\", emojiCount) { emojiCount = it; prefs.setBoolean(\"emoji_count\", it) }\n"
          "                        ToggleRow(\"Repeated Punctuation Count\", \"Count repeated punctuation\", punctCount) { punctCount = it; prefs.setBoolean(\"punct_count\", it) }\n"
          "                        ToggleRow(\"Enable Dictionary\", \"Use custom pronunciations\", dictEnabled) { dictEnabled = it; prefs.setBoolean(\"dict_enabled\", it) }\n"
          "                    }\n"
          "                    \"Language Detection\" -> {\n"
          "                        ToggleRow(\"Google TTS Only\", \"Send all text to Google TTS\", googleTtsOnly) { googleTtsOnly = it; prefs.setGoogleTtsOnly(it) }\n"
          "                        ToggleRow(\"All Languages Mode\", \"Route all detected languages\", allLangMode) { allLangMode = it; prefs.setAllLanguagesMode(it) }\n"
          "                        ToggleRow(\"Disable CLD2 Detection\", \"Use script detection only\", disableAdvancedDet) { disableAdvancedDet = it; prefs.setDisableAdvancedDetection(it) }\n"
          "                        ToggleRow(\"TalkBack Locale Hints\", \"Use TalkBack locale hints in Mix mode\", localeSpans) { localeSpans = it; prefs.setLocaleSpansEnabled(it) }\n"
          "                    }\n"
          "                    \"Audio & Engine\" -> {\n"
          "                        ToggleRow(\"Bluetooth Car Mode\", \"Route TTS via Bluetooth SCO\", btCarMode) { btCarMode = it; prefs.setBluetoothCarMode(it) }\n"
          "                        ToggleRow(\"Force Accessibility Stream\", \"Use accessibility audio stream\", forceAccessibility) { forceAccessibility = it; prefs.setForceAccessibilityStream(it) }\n"
          "                        ToggleRow(\"Show Notification\", \"Show notification while active\", showNotification) { showNotification = it; prefs.setShowNotification(it) }\n"
          "                        ToggleRow(\"Broken Engine Protector\", \"Fix crashes in buggy engines\", brokenProt) { brokenProt = it; prefs.setBrokenEngineProtector(it) }\n"
          "                        ToggleRow(\"Dedicated Engines\", \"Strict language-to-engine mapping\", dedicatedEng) { dedicatedEng = it; prefs.setDedicatedEnginesEnabled(it) }\n"
          "                    }\n"
          "                    \"Default Languages\" -> {\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        AccessibleDropdown(\"Default Latin / Primary\", \"${Languages.map[latLangIso] ?: latLangIso} ($latLangIso)\", Languages.displayNames) { idx ->\n"
          "                            latLangIso = Languages.isoCodes[idx]; prefs.setString(\"mixed_mode_latin_language\", latLangIso)\n"
          "                        }\n"
          "                        AccessibleDropdown(\"Default Non-Latin / Secondary\", \"${Languages.map[nonLatLangIso] ?: nonLatLangIso} ($nonLatLangIso)\", Languages.displayNames) { idx ->\n"
          "                            nonLatLangIso = Languages.isoCodes[idx]; prefs.setString(\"mixed_mode_non_latin_language\", nonLatLangIso)\n"
          "                        }\n"
          "                        if (readingMode == \"mix\") {\n"
          "                            Spacer(modifier = Modifier.height(16.dp))\n"
          "                            Text(\"Special Content Routing\", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.primary)\n"
          "                            Spacer(modifier = Modifier.height(4.dp))\n"
          "                            Text(\"Which engine reads numbers, punctuation and emojis in Mix mode.\", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "                            Spacer(modifier = Modifier.height(8.dp))\n"
          "                            val routingOpts = listOf(\"Auto (follow text)\") + Languages.displayNames\n"
          "                            val routingCodes = listOf(\"auto\") + Languages.isoCodes\n"
          "                            AccessibleDropdown(\"Numbers\", if (mixNumLang == \"auto\") \"Auto (follow text)\" else \"${Languages.map[mixNumLang] ?: mixNumLang} ($mixNumLang)\", routingOpts) { idx ->\n"
          "                                mixNumLang = routingCodes[idx]; prefs.setString(\"mix_num_lang\", mixNumLang)\n"
          "                            }\n"
          "                            AccessibleDropdown(\"Punctuation\", if (mixPuncLang == \"auto\") \"Auto (follow text)\" else \"${Languages.map[mixPuncLang] ?: mixPuncLang} ($mixPuncLang)\", routingOpts) { idx ->\n"
          "                                mixPuncLang = routingCodes[idx]; prefs.setString(\"mix_punc_lang\", mixPuncLang)\n"
          "                            }\n"
          "                            AccessibleDropdown(\"Emoji\", if (mixEmojiLang == \"auto\") \"Auto (follow text)\" else \"${Languages.map[mixEmojiLang] ?: mixEmojiLang} ($mixEmojiLang)\", routingOpts) { idx ->\n"
          "                                mixEmojiLang = routingCodes[idx]; prefs.setString(\"mix_emoji_lang\", mixEmojiLang)\n"
          "                            }\n"
          "                        }\n"
          "                    }\n"
          "                    \"Background Reliability\" -> {\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        Text(\n"
          "                            if (batteryUnrestricted) \"Easy Voice is exempt from battery optimization.\"\n"
          "                            else \"Android may kill Easy Voice mid-speech. Select \\\"Unrestricted\\\" to keep background TTS working.\",\n"
          "                            style = MaterialTheme.typography.bodyMedium,\n"
          "                            color = MaterialTheme.colorScheme.onSurfaceVariant\n"
          "                        )\n"
          "                        Spacer(modifier = Modifier.height(12.dp))\n"
          "                        Button(\n"
          "                            onClick = {\n"
          "                                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {\n"
          "                                    try {\n"
          "                                        context.startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK })\n"
          "                                    } catch (e: Exception) {\n"
          "                                        try {\n"
          "                                            context.startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse(\"package:${context.packageName}\")).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK })\n"
          "                                        } catch (_: Exception) {\n"
          "                                            Toast.makeText(context, \"Cannot open battery settings\", Toast.LENGTH_SHORT).show()\n"
          "                                        }\n"
          "                                    }\n"
          "                                    batteryUnrestricted = powerManager.isIgnoringBatteryOptimizations(context.packageName)\n"
          "                                }\n"
          "                            },\n"
          "                            modifier = Modifier.fillMaxWidth(),\n"
          "                            colors = if (batteryUnrestricted)\n"
          "                                ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.surfaceVariant, contentColor = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "                            else\n"
          "                                ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary)\n"
          "                        ) {\n"
          "                            Text(if (batteryUnrestricted) \"BATTERY EXEMPTION ACTIVE\" else \"DISABLE BATTERY OPTIMIZATION\")\n"
          "                        }\n"
          "                    }\n"
          "                    \"Tools\" -> {\n"
          "                        ToggleRow(\"Enable Logging\", \"Enable logging for tracing issues\", loggingEnabledState) { loggingEnabledState = it; prefs.setLoggingEnabled(it); VhLogger.setLoggingEnabled(it) }\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        Button(onClick = {\n"
          "                            try {\n"
          "                                val logFile = VhLogger.exportToFile()\n"
          "                                val uri = FileProvider.getUriForFile(context, \"${context.packageName}.provider\", logFile)\n"
          "                                context.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = \"text/plain\"; putExtra(Intent.EXTRA_STREAM, uri); putExtra(Intent.EXTRA_SUBJECT, \"Easy Voice Log\"); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION) }, \"Share Log\"))\n"
          "                            } catch (e: Exception) { Toast.makeText(context, \"Log export failed: ${e.message}\", Toast.LENGTH_SHORT).show() }\n"
          "                        }, modifier = Modifier.fillMaxWidth()) { Text(\"SHARE LOGS\") }\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        Button(onClick = { VhLogger.clear(); Toast.makeText(context, \"Logs cleared\", Toast.LENGTH_SHORT).show() }, modifier = Modifier.fillMaxWidth()) { Text(\"CLEAR LOGS\") }\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        Button(onClick = { context.startActivity(Intent(context, DictionaryActivity::class.java).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) }, modifier = Modifier.fillMaxWidth()) { Text(\"MANAGE DICTIONARY\") }\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        Button(onClick = { context.startActivity(Intent(\"com.android.settings.TTS_SETTINGS\").apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) }, modifier = Modifier.fillMaxWidth()) { Text(\"OPEN SYSTEM TTS SETTINGS\") }\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        Button(onClick = {\n"
          "                            try {\n"
          "                                val logText = VhLogger.exportToFile().readText()\n"
          "                                clipboardManager.setText(AnnotatedString(logText))\n"
          "                                Toast.makeText(context, \"Log copied to clipboard!\", Toast.LENGTH_SHORT).show()\n"
          "                            } catch (e: Exception) { Toast.makeText(context, \"Failed to copy: ${e.message}\", Toast.LENGTH_SHORT).show() }\n"
          "                        }, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.secondary)) { Text(\"COPY DEBUG LOG\") }\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "    } else {\n"
          "        Column(modifier = Modifier.padding(16.dp).verticalScroll(rememberScrollState())) {\n"
          "            Spacer(modifier = Modifier.height(4.dp))\n"
          "            ElevatedCard(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {\n"
          "                Column(modifier = Modifier.padding(16.dp)) {\n"
          "                    Text(\"Reading Mode\", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.primary)\n"
          "                    Spacer(modifier = Modifier.height(8.dp))\n"
          "                    Row(\n"
          "                        modifier = Modifier.fillMaxWidth().toggleable(value = readingMode == \"auto\", onValueChange = { if (it) { readingMode = \"auto\"; prefs.setReadingMode(\"auto\") } }, role = androidx.compose.ui.semantics.Role.Checkbox),\n"
          "                        verticalAlignment = Alignment.CenterVertically\n"
          "                    ) {\n"
          "                        Checkbox(checked = readingMode == \"auto\", onCheckedChange = null)\n"
          "                        Spacer(modifier = Modifier.width(8.dp))\n"
          "                        Text(\"Auto Mode\", style = MaterialTheme.typography.bodyLarge)\n"
          "                    }\n"
          "                    Row(\n"
          "                        modifier = Modifier.fillMaxWidth().toggleable(value = readingMode == \"mix\", onValueChange = { if (it) { readingMode = \"mix\"; prefs.setReadingMode(\"mix\") } }, role = androidx.compose.ui.semantics.Role.Checkbox),\n"
          "                        verticalAlignment = Alignment.CenterVertically\n"
          "                    ) {\n"
          "                        Checkbox(checked = readingMode == \"mix\", onCheckedChange = null)\n"
          "                        Spacer(modifier = Modifier.width(8.dp))\n"
          "                        Text(\"Mix Mode\", style = MaterialTheme.typography.bodyLarge)\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            listOf(\n"
          "                \"Reading\" to \"Emoji, punctuation, dictionary\",\n"
          "                \"Language Detection\" to \"Google TTS, CLD2, locale hints\",\n"
          "                \"Audio & Engine\" to \"Bluetooth, notifications, engine mode\",\n"
          "                \"Default Languages\" to \"Primary, secondary, mix routing\",\n"
          "                \"Background Reliability\" to \"Battery optimization\",\n"
          "                \"Tools\" to \"Dictionary, log, system settings\"\n"
          "            ).forEach { (title, subtitle) ->\n"
          "                ElevatedCard(onClick = { selectedCategory = title }, modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {\n"
          "                    Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {\n"
          "                        Column(modifier = Modifier.weight(1f)) {\n"
          "                            Text(title, style = MaterialTheme.typography.titleMedium)\n"
          "                            Text(subtitle, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "                        }\n"
          "                        Icon(Icons.Filled.ChevronRight, contentDescription = null, tint = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            Spacer(modifier = Modifier.height(16.dp))\n"
          "        }\n"
          "    }\n"
          "}\n"
          "\n"
          "@Composable\n"
          "private fun ToggleRow(title: String, description: String, checked: Boolean, onCheckedChange: (Boolean) -> Unit) {\n"
          "    Row(\n"
          "        modifier = Modifier\n"
          "            .fillMaxWidth()\n"
          "            .toggleable(\n"
          "                value = checked,\n"
          "                onValueChange = onCheckedChange,\n"
          "                role = androidx.compose.ui.semantics.Role.Switch\n"
          "            )\n"
          "            .padding(vertical = 12.dp),\n"
          "        verticalAlignment = Alignment.CenterVertically\n"
          "    ) {\n"
          "        Column(modifier = Modifier.weight(1f)) {\n"
          "            Text(title, style = MaterialTheme.typography.titleMedium)\n"
          "            Text(description, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "        }\n"
          "        Spacer(modifier = Modifier.width(16.dp))\n"
          "        Switch(checked = checked, onCheckedChange = null)\n"
          "    }\n"
          "}\n"
          "\n"

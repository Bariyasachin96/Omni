              else if(primary=="ur"&&(cp==0x0679||cp==0x0688||cp==0x0691||cp==0x06C1||cp==0x06D2)) fallbacks={"pa"};
              else if(primary=="ja"&&((cp>=0x3040&&cp<=0x309F)||(cp>=0x1B000&&cp<=0x1B12F))) fallbacks={};
              else if(primary=="en"&&(cp>=0x10400&&cp<=0x1044F)) fallbacks={};
              else fallbacks = scriptLangFallbacksC(primary);
              std::string fbres = javaFamilyFallback(primary, fallbacks, enabled);
              if(!fbres.empty()){
                  if(lb) *lb += std::string("[SCRIPT] getScriptLangFiltered cp=U+")+hex+" primary="+primary+" → fallback="+fbres+" (k.o ok, java-order)\n";
                  return fbres;
              }
              if(lb) *lb += std::string("[SCRIPT] getScriptLangFiltered cp=U+")+hex+" primary="+primary+" → null (no enabled fallback found)\n";
              return "";

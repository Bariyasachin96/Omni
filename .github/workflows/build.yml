          static bool cld3ScriptConsistent(const std::string& detected, const std::string& u8){
              int i=0, n=(int)u8.size();
              std::string winScript;
              while(i<n){
                  int len=0; int cp=utf8ToCodepoint((const unsigned char*)u8.data()+i, len); if(len<=0) len=1;
                  if(!isJavaWsCp(cp) && !(cp>='0'&&cp<='9') && !isLatinPunctCp(cp)){
                      const char* sc=scriptLangC(cp);
                      if(sc && *sc && strcmp(sc,"zz")!=0){ winScript=sc; break; }
                  }
                  i+=len;
              }
              if(winScript.empty()) return false;
              std::vector<std::string> latinFamily = scriptLangFallbacksC("en");
              auto isLatinSide=[&](const std::string& l){ if(l=="en") return true; for(const auto& f: latinFamily) if(f==l) return true; return false; };
              return isLatinSide(winScript)==isLatinSide(detected);

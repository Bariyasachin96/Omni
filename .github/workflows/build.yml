          "                    var dict by remember { mutableStateOf(prefs.getDict()) }\n"
          "                    var from by remember { mutableStateOf(\"\") }\n"
          "                    var to by remember { mutableStateOf(\"\") }\n"
          "                    Column(modifier = Modifier.padding(16.dp)) {\n"
          "                        Text(\"Dictionary\", style = MaterialTheme.typography.headlineSmall)\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        Text(\"Add words you want the TTS to pronounce differently. Enter the original word and its custom pronunciation.\", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "                        Spacer(modifier = Modifier.height(16.dp))\n"
          "                        OutlinedTextField(value=from, onValueChange={from=it}, label={Text(\"Current Word\")}, modifier=Modifier.fillMaxWidth().semantics{contentDescription=\"Input Current Word\"})\n"
          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        OutlinedTextField(value=to, onValueChange={to=it}, label={Text(\"Replace With\")}, modifier=Modifier.fillMaxWidth().semantics{contentDescription=\"Input Replace With\"})\n"
          "                        Spacer(modifier = Modifier.height(16.dp))\n"
          "                        Row(modifier=Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween) {\n"
          "                            Button(onClick={if(from.isNotBlank()&&to.isNotBlank()){prefs.addDict(from.trim(),to.trim());dict=prefs.getDict();from=\"\";to=\"\"}},modifier=Modifier.semantics{contentDescription=\"Add Word\"}){Text(\"ADD\")}\n"
          "                            Button(onClick={prefs.clearDict();dict=prefs.getDict()},colors=ButtonDefaults.buttonColors(containerColor=MaterialTheme.colorScheme.error),modifier=Modifier.semantics{contentDescription=\"Clear All\"}){Text(\"CLEAR ALL\")}\n"
          "                        }\n"

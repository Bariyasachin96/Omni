          "                                    val taA = themedContext.obtainStyledAttributes(intArrayOf(android.R.attr.colorAccent)); val accent = taA.getColor(0, 0); taA.recycle()\n"
          "                                    val taS = themedContext.obtainStyledAttributes(intArrayOf(android.R.attr.textColorSecondary)); val secondary = taS.getColor(0, accent); taS.recycle()\n"
          "                                    val taB = themedContext.obtainStyledAttributes(intArrayOf(android.R.attr.colorBackground)); val bg = taB.getColor(0, 0); taB.recycle()\n"
          "                                    setSelectedTabIndicatorColor(accent)\n"
          "                                    setTabTextColors(secondary, accent)\n"
          "                                    setBackgroundColor(bg)\n"
          "                                }\n"
          "                                rootColumn.addView(pageViewPager)\n"
          "                                rootColumn.addView(tabLayout)\n"
          "                                com.google.android.material.tabs.TabLayoutMediator(tabLayout, pageViewPager) { tab, position ->\n"

          static std::string cld3DetectRaw(const std::string& u8){
              static std::mutex g_cld3Mutex;
              static chrome_lang_id::NNetLanguageIdentifier* g_cld3 = nullptr;
              std::lock_guard<std::mutex> lk(g_cld3Mutex);
              if(!g_cld3) g_cld3 = new chrome_lang_id::NNetLanguageIdentifier(0, 1000);
              const chrome_lang_id::NNetLanguageIdentifier::Result r = g_cld3->FindLanguage(u8);
              if(!r.is_reliable || r.language == chrome_lang_id::NNetLanguageIdentifier::kUnknown) return "";
              std::string lang = r.language;
              size_t dash = lang.find('-'); if(dash != std::string::npos) lang = lang.substr(0, dash);
              std::string norm = normalizeLangCode(lang);
              if(!cld3ScriptConsistent(norm, u8)) return "";
              return norm;
          }
          static std::string cld2WindowDetectC(const std::string& u8, bool useCld3){
              if(useCld3) { std::string c3r = cld3DetectRaw(u8); return c3r.empty() ? "UNKNOWN" : c3r; }
              CLD2::CLDHints hints = {nullptr, nullptr, CLD2::UNKNOWN_ENCODING, CLD2::UNKNOWN_LANGUAGE};
              CLD2::Language lang3[3]; int pct3[3]; double score3[3];
              int textBytes=0; bool reliable=false;

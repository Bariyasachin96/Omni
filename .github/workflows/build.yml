          w("app/src/main/java/com/easyvoice/tts/GetSampleText.kt",
          "package com.easyvoice.tts\n"
          "import android.app.Activity\n"
          "import android.content.Intent\n"
          "import android.os.Bundle\n"
          "import android.speech.tts.TextToSpeech\n"
          "import java.util.Locale\n"
          "class GetSampleText : Activity() {\n"
          "    override fun onCreate(savedInstanceState: Bundle?) {\n"
          "        super.onCreate(savedInstanceState)\n"
          "        // AutoTTS GetSampleText.a(): when no \"language\" extra is supplied, fall back to\n"
          "        // Locale.getDefault() (NOT a hard-coded \"eng\") — matches com.vnspeak.autotts exactly.\n"
          "        val langExtra = intent?.getStringExtra(\"language\")\n"
          "        val locale = if (langExtra != null) try { Locale(langExtra) } catch (_: Exception) { Locale.getDefault() } else Locale.getDefault()\n"
          "        val iso = try { locale.isO3Language } catch (_: Exception) { locale.language }  // AutoTTS y.a(locale.getISO3Language())\n"
          "        val sample = SampleTexts.get(iso)\n"
          "        // AutoTTS GetSampleText: when y.a() has no sample for the language, return the exact\n"
          "        // fallback notice (\"Sorry. Sample text for language <DisplayName> is missing.\") — the\n"
          "        // display name resolved in English (new Locale(\"eng\")) — instead of empty text.\n"
          "        val text = if (sample.isEmpty()) \"Sorry. Sample text for language ${locale.getDisplayName(Locale(\"eng\"))} is missing.\" else sample\n"
          "        // AutoTTS GetSampleText returns PLAIN sample text (no [AutoTTS:] wrapper). The system's\n"
          "        // 'Listen to an example' then speaks it through our engine carrying the requested language,\n"
          "        // exactly like AutoTTS. (The [AutoTTS:...] tag belongs on the Voices-tab TEST button — P2 —\n"
          "        // not here.)\n"
          "        val data = Intent()\n"
          "        data.putExtra(\"sampleText\", text)\n"
          "        // AutoTTS GetSampleText.onCreate: setResult(0) = TextToSpeech.LANG_AVAILABLE.\n"
          "        // Android's TTS settings 'Listen to an example' only keeps the returned sampleText\n"
          "        // when resultCode == LANG_AVAILABLE; CHECK_VOICE_DATA_PASS (1) makes it discard ours.\n"
          "        setResult(TextToSpeech.LANG_AVAILABLE, data)\n"
          "        finish()\n"
          "    }\n"
          "}\n")

          # ── AccessibleDropdown.kt ────────────────────────────────────────────
          w("app/src/main/java/com/easyvoice/tts/AccessibleDropdown.kt",
          "package com.easyvoice.tts\n"
          "import androidx.compose.foundation.clickable\n"
          "import androidx.compose.foundation.layout.*\n"
          "import androidx.compose.foundation.lazy.LazyColumn\n"
          "import androidx.compose.material.icons.Icons\n"
          "import androidx.compose.material.icons.filled.ArrowDropDown\n"
          "import androidx.compose.material3.*\n"
          "import androidx.compose.runtime.*\n"
          "import androidx.compose.ui.Alignment\n"
          "import androidx.compose.ui.Modifier\n"
          "import androidx.compose.ui.semantics.Role\n"
          "import androidx.compose.ui.semantics.contentDescription\n"
          "import androidx.compose.ui.semantics.role\n"
          "import androidx.compose.ui.semantics.semantics\n"
          "import androidx.compose.ui.unit.dp\n"
          "import androidx.compose.ui.viewinterop.AndroidView\n"
          "@Composable\n"
          "fun TtsSliderRow(displayText: String, value: Int, onValueChange: (Int) -> Unit, valueRange: ClosedFloatingPointRange<Float>, maxValue: Int, decreaseDesc: String, increaseDesc: String, minValue: Int = 0) {\n"
          "    Text(displayText, modifier = Modifier.fillMaxWidth(), textAlign = androidx.compose.ui.text.style.TextAlign.Center)\n"
          "    Row(verticalAlignment = Alignment.CenterVertically) {\n"
          "        Button(onClick={ onValueChange(maxOf(minValue,value-5)) }, modifier=Modifier.semantics{contentDescription=decreaseDesc}){Text(\"-\")}\n"
          "        // AutoTTS c3/i.java P1(): speed/volume/pitch are floored at 10 — the seekbar never drops below.\n"
          "        // Clamp the DRAG too (not just the ± buttons), so dragging fully left can't persist 0 (silent/broken language).\n"
          "        Slider(value=value.toFloat(), onValueChange={ onValueChange(it.toInt().coerceIn(minValue, maxValue)) }, valueRange=valueRange, modifier=Modifier.weight(1f).padding(horizontal=8.dp))\n"
          "        Button(onClick={ onValueChange(minOf(maxValue,value+5)) }, modifier=Modifier.semantics{contentDescription=increaseDesc}){Text(\"+\")}\n"
          "    }\n"
          "}\n"
          "@Composable\n"
          "fun AccessibleDropdown(label: String, selectedText: String, items: List<String>, onSelect: (Int) -> Unit) {\n"
          "    // EXACT AutoTTS parity: AutoTTS uses a REAL native Android Spinner (res/layout/fragment_modes.xml).\n"
          "    // A native Spinner is the gold standard for a 100%-blind user — TalkBack announces it as ONE element:\n"
          "    // \"<label>, <value>, drop-down list, double-tap to activate\", opens an anchored list (NOT a dialog),\n"
          "    // and NEVER reports itself as an editable text box (which Compose's ExposedDropdownMenuBox readOnly\n"
          "    // TextField anchor can). We wrap the actual android.widget.Spinner in AndroidView so the behaviour is\n"
          "    // byte-for-byte the AutoTTS accessibility experience.\n"
          "    val currentOnSelect by rememberUpdatedState(onSelect)\n"
          "    Column(modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)) {\n"
          "        Text(label, style = MaterialTheme.typography.bodyMedium)\n"
          "        AndroidView(\n"
          "            modifier = Modifier.fillMaxWidth(),\n"
          "            factory = { ctx -> android.widget.Spinner(ctx) },\n"
          "            update = { spinner ->\n"
          "                // Detach the listener while we set the adapter + selection programmatically, then reattach\n"
          "                // via post{} AFTER those callbacks flush — so ONLY genuine user picks call onSelect (a\n"
          "                // Spinner fires onItemSelected on adapter/selection changes too).\n"
          "                spinner.onItemSelectedListener = null\n"
          "                val adapter = android.widget.ArrayAdapter(spinner.context, android.R.layout.simple_spinner_item, items)\n"
          "                adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)\n"
          "                spinner.adapter = adapter\n"
          "                val sel = items.indexOf(selectedText).let { if (it < 0) 0 else it }\n"
          "                spinner.setSelection(sel, false)\n"
          "                // Do NOT set contentDescription — on a Spinner it REPLACES the default announcement,\n"
          "                // hiding the selected item. AutoTTS leaves the Spinner bare so TalkBack reads\n"
          "                // \"<selected item>, drop-down list\"; the label is the separate Text() above (like\n"
          "                // AutoTTS's TextView label before each Spinner). Blind user hears label + selection.\n"
          "                spinner.post {\n"
          "                    spinner.onItemSelectedListener = object : android.widget.AdapterView.OnItemSelectedListener {\n"
          "                        override fun onItemSelected(parent: android.widget.AdapterView<*>?, view: android.view.View?, position: Int, id: Long) { currentOnSelect(position) }\n"
          "                        override fun onNothingSelected(parent: android.widget.AdapterView<*>?) {}\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "        )\n"
          "    }\n"
          "}\n")


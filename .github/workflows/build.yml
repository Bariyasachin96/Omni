          "                result.add(TextChunk(span.subSequence(prevEnd, start).toString(), \"UNKNOWN\"))\n"
          "            }\n"
          "            // AutoTTS x.g: the span itself is added UNCONDITIONALLY (line 47) — even a zero-width span\n"
          "            // becomes an empty chunk. Keep it so chunk/merge boundaries match AutoTTS byte-for-byte.\n"
          "            result.add(TextChunk(span.subSequence(start, end).toString(), ls.locale?.language ?: \"UNKNOWN\"))\n"
          "            prevEnd = end + 1  // AutoTTS c3.x.g(): n3 = n6 + 1 — skip char at span end boundary\n"
          "        }\n"
          "        // AutoTTS x.g: trailing gap → UNKNOWN, guarded ONLY by n3<len (prevEnd<length), not emptiness.\n"
          "        if (prevEnd < span.length) {\n"
          "            result.add(TextChunk(span.subSequence(prevEnd, span.length).toString(), \"UNKNOWN\"))\n"
          "        }\n"
          "        return result\n"
          "    }\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    // Auto TTS clsCLD2.b(text, R, N, ctx):String — EXACT PORT\n"
          "    // 64-char sliding window loop: per-window CLD2 + script-family fallback\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    private fun detectLanguage(text: String, latFall: String, nonLatFall: String): String {\n"
          "        if (text.isEmpty()) return \"UNKNOWN\"\n"
          "        val isDisableAdv = prefs.isDisableAdvancedDetection()\n"
          "        val n5 = text.length\n"
          "        var n6 = 0\n"
          "        while (n6 < n5) {\n"
          "            val n7 = n6 + 64\n"
          "            val window = text.substring(n6, minOf(n7, n5))\n"
          "            try {\n"
          "                val cldResult = cld2DetectWindow(window, latFall, nonLatFall, isDisableAdv)\n"
          "                if (cldResult != null && cldResult != \"UNKNOWN\") {\n"
          "                    if (isDisableAdv) {\n"
          "                        return cldResult\n"
          "                    }\n"
          "                    if (isEnabled(cldResult)) {  // AutoTTS clsCLD2.b:60 — accept if k.o() = SCANNED (language_N) AND not disabled (engine config NOT required; routing/H falls unconfigured langs to C)\n"
          "                        return cldResult\n"
          "                    }\n"
          "                    // Engine not available — script fallback from THIS WINDOW's first codepoint\n"
          "                    // Mirrors clsCLD2.b(): n6 = clsCLD2.a(object22) i.e. first cp of the window\n"
          "                    val winCp = firstValidCodepoint(window)\n"
          "                    if (winCp != -1) {\n"
          "                        // AutoTTS a.e(cp, k.f): returns first enabled lang for this script\n"
          "                        val primary = getScriptLangFiltered(winCp, enabledLangs)\n"
          "                        if (primary != null) {\n"
          "                            return primary\n"
          "                        }\n"
          "                    }\n"
          "                    // Script family fallback also failed — continue to next window\n"
          "                }\n"
          "                // null/UNKNOWN — continue to next window\n"
          "            } catch (_: Exception) {\n"
          "                // exception on this window — continue to next window\n"
          "            }\n"
          "            n6 = n7\n"
          "        }\n"
          "        // After all windows: S=true → UNKNOWN (AutoTTS: if (AutoTtsService.S) return \"UNKNOWN\")\n"
          "        if (isDisableAdv) {\n"
          "            return \"UNKNOWN\"\n"
          "        }\n"
          "        // Whole-string first codepoint fallback (mirrors clsCLD2.b() final path: clsCLD2.a(string))\n"
          "        val firstCp = firstValidCodepoint(text)\n"
          "        if (firstCp == -1) {\n"
          "            return \"UNKNOWN\"\n"
          "        }\n"
          "        // AutoTTS a.e(cp, k.f): returns first enabled lang for this script\n"
          "        val primary = getScriptLangFiltered(firstCp, enabledLangs)\n"
          "        if (primary != null) {\n"
          "            return primary\n"
          "        }\n"
          "        return \"UNKNOWN\"\n"
          "    }\n"
          "    // CLD2 detection for a single window — calls NativeEngine in auto mode.\n"
          "    // Returns detected lang or null if UNKNOWN/blank.\n"
          "    private fun cld2DetectWindow(window: String, latFall: String, nonLatFall: String, isDisableAdv: Boolean): String? {\n"
          "        VhLogger.d(\"[CLD2] cld2DetectWindow windowLen=${window.length} latFall=$latFall nonLatFall=$nonLatFall isDisableAdv=$isDisableAdv snip='${window.take(30)}'\")\n"
          "        val bytes = window.toByteArray(Charsets.UTF_8)\n"
          "        val buf = ByteBuffer.allocateDirect(bytes.size)\n"
          "        buf.put(bytes); buf.position(0)\n"
          "        val out = NativeEngine.processDirect(\n"
          "            buf, bytes.size,\n"
          "            emptyArray(), emptyArray(),\n"
          "            false, false, false,\n"
          "            latFall, nonLatFall, \"auto\",\n"
          "            \"auto\", \"auto\", \"auto\",\n"
          "            latFall,\n"
          "            isDisableAdv\n"
          "        )\n"
          "        val parts = out.split(\"|\", limit = 2)\n"
          "        val result = if (parts.size == 2 && parts[0].isNotBlank()) parts[0] else null\n"
          "        VhLogger.d(\"[CLD2] cld2DetectWindow rawOut='$out' → result=$result\")\n"
          "        return result\n"
          "    }\n"
          "    // Auto TTS clsCLD2.a(String):int — first valid codepoint (skip whitespace/digits/ASCII punct)\n"
          "    private fun firstValidCodepoint(text: String): Int {\n"
          "        var j = 0\n"
          "        while (j < text.length) {\n"
          "            val c = text[j]\n"
          "            if (!Character.isWhitespace(c) && (c < '0' || c > '9') && !isLatinPunct(c)) {\n"
          "                return text.codePointAt(j)\n"
          "            }\n"
          "            j++\n"
          "        }\n"
          "        return -1\n"
          "    }\n"
          "    // AbstractC1135a.m7780d() port — maps Unicode codepoint to primary language ISO code.\n"
          "    // Port of com.vnspeak.autotts.a.b(int) — maps codepoint to language ISO code.\n"
          "    // AutoTTS a.a: ConcurrentHashMap(1024). CHM REJECTS null values (NPE in putVal!) — AutoTTS\n"
          "    // never stores null either: an unmapped codepoint caches the Unknown-family object u. Mirror\n"
          "    // that with an \"\" sentinel for null (crash seen in the field: putVal NPE from getScriptLang).\n"
          "    private val scriptLangCache = ConcurrentHashMap<Int, String>(1024)\n"
          "    private fun getScriptLang(cp: Int): String? {\n"
          "        scriptLangCache[cp]?.let { VhLogger.d(\"[SCRIPT] getScriptLang cp=U+${cp.toString(16)} → $it (cached)\"); return it.ifEmpty { null } }  // \"\" sentinel = cached null (AutoTTS caches u for Unknown)\n"
          "        val lang: String? = when {\n"
          "            cp in 0x30..0x39 -> \"en\"  // AutoTTS a.b rule 1: ASCII digits → Digit family (primary \"en\"). Inert (detection skips digits) but exact.\n"
          "            cp in 0x20..0x2F || cp in 0x3A..0x40 || cp in 0x5B..0x60 || cp in 0x7B..0x7E || cp in 0x2000..0x206F -> \"zz\"  // AutoTTS a.b rule 2: ASCII punct bands + General Punctuation → Punctuation family (primary \"zz\").\n"
          "            cp == 0xC0 || cp == 0xC2 || cp == 0xC7 || cp == 0xC8 || cp == 0xC9 ||\n"
          "            cp == 0xCA || cp == 0xCB || cp == 0xCE || cp == 0xCF || cp == 0xD4 ||\n"
          "            cp == 0xD9 || cp == 0xDB || cp == 0xE0 || cp == 0xE2 || cp == 0xE7 ||\n"
          "            cp == 0xE8 || cp == 0xE9 || cp == 0xEA || cp == 0xEB || cp == 0xEE ||\n"
          "            cp == 0xEF || cp == 0xF4 || cp == 0xF9 || cp == 0xFB ||\n"
          "            cp == 0x152 || cp == 0x153 -> \"fr\"\n"
          "            cp == 0xC1 || cp == 0xCD || cp == 0xD1 || cp == 0xD3 || cp == 0xDA ||\n"
          "            cp == 0xE1 || cp == 0xED || cp == 0xF1 || cp == 0xF3 || cp == 0xFA -> \"es\"\n"
          "            cp == 0xC4 || cp == 0xD6 || cp == 0xDC || cp == 0xE4 || cp == 0xF6 ||\n"
          "            cp == 0xFC || cp == 0xDF -> \"de\"\n"
          "            cp == 0xC5 || cp == 0xC6 || cp == 0xD8 || cp == 0xE5 || cp == 0xE6 ||\n"
          "            cp == 0xF8 -> \"no\"\n"
          "            cp == 0x104 || cp == 0x105 || cp == 0x106 || cp == 0x107 ||\n"
          "            cp == 0x118 || cp == 0x119 || cp == 0x141 || cp == 0x142 ||\n"
          "            cp == 0x143 || cp == 0x144 || cp == 0x15A || cp == 0x15B ||\n"
          "            cp == 0x179 || cp == 0x17A || cp == 0x17B || cp == 0x17C -> \"pl\"\n"
          "            cp == 0x10C || cp == 0x10D || cp == 0x10E || cp == 0x10F ||\n"
          "            cp == 0x11A || cp == 0x11B || cp == 0x147 || cp == 0x148 ||\n"
          "            cp == 0x158 || cp == 0x159 || cp == 0x160 || cp == 0x161 ||\n"
          "            cp == 0x164 || cp == 0x165 || cp == 0x16E || cp == 0x16F ||\n"
          "            cp == 0x17D || cp == 0x17E -> \"cs\"\n"
          "            cp in 0x1EA0..0x1EF9 || cp == 0x110 || cp == 0x111 ||\n"
          "            cp == 0x1A0 || cp == 0x1A1 || cp == 0x1AF || cp == 0x1B0 -> \"vi\"\n"
          "            cp in 0x41..0x5A || cp in 0x61..0x7A ||\n"
          "            cp in 0xC0..0xFF || cp in 0x100..0x24F -> \"en\"\n"
          "            cp in 0x370..0x3FF || cp in 0x1F00..0x1FFF -> \"el\"\n"
          "            cp in 0x400..0x52F -> when {\n"
          "                cp == 0x404 || cp == 0x454 || cp == 0x406 || cp == 0x456 ||\n"
          "                cp == 0x407 || cp == 0x457 || cp == 0x490 || cp == 0x491 -> \"uk\"\n"
          "                cp == 0x402 || cp == 0x452 || cp == 0x408 || cp == 0x458 ||\n"
          "                cp == 0x409 || cp == 0x459 || cp == 0x40A || cp == 0x45A ||\n"
          "                cp == 0x40B || cp == 0x45B || cp == 0x40F || cp == 0x45F -> \"sr\"\n"
          "                cp == 0x42A || cp == 0x44A -> \"bg\"\n"
          "                cp == 0x4A2 || cp == 0x4A3 || cp == 0x492 || cp == 0x493 ||\n"
          "                cp == 0x4B0 || cp == 0x4B1 || cp == 0x4AE || cp == 0x4AF ||\n"
          "                cp == 0x4D8 || cp == 0x4D9 -> \"kk\"\n"
          "                else -> \"ru\"\n"
          "            }\n"
          "            cp in 0x530..0x58F || cp in 0xFB00..0xFB17 -> \"hy\"\n"
          "            cp in 0x590..0x5FF || cp in 0xFB1D..0xFB4F -> \"he\"\n"
          "            cp in 0x600..0x6FF || cp in 0x750..0x77F || cp in 0x8A0..0x8FF ||\n"
          "            cp in 0xFB50..0xFDFF || cp in 0xFE70..0xFEFF -> when {\n"
          "                cp == 0x679 || cp == 0x688 || cp == 0x691 || cp == 0x6C1 ||\n"
          "                cp == 0x6D2 || cp == 0x6BA || cp == 0x6BE -> \"ur\"\n"
          "                cp == 0x681 || cp == 0x685 || cp == 0x689 || cp == 0x693 ||\n"
          "                cp == 0x696 || cp == 0x69A || cp == 0x6BC || cp == 0x6D0 -> \"ps\"\n"
          "                cp in 0x67A..0x67D -> \"sd\"\n"
          "                cp == 0x6CE || cp == 0x695 || cp == 0x6B5 || cp == 0x6C6 -> \"ku\"\n"
          "                cp == 0x67E || cp == 0x686 || cp == 0x698 || cp == 0x6AF -> \"fa\"\n"
          "                else -> \"ar\"\n"
          "            }\n"
          "            cp in 0x780..0x7BF -> \"dv\"\n"
          "            cp in 0x900..0x97F || cp in 0xA8E0..0xA8FF ->\n"
          "                if (cp == 0x933) \"mr\" else \"hi\"\n"
          "            cp in 0x980..0x9FF ->\n"
          "                if (cp == 0x9F0 || cp == 0x9F1) \"as\" else \"bn\"\n"
          "            cp in 0xA00..0xA7F -> \"pa\"\n"
          "            cp in 0xA80..0xAFF -> \"gu\"\n"
          "            cp in 0xB00..0xB7F -> \"or\"\n"
          "            cp in 0xB80..0xBFF -> \"ta\"\n"
          "            cp in 0xC00..0xC7F -> \"te\"\n"
          "            cp in 0xC80..0xCFF -> \"kn\"\n"
          "            cp in 0xD00..0xD7F -> \"ml\"\n"
          "            cp in 0xD80..0xDFF -> \"si\"\n"
          "            cp in 0xE00..0xE7F -> \"th\"\n"
          "            cp in 0xE80..0xEFF -> \"lo\"\n"
          "            cp in 0xF00..0xFFF -> \"bo\"\n"
          "            cp in 0x1000..0x109F || cp in 0xAA60..0xAA7F -> \"my\"\n"
          "            cp in 0x10A0..0x10FF || cp in 0x2D00..0x2D2F -> \"ka\"\n"
          "            cp in 0x1100..0x11FF || cp in 0x3130..0x318F || cp in 0xA960..0xA97F ||\n"
          "            cp in 0xAC00..0xD7AF || cp in 0xD7B0..0xD7FF -> \"ko\"\n"
          "            cp in 0x1200..0x137F || cp in 0x1380..0x139F || cp in 0x2D80..0x2DDF -> \"am\"\n"
          "            cp in 0x1780..0x17FF || cp in 0x19E0..0x19FF -> \"km\"\n"
          "            cp in 0x1800..0x18AF || cp in 0x11660..0x1167F -> \"mn\"\n"
          "            cp in 0x3000..0x303F -> \"zh\"\n"
          "            cp in 0x3040..0x309F || cp in 0x1B000..0x1B12F -> \"ja\"\n"
          "            cp in 0x30A0..0x30FF || cp in 0x31F0..0x31FF || cp in 0x1B130..0x1B16F -> \"ja\"\n"
          "            cp in 0x4E00..0x9FFF || cp in 0x3400..0x4DBF ||\n"
          "            cp in 0x20000..0x2A6DF || cp in 0x2A700..0x2B73F ||\n"
          "            cp in 0x2B740..0x2B81F || cp in 0x2B820..0x2CEAF ||\n"
          "            cp in 0x2CEB0..0x2EBEF ||\n"
          "            cp in 196608..201551 || cp in 201552..205743 -> \"zh\"\n"
          "            // NOTE: 0xF900-0xFAFF (CJK Compatibility Ideographs) is INTENTIONALLY not mapped —\n"
          "            // AutoTTS a.b() has no range for it (CJK ends at 0x9FFF/ext blocks; presentation\n"
          "            // forms start at 0xFB00), so it falls through to Unknown. Matching AutoTTS exactly.\n"
          "            cp in 0x1F000..0x1F02F || cp in 0x1F300..0x1F9FF ||\n"
          "            cp in 0x1FA70..0x1FAFF ||  // AutoTTS emoji range starts at 0x1FA70, not 0x1FA30\n"
          "            cp in 0x2600..0x26FF || cp in 0x2700..0x27BF -> \"zz\"  // AutoTTS a.b emoji family primary=\"zz\" (same as math); getScriptLangFiltered collapses \"zz\"→null identically to null, so behavior is unchanged — this only matches AutoTTS's exact return value.\n"
          "            cp in 0x1D400..0x1D7FF || cp in 0x2100..0x214F ||\n"
          "            cp in 0x2200..0x22FF -> \"zz\"\n"
          "            cp in 0x10000..0x1007F -> \"grc\"\n"
          "            cp in 0x10300..0x1032F -> \"la\"\n"
          "            cp in 0x10330..0x1034F -> \"got\"\n"
          "            cp in 0x10400..0x1044F -> \"en\"\n"
          "            cp in 0x10800..0x1083F -> \"grc\"\n"
          "            cp in 0x10A00..0x10A5F -> \"sa\"\n"
          "            cp in 0x12000..0x1247F -> \"akk\"  // AutoTTS a.b: Cuneiform 0x12000-0x1247F (0x12480+ Cuneiform Numbers → Unknown)\n"
          "            cp in 0x13000..0x1342F || cp in 0x13430..0x1345F -> \"egy\"  // AutoTTS a.b: Egyptian 0x13000-0x1342F + 0x13430-0x1345F exactly\n"
          "            else -> null\n"
          "        }\n"
          "        if (scriptLangCache.size < 5000) scriptLangCache[cp] = lang ?: \"\"  // null → \"\" sentinel: CHM forbids null values (field NPE); AutoTTS caches the Unknown object u here\n"
          "        VhLogger.d(\"[SCRIPT] getScriptLang cp=U+${cp.toString(16)} → $lang (computed)\")\n"
          "        return lang\n"
          "    }\n"
          "    // AutoTTS k.n(): mode-based force-enabled language list — overrides disabled status\n"
          "    // Mode auto(1): latFall+eng; mix(2/3): latFall; dual/dedicated(4): latFall+nonLatFall\n"
          "    private fun getForceEnabledLangs(mode: String, latFall: String, nonLatFall: String): Set<String> = when (mode) {\n"
          "        \"auto\", \"google\" -> setOf(latFall) // AutoTTS k.n(): L==2 AND L==3 add [C]=auto_mode_language. Google (L=3) still detects, so C must be force-enabled & kept in the CLD2 script-fallback set.\n"
          "        \"mix\"  -> setOf(latFall, nonLatFall) // AutoTTS L=4:   [H, I] = latin + non-latin both\n"
          "        \"dual\" -> setOf(latFall, nonLatFall) // AutoTTS L=1:   [\"eng\", D] = eng + dual_mode_language\n"
          "        else   -> emptySet()\n"
          "    }\n"
          "    // AutoTTS a.e(cp, k.f): returns first enabled lang for script family of cp\n"
          "    // Exact port: finds primary script lang, returns it if in enabled set, else tries fallbacks\n"
          "    private fun getScriptLangFiltered(cp: Int, enabled: Set<String>): String? {\n"
          "        val primary = getScriptLang(cp)\n"
          "        if (primary == null) {\n"
          "            VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} → null (no primary script)\")\n"
          "            return null\n"
          "        }\n"
          "        // AutoTTS a.c() (the FILTERED runtime path) DROPS the 8 archaic scripts → Unknown, even though\n"
          "        // a.b() (unfiltered) maps them (Linear B/Old Italic/Gothic/Deseret/Cypriot/Kharoshthi/\n"
          "        // Cuneiform/Egyptian). Mirror that: never resolve them to an enabled lang (e.g. Deseret→en).\n"
          "        if (cp in 0x10000..0x1007F || cp in 0x10300..0x1034F || cp in 0x10400..0x1044F ||\n"
          "            cp in 0x10800..0x1083F || cp in 0x10A00..0x10A5F || cp in 0x12000..0x1247F ||\n"
          "            cp in 0x13000..0x1345F) {\n"
          "            VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} → null (archaic script dropped in filtered path)\")\n"
          "            return null\n"
          "        }\n"
          "        // AutoTTS clsCLD2.b(): each script-family candidate must pass k.o() = configured AND\n"
          "        // NOT disabled (k.o returns d.i^true). enabledLangs mirrors k.f (configured, may still\n"
          "        // contain disabled langs), so apply the not-disabled half of k.o() here to match exactly.\n"
          "        if (primary in enabled && !prefs.isLanguageDisabled(primary)) {\n"
          "            VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → $primary (in enabled, k.o ok)\")\n"
          "            return primary\n"
          "        }\n"
          "        // AutoTTS a.b() returns distinct ScriptFamily objects that share a primary string but have\n"
          "        // NARROWER possible-sets for certain codepoints. Mirror those (like ru_sp) so the fallback\n"
          "        // set isn't over-broad:\n"
          "        val fallbacks = when {\n"
          "            // Cyrillic ru_sp letters (Ё ё Э э Ы ы) are family with [be] ONLY, not the full Cyrillic set.\n"
          "            primary == \"ru\" && (cp == 0x401 || cp == 0x451 || cp == 0x42D || cp == 0x44D || cp == 0x42B || cp == 0x44B) -> listOf(\"be\")\n"
          "            // AutoTTS a.java:197 — the 5 core Urdu letters (ٹ ڈ ڑ ہ ے) are family {ur,pa} → fallback [pa] only.\n"
          "            primary == \"ur\" && (cp == 0x0679 || cp == 0x0688 || cp == 0x0691 || cp == 0x06C1 || cp == 0x06D2) -> listOf(\"pa\")\n"
          "            // AutoTTS a.java:115 — Hiragana (ja_h) family is {ja} ONLY, no fallback (Katakana keeps [ain]).\n"
          "            primary == \"ja\" && ((cp in 0x3040..0x309F) || (cp in 0x1B000..0x1B12F)) -> emptyList()\n"
          "            // AutoTTS a.java:123 — Deseret (en_d) family is {en} ONLY, no Latin fallback list.\n"
          "            primary == \"en\" && (cp in 0x10400..0x1044F) -> emptyList()\n"
          "            else -> getScriptLangFallbacks(primary)\n"
          "        }\n"
          "        for (fb in fallbacks) {\n"
          "            if (fb in enabled && !prefs.isLanguageDisabled(fb)) {\n"
          "                VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → fallback=$fb (k.o ok)\")\n"
          "                return fb\n"
          "            }\n"
          "        }\n"
          "        VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → null (no enabled fallback found)\")\n"
          "        return null\n"
          "    }\n"
          "    // Port of AutoTTS a.w map — ordered fallback lang list for each script family primary.\n"
          "    // Mirrors blockObj.a() iteration in clsCLD2.b() final fallback path.\n"
          "    private fun getScriptLangFallbacks(primary: String): List<String> = when (primary) {\n"
          "        \"fr\" -> listOf(\"ca\", \"oc\")\n"
          "        \"es\" -> listOf(\"pt\", \"gl\", \"ca\")\n"
          "        \"de\" -> listOf(\"lb\")\n"
          "        \"no\" -> listOf(\"da\", \"sv\", \"is\", \"fo\")\n"
          "        \"cs\" -> listOf(\"sk\")\n"
          "        \"en\" -> listOf(\"es\", \"fr\", \"de\", \"it\", \"pt\", \"nl\", \"sv\", \"no\", \"da\", \"fi\", \"pl\", \"cs\", \"sk\", \"hu\", \"ro\", \"tr\", \"id\", \"ms\", \"vi\", \"tl\", \"sw\", \"hr\", \"sr\", \"sl\", \"et\", \"lv\", \"lt\", \"is\", \"ga\", \"cy\", \"sq\", \"mt\")\n"
          "        \"el\" -> listOf(\"grc\", \"pnt\")\n"
          "        \"ru\" -> listOf(\"uk\", \"be\", \"bg\", \"mk\", \"sr\", \"bs\", \"hr\", \"kk\", \"ky\", \"tg\", \"mn\", \"uz\", \"tt\", \"ba\", \"cv\", \"sah\", \"ce\", \"av\", \"ab\")  // AutoTTS base Cyrillic family (m): full set c minus ru. (ru_sp letters Ё/Э/Ы use [be] — handled in getScriptLangFiltered)\n"
          "        \"sr\" -> listOf(\"bs\", \"hr\")\n"
          "        \"bg\" -> listOf(\"mk\")\n"
          "        \"kk\" -> listOf(\"ky\")\n"
          "        \"he\" -> listOf(\"yi\", \"lad\")\n"
          "        \"ar\" -> listOf(\"ar\")\n"
          "        \"fa\" -> listOf(\"ur\", \"ps\", \"ku\", \"ckb\", \"sd\", \"az\", \"ks\", \"ug\")\n"
          "        \"ur\" -> listOf(\"ps\", \"sd\", \"pa\")\n"
          "        \"ku\" -> listOf(\"ckb\")\n"
          "        \"hi\" -> listOf(\"mr\", \"ne\", \"sa\", \"kok\", \"mai\", \"bh\", \"new\", \"awa\", \"bho\", \"raj\", \"hne\")\n"
          "        \"mr\" -> listOf(\"kok\")\n"
          "        \"bn\" -> listOf(\"as\", \"mni\")\n"
          "        \"ta\" -> listOf(\"kn\")\n"
          "        \"kn\" -> listOf(\"tcy\")\n"
          "        \"th\" -> listOf(\"nod\", \"sou\", \"tts\")\n"
          "        \"lo\" -> listOf(\"hnx\")\n"
          "        \"bo\" -> listOf(\"dz\")\n"
          "        \"my\" -> listOf(\"shn\", \"kar\", \"mnw\")\n"
          "        \"ka\" -> listOf(\"xmf\", \"lzz\")\n"
          "        \"am\" -> listOf(\"ti\", \"om\", \"aa\", \"so\", \"sid\", \"wal\", \"gez\")\n"
          "        \"mn\" -> listOf(\"mnc\", \"xal\")\n"
          "        \"ja\" -> listOf(\"ain\")\n"
          "        \"zh\" -> listOf(\"ja\", \"ko\", \"vi\")\n"
          "        else -> emptyList()\n"
          "    }\n"
          "    // Auto TTS clsCLD2.c(char):boolean — ASCII punctuation check\n"
          "    private fun isLatinPunct(c: Char): Boolean {\n"
          "        val v = c.code\n"
          "        return (v in 33..47) || (v in 58..64) || (v in 91..96) || (v in 123..126)\n"
          "    }\n"
          "    private fun isLatinPunct(cp: Int) = (cp in 33..47) || (cp in 58..64) || (cp in 91..96) || (cp in 123..126)\n"
          "    // AutoTTS k.f(): get ISO3 language code from Locale, normalizing Chinese variants to \"zho\"\n"
          "    private fun getIso3Lang(locale: Locale?): String {\n"
          "        if (locale == null) return \"zxx\"\n"
          "        return try {\n"
          "            val iso3 = locale.isO3Language\n"
          "            if (iso3 == \"cmn\" || iso3 == \"lzh\" || iso3 == \"gan\" || iso3 == \"hak\") \"zho\" else iso3\n"
          "        } catch (_: Exception) { \"zxx\" }\n"
          "    }\n"
          "    // AutoTTS k.c(): build ISO 2↔3 letter code maps (idempotent — only runs once)\n"
          "    private fun initIsoMaps() {\n"
          "        if (isoToIso3.isNotEmpty()) return\n"
          "        for (iso in Locale.getISOLanguages()) {\n"
          "            try {\n"
          "                val iso3 = getIso3Lang(Locale(iso))  // AutoTTS k.f() — normalizes Chinese variants\n"
          "                isoToIso3[iso] = iso3\n"
          "                iso3ToIso[iso3] = iso\n"
          "            } catch (_: Exception) {}\n"
          "        }\n"
          "    }\n"
          "    // Engine availability check (AutoTTS k.o()) — normalizes 3-letter ISO to 2-letter before lookup\n"
          "    private fun isEngineAvailable(lang: String): Boolean {\n"
          "        val lookupKey = if (lang.length == 3) iso3ToIso[lang] ?: lang else lang\n"
          "        val engine = prefs.getEngineForLanguage(lookupKey)\n"
          "        val result = engine != \"NOT_SET\"\n"
          "        VhLogger.d(\"[ENGINE] isEngineAvailable lang=$lang lookupKey=$lookupKey engine=$engine → $result\")\n"
          "        return result\n"
          "    }\n"
          "    // AutoTTS k.o(): engine CONFIGURED and language NOT disabled (k.o returns d.i^true, i.e.\n"
          "    // false when the language's engine is set to \"Disable\"). AutoTTS uses k.o() to accept a CLD2\n"
          "    // result (clsCLD2.b:60) and H()==\"Disable\" to reject a span (auto:1653, mix:1794) — both mean\n"
          "    // \"disabled → don't use\". isEngineAvailable alone only checks configured, so pair it with the\n"
          "    // not-disabled flag here for exact k.o() parity.\n"
          "    private fun ko(lang: String): Boolean = isEngineAvailable(lang) && !prefs.isLanguageDisabled(lang)\n"
          "    // AutoTTS k.h map: built from Locale.getISOLanguages() — 2-letter ISO codes ONLY (k.c():176-193).\n"
          "    // The auto/google dispatch does k.h.get(lang) and falls to C when null (AutoTtsService:1669-1672):\n"
          "    // an ISO3 span lang (\"hin\"), \"UNKNOWN\"(→\"UN\") or any invalid code is unmapped → C.\n"
          "    private fun khMappable(code: String): Boolean = code.length == 2 && code in java.util.Locale.getISOLanguages()\n"
          "    // AutoTTS H() (AutoTtsService:327-368): RAW string compare of lang against configured ISO3\n"
          "    // codes (d.b) — NO k.h/ISO2 mapping, NO zho-folding. Pass ⟺ lang is literally a configured\n"
          "    // language_N entry with a non-empty engine (d.f) and not disabled (d.i). The MIX known-span\n"
          "    // gate (AutoTtsService:1813-1817) calls H(raw span lang) directly, so ISO2 spans never match.\n"
          "    private fun koRaw(lang: String): Boolean {\n"
          "        if (lang.isEmpty() || !prefs.getLanguageList().contains(lang)) return false\n"
          "        if (prefs.getBoolean(\"${lang}_disabled\", false)) return false\n"
          "        return prefs.getString(lang, \"\").split(\"#\", limit = 2).getOrElse(0) { \"\" }.isNotEmpty()\n"
          "    }\n"
          "    // AutoTTS k.o()/k.f DETECTION test: a language is detection-enabled iff it is SCANNED (present\n"
          "    // in the persisted scan set = language_N/k.c) AND not disabled — engine config is NOT required\n"
          "    // (that is the separate H()/routing concern). Used for CLD2 accept (clsCLD2.b:60) and the\n"
          "    // a.e() script-family fallback filter (enabledLangs). Differs from ko(): ko() = H() routing.\n"
          "    private fun isEnabled(lang: String): Boolean = prefs.toIso3(lang) in scannedLangsIso3 && !prefs.isLanguageDisabled(lang)\n"
          "    // AutoTTS k.q() int routing: 0=auto, 1=latFall, 2=nonLatFall\n"
          "    private fun modeIntToLang(mode: Int, latFall: String, nonLatFall: String): String = when (mode) {\n"
          "        1 -> latFall\n"
          "        2 -> nonLatFall\n"
          "        else -> \"auto\"\n"
          "    }\n"
          "    // AutoTTS S(): build ordered engine list M — system default engine FIRST, then engine_N prefs, Google TTS as last resort.\n"
          "    private fun buildEngineList() {\n"
          "        synchronized(this) {\n"
          "            val newM = ArrayList<String>()\n"
          "            // AutoTTS S(): defaultEngine = H(deviceLang). In GOOGLE mode (L=3) H() ALWAYS returns\n"
          "            // \"com.google.android.tts\" (H() line 315), so Google is forced into the pool at M[0].\n"
          "            // Without this a google-mode chunk forces engine=Google but the pool lacks it →\n"
          "            // V() can't find it → d_=-1 → no speech and no onStart/onDone/onStop callbacks.\n"
          "            val isGoogleMode = prefs.getReadingMode() == \"google\" || prefs.isGoogleTtsOnly()\n"
          "            val defaultEngine = if (isGoogleMode) \"com.google.android.tts\" else prefs.getEngineForLanguage(kfLocale())  // AutoTTS: H(c3.k.f(Locale.getDefault()))\n"
          "            var n = 0\n"
          "            while (true) {\n"
          "                val pkg = prefs.getString(\"engine_$n\", \"\")  // AutoTTS: prefs.getString(\"engine_\" + n, \"\")\n"
          "                if (pkg.isEmpty() || pkg == \"end\") break\n"
          "                if (pkg != defaultEngine) newM.add(pkg)  // skip if duplicate of default\n"
          "                n++\n"
          "            }\n"
          "            if (defaultEngine.isNotEmpty() && defaultEngine != \"NOT_SET\") {\n"
          "                newM.add(0, defaultEngine)  // AutoTTS: M.add(0, defaultEngine) — default engine is always FIRST\n"
          "            }\n"
          "            // CRITICAL: also add the engine configured for EVERY language (e.g. Eloquence for\n"
          "            // English), not just the device-locale default. Otherwise a per-language engine whose\n"
          "            // language is not the device locale never enters the pool → V() \"TTS is not ready\" →\n"
          "            // nothing is spoken. (AutoTTS S() lists ALL installed engines, achieving the same.)\n"
          "            val cfgLangs = HashSet<String>().apply { addAll(prefs.getLanguageList()); addAll(Languages.map.keys) }\n"
          "            for (lang in cfgLangs) {\n"
          "                val eng = prefs.getEngineForLanguage(lang)\n"
          "                if (eng != \"NOT_SET\" && eng.isNotEmpty() && !newM.contains(eng)) newM.add(eng)\n"
          "            }\n"
          "            if (newM.isEmpty()) {\n"
          "                newM.add(\"com.google.android.tts\")  // AutoTTS: c3.t.a() — Google TTS fallback when list empty\n"
          "            }\n"
          "            M = newM\n"
          "            VhLogger.d(\"[SERVICE] buildEngineList (AutoTTS S()): M=$newM\")\n"
          "        }\n"
          "    }\n"
          "    // AutoTTS Y(): load voice list T from voice_N prefs, read dedicated_engines into O — exact port\n"
          "    private fun buildVoiceList() {\n"
          "        synchronized(this) {\n"
          "            if (!T.isEmpty()) return  // already loaded — one-time, mirrors AutoTTS Y() early-exit\n"
          "            val sp = getApplicationContext().getSharedPreferences(\"auto_tts_settings\", 0)\n"
          "            var n = 0\n"
          "            while (true) {\n"
          "                val voice = sp.getString(\"voice_$n\", \"\") ?: \"\"\n"
          "                if (voice.isEmpty()) break\n"
          "                T.add(voice)  // AutoTTS Y(): T.add(voice_n)\n"
          "                n++\n"
          "            }\n"
          "            // AutoTTS k.D: voice_N is the persisted image of the configured voice list (each entry\n"
          "            // \"enginePkg#localeTag\"). EasyVoice stores voices per-language (key <iso3> = \"pkg#tag\"),\n"
          "            // not as a voice_N array, so if voice_N is absent, REBUILD T from the per-language configs.\n"
          "            // Without this T stays empty and c0()'s 3-pass engine scan (used on a saved-locale mismatch)\n"
          "            // never resolves — the exact divergence AutoTTS never has because Y() loads a real T.\n"
          "            if (T.isEmpty() && ::prefs.isInitialized) {\n"
          "                for (iso in Languages.map.keys) {\n"
          "                    val combined = sp.getString(prefs.toIso3(iso), \"\") ?: \"\"\n"
          "                    if (combined.contains(\"#\") && combined.split(\"#\", limit = 2)[0].isNotEmpty()) T.add(combined)\n"
          "                }\n"
          "            }\n"
          "            O = sp.getBoolean(\"dedicated_engines\", false)  // AutoTTS: O = prefs.getBoolean(\"dedicated_engines\", false)\n"
          "        }\n"
          "    }\n"
          "    // AutoTTS S()/Y()/U()/R(): eager pref snapshot at startup before engine init (N())\n"
          "    private fun eagerLoadPrefs() {\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs start\")\n"
          "        buildEngineList()  // AutoTTS: S() called first in onCreate before N() engine init\n"
          "        buildVoiceList()   // AutoTTS: Y() loads voice list T + dedicated_engines O\n"
          "        Languages.map.keys.forEach { prefs.getEngineForLanguage(it) }\n"
          "        prefs.isDedicatedEnginesEnabled()\n"
          "        L = when { prefs.getReadingMode() == \"google\" || prefs.isGoogleTtsOnly() -> 3; prefs.getReadingMode() == \"dual\" -> 1; prefs.getReadingMode() == \"mix\" -> 4; else -> 0 }  // AutoTTS: L (0=auto,1=dual,3=google,4=mix)\n"
          "        val eLatLang = prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { kfLocale() }  // AutoTTS H default: device locale ISO3\n"
          "        val eNonLatLang = prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { kfLocale() }  // AutoTTS I default: device locale ISO3\n"
          "        prefs.getString(\"pref_lang\", \"en\")\n"
          "        prefs.getString(\"auto_mode_language\", \"\")\n"
          "        D = prefs.getString(\"dual_mode_language\", \"\").ifEmpty { kfLocale() }  // AutoTTS R(): D = dual_mode_language, default=device locale ISO3\n"
          "        prefs.isShowNotification()\n"
          "        prefs.isDisableAdvancedDetection()\n"
          "        N = prefs.isLocaleSpansEnabled()         // AutoTTS k.p(): locale_spans → N\n"
          "        P = prefs.isBrokenEngineProtector()      // AutoTTS k.r(): strip_audio_attr → P\n"
          "        Q = prefs.isForceAccessibilityStream()   // AutoTTS k.r(): force_accessibility_stream → Q\n"
          "        E = prefs.getNumberModeLang()            // AutoTTS k.q(): number_mode_language → E\n"
          "        F = prefs.getPuncModeLang()              // AutoTTS k.q(): punc_mode_language → F\n"
          "        EmojiMode = prefs.getEmojiModeLang()     // AutoTTS k.q(): emoji_mode_language → G\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs: N(localeSpans)=$N P(brokenProtector)=$P Q(forceAccessibility)=$Q\")\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs: E(numberMode)=$E F(puncMode)=$F EmojiMode=$EmojiMode\")\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs: readingMode=${prefs.getReadingMode()} dedEngines=${prefs.isDedicatedEnginesEnabled()} disableAdv=${prefs.isDisableAdvancedDetection()}\")\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs: latLang=$eLatLang nonLatLang=$eNonLatLang\")\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs complete (AutoTTS S/Y/U/R)\")\n"
          "    }\n"
          "    // Port of AutoTTS k.f(Locale): returns ISO3 language, normalising CJK variants → \"zho\"\n"
          "    private fun kfLocale(locale: java.util.Locale = java.util.Locale.getDefault()): String {\n"
          "        return try {\n"
          "            val iso3 = locale.isO3Language\n"
          "            if (iso3 in listOf(\"cmn\", \"lzh\", \"gan\", \"hak\")) \"zho\" else iso3\n"
          "        } catch (_: Exception) { \"zxx\" }\n"
          "    }\n"
          "    // Port of AutoTTS P(Locale, Locale): semantic locale match with empty-field wildcards\n"
          "    private fun localeMatchesP(tag1: String, tag2: String): Boolean {\n"
          "        if (tag1 == tag2) return true\n"
          "        val loc1 = Locale.forLanguageTag(tag1)\n"
          "        val loc2 = Locale.forLanguageTag(tag2)\n"
          "        val lang1 = try { loc1.isO3Language } catch (_: Exception) { return false }\n"
          "        val lang2 = try { loc2.isO3Language } catch (_: Exception) { return false }\n"
          "        if (lang1 != lang2) return false\n"
          "        val country1 = loc1.isO3Country\n"
          "        if (country1.isEmpty()) return true\n"
          "        if (country1 != loc2.isO3Country) return false\n"
          "        val variant1 = loc1.variant\n"
          "        if (variant1.isEmpty()) return true\n"
          "        return variant1 == loc2.variant\n"
          "    }\n"
          "    // ISO 639-3 → ISO 639-1 normalization for CLD2 edge cases (AutoTTS k.o ISO3 comparison)\n"

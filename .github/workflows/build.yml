          "                                    override fun onPageSelected(position: Int) {\n"
          "                                        if (position <= 2) pageViewPager.post { try { pageViewPager.adapter?.notifyItemChanged(position) } catch (_: Exception) {} }\n"
          "                                    }\n"
          "                                })\n"
          "                                refreshVisibleTab = {\n"
          "                                    val cur = pageViewPager.currentItem\n"
          "                                    if (cur <= 2) pageViewPager.post { try { pageViewPager.adapter?.notifyItemChanged(cur) } catch (_: Exception) {} }\n"
          "                                }\n"
          "                                val tabLayout = com.google.android.material.tabs.TabLayout(matCtx).apply {\n"

          w("app/src/main/java/com/tts/easyvoice/Languages.kt",
          "package com.tts.easyvoice\n"
          "object Languages {\n"
          "    val map = linkedMapOf(\n"
          "        \"af\" to \"Afrikaans\", \"sq\" to \"Albanian\", \"ar\" to \"Arabic\", \"hy\" to \"Armenian\",\n"
          "        \"az\" to \"Azerbaijani\", \"eu\" to \"Basque\", \"be\" to \"Belarusian\", \"bn\" to \"Bengali\",\n"
          "        \"bs\" to \"Bosnian\", \"bg\" to \"Bulgarian\", \"ca\" to \"Catalan\", \"zh\" to \"Chinese\",\n"
          "        \"hr\" to \"Croatian\", \"cs\" to \"Czech\", \"da\" to \"Danish\", \"nl\" to \"Dutch\",\n"
          "        \"en\" to \"English\", \"et\" to \"Estonian\", \"fi\" to \"Finnish\", \"fr\" to \"French\",\n"
          "        \"gl\" to \"Galician\", \"ka\" to \"Georgian\", \"de\" to \"German\", \"el\" to \"Greek\",\n"
          "        \"gu\" to \"Gujarati\", \"he\" to \"Hebrew\", \"hi\" to \"Hindi\", \"hu\" to \"Hungarian\",\n"
          "        \"is\" to \"Icelandic\", \"id\" to \"Indonesian\", \"ga\" to \"Irish\", \"it\" to \"Italian\",\n"
          "        \"ja\" to \"Japanese\", \"jv\" to \"Javanese\", \"kn\" to \"Kannada\", \"kk\" to \"Kazakh\",\n"
          "        \"km\" to \"Khmer\", \"ko\" to \"Korean\", \"lo\" to \"Lao\", \"lv\" to \"Latvian\",\n"
          "        \"lt\" to \"Lithuanian\", \"mk\" to \"Macedonian\", \"ms\" to \"Malay\", \"ml\" to \"Malayalam\",\n"
          "        \"mt\" to \"Maltese\", \"mr\" to \"Marathi\", \"mn\" to \"Mongolian\", \"ne\" to \"Nepali\",\n"
          "        \"no\" to \"Norwegian\", \"fa\" to \"Persian\", \"pl\" to \"Polish\", \"pt\" to \"Portuguese\",\n"
          "        \"pa\" to \"Punjabi\", \"ro\" to \"Romanian\", \"ru\" to \"Russian\", \"sr\" to \"Serbian\",\n"
          "        \"si\" to \"Sinhalese\", \"sk\" to \"Slovak\", \"sl\" to \"Slovenian\", \"so\" to \"Somali\",\n"
          "        \"es\" to \"Spanish\", \"su\" to \"Sundanese\", \"sw\" to \"Swahili\", \"sv\" to \"Swedish\",\n"
          "        \"ta\" to \"Tamil\", \"te\" to \"Telugu\", \"th\" to \"Thai\", \"tr\" to \"Turkish\",\n"
          "        \"uk\" to \"Ukrainian\", \"ur\" to \"Urdu\", \"uz\" to \"Uzbek\", \"vi\" to \"Vietnamese\",\n"
          "        \"am\" to \"Amharic\", \"bo\" to \"Tibetan\", \"my\" to \"Burmese\", \"or\" to \"Odia\",\n"
          "        \"cy\" to \"Welsh\", \"yo\" to \"Yoruba\", \"zu\" to \"Zulu\"\n"
          "    )\n"
          "    val isoCodes = map.keys.toList()\n"
          "    // AutoTTS shows languages with the ISO3 code, e.g. \"Hindi (hin)\".\n"
          "    fun iso3(code: String): String = try { java.util.Locale(code).isO3Language.ifEmpty { code } } catch (_: Exception) { code }\n"
          "    // Display label like AutoTTS: \"Hindi (hin)\" — falls back to Locale.displayLanguage for\n"
          "    // codes outside the static map (engine-scanned rare languages).\n"
          "    fun label(code: String): String {\n"
          "        val n = map[code] ?: (try { java.util.Locale(code).displayLanguage } catch (_: Exception) { code }).ifEmpty { code }\n"
          "        return \"$n (${iso3(code)})\"\n"
          "    }\n"
          "    val displayNames = isoCodes.map { \"${map[it]} (${iso3(it)})\" }\n"
          "    val sortedIsoCodes: List<String> = run {\n"
          "        val col = java.text.Collator.getInstance()\n"
          "        map.keys.sortedWith { a, b ->\n"
          "            val normA = java.text.Normalizer.normalize(map[a] ?: a, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "            val normB = java.text.Normalizer.normalize(map[b] ?: b, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "            col.compare(normA, normB)\n"
          "        }\n"
          "    }\n"
          "    val sortedDisplayNames: List<String> = sortedIsoCodes.map { \"${map[it]} ($it)\" }\n"
          "}\n")

          # ── EasyVoiceLogger.kt ──────────────────────────────────────────────────────
          w("app/src/main/java/com/tts/easyvoice/EasyVoiceLogger.kt",
          "package com.tts.easyvoice\n"
          "import android.content.Context\n"
          "import android.util.Log\n"
          "import java.io.File\n"
          "import java.io.FileWriter\n"
          "import java.io.IOException\n"
          "import java.text.SimpleDateFormat\n"
          "import java.util.Date\n"
          "import java.util.Locale\n"
          "object EasyVoiceLogger {\n"
          "    private const val TAG = \"EASYVOICE-NATIVE\"\n"
          "    // AutoTTS c3.m: persistent file log at filesDir/logs/easy_voice.log, 2MB rotation (.1/.2/.3).\n"
          "    private const val MAX_LOG_BYTES = 2L * 1024L * 1024L  // AutoTTS c3.m.i(): 0x200000 rotate threshold\n"
          "    private val sdf = SimpleDateFormat(\"yyyy-MM-dd HH:mm:ss.SSS\", Locale.US)  // AutoTTS c3.m timestamp (with year)\n"
          "    private var logFile: File? = null\n"
          "    private var appContext: Context? = null\n"
          "    @Volatile private var loggingEnabled = false\n"
          "    fun setLoggingEnabled(v: Boolean) { loggingEnabled = v }\n"
          "    fun init(ctx: Context) {\n"
          "        appContext = ctx.applicationContext\n"
          "        try { val dir = File(ctx.applicationContext.filesDir, \"logs\"); if (!dir.exists()) dir.mkdirs(); logFile = File(dir, \"easy_voice.log\") } catch (_: Exception) {}  // AutoTTS c3.m ctor: filesDir/logs/easy_voice.log\n"
          "        write(\"I\", \"[LOGGER] EasyVoiceLogger initialized — device=${android.os.Build.MODEL} sdk=${android.os.Build.VERSION.SDK_INT} android=${android.os.Build.VERSION.RELEASE}\")\n"
          "    }\n"
          "    @Synchronized private fun write(level: String, msg: String) {\n"
          "        if (!loggingEnabled) return\n"
          "        when (level) { \"E\" -> Log.e(TAG, msg); \"W\" -> Log.w(TAG, msg); else -> Log.d(TAG, msg) }\n"
          "        val f = logFile ?: return\n"
          "        try {\n"
          "            rotateIfNeeded(f)  // AutoTTS c3.m.i(): rotate before writing\n"
          "            FileWriter(f, true).use { it.append(\"${sdf.format(Date())} $level/$TAG: $msg\\n\") }  // AutoTTS c3.m.h(): append to file\n"
          "        } catch (_: Exception) {}\n"
          "    }\n"
          "    // AutoTTS c3.m.i(): when easy_voice.log reaches 2MB, rotate → .1/.2/.3 (keep 3 backups, drop oldest).\n"
          "    private fun rotateIfNeeded(f: File) {\n"
          "        try {\n"
          "            if (!f.exists() || f.length() < MAX_LOG_BYTES) return\n"
          "            val parent = f.parent ?: return\n"
          "            File(parent, \"easy_voice.log.3\").let { if (it.exists()) it.delete() }\n"
          "            for (idx in 2 downTo 1) { val src = File(parent, \"easy_voice.log.$idx\"); if (src.exists()) src.renameTo(File(parent, \"easy_voice.log.${idx + 1}\")) }\n"
          "            f.renameTo(File(parent, \"easy_voice.log.1\"))\n"
          "        } catch (_: Exception) {}\n"
          "    }\n"
          "    fun d(msg: String) = write(\"D\", msg)\n"
          "    fun w(msg: String) = write(\"W\", msg)\n"
          "    fun e(msg: String) = write(\"E\", msg)\n"
          "    fun i(msg: String) = write(\"I\", msg)\n"
          "    // AutoTTS c3.m.b(): share the persistent log file directly (no in-memory dump).\n"
          "    @Synchronized @Throws(IOException::class) fun exportToFile(): File {\n"
          "        val f = logFile ?: throw IOException(\"EasyVoiceLogger not initialized\")\n"
          "        if (!f.exists() || f.length() == 0L) throw IOException(\"No log file to share\")  // AutoTTS c3.m.k(): 'No log file to share'\n"
          "        return f\n"
          "    }\n"
          "    // AutoTTS c3.m.a(): clear = truncate the log file to empty.\n"
          "    @Synchronized fun clear() { try { logFile?.let { if (it.exists()) FileWriter(it, false).close() } } catch (_: Exception) {} }\n"
          "}\n")


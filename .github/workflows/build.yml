          "    dualSection.addView(barHeaderMedium(\"Mode Settings\"))\n"
          "    addLanguageSpinner(dualSection, \"Select secondary language:\", \"dual_mode_language\")\n"
          "    val modeOptionLabels = listOf(\"Auto language\", \"Primary language\", \"Secondary language\")\n"
          "    val modeOptionSpinners = mutableListOf<Pair<Spinner, String>>()\n"
          "    fun addModeOptionSpinner(parent: LinearLayout, labelText: String, groupKey: String, initial: Int, onSelect: (Int) -> Unit) {\n"
          "        smallLabel(parent, labelText)\n"
          "        val spinner = Spinner(context)\n"
          "        parent.addView(spinner, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = d2; marginStart = d5 })\n"
          "        spinner.adapter = mediumSpinnerAdapter(context, modeOptionLabels)\n"
          "        if (initial in modeOptionLabels.indices) spinner.setSelection(initial)\n"
          "        spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "            override fun onItemSelected(parentView: AdapterView<*>?, view: View?, position: Int, rowId: Long) {\n"
          "                try {\n"
          "                    onSelect(position)\n"
          "                    for ((sib, sibKey) in modeOptionSpinners) {\n"
          "                        if (sibKey == groupKey && sib !== spinner && sib.selectedItemPosition != position) sib.setSelection(position)\n"
          "                    }\n"
          "                } catch (e: Exception) { e.printStackTrace() }\n"
          "            }\n"
          "            override fun onNothingSelected(parentView: AdapterView<*>?) {}\n"
          "        }\n"
          "        modeOptionSpinners.add(spinner to groupKey)\n"
          "    }\n"
          "    addModeOptionSpinner(dualSection, \"Select language for reading numbers:\", \"number\", prefs.getNumberModeLang()) { prefs.setNumberModeLang(it) }\n"
          "    addModeOptionSpinner(dualSection, \"Select language for reading punctuations:\", \"punc\", prefs.getPuncModeLang()) { prefs.setPuncModeLang(it) }\n"
          "    mixedSection.addView(barHeaderMedium(\"Mode Settings\"))\n"
          "    addLanguageSpinner(mixedSection, \"Preferred language for Latin text\", \"mixed_mode_latin_language\")\n"
          "    addLanguageSpinner(mixedSection, \"Preferred language for non-Latin text\", \"mixed_mode_non_latin_language\")\n"
          "    addModeOptionSpinner(mixedSection, \"Select language for reading numbers:\", \"number\", prefs.getNumberModeLang()) { prefs.setNumberModeLang(it) }\n"
          "    addModeOptionSpinner(mixedSection, \"Select language for reading punctuations:\", \"punc\", prefs.getPuncModeLang()) { prefs.setPuncModeLang(it) }\n"
          "    smallLabel(mixedSection, \"Other options\")\n"
          "    addLocaleSpanRow(mixedSection)\n"
          "    // MultilingualModeSettings has the two language spinners and the locale-spans row only —\n"
          "    // no number and no punctuation spinner.\n"
          "    multilingualSection.addView(barHeaderMedium(\"Mode Settings\"))\n"
          "    addLanguageSpinner(multilingualSection, \"Preferred language for Latin text\", \"mixed_mode_latin_language\")\n"
          "    addLanguageSpinner(multilingualSection, \"Preferred language for non-Latin text\", \"mixed_mode_non_latin_language\")\n"
          "    smallLabel(multilingualSection, \"Other options\")\n"
          "    addLocaleSpanRow(multilingualSection)\n"
          "    // j.onRadioButtonClicked: None hides all four sections and touches nothing else — it does\n"
          "    // not rebuild m.c and it does not re-adapter any spinner.\n"
          "    fun onModeSelected(mode: String) {\n"
          "        prefs.setReadingMode(mode)\n"
          "        autoSection.visibility = if (mode == \"auto\" || mode == \"google\") View.VISIBLE else View.GONE\n"
          "        dualSection.visibility = if (mode == \"dual\") View.VISIBLE else View.GONE\n"
          "        mixedSection.visibility = if (mode == \"mix\") View.VISIBLE else View.GONE\n"

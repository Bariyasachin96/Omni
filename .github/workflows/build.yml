          "        ToggleRow(\"Force Accessibility Audio Stream\", \"Applies USAGE_ASSISTANCE_ACCESSIBILITY to all TTS engines globally — ensures proper accessibility audio routing regardless of Bluetooth.\", forceAccessibility) { forceAccessibility = it; prefs.setForceAccessibilityStream(it) }\n"
          "        ToggleRow(\"Show TTS Notification\", \"Show a persistent notification while Omni is active. Disable to hide it from the status bar.\", showNotification) { showNotification = it; prefs.setShowNotification(it) }\n"
          "        ToggleRow(\"Google TTS Only Mode\", \"Bypass all language detection and route everything to Google TTS engine. Overrides Auto/Mix/Dual mode.\", googleTtsOnly) { googleTtsOnly = it; prefs.setGoogleTtsOnly(it) }\n"

          "    // filter). This is opt-OUT, exactly like AutoTTS — not the old opt-in configured_languages set.\n"
          "    // AutoTTS k.n(): the current mode's force-enabled languages CANNOT be disabled in the Languages\n"
          "    // tab. auto/google → [auto_mode_language]; mix → [mixed_mode_latin_language, non_latin]. (ISO3.)\n"
          "    val forceEnabledIso3 = remember(readingMode) {\n"
          "        val dev = try { java.util.Locale.getDefault().isO3Language } catch (_: Exception) { \"eng\" }\n"

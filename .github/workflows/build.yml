          "    }\n"
          "    root.addView(radioGroup, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { marginStart = d5 })\n"
          "    // E0/F0/G0/H0 — each <LinearLayout vertical fill_parent visibility=gone marginTop=5dip>\n"
          "    fun modeSection(): LinearLayout {\n"
          "        val sec = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL; visibility = View.GONE }\n"
          "        root.addView(sec, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = d5 })\n"
          "        return sec\n"
          "    }\n"
          "    val autoSection = modeSection()\n"
          "    val dualSection = modeSection()\n"
          "    val mixedSection = modeSection()\n"
          "    val multilingualSection = modeSection()\n"
          "    // c3.m.c — the unfiltered language list, rebuilt by m.h(ctx, false) on every radio click.\n"
          "    // c3.m.g(iso3) indexes into THAT list, and the adapter is c3.m.m(pkg) over the same list,\n"
          "    // so in every mode but Google the two line up one to one.\n"
          "    var allCodes: List<String> = emptyList()\n"
          "    var adapterCodes: List<String> = emptyList()\n"
          "    var adapterLabels: List<String> = emptyList()\n"
          "    val languageSpinners = mutableListOf<Pair<Spinner, String>>()\n"
          "    fun addLanguageSpinner(parent: LinearLayout, labelText: String, prefKey: String): Spinner {\n"
          "        smallLabel(parent, labelText)\n"
          "        val spinner = Spinner(context)\n"
          "        // <Spinner fill_parent marginTop=2dip marginStart=5dip>\n"
          "        parent.addView(spinner, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = d2; marginStart = d5 })\n"
          "        spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "            override fun onItemSelected(parentView: AdapterView<*>?, view: View?, position: Int, rowId: Long) {\n"
          "                // j.O1: F/G/K/L = m.c.get(spinner.getSelectedItemPosition()).b — always m.c,\n"
          "                // and the multilingual pair writes the very same K/L the mixed pair writes.\n"
          "                try {\n"
          "                    if (position in adapterCodes.indices) prefs.setString(prefKey, adapterCodes[position])\n"
          "                    for ((sib, sibKey) in languageSpinners) {\n"
          "                        if (sibKey == prefKey && sib !== spinner && sib.selectedItemPosition != position) sib.setSelection(position)\n"
          "                    }\n"
          "                } catch (e: Exception) { e.printStackTrace() }\n"
          "            }\n"
          "            override fun onNothingSelected(parentView: AdapterView<*>?) {}\n"
          "        }\n"
          "        languageSpinners.add(spinner to prefKey)\n"
          "        return spinner\n"
          "    }\n"
          "    fun applyLanguageAdapters(googleOnly: Boolean) {\n"
          "        val scanVoices = EngineFinder.lastScanVoices\n"
          "        val displayByIso = HashMap<String, String>()\n"
          "        for (v in scanVoices) { val iso3 = EngineFinder.iso3Of(v.locale); if (!displayByIso.containsKey(iso3)) displayByIso[iso3] = try { v.locale.getDisplayLanguage() } catch (_: Exception) { \"\" } }\n"
          "        allCodes = EngineFinder.lastScan.toList()\n"
          "        adapterCodes = if (googleOnly) allCodes.filter { iso3 -> scanVoices.any { it.pkg.equals(\"com.google.android.tts\", true) && EngineFinder.iso3Of(it.locale) == iso3 } } else allCodes\n"
          "        adapterLabels = adapterCodes.map { c ->\n"
          "            val dn = (displayByIso[c] ?: \"\").ifEmpty { Languages.map[c] ?: (try { java.util.Locale(c).displayLanguage } catch (_: Exception) { c }).ifEmpty { c } }\n"
          "            \"$dn ($c)\"\n"
          "        }\n"
          "        val deviceIso3 = prefs.toIso3(try { java.util.Locale.getDefault().language } catch (_: Exception) { \"en\" })\n"
          "        for ((spinner, prefKey) in languageSpinners) {\n"
          "            spinner.adapter = mediumSpinnerAdapter(context, adapterLabels)\n"
          "            val stored = prefs.getString(prefKey, \"\").ifEmpty { deviceIso3 }\n"
          "            val index = allCodes.indexOf(stored)\n"
          "            if (index != -1) spinner.setSelection(index)\n"
          "        }\n"
          "    }\n"
          "    autoSection.addView(barHeaderMedium(\"Mode Settings\"))\n"
          "    addLanguageSpinner(autoSection, \"Select preferred language:\", \"auto_mode_language\")\n"
          "    smallLabel(autoSection, \"Other options\")\n"
          "    val localeSpanBoxes = ArrayList<android.widget.CheckBox>()\n"
          "    // AutoTTS j.U2 R0/S0/T0: three checkboxes over the single flag Q, each mirroring the\n"

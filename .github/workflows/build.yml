          w("app/src/main/java/com/tts/easyvoice/SharedPrefsManager.kt",
          "package com.tts.easyvoice\n"
          "import android.content.Context\n"
          "import android.content.SharedPreferences\n"
          "class SharedPrefsManager(context: Context) {\n"
          "    private val prefs: SharedPreferences = context.getSharedPreferences(\"easy_voice_settings\", Context.MODE_PRIVATE)\n"
          "    private val appCtx: Context = context.applicationContext\n"
          "    // AutoTTS c3.t.a(context): is the Google TTS package installed?\n"
          "    private fun isGoogleTtsInstalled(): Boolean = try {\n"
          "        appCtx.packageManager.getPackageInfo(\"com.google.android.tts\", 0); true\n"
          "    } catch (_: Exception) { false }\n"
          "    fun toIso3(lang: String): String {\n"
          "        val i3 = if (lang.length != 2) lang else try { java.util.Locale(lang).isO3Language.ifEmpty { lang } } catch (_: Exception) { lang }\n"
          "        // AutoTTS k.f(): collapse the Chinese ISO3 variants to \"zho\" so keys/lookups match exactly.\n"
          "        return when (i3) { \"cmn\", \"lzh\", \"gan\", \"hak\" -> \"zho\"; else -> i3 }\n"
          "    }\n"
          "    fun getEngineForLanguage(lang: String): String {\n"
          "        val iso3 = toIso3(lang)\n"
          "        // AutoTTS U(): d.i disabled flag — disabled language treated as not configured\n"
          "        if (prefs.getBoolean(\"${iso3}_disabled\", false)) return \"NOT_SET\"\n"
          "        val combined = prefs.getString(iso3, \"\") ?: \"\"\n"
          "        val pkg = combined.split(\"#\", limit = 2).getOrElse(0) { \"\" }\n"
          "        if (pkg.isNotEmpty()) return pkg\n"
          "        return \"NOT_SET\"\n"
          "    }\n"
          "    // AutoTTS: language is \"in list c\" (configured) — engine pref non-empty, IGNORING the\n"
          "    // _disabled flag. Used by mode force-enable (k.h/k.l), which un-disables configured mode langs.\n"
          "    fun isLanguageConfigured(lang: String): Boolean {\n"
          "        val combined = prefs.getString(toIso3(lang), \"\") ?: \"\"\n"
          "        return combined.split(\"#\", limit = 2).getOrElse(0) { \"\" }.isNotEmpty()\n"
          "    }\n"
          "    fun getLocaleForLangPkg(lang: String, pkg: String): String {\n"
          "        val combined = prefs.getString(toIso3(lang), \"\") ?: \"\"\n"
          "        return combined.split(\"#\", limit = 2).getOrElse(1) { \"\" }\n"
          "    }\n"
          "    fun setLocaleForLangPkg(lang: String, pkg: String, tag: String) {\n"
          "        val iso3 = toIso3(lang)\n"
          "        prefs.edit().putString(iso3, \"$pkg#$tag\").apply()\n"
          "        // AutoTTS U(): language_N sequential list — write when language is configured\n"
          "        addLanguageToList(iso3)\n"
          "    }\n"
          "    // AutoTTS U(): language_0, language_1, … sequential keys listing configured languages\n"
          "    fun getLanguageList(): List<String> {\n"
          "        val out = mutableListOf<String>()\n"
          "        var i = 0\n"
          "        while (true) {\n"
          "            val lang = prefs.getString(\"language_$i\", \"\") ?: \"\"\n"
          "            if (lang.isEmpty()) break\n"
          "            out.add(lang); i++\n"
          "            if (i > 1000) break\n"
          "        }\n"
          "        return out\n"
          "    }\n"
          "    // AutoTTS c3.k.y(): the Languages tab snapshots EVERY scanned language into the persisted\n"
          "    // list, and c3.k loadLanguages() builds k.f/k.c (the detection-enabled set) from it — NOT\n"
          "    // from per-language engine config. Mirror that: persist the full-scan ISO3 set so the service\n"
          "    // can treat a SCANNED (not necessarily Voices-configured) language as detection-available,\n"
          "    // exactly like k.o()/k.f. Engine routing still uses getEngineForLanguage (H()) separately.\n"
          "    // AutoTTS k.y(): the scan snapshot is persisted as the language_N sequential keys\n"
          "    // (language_0..language_<n-1> = ISO3, terminated by language_<n>=\"\") — the SAME array\n"
          "    // loadLanguages()/k.h read to build k.c/k.f. No EasyVoice-specific CSV key.\n"
          "    fun setScannedLangs(iso3: Set<String>) {\n"
          "        val ed = prefs.edit()\n"
          "        var i = 0\n"
          "        for (l in iso3) { ed.putString(\"language_$i\", l); i++ }\n"
          "        ed.putString(\"language_$i\", \"\")  // AutoTTS k.y terminator\n"
          "        ed.apply()\n"
          "    }\n"
          "    fun getScannedLangs(): Set<String> {\n"
          "        // One-time migration from the legacy CSV key (pre-language_N builds).\n"
          "        val legacy = prefs.getString(\"scanned_langs_iso3\", \"\") ?: \"\"\n"
          "        if (legacy.isNotEmpty() && getLanguageList().isEmpty()) {\n"
          "            setScannedLangs(legacy.split(\",\").filter { it.isNotBlank() }.map { toIso3(it) }.toHashSet())\n"
          "            prefs.edit().remove(\"scanned_langs_iso3\").apply()\n"
          "        }\n"
          "        return getLanguageList().map { toIso3(it) }.toHashSet()  // AutoTTS loadLanguages(): walk language_N\n"
          "    }\n"
          "    private fun addLanguageToList(iso3: String) {\n"
          "        val list = getLanguageList()\n"
          "        if (list.contains(iso3)) return\n"
          "        prefs.edit().putString(\"language_${list.size}\", iso3).apply()\n"
          "    }\n"
          "    // AutoTTS c3.d.i: ${iso3}_disabled boolean flag\n"
          "    fun isLanguageDisabled(lang: String): Boolean = prefs.getBoolean(\"${toIso3(lang)}_disabled\", false)\n"
          "    fun setLanguageDisabled(lang: String, v: Boolean) = prefs.edit().putBoolean(\"${toIso3(lang)}_disabled\", v).apply()\n"
          "    fun getVoiceName(lang: String): String = prefs.getString(\"${toIso3(lang)}_variant\", \"*Default\") ?: \"*Default\"\n"
          "    fun setVoiceName(lang: String, voiceName: String) = prefs.edit().putString(\"${toIso3(lang)}_variant\", voiceName).apply()\n"
          "    // ── voice_N sequential schema (for original-AutoTTS migration compatibility) ──\n"

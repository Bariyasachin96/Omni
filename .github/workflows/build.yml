              int winStart=0;
              while(winStart<textLen && !done){
                  int winEnd=winStart+64; int wend = winEnd<textLen?winEnd:textLen;
                  std::string wu8 = utf16to8(chars+winStart, wend-winStart);
                  if(lb){
                      int snipLen = (wend-winStart)<30?(wend-winStart):30;
                      char nbuf[32]; snprintf(nbuf,sizeof(nbuf),"%d",wend-winStart);
                      *lb += std::string(useCld3?"[CLD3] detectWindow windowLen=":"[CLD2] cld2DetectWindow windowLen=")+nbuf+" latFall="+latFall+" nonLatFall="+nonLatFall+" isDisableAdv="+(disableAdv?"true":"false")+" snip='"+utf16to8(chars+winStart,snipLen)+"'\n";
                  }
                  std::string det = cld2WindowDetectC(wu8, useCld3);
                  if(lb) *lb += std::string(useCld3?"[CLD3] detectWindow rawOut='":"[CLD2] cld2DetectWindow rawOut='")+(det.empty()?"UNKNOWN":det)+"|"+wu8+"' → result="+(det.empty()?"null":det)+"\n";
                  if(!det.empty() && det!="UNKNOWN"){
                      if(disableAdv){ result=det; done=true; break; }
                      if(okIso3.count(toIso3C(det))){ result=det; done=true; break; }
                      int winCp = firstValidCpU16(chars+winStart, wend-winStart);
                      if(winCp!=-1){
                          std::string p = scriptLangFilteredC(winCp, enabled, lb);
                          if(!p.empty()){ result=p; done=true; break; }
                      }
                  }
                  winStart=winEnd;
              }
              if(!done && !disableAdv){
                  int firstCp = firstValidCpU16(chars, textLen);
                  if(firstCp!=-1){
                      std::string p = scriptLangFilteredC(firstCp, enabled, lb);
                      if(!p.empty()) result=p;
                  }
              }
              env->ReleaseStringChars(jText, chars);
              std::string out = result + "\x01" + log;
              return env->NewStringUTF(out.c_str());
          }

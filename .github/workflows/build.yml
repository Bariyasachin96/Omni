          "    private fun splitSentences(text: String): List<String> {\n"
          "        if (text.isBlank()) return emptyList()\n"
          "        val result = mutableListOf<String>()\n"
          "        try {\n"
          "            val iter = java.text.BreakIterator.getSentenceInstance()\n"
          "            iter.setText(text)\n"
          "            var st = iter.first(); var en = iter.next()\n"
          "            while (en != java.text.BreakIterator.DONE) {\n"
          "                val s = text.substring(st, en).trim()\n"
          "                if (s.isNotEmpty()) result.add(s)\n"
          "                st = en; en = iter.next()\n"
          "            }\n"
          "        } catch (t: Throwable) {\n"
          "            VhLogger.d(\"[SERVICE] splitSentences failed: ${t.message} — treating as single sentence\")\n"
          "            result.add(text.trim())\n"
          "        }\n"
          "        // Safety: if BreakIterator returned nothing usable, treat input as one sentence.\n"

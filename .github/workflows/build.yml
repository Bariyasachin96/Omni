          "            // ── Vedic Extensions (Sanskrit) ────────────────────────────────────────────\n"
          "            cp in 0x1CD0..0x1CFF -> \"sa\"\n"
          "            // ── Coptic ─────────────────────────────────────────────────────────────────\n"

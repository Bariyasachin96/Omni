name: Build Easy Voice Native
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the APK as a GitHub release"
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          install_pkgs() {
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "ndk;29.0.14206865" "cmake;3.22.1" "build-tools;36.0.0" --sdk_root=$ANDROID_HOME
          }
          n=0
          until [ $n -ge 5 ]; do
            if install_pkgs && [ -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
              echo "NDK + CMake installed successfully."; break
            fi
            n=$((n+1))
            echo "::warning::NDK/CMake install attempt $n failed (likely corrupt download) — clearing caches and retrying..."
            rm -rf "$ANDROID_HOME/ndk/29.0.14206865" 2>/dev/null || true
            rm -rf "$HOME/.android/cache" "$HOME/.cache/Google/AndroidStudio"*/ 2>/dev/null || true
            sleep $((n * 5))
          done
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14206865" ]; then
            echo "::error::NDK install failed after $n retries."; exit 1
          fi
          # compileSdk 37 needs the platform. Best effort only: AGP downloads a
          # missing platform itself, and a bad package name here must never take
          # the NDK install down with it (that is how run 711 failed).
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" --sdk_root=$ANDROID_HOME \
            || echo "::warning::platforms;android-37 not available from sdkmanager; letting AGP fetch it"

      - name: Clone CLD2 + CLD3 Native Libraries
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 https://github.com/CLD2Owners/cld2.git app/src/main/cpp/cld2_src
          git clone --depth 1 https://github.com/google/cld3.git app/src/main/cpp/cld3_src
          git clone --depth 1 -b v3.21.12 https://github.com/protocolbuffers/protobuf.git app/src/main/cpp/protobuf_src
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          protoc --version
          mkdir -p app/src/main/cpp/cld3_gen/cld_3/protos
          protoc -Iapp/src/main/cpp/cld3_src/src --cpp_out=app/src/main/cpp/cld3_gen/cld_3/protos app/src/main/cpp/cld3_src/src/*.proto
          ls app/src/main/cpp/cld3_gen/cld_3/protos

      - name: Generate Complete Project
        run: |
          python3 << 'PYEOF'
          import os, textwrap

          def write_source(path, content):
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as out:
                  out.write(content)

          write_source("gradle.properties", "android.useAndroidX=true\n"
            "org.gradle.jvmargs=-Xmx3096m -Dfile.encoding=UTF-8\n"
            "org.gradle.daemon=false\n"
            )

          write_source("settings.gradle.kts", """\
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EasyVoice"
          include(":app")
          """)

          write_source("build.gradle.kts", """\
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  // AGP 9 supplies its own Kotlin Gradle plugin; this is the documented
                  // hook for pinning it to an exact version (AGP 9.0 release notes).
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0")
              }
          }
          plugins {
              id("com.android.application") version "9.3.0" apply false
              // Ships with Kotlin, so it must match the Kotlin version exactly.
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.0" apply false
          }
          """)

          write_source("app/build.gradle.kts", """\
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.tts.easyvoice"
              compileSdk = 37
              ndkVersion = "29.0.14206865"
              defaultConfig {
                  applicationId = "com.tts.easyvoice"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "16.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += listOf("-std=c++17", "-Wno-narrowing", "-Os", "-g0", "-fvisibility=hidden", "-ffunction-sections", "-fdata-sections")
                          arguments += listOf("-DANDROID_STL=c++_static")
                      }
                  }
                  ndk { abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a")) }
              }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("easyvoice-release.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "sachin1211"
                      keyAlias = System.getenv("KEY_ALIAS") ?: "sachin"
                      keyPassword = System.getenv("KEY_PASSWORD") ?: "sachin1211"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug { isMinifyEnabled = false }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              buildFeatures { compose = true }
              packaging {
                  resources { excludes.add("**/libc++_shared.so") }
                  jniLibs { useLegacyPackaging = true }
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation(platform("androidx.compose:compose-bom:2026.08.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
          }
          """)

          write_source("app/proguard-rules.pro", """\
          # ---------------------------------------------------------- shrinking
          # R8 full mode is on (gradle.properties). Let it widen access so it can
          # inline and merge across class boundaries.
          -allowaccessmodification
          # Move every surviving class into the root package: shorter descriptors.
          -repackageclasses ''

          # --------------------------------------------------- crash reports
          # Keep the line table so a stack trace still carries line numbers, but
          # rename the source file to a constant so real paths never ship.
          # mapping.txt is kept as a private CI artifact - not in the APK, not in
          # the release - so only we can retrace a trace.
          -keepattributes SourceFile,LineNumberTable
          -renamesourcefileattribute SourceFile

          # ------------------------------------------------------------ keeps
          # JNI resolves by symbol name (Java_com_tts_easyvoice_NativeEngine_*),
          # so this class and its native methods must keep theirs. Nothing else
          # in the app is reached by name: the only two reflection sites read
          # framework names (TextToSpeech.mCurrentEngine, android resource ids).
          -keep,includedescriptorclasses class com.tts.easyvoice.NativeEngine {
              native <methods>;
          }
          # kotlinx-coroutines ships this as a consumer rule; repeated so the
          # build does not depend on the AAR carrying it.
          -keepclassmembers class kotlinx.coroutines.** { volatile <fields>; }
          -dontwarn kotlinx.coroutines.**
          -dontwarn javax.annotation.**
          -dontwarn javax.naming.**
          -dontwarn org.checkerframework.**
          -dontwarn com.google.auto.value.**
          -dontwarn com.google.errorprone.annotations.**
          """)

          write_source("app/src/main/cpp/CMakeLists.txt", """\
          cmake_minimum_required(VERSION 3.18.1)
          project("easyvoice_native")
          set(CLD2_DIR ${CMAKE_CURRENT_SOURCE_DIR}/cld2_src/internal)
          set(CLD3_DIR ${CMAKE_CURRENT_SOURCE_DIR}/cld3_src/src)
          set(CLD3_GEN ${CMAKE_CURRENT_SOURCE_DIR}/cld3_gen)
          set(protobuf_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(protobuf_BUILD_PROTOC_BINARIES OFF CACHE BOOL "" FORCE)
          set(protobuf_INSTALL OFF CACHE BOOL "" FORCE)
          set(protobuf_WITH_ZLIB OFF CACHE BOOL "" FORCE)
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(protobuf_BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          add_subdirectory(${CMAKE_CURRENT_SOURCE_DIR}/protobuf_src/cmake protobuf_build)
          file(GLOB CLD3_SCRIPT_SPAN ${CLD3_DIR}/script_span/*.cc)
          list(FILTER CLD3_SCRIPT_SPAN EXCLUDE REGEX "test")
          add_library(easyvoice_core SHARED
              tts_engine_core.cpp
              ${CLD2_DIR}/cldutil.cc
              ${CLD2_DIR}/cldutil_shared.cc
              ${CLD2_DIR}/compact_lang_det.cc
              ${CLD2_DIR}/compact_lang_det_hint_code.cc
              ${CLD2_DIR}/compact_lang_det_impl.cc
              ${CLD2_DIR}/debug.cc
              ${CLD2_DIR}/fixunicodevalue.cc
              ${CLD2_DIR}/generated_entities.cc
              ${CLD2_DIR}/generated_language.cc
              ${CLD2_DIR}/generated_ulscript.cc
              ${CLD2_DIR}/getonescriptspan.cc
              ${CLD2_DIR}/lang_script.cc
              ${CLD2_DIR}/offsetmap.cc
              ${CLD2_DIR}/scoreonescriptspan.cc
              ${CLD2_DIR}/tote.cc
              ${CLD2_DIR}/utf8statetable.cc
              ${CLD2_DIR}/cld_generated_cjk_uni_prop_80.cc
              ${CLD2_DIR}/cld2_generated_cjk_compatible.cc
              ${CLD2_DIR}/cld_generated_cjk_delta_bi_4.cc
              ${CLD2_DIR}/generated_distinct_bi_0.cc
              ${CLD2_DIR}/cld2_generated_quadchrome_16.cc
              ${CLD2_DIR}/cld2_generated_deltaoctachrome.cc
              ${CLD2_DIR}/cld2_generated_distinctoctachrome.cc
              ${CLD2_DIR}/cld_generated_score_quad_octa_2.cc
              ${CLD3_GEN}/cld_3/protos/feature_extractor.pb.cc
              ${CLD3_GEN}/cld_3/protos/sentence.pb.cc
              ${CLD3_GEN}/cld_3/protos/task_spec.pb.cc
              ${CLD3_DIR}/base.cc
              ${CLD3_DIR}/embedding_feature_extractor.cc
              ${CLD3_DIR}/embedding_network.cc
              ${CLD3_DIR}/feature_extractor.cc
              ${CLD3_DIR}/feature_types.cc
              ${CLD3_DIR}/fml_parser.cc
              ${CLD3_DIR}/language_identifier_features.cc
              ${CLD3_DIR}/lang_id_nn_params.cc
              ${CLD3_DIR}/nnet_language_identifier.cc
              ${CLD3_DIR}/registry.cc
              ${CLD3_DIR}/relevant_script_feature.cc
              ${CLD3_DIR}/sentence_features.cc
              ${CLD3_DIR}/task_context.cc
              ${CLD3_DIR}/task_context_params.cc
              ${CLD3_DIR}/unicodetext.cc
              ${CLD3_DIR}/utils.cc
              ${CLD3_DIR}/workspace.cc
              ${CLD3_SCRIPT_SPAN}
          )
          target_include_directories(easyvoice_core PRIVATE ${CLD2_DIR}/../public ${CLD2_DIR} ${CLD3_DIR} ${CLD3_GEN})
          find_library(log-lib log)
          target_link_libraries(easyvoice_core libprotobuf-lite ${log-lib})
          target_link_options(easyvoice_core PRIVATE "-Wl,--gc-sections")
          """)


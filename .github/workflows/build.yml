name: Build Easy Voice Native
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          # sdkmanager occasionally gets a corrupt NDK zip on GitHub runners
          # ("Error on ZipFile unknown archive" → exit 1). Retry with a clean
          # re-download so a flaky mirror doesn't fail the whole build.
          install_pkgs() {
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "ndk;25.1.8937393" "cmake;3.22.1" --sdk_root=$ANDROID_HOME
          }
          n=0
          until [ $n -ge 5 ]; do
            if install_pkgs && [ -d "$ANDROID_HOME/ndk/25.1.8937393" ]; then
              echo "NDK + CMake installed successfully."; break
            fi
            n=$((n+1))
            echo "::warning::NDK/CMake install attempt $n failed (likely corrupt download) — clearing caches and retrying..."
            rm -rf "$ANDROID_HOME/ndk/25.1.8937393" 2>/dev/null || true
            rm -rf "$HOME/.android/cache" "$HOME/.cache/Google/AndroidStudio"*/ 2>/dev/null || true
            sleep $((n * 5))
          done
          if [ ! -d "$ANDROID_HOME/ndk/25.1.8937393" ]; then
            echo "::error::NDK install failed after $n retries."; exit 1
          fi

      - name: Clone CLD2 Native Library
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 https://github.com/CLD2Owners/cld2.git app/src/main/cpp/cld2_src

      - name: Generate Complete Project
        run: |
          python3 << 'PYEOF'
          import os, textwrap

          def w(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # ── gradle.properties ────────────────────────────────────────────────
          w("gradle.properties", "android.useAndroidX=true\n"
            "android.enableJetifier=true\n"
            "org.gradle.jvmargs=-Xmx3096m -Dfile.encoding=UTF-8\n"
            "org.gradle.daemon=false\n"
            "android.enableR8.fullMode=true\n")

          # ── settings.gradle.kts ──────────────────────────────────────────────
          w("settings.gradle.kts", """\
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EasyVoice"
          include(":app")
          """)

          # ── build.gradle.kts (root) ──────────────────────────────────────────
          w("build.gradle.kts", """\
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          """)

          # ── app/build.gradle.kts ─────────────────────────────────────────────
          w("app/build.gradle.kts", """\
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.easyvoice.tts"
              compileSdk = 34
              ndkVersion = "25.1.8937393"
              defaultConfig {
                  applicationId = "com.easyvoice.tts"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "16.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += listOf("-std=c++17", "-Wno-narrowing", "-O3", "-g0")
                          arguments += listOf("-DANDROID_STL=c++_static")
                      }
                  }
                  ndk { abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a")) }
              }
              sourceSets { getByName("main") { java.srcDirs("src/main/java") } }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("easyvoice-release.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "sachin1211"
                      keyAlias = System.getenv("KEY_ALIAS") ?: "sachin"
                      keyPassword = System.getenv("KEY_PASSWORD") ?: "sachin1211"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug { isMinifyEnabled = false }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources { excludes.add("**/libc++_shared.so") } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              val composeBom = enforcedPlatform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          """)

          # ── proguard-rules.pro ───────────────────────────────────────────────
          w("app/proguard-rules.pro", """\
          -repackageclasses 'o'
          -allowaccessmodification
          -keep class com.easyvoice.tts.NativeEngine { native <methods>; }
          -keepclassmembers class kotlinx.coroutines.** { volatile <fields>; }
          -dontwarn kotlinx.coroutines.**
          -keep class androidx.compose.animation.** { *; }
          -keep class androidx.compose.animation.core.** { *; }
          -dontwarn javax.annotation.**
          -dontwarn javax.naming.**
          -dontwarn org.checkerframework.**
          -dontwarn com.google.auto.value.**
          -dontwarn com.google.errorprone.annotations.**
          """)

          # ── CMakeLists.txt ───────────────────────────────────────────────────
          w("app/src/main/cpp/CMakeLists.txt", """\
          cmake_minimum_required(VERSION 3.18.1)
          project("easyvoice_native")
          set(CLD2_DIR ${CMAKE_CURRENT_SOURCE_DIR}/cld2_src/internal)
          add_library(easyvoice_core SHARED
              tts_engine_core.cpp
              ${CLD2_DIR}/cldutil.cc
              ${CLD2_DIR}/cldutil_shared.cc
              ${CLD2_DIR}/compact_lang_det.cc
              ${CLD2_DIR}/compact_lang_det_hint_code.cc
              ${CLD2_DIR}/compact_lang_det_impl.cc
              ${CLD2_DIR}/debug.cc
              ${CLD2_DIR}/fixunicodevalue.cc
              ${CLD2_DIR}/generated_entities.cc
              ${CLD2_DIR}/generated_language.cc
              ${CLD2_DIR}/generated_ulscript.cc
              ${CLD2_DIR}/getonescriptspan.cc
              ${CLD2_DIR}/lang_script.cc
              ${CLD2_DIR}/offsetmap.cc
              ${CLD2_DIR}/scoreonescriptspan.cc
              ${CLD2_DIR}/tote.cc
              ${CLD2_DIR}/utf8statetable.cc
              ${CLD2_DIR}/cld_generated_cjk_uni_prop_80.cc
              ${CLD2_DIR}/cld2_generated_cjk_compatible.cc
              ${CLD2_DIR}/cld_generated_cjk_delta_bi_4.cc
              ${CLD2_DIR}/generated_distinct_bi_0.cc
              ${CLD2_DIR}/cld2_generated_quadchrome_16.cc
              ${CLD2_DIR}/cld2_generated_deltaoctachrome.cc
              ${CLD2_DIR}/cld2_generated_distinctoctachrome.cc
              ${CLD2_DIR}/cld_generated_score_quad_octa_2.cc
          )
          target_include_directories(easyvoice_core PRIVATE ${CLD2_DIR}/../public ${CLD2_DIR})
          find_library(log-lib log)
          target_link_libraries(easyvoice_core ${log-lib})
          """)

          # ── tts_engine_core.cpp ──────────────────────────────────────────────
          w("app/src/main/cpp/tts_engine_core.cpp", r"""
          #include <jni.h>
          #include <string>
          #include <cstring>
          #include <vector>
          #include <unordered_map>
          #include <unordered_set>
          #include <stdint.h>
          #include "compact_lang_det.h"

          // JNI_OnLoad: no integrity/signature check — just report the JNI version so the lib loads.
          JNIEXPORT jint JNI_OnLoad(JavaVM*, void*) {
              return JNI_VERSION_1_6;
          }

          inline int utf8ToCodepoint(const unsigned char* p, int& len) {
              if (p[0] < 0x80)               { len=1; return p[0]; }
              if ((p[0]&0xE0)==0xC0)         { len=2; return ((p[0]&0x1F)<<6)|(p[1]&0x3F); }
              if ((p[0]&0xF0)==0xE0)         { len=3; return ((p[0]&0x0F)<<12)|((p[1]&0x3F)<<6)|(p[2]&0x3F); }
              if ((p[0]&0xF8)==0xF0)         { len=4; return ((p[0]&0x07)<<18)|((p[1]&0x3F)<<12)|((p[2]&0x3F)<<6)|(p[3]&0x3F); }
              len=1; return p[0];
          }

          // EXACT port of AutoTTS c3.c.a() — the precise emoji codepoint set used inside pattern `d`.
          // (200D ZWJ and the 2000-206F block are already latRange elsewhere, so they are not repeated here;
          //  FE00-FE0E are NOT emoji in c.a() and must NOT be included; only FE0F is the trailing modifier.)
          inline bool isEmoji(int cp) {
              return cp==0x00A9||cp==0x00AE||cp==0x203C||cp==0x2049||cp==0x2122||cp==0x2139||
                     (cp>=0x2194&&cp<=0x2199)||(cp>=0x21A9&&cp<=0x21AA)||
                     cp==0x231A||cp==0x231B||cp==0x2328||cp==0x23CF||(cp>=0x23E9&&cp<=0x23F3)||(cp>=0x23F8&&cp<=0x23FA)||
                     cp==0x24C2||cp==0x25AA||cp==0x25AB||cp==0x25B6||cp==0x25C0||(cp>=0x25FB&&cp<=0x25FE)||
                     (cp>=0x2600&&cp<=0x26FF)||(cp>=0x2700&&cp<=0x27BF)||cp==0x2934||cp==0x2935||
                     (cp>=0x2B05&&cp<=0x2B07)||cp==0x2B1B||cp==0x2B1C||cp==0x2B50||cp==0x2B55||
                     cp==0x3030||cp==0x303D||cp==0x3297||cp==0x3299||cp==0x20E3||cp==0xFE0F||
                     cp==0x1F004||cp==0x1F0CF||
                     cp==0x1F170||cp==0x1F171||cp==0x1F17E||cp==0x1F17F||cp==0x1F18E||(cp>=0x1F191&&cp<=0x1F19A)||
                     (cp>=0x1F1E6&&cp<=0x1F1FF)||
                     cp==0x1F201||cp==0x1F202||cp==0x1F21A||cp==0x1F22F||(cp>=0x1F232&&cp<=0x1F23A)||cp==0x1F250||cp==0x1F251||
                     (cp>=0x1F300&&cp<=0x1F5FF)||(cp>=0x1F600&&cp<=0x1F64F)||(cp>=0x1F680&&cp<=0x1F6FF)||(cp>=0x1F900&&cp<=0x1F9FF);
          }

          // Returns true for non-Latin codepoints that are NOT Unicode \p{L} (Letter category).
          // Used in flushBuf(bufKind==1) to mirror AutoTTS w.c() which uses Java \p{L} regex.
          static bool isNonLatinNonLetter(int cp) {
              // Non-Latin digit blocks (Unicode Nd — not \p{L})
              if(cp>=0x0660&&cp<=0x066B) return true;  // Arabic-Indic digits + decimal/thousands sep
              if(cp>=0x06F0&&cp<=0x06F9) return true;  // Extended Arabic-Indic digits
              if(cp>=0x07C0&&cp<=0x07C9) return true;  // NKo digits
              if(cp>=0x0966&&cp<=0x096F) return true;  // Devanagari digits
              if(cp>=0x09E6&&cp<=0x09EF) return true;  // Bengali digits
              if(cp>=0x0A66&&cp<=0x0A6F) return true;  // Gurmukhi digits
              if(cp>=0x0AE6&&cp<=0x0AEF) return true;  // Gujarati digits
              if(cp>=0x0B66&&cp<=0x0B6F) return true;  // Oriya digits
              if(cp>=0x0BE6&&cp<=0x0BEF) return true;  // Tamil digits
              if(cp>=0x0C66&&cp<=0x0C6F) return true;  // Telugu digits
              if(cp>=0x0CE6&&cp<=0x0CEF) return true;  // Kannada digits
              if(cp>=0x0D66&&cp<=0x0D6F) return true;  // Malayalam digits
              if(cp>=0x0E50&&cp<=0x0E59) return true;  // Thai digits
              if(cp>=0x0ED0&&cp<=0x0ED9) return true;  // Lao digits
              if(cp>=0x0F20&&cp<=0x0F29) return true;  // Tibetan digits
              if(cp>=0x1040&&cp<=0x1049) return true;  // Myanmar digits
              if(cp>=0x1090&&cp<=0x1099) return true;  // Myanmar Shan digits
              if(cp>=0x17E0&&cp<=0x17E9) return true;  // Khmer digits
              if(cp>=0x1810&&cp<=0x1819) return true;  // Mongolian digits
              if(cp>=0xFF10&&cp<=0xFF19) return true;  // Fullwidth digits (also pattern-b)
              // Combining marks (Unicode M category — not \p{L})
              if(cp>=0x0300&&cp<=0x036F) return true;  // Combining Diacritical Marks
              if(cp>=0x1DC0&&cp<=0x1DFF) return true;  // Combining Diacritical Marks Supplement
              if(cp>=0x20D0&&cp<=0x20FF) return true;  // Combining Diacritical Marks for Symbols
              // Non-Latin punct blocks (not in latRange, not \p{L})
              if(cp>=0x2E00&&cp<=0x2E7F) return true;  // Supplemental Punctuation
              if(cp>=0x3000&&cp<=0x303F) return true;  // CJK Symbols and Punctuation
              if(cp>=0xFE10&&cp<=0xFE6F) return true;  // Vertical Forms + CJK Compat + Small Forms
              return false;
          }


          struct ChunkResult { std::string lang; std::string text; };

          // ISO 639-3 → ISO 639-1 normalization: CLD2 occasionally returns 3-letter codes.
          // Must run immediately after every CLD2 call so all internal comparisons use 2-letter codes.
          static std::string normalizeLangCode(const std::string& code) {
              if (code.size() <= 2) return code;
              static const char* tbl[][2] = {
                  {"zho","zh"},{"hin","hi"},{"ben","bn"},{"ara","ar"},{"por","pt"},
                  {"rus","ru"},{"jpn","ja"},{"kor","ko"},{"deu","de"},{"fra","fr"},
                  {"ita","it"},{"spa","es"},{"nld","nl"},{"tur","tr"},{"pol","pl"},
                  {"vie","vi"},{"fas","fa"},{"tha","th"},{"ind","id"},{"msa","ms"},
                  {"ukr","uk"},{"ces","cs"},{"ron","ro"},{"hun","hu"},{"swe","sv"},
                  {"nor","no"},{"dan","da"},{"fin","fi"},{"ell","el"},{"bul","bg"},
                  {"hrv","hr"},{"slk","sk"},{"slv","sl"},{"srp","sr"},{"mkd","mk"},
                  {"lit","lt"},{"lav","lv"},{"est","et"},{"afr","af"},{"cat","ca"},
                  {"tam","ta"},{"tel","te"},{"mal","ml"},{"kan","kn"},{"guj","gu"},
                  {"mar","mr"},{"pan","pa"},{"urd","ur"},{"nep","ne"},{"sin","si"},
                  {"khm","km"},{"lao","lo"},{"mya","my"},{"amh","am"},{"bod","bo"},
                  {"ori","or"},{"kat","ka"},{"hye","hy"},{"kaz","kk"},{"mon","mn"},
                  {"uzb","uz"},{"heb","he"},{"swa","sw"},{"zul","zu"},{"yor","yo"},
                  {"jav","jv"},{"sun","su"},{"wel","cy"},{"gle","ga"},{"glg","gl"},
                  {"eus","eu"},{"bos","bs"},{"mlt","mt"},{"isl","is"},{"sqi","sq"},
                  {nullptr,nullptr}
              };
              for (int i = 0; tbl[i][0]; i++)
                  if (code == tbl[i][0]) return tbl[i][1];
              return code;
          }

          // Latin-script language check (mirrors Kotlin isLatinScript).
          static bool isLatinScriptLang(const std::string& lang) {
              static const char* lat[] = {
                  "en","fr","de","es","it","pt","nl","sv","da","no","nb","nn",
                  "fi","pl","cs","ro","hu","sk","sl","hr","lt","lv","et","tr",
                  "vi","af","ca","cy","eu","ga","gl","is","lb","mt","sq","sw",
                  "tl","id","ms","bs","az","uz","tk","ky",nullptr
              };
              for (int i = 0; lat[i]; i++) if (lang == lat[i]) return true;
              return false;
          }

          // Auto mode: WHOLE TEXT DETECTION. No length limits. Return as ONE single chunk.
          static std::vector<ChunkResult> buildAutoChunks(const std::vector<std::string>& sentences, const std::string& latFall, const std::string& nonLatFall, bool disableAdvancedDetection) {
              std::vector<ChunkResult> chunks;
              std::string fullText = "";
              for(auto& s: sentences) {
                  if(!s.empty()) {
                      if(!fullText.empty()) fullText += " ";
                      fullText += s;
                  }
              }
              if(fullText.empty()) return chunks;
              std::string dominantLang;
              {
                  bool is_rel = false;
                  CLD2::Language cld2Lang = CLD2::DetectLanguage(fullText.c_str(), (int)fullText.size(), true, &is_rel);
                  const char* code = CLD2::LanguageCode(cld2Lang);
                  // AutoTTS parity (log-proven divergence): CLD2 biases toward ENGLISH with
                  // is_reliable=false on short/ambiguous text (e.g. 2-char CJK "解说" → en!). AutoTTS's
                  // nativeGetLanguage returns "UNKNOWN" for unreliable results — that is exactly why
                  // clsCLD2.b has the per-window a.e()/k.o() script fallback and the clsCLD2.a()
                  // first-codepoint tail. Accept CLD2's answer ONLY when it is reliable; otherwise
                  // return UNKNOWN so the Kotlin caller runs the faithful script fallback
                  // (解说 → Han script → zho; engine empty → type-2 → I, the user's non-Latin choice).
                  if (is_rel && code && strlen(code) >= 2 && strcmp(code,"un")!=0 && strcmp(code,"xx")!=0)
                      dominantLang = normalizeLangCode(std::string(code));
              }
              // AutoTTS clsCLD2.b(): nativeGetLanguage returns the RAW CLD2 result — "UNKNOWN" when
              // CLD2 cannot identify this window. The codepoint/script-family fallback (a.e/k.o) and the
              // end-of-loop clsCLD2.a() first-codepoint fallback are performed by the Kotlin caller
              // (detectLanguage), which windows this primitive exactly like clsCLD2.b's 64-char loop.
              // Do NOT resolve UNKNOWN to detectLang()/latFall here: that made the caller accept
              // window-1's latFall and never advance to later windows or the faithful codepoint tail
              // (e.g. "<ambiguous Latin> <clear Russian>" wrongly returned latFall instead of ru).
              // (void)disableAdvancedDetection/(void)latFall/(void)nonLatFall — kept for signature parity.
              (void)disableAdvancedDetection; (void)latFall; (void)nonLatFall;
              if (dominantLang.empty()) dominantLang = "UNKNOWN";
              chunks.push_back({dominantLang, fullText});
              return chunks;
          }

          // AutoTTS w.java algorithm: Latin-range runs (cp<=0x024F) vs non-Latin runs.
          // Runs with letters=type1(Latin text), digits/punct-only=type3(neutral), non-Latin=type2.
          // Context-resolve type3: backward scan for non-first segments, forward for first (w.a/w.b).
          static std::vector<ChunkResult> buildMixChunks(const std::vector<std::string>& sentences, const std::string& latFall, const std::string& nonLatFall, const std::string& puncFall, const std::string& numFall, const std::string& emojiFall, const std::string& neutralDefault, bool disableAdvancedDetection, bool isDual = false) {
              std::vector<ChunkResult> result;

              std::string fullText;
              for (auto& s : sentences) { if (!s.empty()) fullText += s + " "; }
              if (fullText.empty()) return result;

              // Fix A: trim + collapse whitespace (AutoTTS trim().replaceAll("\\s+", " ")).
              // Java \\s = ASCII 0x09-0x0D, 0x20 only.
              {
                  // Trim leading
                  size_t fs = fullText.find_first_not_of(" \t\n\r\x0B\x0C");
                  if (fs == std::string::npos) return result;
                  fullText = fullText.substr(fs);
                  // Trim trailing
                  size_t fe = fullText.find_last_not_of(" \t\n\r\x0B\x0C");
                  if (fe != std::string::npos) fullText = fullText.substr(0, fe + 1);
                  // Collapse internal runs
                  std::string collapsed; collapsed.reserve(fullText.size());
                  bool prevWs = false;
                  for (unsigned char c : fullText) {
                      bool iw = (c == ' ' || c == '\t' || c == '\n' || c == '\r' || c == '\x0B' || c == '\x0C');
                      if (iw) { if (!prevWs) collapsed += ' '; prevWs = true; }
                      else { collapsed += (char)c; prevWs = false; }
                  }
                  fullText = std::move(collapsed);
              }
              if (fullText.empty()) return result;

              // Fix 1: Remove BiDi control characters (AutoTTS w.f() / pattern-e).
              // U+061C Arabic Letter Mark, U+200E LRM, U+200F RLM, U+202A-U+202E directional.
              // These break Latin/non-Latin boundary detection for Arabic/Hebrew/Urdu text.
              {
                  std::string clean;
                  int fi = 0, flen = (int)fullText.size();
                  while (fi < flen) {
                      int cl = 0;
                      int cp2 = utf8ToCodepoint((const unsigned char*)&fullText[fi], cl);
                      if (cp2 == 0x061C || cp2 == 0x200E || cp2 == 0x200F ||
                          (cp2 >= 0x202A && cp2 <= 0x202E)) { fi += cl; continue; }
                      clean += fullText.substr(fi, cl);
                      fi += cl;
                  }
                  fullText = clean;
              }
              if (fullText.empty()) return result;

              // type: -1=forced, 0=whitespace-only, 1=Latin text, 2=non-Latin,
              //        3=neutral(has digits), 4=punct-only(no digits)
              struct Seg { std::string text; int type; std::string lang; };
              std::vector<Seg> segs;

              // Phase 1: scan into Latin-range vs non-Latin runs; forced overrides per character
              {
                  std::string buf;
                  int bufKind = -1; // 0=latin_range, 1=non_latin

                  auto flushBuf = [&]() {
                      if (buf.empty()) return;
                      if (bufKind == 1) {
                          // AutoTTS w.g(): the GAPS between pattern-d (latRange) matches are hardcoded
                          // type-2, UNCONDITIONALLY (w.java:128,135) — never 0/3/4. w.c() (which yields
                          // 1/3/4) is applied ONLY to pattern-d/Latin-range runs. So a non-Latin run —
                          // including fullwidth digits (U+FF10-19), non-ASCII whitespace (U+3000 etc), and
                          // non-Latin punctuation — is always type-2 (nonLatFall). Matches AutoTTS exactly.
                          segs.push_back({buf, 2, ""});
                      } else {
                          bool allWs = true, hasLetter = false, hasDigit = false;
                          const unsigned char* p = (const unsigned char*)buf.c_str();
                          int blen = (int)buf.size(), j = 0;
                          while (j < blen) {
                              int cl = 0;
                              int cp2 = utf8ToCodepoint(p + j, cl);
                              // Fix C: use codepoint (not first byte) for allWs + Java Character.isWhitespace() set
                              { bool isJWs = (cp2 >= 0x09 && cp2 <= 0x0D) || (cp2 >= 0x1C && cp2 <= 0x1F) ||
                                             cp2 == 0x20 || cp2 == 0x1680 ||
                                             (cp2 >= 0x2000 && cp2 <= 0x200A && cp2 != 0x2007) ||
                                             cp2 == 0x205F || cp2 == 0x3000 ||
                                             cp2 == 0x2028 || cp2 == 0x2029;
                                if (!isJWs) allWs = false; }
                              // AutoTTS w.c(): emoji counts as "letter" (type 1) not neutral
                              // Also covers Latin Extended Additional (U+1E00-U+1EFF, Vietnamese),
                              // Latin Extended-C (U+2C60-U+2C7F), Latin Extended-D (U+A720-U+A7FF)
                              if ((cp2 >= 'a' && cp2 <= 'z') || (cp2 >= 'A' && cp2 <= 'Z') ||
                                  // AutoTTS w.c(): Latin-1 SYMBOLS (¡ £ ¥ © § « » ¿ ± µ ¶ ® ...) are not in pattern-b/c,
                                  // so c() falls through to type-1 (Latin text), NOT type-4 punct. Range 0xA1-0xBF minus
                                  // 0xB0 (degree, a pattern-b digit-like -> type-3, handled below).
                                  (cp2 >= 0x00A1 && cp2 <= 0x00BF && cp2 != 0x00B0) ||
                                  // 0xC0-0x24F letters, EXCLUDING x (0xD7) and division (0xF7): those are pattern-b members
                                  // -> type-3 (number/neutral), not Latin text (they also set hasDigit below).
                                  (cp2 >= 0x00C0 && cp2 <= 0x024F && cp2 != 0x00D7 && cp2 != 0x00F7) ||
                                  (cp2 >= 0x1E00 && cp2 <= 0x1EFF) ||
                                  (cp2 >= 0x2C60 && cp2 <= 0x2C7F) ||
                                  (cp2 >= 0xA720 && cp2 <= 0xA7FF) ||
                                  isEmoji(cp2))
                                  hasLetter = true;
                              // Fix D: track digits + AutoTTS pattern-b extras: °(0x00B0) ×(0x00D7) ÷(0x00F7) currency(0x20A0-0x20CF)
                              if ((cp2 >= '0' && cp2 <= '9') || (cp2 >= 0xFF10 && cp2 <= 0xFF19) ||
                                  cp2 == 0x00B0 || cp2 == 0x00D7 || cp2 == 0x00F7 ||
                                  (cp2 >= 0x20A0 && cp2 <= 0x20CF))
                                  hasDigit = true;
                              j += cl;
                          }
                          // type 3=has digits, type 4=punct-only(no digits) — mirrors AutoTTS w.c()
                          segs.push_back({buf, allWs ? 0 : (hasLetter ? 1 : (hasDigit ? 3 : 4)), ""});
                      }
                      buf.clear(); bufKind = -1;
                  };

                  int len = (int)fullText.size(), i = 0;
                  while (i < len) {
                      int clen = 0;
                      int cp = utf8ToCodepoint((const unsigned char*)&fullText[i], clen);
                      // Latin range — AutoTTS w.java pattern `d` exactly:
                      //   U+0000-U+024F: Basic Latin + Latin-1 + Latin Extended A/B
                      //   U+1E00-U+1EFF: Latin Extended Additional (Vietnamese: ắ, ề, ổ...)
                      //   U+2000-U+206F: General Punctuation / math symbols
                      //   U+20A0-U+20CF: Currency Symbols (€, ₹, ₩, ₽...)
                      //   U+2C60-U+2C7F: Latin Extended-C
                      //   U+A720-U+A7FF: Latin Extended-D
                      // AutoTTS pattern d (w.java:35-37) INCLUDES emoji (via c3.c.a() appended into the
                      // latRange char class) → emoji land in the Latin buffer and w.c() classifies them
                      // type-1 (latFall). Pattern d does NOT include IPA/Phonetic Extensions (U+1D00-1D7F),
                      // so those stay non-Latin (type-2). Emoji are ALWAYS latRange — AutoTTS has no
                      // emoji-language feature (the old emojiFall gate was dead code, always "auto").
                      bool latRange = (cp <= 0x024F) ||
                                      (cp >= 0x1E00 && cp <= 0x1EFF) ||
                                      (cp >= 0x2000 && cp <= 0x206F) ||
                                      (cp >= 0x20A0 && cp <= 0x20CF) ||
                                      (cp >= 0x2C60 && cp <= 0x2C7F) ||
                                      (cp >= 0xA720 && cp <= 0xA7FF) ||
                                      isEmoji(cp);
                      int kind = latRange ? 0 : 1;
                      if (bufKind == -1 || bufKind == kind) { buf += fullText.substr(i, clen); bufKind = kind; }
                      else { flushBuf(); buf = fullText.substr(i, clen); bufKind = kind; }
                      i += clen;
                  }
                  flushBuf();
              }

              // Merge pass — AutoTTS w.java Step 5: merge consecutive same-type segments,
              // absorbing whitespace (type-0) into the surrounding run. This produces large
              // merged non-Latin segments so CLD2 gets enough text to detect reliably.
              // Without this, individual Hindi words (2-5 chars) fool CLD2 into returning "en".
              {
                  std::vector<Seg> merged2;
                  int mi = 0, mtotal = (int)segs.size();
                  while (mi < mtotal) {
                      std::string mtext = segs[mi].text;
                      int mtype = segs[mi].type;
                      int mj = mi + 1;
                      while (mj < mtotal && segs[mj].type != -1 &&
                             (segs[mj].type == mtype || segs[mj].type == 0)) {
                          mtext += segs[mj].text;
                          mj++;
                      }
                      merged2.push_back({mtext, mtype, ""});
                      mi = mj;
                  }
                  segs = std::move(merged2);
              }

              if (segs.empty()) return result;

              // Phase 2: assign languages to type-1/type-2 segments — PURELY TYPE-BASED for BOTH
              // mix and dual, exactly like AutoTTS c3.w.g (w.g NEVER runs CLD2; the per-chunk CLD2
              // = clsCLD2.b happens in the SERVICE loop, which the Kotlin caller ports via
              // detectLanguage() on each emitted chunk). Keeping phase 2 type-based means the
              // phase-3 neutral inheritance and the phase-4 same-lang merge produce chunk
              // BOUNDARIES identical to w.g's type-based merging. (The old per-segment CLD2 here
              // was dead work — its result was discarded by the Kotlin caller — and it could
              // split neighbouring same-type runs into different chunks, unlike w.g.)
              // emojiFall is always "auto" (AutoTTS has no emoji language feature); the parameter
              // is kept for JNI-signature stability. disableAdvancedDetection (S) only affects
              // clsCLD2.b — handled in Kotlin detectLanguage — never w.g.
              (void)emojiFall; (void)disableAdvancedDetection;
              for (auto& seg : segs) {
                  if (seg.type == 1) seg.lang = latFall;        // AutoTTS w.g/onDone: type-1 → H/eng
                  else if (seg.type == 2) seg.lang = nonLatFall; // AutoTTS w.g/onDone: type-2 → I/D
              }

              // Phase 3: resolve type-3 (digits) and type-4 (punct-only) neutral segments.
              // AutoTTS w.g() n3/n4 branches: when numFall/puncFall IS set, the whole
              // segment gets that lang directly — no context scan. When NOT set, use
              // w.a() (forward, pre-real) or w.b() (backward-only, post-real). w.b has
              // NO forward fallback; truly unresolved neutrals fall to neutralDefault.
              bool seenReal = false;
              for (int k = 0; k < (int)segs.size(); k++) {
                  int t = segs[k].type;
                  if (t == 1 || t == 2) { seenReal = true; continue; }
                  if (t != 3 && t != 4) continue;
                  if (t == 4 && !puncFall.empty() && puncFall != "auto") {
                      // AutoTTS w.g() n4 != 0: pure-punct segment → puncFall directly
                      segs[k].lang = puncFall;
                  } else if (t == 3 && !numFall.empty() && numFall != "auto") {
                      // AutoTTS w.g() n3 != 0: digit/neutral segment → numFall directly
                      segs[k].lang = numFall;
                  } else {
                      // AutoTTS w.a (forward, pre-real) / w.b (backward-only, post-real)
                      std::string resolved;
                      if (!seenReal) {
                          for (int f = k + 1; f < (int)segs.size() && resolved.empty(); f++)
                              if (segs[f].type == 1 || segs[f].type == 2) resolved = segs[f].lang;
                      } else {
                          for (int b = k - 1; b >= 0 && resolved.empty(); b--)
                              if (segs[b].type == 1 || segs[b].type == 2) resolved = segs[b].lang;
                      }
                      // Unresolved → neutralDefault: (sysLocale==nonLat) ? nonLat : lat
                      segs[k].lang = resolved.empty() ? neutralDefault : resolved;
                  }
                  segs[k].type = 1; // mark resolved so subsequent backward scans can find it
              }

              // Phase 4: emit output, merge consecutive same-lang, attach whitespace-only to prev
              for (auto& seg : segs) {
                  // Whitespace-only check using full Java isWhitespace set (mirrors flushBuf isJWs)
                  bool wsOnly = true;
                  {
                      const unsigned char* wp = (const unsigned char*)seg.text.c_str();
                      int wi = 0, wlen = (int)seg.text.size();
                      while (wi < wlen) {
                          int cl = 0; int cp4 = utf8ToCodepoint(wp + wi, cl);
                          bool isJWs = (cp4>=0x09&&cp4<=0x0D)||(cp4>=0x1C&&cp4<=0x1F)||
                                       cp4==0x20||cp4==0x1680||
                                       (cp4>=0x2000&&cp4<=0x200A&&cp4!=0x2007)||
                                       cp4==0x205F||cp4==0x3000||
                                       cp4==0x2028||cp4==0x2029;
                          if (!isJWs) { wsOnly = false; break; }
                          wi += cl;
                      }
                  }
                  if (wsOnly) {
                      if (!result.empty()) result.back().text += seg.text;
                      continue;
                  }
                  std::string lang = seg.lang.empty() ? latFall : seg.lang;
                  if (!result.empty() && result.back().lang == lang) result.back().text += seg.text;
                  else result.push_back({lang, seg.text});
              }

              if (!result.empty()) {
                  auto& t = result.back().text;
                  while (!t.empty()) {
                      unsigned char last = (unsigned char)t.back();
                      if (last == 0x20 || (last >= 0x09 && last <= 0x0D) || (last >= 0x1C && last <= 0x1F))
                          t.pop_back();
                      else break;
                  }
              }
              return result;
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_easyvoice_tts_NativeEngine_processDirect(
              JNIEnv* env, jobject, jobject directBuffer, jint length,
              jobjectArray jKeys, jobjectArray jVals,
              jboolean keepEmoji, jboolean countEmoji, jboolean countPunct,
              jstring jLat, jstring jNonLat, jstring jMode,
              jstring jPunc, jstring jNum, jstring jEmoji,
              jstring jNeutralDefault, jboolean jDisableAdvancedDetection)
          {
              if(!directBuffer||length<=0) return env->NewStringUTF("");
              void* buf=env->GetDirectBufferAddress(directBuffer);
              if(!buf) return env->NewStringUTF("");
              std::string rawInput((const char*)buf,(size_t)length);

              const char* latC=env->GetStringUTFChars(jLat,nullptr); std::string latFall(latC); env->ReleaseStringUTFChars(jLat,latC);
              const char* nonLatC=env->GetStringUTFChars(jNonLat,nullptr); std::string nonLatFall(nonLatC); env->ReleaseStringUTFChars(jNonLat,nonLatC);
              const char* modeC=env->GetStringUTFChars(jMode,nullptr); std::string mode(modeC); env->ReleaseStringUTFChars(jMode,modeC);
              const char* puncC=env->GetStringUTFChars(jPunc,nullptr); std::string puncFall(puncC); env->ReleaseStringUTFChars(jPunc,puncC);
              const char* numC=env->GetStringUTFChars(jNum,nullptr); std::string numFall(numC); env->ReleaseStringUTFChars(jNum,numC);
              const char* emojiC=env->GetStringUTFChars(jEmoji,nullptr); std::string emojiFall(emojiC); env->ReleaseStringUTFChars(jEmoji,emojiC);
              const char* ndC=env->GetStringUTFChars(jNeutralDefault,nullptr); std::string neutralDefault(ndC); env->ReleaseStringUTFChars(jNeutralDefault,ndC);
              bool disableAdvancedDetection = (jDisableAdvancedDetection == JNI_TRUE);

              // AutoTTS c3.w.g() has NO dictionary/emoji/punct pre-processing — the jKeys/jVals/
              // keepEmoji/countEmoji/countPunct params are accepted for JNI-signature stability but
              // intentionally IGNORED (dead pre-pass removed to match AutoTTS exactly).
              (void)jKeys; (void)jVals; (void)keepEmoji; (void)countEmoji; (void)countPunct;

              std::vector<std::string> sentences;
              size_t start=0, end=rawInput.find('\0');
              while(end!=std::string::npos){ sentences.push_back(rawInput.substr(start,end-start)); start=end+1; end=rawInput.find('\0',start); }
              if(start<rawInput.size()) sentences.push_back(rawInput.substr(start));

              // AutoTTS c3.w.g() does NO pre-normalisation: the segmenter itself trims + collapses
              // whitespace + strips bidi marks. Pass each sentence through UNCHANGED.
              std::vector<std::string> processed; processed.reserve(sentences.size());
              for(auto& s: sentences){ processed.push_back(s); }

              std::string result;
              if (mode == "mix") {
                  auto chunks = buildMixChunks(processed, latFall, nonLatFall, puncFall, numFall, emojiFall, neutralDefault, disableAdvancedDetection);
                  for(size_t i=0; i<chunks.size(); i++){ result += chunks[i].lang + "|" + chunks[i].text; if(i+1 < chunks.size()) result += "||"; }
              } else if (mode == "dual") {
                  // AutoTTS L=1: same latRange segmentation as mix but type-1→latFall, type-2→nonLatFall, no CLD2.
                  auto chunks = buildMixChunks(processed, latFall, nonLatFall, puncFall, numFall, emojiFall, neutralDefault, disableAdvancedDetection, true);
                  for(size_t i=0; i<chunks.size(); i++){ result += chunks[i].lang + "|" + chunks[i].text; if(i+1 < chunks.size()) result += "||"; }
              } else {
                  auto chunks = buildAutoChunks(processed, latFall, nonLatFall, disableAdvancedDetection);
                  for(size_t i=0; i<chunks.size(); i++){ result += chunks[i].lang + "|" + chunks[i].text; if(i+1 < chunks.size()) result += "||"; }
              }
              return env->NewStringUTF(result.c_str());
          }

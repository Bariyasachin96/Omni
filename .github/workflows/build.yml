          "        // AutoTTS c3.x.g(): getSpans(0, length-1, LocaleSpan.class)\n"
          "        val spans = span.getSpans(0, (span.length - 1).coerceAtLeast(0), LocaleSpan::class.java)\n"
          "        if (spans.isEmpty()) {\n"

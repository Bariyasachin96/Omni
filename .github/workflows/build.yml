                  if ((cp & 0x1FFF80) == 0x1780) return 23;          // Khmer
                  if ((cp & 0x1FFF00) == 0x1E00) return 1;           // Latin Extended Additional
                  if ((cp & 0x1FFFE0) == 0x2C60) return 1;           // Latin Extended-C
                  if ((unsigned)(cp - 0x2E80) < 0x160) return 5;           // CJK radicals / Kangxi
                  if ((unsigned)(cp - 0x3040) < 0xC0)  return 5;           // Hiragana + Katakana
                  if ((unsigned)(cp - 0x3130) < 0x60)  return 25;          // Hangul Compatibility Jamo

          "    private val importSettingsLauncher = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri -> handleImportedSettingsFile(uri) }\n"
          "    private fun restartAfterImport() {\n"
          "        try {\n"
          "            val intent = packageManager.getLaunchIntentForPackage(packageName)\n"
          "            if (intent != null) {\n"
          "                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)\n"
          "                startActivity(intent)\n"
          "                android.os.Process.killProcess(android.os.Process.myPid())\n"
          "            }\n"
          "        } catch (_: Exception) {}\n"
          "    }\n"
          "    private fun handleImportedSettingsFile(uri: android.net.Uri?) {\n"
          "        if (uri == null) return\n"
          "        val prefsManager = SharedPrefsManager(this)\n"
          "        try {\n"
          "            val xml = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: \"\"\n"
          "            val importedCount = prefsManager.importSettingsXml(xml)\n"
          "            val installedPackages = EngineFinder.getEngines(this).map { it.pkg }.toHashSet()\n"
          "            val missingEngines = prefsManager.getReferencedEnginePackages().filter { it !in installedPackages }\n"
          "            if (missingEngines.isEmpty()) {\n"
          "                Toast.makeText(this, \"Imported $importedCount settings. Restarting…\", Toast.LENGTH_SHORT).show()\n"
          "                restartAfterImport()\n"

          "                // native character splitter — safer for apps that mis-tag spans (e.g. some\n"
          "                // versions of TalkBack tagging \"भेजें Button\" as entirely English).\n"
          "                var localeSpanHandled = false\n"
          "                if (useLocaleSpans) {\n"
          "                    val localeChunks = splitByLocaleSpans(rawCharSeq)\n"
          "                    if (localeChunks.isNotEmpty() && localeChunks.any { it.lang != \"UNKNOWN\" }) {\n"
          "                        // AutoTTS mix mode N=true: c3.x.g() chunks → known spans use locale directly;\n"
          "                        // UNKNOWN spans → c3.w.g(text,E,F,a0,W) = NativeEngine.processDirect(\"mix\").\n"
          "                        VhLogger.d(\"[SERVICE] mix mode: locale_spans path produced ${localeChunks.size} chunks\")\n"
          "                        val dictMap = cachedDictMap\n"
          "                        val neutralDefault = if (kfLocale() == prefs.toIso3(nonLatFall)) nonLatFall else latFall  // AutoTTS w.g n6: ISO3 compare (nonLatFall may be ISO2 from the dropdown)\n"
          "                        val disableAdvDet = prefs.getBoolean(\"disable_advanced_detection\", false)\n"
          "                        // AutoTTS mix (AutoTtsService:1811-1818): a KNOWN LocaleSpan goes through\n"

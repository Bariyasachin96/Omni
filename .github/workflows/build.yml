          w("app/src/main/java/com/easyvoice/tts/Languages.kt",
          "package com.easyvoice.tts\n"
          "object Languages {\n"
          "    val map = linkedMapOf(\n"
          "        \"af\" to \"Afrikaans\", \"sq\" to \"Albanian\", \"ar\" to \"Arabic\", \"hy\" to \"Armenian\",\n"
          "        \"az\" to \"Azerbaijani\", \"eu\" to \"Basque\", \"be\" to \"Belarusian\", \"bn\" to \"Bengali\",\n"
          "        \"bs\" to \"Bosnian\", \"bg\" to \"Bulgarian\", \"ca\" to \"Catalan\", \"zh\" to \"Chinese\",\n"
          "        \"hr\" to \"Croatian\", \"cs\" to \"Czech\", \"da\" to \"Danish\", \"nl\" to \"Dutch\",\n"
          "        \"en\" to \"English\", \"et\" to \"Estonian\", \"fi\" to \"Finnish\", \"fr\" to \"French\",\n"
          "        \"gl\" to \"Galician\", \"ka\" to \"Georgian\", \"de\" to \"German\", \"el\" to \"Greek\",\n"
          "        \"gu\" to \"Gujarati\", \"he\" to \"Hebrew\", \"hi\" to \"Hindi\", \"hu\" to \"Hungarian\",\n"
          "        \"is\" to \"Icelandic\", \"id\" to \"Indonesian\", \"ga\" to \"Irish\", \"it\" to \"Italian\",\n"
          "        \"ja\" to \"Japanese\", \"jv\" to \"Javanese\", \"kn\" to \"Kannada\", \"kk\" to \"Kazakh\",\n"
          "        \"km\" to \"Khmer\", \"ko\" to \"Korean\", \"lo\" to \"Lao\", \"lv\" to \"Latvian\",\n"
          "        \"lt\" to \"Lithuanian\", \"mk\" to \"Macedonian\", \"ms\" to \"Malay\", \"ml\" to \"Malayalam\",\n"
          "        \"mt\" to \"Maltese\", \"mr\" to \"Marathi\", \"mn\" to \"Mongolian\", \"ne\" to \"Nepali\",\n"
          "        \"no\" to \"Norwegian\", \"fa\" to \"Persian\", \"pl\" to \"Polish\", \"pt\" to \"Portuguese\",\n"
          "        \"pa\" to \"Punjabi\", \"ro\" to \"Romanian\", \"ru\" to \"Russian\", \"sr\" to \"Serbian\",\n"
          "        \"si\" to \"Sinhalese\", \"sk\" to \"Slovak\", \"sl\" to \"Slovenian\", \"so\" to \"Somali\",\n"
          "        \"es\" to \"Spanish\", \"su\" to \"Sundanese\", \"sw\" to \"Swahili\", \"sv\" to \"Swedish\",\n"
          "        \"ta\" to \"Tamil\", \"te\" to \"Telugu\", \"th\" to \"Thai\", \"tr\" to \"Turkish\",\n"
          "        \"uk\" to \"Ukrainian\", \"ur\" to \"Urdu\", \"uz\" to \"Uzbek\", \"vi\" to \"Vietnamese\",\n"
          "        \"am\" to \"Amharic\", \"bo\" to \"Tibetan\", \"my\" to \"Burmese\", \"or\" to \"Odia\",\n"
          "        \"cy\" to \"Welsh\", \"yo\" to \"Yoruba\", \"zu\" to \"Zulu\"\n"
          "    )\n"
          "    val isoCodes = map.keys.toList()\n"
          "    val displayNames = isoCodes.map { \"${map[it]} ($it)\" }\n"
          "    val sortedIsoCodes: List<String> = run {\n"
          "        val col = java.text.Collator.getInstance()\n"
          "        map.keys.sortedWith { a, b ->\n"
          "            val nA = java.text.Normalizer.normalize(map[a] ?: a, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "            val nB = java.text.Normalizer.normalize(map[b] ?: b, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "            col.compare(nA, nB)\n"
          "        }\n"
          "    }\n"
          "    val sortedDisplayNames: List<String> = sortedIsoCodes.map { \"${map[it]} ($it)\" }\n"
          "}\n")

          # ── VhLogger.kt ──────────────────────────────────────────────────────
          w("app/src/main/java/com/easyvoice/tts/VhLogger.kt",
          "package com.easyvoice.tts\n"
          "import android.content.Context\n"
          "import android.util.Log\n"
          "import java.io.BufferedWriter\n"
          "import java.io.File\n"
          "import java.io.FileWriter\n"
          "import java.io.IOException\n"
          "import java.text.SimpleDateFormat\n"
          "import java.util.Date\n"
          "import java.util.LinkedList\n"
          "import java.util.Locale\n"
          "import java.util.concurrent.ConcurrentHashMap\n"
          "import java.util.concurrent.atomic.AtomicLong\n"
          "object VhLogger {\n"
          "    private const val TAG = \"EASYVOICE-NATIVE\"\n"
          "    private const val MAX_LINES = 8000\n"
          "    private val buffer = LinkedList<String>()\n"
          "    private val sdf = SimpleDateFormat(\"MM-dd HH:mm:ss.SSS\", Locale.US)\n"
          "    private var appContext: Context? = null\n"
          "    @Volatile private var loggingEnabled = false\n"
          "    fun setLoggingEnabled(v: Boolean) { loggingEnabled = v }\n"
          "    private val lastSynthStart = AtomicLong(0)\n"
          "    private val firstAudioPerChunk = ConcurrentHashMap<Int, Long>()\n"
          "    private val sleepCountPerChunk = ConcurrentHashMap<Int, Int>()\n"
          "    private val totalBytesPerChunk = ConcurrentHashMap<Int, Long>()\n"
          "    private val audioCallbackCount = ConcurrentHashMap<Int, Int>()\n"
          "    fun init(ctx: Context) {\n"
          "        appContext = ctx.applicationContext\n"
          "        write(\"I\", \"[LOGGER] VhLogger initialized — device=${android.os.Build.MODEL} sdk=${android.os.Build.VERSION.SDK_INT} android=${android.os.Build.VERSION.RELEASE}\")\n"
          "    }\n"
          "    @Synchronized private fun write(level: String, msg: String) {\n"
          "        if (!loggingEnabled) return\n"
          "        val line = \"${sdf.format(Date())} $level/$TAG: $msg\"\n"
          "        when (level) { \"E\" -> Log.e(TAG, msg); \"W\" -> Log.w(TAG, msg); else -> Log.d(TAG, msg) }\n"
          "        buffer.addLast(line); if (buffer.size > MAX_LINES) buffer.removeFirst()\n"
          "    }\n"
          "    fun d(msg: String) = write(\"D\", msg)\n"
          "    fun w(msg: String) = write(\"W\", msg)\n"
          "    fun e(msg: String) = write(\"E\", msg)\n"
          "    fun i(msg: String) = write(\"I\", msg)\n"
          "    fun markRequest(text: String, totalChunks: Int) {\n"
          "        write(\"I\", \"[REQUEST] ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\")\n"
          "        write(\"I\", \"[REQUEST] textLength=${text.length} totalChunks=$totalChunks\")\n"
          "        write(\"I\", \"[REQUEST] preview=${text.take(120)}\")\n"
          "    }\n"
          "    fun markMode(mode: String) = write(\"D\", \"[MODE] readingMode=$mode\")\n"
          "    fun markNativeInput(sentenceCount: Int, byteLen: Int) = write(\"D\", \"[NATIVE-IN] sentences=$sentenceCount inputBytes=$byteLen\")\n"
          "    fun markNativeOutput(raw: String, chunkCount: Int) {\n"
          "        write(\"D\", \"[NATIVE-OUT] chunkCount=$chunkCount rawLen=${raw.length} preview=${raw.take(200)}\")\n"
          "    }\n"
          "    fun markEngineInit(lang: String, pkg: String, ms: Long) = write(\"D\", \"[ENGINE-INIT] lang=$lang pkg=$pkg initTime=${ms}ms\")\n"
          "    fun markEngineReused(lang: String) = write(\"D\", \"[ENGINE-REUSE] lang=$lang (already in pool)\")\n"
          "    fun markEngineNull(lang: String) = write(\"E\", \"[ENGINE-NULL] initEngineForLang returned null for lang=$lang — chunk will be skipped\")\n"
          "    fun markRateApplied(chunkIndex: Int, finalRate: Float, changed: Boolean) = write(\"D\", \"[CHUNK-$chunkIndex] setSpeechRate finalRate=$finalRate changed=$changed\")\n"
          "    fun markPitchApplied(chunkIndex: Int, finalPitch: Float, changed: Boolean) = write(\"D\", \"[CHUNK-$chunkIndex] setPitch finalPitch=$finalPitch changed=$changed\")\n"
          "    fun markLocaleApplied(chunkIndex: Int, locTag: String, changed: Boolean) = write(\"D\", \"[CHUNK-$chunkIndex] setLanguage locale=$locTag changed=$changed\")\n"
          "    fun markEnginePoolSize(size: Int) = write(\"D\", \"[ENGINE-POOL] activeEngines=$size\")\n"
          "    fun markChunkStart(chunkIndex: Int, total: Int, lang: String, pkg: String, locTag: String, text: String, finalRate: Float, finalPitch: Float, appVolume: Float, sysRate: Float, sysPitch: Float, appRate: Float, appPitch: Float) {\n"
          "        sleepCountPerChunk[chunkIndex] = 0\n"
          "        totalBytesPerChunk[chunkIndex] = 0L\n"
          "        audioCallbackCount[chunkIndex] = 0\n"
          "        write(\"I\", \"[CHUNK-$chunkIndex/$total] ──────────────────────────────────\")\n"
          "        write(\"I\", \"[CHUNK-$chunkIndex/$total] lang=$lang pkg=$pkg locale=$locTag\")\n"
          "        write(\"I\", \"[CHUNK-$chunkIndex/$total] textLen=${text.length} text=${text.take(80)}\")\n"
          "        write(\"I\", \"[CHUNK-$chunkIndex/$total] finalRate=${\"%.2f\".format(finalRate)} (sys=$sysRate x app=$appRate) finalPitch=${\"%.2f\".format(finalPitch)} (sys=$sysPitch x app=$appPitch) vol=$appVolume\")\n"
          "    }\n"
          "    fun markSynthStart(chunkText: String, lang: String, chunkIndex: Int): Long {\n"
          "        val t = System.currentTimeMillis()\n"
          "        lastSynthStart.set(t)\n"
          "        firstAudioPerChunk.remove(chunkIndex)\n"
          "        write(\"D\", \"[CHUNK-$chunkIndex] speak CALLED lang=$lang textLen=${chunkText.length}\")\n"
          "        return t\n"
          "    }\n"
          "    fun markSynthEnd(chunkIndex: Int, startTime: Long) = write(\"D\", \"[CHUNK-$chunkIndex] onDone received — speak elapsed=${System.currentTimeMillis()-startTime}ms\")\n"
          "    fun markSynthError(chunkIndex: Int, reason: String) = write(\"E\", \"[CHUNK-$chunkIndex] SYNTH ERROR: $reason\")\n"
          "    fun markSynthErrorCode(chunkIndex: Int, errorCode: Int) = write(\"E\", \"[CHUNK-$chunkIndex] onError errorCode=$errorCode\")\n"
          "    fun markFirstAudio(chunkIndex: Int) {\n"
          "        val t = System.currentTimeMillis()\n"
          "        if (firstAudioPerChunk.putIfAbsent(chunkIndex, t) == null)\n"
          "            write(\"I\", \"[CHUNK-$chunkIndex] FIRST AUDIO BYTE sent latency=${t - lastSynthStart.get()}ms\")\n"
          "    }\n"
          "    fun markCallbackDone(chunkIndex: Int) = write(\"D\", \"[CHUNK-$chunkIndex] callback.done called\")\n"
          "    fun markFallbackCallbackStart(sampleRate: Int) = write(\"W\", \"[FALLBACK-START] no audio produced — calling callback.start with sampleRate=$sampleRate encoding=PCM_16BIT channels=1\")\n"
          "    fun markStopped(chunkIndex: Int) = write(\"W\", \"[CHUNK-$chunkIndex] isStopped=true detected inside loop — aborting\")\n"
          "    fun markLoopExit(chunkIndex: Int, reason: String) = write(\"D\", \"[CHUNK-$chunkIndex] main loop exited reason=$reason\")\n"
          "    fun markChunkDone(chunkIndex: Int, startTime: Long, totalBytes: Long) {\n"
          "        val sleeps = sleepCountPerChunk[chunkIndex] ?: 0\n"
          "        val calls = audioCallbackCount[chunkIndex] ?: 0\n"
          "        write(\"I\", \"[CHUNK-$chunkIndex] DONE totalBytes=$totalBytes audioCallbacks=$calls totalSleeps=$sleeps totalTime=${System.currentTimeMillis()-startTime}ms\")\n"
          "    }\n"
          "    fun markStop() = write(\"W\", \"[STOP] onStop called — cancelling active synthesis\")\n"
          "    fun markFallback(det: String, fb: String) = write(\"W\", \"[LANG-FALLBACK] detected=$det engine NOT_SET -> fallback lang=$fb\")\n"
          "    fun markSkipped(reason: String) = write(\"W\", \"[SKIPPED] $reason\")\n"
          "    @Synchronized @Throws(IOException::class) fun exportToFile(): File {\n"
          "        val ctx = appContext ?: throw IOException(\"VhLogger not initialized\")\n"
          "        val f = File(ctx.cacheDir, \"easyvoice_debug.txt\")\n"
          "        BufferedWriter(FileWriter(f, false)).use { bw ->\n"
          "            bw.write(\"=== Easy Voice Full Debug Log ===\\nTime: ${Date()}\\nDevice: ${android.os.Build.MODEL}\\nAndroid: ${android.os.Build.VERSION.RELEASE}\\nEntries: ${buffer.size}\\n============================\\n\\n\")\n"
          "            buffer.forEach { bw.write(it); bw.newLine() }\n"
          "        }\n"
          "        return f\n"
          "    }\n"
          "    @Synchronized fun clear() { buffer.clear() }\n"
          "}\n")

          # ── SharedPrefsManager.kt ────────────────────────────────────────────
          w("app/src/main/java/com/easyvoice/tts/SharedPrefsManager.kt",
          "package com.easyvoice.tts\n"
          "import android.content.Context\n"
          "import android.content.SharedPreferences\n"
          "class SharedPrefsManager(context: Context) {\n"
          "    private val prefs: SharedPreferences = context.getSharedPreferences(\"VH_PREFS\", Context.MODE_PRIVATE)\n"
          "    fun toIso3(lang: String): String {\n"
          "        if (lang.length != 2) return lang\n"
          "        return try { java.util.Locale(lang).isO3Language.ifEmpty { lang } } catch (_: Exception) { lang }\n"
          "    }\n"
          "    fun getEngineForLanguage(lang: String): String {\n"
          "        val iso3 = toIso3(lang)\n"
          "        // AutoTTS U(): d.i disabled flag — disabled language treated as not configured\n"
          "        if (prefs.getBoolean(\"${iso3}_disabled\", false)) return \"NOT_SET\"\n"
          "        val combined = prefs.getString(iso3, \"\") ?: \"\"\n"
          "        val pkg = combined.split(\"#\", limit = 2).getOrElse(0) { \"\" }\n"
          "        if (pkg.isNotEmpty()) return pkg\n"
          "        return \"NOT_SET\"\n"
          "    }\n"
          "    fun getLocaleForLangPkg(lang: String, pkg: String): String {\n"
          "        val combined = prefs.getString(toIso3(lang), \"\") ?: \"\"\n"
          "        return combined.split(\"#\", limit = 2).getOrElse(1) { \"\" }\n"
          "    }\n"
          "    fun setLocaleForLangPkg(lang: String, pkg: String, tag: String) {\n"
          "        val iso3 = toIso3(lang)\n"
          "        prefs.edit().putString(iso3, \"$pkg#$tag\").apply()\n"
          "        // AutoTTS U(): language_N sequential list — write when language is configured\n"
          "        addLanguageToList(iso3)\n"
          "    }\n"
          "    // AutoTTS U(): language_0, language_1, … sequential keys listing configured languages\n"
          "    fun getLanguageList(): List<String> {\n"
          "        val out = mutableListOf<String>()\n"
          "        var i = 0\n"
          "        while (true) {\n"
          "            val lang = prefs.getString(\"language_$i\", \"\") ?: \"\"\n"
          "            if (lang.isEmpty()) break\n"
          "            out.add(lang); i++\n"
          "            if (i > 1000) break\n"
          "        }\n"
          "        return out\n"
          "    }\n"
          "    private fun addLanguageToList(iso3: String) {\n"
          "        val list = getLanguageList()\n"
          "        if (list.contains(iso3)) return\n"
          "        prefs.edit().putString(\"language_${list.size}\", iso3).apply()\n"
          "    }\n"
          "    // AutoTTS c3.d.i: ${iso3}_disabled boolean flag\n"
          "    fun isLanguageDisabled(lang: String): Boolean = prefs.getBoolean(\"${toIso3(lang)}_disabled\", false)\n"
          "    fun setLanguageDisabled(lang: String, v: Boolean) = prefs.edit().putBoolean(\"${toIso3(lang)}_disabled\", v).apply()\n"
          "    fun getVoiceName(lang: String): String = prefs.getString(\"${toIso3(lang)}_variant\", \"*Default\") ?: \"*Default\"\n"
          "    fun setVoiceName(lang: String, voiceName: String) = prefs.edit().putString(\"${toIso3(lang)}_variant\", voiceName).apply()\n"
          "    // ── voice_N sequential schema (for original-AutoTTS migration compatibility) ──\n"
          "    // Keys: voice_0, voice_1, voice_2, …  Format: \"name#locale_country_variant\".\n"
          "    // Used by CheckVoiceData.kt's optional sequential-mode and onGetVoices() upstream.\n"
          "    fun getVoiceN(index: Int): String = prefs.getString(\"voice_$index\", \"\") ?: \"\"\n"
          "    fun setVoiceN(index: Int, value: String) = prefs.edit().putString(\"voice_$index\", value).apply()\n"
          "    fun getAllVoicePrefs(): List<String> {\n"
          "        // Walk voice_0, voice_1, …  stopping at the first empty entry. Mirrors the\n"
          "        // original AutoTtsService.V() loader.\n"
          "        val out = mutableListOf<String>()\n"
          "        var i = 0\n"
          "        while (true) {\n"
          "            val v = getVoiceN(i)\n"
          "            if (v.isEmpty()) break\n"
          "            out.add(v); i++\n"
          "            if (i > 1000) break  // safety cap\n"
          "        }\n"
          "        return out\n"
          "    }\n"
          "    fun setString(key: String, v: String) = prefs.edit().putString(key, v).apply()\n"
          "    fun getString(key: String, def: String): String = prefs.getString(key, def) ?: def\n"
          "    fun setInt(key: String, v: Int) = prefs.edit().putInt(key, v).apply()\n"
          "    fun getInt(key: String, def: Int): Int = prefs.getInt(key, def)\n"
          "    fun setBoolean(key: String, v: Boolean) = prefs.edit().putBoolean(key, v).apply()\n"
          "    fun getBoolean(key: String, def: Boolean): Boolean = prefs.getBoolean(key, def)\n"
          "    fun getFloat(key: String, def: Float): Float = prefs.getFloat(key, def)\n"
          "    fun setFloat(key: String, v: Float) = prefs.edit().putFloat(key, v).apply()\n"
          "    fun getReadingMode(): String = prefs.getString(\"reading_mode\", \"auto\") ?: \"auto\"\n"
          "    fun setReadingMode(mode: String) = prefs.edit().putString(\"reading_mode\", mode).apply()\n"
          "    fun isMixMode(): Boolean = getReadingMode() == \"mix\"\n"
          "    fun isSplitMode(): Boolean = isMixMode()\n"
          "    fun addDict(from: String, to: String) = prefs.edit().putString(\"word_$from\", to).apply()\n"
          "    fun removeDict(from: String) = prefs.edit().remove(\"word_$from\").apply()\n"
          "    fun clearDict() { val e=prefs.edit(); prefs.all.keys.filter{it.startsWith(\"word_\")}.forEach{e.remove(it)}; e.apply() }\n"
          "    fun getDict(): Map<String,String> = prefs.all.filterKeys{it.startsWith(\"word_\")}.mapKeys{it.key.substring(5)}.mapValues{it.value.toString()}\n"
          "    // ── Advanced Settings flags ──\n"
          "    fun isBluetoothCarMode(): Boolean = prefs.getBoolean(\"bluetooth_car_mode\", false)\n"
          "    fun setBluetoothCarMode(v: Boolean) = prefs.edit().putBoolean(\"bluetooth_car_mode\", v).apply()\n"
          "    fun isBrokenEngineProtector(): Boolean = prefs.getBoolean(\"broken_engine_protector\", false)\n"
          "    fun setBrokenEngineProtector(v: Boolean) = prefs.edit().putBoolean(\"broken_engine_protector\", v).apply()\n"
          "    // Auto TTS f6830Q — force USAGE_ASSISTANCE_ACCESSIBILITY (11) on all engines globally,\n"
          "    // not just in Bluetooth Car Mode. Ensures TTS audio routes through the accessibility channel.\n"
          "    fun isForceAccessibilityStream(): Boolean = prefs.getBoolean(\"force_accessibility_stream\", false)\n"
          "    fun setForceAccessibilityStream(v: Boolean) = prefs.edit().putBoolean(\"force_accessibility_stream\", v).apply()\n"
          "    // Auto TTS f6831R — show_notification: when false, foreground notification is suppressed.\n"
          "    fun isShowNotification(): Boolean = prefs.getBoolean(\"show_notification\", false)\n"
          "    fun setShowNotification(v: Boolean) = prefs.edit().putBoolean(\"show_notification\", v).apply()\n"
          "    // Auto TTS f6825L==3 — google_tts_only: bypass all detection, route to com.google.android.tts.\n"
          "    fun isGoogleTtsOnly(): Boolean = prefs.getBoolean(\"google_tts_only\", false)\n"
          "    fun setGoogleTtsOnly(v: Boolean) = prefs.edit().putBoolean(\"google_tts_only\", v).apply()\n"
          "    fun isDedicatedEnginesEnabled(): Boolean = prefs.getBoolean(\"dedicated_engines\", false)\n"
          "    fun setDedicatedEnginesEnabled(v: Boolean) = prefs.edit().putBoolean(\"dedicated_engines\", v).apply()\n"
          "    // BUNDLE-Z ITEM 2: LocaleSpan splitter pref (matches original AutoTtsService.N field).\n"
          "    fun isLocaleSpansEnabled(): Boolean = prefs.getBoolean(\"locale_spans\", false)\n"
          "    fun setLocaleSpansEnabled(v: Boolean) = prefs.edit().putBoolean(\"locale_spans\", v).apply()\n"

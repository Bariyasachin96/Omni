          # ── GetSampleText.kt ─────────────────────────────────────────────────
          w("app/src/main/java/com/tts/easyvoice/GetSampleText.kt",
          "package com.tts.easyvoice\n"
          "import android.app.Activity\n"
          "import android.content.Intent\n"
          "import android.os.Bundle\n"
          "import android.speech.tts.TextToSpeech\n"
          "import java.util.Locale\n"
          "class GetSampleText : Activity() {\n"
          "    override fun onCreate(savedInstanceState: Bundle?) {\n"
          "        super.onCreate(savedInstanceState)\n"
          "        // GetSampleText.a(intent): the extra, or the default locale. No guard around either\n"
          "        // this or getISO3Language() — AutoTTS has none.\n"
          "        val langExtra = intent?.getStringExtra(\"language\")\n"
          "        val locale = if (langExtra != null) Locale(langExtra) else Locale.getDefault()\n"
          "        val sample = SampleTexts.get(locale.isO3Language)\n"
          "        val text = if (sample.isEmpty()) \"Sorry. Sample text for language ${locale.getDisplayName(Locale(\"eng\"))} is missing.\" else sample\n"
          "        val data = Intent()\n"
          "        data.putExtra(\"sampleText\", text)\n"
          "        setResult(TextToSpeech.LANG_AVAILABLE, data)\n"
          "        finish()\n"
          "    }\n"
          "}\n")


          # ── MainActivity.kt ──────────────────────────────────────────────────
          # ── TabViews.kt — real-View ports of AutoTTS fragment_modes/advanced/license ──
          w("app/src/main/java/com/tts/easyvoice/TabViews.kt",
          "package com.tts.easyvoice\n"
          "import android.content.Context\n"
          "import android.content.Intent\n"
          "import android.net.Uri\n"
          "import android.os.Build\n"
          "import android.os.PowerManager\n"
          "import android.provider.Settings\n"
          "import android.view.View\n"
          "import android.view.ViewGroup\n"
          "import android.widget.AdapterView\n"
          "import android.widget.ArrayAdapter\n"
          "import android.widget.Button\n"
          "import android.widget.CheckBox\n"
          "import android.widget.LinearLayout\n"
          "import android.widget.RadioButton\n"
          "import android.widget.RadioGroup\n"
          "import android.widget.ScrollView\n"
          "import android.widget.Spinner\n"
          "import android.widget.TextView\n"
          "import android.widget.Toast\n"
          "import androidx.core.content.FileProvider\n"
          "private fun dpToPx(context: Context, dp: Int): Int = (dp * context.resources.displayMetrics.density).toInt()\n"
          "private fun mediumSpinnerAdapter(context: Context, items: List<String>): ArrayAdapter<String> {\n"
          "    val adapter = ArrayAdapter<String>(context, android.R.layout.simple_spinner_item, items)\n"
          "    adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)\n"
          "    return adapter\n"
          "}\n"
          "// Exact port of fragment_modes.xml + c3.j.onRadioButtonClicked + c3.j.U2.\n"
          "// Root has no padding, the ScrollView is fillViewport, and every gap is a per-child margin.\n"
          "fun buildModesTabView(context: Context, prefs: SharedPrefsManager): View {\n"
          "    val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL }\n"
          "    val scroll = ScrollView(context).apply { isFillViewport = true; addView(root) }\n"
          "    val dp5 = dpToPx(context, 5); val dp2 = dpToPx(context, 2)\n"
          "    // <LinearLayout gravity=start background=#ff293842><TextView textSize=18sp #ffffffff margin=5dip/>\n"
          "    fun barHeader18(text: String): View {\n"
          "        val headerBar = LinearLayout(context).apply { gravity = android.view.Gravity.START; setBackgroundColor(0xff293842.toInt()) }\n"
          "        headerBar.addView(android.widget.TextView(context).apply {\n"
          "            this.text = text\n"
          "            setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP, 18f)\n"
          "            setTextColor(0xffffffff.toInt())\n"
          "            gravity = android.view.Gravity.CENTER_VERTICAL\n"
          "        }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {\n"
          "            topMargin = dp5; bottomMargin = dp5; marginStart = dp5; marginEnd = dp5\n"
          "        })\n"
          "        return headerBar\n"
          "    }\n"
          "    // The per-section headers are RelativeLayout bars whose TextView is TextAppearance.Medium,\n"
          "    // not 18sp — @id/auto_mode_header, dual_mode_header, mixed_mode_header.\n"
          "    fun barHeaderMedium(text: String): View {\n"
          "        val headerBar = android.widget.RelativeLayout(context).apply { gravity = android.view.Gravity.START; setBackgroundColor(0xff293842.toInt()) }\n"
          "        headerBar.addView(android.widget.TextView(context).apply {\n"
          "            this.text = text\n"
          "            setTextAppearance(android.R.style.TextAppearance_Medium)\n"
          "            setTextColor(0xffffffff.toInt())\n"
          "            gravity = android.view.Gravity.CENTER_VERTICAL\n"
          "        }, android.widget.RelativeLayout.LayoutParams(android.widget.RelativeLayout.LayoutParams.WRAP_CONTENT, android.widget.RelativeLayout.LayoutParams.WRAP_CONTENT).apply {\n"
          "            topMargin = dp5; bottomMargin = dp5; marginStart = dp5; marginEnd = dp5\n"
          "        })\n"
          "        return headerBar\n"
          "    }\n"
          "    // <TextView gravity=start fill_parent TextAppearance.Small marginTop=5dip marginStart=5dip>\n"
          "    // Used for every spinner caption AND for the \"Other options\" caption — both are Small.\n"
          "    fun smallLabel(parent: LinearLayout, text: String) {\n"
          "        parent.addView(android.widget.TextView(context).apply {\n"
          "            this.text = text\n"
          "            gravity = android.view.Gravity.START\n"
          "            setTextAppearance(android.R.style.TextAppearance_Small)\n"
          "        }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp5; marginStart = dp5 })\n"
          "    }\n"
          "    root.addView(barHeader18(\"Modes\"))\n"
          "    val googleInstalled = try { context.packageManager.getPackageInfo(\"com.google.android.tts\", 0); true } catch (_: Exception) { false }\n"
          "    // <RadioGroup orientation=vertical fill_parent marginStart=5dip>\n"
          "    val radioGroup = RadioGroup(context).apply { orientation = RadioGroup.VERTICAL }\n"
          "    val modeForRadioId = LinkedHashMap<Int, String>()\n"
          "    val modeRows = listOf(\n"
          "        Triple(\"none\", \"None\", \"Disable language detection.\"),\n"
          "        Triple(\"dual\", \"Dual languages\", \"Character-by-character language recognition. Reads Latin words by English, others by user-specified language. This mode is designed for mixed-script texts combining English with a non-Latin language (e.g., English with Hindi)\"),\n"
          "        Triple(\"auto\", \"Auto language detect\", \"Whole-sentence language recognition. Reads text by most appropriated language. If language can't be detected, reads by user-preferred language. This mode is designed for single-script texts from any language.\"),\n"
          "        Triple(\"google\", \"Google TTS\", \"Same as auto mode, but only Google TTS is used.\"),\n"
          "        Triple(\"mix\", \"Mixed mode\", \"Splits text into Latin and non-Latin segments, detects and reads each by the most appropriate language. This mode is designed for mixed-script texts combining a Latin-based language with a non-Latin language (e.g., English with Hindi, or French with Urdu).\"),\n"
          "        Triple(\"multilingual\", \"Multilingual mode (experimental)\", \"Splits text into per-language segments, detects and reads each by the most appropriate language. Because it analyzes the text in detail, this mode may be slower and is less effective for very short texts. It is designed specifically for mixed-script content combining one or more Latin-based languages with one or more non-Latin languages (e.g., English with Hindi and Urdu).\")\n"
          "    )\n"
          "    val initialMode = prefs.getReadingMode()\n"
          "    for ((mode, label, description) in modeRows) {\n"
          "        // <RadioButton wrap_content marginTop=5dip TextAppearance.Medium>\n"
          "        val radio = android.widget.RadioButton(context).apply {\n"
          "            text = label\n"
          "            id = View.generateViewId()\n"
          "            setTextAppearance(android.R.style.TextAppearance_Medium)\n"
          "            isEnabled = if (mode == \"google\") googleInstalled else true\n"
          "            isChecked = initialMode == mode\n"
          "        }\n"
          "        modeForRadioId[radio.id] = mode\n"
          "        radioGroup.addView(radio, RadioGroup.LayoutParams(RadioGroup.LayoutParams.WRAP_CONTENT, RadioGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp5 })\n"
          "        // <TextView gravity=start fill_parent TextAppearance.Small> — no indent in the XML\n"
          "        val desc = android.widget.TextView(context).apply {\n"
          "            text = description\n"
          "            gravity = android.view.Gravity.START\n"
          "            setTextAppearance(android.R.style.TextAppearance_Small)\n"
          "        }\n"
          "        radioGroup.addView(desc, RadioGroup.LayoutParams(RadioGroup.LayoutParams.MATCH_PARENT, RadioGroup.LayoutParams.WRAP_CONTENT))\n"
          "        // The Google radio and its description carry android:visibility=\"gone\" in the layout;\n"
          "        // U2 only calls O0.setEnabled(v.a(ctx)), it never makes them visible.\n"
          "        if (mode == \"google\") { radio.visibility = View.GONE; desc.visibility = View.GONE }\n"
          "    }\n"
          "    root.addView(radioGroup, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { marginStart = dp5 })\n"
          "    // E0/F0/G0/H0 — each <LinearLayout vertical fill_parent visibility=gone marginTop=5dip>\n"
          "    fun modeSection(): LinearLayout {\n"
          "        val section = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL; visibility = View.GONE }\n"
          "        root.addView(section, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp5 })\n"
          "        return section\n"
          "    }\n"
          "    val autoSection = modeSection()\n"
          "    val dualSection = modeSection()\n"
          "    val mixedSection = modeSection()\n"
          "    val multilingualSection = modeSection()\n"
          "    // c3.m.c — the unfiltered language list, rebuilt by m.h(ctx, false) on every radio click.\n"
          "    // c3.m.g(iso3) indexes into THAT list, and the adapter is c3.m.m(pkg) over the same list,\n"
          "    // so in every mode but Google the two line up one to one.\n"
          "    var allCodes: List<String> = emptyList()\n"
          "    var adapterLabels: List<String> = emptyList()\n"
          "    val languageSpinners = mutableListOf<Pair<Spinner, String>>()\n"
          "    fun addLanguageSpinner(parent: LinearLayout, labelText: String, prefKey: String): Spinner {\n"
          "        smallLabel(parent, labelText)\n"
          "        val spinner = Spinner(context)\n"
          "        // <Spinner fill_parent marginTop=2dip marginStart=5dip>\n"
          "        parent.addView(spinner, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp2; marginStart = dp5 })\n"
          "        spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "            override fun onItemSelected(parentView: AdapterView<*>?, view: View?, position: Int, rowId: Long) {\n"
          "                // j.O1: F/G/K/L = m.c.get(spinner.getSelectedItemPosition()).b — the position\n"
          "                // indexes m.c, not the adapter. They stay one to one even in Google mode,\n"
          "                // because m.h already dropped every non-Google voice when O == 3, so the\n"
          "                // m.m(\"com.google.android.tts\") filter has nothing left to remove.\n"
          "                // The multilingual pair writes the very same K/L the mixed pair writes.\n"
          "                try {\n"
          "                    // O1 assigns the STATIC and nothing else — no SharedPreferences write\n"
          "                    // anywhere in the settings UI. m.w(ctx) on pause is what persists these.\n"
          "                    if (position in allCodes.indices) {\n"
          "                        val picked = allCodes[position]\n"
          "                        when (prefKey) {\n"
          "                            \"auto_mode_language\" -> EasyVoiceTtsService.autoLang = picked\n"
          "                            \"dual_mode_language\" -> EasyVoiceTtsService.dualLang = picked\n"
          "                            \"mixed_mode_latin_language\" -> EasyVoiceTtsService.mixLatinLang = picked\n"
          "                            else -> EasyVoiceTtsService.mixNonLatinLang = picked\n"
          "                        }\n"
          "                    }\n"
          "                    for ((sibling, sibKey) in languageSpinners) {\n"
          "                        if (sibKey == prefKey && sibling !== spinner && sibling.selectedItemPosition != position) sibling.setSelection(position)\n"
          "                    }\n"
          "                } catch (ex: Exception) { ex.printStackTrace() }\n"
          "            }\n"
          "            override fun onNothingSelected(parentView: AdapterView<*>?) {}\n"
          "        }\n"
          "        languageSpinners.add(spinner to prefKey)\n"
          "        return spinner\n"
          "    }\n"
          "    // onRadioButtonClicked, every mode but None: m.c.clear(); m.c.addAll(m.h(ctx, false))\n"
          "    // with AutoTtsService.O ALREADY set to the new mode, then the adapter is m.m(pkg) —\n"
          "    // pkg is \"com.google.android.tts\" for Google and null everywhere else — and the\n"
          "    // selection is m.g(F/G/K/L), the index of that language in m.c.\n"
          "    fun applyLanguageAdapters(mode: String) {\n"
          "        val modeInt = when (mode) { \"dual\" -> 1; \"auto\" -> 2; \"google\" -> 3; \"mix\" -> 4; \"multilingual\" -> 5; else -> 0 }\n"
          "        // m.n() reads F/G/K/L, the statics — not SharedPreferences.\n"
          "        val required = LangStore.requiredLangs(modeInt,\n"
          "            EasyVoiceTtsService.autoLang,\n"
          "            EasyVoiceTtsService.dualLang,\n"
          "            EasyVoiceTtsService.mixLatinLang,\n"
          "            EasyVoiceTtsService.mixNonLatinLang)\n"
          "        LangStore.languages.clear()\n"
          "        LangStore.languages.addAll(LangStore.rebuildFromScan(context, false, modeInt, required, EngineFinder.lastScanVoices))\n"
          "        allCodes = LangStore.languages.map { it.iso3 }\n"
          "        adapterLabels = LangStore.labelsFor(if (mode == \"google\") \"com.google.android.tts\" else null)\n"
          "        // One adapter object for every language spinner, as onRadioButtonClicked does.\n"
          "        val langAdapter = mediumSpinnerAdapter(context, adapterLabels)\n"
          "        for ((spinner, prefKey) in languageSpinners) {\n"
          "            spinner.adapter = langAdapter\n"
          "            // onRadioButtonClicked sets each spinner to m.g(F / G / K / L) — the index of\n"
          "            // the STATIC in m.c. m.q already gave those the device-language fallback, so\n"
          "            // re-reading the pref here would be a second source of truth.\n"
          "            val iso3 = when (prefKey) {\n"
          "                \"auto_mode_language\" -> EasyVoiceTtsService.autoLang\n"
          "                \"dual_mode_language\" -> EasyVoiceTtsService.dualLang\n"
          "                \"mixed_mode_latin_language\" -> EasyVoiceTtsService.mixLatinLang\n"
          "                else -> EasyVoiceTtsService.mixNonLatinLang\n"
          "            }\n"
          "            val index = LangStore.indexOf(iso3)\n"
          "            if (index != -1) spinner.setSelection(index)\n"
          "        }\n"
          "    }\n"
          "    autoSection.addView(barHeaderMedium(\"Mode Settings\"))\n"
          "    addLanguageSpinner(autoSection, \"Select preferred language:\", \"auto_mode_language\")\n"
          "    smallLabel(autoSection, \"Other options\")\n"
          "    val localeSpanBoxes = ArrayList<android.widget.CheckBox>()\n"
          "    // AutoTTS j.U2 R0/S0/T0: three checkboxes over the single flag Q, each mirroring the\n"
          "    // other two. <CheckBox gravity=center_vertical fill_parent/fill_parent checked=false>\n"
          "    fun addLocaleSpanRow(parent: LinearLayout) {\n"
          "        val checkBox = android.widget.CheckBox(context).apply {\n"
          "            text = \"Supports multilingual text with locale spans\"\n"
          "            gravity = android.view.Gravity.CENTER_VERTICAL\n"
          "            isChecked = EasyVoiceTtsService.localeSpansFlag\n"
          "        }\n"
          "        parent.addView(checkBox, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT))\n"
          "        checkBox.setOnCheckedChangeListener { _, checked ->\n"
          "            // R0/S0/T0 assign Q only; m.v(ctx) on pause writes locale_spans.\n"
          "            EasyVoiceTtsService.localeSpansFlag = checked\n"
          "            // U2: each of R0/S0/T0 sets Q then calls setChecked(Q) on the other two,\n"
          "            // unconditionally. CompoundButton.setChecked no-ops when unchanged, so this\n"
          "            // never recurses.\n"
          "            for (other in localeSpanBoxes) if (other !== checkBox) other.isChecked = checked\n"
          "        }\n"
          "        localeSpanBoxes.add(checkBox)\n"
          "    }\n"
          "    addLocaleSpanRow(autoSection)\n"
          "    dualSection.addView(barHeaderMedium(\"Mode Settings\"))\n"
          "    addLanguageSpinner(dualSection, \"Select secondary language:\", \"dual_mode_language\")\n"
          "    // U2: ONE ArrayAdapter over the three strings, handed to all four spinners —\n"
          "    //   t0.setAdapter(list); t0.setSelection(H);   u0.setAdapter(list); u0.setSelection(I);\n"
          "    //   v0.setAdapter(list); v0.setSelection(H);   w0.setAdapter(list); w0.setSelection(I);\n"
          "    // The selections come from the statics, not from SharedPreferences.\n"
          "    val modeOptionLabels = listOf(\"Auto language\", \"Primary language\", \"Secondary language\")\n"
          "    val modeOptionAdapter = mediumSpinnerAdapter(context, modeOptionLabels)\n"
          "    val modeOptionSpinners = mutableListOf<Pair<Spinner, String>>()\n"
          "    fun addModeOptionSpinner(parent: LinearLayout, labelText: String, groupKey: String, initial: Int, onSelect: (Int) -> Unit) {\n"
          "        smallLabel(parent, labelText)\n"
          "        val spinner = Spinner(context)\n"
          "        parent.addView(spinner, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp2; marginStart = dp5 })\n"
          "        spinner.adapter = modeOptionAdapter\n"
          "        if (initial in modeOptionLabels.indices) spinner.setSelection(initial)\n"
          "        spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "            override fun onItemSelected(parentView: AdapterView<*>?, view: View?, position: Int, rowId: Long) {\n"
          "                try {\n"
          "                    onSelect(position)\n"
          "                    for ((sibling, sibKey) in modeOptionSpinners) {\n"
          "                        if (sibKey == groupKey && sibling !== spinner && sibling.selectedItemPosition != position) sibling.setSelection(position)\n"
          "                    }\n"
          "                } catch (ex: Exception) { ex.printStackTrace() }\n"
          "            }\n"
          "            override fun onNothingSelected(parentView: AdapterView<*>?) {}\n"
          "        }\n"
          "        modeOptionSpinners.add(spinner to groupKey)\n"
          "    }\n"
          "    addModeOptionSpinner(dualSection, \"Select language for reading numbers:\", \"number\", EasyVoiceTtsService.numberModeInt) { EasyVoiceTtsService.numberModeInt = it }\n"
          "    addModeOptionSpinner(dualSection, \"Select language for reading punctuations:\", \"punc\", EasyVoiceTtsService.puncModeInt) { EasyVoiceTtsService.puncModeInt = it }\n"
          "    mixedSection.addView(barHeaderMedium(\"Mode Settings\"))\n"
          "    addLanguageSpinner(mixedSection, \"Preferred language for Latin text\", \"mixed_mode_latin_language\")\n"
          "    addLanguageSpinner(mixedSection, \"Preferred language for non-Latin text\", \"mixed_mode_non_latin_language\")\n"
          "    addModeOptionSpinner(mixedSection, \"Select language for reading numbers:\", \"number\", EasyVoiceTtsService.numberModeInt) { EasyVoiceTtsService.numberModeInt = it }\n"
          "    addModeOptionSpinner(mixedSection, \"Select language for reading punctuations:\", \"punc\", EasyVoiceTtsService.puncModeInt) { EasyVoiceTtsService.puncModeInt = it }\n"
          "    smallLabel(mixedSection, \"Other options\")\n"
          "    addLocaleSpanRow(mixedSection)\n"
          "    // MultilingualModeSettings has the two language spinners and the locale-spans row only —\n"
          "    // no number and no punctuation spinner.\n"
          "    multilingualSection.addView(barHeaderMedium(\"Mode Settings\"))\n"
          "    addLanguageSpinner(multilingualSection, \"Preferred language for Latin text\", \"mixed_mode_latin_language\")\n"
          "    addLanguageSpinner(multilingualSection, \"Preferred language for non-Latin text\", \"mixed_mode_non_latin_language\")\n"
          "    smallLabel(multilingualSection, \"Other options\")\n"
          "    addLocaleSpanRow(multilingualSection)\n"
          "    // j.onRadioButtonClicked: None hides all four sections and touches nothing else — it does\n"
          "    // not rebuild m.c and it does not re-adapter any spinner.\n"
          "    fun onModeSelected(mode: String) {\n"
          "        prefs.setReadingMode(mode)\n"
          "        autoSection.visibility = if (mode == \"auto\" || mode == \"google\") View.VISIBLE else View.GONE\n"
          "        dualSection.visibility = if (mode == \"dual\") View.VISIBLE else View.GONE\n"
          "        mixedSection.visibility = if (mode == \"mix\") View.VISIBLE else View.GONE\n"
          "        multilingualSection.visibility = if (mode == \"multilingual\") View.VISIBLE else View.GONE\n"
          "        if (mode == \"none\") return\n"
          "        applyLanguageAdapters(mode)\n"
          "    }\n"

          "    var searchQuery by rememberSaveable { mutableStateOf(\"\") }  // AutoTTS offscreenPageLimit(4): SearchView text survives tab switches (fragment alive)\n"
          "    // AutoTTS c3/i.java M2()/Q2(): a filter button toggles the list between all languages and\n"
          "    // selected-only, its label swapping between \"Show selected\" and \"Show all\".\n"
          "    var showSelectedOnly by rememberSaveable { mutableStateOf(false) }  // AutoTTS: Show-selected toggle state survives tab switches\n"
          "    var scannedLangs by remember { mutableStateOf<Set<String>>(emptySet()) }\n"
          "    var scanning by remember { mutableStateOf(true) }\n"
          "    LaunchedEffect(readingMode) {\n"
          "        // AutoTTS M2(): Google mode (L=3) → only Google TTS's languages; Auto/Mix → all engines.\n"
          "        val onlyPkg = if (readingMode == \"google\") \"com.google.android.tts\" else null\n"
          "        scanning = true\n"
          "        try { EngineFinder.scanLanguages(context, onlyPkg) { scannedLangs = it; scanning = false } } catch (_: Exception) { scanning = false }\n"
          "    }\n"
          "    // AutoTTS c3/i.java M2(): each checkbox = !d.i (the _disabled flag). ALL scanned languages are\n"
          "    // ENABLED by default; the user UNCHECKS to DISABLE a language for detection/routing. Unchecking\n"
          "    // writes setLanguageDisabled(true) → getEngineForLanguage()=NOT_SET → out of enabledLangs (the CLD2\n"
          "    // filter). This is opt-OUT, exactly like AutoTTS — not the old opt-in configured_languages set.\n"
          "    // AutoTTS k.n(): the current mode's force-enabled languages CANNOT be disabled in the Languages\n"
          "    // tab. auto/google → [auto_mode_language]; mix → [mixed_mode_latin_language, non_latin]. (ISO3.)\n"
          "    val forceEnabledIso3 = remember(readingMode) {\n"
          "        val dev = try { java.util.Locale.getDefault().isO3Language } catch (_: Exception) { \"eng\" }\n"
          "        fun norm(s: String) = if (s.isEmpty()) dev else prefs.toIso3(s)\n"
          "        val fe = HashSet<String>()\n"
          "        when (readingMode) {\n"
          "            \"auto\", \"google\" -> fe.add(norm(prefs.getString(\"auto_mode_language\", \"\")))\n"
          "            \"mix\" -> { fe.add(norm(prefs.getString(\"mixed_mode_latin_language\", \"\"))); fe.add(norm(prefs.getString(\"mixed_mode_non_latin_language\", \"\"))) }\n"
          "        }\n"
          "        fe\n"
          "    }\n"
          "    fun isForceEnabled(code: String) = prefs.toIso3(code) in forceEnabledIso3\n"
          "    // AutoTTS M2: checkbox = !d.i; a force-enabled (k.n) language is always kept checked.\n"
          "    var checkedSet by remember(scannedLangs, forceEnabledIso3) { mutableStateOf(scannedLangs.filter { !prefs.isLanguageDisabled(it) || isForceEnabled(it) }.toSet()) }\n"
          "    // AutoTTS parity: list is built PURELY from languages that installed TTS engines report\n"
          "    // (no static/hardcoded list). Display name uses friendly map when known, else Locale.\n"
          "    val entries = remember(scannedLangs) {\n"
          "        val codes = LinkedHashSet<String>()\n"
          "        codes.addAll(scannedLangs)\n"
          "        val col = java.text.Collator.getInstance()\n"
          "        codes.map { code ->\n"
          "            val name = Languages.map[code] ?: run {\n"
          "                val dn = try { java.util.Locale(code).displayLanguage } catch (_: Exception) { \"\" }\n"
          "                if (dn.isNotBlank() && dn != code) dn else code.uppercase()\n"
          "            }\n"
          "            Pair(code, \"$name ($code)\")\n"
          "        }.sortedWith { a, b ->\n"
          "            val nA = java.text.Normalizer.normalize(a.second, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "            val nB = java.text.Normalizer.normalize(b.second, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"

                      } else {
                          cp = 0xFFFD; cpLen = 1;
                      }
                      int sc = glsClassify(cp);
                      if (sc < 0) sc = curScript;
                      else if (curScript != 0 && sc != curScript) { glsEmit(spanStart, i - spanStart, curScript); spanStart = i; }
                      i += cpLen;
                      curScript = sc;
                  }
                  glsEmit(spanStart, n - spanStart, curScript);
              }
              std::vector<std::string> flat;
              for(size_t si=0; si<spans.size(); si++){
                  const LSpan& s = spans[si];
                  if(s.offset < 0 || s.bytes <= 0 || (size_t)(s.offset + s.bytes) > text.size()) continue;
                  flat.push_back(s.lang);
                  flat.push_back(s.latin ? "1" : "0");
                  flat.push_back(text.substr(s.offset, (size_t)s.bytes));
              }
              jobjectArray arr=env->NewObjectArray((jsize)flat.size(), sc, nullptr);
              for(jsize i=0;i<(jsize)flat.size();i++) env->SetObjectArrayElement(arr,i,env->NewStringUTF(flat[i].c_str()));
              return arr;
          }

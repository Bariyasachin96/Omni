          "        val list = mutableListOf<Voice>()\n"
          "        try {\n"
          "            for (iso in Languages.map.keys) {\n"
          "                if (prefs.getEngineForLanguage(iso) == \"NOT_SET\") continue\n"
          "                val locale = Locale(iso)\n"
          "                val voice = Voice(\n"
          "                    iso,\n"
          "                    locale,\n"
          "                    400,                 // quality — matches original AutoTTS Voice ctor\n"
          "                    100,                 // latency — matches original AutoTTS Voice ctor\n"
          "                    false,\n"
          "                    emptySet()\n"
          "                )\n"
          "                list.add(voice)\n"
          "            }\n"
          "        } catch (e: Exception) { VhLogger.e(\"[SERVICE] onGetVoices failed: ${e.message}\") }\n"
          "        return list\n"

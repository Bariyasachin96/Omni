name: Build Easy Voice Native
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.1.8937393" "cmake;3.22.1" --sdk_root=$ANDROID_HOME

      - name: Clone CLD2 Native Library
        run: |
          mkdir -p app/src/main/cpp
          git clone --depth 1 https://github.com/CLD2Owners/cld2.git app/src/main/cpp/cld2_src

      - name: Generate Complete Project
        run: |
          python3 << 'PYEOF'
          import os, textwrap

          def w(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # ── gradle.properties ────────────────────────────────────────────────
          w("gradle.properties", "android.useAndroidX=true\n"
            "android.enableJetifier=true\n"
            "org.gradle.jvmargs=-Xmx3096m -Dfile.encoding=UTF-8\n"
            "org.gradle.daemon=false\n"
            "android.enableR8.fullMode=true\n")

          # ── settings.gradle.kts ──────────────────────────────────────────────
          w("settings.gradle.kts", """\
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EasyVoice"
          include(":app")
          """)

          # ── build.gradle.kts (root) ──────────────────────────────────────────
          w("build.gradle.kts", """\
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.google.gms.google-services") version "4.4.1" apply false
          }
          """)

          # ── app/build.gradle.kts ─────────────────────────────────────────────
          w("app/build.gradle.kts", """\
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }
          android {
              namespace = "com.easyvoice.tts"
              compileSdk = 34
              ndkVersion = "25.1.8937393"
              defaultConfig {
                  applicationId = "com.easyvoice.tts"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "16.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags += listOf("-std=c++17", "-Wno-narrowing", "-O3", "-g0")
                          arguments += listOf("-DANDROID_STL=c++_static")
                      }
                  }
                  ndk { abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a")) }
              }
              sourceSets { getByName("main") { java.srcDirs("src/main/java") } }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
              externalNativeBuild { cmake { path = file("src/main/cpp/CMakeLists.txt"); version = "3.22.1" } }
              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("easyvoice-release.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "sachin1211"
                      keyAlias = System.getenv("KEY_ALIAS") ?: "sachin"
                      keyPassword = System.getenv("KEY_PASSWORD") ?: "sachin1211"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("release")
                  }
                  debug { isMinifyEnabled = false }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources { excludes.add("**/libc++_shared.so") } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              val composeBom = enforcedPlatform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              // ── Firebase Auth + Firestore + Google Sign-In (tester gating) ──
              implementation(platform("com.google.firebase:firebase-bom:32.7.0"))
              implementation("com.google.firebase:firebase-auth-ktx")
              implementation("com.google.firebase:firebase-firestore-ktx")
              implementation("com.google.android.gms:play-services-auth:20.7.0")
          }
          """)

          # ── proguard-rules.pro ───────────────────────────────────────────────
          w("app/proguard-rules.pro", """\
          -repackageclasses 'o'
          -allowaccessmodification
          -keep class com.easyvoice.tts.NativeEngine { native <methods>; }
          -keepclassmembers class kotlinx.coroutines.** { volatile <fields>; }
          -dontwarn kotlinx.coroutines.**
          -keep class androidx.compose.animation.** { *; }
          -keep class androidx.compose.animation.core.** { *; }
          -dontwarn com.google.firebase.**
          -dontwarn com.google.android.gms.**
          -dontwarn javax.annotation.**
          -dontwarn javax.naming.**
          -dontwarn org.checkerframework.**
          -dontwarn com.google.auto.value.**
          -dontwarn com.google.errorprone.annotations.**
          """)


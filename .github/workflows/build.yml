          "        Spacer(modifier = Modifier.height(8.dp))\n"
          "        LazyColumn(modifier = Modifier.fillMaxSize()) {\n"
          "            val filtered = Languages.isoCodes.indices.filter { i ->\n"
          "                searchQuery.isBlank() || Languages.displayNames[i].contains(searchQuery, ignoreCase = true)\n"
          "            }\n"
          "            items(filtered) { i ->\n"
          "                val iso = Languages.isoCodes[i]\n"
          "                val display = Languages.displayNames[i]\n"
          "                val isAdded = iso in configuredSet\n"
          "                Row(\n"
          "                    modifier = Modifier\n"
          "                        .fillMaxWidth()\n"
          "                        .clickable {\n"
          "                            val newSet = if (isAdded) configuredSet - iso else configuredSet + iso\n"
          "                            configuredSet = newSet\n"
          "                            prefs.setString(\"configured_languages\", newSet.joinToString(\",\"))\n"
          "                        }\n"
          "                        .padding(vertical = 14.dp, horizontal = 4.dp)\n"
          "                        .semantics { contentDescription = if (isAdded) \"$display, added. Tap to remove.\" else \"$display. Tap to add.\" },\n"
          "                    verticalAlignment = Alignment.CenterVertically\n"
          "                ) {\n"
          "                    Text(display, modifier = Modifier.weight(1f), style = MaterialTheme.typography.bodyLarge)\n"
          "                    if (isAdded) {\n"
          "                        Icon(Icons.Filled.Check, contentDescription = null, tint = MaterialTheme.colorScheme.primary)\n"
          "                    }\n"
          "                }\n"
          "                Divider()\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "}\n"
          "\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// ConfigurationTabContent — Tab 1: dynamic mode toggle + language list\n"
          "// Tap language → detail screen. Long press → remove dialog.\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "@OptIn(ExperimentalFoundationApi::class)\n"
          "@Composable\n"
          "private fun ConfigurationTabContent(\n"
          "    prefs: SharedPrefsManager,\n"
          "    ttsHolder: () -> android.speech.tts.TextToSpeech?,\n"
          "    setTts: (android.speech.tts.TextToSpeech?) -> Unit,\n"
          "    onDetailOpenChange: (Boolean) -> Unit = {}\n"
          ") {\n"
          "    val context = LocalContext.current\n"
          "    val engines = remember { EngineFinder.getEngines(context).toMutableList().apply { add(0, EngineFinder.TTSInfo(\"NOT_SET\", \"--- Not Set ---\")) } }\n"
          "    var configuredSet by remember {\n"
          "        mutableStateOf(prefs.getString(\"configured_languages\", \"\").split(\",\").filter { it.isNotBlank() }.toSet())\n"
          "    }\n"
          "    var selectedIso by remember { mutableStateOf<String?>(null) }\n"
          "    var removeDialogIso by remember { mutableStateOf<String?>(null) }\n"
          "    LaunchedEffect(selectedIso) { onDetailOpenChange(selectedIso != null) }\n"
          "    DisposableEffect(Unit) { onDispose { onDetailOpenChange(false) } }\n"
          "    removeDialogIso?.let { iso ->\n"
          "        val langName = Languages.map[iso] ?: iso\n"
          "        AlertDialog(\n"
          "            onDismissRequest = { removeDialogIso = null },\n"
          "            title = { Text(\"Remove Language\") },\n"
          "            text = { Text(\"Remove $langName from configuration?\") },\n"
          "            confirmButton = { TextButton(onClick = {\n"
          "                val newSet = configuredSet - iso\n"
          "                configuredSet = newSet\n"
          "                prefs.setString(\"configured_languages\", newSet.joinToString(\",\"))\n"
          "                if (selectedIso == iso) selectedIso = null\n"
          "                removeDialogIso = null\n"
          "            }) { Text(\"Yes\") } },\n"
          "            dismissButton = { TextButton(onClick = { removeDialogIso = null }) { Text(\"No\") } }\n"
          "        )\n"
          "    }\n"
          "    BackHandler(enabled = selectedIso != null) { selectedIso = null }\n"
          "    if (selectedIso != null) {\n"
          "        LangDetailScreen(\n"
          "            iso = selectedIso!!,\n"
          "            prefs = prefs,\n"
          "            engines = engines,\n"
          "            ttsHolder = ttsHolder,\n"
          "            setTts = setTts,\n"
          "            onBack = { selectedIso = null }\n"
          "        )\n"
          "    } else {\n"
          "        Column(modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 12.dp)) {\n"
          "            Text(\"Configuration\", style = MaterialTheme.typography.headlineSmall, modifier = Modifier.semantics { heading() })\n"
          "            Spacer(modifier = Modifier.height(12.dp))\n"
          "            Divider()\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            if (configuredSet.isEmpty()) {\n"
          "                Text(\"No languages added yet. Go to the Language tab and tap a language to add it.\", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.padding(vertical = 24.dp))\n"
          "            } else {\n"
          "                LazyColumn(modifier = Modifier.fillMaxSize()) {\n"
          "                    items(configuredSet.toList()) { iso ->\n"
          "                        val langName = Languages.map[iso] ?: iso\n"
          "                        Card(\n"
          "                            modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),\n"
          "                            elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)\n"
          "                        ) {\n"
          "                            Row(\n"
          "                                modifier = Modifier.fillMaxWidth()\n"
          "                                    .combinedClickable(\n"
          "                                        onClick = { selectedIso = iso },\n"
          "                                        onLongClick = { removeDialogIso = iso }\n"
          "                                    )\n"
          "                                    .padding(16.dp),\n"
          "                                verticalAlignment = Alignment.CenterVertically\n"
          "                            ) {\n"
          "                                Text(\"$langName ($iso)\", style = MaterialTheme.typography.titleMedium, modifier = Modifier.weight(1f))\n"
          "                                Icon(Icons.Filled.ChevronRight, contentDescription = \"Open settings\")\n"
          "                            }\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "}\n"
          "\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// LangDetailScreen — full settings screen for one configured language\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "@Composable\n"
          "private fun LangDetailScreen(\n"
          "    iso: String,\n"
          "    prefs: SharedPrefsManager,\n"
          "    engines: List<EngineFinder.TTSInfo>,\n"
          "    ttsHolder: () -> android.speech.tts.TextToSpeech?,\n"
          "    setTts: (android.speech.tts.TextToSpeech?) -> Unit,\n"
          "    onBack: () -> Unit\n"
          ") {\n"
          "    val context = LocalContext.current\n"
          "    val langName = Languages.map[iso] ?: iso\n"
          "    var selEngPkg by remember(iso) { mutableStateOf(prefs.getEngineForLanguage(iso)) }\n"
          "    var availableLocales by remember(iso, selEngPkg) { mutableStateOf(listOf<Locale>()) }\n"
          "    var availableVoiceNames by remember(iso, selEngPkg) { mutableStateOf(listOf<String>()) }\n"
          "    var selLocTag by remember(iso, selEngPkg) { mutableStateOf(prefs.getLocaleForLangPkg(iso, selEngPkg)) }\n"
          "    val currentKey = \"${iso}_${selEngPkg}\"\n"
          "    var rate by remember(currentKey) { mutableIntStateOf(prefs.getInt(\"rate_$currentKey\", 100).coerceIn(0, 400)) }\n"
          "    var pitch by remember(currentKey) { mutableIntStateOf(prefs.getInt(\"pitch_$currentKey\", 100).coerceIn(0, 300)) }\n"
          "    var vol by remember(currentKey) { mutableIntStateOf(prefs.getInt(\"vol_$currentKey\", 100).coerceIn(0, 100)) }\n"
          "    var selVoiceName by remember(selLocTag, selEngPkg, iso) { mutableStateOf(prefs.getVoiceName(iso, selEngPkg, selLocTag)) }\n"
          "    LaunchedEffect(selEngPkg, iso) {\n"
          "        if (selEngPkg != \"NOT_SET\") {\n"
          "            ttsHolder()?.shutdown()\n"
          "            // Use array holder (not var ref) so callback captures the slot, not a null var.\n"
          "            // Some engines (e.g. Eloquence) fire the callback synchronously before the\n"
          "            // var-ref assignment executes, leaving ref=null inside the lambda.\n"
          "            val holder = arrayOfNulls<android.speech.tts.TextToSpeech>(1)\n"
          "            holder[0] = android.speech.tts.TextToSpeech(context, { status ->\n"
          "                if (status == android.speech.tts.TextToSpeech.SUCCESS) {\n"
          "                    val tts = holder[0]\n"
          "                    // Flexible locale matching (AutoTTS NewSettingsActivity pattern):\n"
          "                    // Some engines use 3-letter ISO-639-2 codes (Locale(\"eng\",\"USA\"))\n"
          "                    // so .language == \"eng\" != \"en\". Also try languageTag prefix match.\n"
          "                    fun localeMatchesIso(loc: java.util.Locale): Boolean {\n"
          "                        val lang = loc.language.lowercase()\n"
          "                        val tag  = loc.toLanguageTag().lowercase()\n"
          "                        val target = iso.lowercase()\n"
          "                        if (lang == target || tag == target || tag.startsWith(\"$target-\")) return true\n"
          "                        // AutoTTS c3.k.f + c3.k.e pattern: ISO3Language + ISO3Country matching.\n"
          "                        // Handles engines that return Locale(\"eng\",\"USA\") instead of Locale(\"en\",\"US\").\n"
          "                        // If target has no country (e.g. \"en\"), ANY country variant matches.\n"
          "                        // If target has country (e.g. \"en-US\"), also verify country via ISO3Country.\n"
          "                        return try {\n"
          "                            val targetLocale = java.util.Locale.forLanguageTag(target)\n"
          "                            val langMatch = loc.getISO3Language().lowercase() == targetLocale.getISO3Language().lowercase()\n"
          "                            if (!langMatch) return false\n"
          "                            if (targetLocale.country.isEmpty()) return true\n"
          "                            val locCountry = loc.country.lowercase()\n"
          "                            val targetCountry = targetLocale.country.lowercase()\n"
          "                            if (locCountry == targetCountry) return true\n"
          "                            loc.getISO3Country().lowercase() == targetLocale.getISO3Country().lowercase()\n"
          "                        } catch (_: Exception) { false }\n"
          "                    }\n"
          "                    // Merge voices + availableLanguages so engines like Eloquence show all\n"
          "                    // supported locales (e.g. en-GB, en-AU) not just installed ones (e.g. en-US).\n"
          "                    // distinctBy uses raw language+country fields to avoid toLanguageTag()\n"
          "                    // normalization mismatches between 3-letter codes (eng/GBR) vs 2-letter (en/GB).\n"
          "                    val fromVoices: List<java.util.Locale> = try {\n"
          "                        tts?.voices?.map { it.locale }?.filter { localeMatchesIso(it) } ?: listOf()\n"
          "                    } catch (_: Exception) { listOf() }\n"
          "                    val fromAvail: List<java.util.Locale> = try {\n"
          "                        tts?.availableLanguages?.filter { localeMatchesIso(it) } ?: listOf()\n"
          "                    } catch (_: Exception) { listOf() }\n"
          "                    availableLocales = (fromVoices + fromAvail)\n"
          "                        .distinctBy { it.language.lowercase() + \"_\" + it.country.lowercase() }\n"
          "                        .sortedBy { it.displayName }\n"
          "                    if (selLocTag.isNotEmpty()) {\n"
          "                        availableVoiceNames = try { tts?.voices?.filter { v -> try { localeMatchesIso(v.locale) && v.locale.toLanguageTag() == selLocTag } catch (_: Exception) { false } }?.map { it.name }?.sorted() ?: listOf() } catch (_: Exception) { listOf() }\n"
          "                    }\n"
          "                    // AutoTTS NewSettingsActivity auto-select pattern: when user assigns a new engine\n"
          "                    // for a language that has no saved locale pref yet, automatically pick the\n"
          "                    // highest quality non-network voice. Strategy: local > network, then quality desc.\n"
          "                    // This mirrors AutoTTS's D0() auto-fill behaviour in the settings activity.\n"
          "                    val savedLocForNewEng = prefs.getLocaleForLangPkg(iso, selEngPkg)\n"
          "                    if (savedLocForNewEng.isEmpty() && availableLocales.isNotEmpty()) {\n"
          "                        val allVoices = try { tts?.voices?.toList() } catch (_: Exception) { null }\n"
          "                        if (!allVoices.isNullOrEmpty()) {\n"
          "                            val best = allVoices\n"
          "                                .filter { v -> try { localeMatchesIso(v.locale) } catch (_: Exception) { false } }\n"
          "                                .sortedWith(compareBy(\n"
          "                                    { if (it.isNetworkConnectionRequired()) 1 else 0 },\n"
          "                                    { -it.quality }\n"
          "                                )).firstOrNull()\n"
          "                            if (best != null) {\n"
          "                                val bestTag = best.locale.toLanguageTag()\n"
          "                                prefs.setLocaleForLangPkg(iso, selEngPkg, bestTag)\n"
          "                                prefs.setVoiceName(iso, selEngPkg, bestTag, best.name)\n"
          "                                selLocTag = bestTag\n"
          "                                availableVoiceNames = allVoices\n"
          "                                    .filter { try { it.locale.toLanguageTag() == bestTag } catch (_: Exception) { false } }\n"
          "                                    .map { it.name }.sorted()\n"
          "                            }\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }, selEngPkg)\n"
          "            setTts(holder[0])\n"
          "        } else { availableLocales = listOf(); availableVoiceNames = listOf(); ttsHolder()?.shutdown(); setTts(null) }\n"
          "    }\n"
          "    LaunchedEffect(selLocTag) {\n"
          "        val tts = ttsHolder()\n"
          "        availableVoiceNames = if (tts != null && selLocTag.isNotEmpty())\n"
          "            try { tts.voices?.filter { try { it.locale.toLanguageTag() == selLocTag } catch (_: Exception) { false } }?.map { it.name }?.sorted() ?: listOf() } catch (_: Exception) { listOf() }\n"
          "        else listOf()\n"
          "    }\n"
          "    val selVoiceOptions = listOf(\"*Default\") + availableVoiceNames\n"
          "    Column(modifier = Modifier.fillMaxSize()) {\n"
          "        Row(modifier = Modifier.fillMaxWidth().padding(start = 4.dp, top = 8.dp, end = 16.dp, bottom = 8.dp), verticalAlignment = Alignment.CenterVertically) {\n"
          "            IconButton(onClick = onBack) { Icon(Icons.Filled.ArrowBack, contentDescription = \"Back\") }\n"
          "            Text(\"$langName ($iso)\", style = MaterialTheme.typography.titleLarge, modifier = Modifier.weight(1f))\n"
          "        }\n"
          "        Divider()\n"
          "        Column(modifier = Modifier.weight(1f).verticalScroll(rememberScrollState()).padding(16.dp)) {\n"
          "            AccessibleDropdown(\"TTS Engine\", engines.find { it.pkg == selEngPkg }?.name ?: \"Not Set\", engines.map { it.name }) { idx ->\n"
          "                selEngPkg = engines[idx].pkg; prefs.setString(\"engine_$iso\", selEngPkg); selLocTag = prefs.getLocaleForLangPkg(iso, selEngPkg)\n"
          "            }\n"
          "            val locNames = availableLocales.map { it.displayName }.ifEmpty { listOf(\"Default System Voice\") }\n"
          "            val selLocKey = try { java.util.Locale.forLanguageTag(selLocTag).let { \"${it.language}_${it.country}\".lowercase() } } catch (_: Exception) { \"\" }\n"
          "            AccessibleDropdown(\"Voice / Locale\", availableLocales.find { it.toLanguageTag() == selLocTag || \"${it.language}_${it.country}\".lowercase() == selLocKey }?.displayName ?: \"Default System Voice\", locNames) { idx ->\n"
          "                if (availableLocales.isNotEmpty()) { selLocTag = availableLocales[idx].toLanguageTag(); prefs.setLocaleForLangPkg(iso, selEngPkg, selLocTag) }\n"
          "            }\n"
          "            AccessibleDropdown(\"Voice Variant\", selVoiceName, selVoiceOptions) { idx ->\n"
          "                selVoiceName = selVoiceOptions[idx]; prefs.setVoiceName(iso, selEngPkg, selLocTag, selVoiceName)\n"
          "            }\n"
          "            Spacer(modifier = Modifier.height(16.dp))\n"
          "            Text(\"Speech Rate: ${if(rate==100) \"System Default\" else String.format(java.util.Locale.US,\"%.2fx\",rate/100f)}\")\n"
          "            Row(verticalAlignment = Alignment.CenterVertically) {\n"
          "                Button(onClick={ rate=maxOf(0,rate-5) },modifier=Modifier.semantics{contentDescription=\"Decrease Speech Rate\"}){Text(\"-\")}\n"
          "                Slider(value=rate.toFloat(),onValueChange={ rate=it.toInt() },valueRange=0f..400f,modifier=Modifier.weight(1f).padding(horizontal=8.dp).semantics{contentDescription=\"Speech Rate\";stateDescription=if(rate==100)\"System Default\" else \"$rate percent\"})\n"
          "                Button(onClick={ rate=minOf(400,rate+5) },modifier=Modifier.semantics{contentDescription=\"Increase Speech Rate\"}){Text(\"+\")}\n"
          "            }\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            Text(\"Pitch: ${if(pitch==100) \"System Default\" else String.format(java.util.Locale.US,\"%.2fx\",pitch/100f)}\")\n"
          "            Row(verticalAlignment = Alignment.CenterVertically) {\n"
          "                Button(onClick={ pitch=maxOf(0,pitch-5) },modifier=Modifier.semantics{contentDescription=\"Decrease Pitch\"}){Text(\"-\")}\n"
          "                Slider(value=pitch.toFloat(),onValueChange={ pitch=it.toInt() },valueRange=0f..300f,modifier=Modifier.weight(1f).padding(horizontal=8.dp).semantics{contentDescription=\"Pitch\";stateDescription=if(pitch==100)\"System Default\" else \"$pitch percent\"})\n"
          "                Button(onClick={ pitch=minOf(300,pitch+5) },modifier=Modifier.semantics{contentDescription=\"Increase Pitch\"}){Text(\"+\")}\n"
          "            }\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            Text(\"Volume: ${if(vol==100) \"System Default\" else \"$vol%\"}\")\n"
          "            Row(verticalAlignment = Alignment.CenterVertically) {\n"
          "                Button(onClick={ vol=maxOf(0,vol-5) },modifier=Modifier.semantics{contentDescription=\"Decrease Volume\"}){Text(\"-\")}\n"
          "                Slider(value=vol.toFloat(),onValueChange={ vol=it.toInt() },valueRange=0f..100f,modifier=Modifier.weight(1f).padding(horizontal=8.dp).semantics{contentDescription=\"Volume\";stateDescription=if(vol==100)\"System Default\" else \"$vol percent\"})\n"
          "                Button(onClick={ vol=minOf(100,vol+5) },modifier=Modifier.semantics{contentDescription=\"Increase Volume\"}){Text(\"+\")}\n"
          "            }\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "            OutlinedButton(onClick = {\n"
          "                rate = 100; pitch = 100; vol = 100\n"
          "                prefs.setInt(\"rate_$currentKey\", 100); prefs.setInt(\"pitch_$currentKey\", 100); prefs.setInt(\"vol_$currentKey\", 100)\n"
          "            }, modifier = Modifier.fillMaxWidth()) { Text(\"Reset to Default (Rate / Pitch / Volume)\") }\n"
          "            Spacer(modifier = Modifier.height(12.dp))\n"
          "            Button(onClick = {\n"
          "                val pkg = if(selEngPkg == \"NOT_SET\") null else selEngPkg\n"
          "                ttsHolder()?.shutdown()\n"
          "                var ref: android.speech.tts.TextToSpeech? = null\n"
          "                ref = android.speech.tts.TextToSpeech(context, { status ->\n"
          "                    if(status == android.speech.tts.TextToSpeech.SUCCESS) {\n"
          "                        try { ref?.language = java.util.Locale.forLanguageTag(selLocTag.ifEmpty { iso }) } catch(_: Exception) {}\n"
          "                        ref?.setSpeechRate(rate/100f); ref?.setPitch(pitch/100f)\n"
          "                        val p = android.os.Bundle(); p.putFloat(android.speech.tts.TextToSpeech.Engine.KEY_PARAM_VOLUME, vol/100f)\n"
          "                        val sampleText = SampleTexts.get(iso)\n"
          "                        ref?.speak(sampleText, android.speech.tts.TextToSpeech.QUEUE_FLUSH, p, \"test\")\n"
          "                    }\n"
          "                }, pkg)\n"
          "                setTts(ref)\n"
          "            }, modifier = Modifier.fillMaxWidth()) { Text(\"TEST AUDIO\") }\n"
          "            Spacer(modifier = Modifier.height(8.dp))\n"
          "        }\n"
          "        Button(\n"
          "            onClick = {\n"
          "                prefs.setString(\"engine_$iso\", selEngPkg)\n"
          "                prefs.setLocaleForLangPkg(iso, selEngPkg, selLocTag)\n"
          "                prefs.setVoiceName(iso, selEngPkg, selLocTag, selVoiceName)\n"
          "                prefs.setInt(\"rate_$currentKey\", rate)\n"
          "                prefs.setInt(\"pitch_$currentKey\", pitch)\n"
          "                prefs.setInt(\"vol_$currentKey\", vol)\n"
          "                Toast.makeText(context, \"Saved!\", Toast.LENGTH_SHORT).show()\n"
          "                onBack()\n"
          "            },\n"
          "            modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 12.dp)\n"
          "        ) { Text(\"SAVE\") }\n"
          "    }\n"
          "}\n"
          "\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// AdditionalTabContent — 3rd tab: toggles + battery + dictionary + system TTS + logs\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "@Composable\n"
          "private fun HomeTabContent(prefs: SharedPrefsManager) {\n"
          "    val context = LocalContext.current\n"
          "    val clipboardManager = LocalClipboardManager.current\n"
          "    var readingMode by remember { mutableStateOf(prefs.getReadingMode().let { if (it == \"dual\" || it == \"mix\") \"mix\" else \"auto\" }) }\n"
          "    var emojiReading by remember { mutableStateOf(prefs.getBoolean(\"emoji_reading\", true)) }\n"
          "    var emojiCount by remember { mutableStateOf(prefs.getBoolean(\"emoji_count\", false)) }\n"
          "    var punctCount by remember { mutableStateOf(prefs.getBoolean(\"punct_count\", false)) }\n"
          "    var dictEnabled by remember { mutableStateOf(prefs.getBoolean(\"dict_enabled\", false)) }\n"
          "    var btCarMode by remember { mutableStateOf(prefs.isBluetoothCarMode()) }\n"
          "    var brokenProt by remember { mutableStateOf(prefs.isBrokenEngineProtector()) }\n"
          "    var forceAccessibility by remember { mutableStateOf(prefs.isForceAccessibilityStream()) }\n"
          "    var showNotification by remember { mutableStateOf(prefs.isShowNotification()) }\n"
          "    var googleTtsOnly by remember { mutableStateOf(prefs.isGoogleTtsOnly()) }\n"
          "    var dedicatedEng by remember { mutableStateOf(prefs.isDedicatedEnginesEnabled()) }\n"
          "    var localeSpans by remember { mutableStateOf(prefs.isLocaleSpansEnabled()) }\n"
          "    var disableAdvancedDet by remember { mutableStateOf(prefs.isDisableAdvancedDetection()) }\n"
          "    var allLangMode by remember { mutableStateOf(prefs.isAllLanguagesMode()) }\n"
          "    val powerManager = remember { context.getSystemService(android.content.Context.POWER_SERVICE) as PowerManager }\n"
          "    var batteryUnrestricted by remember(powerManager) {\n"
          "        mutableStateOf(\n"
          "            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M)\n"
          "                powerManager.isIgnoringBatteryOptimizations(context.packageName)\n"
          "            else true\n"
          "        )\n"
          "    }\n"
          "    var latLangIso by remember { mutableStateOf(prefs.getString(\"mixed_mode_latin_language\", \"en\")) }\n"
          "    var nonLatLangIso by remember { mutableStateOf(prefs.getString(\"mixed_mode_non_latin_language\", \"hi\")) }\n"
          "    var mixNumLang by remember { mutableStateOf(prefs.getString(\"mix_num_lang\", \"auto\")) }\n"
          "    var mixPuncLang by remember { mutableStateOf(prefs.getString(\"mix_punc_lang\", \"auto\")) }\n"
          "    var mixEmojiLang by remember { mutableStateOf(prefs.getString(\"mix_emoji_lang\", \"auto\")) }\n"
          "    Column(modifier = Modifier.padding(16.dp).verticalScroll(rememberScrollState())) {\n"
          "        Text(\"Home\", style = MaterialTheme.typography.headlineSmall, modifier = Modifier.semantics { heading() })\n"
          "        Spacer(modifier = Modifier.height(12.dp))\n"
          "        Text(\"Reading Mode\", style = MaterialTheme.typography.titleMedium)\n"
          "        Spacer(modifier = Modifier.height(8.dp))\n"
          "        Row(\n"
          "            modifier = Modifier.fillMaxWidth().clickable {\n"
          "                readingMode = \"auto\"; prefs.setReadingMode(\"auto\")\n"
          "            }.semantics { stateDescription = if (readingMode == \"auto\") \"checked\" else \"unchecked\" },\n"
          "            verticalAlignment = Alignment.CenterVertically\n"
          "        ) {\n"
          "            Checkbox(checked = readingMode == \"auto\", onCheckedChange = { if (it) { readingMode = \"auto\"; prefs.setReadingMode(\"auto\") } })\n"

          "                        // a configured ISO3 entry with an engine survives. No O/dedicated bypass.\n"
          "                        val autoModeC = normalizeLangCode(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { kfLocale() })\n"
          "                        for (lc in localeChunks) {\n"
          "                            if (lc.lang != \"UNKNOWN\" && lc.lang.isNotEmpty()) {\n"
          "                                val resolved = if (koRaw(lc.lang)) lc.lang else autoModeC\n"
          "                                // AutoTTS J.add(span) per span (1819) — NO adjacent-same-language merge.\n"

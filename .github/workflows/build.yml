          "        \"km\" to \"នេះគឺជាគំរូនៃអត្ថបទដែលនិយាយជាភាសាខ្មែរ។\",\n"
          "        \"ms\" to \"Ini ialah contoh teks yang dituturkan dalam bahasa Melayu.\",\n"
          "        \"sd\" to \"هيءَ سنڌي ۾ ڳالهائي وئي ٽيڪسٽ جو هڪ نمونو آهي.\"\n"
          "    )\n"
          "    fun get(iso: String): String {\n"
          "        val k = iso.substringBefore(\"-\").substringBefore(\"_\").lowercase()\n"
          "        // AutoTTS y.a(): returns \"\" when the language has no sample — GetSampleText then speaks the\n"
          "        // exact \"Sorry. Sample text for language <name> is missing.\" notice. Match that (no synthesized default).\n"
          "        return map[k] ?: map[toIso3(k)] ?: map[iso] ?: \"\"\n"

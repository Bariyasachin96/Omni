          # ── EasyVoiceLogger.kt ──────────────────────────────────────────────────────
          w("app/src/main/java/com/tts/easyvoice/EasyVoiceLogger.kt",
          "package com.tts.easyvoice\n"
          "import android.content.Context\n"
          "import android.util.Log\n"
          "import java.io.File\n"
          "import java.io.FileWriter\n"
          "import java.io.IOException\n"
          "import java.text.SimpleDateFormat\n"
          "import java.util.Date\n"
          "import java.util.Locale\n"
          "// Port of c3.o. The tag is a per-call argument there, exactly as it is here; c() is DEBUG,\n"
          "// d() is ERROR and e() is ERROR with the stack trace appended. Where AutoTTS passes the\n"
          "// literal \"AutoTTS\" this app passes its own name; the \"TTS\" tag is passed through unchanged.\n"
          "object EasyVoiceLogger {\n"
          "    const val TAG = \"EasyVoice\"\n"
          "    private const val MAX_LOG_BYTES = 2L * 1024L * 1024L\n"
          "    private val timestampFormat = SimpleDateFormat(\"yyyy-MM-dd HH:mm:ss.SSS\", Locale.US)\n"
          "    private var logFile: File? = null\n"
          "    private var appContext: Context? = null\n"
          "    @Volatile private var loggingEnabled = false\n"
          "    // c3.o.j(bl): the in-memory flag plus putBoolean(\"logging_enabled\", bl).\n"
          "    fun setLoggingEnabled(v: Boolean) { loggingEnabled = v }\n"
          "    // c3.o.g()\n"
          "    fun isLoggingEnabled(): Boolean = loggingEnabled\n"
          "    // c3.o(Context): the logs dir, the file, the formatter, and d from the pref. It writes\n"
          "    // nothing on construction.\n"
          "    fun init(ctx: Context) {\n"
          "        appContext = ctx.applicationContext\n"
          "        val dir = File(ctx.applicationContext.filesDir, \"logs\")\n"
          "        if (!dir.exists()) dir.mkdirs()\n"
          "        logFile = File(dir, \"easy_voice.log\")\n"
          "    }\n"
          "    // AutoTTS c3.o.h(level, tag, msg), transcribed from smali (CFR could not decompile it):\n"
          "    //   DEBUG(0)/INFO(1) -> no logcat at all; WARN(2) -> Log.w; ERROR(3) -> Log.e.\n"
          "    //   The logcat call happens BEFORE the enabled check, so warnings and errors still\n"
          "    //   reach logcat while logging is off; only the file write is gated.\n"
          "    //   Then i() (rotate), then String.format(\"%s [%s] %s: %s\", ts, letter, tag, msg)\n"
          "    //   through a per-call BufferedWriter(FileWriter(file, true)), write + newLine + close.\n"
          "    //   IOException -> Log.e(\"TtsLogger\", \"Failed to write log\", e).\n"
          "    @Synchronized private fun writeLine(level: String, tag: String, msg: String) {\n"
          "        when (level) { \"E\" -> Log.e(tag, msg); \"W\" -> Log.w(tag, msg) }\n"
          "        if (!loggingEnabled) return\n"
          "        val file = logFile ?: return\n"
          "        rotate(file)\n"
          "        val line = String.format(\"%s [%s] %s: %s\", timestampFormat.format(Date()), level, tag, msg)\n"
          "        try {\n"
          "            java.io.BufferedWriter(FileWriter(file, true)).use { writer -> writer.write(line); writer.newLine() }\n"
          "        } catch (ex: IOException) { Log.e(\"TtsLogger\", \"Failed to write log\", ex) }\n"
          "    }\n"
          "    // AutoTTS c3.o.i(): runs on every write; nothing happens below 2 MiB.\n"
          "    private fun rotate(file: File) {\n"
          "        if (!file.exists() || file.length() < MAX_LOG_BYTES) return\n"
          "        val parent = file.parent ?: return\n"
          "        File(parent, \"easy_voice.log.3\").let { if (it.exists()) it.delete() }\n"
          "        for (idx in 2 downTo 1) { val src = File(parent, \"easy_voice.log.$idx\"); if (src.exists()) src.renameTo(File(parent, \"easy_voice.log.${idx + 1}\")) }\n"
          "        file.renameTo(File(parent, \"easy_voice.log.1\"))\n"
          "    }\n"
          "    // c3.o.c(tag, msg) -> DEBUG\n"
          "    fun debug(tag: String, msg: String) = writeLine(\"D\", tag, msg)\n"
          "    // c3.o.d(tag, msg) -> ERROR\n"
          "    fun error(tag: String, msg: String) = writeLine(\"E\", tag, msg)\n"
          "    // c3.o.e(tag, msg, t) -> ERROR with Log.getStackTraceString(t) on the next line\n"
          "    fun errorWithStack(tag: String, msg: String, t: Throwable) = writeLine(\"E\", tag, msg + \"\\n\" + Log.getStackTraceString(t))\n"
          "    // AutoTTS c3.o.b(ctx): returns null when the file is absent or empty — that null is\n"
          "    // what makes o.k() show \"No log file to share\" instead of opening a chooser.\n"
          "    fun shareFileOrNull(): File? {\n"
          "        val file = logFile ?: return null\n"
          "        if (!file.exists() || file.length() == 0L) return null\n"
          "        return file\n"
          "    }\n"
          "    // AutoTTS c3.o.a(): if the file exists, truncate it with FileWriter(file, false).\n"
          "    // IOException -> Log.e(\"TtsLogger\", \"Failed to clear log\", e). Nothing else, no toast.\n"
          "    @Synchronized fun clear() {\n"
          "        val file = logFile ?: return\n"
          "        if (!file.exists()) return\n"
          "        try { FileWriter(file, false).close() } catch (ex: IOException) { Log.e(\"TtsLogger\", \"Failed to clear log\", ex) }\n"
          "    }\n"
          "}\n")


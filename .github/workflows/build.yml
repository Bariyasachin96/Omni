          "                            val currentVoice = try { tts.voice } catch (_: Exception) { null }\n"
          "                            val currentLocale = currentVoice?.locale ?: Locale(\"zxx\")\n"
          "                            val currentVoiceName = currentVoice?.name ?: \"\"\n"
          "                            // AutoTTS P(a,b): iso3Lang match AND (country empty OR country match)\n"
          "                            val localeMatches = try {\n"

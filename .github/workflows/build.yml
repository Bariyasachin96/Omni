          "        Spacer(modifier = Modifier.height(8.dp))\n"
          "        // AutoTTS Licenses tab: the URL is a CLICKABLE link (Html.fromHtml + LinkMovementMethod) that\n"
          "        // opens the license page. Mirror that — tap opens the browser; TalkBack announces it as a link.\n"
          "        Text(\"https://www.apache.org/licenses/LICENSE-2.0\", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.primary, modifier = Modifier.clickable { try { context.startActivity(android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(\"https://www.apache.org/licenses/LICENSE-2.0\")).apply { addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK) }) } catch (_: Exception) {} }.semantics { role = androidx.compose.ui.semantics.Role.Button; contentDescription = \"Open Apache License 2.0 web page\" })\n"
          "        Spacer(modifier = Modifier.height(12.dp))\n"
          "        // AutoTTS Licenses tab: the full Apache-2.0 body text (matches com.vnspeak.autotts depth).\n"
          "        Text(\"Licensed under the Apache License, Version 2.0 (the \\\"License\\\"); you may not use this file except in compliance with the License. You may obtain a copy of the License at https://www.apache.org/licenses/LICENSE-2.0\\n\\nUnless required by applicable law or agreed to in writing, software distributed under the License is distributed on an \\\"AS IS\\\" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for the specific language governing permissions and limitations under the License.\", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "    }\n"
          "}\n"
          "@Composable\n"
          "private fun ToggleRow(title: String, description: String, checked: Boolean, enabled: Boolean = true, onCheckedChange: (Boolean) -> Unit) {\n"
          "    // AutoTTS layouts (fragment_advanced/voices/modes): every option is a CHECKBOX (android\n"
          "    // CheckBox = box LEFT, label right; TalkBack: \"<label>, checkbox, checked/not checked\") and\n"
          "    // its description is a SEPARATE SIBLING TextView with its own TalkBack focus. NOT a Switch,\n"
          "    // and the description must NOT live inside the toggleable row.\n"
          "    Row(\n"
          "        modifier = Modifier\n"
          "            .fillMaxWidth()\n"
          "            .toggleable(\n"
          "                value = checked,\n"
          "                enabled = enabled,\n"
          "                onValueChange = onCheckedChange,\n"
          "                role = androidx.compose.ui.semantics.Role.Checkbox\n"
          "            )\n"
          "            .padding(vertical = 12.dp),\n"
          "        verticalAlignment = Alignment.CenterVertically\n"
          "    ) {\n"
          "        val tint = if (enabled) MaterialTheme.colorScheme.onSurface else MaterialTheme.colorScheme.onSurface.copy(alpha = 0.38f)\n"
          "        Checkbox(checked = checked, onCheckedChange = null, enabled = enabled)\n"
          "        Spacer(modifier = Modifier.width(8.dp))\n"
          "        Text(title, style = MaterialTheme.typography.titleMedium, color = tint)\n"
          "    }\n"
          "    if (description.isNotBlank()) Text(description, style = MaterialTheme.typography.bodySmall, color = if (enabled) MaterialTheme.colorScheme.onSurfaceVariant else MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.38f), modifier = Modifier.padding(start = 44.dp, bottom = 8.dp))  // AutoTTS: sibling description TextView below the CheckBox\n"
          "}\n"
          "\n"
          )


          "package com.tts.easyvoice\n"
          "import androidx.compose.foundation.clickable\n"
          "import androidx.compose.foundation.layout.PaddingValues\n"
          "import androidx.compose.foundation.layout.fillMaxSize\n"
          "import androidx.compose.foundation.layout.padding\n"
          "import androidx.compose.foundation.lazy.LazyColumn\n"
          "import androidx.compose.material3.Icon\n"
          "import androidx.compose.material3.ListItem\n"
          "import androidx.compose.material3.ListItemDefaults\n"
          "import androidx.compose.material3.MaterialTheme\n"
          "import androidx.compose.material3.Text\n"
          "import androidx.compose.runtime.Composable\n"
          "import androidx.compose.ui.Modifier\n"
          "import androidx.compose.ui.graphics.Color\n"
          "import androidx.compose.ui.res.painterResource\n"
          "import androidx.compose.ui.semantics.clearAndSetSemantics\n"
          "import androidx.compose.ui.semantics.contentDescription\n"
          "import androidx.compose.ui.semantics.semantics\n"
          "import androidx.compose.ui.unit.dp\n"
          "// A tab in MainActivity's pager, not its own screen any more. The Scaffold and\n"
          "// the \"Add language\" button it used to carry now live in MainScreen, which owns\n"
          "// the only Scaffold: Material puts a floating action button in the Scaffold, and\n"
          "// nesting a second one inside a pager page would fight the first for placement.\n"
          "@Composable\n"
          "fun ConfigurationScreen(labels: List<String>, onLanguage: (Int) -> Unit) {\n"
          "    ResponsiveContent {\n"
          "        // A LazyColumn of ListItems: Material's navigable list row, with the\n"
          "        // library supplying the heights, padding and collection semantics.\n"
          "        // contentPadding keeps the last row clear of the floating button.\n"
          "        LazyColumn(\n"
          "            modifier = Modifier.fillMaxSize(),\n"
          "            contentPadding = PaddingValues(bottom = 88.dp)\n"
          "        ) {\n"
          "            item {\n"
          "                Text(\n"
          "                    text = \"Choose a language to set up its voice.\",\n"
          "                    style = MaterialTheme.typography.bodyMedium,\n"
          "                    modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)\n"
          "                )\n"
          "            }\n"
          "            items(labels.size) { index ->\n"
          "                ListItem(\n"
          "                    headlineContent = { Text(labels[index], modifier = Modifier.clearAndSetSemantics { }) },\n"
          "                    trailingContent = {\n"
          "                        Icon(painterResource(R.drawable.ic_arrow_forward), contentDescription = null)\n"
          "                    },\n"
          "                    colors = ListItemDefaults.colors(containerColor = Color.Transparent),\n"
          "                    modifier = Modifier\n"
          "                        .clickable(onClickLabel = \"Set up this voice\") { onLanguage(index) }\n"
          "                        .semantics { contentDescription = labels[index] }\n"
          "                )\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "}\n"
          )


          write_source("app/src/main/java/com/tts/easyvoice/VoiceScreen.kt",
          "package com.tts.easyvoice\n"
          "import android.speech.tts.TextToSpeech\n"
          "import android.widget.Toast\n"
          "import androidx.compose.foundation.layout.Column\n"
          "import androidx.compose.foundation.layout.Row\n"
          "import androidx.compose.foundation.layout.fillMaxWidth\n"
          "import androidx.compose.foundation.layout.padding\n"
          "import androidx.compose.foundation.rememberScrollState\n"
          "import androidx.compose.foundation.verticalScroll\n"
          "import androidx.compose.material3.Button\n"
          "import androidx.compose.material3.DropdownMenu\n"
          "import androidx.compose.material3.DropdownMenuItem\n"
          "import androidx.compose.material3.Icon\n"
          "import androidx.compose.material3.MaterialTheme\n"
          "import androidx.compose.material3.OutlinedButton\n"
          "import androidx.compose.material3.Slider\n"
          "import androidx.compose.material3.Text\n"
          "import androidx.compose.runtime.Composable\n"
          "import androidx.compose.runtime.getValue\n"
          "import androidx.compose.runtime.mutableStateOf\n"
          "import androidx.compose.runtime.remember\n"
          "import androidx.compose.runtime.setValue\n"
          "import androidx.compose.ui.Alignment\n"
          "import androidx.compose.ui.Modifier\n"
          "import androidx.compose.ui.platform.LocalContext\n"
          "import androidx.compose.ui.res.painterResource\n"
          "import androidx.compose.ui.semantics.CollectionInfo\n"
          "import androidx.compose.ui.semantics.CollectionItemInfo\n"
          "import androidx.compose.ui.semantics.Role\n"
          "import androidx.compose.ui.semantics.clearAndSetSemantics\n"
          "import androidx.compose.ui.semantics.collectionInfo\n"
          "import androidx.compose.ui.semantics.collectionItemInfo\n"
          "import androidx.compose.ui.semantics.contentDescription\n"
          "import androidx.compose.ui.semantics.heading\n"
          "import androidx.compose.ui.semantics.role\n"
          "import androidx.compose.ui.semantics.selected\n"
          "import androidx.compose.ui.semantics.semantics\n"
          "import androidx.compose.ui.semantics.stateDescription\n"
          "import androidx.compose.ui.unit.dp\n"
          "import java.util.Locale\n"
          "\n"
          "// Material's purpose-built \"select one value\" control. Verified against the\n"
          "// material3 1.4.0 API surface, which we build against:\n"
          "//   ExposedDropdownMenuBoxScope is @ExperimentalMaterial3Api  -> the @OptIn below\n"
          "//   menuAnchor(Modifier) is @Deprecated                        -> use the typed form\n"
          "//   menuAnchor(Modifier, ExposedDropdownMenuAnchorType, enabled)\n"
          "// The component sets role = Role.DropdownList on a primary anchor and tracks the\n"
          "// expanded state itself, so the hand-written semantics block this replaces --\n"
          "// role, contentDescription and stateDescription -- is deleted rather than kept.\n"
          "// Material's dropdown menu, with ordinary menu items.\n"
          "//\n"
          "// NO LazyColumn in here, and it must not come back. A DropdownMenu sizes itself\n"
          "// to its widest item, which means it asks its content for an INTRINSIC width,\n"
          "// and a lazy list is a SubcomposeLayout that cannot answer that:\n"
          "//\n"
          "//   IllegalStateException: Asking for intrinsic measurements of SubcomposeLayout\n"
          "//   layouts is not supported... such as lazy lists, BoxWithConstraints, TabRow\n"
          "//\n"
          "// The exception suggests \"adding a size modifier ... to fast return the queried\n"
          "// intrinsic measurement\", and that was tried -- width(280.dp) on the list -- and\n"
          "// the app still crashed in the same place. The menu's measurement is not\n"
          "// something a size modifier on the child can satisfy here, so the lazy list is\n"
          "// out. A crash is worse than a verbose announcement, and this arrangement is\n"
          "// the one that ran for many builds.\n"
          "//\n"
          "// The long-list announcement problem is therefore still open and is being\n"
          "// solved elsewhere, not by nesting a lazy list in a menu.\n"
          "@Composable\n"
          "fun LabeledDropdown(label: String, options: List<String>, selectedIndex: Int, onSelect: (Int) -> Unit) {\n"
          "    var expanded by remember { mutableStateOf(false) }\n"
          "    val selectedText = if (selectedIndex >= 0 && selectedIndex < options.size) options[selectedIndex] else \"\"\n"
          "    Column(modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 4.dp)) {\n"
          "        Text(\n"
          "            text = label,\n"
          "            style = MaterialTheme.typography.bodyMedium,\n"
          "            modifier = Modifier.padding(top = 4.dp, bottom = 2.dp)\n"
          "        )\n"
          "        // Same reasoning as the menu items below: the button merges its children,\n"
          "        // so without this the focused node carries no name and a screen reader\n"
          "        // that does not walk Compose's fake nodes announces only the role.\n"
          "        // The description is the VALUE alone, not \"label, value\" -- the label is\n"
          "        // the separate Text above, a leaf node any reader can read, and folding it\n"
          "        // in here would have it announced twice.\n"
          "        OutlinedButton(\n"
          "            onClick = { expanded = true },\n"
          "            modifier = Modifier\n"
          "                .fillMaxWidth()\n"
          "                .semantics {\n"
          "                    role = Role.DropdownList\n"
          "                    contentDescription = selectedText\n"
          "                    stateDescription = if (expanded) \"Expanded\" else \"Collapsed\"\n"
          "                }\n"
          "        ) {\n"
          "            Text(\n"
          "                text = selectedText,\n"
          "                modifier = Modifier.weight(1f).clearAndSetSemantics { }\n"
          "            )\n"
          "            Icon(painterResource(R.drawable.ic_arrow_drop_down), contentDescription = null)\n"
          "        }\n"
          "        DropdownMenu(expanded = expanded, onDismissRequest = { expanded = false }) {\n"
          "            // A LazyColumn would publish these two properties itself, but it\n"
          "            // cannot live in a menu (see above), so they are declared by hand on\n"
          "            // a plain Column, which is not a SubcomposeLayout and answers\n"
          "            // intrinsic measurement fine. Without them TalkBack has no structure\n"
          "            // for the list and cannot say where you are in it, which is what\n"
          "            // made a fast swipe through 130 languages unintelligible.\n"
          "            Column(\n"
          "                modifier = Modifier.semantics {\n"
          "                    collectionInfo = CollectionInfo(rowCount = options.size, columnCount = 1)\n"
          "                }\n"
          "            ) {\n"
          "                for (index in options.indices) {\n"
          "                    // Why the label is spelled out as a contentDescription here,\n"
          "                    // and why the children are silenced. Read from the androidx\n"
          "                    // source, not assumed:\n"
          "                    //\n"
          "                    // The a11y delegate walks semanticsOwner.unmergedRootSemanticsNode,\n"
          "                    // so for a merging node replacedChildren is the real child list\n"
          "                    // and is never empty. That matters twice:\n"
          "                    //   info.contentDescription is assigned only under\n"
          "                    //     !isMergingSemanticsOfDescendants || replacedChildren.isEmpty()\n"
          "                    //   info.text  = getInfoText(node), which reads the node's OWN\n"
          "                    //     unmerged config -- a merging container has no Text of its own.\n"
          "                    // So a menu item, a Button or a clickable row carries NO name of\n"
          "                    // its own; the label lives on the \"fake\" child nodes Compose\n"
          "                    // emits. TalkBack walks those, which is why it reads fine there,\n"
          "                    // while a reader that only inspects the focused node announces\n"
          "                    // the bare role -- the \"button, button, button\" that was\n"
          "                    // reported with another screen reader.\n"
          "                    //\n"
          "                    // Setting contentDescription here makes Compose emit the\n"
          "                    // \"contentDescription clobbering\" fake node carrying it, and\n"
          "                    // Google's Accessibility Scanner reads that back verbatim on\n"
          "                    // device, so it really is exposed. clearAndSetSemantics on the\n"
          "                    // Text does NOT remove it from replacedChildren -- any child\n"
          "                    // with a semantics node counts -- it is there to stop the label\n"
          "                    // being announced twice. The visible text is untouched.\n"
          "                    DropdownMenuItem(\n"
          "                        text = { Text(options[index], modifier = Modifier.clearAndSetSemantics { }) },\n"
          "                        onClick = { onSelect(index); expanded = false },\n"
          "                        trailingIcon = {\n"
          "                            if (index == selectedIndex) {\n"
          "                                Icon(painterResource(R.drawable.ic_check), contentDescription = null)\n"
          "                            }\n"
          "                        },\n"
          "                        modifier = Modifier.semantics {\n"
          "                            contentDescription = options[index]\n"
          "                            // The state goes in `selected`, never in the name.\n"
          "                            // Google's Accessibility Scanner flagged the old\n"
          "                            // description exactly for that: \"This item's content\n"
          "                            // description, \\\"English (eng), Selected\\\", contains\n"
          "                            // the state \\\"selected\\\".\"\n"
          "                            selected = index == selectedIndex\n"
          "                            collectionItemInfo = CollectionItemInfo(index, 1, 0, 1)\n"
          "                        }\n"
          "                    )\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "}\n"
          "\n"
          "@Composable\n"
          "fun ValueSlider(label: String, value: Int, maxValue: Int, onValue: (Int) -> Unit) {\n"
          "    val context = LocalContext.current\n"
          "    Text(\n"
          "        text = label,\n"
          "        style = MaterialTheme.typography.bodyMedium,\n"
          "        modifier = Modifier.padding(horizontal = 16.dp)\n"
          "    )\n"
          "    Row(\n"
          "        modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp),\n"
          "        verticalAlignment = Alignment.CenterVertically\n"
          "    ) {\n"
          "        OutlinedButton(\n"
          "            onClick = {\n"
          "                val next = if (value - 5 < 10) 10 else value - 5\n"
          "                onValue(next)\n"
          "                Toast.makeText(context, next.toString() + \" of \" + maxValue, Toast.LENGTH_SHORT).show()\n"
          "            },\n"
          "            modifier = Modifier.semantics { contentDescription = \"Decrease \" + label.lowercase(Locale.getDefault()) }\n"
          "        ) { Text(\"-\", modifier = Modifier.clearAndSetSemantics { }) }\n"
          "        Slider(\n"
          "            value = value.toFloat(),\n"
          "            onValueChange = { picked -> onValue(if (picked.toInt() < 10) 10 else picked.toInt()) },\n"
          "            valueRange = 10f..maxValue.toFloat(),\n"
          "            modifier = Modifier.weight(1f).padding(horizontal = 8.dp).semantics {\n"
          "                contentDescription = label\n"
          "                stateDescription = value.toString() + \" of \" + maxValue\n"
          "            }\n"
          "        )\n"
          "        OutlinedButton(\n"
          "            onClick = {\n"
          "                val next = if (value + 5 > maxValue) maxValue else value + 5\n"
          "                onValue(next)\n"
          "                Toast.makeText(context, next.toString() + \" of \" + maxValue, Toast.LENGTH_SHORT).show()\n"
          "            },\n"
          "            modifier = Modifier.semantics { contentDescription = \"Increase \" + label.lowercase(Locale.getDefault()) }\n"
          "        ) { Text(\"+\", modifier = Modifier.clearAndSetSemantics { }) }\n"
          "    }\n"
          "}\n"
          "\n"
          "@Composable\n"
          "fun VoiceScreen(prefs: SharedPrefsManager, langIndex: Int, testTtsProvider: () -> TextToSpeech?) {\n"
          "    val context = LocalContext.current\n"
          "    val readingMode = remember { prefs.getReadingMode() }\n"
          "    val entry = LangStore.languages.getOrNull(langIndex)\n"
          "    if (entry == null) {\n"
          "        ResponsiveContent {\n"
          "            Column(modifier = Modifier.fillMaxWidth()) {\n"
          "                SectionHeader(\"Voices\")\n"
          "                Text(\n"
          "                    text = \"Voices settings aren't available for \\\"None\\\" mode.\",\n"
          "                    style = MaterialTheme.typography.bodyMedium,\n"
          "                    modifier = Modifier.padding(16.dp)\n"
          "                )\n"
          "            }\n"
          "        }\n"
          "        return\n"
          "    }\n"
          "    val selectedIso = entry.iso3\n"
          "    var voiceRows by remember { mutableStateOf(VoiceRows.load(context, readingMode, selectedIso)) }\n"
          "    var voiceIndex by remember { mutableStateOf(0) }\n"
          "    var variantOptions by remember { mutableStateOf(VoiceRows.variantsFor(voiceRows, entry)) }\n"
          "    var variantIndex by remember { mutableStateOf(0) }\n"
          "    var speed by remember { mutableStateOf(entry.speed) }\n"
          "    var volume by remember { mutableStateOf(entry.volume) }\n"
          "    var pitch by remember { mutableStateOf(entry.pitch) }\n"
          "    var dedicated by remember { mutableStateOf(EasyVoiceTtsService.dedicatedEnginesFlag) }\n"
          "    val voiceLabels = voiceRows.map { VoiceRows.label(it) }\n"
          "    ResponsiveContent {\n"
          "        Column(modifier = Modifier.fillMaxWidth().verticalScroll(rememberScrollState())) {\n"
          "            SectionHeader(\"Voices\")\n"
          "            Text(\n"
          "                text = \"Choose an installed voice for each language.\\nTip: To avoid switching delays, we recommend assigning only one engine per language.\",\n"
          "                style = MaterialTheme.typography.bodyMedium,\n"
          "                modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)\n"
          "            )\n"
          "            LabeledDropdown(\"Choose a voice for language\", voiceLabels, voiceIndex) { picked ->\n"
          "                if (picked != 0 && picked < voiceRows.size) {\n"
          "                    voiceRows = VoiceRows.moveToFront(voiceRows, picked, selectedIso, entry)\n"
          "                    voiceIndex = 0\n"
          "                    variantOptions = VoiceRows.variantsFor(voiceRows, entry)\n"
          "                    variantIndex = 0\n"
          "                }\n"
          "            }\n"
          "            // The variant picker only makes sense once a voice is actually chosen.\n"
          "            // VoiceRows.variantsFor already returns an empty list when there are no\n"
          "            // rows or when the current row is the \"*Disabled\" entry, so this shows\n"
          "            // the control only when there is something in it to choose -- rather\n"
          "            // than an empty dropdown a screen reader still stops on.\n"
          "            if (voiceRows.firstOrNull() != null && variantOptions.isNotEmpty()) {\n"
          "                LabeledDropdown(\"Choose a variant for voice\", variantOptions, variantIndex) { picked ->\n"
          "                    variantIndex = picked\n"
          "                    if (picked < variantOptions.size) {\n"
          "                        entry.variant = variantOptions[picked]\n"
          "                        LangStore.persistLanguages(context)\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            Button(\n"
          "                onClick = { VoiceRows.speakTest(voiceRows, entry, selectedIso, testTtsProvider()) },\n"
          "                enabled = voiceRows.firstOrNull() != null,\n"
          "                modifier = Modifier\n"
          "                    .fillMaxWidth()\n"
          "                    .padding(horizontal = 16.dp, vertical = 8.dp)\n"
          "                    .semantics { contentDescription = \"Test\" }\n"
          "            ) {\n"
          "                Icon(painterResource(R.drawable.ic_play_arrow), contentDescription = null,\n"
          "                    modifier = Modifier.padding(end = 8.dp))\n"
          "                Text(\"Test\", modifier = Modifier.clearAndSetSemantics { })\n"
          "            }\n"
          "            ValueSlider(\"Speed\", speed, 500) { picked -> speed = picked; entry.speed = picked }\n"
          "            ValueSlider(\"Volume\", volume, 100) { picked -> volume = picked; entry.volume = picked }\n"
          "            ValueSlider(\"Pitch\", pitch, 200) { picked -> pitch = picked; entry.pitch = picked }\n"
          "            OutlinedButton(\n"
          "                onClick = {\n"
          "                    speed = 100\n"
          "                    volume = 100\n"
          "                    pitch = 100\n"
          "                    entry.speed = 100\n"
          "                    entry.volume = 100\n"
          "                    entry.pitch = 100\n"
          "                },\n"
          "                modifier = Modifier\n"
          "                    .padding(horizontal = 16.dp, vertical = 8.dp)\n"
          "                    .semantics { contentDescription = \"Default\" }\n"
          "            ) {\n"
          "                Icon(painterResource(R.drawable.ic_restore), contentDescription = null,\n"
          "                    modifier = Modifier.padding(end = 8.dp))\n"
          "                Text(\"Default\", modifier = Modifier.clearAndSetSemantics { })\n"
          "            }\n"
          "            Text(\n"
          "                text = \"Experimental\",\n"
          "                style = MaterialTheme.typography.titleMedium,\n"
          "                modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)\n"
          "                    .semantics { heading() }\n"
          "            )\n"
          "            SettingSwitch(\n"
          "                label = \"Dedicated engines\",\n"
          "                checked = dedicated,\n"
          "                enabled = readingMode != \"none\" && readingMode != \"google\"\n"
          "            ) { picked -> dedicated = picked; EasyVoiceTtsService.dedicatedEnginesFlag = picked }\n"
          "            Text(\n"
          "                text = \"Only use this option if you have a dedicated TTS engine for each voice, and ensure no other apps are using them.\",\n"
          "                style = MaterialTheme.typography.bodyMedium,\n"
          "                modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)\n"
          "            )\n"
          "        }\n"
          "    }\n"
          "}\n"
          )

          write_source("app/src/main/java/com/tts/easyvoice/VoiceRows.kt",
          "package com.tts.easyvoice\n"
          "import android.content.Context\n"
          "import android.speech.tts.TextToSpeech\n"
          "import java.util.Locale\n"
          "object VoiceRows {\n"
          "    private fun voiceKey(row: EngineFinder.ScanVoice?, selectedIso: String): String =\n"
          "        if (row == null) \"Disable#\" + Locale(selectedIso).toString() else row.pkg + \"#\" + row.locale.toString()\n"
          "    fun label(row: EngineFinder.ScanVoice?): String {\n"
          "        if (row == null) return \"*Disabled\"\n"
          "        val abbreviated = abbreviateEngineNameFor(row.engineName)\n"
          "        return if (row.locale.country.isNotEmpty()) abbreviated + \", \" + row.locale.getDisplayCountry() else abbreviated\n"
          "    }\n"
          "    fun load(context: Context, readingMode: String, selectedIso: String): List<EngineFinder.ScanVoice?> {\n"
          "        if (selectedIso.isEmpty()) { LangStore.currentVoiceRows = emptyList(); return emptyList() }\n"
          "        LangStore.currentVoiceIso = selectedIso\n"
          "        val rawPrefs = context.getSharedPreferences(\"easy_voice_settings\", Context.MODE_PRIVATE)\n"
          "        fun voiceOrder(key: String): Int {\n"
          "            val cached = EngineFinder.voiceWeights[key]\n"
          "            if (cached != null) return cached\n"
          "            val storedWeight = (rawPrefs.getString(key, \"1000\") ?: \"1000\").toInt()\n"
          "            EngineFinder.voiceWeights[key] = storedWeight\n"
          "            return storedWeight\n"
          "        }\n"
          "        val allVoices = EngineFinder.lastScanVoices.filter { EngineFinder.iso3Of(it.locale) == selectedIso }\n"
          "        val filtered = if (readingMode == \"google\") allVoices.filter { it.pkg.equals(\"com.google.android.tts\", true) } else allVoices\n"
          "        val rows = ArrayList<EngineFinder.ScanVoice?>(filtered)\n"
          "        val autoModeC = EasyVoiceTtsService.autoLang\n"
          "        val mixLatinIso3 = EasyVoiceTtsService.mixLatinLang\n"
          "        val mixNonLatinIso3 = EasyVoiceTtsService.mixNonLatinLang\n"
          "        if (readingMode == \"auto\" && selectedIso != autoModeC) rows.add(null)\n"
          "        if ((readingMode == \"mix\" || readingMode == \"multilingual\") && selectedIso != mixLatinIso3 && selectedIso != mixNonLatinIso3) rows.add(null)\n"
          "        fun tieBreakLabel(row: EngineFinder.ScanVoice?): String = if (row == null) \"*Disabled\" else abbreviateEngineNameFor(row.engineName)\n"
          "        val sorted = rows.sortedWith(Comparator { rowA, rowB ->\n"
          "            val orderA = voiceOrder(voiceKey(rowA, selectedIso))\n"
          "            val orderB = voiceOrder(voiceKey(rowB, selectedIso))\n"
          "            if (orderA != orderB) orderA - orderB else tieBreakLabel(rowA).compareTo(tieBreakLabel(rowB), ignoreCase = true)\n"
          "        })\n"
          "        LangStore.currentVoiceRows = sorted\n"
          "        var weightIdx = 0\n"
          "        while (weightIdx < sorted.size) { EngineFinder.voiceWeights[voiceKey(sorted[weightIdx], selectedIso)] = weightIdx; weightIdx++ }\n"
          "        return sorted\n"
          "    }\n"
          "    fun moveToFront(rows: List<EngineFinder.ScanVoice?>, position: Int, selectedIso: String, entry: LangEntry): List<EngineFinder.ScanVoice?> {\n"
          "        val reordered = ArrayList<EngineFinder.ScanVoice?>(rows)\n"
          "        val picked = reordered.removeAt(position)\n"
          "        reordered.add(0, picked)\n"
          "        LangStore.currentVoiceRows = reordered\n"
          "        var weightIdx = 0\n"
          "        while (weightIdx < reordered.size) { EngineFinder.voiceWeights[voiceKey(reordered[weightIdx], selectedIso)] = weightIdx; weightIdx++ }\n"
          "        if (picked != null) { entry.enginePkg = picked.pkg; entry.localeTag = picked.locale.toString() }\n"
          "        return reordered\n"
          "    }\n"
          "    fun variantsFor(rows: List<EngineFinder.ScanVoice?>, entry: LangEntry): List<String> {\n"
          "        if (rows.isEmpty()) return emptyList()\n"
          "        val picked = rows[0]\n"
          "        if (picked == null) return emptyList()\n"
          "        val base = picked.variants.toList()\n"
          "        val slotCount = base.size\n"
          "        if (slotCount == 0) return emptyList()\n"
          "        val ordered = Array(slotCount) { \"\" }\n"
          "        val savedVariant = entry.variant\n"
          "        if (savedVariant.isNotEmpty()) {\n"
          "            ordered[0] = savedVariant\n"
          "            var nextSlot = 1\n"
          "            for (index in base.indices) {\n"
          "                if (base[index] != savedVariant && nextSlot < slotCount) { ordered[nextSlot] = base[index]; nextSlot++ }\n"
          "            }\n"
          "        } else {\n"
          "            for (slotIdx in base.indices) ordered[slotIdx] = base[slotIdx]\n"
          "        }\n"
          "        if (slotCount > 1) java.util.Arrays.sort(ordered, 1, slotCount - 1)\n"
          "        return ordered.toList()\n"
          "    }\n"
          "    fun speakTest(rows: List<EngineFinder.ScanVoice?>, entry: LangEntry, selectedIso: String, testClient: TextToSpeech?) {\n"
          "        val row = rows.firstOrNull()\n"
          "        if (testClient == null || row == null) return\n"
          "        val voiceLocale = row.locale\n"
          "        val qualityTag = entry.variant\n"
          "        val sample = SampleTexts.get(EngineFinder.iso3Of(voiceLocale))\n"
          "        val spoken = if (sample.isEmpty())\n"
          "            \"Sorry. Sample text for language \" + (try { voiceLocale.getDisplayName(Locale(\"eng\")) } catch (_: Exception) { selectedIso }) + \" is missing.\"\n"
          "        else \"[EasyVoice:\" + row.pkg + \":\" + voiceLocale.toString() + \":\" + qualityTag + \"]\" + sample\n"
          "        testClient.speak(spoken, TextToSpeech.QUEUE_FLUSH, null, \"EasyVoice_Test\")\n"
          "    }\n"
          "}\n"
          )


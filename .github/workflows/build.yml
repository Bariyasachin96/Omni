                  // cover it, so no text is ever lost.
                  if ((int)spans.size() >= kMaxSpans) {
                      if (!spans.empty()) spans.back().bytes = (start + len) - spans.back().offset;
                      return;
                  }
                  LSpan ns;
                  ns.offset = start; ns.bytes = len;
                  ns.lang = lang;
                  ns.latin = latin;
                  spans.push_back(ns);
              };
              {
                  int n = (int)text.size();
                  int spanStart = 0, curScript = 0, i = 0;
                  while (i < n) {
                      signed char sb = (signed char)text[i];
                      if (sb >= 0) {                                  // ASCII fast path
                          int u = ((int)(unsigned char)text[i]) & 0x5F;
                          if (u < 0x41 || u > 0x5A) { i++; continue; }  // non A-Z ASCII is skipped
                          if (curScript >= 2) { glsEmit(spanStart, i - spanStart, curScript); spanStart = i; }
                          curScript = 1;
                          i++;
                          continue;
                      }
                      // AutoTTS validates every continuation byte and falls back to U+FFFD
                      // consuming a single byte (0x6531e4..0x6532c0)
                      int cp, cpLen;
                      const unsigned char* q = (const unsigned char*)text.data() + i;
                      int avail = n - i;
                      if (avail >= 2 && (q[0] & 0xE0) == 0xC0 && (q[1] & 0xC0) == 0x80) {
                          cp = ((q[0] & 0x1F) << 6) | (q[1] & 0x3F); cpLen = 2;

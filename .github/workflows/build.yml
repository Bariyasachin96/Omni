          "    // AutoTTS k.n(): mode-based force-enabled language list — overrides disabled status\n"
          "    // Mode auto(1): latFall+eng; mix(2/3): latFall; dual/dedicated(4): latFall+nonLatFall\n"
          "    private fun getForceEnabledLangs(mode: String, latFall: String, nonLatFall: String): Set<String> = when (mode) {\n"
          "        \"auto\", \"google\" -> setOf(latFall) // AutoTTS k.n(): L==2 AND L==3 add [C]=auto_mode_language. Google (L=3) still detects, so C must be force-enabled & kept in the CLD2 script-fallback set.\n"
          "        \"mix\"  -> setOf(latFall, nonLatFall) // AutoTTS L=4:   [H, I] = latin + non-latin both\n"
          "        \"dual\" -> setOf(latFall, nonLatFall) // AutoTTS L=1:   [\"eng\", D] = eng + dual_mode_language\n"
          "        else   -> emptySet()\n"
          "    }\n"
          "    // AutoTTS a.e(cp, k.f): returns first enabled lang for script family of cp\n"
          "    // Exact port: finds primary script lang, returns it if in enabled set, else tries fallbacks\n"
          "    private fun getScriptLangFiltered(cp: Int, enabled: Set<String>): String? {\n"
          "        val primary = getScriptLang(cp)\n"
          "        if (primary == null) {\n"
          "            VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} → null (no primary script)\")\n"
          "            return null\n"
          "        }\n"
          "        // AutoTTS a.c() (the FILTERED runtime path) DROPS the 8 archaic scripts → Unknown, even though\n"
          "        // a.b() (unfiltered) maps them (Linear B/Old Italic/Gothic/Deseret/Cypriot/Kharoshthi/\n"
          "        // Cuneiform/Egyptian). Mirror that: never resolve them to an enabled lang (e.g. Deseret→en).\n"
          "        if (cp in 0x10000..0x1007F || cp in 0x10300..0x1034F || cp in 0x10400..0x1044F ||\n"
          "            cp in 0x10800..0x1083F || cp in 0x10A00..0x10A5F || cp in 0x12000..0x1247F ||\n"
          "            cp in 0x13000..0x1345F) {\n"
          "            VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} → null (archaic script dropped in filtered path)\")\n"
          "            return null\n"
          "        }\n"
          "        // AutoTTS clsCLD2.b(): each script-family candidate must pass k.o() = configured AND\n"
          "        // NOT disabled (k.o returns d.i^true). enabledLangs mirrors k.f (configured, may still\n"
          "        // contain disabled langs), so apply the not-disabled half of k.o() here to match exactly.\n"
          "        if (primary in enabled && !prefs.isLanguageDisabled(primary)) {\n"
          "            VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → $primary (in enabled, k.o ok)\")\n"
          "            return primary\n"
          "        }\n"
          "        // AutoTTS a.b() returns distinct ScriptFamily objects that share a primary string but have\n"
          "        // NARROWER possible-sets for certain codepoints. Mirror those (like ru_sp) so the fallback\n"
          "        // set isn't over-broad:\n"
          "        val fallbacks = when {\n"
          "            // Cyrillic ru_sp letters (Ё ё Э э Ы ы) are family with [be] ONLY, not the full Cyrillic set.\n"
          "            primary == \"ru\" && (cp == 0x401 || cp == 0x451 || cp == 0x42D || cp == 0x44D || cp == 0x42B || cp == 0x44B) -> listOf(\"be\")\n"
          "            // AutoTTS a.java:197 — the 5 core Urdu letters (ٹ ڈ ڑ ہ ے) are family {ur,pa} → fallback [pa] only.\n"
          "            primary == \"ur\" && (cp == 0x0679 || cp == 0x0688 || cp == 0x0691 || cp == 0x06C1 || cp == 0x06D2) -> listOf(\"pa\")\n"
          "            // AutoTTS a.java:115 — Hiragana (ja_h) family is {ja} ONLY, no fallback (Katakana keeps [ain]).\n"
          "            primary == \"ja\" && ((cp in 0x3040..0x309F) || (cp in 0x1B000..0x1B12F)) -> emptyList()\n"
          "            // AutoTTS a.java:123 — Deseret (en_d) family is {en} ONLY, no Latin fallback list.\n"
          "            primary == \"en\" && (cp in 0x10400..0x1044F) -> emptyList()\n"
          "            else -> getScriptLangFallbacks(primary)\n"
          "        }\n"
          "        for (fb in fallbacks) {\n"
          "            if (fb in enabled && !prefs.isLanguageDisabled(fb)) {\n"
          "                VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → fallback=$fb (k.o ok)\")\n"
          "                return fb\n"
          "            }\n"
          "        }\n"
          "        VhLogger.d(\"[SCRIPT] getScriptLangFiltered cp=U+${cp.toString(16)} primary=$primary → null (no enabled fallback found)\")\n"
          "        return null\n"
          "    }\n"
          "    // Port of AutoTTS a.w map — ordered fallback lang list for each script family primary.\n"
          "    // Mirrors blockObj.a() iteration in clsCLD2.b() final fallback path.\n"
          "    private fun getScriptLangFallbacks(primary: String): List<String> = when (primary) {\n"
          "        \"fr\" -> listOf(\"ca\", \"oc\")\n"
          "        \"es\" -> listOf(\"pt\", \"gl\", \"ca\")\n"
          "        \"de\" -> listOf(\"lb\")\n"
          "        \"no\" -> listOf(\"da\", \"sv\", \"is\", \"fo\")\n"
          "        \"cs\" -> listOf(\"sk\")\n"
          "        \"en\" -> listOf(\"es\", \"fr\", \"de\", \"it\", \"pt\", \"nl\", \"sv\", \"no\", \"da\", \"fi\", \"pl\", \"cs\", \"sk\", \"hu\", \"ro\", \"tr\", \"id\", \"ms\", \"vi\", \"tl\", \"sw\", \"hr\", \"sr\", \"sl\", \"et\", \"lv\", \"lt\", \"is\", \"ga\", \"cy\", \"sq\", \"mt\")\n"
          "        \"el\" -> listOf(\"grc\", \"pnt\")\n"
          "        \"ru\" -> listOf(\"uk\", \"be\", \"bg\", \"mk\", \"sr\", \"bs\", \"hr\", \"kk\", \"ky\", \"tg\", \"mn\", \"uz\", \"tt\", \"ba\", \"cv\", \"sah\", \"ce\", \"av\", \"ab\")  // AutoTTS base Cyrillic family (m): full set c minus ru. (ru_sp letters Ё/Э/Ы use [be] — handled in getScriptLangFiltered)\n"
          "        \"sr\" -> listOf(\"bs\", \"hr\")\n"
          "        \"bg\" -> listOf(\"mk\")\n"
          "        \"kk\" -> listOf(\"ky\")\n"
          "        \"he\" -> listOf(\"yi\", \"lad\")\n"
          "        \"ar\" -> listOf(\"ar\")\n"
          "        \"fa\" -> listOf(\"ur\", \"ps\", \"ku\", \"ckb\", \"sd\", \"az\", \"ks\", \"ug\")\n"
          "        \"ur\" -> listOf(\"ps\", \"sd\", \"pa\")\n"
          "        \"ku\" -> listOf(\"ckb\")\n"
          "        \"hi\" -> listOf(\"mr\", \"ne\", \"sa\", \"kok\", \"mai\", \"bh\", \"new\", \"awa\", \"bho\", \"raj\", \"hne\")\n"
          "        \"mr\" -> listOf(\"kok\")\n"
          "        \"bn\" -> listOf(\"as\", \"mni\")\n"
          "        \"ta\" -> listOf(\"kn\")\n"
          "        \"kn\" -> listOf(\"tcy\")\n"
          "        \"th\" -> listOf(\"nod\", \"sou\", \"tts\")\n"
          "        \"lo\" -> listOf(\"hnx\")\n"
          "        \"bo\" -> listOf(\"dz\")\n"
          "        \"my\" -> listOf(\"shn\", \"kar\", \"mnw\")\n"
          "        \"ka\" -> listOf(\"xmf\", \"lzz\")\n"
          "        \"am\" -> listOf(\"ti\", \"om\", \"aa\", \"so\", \"sid\", \"wal\", \"gez\")\n"
          "        \"mn\" -> listOf(\"mnc\", \"xal\")\n"
          "        \"ja\" -> listOf(\"ain\")\n"
          "        \"zh\" -> listOf(\"ja\", \"ko\", \"vi\")\n"
          "        else -> emptyList()\n"
          "    }\n"
          "    // Auto TTS clsCLD2.c(char):boolean — ASCII punctuation check\n"
          "    private fun isLatinPunct(c: Char): Boolean {\n"
          "        val v = c.code\n"
          "        return (v in 33..47) || (v in 58..64) || (v in 91..96) || (v in 123..126)\n"
          "    }\n"
          "    private fun isLatinPunct(cp: Int) = (cp in 33..47) || (cp in 58..64) || (cp in 91..96) || (cp in 123..126)\n"
          "    // AutoTTS k.f(): get ISO3 language code from Locale, normalizing Chinese variants to \"zho\"\n"
          "    private fun getIso3Lang(locale: Locale?): String {\n"
          "        if (locale == null) return \"zxx\"\n"
          "        return try {\n"
          "            val iso3 = locale.isO3Language\n"
          "            if (iso3 == \"cmn\" || iso3 == \"lzh\" || iso3 == \"gan\" || iso3 == \"hak\") \"zho\" else iso3\n"
          "        } catch (_: Exception) { \"zxx\" }\n"
          "    }\n"
          "    // AutoTTS k.c(): build ISO 2↔3 letter code maps (idempotent — only runs once)\n"
          "    private fun initIsoMaps() {\n"
          "        if (isoToIso3.isNotEmpty()) return\n"
          "        for (iso in Locale.getISOLanguages()) {\n"
          "            try {\n"
          "                val iso3 = getIso3Lang(Locale(iso))  // AutoTTS k.f() — normalizes Chinese variants\n"
          "                isoToIso3[iso] = iso3\n"
          "                iso3ToIso[iso3] = iso\n"
          "            } catch (_: Exception) {}\n"
          "        }\n"
          "    }\n"
          "    // Engine availability check (AutoTTS k.o()) — normalizes 3-letter ISO to 2-letter before lookup\n"
          "    private fun isEngineAvailable(lang: String): Boolean {\n"
          "        val lookupKey = if (lang.length == 3) iso3ToIso[lang] ?: lang else lang\n"
          "        val engine = prefs.getEngineForLanguage(lookupKey)\n"
          "        val result = engine != \"NOT_SET\"\n"
          "        VhLogger.d(\"[ENGINE] isEngineAvailable lang=$lang lookupKey=$lookupKey engine=$engine → $result\")\n"
          "        return result\n"
          "    }\n"
          "    // AutoTTS k.o(): engine CONFIGURED and language NOT disabled (k.o returns d.i^true, i.e.\n"
          "    // false when the language's engine is set to \"Disable\"). AutoTTS uses k.o() to accept a CLD2\n"
          "    // result (clsCLD2.b:60) and H()==\"Disable\" to reject a span (auto:1653, mix:1794) — both mean\n"
          "    // \"disabled → don't use\". isEngineAvailable alone only checks configured, so pair it with the\n"
          "    // not-disabled flag here for exact k.o() parity.\n"
          "    private fun ko(lang: String): Boolean = isEngineAvailable(lang) && !prefs.isLanguageDisabled(lang)\n"
          "    // AutoTTS k.q() int routing: 0=auto, 1=latFall, 2=nonLatFall\n"
          "    private fun modeIntToLang(mode: Int, latFall: String, nonLatFall: String): String = when (mode) {\n"
          "        1 -> latFall\n"
          "        2 -> nonLatFall\n"
          "        else -> \"auto\"\n"
          "    }\n"
          "    // AutoTTS S(): build ordered engine list M — system default engine FIRST, then engine_N prefs, Google TTS as last resort.\n"
          "    private fun buildEngineList() {\n"
          "        synchronized(this) {\n"
          "            val newM = ArrayList<String>()\n"
          "            // AutoTTS S(): defaultEngine = H(deviceLang). In GOOGLE mode (L=3) H() ALWAYS returns\n"
          "            // \"com.google.android.tts\" (H() line 315), so Google is forced into the pool at M[0].\n"
          "            // Without this a google-mode chunk forces engine=Google but the pool lacks it →\n"
          "            // V() can't find it → d_=-1 → no speech and no onStart/onDone/onStop callbacks.\n"
          "            val isGoogleMode = prefs.getReadingMode() == \"google\" || prefs.isGoogleTtsOnly()\n"
          "            val defaultEngine = if (isGoogleMode) \"com.google.android.tts\" else prefs.getEngineForLanguage(kfLocale())  // AutoTTS: H(c3.k.f(Locale.getDefault()))\n"
          "            var n = 0\n"
          "            while (true) {\n"
          "                val pkg = prefs.getString(\"engine_$n\", \"\")  // AutoTTS: prefs.getString(\"engine_\" + n, \"\")\n"
          "                if (pkg.isEmpty() || pkg == \"end\") break\n"
          "                if (pkg != defaultEngine) newM.add(pkg)  // skip if duplicate of default\n"
          "                n++\n"
          "            }\n"
          "            if (defaultEngine.isNotEmpty() && defaultEngine != \"NOT_SET\") {\n"
          "                newM.add(0, defaultEngine)  // AutoTTS: M.add(0, defaultEngine) — default engine is always FIRST\n"
          "            }\n"
          "            // CRITICAL: also add the engine configured for EVERY language (e.g. Eloquence for\n"
          "            // English), not just the device-locale default. Otherwise a per-language engine whose\n"
          "            // language is not the device locale never enters the pool → V() \"TTS is not ready\" →\n"
          "            // nothing is spoken. (AutoTTS S() lists ALL installed engines, achieving the same.)\n"
          "            val cfgLangs = HashSet<String>().apply { addAll(prefs.getLanguageList()); addAll(Languages.map.keys) }\n"
          "            for (lang in cfgLangs) {\n"
          "                val eng = prefs.getEngineForLanguage(lang)\n"
          "                if (eng != \"NOT_SET\" && eng.isNotEmpty() && !newM.contains(eng)) newM.add(eng)\n"
          "            }\n"
          "            if (newM.isEmpty()) {\n"
          "                newM.add(\"com.google.android.tts\")  // AutoTTS: c3.t.a() — Google TTS fallback when list empty\n"
          "            }\n"
          "            M = newM\n"
          "            VhLogger.d(\"[SERVICE] buildEngineList (AutoTTS S()): M=$newM\")\n"
          "        }\n"
          "    }\n"
          "    // AutoTTS Y(): load voice list T from voice_N prefs, read dedicated_engines into O — exact port\n"
          "    private fun buildVoiceList() {\n"
          "        synchronized(this) {\n"
          "            if (!T.isEmpty()) return  // already loaded — one-time, mirrors AutoTTS Y() early-exit\n"
          "            val sp = getApplicationContext().getSharedPreferences(\"auto_tts_settings\", 0)\n"
          "            var n = 0\n"
          "            while (true) {\n"
          "                val voice = sp.getString(\"voice_$n\", \"\") ?: \"\"\n"
          "                if (voice.isEmpty()) {\n"
          "                    O = sp.getBoolean(\"dedicated_engines\", false)  // AutoTTS: O = prefs.getBoolean(\"dedicated_engines\", false)\n"
          "                    return\n"
          "                }\n"
          "                T.add(voice)  // AutoTTS: T.add(object)\n"
          "                n++\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "    // AutoTTS S()/Y()/U()/R(): eager pref snapshot at startup before engine init (N())\n"
          "    private fun eagerLoadPrefs() {\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs start\")\n"
          "        buildEngineList()  // AutoTTS: S() called first in onCreate before N() engine init\n"
          "        buildVoiceList()   // AutoTTS: Y() loads voice list T + dedicated_engines O\n"
          "        Languages.map.keys.forEach { prefs.getEngineForLanguage(it) }\n"
          "        prefs.isDedicatedEnginesEnabled()\n"
          "        L = when { prefs.getReadingMode() == \"google\" || prefs.isGoogleTtsOnly() -> 3; prefs.getReadingMode() == \"dual\" -> 1; prefs.getReadingMode() == \"mix\" -> 4; else -> 0 }  // AutoTTS: L (0=auto,1=dual,3=google,4=mix)\n"
          "        val eLatLang = prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { kfLocale() }  // AutoTTS H default: device locale ISO3\n"
          "        val eNonLatLang = prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { kfLocale() }  // AutoTTS I default: device locale ISO3\n"
          "        prefs.getString(\"pref_lang\", \"en\")\n"
          "        prefs.getString(\"auto_mode_language\", \"\")\n"
          "        D = prefs.getString(\"dual_mode_language\", \"\").ifEmpty { kfLocale() }  // AutoTTS R(): D = dual_mode_language, default=device locale ISO3\n"
          "        prefs.isShowNotification()\n"
          "        prefs.isDisableAdvancedDetection()\n"
          "        N = prefs.isLocaleSpansEnabled()         // AutoTTS k.p(): locale_spans → N\n"
          "        P = prefs.isBrokenEngineProtector()      // AutoTTS k.r(): strip_audio_attr → P\n"
          "        Q = prefs.isForceAccessibilityStream()   // AutoTTS k.r(): force_accessibility_stream → Q\n"
          "        E = prefs.getNumberModeLang()            // AutoTTS k.q(): number_mode_language → E\n"
          "        F = prefs.getPuncModeLang()              // AutoTTS k.q(): punc_mode_language → F\n"
          "        EmojiMode = prefs.getEmojiModeLang()     // AutoTTS k.q(): emoji_mode_language → G\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs: N(localeSpans)=$N P(brokenProtector)=$P Q(forceAccessibility)=$Q\")\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs: E(numberMode)=$E F(puncMode)=$F EmojiMode=$EmojiMode\")\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs: readingMode=${prefs.getReadingMode()} dedEngines=${prefs.isDedicatedEnginesEnabled()} disableAdv=${prefs.isDisableAdvancedDetection()}\")\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs: latLang=$eLatLang nonLatLang=$eNonLatLang\")\n"
          "        VhLogger.d(\"[SERVICE] eagerLoadPrefs complete (AutoTTS S/Y/U/R)\")\n"
          "    }\n"
          "    // Port of AutoTTS k.f(Locale): returns ISO3 language, normalising CJK variants → \"zho\"\n"
          "    private fun kfLocale(locale: java.util.Locale = java.util.Locale.getDefault()): String {\n"
          "        return try {\n"
          "            val iso3 = locale.isO3Language\n"
          "            if (iso3 in listOf(\"cmn\", \"lzh\", \"gan\", \"hak\")) \"zho\" else iso3\n"
          "        } catch (_: Exception) { \"zxx\" }\n"
          "    }\n"
          "    // Port of AutoTTS P(Locale, Locale): semantic locale match with empty-field wildcards\n"
          "    private fun localeMatchesP(tag1: String, tag2: String): Boolean {\n"
          "        if (tag1 == tag2) return true\n"
          "        val loc1 = Locale.forLanguageTag(tag1)\n"
          "        val loc2 = Locale.forLanguageTag(tag2)\n"
          "        val lang1 = try { loc1.isO3Language } catch (_: Exception) { return false }\n"
          "        val lang2 = try { loc2.isO3Language } catch (_: Exception) { return false }\n"
          "        if (lang1 != lang2) return false\n"
          "        val country1 = loc1.isO3Country\n"
          "        if (country1.isEmpty()) return true\n"
          "        if (country1 != loc2.isO3Country) return false\n"
          "        val variant1 = loc1.variant\n"
          "        if (variant1.isEmpty()) return true\n"
          "        return variant1 == loc2.variant\n"
          "    }\n"
          "    // Latin-script languages: if detected but engine not configured, fall to latFall\n"
          "    // (not nonLatFall). Mirrors AutoTTS mix-mode which assigns Latin engine directly\n"
          "    // without per-block sub-language detection.\n"
          "    private fun isLatinScript(lang: String) = lang in setOf(\n"
          "        \"en\",\"fr\",\"de\",\"es\",\"it\",\"pt\",\"nl\",\"sv\",\"da\",\"no\",\"nb\",\"nn\",\n"
          "        \"fi\",\"pl\",\"cs\",\"ro\",\"hu\",\"sk\",\"sl\",\"hr\",\"lt\",\"lv\",\"et\",\n"
          "        \"tr\",\"vi\",\"af\",\"ca\",\"cy\",\"eu\",\"ga\",\"gl\",\"is\",\"lb\",\"mt\",\n"
          "        \"sq\",\"sw\",\"tl\",\"id\",\"ms\",\"bs\",\"az\",\"uz\",\"tk\",\"ky\"\n"
          "    )\n"
          "    // Returns first candidate lang that has an engine configured (AutoTTS a.c() enabled-set pattern)\n"
          "    private fun pickEnabledLang(vararg candidates: String): String? =\n"
          "        candidates.firstOrNull { isEngineAvailable(it) }\n"
          "    // Script-family map: when CLD2 detects a disabled language, try related languages in the same script family.\n"
          "    // Derived from AutoTTS a.java a() map (script groups: primary + possible languages).\n"
          "    // Key = CLD2 result lang, Value = ordered list of fallback candidates to try (most related first).\n"
          "    private val scriptGroups: Map<String, List<String>> = mapOf(\n"
          "        // Latin — closely related language pairs CLD2 commonly confuses\n"
          "        \"ca\" to listOf(\"ca\", \"es\", \"fr\"),         // Catalan → Spanish/French\n"
          "        \"oc\" to listOf(\"oc\", \"fr\", \"ca\"),         // Occitan → French/Catalan\n"
          "        \"gl\" to listOf(\"gl\", \"es\", \"pt\"),         // Galician → Spanish/Portuguese\n"
          "        \"lb\" to listOf(\"lb\", \"de\"),                // Luxembourgish → German\n"
          "        \"nl\" to listOf(\"nl\", \"de\", \"af\"),         // Dutch → German/Afrikaans\n"
          "        \"af\" to listOf(\"af\", \"nl\"),                // Afrikaans → Dutch\n"
          "        \"nb\" to listOf(\"nb\", \"no\", \"da\"),         // Bokmål → Norwegian/Danish\n"
          "        \"nn\" to listOf(\"nn\", \"no\", \"da\", \"sv\"),  // Nynorsk → Norwegian/Danish/Swedish\n"
          "        \"fo\" to listOf(\"fo\", \"no\", \"da\", \"sv\"),  // Faroese → Norwegian/Danish/Swedish\n"
          "        \"is\" to listOf(\"is\", \"no\", \"da\", \"sv\"),  // Icelandic → Scandinavian\n"
          "        \"sk\" to listOf(\"sk\", \"cs\"),                // Slovak → Czech\n"
          "        \"bs\" to listOf(\"bs\", \"sr\", \"hr\"),         // Bosnian → Serbian/Croatian\n"
          "        \"hr\" to listOf(\"hr\", \"bs\", \"sr\"),         // Croatian → Bosnian/Serbian\n"
          "        \"sl\" to listOf(\"sl\", \"hr\"),                // Slovenian → Croatian\n"
          "        // Cyrillic families\n"
          "        \"be\" to listOf(\"be\", \"ru\"),                // Belarusian → Russian\n"
          "        \"bg\" to listOf(\"bg\", \"mk\"),                // Bulgarian → Macedonian\n"
          "        \"mk\" to listOf(\"mk\", \"bg\"),                // Macedonian → Bulgarian\n"
          "        \"sr\" to listOf(\"sr\", \"bs\", \"hr\"),         // Serbian → Bosnian/Croatian\n"
          "        \"ky\" to listOf(\"ky\", \"kk\"),                // Kyrgyz → Kazakh\n"
          "        // Arabic-script families\n"
          "        \"ckb\" to listOf(\"ckb\", \"ku\"),              // Sorani Kurdish → Kurmanji\n"
          "        \"ku\" to listOf(\"ku\", \"ckb\"),               // Kurmanji → Sorani\n"
          "        \"tg\" to listOf(\"tg\", \"fa\"),                // Tajik → Persian\n"
          "        // Indic families\n"
          "        \"kok\" to listOf(\"kok\", \"mr\"),              // Konkani → Marathi\n"
          "        \"as\" to listOf(\"as\", \"bn\"),                // Assamese → Bengali\n"
          "        \"ne\" to listOf(\"ne\", \"hi\"),                // Nepali → Hindi\n"
          "        \"kn\" to listOf(\"kn\", \"ta\"),                // Kannada → Tamil\n"
          "        // Semitic\n"
          "        \"yi\" to listOf(\"yi\", \"he\"),                // Yiddish → Hebrew\n"
          "        // Ethiopic\n"
          "        \"ti\" to listOf(\"ti\", \"am\"),                // Tigrinya → Amharic\n"
          "        // CJK — AutoTTS c3.k.java:267-270 maps all Chinese variants to zho\n"
          "        \"yue\" to listOf(\"yue\", \"zh\"),              // Cantonese\n"
          "        \"cmn\" to listOf(\"cmn\", \"zh\"),              // Mandarin (ISO-3)\n"
          "        \"lzh\" to listOf(\"lzh\", \"zh\"),              // Literary Chinese\n"
          "        \"gan\" to listOf(\"gan\", \"zh\"),              // Gan Chinese\n"
          "        \"hak\" to listOf(\"hak\", \"zh\"),              // Hakka Chinese\n"
          "        \"wuu\" to listOf(\"wuu\", \"zh\"),              // Wu Chinese (Shanghainese)\n"
          "        \"nan\" to listOf(\"nan\", \"zh\"),              // Min Nan (Hokkien/Taiwanese)\n"
          "        // Primary Indic languages (CLD2 returns these directly)\n"
          "        \"hi\" to listOf(\"hi\", \"mr\", \"ne\", \"kok\"),  // Hindi → Marathi/Nepali/Konkani (Devanagari)\n"
          "        \"mr\" to listOf(\"mr\", \"hi\", \"ne\"),          // Marathi → Hindi/Nepali\n"
          "        \"bn\" to listOf(\"bn\", \"as\"),                 // Bengali → Assamese\n"
          "        \"gu\" to listOf(\"gu\"),                        // Gujarati\n"
          "        \"pa\" to listOf(\"pa\"),                        // Punjabi (Gurmukhi)\n"
          "        \"ta\" to listOf(\"ta\", \"kn\"),                 // Tamil → Kannada\n"
          "        \"te\" to listOf(\"te\", \"kn\", \"ta\"),          // Telugu → Kannada/Tamil\n"
          "        \"ml\" to listOf(\"ml\"),                        // Malayalam\n"
          "        \"si\" to listOf(\"si\"),                        // Sinhala\n"
          "        \"or\" to listOf(\"or\"),                        // Odia/Oriya\n"
          "        // Primary Arabic-script languages\n"
          "        \"ur\" to listOf(\"ur\", \"fa\", \"ar\"),          // Urdu → Persian/Arabic\n"
          "        \"fa\" to listOf(\"fa\", \"ur\", \"ar\"),          // Persian → Urdu/Arabic\n"
          "        \"ar\" to listOf(\"ar\", \"fa\", \"ur\"),          // Arabic → Persian/Urdu\n"
          "        // Primary Semitic\n"
          "        \"he\" to listOf(\"he\", \"yi\"),                 // Hebrew → Yiddish\n"
          "        // Primary Cyrillic\n"
          "        \"ru\" to listOf(\"ru\", \"uk\", \"be\", \"bg\"),   // Russian → Ukrainian/Belarusian/Bulgarian\n"
          "        \"uk\" to listOf(\"uk\", \"ru\", \"be\"),          // Ukrainian → Russian/Belarusian\n"
          "        \"kk\" to listOf(\"kk\", \"ky\"),                 // Kazakh → Kyrgyz\n"
          "        // CJK primaries\n"
          "        \"ja\" to listOf(\"ja\", \"zh\"),                 // Japanese → Chinese\n"
          "        \"zh\" to listOf(\"zh\", \"ja\"),                 // Chinese → Japanese\n"
          "        \"ko\" to listOf(\"ko\"),                        // Korean\n"
          "        // Other Asian scripts\n"
          "        \"th\" to listOf(\"th\"),                        // Thai\n"
          "        \"my\" to listOf(\"my\"),                        // Myanmar/Burmese\n"
          "        \"km\" to listOf(\"km\"),                        // Khmer\n"
          "        \"lo\" to listOf(\"lo\"),                        // Lao\n"
          "        \"bo\" to listOf(\"bo\"),                        // Tibetan\n"
          "        \"mn\" to listOf(\"mn\"),                        // Mongolian\n"
          "        // Caucasian scripts\n"
          "        \"ka\" to listOf(\"ka\"),                        // Georgian\n"
          "        \"hy\" to listOf(\"hy\"),                        // Armenian\n"
          "        // Ethiopic primary\n"
          "        \"am\" to listOf(\"am\", \"ti\"),                 // Amharic → Tigrinya\n"
          "    )\n"
          "    // AutoTTS a.c() smart CLD2 fallback: when CLD2 returns a disabled language,\n"
          "    // check if any language in the same script family is enabled.\n"
          "    // Falls back to latFall/nonLatFall if no family member is enabled.\n"
          "    private fun smartLangFallback(cldLang: String, latFall: String, nonLatFall: String): String {\n"
          "        val group = scriptGroups[cldLang]\n"
          "        if (group != null) {\n"
          "            val enabled = group.firstOrNull { isEngineAvailable(it) }\n"
          "            if (enabled != null) return enabled\n"
          "        }\n"
          "        return if (isLatinScript(cldLang)) latFall else nonLatFall\n"
          "    }\n"
          "    // ISO 639-3 → ISO 639-1 normalization for CLD2 edge cases (AutoTTS k.o ISO3 comparison)\n"
          "    private fun normalizeLangCode(code: String): String {\n"
          "        if (code.length <= 2) return code\n"
          "        val m = mapOf(\n"
          "            \"zho\" to \"zh\", \"hin\" to \"hi\", \"ben\" to \"bn\", \"ara\" to \"ar\",\n"
          "            \"por\" to \"pt\", \"rus\" to \"ru\", \"jpn\" to \"ja\", \"kor\" to \"ko\",\n"
          "            \"deu\" to \"de\", \"fra\" to \"fr\", \"ita\" to \"it\", \"spa\" to \"es\",\n"
          "            \"nld\" to \"nl\", \"tur\" to \"tr\", \"pol\" to \"pl\", \"vie\" to \"vi\",\n"
          "            \"fas\" to \"fa\", \"tha\" to \"th\", \"ind\" to \"id\", \"msa\" to \"ms\",\n"
          "            \"ukr\" to \"uk\", \"ces\" to \"cs\", \"ron\" to \"ro\", \"hun\" to \"hu\",\n"
          "            \"swe\" to \"sv\", \"nor\" to \"no\", \"dan\" to \"da\", \"fin\" to \"fi\",\n"
          "            \"ell\" to \"el\", \"bul\" to \"bg\", \"hrv\" to \"hr\", \"slk\" to \"sk\",\n"
          "            \"slv\" to \"sl\", \"srp\" to \"sr\", \"mkd\" to \"mk\", \"lit\" to \"lt\",\n"
          "            \"lav\" to \"lv\", \"est\" to \"et\", \"afr\" to \"af\", \"cat\" to \"ca\",\n"
          "            \"tam\" to \"ta\", \"tel\" to \"te\", \"mal\" to \"ml\", \"kan\" to \"kn\",\n"
          "            \"guj\" to \"gu\", \"mar\" to \"mr\", \"pan\" to \"pa\", \"urd\" to \"ur\",\n"
          "            \"nep\" to \"ne\", \"sin\" to \"si\", \"khm\" to \"km\", \"lao\" to \"lo\",\n"
          "            \"mya\" to \"my\", \"amh\" to \"am\", \"bod\" to \"bo\", \"ori\" to \"or\",\n"
          "            \"kat\" to \"ka\", \"hye\" to \"hy\", \"kaz\" to \"kk\", \"mon\" to \"mn\",\n"
          "            \"uzb\" to \"uz\", \"heb\" to \"he\", \"swa\" to \"sw\", \"zul\" to \"zu\",\n"
          "            \"yor\" to \"yo\", \"jav\" to \"jv\", \"sun\" to \"su\", \"wel\" to \"cy\",\n"
          "            \"gle\" to \"ga\", \"glg\" to \"gl\", \"eus\" to \"eu\", \"bos\" to \"bs\",\n"
          "            \"mlt\" to \"mt\", \"isl\" to \"is\", \"sqi\" to \"sq\"\n"
          "        )\n"
          "        return m[code.lowercase()] ?: code\n"
          "    }\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    // onSynthesizeText — Auto TTS exact pipeline\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    override fun onSynthesizeText(request: SynthesisRequest?, callback: SynthesisCallback?) {\n"
          "        // ── Reset BOTH stop flags atomically inside the lock, then wake any leaked waiter. ──\n"
          "        // Matches original lines 1248–1257: two synchronized blocks each setting one flag\n"
          "        // + notifyAll. A previous call's wait()-blocked thread (if any) must be unblocked\n"
          "        // so it doesn't leak state into this new utterance.\n"
          "        synchronized(syncLock) { isStopped = false; syncLock.notifyAll() }\n"
          "        synchronized(syncLock) { isFlushed = false; syncLock.notifyAll() }\n"
          "        // AutoTTS parity: its settings UI refreshes the L/D/N/P/Q/E/F statics on every change,\n"
          "        // so a bound service always speaks with current settings. EasyVoice caches these once at\n"
          "        // boot (eagerLoadPrefs); re-read the cheap pref-backed ones here — NO engine/voice rebuild —\n"
          "        // so a runtime settings change applies without needing a service restart.\n"
          "        L = when { prefs.getReadingMode() == \"google\" || prefs.isGoogleTtsOnly() -> 3; prefs.getReadingMode() == \"dual\" -> 1; prefs.getReadingMode() == \"mix\" -> 4; else -> 0 }\n"
          "        D = prefs.getString(\"dual_mode_language\", \"\").ifEmpty { kfLocale() }\n"
          "        N = prefs.isLocaleSpansEnabled(); P = prefs.isBrokenEngineProtector(); Q = prefs.isForceAccessibilityStream()\n"
          "        E = prefs.getNumberModeLang(); F = prefs.getPuncModeLang(); EmojiMode = prefs.getEmojiModeLang()\n"
          "        VhLogger.d(\"[SERVICE] onSynthesizeText textLen=${request?.charSequenceText?.length ?: 0}\")\n"
          "        // AutoTTS: R flag check — foreground sync BEFORE reading charSequenceText\n"
          "        if (prefs.isShowNotification()) {\n"
          "            startForegroundIfPossible()\n"
          "        } else if (Q()) {\n"
          "            stopForegroundSafe()\n"
          "        }\n"
          "        i = request?.params                                  // AutoTTS: this.i = request.params Bundle stored as instance field\n"
          "        j = i?.getFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, 0f) ?: 0f; if (j == 0f) j = 1.0f  // AutoTTS: this.j from this.i\n"
          "        val rawCharSeq = request?.charSequenceText ?: \"\"\n"
          "        // AutoTTS: X (utteranceId) extracted after charSequenceText\n"
          "        X = request?.params?.getString(\"utteranceId\") ?: \"\"\n"
          "        // AutoTTS: no bidi mark stripping\n"
          "        val rawText = rawCharSeq.toString()\n"
          "        // AutoTTS: this.k = getSpeechRate(), this.l = getPitch() — after charSequenceText, before empty check\n"
          "        k = (request?.speechRate ?: 100) / 100.0f\n"
          "        l = (request?.pitch ?: 100) / 100.0f\n"
          "        if (rawText.trim().isEmpty()) {\n"
          "            // AutoTTS e0(false) (line 1277-1278): iterate ALL engines f, speak(\"\") on each where\n"
          "            // state==2 AND listenerSet(g) AND isSpeaking — not just the active engine (exact parity).\n"
          "            run { var en = 0; while (en < f.size) { val w = f[en]; if (w.state == 2 && w.listenerSet && w.tts?.isSpeaking == true) { try { f.getOrNull(d_)?.tts?.speak(\"\", TextToSpeech.QUEUE_FLUSH, null, null) } catch (_: Exception) {} }; en++ } }  // AutoTTS e0(false): speak(\"\") on f[this.d] (current engine), not the speaking one\n"
          "            synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "            synchronized(syncLock) { isFlushed = true; syncLock.notifyAll() }\n"
          "            // Auto TTS F(synthesisCallback, 1)\n"
          "            if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            if (callback?.hasFinished() == false) callback?.done()\n"
          "            return\n"
          "        }\n"
          "        val readingMode = prefs.getReadingMode()\n"
          "        // ── OPTION-B ITEM 2: Snapshot synth-wide prefs ONCE at the top of this call. ──\n"
          "        // Matches original AutoTtsService.R() pattern: load all mode/flag prefs into local\n"
          "        // variables here so the chunk loop and native bridge never hit SharedPreferences\n"
          "        // again during this synthesis call. Each prefs.getX() costs ~0.5–2ms; this synth\n"
          "        // call previously hit ~10 of them per chunk path, adding up to ~10–20ms wasted.\n"
          "        // Lang-specific prefs (rate/pitch/vol/engine/locale/voice) stay per-chunk since\n"
          "        // they vary by chunk language and the engine pool key depends on them.\n"
          "        val isForceAccessibility  = prefs.isForceAccessibilityStream()   // read live so the toggle applies without a service restart (AutoTTS Q static field)\n"
          "        val isGoogleOnly          = prefs.isGoogleTtsOnly()              // Auto TTS f6825L==3\n"
          "        val isBrokenProtector     = prefs.isBrokenEngineProtector()      // read live (AutoTTS P static field)\n"
          "        val isDedicated           = prefs.isDedicatedEnginesEnabled()\n"
          "        // BUNDLE-Z ITEM 2: locale_spans pref controls whether TalkBack's pre-tagged\n"
          "        // LocaleSpan hints are used in mix mode (matches original AutoTtsService.N field).\n"
          "        // Default OFF (false) — when ON, splitByLocaleSpans is invoked instead of the\n"
          "        // native script-boundary splitter. Useful for chat/document apps that properly\n"
          "        // tag mixed-language content; harmful for apps that mis-tag (the default reason\n"
          "        // we kept it off by default).\n"
          "        val useLocaleSpans    = prefs.isLocaleSpansEnabled()     // read live (AutoTTS N static field) so the toggle applies without a service restart\n"
          "        // AutoTTS k.q(): H=mixed_lat, I=mixed_nonlat, C=auto_mode_lang, D=dual_mode_lang\n"
          "        val latFall = when (readingMode) {\n"
          "            \"mix\"  -> prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { java.util.Locale.getDefault().language }  // AutoTTS H default: device locale (k.f(Locale.getDefault())); UI default matches, so no UI/backend mismatch\n"
          "            \"dual\" -> \"en\"                                                       // AutoTTS L=1: type-1 always uses \"eng\"\n"
          "            else   -> prefs.getString(\"auto_mode_language\", \"\").ifEmpty { kfLocale() }  // AutoTTS C: auto_mode_language pref, default=device locale ISO3\n"
          "        }\n"
          "        val nonLatFall = when (readingMode) {\n"
          "            \"mix\"  -> prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { java.util.Locale.getDefault().language }  // AutoTTS I default: device locale (k.f(Locale.getDefault())); UI default matches, so no UI/backend mismatch\n"
          "            \"dual\" -> prefs.getString(\"dual_mode_language\", \"\").ifEmpty { kfLocale() }  // read live (like auto_mode_language) so UI changes apply without a service restart; AutoTTS shares D via a static field\n"
          "            else   -> prefs.getString(\"auto_mode_language\", \"\").ifEmpty { kfLocale() }  // AutoTTS C: auto_mode_language pref, default=device locale ISO3\n"
          "        }\n"
          "        // AutoTTS k.f + k.n(): build enabledLangs — configured engines + mode force-enabled langs\n"
          "        val baseEnabled = Languages.map.keys.filter { prefs.getEngineForLanguage(it) != \"NOT_SET\" }.toHashSet()\n"
          "        val forceEnabled = getForceEnabledLangs(readingMode, latFall, nonLatFall)\n"
          "        // AutoTTS k.h/k.l: the mode's force-enable target langs OVERRIDE the user's _disabled\n"
          "        // flag (d.i=false, persisted via k.z). Un-disable any configured force-enable target so\n"
          "        // the mode's primary language is always available — matches AutoTTS exactly.\n"
          "        for (fl in forceEnabled) {\n"
          "            if (prefs.isLanguageConfigured(fl) && prefs.isLanguageDisabled(fl)) {\n"
          "                prefs.setLanguageDisabled(fl, false)  // AutoTTS d.i=false + k.z persist\n"
          "            }\n"
          "        }\n"
          "        enabledLangs = (baseEnabled + forceEnabled.filter { prefs.getEngineForLanguage(it) != \"NOT_SET\" }).toHashSet()\n"
          "        // ── ROUTING SNAPSHOT: the context that decides where each chunk goes. If speech is wrong,\n"
          "        //    this one line explains why (latFall = Latin engine, nonLatFall = non-Latin engine). ──\n"
          "        // Native-mode prefs (used by mix/dual paths only) — read once even if branch unused.\n"
          "        val dictEnabled       = prefs.getBoolean(\"dict_enabled\", false)\n"
          "        val emojiReading      = prefs.getBoolean(\"emoji_reading\", true)\n"
          "        val emojiCount        = prefs.getBoolean(\"emoji_count\", false)\n"
          "        val punctCount        = prefs.getBoolean(\"punct_count\", false)\n"
          "        val mixNumLang        = modeIntToLang(prefs.getNumberModeLang(), latFall, nonLatFall)   // AutoTTS E: number_mode_language (read live so the dropdown applies without a service restart)\n"
          "        val mixPuncLang       = modeIntToLang(prefs.getPuncModeLang(), latFall, nonLatFall)     // AutoTTS F: punc_mode_language (live)\n"
          "        val mixEmojiLang      = \"auto\"    // AutoTTS G (emoji_mode_language) is DEAD — w.g takes only E/F, never emoji. Keep emoji type/neighbour-based for exact parity (the emoji dropdown UI is kept but inert, like AutoTTS).\n"
          "        // Dict map: only fetch if enabled — getDict() reads multiple SharedPreferences keys.\n"
          "        val cachedDictMap: Map<String, String> = if (dictEnabled) prefs.getDict() else emptyMap()\n"
          "        val chunks = mutableListOf<TextChunk>()\n"
          "        // ── [AutoTTS:] PREFIX BYPASS ──\n"
          "        // AutoTTS: length>=9 && substring(0,9).equals(\"[AutoTTS:\")\n"
          "        // AutoTTS trims the text (object4 = object4.trim(), AutoTtsService:1599) BEFORE the\n"
          "        // [AutoTTS:] prefix check, so a leading-whitespace prefix still matches. Mirror that.\n"
          "        val trimmedText = rawText.trim()\n"
          "        val bypassPrefix = trimmedText.length >= 9 && trimmedText.startsWith(\"[AutoTTS:\")\n"
          "        var bypassed = false\n"
          "        if (bypassPrefix) {\n"
          "            // AutoTTS exact: split on ALL ']', require exactly 2 parts.\n"
          "            val splitParts = trimmedText.split(\"]\")\n"
          "            if (splitParts.size == 2) {\n"
          "                var forcedEng: String? = null\n"
          "                var forcedLoc: String? = null\n"
          "                var forcedVariant: String? = null\n"
          "                // AutoTTS: substring(1) removes leading '[', then split on ':' requires exactly 4 parts.\n"
          "                // Parts: [0]=AutoTTS (ignored), [1]=engine, [2]=locale, [3]=variant.\n"
          "                val innerParts = splitParts[0].substring(1).split(\":\")\n"
          "                if (innerParts.size == 4) {\n"
          "                    forcedEng     = innerParts[1].takeIf { it.isNotBlank() }\n"
          "                    forcedLoc     = innerParts[2].takeIf { it.isNotBlank() }\n"
          "                    forcedVariant = innerParts[3].takeIf { it.isNotBlank() }\n"
          "                }\n"
          "                // AutoTTS: content is splitParts[1] as-is (no trimStart, no normalization)\n"
          "                val stripped = splitParts[1]\n"
          "                // AutoTTS: c3.k.f(this.Z(object6)) — split on '_', get ISO3, normalize Chinese\n"
          "                val baseLang: String = run {\n"
          "                    val loc = forcedLoc\n"
          "                    if (loc == null || loc.isBlank()) latFall\n"
          "                    else try {\n"
          "                        val p = loc.split(\"_\")\n"
          "                        val locale: Locale = when (p.size) {\n"
          "                            1 -> Locale(p[0])\n"
          "                            2 -> Locale(p[0], p[1])\n"
          "                            else -> if (p[2].isNotEmpty()) Locale(p[0], p[1], p[2]) else Locale(p[0], p[1])\n"
          "                        }\n"
          "                        val iso3 = locale.getISO3Language()\n"
          "                        when {\n"
          "                            iso3 == \"cmn\" || iso3 == \"lzh\" || iso3 == \"gan\" || iso3 == \"hak\" -> \"zho\"\n"
          "                            iso3.isEmpty() -> latFall\n"
          "                            else -> iso3\n"
          "                        }\n"
          "                    } catch (_: Exception) { latFall }\n"
          "                }\n"
          "                if (stripped.isNotEmpty() && (forcedEng != null || forcedLoc != null)) {\n"
          "                    val chunk = TextChunk(stripped, baseLang, forcedEngine = forcedEng, forcedLocale = forcedLoc)\n"
          "                    if (forcedVariant != null && forcedEng != null && forcedLoc != null) {\n"
          "                        prefs.setVoiceName(baseLang, forcedVariant)\n"
          "                    }\n"
          "                    chunks.add(chunk)\n"
          "                    VhLogger.d(\"[SERVICE] [AutoTTS:] bypass eng=$forcedEng loc=$forcedLoc var=$forcedVariant\")\n"
          "                    bypassed = true\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "        // AutoTTS L mapping: L=0→auto, L=1→dual, L=2→auto, L=3→google, L=4→mix\n"
          "        // L=2 (google-secondary-disabled): per AutoTtsService line-1645 gate, L==2 ALWAYS runs\n"
          "        // CLD2 detection (like L==3) but — unlike L==3 — H()/K() are NOT forced to Google, so\n"
          "        // engine routing is per-config. That is exactly EasyVoice's \"auto\" (always-detect +\n"
          "        // normal engine routing), so L==2 → \"auto\" is an exact behavioral match (verified 2026-07-01).\n"
          "        val forceGoogle = isGoogleOnly || readingMode == \"google\"\n"
          "        val reqLang0 = request?.language ?: \"\"\n"
          "        val effectiveMode = when {\n"
          "            forceGoogle -> \"auto\"                                          // AutoTTS L=3: Google mode DETECTS like auto; engine forced to Google below\n"
          "            readingMode == \"none\" -> if (reqLang0.isEmpty() || reqLang0 == \"zxx\") \"auto\" else \"none\"  // AutoTTS L=0: detect when caller sends no language; use caller language when concrete\n"
          "            readingMode == \"auto\" || (readingMode == \"mix\" && reqLang0 == \"zxx\") -> \"auto\"\n"
          "            else -> readingMode\n"
          "        }\n"
          "        if (!bypassed) when (effectiveMode) {\n"
          "            \"none\" -> {\n"
          "                // AutoTTS None (L=0) with a CONCRETE caller language: use it directly, no CLD2\n"
          "                // (the zxx/unspecified case was routed to the auto-detect path via effectiveMode).\n"
          "                val noneLang = normalizeLangCode(request?.language ?: latFall)\n"
          "                chunks.add(TextChunk(rawText, noneLang))\n"
          "                VhLogger.d(\"[SERVICE] none mode — caller language=$noneLang (no detection)\")\n"
          "            }\n"
          "            // NOTE: there is no \"google\" case here. AutoTTS Google mode (L=3) DETECTS exactly\n"
          "            // like auto (H()/K() only differ by forcing the Google engine), so effectiveMode maps\n"
          "            // google → \"auto\" above; the auto (else) branch runs the full CLD2 detection and the\n"
          "            // forceGoogle post-pass below forces every detected chunk onto com.google.android.tts,\n"
          "            // keeping each chunk's detected language for the correct Google voice — exact L=3 parity.\n"
          "            \"mix\" -> {\n"
          "                // BUNDLE-Z ITEM 2: when locale_spans pref is ON, use TalkBack's pre-tagged\n"
          "                // LocaleSpan hints directly. This routes mixed-language content correctly\n"
          "                // for apps that properly tag spans (chat apps, document readers, reflowable\n"
          "                // EPUB readers, etc.). When OFF (default), fall through to the universal\n"
          "                // native character splitter — safer for apps that mis-tag spans (e.g. some\n"
          "                // versions of TalkBack tagging \"भेजें Button\" as entirely English).\n"
          "                var localeSpanHandled = false\n"
          "                if (useLocaleSpans) {\n"
          "                    val localeChunks = splitByLocaleSpans(rawCharSeq)\n"
          "                    if (localeChunks.isNotEmpty() && localeChunks.any { it.lang != \"UNKNOWN\" }) {\n"
          "                        // AutoTTS mix mode N=true: c3.x.g() chunks → known spans use locale directly;\n"
          "                        // UNKNOWN spans → c3.w.g(text,E,F,a0,W) = NativeEngine.processDirect(\"mix\").\n"
          "                        VhLogger.d(\"[SERVICE] mix mode: locale_spans path produced ${localeChunks.size} chunks\")\n"
          "                        val dictMap = cachedDictMap\n"
          "                        val neutralDefault = if (kfLocale() == prefs.toIso3(nonLatFall)) nonLatFall else latFall  // AutoTTS w.g n6: ISO3 compare (nonLatFall may be ISO2 from the dropdown)\n"
          "                        val disableAdvDet = prefs.getBoolean(\"disable_advanced_detection\", false)\n"
          "                        // AutoTTS mix (AutoTtsService.java:1795-1796): a KNOWN LocaleSpan whose engine\n"
          "                        // is empty/\\\"Disable\\\" falls back to C (auto_mode_language) — NOT the script-based\n"
          "                        // H/I mix languages. C is the single preferred language, exactly like auto mode.\n"
          "                        val autoModeC = normalizeLangCode(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { kfLocale() })\n"
          "                        val batched = mutableListOf<Pair<String, StringBuilder>>()\n"
          "                        for (lc in localeChunks) {\n"
          "                            if (lc.lang != \"UNKNOWN\" && lc.lang.isNotEmpty()) {\n"
          "                                // AutoTTS: known LocaleSpan lang — engine check via H(); fall to C if unavailable.\n"
          "                                val norm = normalizeLangCode(lc.lang)\n"
          "                                val resolved = if (isDedicated || ko(norm)) norm else autoModeC  // AutoTTS mix:1794 — H()==\"\"/\"Disable\" (not configured OR disabled) → C\n"
          "                                if (batched.isNotEmpty() && batched.last().first == resolved) batched.last().second.append(lc.text)\n"
          "                                else batched.add(resolved to StringBuilder(lc.text))\n"
          "                            } else {\n"
          "                                // AutoTTS: UNKNOWN span → c3.w.g(text, E, F, a0, W) = NativeEngine.processDirect(\"mix\")\n"
          "                                val tBytes = lc.text.toByteArray(Charsets.UTF_8)\n"
          "                                val tBuf = ByteBuffer.allocateDirect(tBytes.size)\n"
          "                                tBuf.put(tBytes); tBuf.position(0)\n"
          "                                val tOut = NativeEngine.processDirect(\n"
          "                                    tBuf, tBytes.size,\n"
          "                                    dictMap.keys.toTypedArray(), dictMap.values.toTypedArray(),\n"
          "                                    emojiReading, emojiCount, punctCount,\n"
          "                                    latFall, nonLatFall, \"mix\",\n"
          "                                    mixPuncLang, mixNumLang, mixEmojiLang,\n"
          "                                    neutralDefault, disableAdvDet\n"
          "                                )\n"
          "                                for (chunkStr in tOut.split(\"||\").filter { it.isNotBlank() }) {\n"
          "                                    val parts = chunkStr.split(\"|\", limit = 2)\n"
          "                                    if (parts.size == 2 && parts[0].isNotBlank() && parts[1].trim().isNotEmpty()) {\n"
          "                                        // OPTION B: faithful clsCLD2.b via detectLanguage() (ignore the C++ parts[0]).\n"

          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.auth.GoogleAuthProvider
          import org.json.JSONObject

          // Auth gate states
          private const val AUTH_LOADING = 0
          private const val AUTH_NEED_LOGIN = 1
          private const val AUTH_OK = 2
          private const val AUTH_DENIED = 3

          @Composable
          fun AuthGate(prefs: SharedPrefsManager, content: @Composable () -> Unit) {
              val context = LocalContext.current
              val auth = remember { FirebaseAuth.getInstance() }
              var state by remember { mutableStateOf(AUTH_LOADING) }
              var message by remember { mutableStateOf("") }

              val gso = remember {
                  GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                      .requestIdToken(context.getString(R.string.default_web_client_id))
                      .requestEmail()
                      .build()
              }
              val googleClient = remember { GoogleSignIn.getClient(context, gso) }

              fun signOut() {
                  prefs.setBoolean("auth_authorized", false)
                  auth.signOut()
                  googleClient.signOut()
              }

              fun verifyTester(email: String) {
                  val user = auth.currentUser ?: return run {
                      signOut(); message = "Session expired. Please sign in again."; state = AUTH_NEED_LOGIN
                  }
                  user.getIdToken(false).addOnSuccessListener { result ->
                      val token = result.token ?: return@addOnSuccessListener run {
                          signOut(); message = "Auth error. Please sign in again."; state = AUTH_NEED_LOGIN
                      }
                      val rtdbKey = email.replace(".", ",")
                      val encodedKey = rtdbKey.replace("@", "%40")
                      val url = "https://easy-voice-e53f0-default-rtdb.firebaseio.com/testers/$encodedKey/active.json?auth=$token"
                      val mainHandler = android.os.Handler(android.os.Looper.getMainLooper())
                      Thread {
                          try {
                              val conn = java.net.URL(url).openConnection() as java.net.HttpURLConnection
                              conn.connectTimeout = 10000
                              conn.readTimeout = 10000
                              val code = conn.responseCode
                              val body = if (code == 200) conn.inputStream.bufferedReader().readText().trim() else ""
                              val isActive = body == "true"
                              mainHandler.post {
                                  if (isActive) {
                                      prefs.setBoolean("auth_authorized", true)
                                      prefs.setString("auth_email", email)
                                      state = AUTH_OK
                                  } else if (body == "null" || code == 404 || code == 403) {
                                      signOut()
                                      message = "Access denied. Your account ($email) is not authorized."
                                      state = AUTH_DENIED
                                  } else {
                                      if (prefs.getBoolean("auth_authorized", false)) state = AUTH_OK
                                      else { message = "Server error ($code). Please try again."; state = AUTH_NEED_LOGIN }
                                  }
                              }
                          } catch (e: Exception) {
                              mainHandler.post {
                                  if (prefs.getBoolean("auth_authorized", false)) state = AUTH_OK
                                  else { message = "Network error. Please check connection."; state = AUTH_NEED_LOGIN }
                              }
                          }
                      }.start()
                  }.addOnFailureListener {
                      message = "Authentication error. Please sign in again."
                      state = AUTH_NEED_LOGIN
                  }
              }

              val launcher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  try {
                      val account = GoogleSignIn.getSignedInAccountFromIntent(result.data)
                          .getResult(ApiException::class.java)
                      val cred = GoogleAuthProvider.getCredential(account.idToken, null)
                      state = AUTH_LOADING
                      auth.signInWithCredential(cred).addOnCompleteListener { t ->
                          val email = auth.currentUser?.email
                          if (t.isSuccessful && email != null) {
                              verifyTester(email)
                          } else {
                              message = "Sign-in failed. Please try again."
                              state = AUTH_NEED_LOGIN
                          }
                      }
                  } catch (e: ApiException) {
                      message = if (e.statusCode == 12501) "" else "Google sign-in failed (code ${e.statusCode})."
                      state = AUTH_NEED_LOGIN
                  }
              }

              LaunchedEffect(Unit) {
                  val user = auth.currentUser
                  if (user?.email != null) {
                      if (prefs.getBoolean("auth_authorized", false)) state = AUTH_OK
                      verifyTester(user.email!!)
                  } else {
                      state = AUTH_NEED_LOGIN
                  }
              }

              when (state) {
                  AUTH_OK -> content()
                  AUTH_LOADING -> Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      CircularProgressIndicator()
                  }
                  else -> LoginScreen(
                      message = message,
                      denied = state == AUTH_DENIED,
                      onSignIn = { state = AUTH_LOADING; launcher.launch(googleClient.signInIntent) }
                  )
              }
          }

          @Composable
          private fun LoginScreen(message: String, denied: Boolean, onSignIn: () -> Unit) {
              Surface(Modifier.fillMaxSize()) {
                  Column(
                      modifier = Modifier.fillMaxSize().padding(32.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center
                  ) {
                      Text("Easy Voice", style = MaterialTheme.typography.headlineLarge)
                      Spacer(Modifier.height(8.dp))
                      Text(
                          "Sign in with your Google account to access the app.",
                          style = MaterialTheme.typography.bodyMedium,
                          textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(32.dp))
                      Button(onClick = onSignIn, modifier = Modifier.fillMaxWidth()) {
                          Text("Sign in with Google")
                      }
                      if (message.isNotBlank()) {
                          Spacer(Modifier.height(20.dp))
                          Text(
                              message,
                              color = if (denied) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.onSurfaceVariant,
                              style = MaterialTheme.typography.bodyMedium,
                              textAlign = TextAlign.Center
                          )
                      }
                      if (denied) {
                          Spacer(Modifier.height(16.dp))
                          OutlinedButton(onClick = onSignIn, modifier = Modifier.fillMaxWidth()) {
                              Text("Try a different account")
                          }
                      }
                  }
              }
          }
          """)


          w("app/src/main/java/com/tts/easyvoice/EasyVoiceLogger.kt",
          "package com.tts.easyvoice\n"
          "import android.content.Context\n"
          "import android.util.Log\n"
          "import java.io.File\n"
          "import java.io.FileWriter\n"
          "import java.io.IOException\n"
          "import java.text.SimpleDateFormat\n"
          "import java.util.Date\n"
          "import java.util.Locale\n"
          "object EasyVoiceLogger {\n"
          "    private const val TAG = \"EASYVOICE-NATIVE\"\n"
          "    private const val MAX_LOG_BYTES = 2L * 1024L * 1024L\n"
          "    private val sdf = SimpleDateFormat(\"yyyy-MM-dd HH:mm:ss.SSS\", Locale.US)\n"
          "    private var logFile: File? = null\n"
          "    private var appContext: Context? = null\n"
          "    @Volatile private var loggingEnabled = false\n"
          "    fun setLoggingEnabled(v: Boolean) { loggingEnabled = v }\n"
          "    fun init(ctx: Context) {\n"
          "        appContext = ctx.applicationContext\n"
          "        try { val dir = File(ctx.applicationContext.filesDir, \"logs\"); if (!dir.exists()) dir.mkdirs(); logFile = File(dir, \"easy_voice.log\") } catch (_: Exception) {}\n"
          "        write(\"I\", \"[LOGGER] EasyVoiceLogger initialized — device=${android.os.Build.MODEL} sdk=${android.os.Build.VERSION.SDK_INT} android=${android.os.Build.VERSION.RELEASE}\")\n"
          "    }\n"
          "    // AutoTTS c3.o.h(level, tag, msg), transcribed from smali (CFR could not decompile it):\n"
          "    //   DEBUG(0)/INFO(1) -> no logcat at all; WARN(2) -> Log.w; ERROR(3) -> Log.e.\n"
          "    //   The logcat call happens BEFORE the enabled check, so warnings and errors still\n"
          "    //   reach logcat while logging is off; only the file write is gated.\n"
          "    //   Then i() (rotate), then String.format(\"%s [%s] %s: %s\", ts, letter, tag, msg)\n"
          "    //   through a per-call BufferedWriter(FileWriter(file, true)), write + newLine + close.\n"
          "    //   IOException -> Log.e(\"TtsLogger\", \"Failed to write log\", e).\n"
          "    @Synchronized private fun write(level: String, msg: String) {\n"
          "        when (level) { \"E\" -> Log.e(TAG, msg); \"W\" -> Log.w(TAG, msg) }\n"
          "        if (!loggingEnabled) return\n"
          "        val f = logFile ?: return\n"
          "        rotate(f)\n"
          "        val line = String.format(\"%s [%s] %s: %s\", sdf.format(Date()), level, TAG, msg)\n"
          "        try {\n"
          "            java.io.BufferedWriter(FileWriter(f, true)).use { w -> w.write(line); w.newLine() }\n"
          "        } catch (e: IOException) { Log.e(\"TtsLogger\", \"Failed to write log\", e) }\n"
          "    }\n"
          "    // AutoTTS c3.o.i(): runs on every write; nothing happens below 2 MiB.\n"
          "    private fun rotate(f: File) {\n"
          "        if (!f.exists() || f.length() < MAX_LOG_BYTES) return\n"
          "        val parent = f.parent ?: return\n"
          "        File(parent, \"easy_voice.log.3\").let { if (it.exists()) it.delete() }\n"
          "        for (idx in 2 downTo 1) { val src = File(parent, \"easy_voice.log.$idx\"); if (src.exists()) src.renameTo(File(parent, \"easy_voice.log.${idx + 1}\")) }\n"
          "        f.renameTo(File(parent, \"easy_voice.log.1\"))\n"
          "    }\n"
          "    fun d(msg: String) = write(\"D\", msg)\n"
          "    fun w(msg: String) = write(\"W\", msg)\n"
          "    fun e(msg: String) = write(\"E\", msg)\n"
          "    fun i(msg: String) = write(\"I\", msg)\n"
          "    // AutoTTS c3.o.b(ctx): returns null when the file is absent or empty — that null is\n"
          "    // what makes o.k() show \"No log file to share\" instead of opening a chooser.\n"
          "    @Synchronized fun shareFileOrNull(): File? {\n"
          "        val f = logFile ?: return null\n"
          "        if (!f.exists() || f.length() == 0L) return null\n"
          "        return f\n"
          "    }\n"
          "    // AutoTTS c3.o.a(): if the file exists, truncate it with FileWriter(file, false).\n"
          "    // IOException -> Log.e(\"TtsLogger\", \"Failed to clear log\", e). Nothing else, no toast.\n"
          "    @Synchronized fun clear() {\n"
          "        val f = logFile ?: return\n"
          "        if (!f.exists()) return\n"
          "        try { FileWriter(f, false).close() } catch (e: IOException) { Log.e(\"TtsLogger\", \"Failed to clear log\", e) }\n"
          "    }\n"
          "}\n")


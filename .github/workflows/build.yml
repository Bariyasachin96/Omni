          "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
          "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n"
          "    <queries>\n"
          "        <intent><action android:name=\"android.intent.action.TTS_SERVICE\" /></intent>\n"
          "    </queries>\n"
          "    <!-- Foreground service keeps Omni alive even when Android tries to kill\n"
          "         long-running TTS services. MEDIA_PLAYBACK matches the original AutoTTS\n"
          "         choice — it's the Play-Store-standard foreground type for TTS apps,\n"
          "         no special-use review hassle, and integrates well with audio focus\n"
          "         + lock-screen controls. -->\n"
          "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n"
          "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />\n"
          "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n"
          "    <!-- WAKE_LOCK lets us survive Doze mode mid-synthesis on screen-off. -->\n"
          "    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n"

          "                VhLogger.d(\"[SERVICE] none mode — caller language=$noneLang (no detection)\")\n"
          "            }\n"
          "            // NOTE: there is no \"google\" case here. AutoTTS Google mode (L=3) DETECTS exactly\n"
          "            // like auto (H()/K() only differ by forcing the Google engine), so effectiveMode maps\n"
          "            // google → \"auto\" above; the auto (else) branch runs the full CLD2 detection and the\n"
          "            // forceGoogle post-pass below forces every detected chunk onto com.google.android.tts,\n"
          "            // keeping each chunk's detected language for the correct Google voice — exact L=3 parity.\n"

          extern "C" JNIEXPORT jobjectArray JNICALL
          Java_com_tts_easyvoice_NativeEngine_scriptLangFallbacks(JNIEnv* env, jclass, jstring jP){
              const char* pc=env->GetStringUTFChars(jP,nullptr); std::string p(pc); env->ReleaseStringUTFChars(jP,pc);
              std::vector<std::string> v = scriptLangFallbacksC(p);
              jclass sc=env->FindClass("java/lang/String");

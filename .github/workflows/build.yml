          "                val engineNames = missingEngines.map { \"Install ${EngineFinder.friendlyName(it)}\" }.toTypedArray()\n"
          "                android.app.AlertDialog.Builder(this)\n"
          "                    .setTitle(\"Missing TTS engines\")\n"
          "                    .setItems(engineNames) { _, which ->\n"
          "                        val pkg = missingEngines[which]\n"
          "                        try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(\"market://details?id=$pkg\")).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) }\n"
          "                        catch (_: Exception) { try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(\"https://play.google.com/store/apps/details?id=$pkg\")).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }) } catch (_: Exception) {} }\n"
          "                    }\n"
          "                    .setPositiveButton(\"Done & Restart\") { _, _ -> restartAfterImport() }\n"
          "                    .setCancelable(true)\n"
          "                    .show()\n"
          "            }\n"
          "        } catch (_: Exception) { Toast.makeText(this, \"Unable to load configuration. Please verify the file settings.\", Toast.LENGTH_LONG).show() }\n"
          "    }\n"
          "    override fun onCreate(savedInstanceState: Bundle?) {\n"
          "        super.onCreate(savedInstanceState)\n"
          "        val prefs = SharedPrefsManager(this)\n"
          "        testTts = android.speech.tts.TextToSpeech(this, null, \"com.tts.easyvoice\")\n"
          "        val themedContext = this\n"
          "        val matCtx = android.view.ContextThemeWrapper(this, com.google.android.material.R.style.Theme_MaterialComponents_DayNight_NoActionBar)\n"
          "        val pageTitles = listOf(\"Modes\", \"Languages\", \"Voices\", \"Advanced\", \"Licenses\")\n"

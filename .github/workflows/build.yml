          "    root.addView(testButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n"
          "    var persistSlider: (String, Int) -> Unit = { _, _ -> }\n"
          "    data class SliderRow(val bar: SeekBar, val prefSuffix: String)\n"
          "    val sliderRows = mutableListOf<SliderRow>()\n"
          "    // fragment_voices.xml @id/params: label TextView is fill_parent + gravity center with no\n"
          "    // padding; the row is fill_parent with no gravity; buttons are wrap_content with\n"
          "    // layout_gravity start/end; the SeekBar is 0dp weight 1, gravity center,\n"
          "    // layout_gravity center, secondaryProgress 0.\n"
          "    // fragment_voices.xml wraps the three groups in @id/params, a vertical LinearLayout\n"
          "    // with layout_marginStart=\"5dip\"; the rows go into THAT, not straight into root.\n"
          "    val paramsBox = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL }\n"
          "    root.addView(paramsBox, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { marginStart = dp(context, 5) })\n"
          "    fun addSliderRow(labelString: String, prefSuffix: String, maxValue: Int) {\n"
          "        paramsBox.addView(android.widget.TextView(context).apply { text = labelString; gravity = android.view.Gravity.CENTER },\n"
          "            LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n"
          "        val row = LinearLayout(context).apply { orientation = LinearLayout.HORIZONTAL }\n"
          "        val minusButton = android.widget.Button(context, null, android.R.attr.buttonStyleSmall).apply { text = \"-\"; contentDescription = \"Decrease \" + labelString.lowercase() }\n"
          "        val seekBar = SeekBar(context).apply { max = maxValue; secondaryProgress = 0; accessibilityLiveRegion = View.ACCESSIBILITY_LIVE_REGION_POLITE }\n"
          "        val plusButton = android.widget.Button(context, null, android.R.attr.buttonStyleSmall).apply { text = \"+\"; contentDescription = \"Increase \" + labelString.lowercase() }\n"
          "        row.addView(minusButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.START })\n"
          "        row.addView(seekBar, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply { gravity = android.view.Gravity.CENTER })\n"
          "        row.addView(plusButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.END })\n"
          "        paramsBox.addView(row, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n"
          "        sliderRows.add(SliderRow(seekBar, prefSuffix))\n"
          "        seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {\n"
          "            override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {\n"
          "                val clamped = if (progress < 10) 10 else progress\n"
          "                if (clamped != progress) seekBar.progress = clamped\n"
          "                persistSlider(prefSuffix, clamped)\n"
          "                if (android.os.Build.VERSION.SDK_INT >= 30) seekBar.stateDescription = \"$clamped of $maxValue\"\n"
          "            }\n"
          "            override fun onStartTrackingTouch(bar: SeekBar?) {}\n"
          "            override fun onStopTrackingTouch(bar: SeekBar?) {}\n"
          "        })\n"
          "        minusButton.setOnClickListener { val v = maxOf(10, seekBar.progress - 5); seekBar.progress = v; persistSlider(prefSuffix, v) }\n"
          "        plusButton.setOnClickListener { val v = minOf(maxValue, seekBar.progress + 5); seekBar.progress = v; persistSlider(prefSuffix, v) }\n"
          "    }\n"
          "    val defaultButton = android.widget.Button(context, null, android.R.attr.buttonStyleSmall).apply { text = \"Default\"; contentDescription = \"Default\" }\n"
          "    var languageCodes: List<String> = emptyList()\n"
          "    var selectedIso = \"\"\n"
          "    var voiceRows: List<EngineFinder.ScanVoice?> = emptyList()\n"
          "    var variantOptions: List<String> = emptyList()\n"
          "    // AutoTTS j.P1 and the six +/-5 buttons only write the in-memory c3.e — e.c speed,\n"
          "    // e.d volume, e.e pitch — behind `if (b1 >= 0 && b1 < m.c.size())`. Nothing here\n"
          "    // touches SharedPreferences; c3.m.y(ctx) is the only writer and it skips any value\n"
          "    // equal to 100, so a slider put back to 100 leaves the old number stored.\n"
          "    persistSlider = { prefSuffix, value ->\n"
          "        if (selectedIso.isNotEmpty()) {\n"
          "            val entry = LangStore.entryFor(prefs.toIso3(selectedIso))\n"
          "            if (entry != null) {\n"
          "                when (prefSuffix) {\n"
          "                    \"_speed\" -> entry.c = value\n"
          "                    \"_volume\" -> entry.d = value\n"
          "                    \"_pitch\" -> entry.e = value\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "    // AutoTTS j.O1 refreshes B0 (speed), then D0 (pitch), then C0 (volume), and hands the\n"
          "    // stored value straight to setProgress — SeekBar clamps it itself.\n"
          "    fun reloadSliders() {\n"
          "        if (selectedIso.isEmpty()) return\n"
          "        val entry = LangStore.entryFor(prefs.toIso3(selectedIso))\n"
          "        for (suffix in listOf(\"_speed\", \"_pitch\", \"_volume\")) {\n"
          "            val rowInfo = sliderRows.firstOrNull { it.prefSuffix == suffix } ?: continue\n"
          "            rowInfo.bar.progress = when (suffix) {\n"
          "                \"_speed\" -> entry?.c ?: 100\n"
          "                \"_pitch\" -> entry?.e ?: 100\n"
          "                else -> entry?.d ?: 100\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "    val rawPrefs = context.getSharedPreferences(\"easy_voice_settings\", Context.MODE_PRIVATE)\n"
          "    // AutoTTS reads w.e (in memory). It is seeded once per voice by c3.m.a() from\n"
          "    // c3.m.s(ctx, key) = Integer.parseInt(getString(key, \"1000\")); after that only\n"
          "    // c3.w.h() changes it. Fall back to prefs the first time a key is seen.\n"
          "    fun voiceOrder(key: String): Int {\n"
          "        EngineFinder.voiceWeights[key]?.let { return it }\n"
          "        val v = try { (rawPrefs.getString(key, \"1000\") ?: \"1000\").toInt() } catch (_: Exception) { 1000 }\n"
          "        EngineFinder.voiceWeights[key] = v\n"
          "        return v\n"
          "    }\n"
          "    fun voiceKey(row: EngineFinder.ScanVoice?): String = if (row == null) \"Disable#\" + Locale(selectedIso).toString() else row.pkg + \"#\" + row.locale.toString()\n"
          "    fun rowLabel(row: EngineFinder.ScanVoice?): String {\n"
          "        if (row == null) return \"*Disabled\"\n"
          "        val abbr = abbreviateEngineName(row.engineName)\n"
          "        return if (row.locale.country.isNotEmpty()) abbr + \", \" + row.locale.getDisplayCountry() else abbr\n"
          "    }\n"
          "    // AutoTTS j.Y2() variant half: nothing happens at all while m.e is empty (J0 keeps\n"
          "    // whatever adapter it had); m.e[0].d() == \"*Disabled\" -> J0.setAdapter(null);\n"
          "    // an empty m.c[b1].h is written back as \"\" before the list is built.\n"
          "    fun refreshVariantSpinner() {\n"
          "        if (voiceRows.isEmpty()) return\n"
          "        val sel = voiceRows[0]\n"
          "        if (sel == null) {\n"
          "            variantOptions = emptyList(); variantSpinner.adapter = null; return\n"
          "        }\n"
          "        val base = sel.variants.toList()\n"
          "        // Literal j.Y2: the array is sized at m.e[0].f.size(), the stored variant goes to\n"
          "        // slot 0 and every OTHER entry is appended after it, then Arrays.sort(arr, 1, n4-1)\n"
          "        // leaves both slot 0 and the last slot in place. When the stored variant is not in\n"
          "        // this voice's list the fill writes one past the end — AutoTTS throws there and O1\n"
          "        // does not catch it in the voice branch. Reproduced as-is; not \"fixed\".\n"
          "        val n4 = base.size\n"
          "        val arr = Array(n4) { \"\" }\n"
          "        // Y2 reads m.c.get(b1).h — the in-memory entry, not SharedPreferences — and when\n"
          "        // it is empty it writes \"\" back into that same entry before building the list.\n"
          "        val langEntry = LangStore.entryFor(prefs.toIso3(selectedIso))\n"
          "        var savedVariant = langEntry?.h ?: \"*Default\"\n"
          "        if (savedVariant.isEmpty()) { langEntry?.h = \"\"; savedVariant = \"\" }\n"
          "        if (savedVariant.isNotEmpty()) {\n"
          "            arr[0] = savedVariant\n"
          "            var n5 = 1\n"
          "            for (i3 in base.indices) { if (base[i3] != savedVariant) { arr[n5] = base[i3]; n5++ } }\n"
          "        } else {\n"
          "            for (n3 in base.indices) arr[n3] = base[n3]\n"
          "        }\n"
          "        if (n4 > 1) java.util.Arrays.sort(arr, 1, n4 - 1)\n"
          "        variantOptions = arr.toList()\n"
          "        val adapter = mediumSpinnerAdapter(context, variantOptions)\n"
          "        variantSpinner.adapter = adapter\n"
          "    }\n"
          "    fun rebuildVoiceSpinner() {\n"
          "        val adapter = mediumSpinnerAdapter(context, voiceRows.map { rowLabel(it) })\n"
          "        voiceSpinner.adapter = adapter\n"
          "    }\n"
          "    fun loadVoiceRows() {\n"
          "        if (selectedIso.isEmpty()) { voiceRows = emptyList(); return }\n"
          "        val all = EngineFinder.lastScanVoices.filter { EngineFinder.iso3Of(it.locale) == selectedIso }\n"
          "        val filtered = if (readingMode == \"google\") all.filter { it.pkg.equals(\"com.google.android.tts\", true) } else all\n"
          "        val rows = ArrayList<EngineFinder.ScanVoice?>(filtered)\n"
          "        val deviceLang = try { Locale.getDefault().language } catch (_: Exception) { \"en\" }\n"
          "        val autoModeC = prefs.toIso3(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { deviceLang })\n"
          "        val mixLatH = prefs.toIso3(prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { deviceLang })\n"
          "        val mixNonLatI = prefs.toIso3(prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { deviceLang })\n"
          "        // AutoTTS j.D2: two separate ifs —\n"
          "        //   if (O == 2 && !iso.equals(F))                              -> add the Disable row\n"
          "        //   if (!(O != 4 && O != 5 || iso.equals(K) || iso.equals(L))) -> add the Disable row\n"
          "        // i.e. Multilingual (O==5) gets it on the same terms as Mixed (O==4).\n"
          "        if (readingMode == \"auto\" && selectedIso != autoModeC) rows.add(null)\n"
          "        if ((readingMode == \"mix\" || readingMode == \"multilingual\") && selectedIso != mixLatH && selectedIso != mixNonLatI) rows.add(null)\n"
          "        fun effOrder(row: EngineFinder.ScanVoice?): Int = voiceOrder(voiceKey(row))\n"
          "        fun tieLabel(row: EngineFinder.ScanVoice?): String = if (row == null) \"*Disabled\" else abbreviateEngineName(row.engineName)\n"
          "        // Collections.sort(m.e) with c3.w.b as the comparator, literally:\n"
          "        //   if (this.e != w3.e) return this.e - w3.e;\n"
          "        //   return this.g().compareToIgnoreCase(w3.g());\n"
          "        // compareToIgnoreCase is NOT the same as comparing two lowercased strings —\n"
          "        // it folds each char through toUpperCase(toLowerCase(c)) — so it is named here.\n"
          "        voiceRows = rows.sortedWith(Comparator { rowA, rowB ->\n"
          "            val ea = effOrder(rowA); val eb = effOrder(rowB)\n"
          "            if (ea != eb) ea - eb else tieLabel(rowA).compareTo(tieLabel(rowB), ignoreCase = true)\n"
          "        })\n"
          "        // AutoTTS j.D2 tail: for (n3 = 0; n3 < m.e.size(); ++n3) m.e.get(n3).h(n3)\n"
          "        for ((i, row) in voiceRows.withIndex()) EngineFinder.voiceWeights[voiceKey(row)] = i\n"
          "    }\n"
          "    // AutoTTS c3.m.C(ctx): for (i3 = 0; i3 < m.e.size(); ++i3) m.B(ctx, m.e.get(i3), i3)\n"
          "    // AutoTTS c3.m.B(ctx, w3, n3): putString(w3.f(), String.valueOf(n3));\n"
          "    //                              if (n3 == 0) putString(m.f(w3.c), w3.f()); commit()\n"
          "    fun persistVoiceRows() {\n"
          "        if (voiceRows.isEmpty()) return\n"
          "        val ed = rawPrefs.edit()\n"
          "        for ((i, row) in voiceRows.withIndex()) {\n"
          "            ed.putString(voiceKey(row), i.toString())\n"
          "            if (i == 0) ed.putString(selectedIso, voiceKey(row))\n"
          "        }\n"
          "        ed.commit()\n"
          "    }\n"
          "    // AutoTTS j.O1 for the language spinner: b1 = pos; m.C(ctx); speed, pitch, volume;\n"
          "    // D2(iso) rebuilds the voice list; Y2() rebuilds both spinners; THEN the Test button\n"
          "    // is enabled from m.e.isEmpty() ? false : m.e[0].d != null.\n"
          "    fun onLanguageSelected(iso: String) {\n"
          "        persistVoiceRows()\n"
          "        selectedIso = iso\n"
          "        reloadSliders()\n"
          "        loadVoiceRows()\n"
          "        rebuildVoiceSpinner()\n"
          "        refreshVariantSpinner()\n"
          "        testButton.isEnabled = voiceRows.isNotEmpty() && voiceRows.firstOrNull() != null\n"
          "    }\n"
          "    languageSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "        override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {\n"
          "            // j.O1 wraps its whole spinner dispatch in try { } catch (Exception e) {\n"
          "            // e.printStackTrace(); return; } — the language branch, including Y2(), is inside it.\n"
          "            try {\n"
          "                if (position in languageCodes.indices) onLanguageSelected(languageCodes[position])\n"
          "            } catch (e: Exception) { e.printStackTrace() }\n"
          "        }\n"
          "        override fun onNothingSelected(parent: AdapterView<*>?) {}\n"
          "    }\n"
          "    voiceSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "        override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {\n"
          "            // j.O1: the voice branch's `if (n3 == 0) return;` sits INSIDE the try, but the\n"
          "            // `break block20` jumps out of it — the reorder loop, Collections.sort(m.e) and\n"
          "            // Y2() all run OUTSIDE the catch, so anything they throw propagates.\n"
          "            try {\n"
          "                if (selectedIso.isEmpty() || position !in voiceRows.indices) return\n"
          "                if (position == 0) return\n"
          "            } catch (e: Exception) { e.printStackTrace(); return }\n"
          "            val reordered = ArrayList<EngineFinder.ScanVoice?>(voiceRows)\n"
          "            val sel = reordered.removeAt(position)\n"
          "            reordered.add(0, sel)\n"
          "            voiceRows = reordered\n"
          "            // AutoTTS j.O1 voice branch: m.e[n3].h(0), every entry before n3 gets\n"
          "            // h(n4 + 1), entries after n3 keep the weight D2 gave them, then\n"
          "            // Collections.sort(m.e) — with D2-normalised weights that is this rotation.\n"
          "            for ((i, row) in voiceRows.withIndex()) EngineFinder.voiceWeights[voiceKey(row)] = i\n"
          "            val ed = rawPrefs.edit()\n"
          "            for ((i, row) in voiceRows.withIndex()) {\n"
          "                ed.putString(voiceKey(row), i.toString())\n"
          "                if (i == 0) ed.putString(selectedIso, voiceKey(row))\n"
          "            }\n"
          "            ed.commit()\n"
          "            testButton.isEnabled = sel != null\n"
          "            rebuildVoiceSpinner()\n"
          "            refreshVariantSpinner()\n"
          "        }\n"
          "        override fun onNothingSelected(parent: AdapterView<*>?) {}\n"
          "    }\n"
          "    variantSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "        override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {\n"
          "            // j.O1 id 2131230835, inside the try: m.c[b1].h = spinner.getSelectedItem(); m.y(ctx)\n"
          "            try {\n"
          "                if (selectedIso.isEmpty() || position !in variantOptions.indices) return\n"
          "                prefs.setVoiceName(selectedIso, variantOptions[position])\n"
          "                LangStore.entryFor(prefs.toIso3(selectedIso))?.h = variantOptions[position]\n"
          "                LangStore.persistLanguages(context)\n"
          "            } catch (e: Exception) { e.printStackTrace() }\n"
          "        }\n"
          "        override fun onNothingSelected(parent: AdapterView<*>?) {}\n"
          "    }\n"
          "    // AutoTTS j.W2(): bails when m.g is null, m.e is empty or m.e[0].d is null. Then\n"
          "    // pkg = m.e[0].d.b, loc = m.e[0].c (the voice's own Locale, not a re-parsed tag),\n"
          "    // variant = m.c[b1].h (the language entry's variant, in memory), and the sample is\n"
          "    // a0.a(m.f(loc)) — keyed on the iso3 of THAT locale. QUEUE_FLUSH, id \"AutoTTS_Test\".\n"
          "    testButton.setOnClickListener {\n"
          "        val testClient = testTtsProvider()\n"
          "        val row = voiceRows.firstOrNull()\n"
          "        if (testClient != null && row != null && selectedIso.isNotEmpty()) {\n"
          "            val voiceLocale = row.locale\n"
          "            val qualityTag = LangStore.entryFor(prefs.toIso3(selectedIso))?.h ?: \"\"\n"
          "            val sample = SampleTexts.get(EngineFinder.iso3Of(voiceLocale))\n"
          "            val spoken = if (sample.isEmpty())\n"
          "                \"Sorry. Sample text for language \" + (try { voiceLocale.getDisplayName(Locale(\"eng\")) } catch (_: Exception) { selectedIso }) + \" is missing.\"\n"
          "            else \"[EasyVoice:\" + row.pkg + \":\" + voiceLocale.toString() + \":\" + qualityTag + \"]\" + sample\n"
          "            testClient.speak(spoken, TextToSpeech.QUEUE_FLUSH, null, \"EasyVoice_Test\")\n"
          "        }\n"
          "    }\n"
          "    addSliderRow(\"Speed\", \"_speed\", 500)\n"
          "    addSliderRow(\"Volume\", \"_volume\", 100)\n"
          "    addSliderRow(\"Pitch\", \"_pitch\", 200)\n"
          "    root.addView(defaultButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.CENTER })\n"
          "    defaultButton.setOnClickListener {\n"
          "        // AutoTTS j.Z2(): W0 = U0 = V0 = 100, then in this order — m.c[b1].d = V0 and\n"
          "        // the volume SeekBar, m.c[b1].c = U0 and the speed SeekBar, m.c[b1].e = W0 and\n"
          "        // the pitch SeekBar. It does NOT persist, and because m.y skips 100 the old\n"
          "        // values stay in prefs until something else changes them.\n"
          "        if (selectedIso.isEmpty()) return@setOnClickListener\n"
          "        val entry = LangStore.entryFor(prefs.toIso3(selectedIso))\n"
          "        if (entry != null) entry.d = 100\n"
          "        sliderRows.firstOrNull { it.prefSuffix == \"_volume\" }?.bar?.progress = 100\n"
          "        if (entry != null) entry.c = 100\n"
          "        sliderRows.firstOrNull { it.prefSuffix == \"_speed\" }?.bar?.progress = 100\n"
          "        if (entry != null) entry.e = 100\n"
          "        sliderRows.firstOrNull { it.prefSuffix == \"_pitch\" }?.bar?.progress = 100\n"
          "    }\n"
          "    // <TextView wrap_content marginStart=5dip TextAppearance.Medium> — @string/experimental\n"
          "    root.addView(android.widget.TextView(context).apply {\n"
          "        text = \"Experimental\"\n"
          "        setTextAppearance(android.R.style.TextAppearance_Medium)\n"
          "    }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { marginStart = d5 })\n"
          "    // <CheckBox @id/dedicatedengines fill_parent marginStart=5dip checked=false>\n"
          "    val dedicatedBox = android.widget.CheckBox(context).apply {\n"
          "        text = \"Dedicated engines\"\n"
          "        isChecked = prefs.isDedicatedEnginesEnabled()\n"
          "        // AutoTTS j.V2: enabled for every mode except None (0) and Google (3)\n"
          "        isEnabled = readingMode != \"none\" && readingMode != \"google\"\n"
          "        setOnCheckedChangeListener { _, checked -> prefs.setDedicatedEnginesEnabled(checked) }\n"
          "    }\n"
          "    root.addView(dedicatedBox, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { marginStart = d5 })\n"
          "    addSmall(root, \"Only use this option if you have a dedicated TTS engine for each voice, and ensure no other apps are using them.\", 0)\n"
          "    fun applyLanguageList() {\n"
          "        val scan = EngineFinder.lastScanVoices\n"
          "        val byIso = LinkedHashMap<String, EngineFinder.ScanVoice>()\n"
          "        for (v in scan) { val iso3 = EngineFinder.iso3Of(v.locale); if (!byIso.containsKey(iso3)) byIso[iso3] = v }\n"
          "        val dualIso3 = prefs.toIso3(prefs.getString(\"dual_mode_language\", \"\").ifEmpty { Locale.getDefault().language })\n"
          "        // AutoTTS c3.m.n(): O==1 -> {G, \"eng\"}; O==2|3 -> {F}; O==4 -> {K, L}; else {}.\n"
          "        // c3.m.h() then re-enables any of those that is flagged disabled and, when it\n"
          "        // changed something, persists every _disabled flag with m.z(ctx).\n"
          "        run {\n"
          "            val deviceLang0 = try { Locale.getDefault().language } catch (_: Exception) { \"en\" }\n"
          "            val required: List<String> = when (readingMode) {\n"
          "                \"dual\" -> listOf(dualIso3, \"eng\")\n"
          "                \"auto\", \"google\" -> listOf(prefs.toIso3(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { deviceLang0 }))\n"
          "                \"mix\" -> listOf(prefs.toIso3(prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { deviceLang0 }),\n"
          "                                prefs.toIso3(prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { deviceLang0 }))\n"
          "                else -> emptyList()\n"
          "            }\n"
          "            for (iso3 in byIso.keys) {\n"
          "                if (prefs.isLanguageDisabled(iso3) && required.contains(iso3)) prefs.setLanguageDisabled(iso3, false)\n"
          "            }\n"
          "        }\n"
          "        val candidates: List<String> = when (readingMode) {\n"
          "            \"dual\" -> byIso.keys.filter { it == \"eng\" || it == dualIso3 }\n"
          "            \"google\" -> byIso.keys.filter { iso3 -> !prefs.isLanguageDisabled(iso3) && scan.any { it.pkg.equals(\"com.google.android.tts\", true) && EngineFinder.iso3Of(it.locale) == iso3 } }\n"
          "            else -> byIso.keys.filter { !prefs.isLanguageDisabled(it) }\n"
          "        }\n"
          "        fun disp(iso3: String): String = try { byIso[iso3]?.locale?.getDisplayLanguage()?.ifEmpty { null } ?: displayNameFor(iso3) } catch (_: Exception) { displayNameFor(iso3) }\n"
          "        val collator = java.text.Collator.getInstance()\n"
          "        languageCodes = candidates.sortedWith { a, b -> collator.compare(collatorSortKey(disp(a)), collatorSortKey(disp(b))) }\n"
          "        val labels = languageCodes.map { disp(it) + \" (\" + it + \")\" }\n"
          "        val adapter = mediumSpinnerAdapter(context, labels)\n"
          "        languageSpinner.adapter = adapter\n"
          "    }\n"
          "    applyLanguageList()\n"
          "    return scroll\n"
          "}\n"
          )

          w("app/src/main/java/com/tts/easyvoice/MainActivity.kt",
          "package com.tts.easyvoice\n"

          "            prefs.edit().putBoolean(\"strip_audio_attr\", merged).remove(\"broken_engine_protector\").apply()\n"
          "        }\n"
          "        return prefs.getBoolean(\"strip_audio_attr\", false)\n"
          "    }\n"
          "    fun setStripAudioAttr(v: Boolean) = prefs.edit().putBoolean(\"strip_audio_attr\", v).remove(\"broken_engine_protector\").apply()  // AutoTTS key\n"

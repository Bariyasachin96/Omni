          "// Exact port of fragment_advanced.xml + c3.j.R2(). The XML root is a plain vertical\n"
          "// LinearLayout with NO padding inside a fillViewport ScrollView; every gap comes from\n"
          "// the per-child margins reproduced below.\n"
          "fun buildAdvancedTabView(context: Context, prefs: SharedPrefsManager, requestNotificationPermission: () -> Unit, launchImportPicker: () -> Unit): View {\n"
          "    val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL }\n"
          "    val scroll = ScrollView(context).apply { isFillViewport = true; addView(root) }\n"
          "    fun fullWidthButton(label: String, onClick: () -> Unit): Button = android.widget.Button(context).apply {\n"
          "        text = label\n"
          "        setOnClickListener { onClick() }\n"
          "    }\n"
          "    // <LinearLayout gravity=start background=#ff293842 fill_parent/wrap_content [marginTop=16dip]>\n"
          "    //   <TextView textSize=18sp textColor=#ffffffff gravity=center_vertical margin=5dip/>\n"
          "    fun advHeader(text: String, topDp: Int) {\n"
          "        val bar = LinearLayout(context).apply { gravity = android.view.Gravity.START; setBackgroundColor(0xff293842.toInt()) }\n"
          "        bar.addView(android.widget.TextView(context).apply {\n"
          "            this.text = text\n"
          "            setTextSize(android.util.TypedValue.COMPLEX_UNIT_SP, 18f)\n"
          "            setTextColor(0xffffffff.toInt())\n"
          "            gravity = android.view.Gravity.CENTER_VERTICAL\n"
          "        }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {\n"
          "            val m = dpToPx(context, 5); topMargin = m; bottomMargin = m; marginStart = m; marginEnd = m\n"
          "        })\n"
          "        root.addView(bar, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dpToPx(context, topDp) })\n"
          "    }\n"
          "    // <TextView gravity=start fill_parent/wrap_content TextAppearance.Small marginStart=5dip [marginEnd=5dip] [marginTop]>\n"
          "    fun advDesc(text: String, topDp: Int = 0, endMargin: Boolean = true) {\n"
          "        root.addView(android.widget.TextView(context).apply {\n"
          "            this.text = text\n"
          "            gravity = android.view.Gravity.START\n"
          "            setTextAppearance(android.R.style.TextAppearance_Small)\n"
          "        }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {\n"
          "            marginStart = dpToPx(context, 5)\n"
          "            if (endMargin) marginEnd = dpToPx(context, 5)\n"
          "            topMargin = dpToPx(context, topDp)\n"
          "        })\n"
          "    }\n"
          "    // <CheckBox fill_parent/wrap_content marginTop=10dip marginStart=5dip marginEnd=5dip TextAppearance.Medium>\n"
          "    fun advCheck(label: String, initial: Boolean, onChange: (Boolean) -> Unit): CheckBox {\n"
          "        val box = CheckBox(context).apply {\n"
          "            text = label\n"
          "            setTextAppearance(android.R.style.TextAppearance_Medium)\n"
          "            isChecked = initial\n"
          "            setOnCheckedChangeListener { _, checked -> onChange(checked) }\n"
          "        }\n"
          "        root.addView(box, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {\n"
          "            topMargin = dpToPx(context, 10); marginStart = dpToPx(context, 5); marginEnd = dpToPx(context, 5)\n"
          "        })\n"
          "        return box\n"
          "    }\n"
          "    // <LinearLayout horizontal fill_parent/wrap_content marginTop=16dip marginBottom=8dip marginStart=5dip marginEnd=5dip>\n"
          "    fun advRow(): LinearLayout {\n"
          "        val row = LinearLayout(context).apply { orientation = LinearLayout.HORIZONTAL }\n"
          "        root.addView(row, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {\n"
          "            val m = dpToPx(context, 5); topMargin = dpToPx(context, 16); bottomMargin = dpToPx(context, 8); marginStart = m; marginEnd = m\n"
          "        })\n"
          "        return row\n"
          "    }\n"
          "    advHeader(\"Advanced Synthesis Options\", 0)\n"
          "    advDesc(\"On certain devices (such as Oppo, OnePlus, and Realme), the accessibility audio stream is strictly restricted to designated accessibility apps. Enabling below options allows Easy Voice to function correctly.\", 10, endMargin = false)\n"
          "    advCheck(\"Remove audio attributes from synthesis request.\", prefs.isStripAudioAttr()) { prefs.setStripAudioAttr(it) }\n"
          "    advDesc(\"Strip audio attributes when sending synthesis requests to third-party TTS engines. This is enabled automatically if Easy Voice detects an accessibility audio stream error, but you can also toggle it manually.\")\n"
          "    advCheck(\"Force to use audio accessibility stream\", prefs.isForceAccessibilityStream()) { prefs.setForceAccessibilityStream(it) }\n"
          "    advDesc(\"Route TTS audio output through the accessibility audio stream.\")\n"
          "    advHeader(\"Keep-alive Mode\", 16)\n"
          "    advCheck(\"Keep alive\", prefs.isKeepAliveMode()) { prefs.setKeepAliveMode(it) }\n"
          "    advDesc(\"On certain devices, the system may terminate active voice synthesis sessions. Enabling this option prevents interruptions to third-party TTS engines. If you frequently notice speech cutting off mid-sentence, turn this on.\")\n"
          "    advHeader(\"Persistence Options\", 16)\n"
          "    // AutoTTS j$r0: V = bl; if (bl) P2() — P2 asks for POST_NOTIFICATIONS on API 33+.\n"
          "    advCheck(\"Show persistent notification\", prefs.isShowNotification()) { checked ->\n"
          "        prefs.setShowNotification(checked)\n"
          "        if (checked) requestNotificationPermission()\n"
          "    }\n"
          "    advDesc(\"Use a foreground service and to keep Easy Voice running during battery optimization or screen-off states.\")\n"
          "    // AutoTTS j.O2(): no SDK gate and no intent flags — the fragment's own Activity starts it.\n"
          "    root.addView(fullWidthButton(\"Disable battery optimization\") {\n"
          "        val powerManager = context.getSystemService(Context.POWER_SERVICE) as PowerManager\n"
          "        if (!powerManager.isIgnoringBatteryOptimizations(context.packageName)) {\n"
          "            try {\n"
          "                context.startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))\n"
          "                Toast.makeText(context, \"Find Easy Voice & all third-party tts engines and select 'Unrestricted'\", Toast.LENGTH_LONG).show()\n"
          "            } catch (_: Exception) { Toast.makeText(context, \"Failed to open battery settings\", Toast.LENGTH_LONG).show() }\n"
          "        }\n"
          "    }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.CENTER_HORIZONTAL })\n"
          "    advDesc(\"Request battery optimization exemptions for both Easy Voice and all associated third-party TTS engines to ensure uninterrupted performance.\")\n"
          "    advHeader(\"Language Detection Options\", 16)\n"
          "    // AutoTTS c3.j.R2() wires these two rows to ONE view. It resolves R.id.quick_character_reading\n"
          "    // into a register, immediately overwrites that register with AutoTtsService.X, and then calls\n"
          "    // setChecked(X) + setOnCheckedChangeListener(j\\$v0) on the *disable_advanced_detect* CheckBox —\n"
          "    // replacing the j\\$u0 (W) listener it had just been given. Net effect in AutoTTS:\n"
          "    //   row 1 (\"Disable advanced language detection\") shows and toggles quick_character_reading (X)\n"
          "    //   row 2 (\"Quick character read\") gets no setChecked and no listener — inert, always unchecked\n"
          "    //   disable_advanced_detection (W) is unreachable from the UI and keeps its stored value\n"
          "    advCheck(\"Disable advanced language detection\", prefs.isQuickCharacterReading()) { prefs.setQuickCharacterReading(it) }\n"
          "    advDesc(\"Turn off advanced language detection for better performance.\")\n"
          "    advCheck(\"Quick character read\", false) { }\n"
          "    advDesc(\"Reads a single character based on the preferred language in the mode settings.\")\n"
          "    // Easy Voice only — no AutoTTS counterpart, kept by explicit user decision.\n"
          "    advCheck(\"Use CLD3 (neural language detection)\", prefs.isUseCld3()) { prefs.setUseCld3(it) }\n"
          "    advDesc(\"Use the CLD3 neural network detector instead of CLD2. Can be more accurate on short or mixed text, but uses more battery. Off = CLD2 (default).\")\n"
          "    advHeader(\"Import/Export Configuration\", 16)\n"
          "    val importExportRow = advRow()\n"
          "    // AutoTTS j.L2(): OpenDocument picker over {\"text/xml\", \"application/xml\"}.\n"
          "    importExportRow.addView(fullWidthButton(\"Import\") { launchImportPicker() }, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply { marginEnd = dpToPx(context, 4) })\n"
          "    // AutoTTS c3.b0.d(ctx): missing file -> toast + return; copy failure -> printStackTrace\n"
          "    // and return silently; only then the FileProvider uri, ACTION_SEND text/xml with\n"
          "    // FLAG_GRANT_READ_URI_PERMISSION, and a \"Share Settings\" chooser with no extra flags.\n"
          "    importExportRow.addView(fullWidthButton(\"Export\") {\n"
          "        if (!prefs.settingsXmlFile().exists()) {\n"
          "            Toast.makeText(context, \"Settings file not found\", Toast.LENGTH_SHORT).show()\n"
          "            return@fullWidthButton\n"
          "        }\n"
          "        val exportFile = try { prefs.exportSettingsFile() } catch (e: java.io.IOException) { e.printStackTrace(); return@fullWidthButton }\n"
          "        val uri = FileProvider.getUriForFile(context, context.packageName + \".fileprovider\", exportFile)\n"
          "        context.startActivity(Intent.createChooser(Intent(Intent.ACTION_SEND).apply { type = \"text/xml\"; putExtra(Intent.EXTRA_STREAM, uri); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION) }, \"Share Settings\"))\n"
          "    }, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply { marginStart = dpToPx(context, 4) })\n"
          "    advDesc(\"When importing settings, Easy Voice only checks if required third-party TTS engines are available. You must manually ensure that specific voices used in your configuration are installed and ready to use.\")\n"
          "    advHeader(\"Logging\", 16)\n"
          "    // AutoTTS c3.h -> j.F1 -> o.j(bl): in-memory flag plus putBoolean(\"logging_enabled\", bl).\n"
          "    advCheck(\"Enable logging\", prefs.isLoggingEnabled()) { checked ->\n"
          "        prefs.setLoggingEnabled(checked)\n"
          "        EasyVoiceLogger.setLoggingEnabled(checked)\n"
          "    }\n"
          "    advDesc(\"Enable logging to help troubleshoot issues. If you need support or want to report a problem, please attach log files to your message.\")\n"
          "    val logButtonRow = advRow()\n"
          "    // AutoTTS c3.o.k(ctx): b(ctx) returns null for a missing or empty log -> toast and\n"
          "    // return. Otherwise ACTION_SEND text/plain with the subject and FLAG_GRANT_READ_URI_\n"
          "    // PERMISSION, and FLAG_ACTIVITY_NEW_TASK goes on the CHOOSER, not on the send intent.\n"
          "    logButtonRow.addView(fullWidthButton(\"Share logs\") {\n"
          "        val logFile = EasyVoiceLogger.shareFileOrNull()\n"
          "        if (logFile == null) {\n"
          "            Toast.makeText(context, \"No log file to share\", Toast.LENGTH_SHORT).show()\n"
          "            return@fullWidthButton\n"
          "        }\n"
          "        val uri = FileProvider.getUriForFile(context, context.packageName + \".fileprovider\", logFile)\n"
          "        val send = Intent(Intent.ACTION_SEND).apply { type = \"text/plain\"; putExtra(Intent.EXTRA_STREAM, uri); putExtra(Intent.EXTRA_SUBJECT, \"Easy Voice Log\"); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION) }\n"
          "        val chooser = Intent.createChooser(send, \"Share Easy Voice Log\")\n"

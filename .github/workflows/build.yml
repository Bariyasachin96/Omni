          "        ToggleRow(\"All Languages Mode\", \"CLD2 can detect and route ANY language even if no engine is configured for it — useful when a single engine (e.g. Google TTS) handles multiple languages automatically.\", allLangMode) { allLangMode = it; prefs.setAllLanguagesMode(it) }\n"
          "        Spacer(modifier = Modifier.height(16.dp))\n"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Restore Keystore
        run: |
          KSBASE64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -z "$KSBASE64" ]; then
            KSBASE64=""
          fi
          printf '%s' "$KSBASE64" | base64 -d > easyvoice-release.keystore
          echo "Keystore ready" 
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'sachin1211' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sachin' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sachin1211' }}

      - name: Publish APK to GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Easy Voice build #${{ github.run_number }}
          body: |
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK (when no release is published)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: easy-voice-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      # mapping.txt must never ship publicly - it undoes the obfuscation.
      # Kept as a repo-private build artifact so only we can retrace a crash.
      - name: Upload R8 mapping (private)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

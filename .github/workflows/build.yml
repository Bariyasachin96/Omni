          "            \"mix\" -> { fe.add(norm(prefs.getString(\"mixed_mode_latin_language\", \"\"))); fe.add(norm(prefs.getString(\"mixed_mode_non_latin_language\", \"\"))) }\n"
          "        }\n"
          "        fe\n"
          "    }\n"
          "    fun isForceEnabled(code: String) = prefs.toIso3(code) in forceEnabledIso3\n"
          "    // AutoTTS M2: checkbox = !d.i; a force-enabled (k.n) language is always kept checked.\n"
          "    var checkedSet by remember(scannedLangs, forceEnabledIso3) { mutableStateOf(scannedLangs.filter { !prefs.isLanguageDisabled(it) || isForceEnabled(it) }.toSet()) }\n"
          "    // AutoTTS parity: list is built PURELY from languages that installed TTS engines report\n"
          "    // (no static/hardcoded list). Display name uses friendly map when known, else Locale.\n"
          "    val entries = remember(scannedLangs) {\n"
          "        val codes = LinkedHashSet<String>()\n"
          "        codes.addAll(scannedLangs)\n"
          "        val col = java.text.Collator.getInstance()\n"
          "        codes.map { code ->\n"
          "            val name = Languages.map[code] ?: run {\n"
          "                val dn = try { java.util.Locale(code).displayLanguage } catch (_: Exception) { \"\" }\n"
          "                if (dn.isNotBlank() && dn != code) dn else code.uppercase()\n"
          "            }\n"
          "            Pair(code, \"$name ($code)\")\n"
          "        }.sortedWith { a, b ->\n"
          "            val nA = java.text.Normalizer.normalize(a.second, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "            val nB = java.text.Normalizer.normalize(b.second, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "            col.compare(nA, nB)\n"
          "        }\n"
          "    }\n"
          "    Column(modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 12.dp)) {\n"
          "        Text(\"Select languages\", style = MaterialTheme.typography.headlineSmall, modifier = Modifier.semantics { heading() })\n"
          "        Text(\"Select all languages you'd like to work with.\", style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "        Spacer(modifier = Modifier.height(4.dp))\n"
          "        // AutoTTS languages fragment note (string): the list is limited to engine-supported languages.\n"
          "        Text(\"Noted that below list contains only languages supported by TTS engines on your device.\", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n"
          "        Spacer(modifier = Modifier.height(12.dp))\n"
          "        OutlinedTextField(\n"
          "            value = searchQuery,\n"
          "            onValueChange = { searchQuery = it },\n"
          "            label = { Text(\"Search languages\") },\n"
          "            leadingIcon = { Icon(Icons.Filled.Search, contentDescription = null) },\n"
          "            trailingIcon = { if (searchQuery.isNotEmpty()) IconButton(onClick = { searchQuery = \"\" }) { Icon(Icons.Filled.Clear, contentDescription = \"Clear search\") } },\n"
          "            modifier = Modifier.fillMaxWidth(),\n"
          "            singleLine = true\n"
          "        )\n"
          "        Spacer(modifier = Modifier.height(8.dp))\n"
          "        Row(modifier = Modifier.fillMaxWidth()) {\n"
          "            TextButton(onClick = { entries.forEach { prefs.setLanguageDisabled(it.first, false) }; checkedSet = entries.map { it.first }.toSet() }) { Text(\"Select all\") }\n"
          "            Spacer(modifier = Modifier.width(8.dp))\n"
          "            TextButton(onClick = { entries.forEach { prefs.setLanguageDisabled(it.first, !isForceEnabled(it.first)) }; checkedSet = entries.map { it.first }.filter { isForceEnabled(it) }.toSet() }) { Text(\"Clear all\") }  // AutoTTS button 0x7f080094 label = clear_all \"Clear all\" (force-enabled langs stay checked, others disabled)\n"
          "            Spacer(modifier = Modifier.weight(1f))\n"
          "            TextButton(onClick = { showSelectedOnly = !showSelectedOnly }) { Text(if (showSelectedOnly) \"Show all\" else \"Show selected\") }\n"
          "        }\n"
          "        Spacer(modifier = Modifier.height(4.dp))\n"
          "        if (scanning && entries.isEmpty()) {\n"
          "            Text(\"Loading languages…\", modifier = Modifier.padding(vertical = 16.dp).semantics { liveRegion = LiveRegionMode.Polite }, style = MaterialTheme.typography.bodyLarge)\n"
          "        } else if (entries.isEmpty()) {\n"

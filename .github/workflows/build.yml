              static const char* GLS_FIXED[19] = {
                  "el",  // 7  Greek
                  "hy",  // 8  Armenian
                  "iw",  // 9  Hebrew   (CLD2 spells Hebrew "iw", not "he")
                  "ka",  // 10 Georgian
                  "pa",  // 11 Gurmukhi
                  "gu",  // 12 Gujarati
                  "or",  // 13 Oriya
                  "ta",  // 14 Tamil
                  "te",  // 15 Telugu
                  "kn",  // 16 Kannada
                  "ml",  // 17 Malayalam
                  "si",  // 18 Sinhala
                  "th",  // 19 Thai
                  "lo",  // 20 Lao
                  "bo",  // 21 Tibetan
                  "my",  // 22 Myanmar
                  "km",  // 23 Khmer
                  "am",  // 24 Ethiopic
                  "ko"   // 25 Hangul

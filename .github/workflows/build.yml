name: Build Easy Voice Native
on:
  push:
    branches: ["main", "master"]
  # No inputs. A dispatch through the API does not reliably apply a declared
  # input default -- run 730 skipped the release step for exactly that reason
  # and left only the R8 mapping to download -- so publishing is unconditional.
  workflow_dispatch:
# ACTION MAJORS, AND WHY THEY MOVED TOGETHER (2026-09-10).
# checkout, setup-java, upload-artifact and action-gh-release v2/v4 all run on
# the Node 20 runtime GitHub has DEPRECATED -- action-gh-release's own README
# says v2 "is no longer maintained or supported. It uses the Node 20 runtime
# deprecated by GitHub Actions", and that is the step that publishes the APK.
# This is a deadline rather than a preference: when the runtime is switched off,
# the build stops producing anything.
#
# Every input this workflow passes was checked against each action's own README
# before bumping, rather than assumed:
#   gradle/actions/setup-gradle v3 -> v6   gradle-version and cache-disabled survive
#   softprops/action-gh-release  v2 -> v3   tag_name/name/body/files/make_latest/
#                                           fail_on_unmatched_files unchanged, and
#                                           token defaults to github.token
#   actions/checkout             v4 -> v7   no inputs passed here at all
#   actions/setup-java           v4 -> v6   java-version and distribution unchanged
#   actions/upload-artifact      v4 -> v7   name/path/retention-days/if-no-files-found
#   android-actions/setup-android v3 -> v4  the one real risk was the cmdline-tools
#                                           path, closed by resolving sdkmanager
#                                           from PATH. It takes ONE input now --
#                                           `packages` -- because its default asks
#                                           for a package Google has deleted; the
#                                           reasoning is at the step itself.
# reactivecircus/android-emulator-runner is ALREADY current at v2 (2.38.0) and is
# deliberately untouched.
jobs:
  build:
    runs-on: ubuntu-latest
    # Does NOT wait for the profile job (owner, 2026-10-14) -- see the profile
    # step below. actions: read lets it fetch the profile an earlier run made.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          # 21, the JDK Android Studio runs Gradle with and the local checks use.
          # AGP 9 needs 17 or newer; the app's bytecode target is the build's
          # compileOptions, not this.
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Command-line tools 23.0 (build 16111833, the current stable). They
          # carry the Android CLI, `android`, which tools/ci/install-sdk.sh
          # installs the NDK, CMake and build-tools with; from 23.0 sdkmanager
          # calls itself deprecated ("'android sdk' is the replacement for
          # 'sdkmanager'"). The action puts their bin/ on the PATH.
          cmdline-tools-version: '16111833'
          # platform-tools only: the emulator jobs need adb. The action's own
          # default once asked for the `tools` package Google has deleted, which
          # is what took builds down at this step in run 876.
          packages: platform-tools

      # The versions are the version catalog's (gradle/libs.versions.toml), and the
      # script fails HERE if a package never lands -- see tools/ci/install-sdk.sh.
      - name: Install NDK, CMake and build-tools
        timeout-minutes: 20
        run: bash tools/ci/install-sdk.sh
        env:
          EV_SDK_ATTEMPTS: '5'

      # Run 738 sat on this step for 33 minutes -- it normally takes 45 seconds --
      # because a clone hung with no timeout to kill it. Each fetch now gets its
      # own timeout and three tries, and the step as a whole fails fast instead
      # of burning the job's 6-hour budget.
      - name: Clone the CLD2 Native Library
        timeout-minutes: 12
        run: bash tools/ci/clone-cld2.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # No gradle-version: the build runs the project's own Gradle Wrapper
          # (./gradlew, through tools/ci/gradle-retry.sh), which pins the Gradle
          # version and its SHA-256 in gradle/wrapper/gradle-wrapper.properties,
          # and this action validates the wrapper jar against Gradle's own
          # published checksums before anything runs.
          #
          # cache-disabled STAYS TRUE (measured, 2026-09-10): setup-gradle writes
          # its cache only on the default branch, and every run here is a
          # workflow_dispatch on a feature branch, so a cache would never be
          # written and never be found.
          cache-disabled: true

      # THE OWNER'S RELEASE KEY (2026-10-14: "aage se ... sabhi file ko naya wala
      # keyStore se"): alias sachin, CN=Sachin Baria, certificate SHA-256
      # 1E:37:9A:EF:...:E0:B6:81:9B. It lives here, as the previous key did, not
      # in a repository secret, by the owner's choice -- and nothing reads a
      # secret for it any more, so an old secret cannot sign with the old key.
      # "Check the release signature" proves every published file carries it.
      - name: Restore Keystore
        run: |
          printf '%s' "" | base64 -d > easyvoice-release.keystore
          echo "Keystore ready"
      # THE RELEASE NO LONGER WAITS FOR THE PROFILE JOB (owner, 2026-10-14).
      # Build 971's APK waited 41 minutes for it (11 to compile, 30 on the
      # emulator) and then the profile could not even be uploaded (storage
      # quota). The profile job runs BESIDE this one now, and its profile goes
      # into the NEXT build: a baseline profile names classes and methods, so
      # one made a build earlier still applies, and an entry for a method that
      # has since changed is simply ignored. With no earlier profile kept, the
      # APK ships the hand-written profiles only, as it always could.
      - name: Use the newest generated baseline profile
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.name | startswith("baseline-profile-"))]
                  | sort_by(.created_at) | last | select(. != null) | "\(.workflow_run.id) \(.name)"') || found=""
          if [ -n "$found" ]; then
            set -- $found
            gh run download "$1" -R "$GITHUB_REPOSITORY" -n "$2" -D app/src/main/generated/baselineProfiles/ \
              && echo "EV_PROFILE_FROM=$2" >> "$GITHUB_ENV"
          else
            echo "no generated baseline profile is kept from an earlier run"
          fi
      - name: Say whether the generated profile is in
        run: |
          if ls app/src/main/generated/baselineProfiles/*.txt >/dev/null 2>&1; then
            wc -l app/src/main/generated/baselineProfiles/*.txt
            echo "EV_PROFILE=generated on the emulator (${EV_PROFILE_FROM:-an earlier run}) and compiled in" >> "$GITHUB_ENV"
          else
            echo "::warning::no generated baseline profile; shipping the hand-written one only"
            echo "EV_PROFILE=hand-written only (no earlier run left a generated one)" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        # tools/ci/gradle-retry.sh, not an inline function: this same retry was
        # written inline first and broke the accessibility job, because the
        # emulator action runs its script with /usr/bin/sh (dash) one line at a
        # time and `set -o pipefail` is not POSIX. A file with its own shebang
        # runs under bash whatever the caller is, and the caller's line stays
        # self-contained. It retries ONLY a transient repository failure; a real
        # compile error exits on the first attempt.
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash tools/ci/gradle-retry.sh assembleRelease -PevAbiSplit
        env:
          # Read by defaultConfig.versionCode, so the Advanced tab's "Build number"
          # is this run's number rather than a frozen 1.
          EV_BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: sachin96
          KEY_ALIAS: sachin
          KEY_PASSWORD: sachin96

      # THE ANDROID APP BUNDLE, the format Google Play takes (2026-10-13: the
      # owner is preparing the Play listing, and Play accepts new apps only as
      # bundles). Its OWN Gradle run, without -PevAbiSplit: AGP cannot shrink
      # resources for a bundle while ABI splits are on ("Multiple shrunk-
      # resources files found", measured), and a bundle needs no splits --
      # Play makes the per-phone APKs from it. The build cache from the step
      # above is reused, so this costs about three minutes.
      - name: Build the Play bundle
        run: bash tools/ci/gradle-retry.sh bundleRelease
        env:
          EV_BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: sachin96
          KEY_ALIAS: sachin
          KEY_PASSWORD: sachin96

      # Every build ships the same way: clearly named APKs on the release page.
      # "app-release.apk" collided in the Downloads folder and was hard to tell
      # apart from the mapping artifact.
      #
      # -PevAbiSplit turns on the ABI split, so the release variant now produces
      # THREE files instead of one (there is no app-release.apk any more):
      #
      #   EasyVoice-<n>.apk              the universal build, every ABI --
      #                                  the SAME NAME it has always had, so a
      #                                  bookmark or a habit still works
      #   EasyVoice-<n>-arm64-v8a.apk    64-bit, which is every phone since
      #                                  about 2015 -- roughly HALF the size
      #   EasyVoice-<n>-armeabi-v7a.apk  32-bit-only phones
      #
      # The universal one stays first and stays the safe answer; the other two
      # are there for anyone who wants the smaller download. Nothing is dropped
      # -- a device that could install build 859 can install one of these.
      - name: Name the APKs after the build
        run: |
          set -e
          out=app/build/outputs/apk/release
          ls -l "$out"
          cp "$out/app-universal-release.apk"    "EasyVoice-${{ github.run_number }}.apk"
          cp "$out/app-arm64-v8a-release.apk"    "EasyVoice-${{ github.run_number }}-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk"  "EasyVoice-${{ github.run_number }}-armeabi-v7a.apk"
          # Each APK's v4 signature (2026-10-14: every scheme, v1 to v4) is the
          # file beside it, <apk>.idsig; it keeps that pairing in its new name.
          cp "$out/app-universal-release.apk.idsig"    "EasyVoice-${{ github.run_number }}.apk.idsig"
          cp "$out/app-arm64-v8a-release.apk.idsig"    "EasyVoice-${{ github.run_number }}-arm64-v8a.apk.idsig"
          cp "$out/app-armeabi-v7a-release.apk.idsig"  "EasyVoice-${{ github.run_number }}-armeabi-v7a.apk.idsig"
          cp app/build/outputs/bundle/release/app-release.aab "EasyVoice-${{ github.run_number }}.aab"
          ls -l EasyVoice-${{ github.run_number }}*.apk EasyVoice-${{ github.run_number }}*.idsig EasyVoice-${{ github.run_number }}.aab

      # The native library must export only Java_* and JNI_OnLoad; build 945
      # exported 698 libc++ symbols, which kept dead code in every APK. Checked
      # BEFORE publishing so a regression cannot reach the Releases page.
      - name: Check native exports
        run: bash tools/check/native-exports.sh "EasyVoice-${{ github.run_number }}.apk"

      # 16 KB PAGES, NOW IN THE APK ITSELF (2026-10-13). The libraries are stored
      # uncompressed and mapped straight out of the APK (no legacy packaging), so
      # a 64-bit library must start on a 16 KB boundary of the FILE as well as
      # carry 16 KB ELF segments, or Android 16 runs it in compatibility mode and
      # shows the user a dialog. Checked before publishing.
      - name: Check 16 KB alignment
        run: |
          bash tools/check/native-pagesize.sh "EasyVoice-${{ github.run_number }}.apk"
          bash tools/check/native-pagesize.sh "EasyVoice-${{ github.run_number }}-arm64-v8a.apk"

      # SIGNED WITH THE OWNER'S KEY (2026-10-14). Every file published below must
      # carry its certificate: one signed with any other key would not install
      # over the app on the owner's phone.
      - name: Check the release signature
        run: bash tools/check/release-signature.sh EasyVoice-${{ github.run_number }}*.apk "EasyVoice-${{ github.run_number }}.aab"

      # THE EXACT SOURCE OF THIS BUILD, PUBLISHED BESIDE IT (owner, 2026-09-11:
      # "har build ke sath pura jo latest build ka source code hai vah bhi a jana
      # chahie").
      #
      # `git archive` is what makes this the build rather than a snapshot of
      # something near it: it reads TRACKED files out of the commit that was just
      # compiled, so build output, tools/.cache, Gradle's caches and everything
      # gitignored are structurally incapable of getting in, and the archive is
      # reproducible from the commit for as long as the repo exists. The one
      # exclusion, autotts_reference/, is declared in .gitattributes with the
      # reasoning beside it -- not here, so it cannot drift from the archive.
      #
      # GitHub already attaches its own "Source code (zip)" to a tag. This is
      # still worth its own asset: it is NAMED after the build, so it sits beside
      # the APKs under the same number, and it carries BUILD-INFO.txt stamping
      # which run, commit and branch produced it -- which the auto-generated one
      # cannot.
      - name: Archive the source of this build
        run: |
          set -e
          n=${{ github.run_number }}
          cat > BUILD-INFO.txt <<INFO
          Easy Voice - source of build #$n
          Commit:   ${{ github.sha }}
          Ref:      ${{ github.ref_name }}
          Workflow: ${{ github.workflow }} run ${{ github.run_id }}
          Built:    $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          This is every tracked file at that commit, straight out of git, so it
          builds the APK published in the same release. Build it with:
            ./gradlew assembleRelease -PevAbiSplit
          INFO
          git archive --format=zip -9 \
            --prefix="EasyVoice-$n-source/" \
            HEAD -o "EasyVoice-$n-source.zip"
          # BUILD-INFO goes in with plain `zip` rather than git archive's own
          # --add-file, which only exists from git 2.38. The runner image is far
          # newer than that today, but a source archive is not worth making the
          # publish step depend on a runner's git version, and appending to a zip
          # is the same one command everywhere.
          mkdir -p "EasyVoice-$n-source"
          mv BUILD-INFO.txt "EasyVoice-$n-source/BUILD-INFO.txt"
          zip -q -9 "EasyVoice-$n-source.zip" "EasyVoice-$n-source/BUILD-INFO.txt"
          rm -rf "EasyVoice-$n-source"
          ls -l "EasyVoice-$n-source.zip"
          # A source archive that does not contain the app is worse than none at
          # all, because nobody opens it until they need it. Assert the two things
          # that would actually be missing if git archive ever changed under us.
          unzip -Z1 "EasyVoice-$n-source.zip" | grep -q "EasyVoice-$n-source/app/src/main/java/com/sachinbaria/easyvoice/EasyVoiceTtsService.kt" \
            || { echo "source archive is missing the service"; exit 1; }
          unzip -Z1 "EasyVoice-$n-source.zip" | grep -q "EasyVoice-$n-source/app/src/main/cpp/tts_engine_core.cpp" \
            || { echo "source archive is missing the native core"; exit 1; }

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Easy Voice build #${{ github.run_number }}
          body: |
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}

            **EasyVoice-${{ github.run_number }}.apk** works on every phone.
            The two smaller files below are the same build with only one CPU's
            code in it -- `arm64-v8a` is the one for any phone from about 2015
            onwards, and it is roughly half the download.

            **EasyVoice-${{ github.run_number }}.aab** is the same build as an
            Android App Bundle, the file the Google Play Console takes. It is
            not installed on a phone directly.

            Every APK is signed with v1, v2, v3 and v4 signatures. The v4
            signature is its own file, the **.apk.idsig** beside each APK; only
            `adb install --incremental` uses it, and a normal install does not
            need it.

            **EasyVoice-${{ github.run_number }}-source.zip** is the complete
            source this build was compiled from, taken straight out of the commit
            above. It excludes only `autotts_reference/`, which is a third-party
            app kept in the repo for comparison and is not part of Easy Voice.

            Baseline profile: ${{ env.EV_PROFILE }}.
          files: |
            EasyVoice-${{ github.run_number }}.apk
            EasyVoice-${{ github.run_number }}-arm64-v8a.apk
            EasyVoice-${{ github.run_number }}-armeabi-v7a.apk
            EasyVoice-${{ github.run_number }}.apk.idsig
            EasyVoice-${{ github.run_number }}-arm64-v8a.apk.idsig
            EasyVoice-${{ github.run_number }}-armeabi-v7a.apk.idsig
            EasyVoice-${{ github.run_number }}.aab
            EasyVoice-${{ github.run_number }}-source.zip
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ONE LINE SAYING WHICH KIND OF FAILURE THIS WAS, before anyone reads a
      # thousand log lines. Every failure this pipeline has had since run 795 was
      # infrastructure rather than a real defect, and all of them looked the same
      # from outside: one red X. Twice that cost a wrong diagnosis.
      - name: Say WHY this went red
        if: failure()
        run: bash tools/ci/why-failed.sh

      # ARTIFACT STORAGE IS A QUOTA, AND RUN 968 WENT RED ON IT (2026-10-14).
      # Every upload failed with "Artifact storage quota has been hit" while the
      # APKs, the bundle, lint and every device test had passed. The account
      # held about 1 GB of artifacts: 219 R8 mappings kept 90 days (523 MB) and
      # 17 APK backups (407 MB) that were byte-for-byte copies of the release
      # files. So: no APK backup any more (the release IS the delivery, and it
      # is published unconditionally above), the mapping is kept 15 days (the
      # repository's own maximum), and no upload can turn a good build red --
      # each says what it could not keep and the run goes on.
      # mapping.txt must never ship publicly - it undoes the obfuscation.
      # Kept as a repo-private build artifact so only we can retrace a crash.
      - name: Upload R8 mapping (private)
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: r8-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          # 7 days (was 15): 150 mappings of ~2.4 MB filled the quota again by
          # 2026-10-14 (build 971 could upload nothing); all were deleted then.
          retention-days: 7
          if-no-files-found: warn

  # Google's Accessibility Test Framework over every screen -- labels, colour
  # contrast, touch target size, traversal order. See
  # app/src/androidTest/.../AccessibilityChecksTest.kt for what it covers.
  #
  # THIS JOB FAILING FAILS THE RUN. It is a separate job only so that it runs in
  # PARALLEL with the APK build -- an accessibility regression is a real defect
  # and must be seen and fixed, not tolerated because the APK happened to build.
  # Do not add continue-on-error, and do not make anything here optional.
  #
  # API 34 is the floor: enableAccessibilityChecks() requires it and is a no-op
  # below. The AVD needs KVM, which ubuntu-latest has once the udev rule below
  # grants access to it -- that step is from the emulator action's own README.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          # 21, the JDK Android Studio runs Gradle with and the local checks use.
          # AGP 9 needs 17 or newer; the app's bytecode target is the build's
          # compileOptions, not this.
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Command-line tools 23.0 (build 16111833, the current stable). They
          # carry the Android CLI, `android`, which tools/ci/install-sdk.sh
          # installs the NDK, CMake and build-tools with; from 23.0 sdkmanager
          # calls itself deprecated ("'android sdk' is the replacement for
          # 'sdkmanager'"). The action puts their bin/ on the PATH.
          cmdline-tools-version: '16111833'
          # platform-tools only: the emulator jobs need adb. The action's own
          # default once asked for the `tools` package Google has deleted, which
          # is what took builds down at this step in run 876.
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # THE EMULATOR NEEDS 7.2 GB OF FREE DISK AND THE RUNNER STOPPED HAVING IT.
      # Runs 795 and 796 both died with the emulator never booting, and the only
      # line that matters is buried a thousand lines above the adb retries:
      #
      #   FATAL | Not enough space to create userdata partition.
      #           Available: 6881.56 MB at /home/runner/.android/avd/test.avd,
      #           need 7372.80 MB.
      #
      # Short by 491 MB. Not KVM, not a missing system image -- and NOT anything
      # in this repository: run 794 passed with this workflow byte for byte, so
      # what changed is the hosted runner image, which keeps growing while the
      # pixel_6 userdata partition stays 7.2 GB. By the time the emulator starts
      # this job has already spent its budget on NDK 29, the CLD2 clone,
      # Gradle and the system image.
      #
      # So reclaim what a TTS build provably never touches. Every path here is a
      # preinstalled toolchain for another language or ecosystem; `|| true` on
      # each, because a path disappearing from a future image must not fail the
      # run. NEVER add /opt/hostedtoolcache/Java_* (JAVA_HOME) or
      # /usr/local/lib/android (ANDROID_HOME) to this list -- they are what the
      # job runs on.
      #
      # The `df` lines are deliberate: if this ever fails again, the log states
      # the space on both sides instead of leaving the next person to guess.
      - name: Free disk space for the emulator
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1
          # SAY IT HERE IF THERE IS NOT ENOUGH ROOM, because the emulator will not.
          # Runs 795-797 died on ONE line buried a thousand adb errors below the
          # noise:
          #     FATAL | Not enough space to create userdata partition.
          #             Available: 6881.56 MB ... need 7372.80 MB.
          # and everything after it was adb talking to a process that never
          # started. 7372.80 MB is the pixel_6 userdata partition; the margin is
          # for the system image and the build that follow it.
          #
          # This WARNS rather than fails: a manufactured red run is worse than a
          # real one, and the emulator may still manage. What it buys is that the
          # number is at the TOP of the log instead of inferred from adb noise.
          avail_mb=$(df -m / | tail -1 | awk '{print $4}')
          echo "free after cleanup: ${avail_mb} MB"
          if [ "$avail_mb" -lt 9000 ]; then
            echo "::warning::Only ${avail_mb} MB free. The pixel_6 userdata partition alone needs 7373 MB, and the system image and build come out of the same disk. If this run dies in adb, grep the log for FATAL first -- that is what runs 795-797 were."
          fi

      # The versions are the version catalog's (gradle/libs.versions.toml), and the
      # script fails HERE if a package never lands -- see tools/ci/install-sdk.sh.
      - name: Install NDK, CMake and build-tools
        timeout-minutes: 20
        run: bash tools/ci/install-sdk.sh

      # The debug APK links the same native core as the release one, so the
      # the CLD2 sources have to be here too.
      - name: Clone the CLD2 Native Library
        timeout-minutes: 12
        run: bash tools/ci/clone-cld2.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # No gradle-version: the build runs the project's own Gradle Wrapper
          # (./gradlew, through tools/ci/gradle-retry.sh), which pins the Gradle
          # version and its SHA-256 in gradle/wrapper/gradle-wrapper.properties,
          # and this action validates the wrapper jar against Gradle's own
          # published checksums before anything runs.
          #
          # cache-disabled STAYS TRUE (measured, 2026-09-10): setup-gradle writes
          # its cache only on the default branch, and every run here is a
          # workflow_dispatch on a feature branch, so a cache would never be
          # written and never be found.
          cache-disabled: true

      # ANDROID LINT, AS A GATE (owner, 2026-10-08: "library ke rule ke hisab se").
      # Android's own rules plus the checks every AndroidX library ships in its
      # aar; app/build.gradle.kts sets warningsAsErrors, and the tree stands at
      # "No issues found". In THIS job because it already builds the debug
      # variant and runs beside the baseline-profile job, so the APK is not held
      # up by it; like the accessibility checks below, a failure fails the run.
      # The text report is printed when it fails, so the log names each issue.
      - name: Lint (Android and AndroidX rules)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash tools/ci/gradle-retry.sh lintDebug || { cat app/build/reports/lint-results-debug.txt 2>/dev/null; exit 1; }

      - name: Run accessibility checks on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # 34, and NOT the app's targetSdk. This is the API of the throwaway
          # emulator the tests run on; it has nothing to do with which Android
          # the app targets or installs on.
          #
          # 34 is the FLOOR that matters: enableAccessibilityChecks() is
          # @RequiresApi(34) and a documented no-op below it, which is what
          # @SdkSuppress(minSdkVersion = 34) on the test class guards.
          #
          # 37 WAS TRIED AND DOES NOT EXIST HERE. Run 788: the emulator action
          # runs its own `sdkmanager --install ... 'platforms;android-37'` and
          # answered "Warning: Failed to find package 'platforms;android-37'",
          # so no emulator ever booted and no test ran. The same sdkmanager also
          # warns that it "only understands SDK XML versions up to 3 but an SDK
          # XML file of version 4 was encountered", which is why the newest
          # packages are invisible to it. Before raising this again, check that
          # exact line in the log rather than assuming an image exists.
          #
          # There is nothing to gain by chasing it either: ATF's checks are
          # library code and give the same answers at 34 as at 37.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            bash tools/ci/gradle-retry.sh connectedDebugAndroidTest

      # Uploaded on failure too -- the HTML report names the exact node and the
      # exact check, which is the only way to fix a failure you cannot reproduce
      # locally without an emulator.
      # The same classifier as the build job. This is the job that has produced
      # EVERY red run since 795, and not one of them was a real accessibility
      # regression -- so "is this the app or the pipeline?" is the first question
      # every single time, and it now has an answer at the top of the log.
      - name: Say WHY this went red
        if: failure()
        run: bash tools/ci/why-failed.sh

      # Not able to fail the run (storage quota, see the build job); the
      # tests' own result is the step above.
      - name: Upload the accessibility report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn

  # THE GENERATED BASELINE PROFILE (owner, 2026-10-07). :baselineprofile's
  # BaselineProfileGenerator drives the real app on the emulator -- the main
  # screen and its scan, then the TTS service speaking in mixed, auto and dual
  # mode -- and records what ran, so ART compiles exactly that ahead of time on
  # install. It cannot run in the dev container (no KVM), so it runs here,
  # BESIDE the build job (which no longer waits for it): the profile it makes
  # is compiled into the NEXT build. A failure here never touches the APK.
  #
  # ONLY WHEN THE KEPT PROFILE IS DUE (owner, 2026-10-14): the repository is
  # private, so every job's minutes count, and this one took ~42 of a run's ~73.
  # profile-due (one short job, no emulator) answers "due" only when no
  # baseline-profile-* artifact is kept or the newest is older than 6 days --
  # before the 7-day retention lets it expire -- so the emulator runs about
  # once a week and every build in between compiles in the kept profile.
  profile-due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Is a new baseline profile due
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired | not) | select(.name | startswith("baseline-profile-"))
                   | .created_at | fromdateiso8601] | max // 0') || newest=""
          if [ -z "$newest" ]; then
            # The question could not be asked: say so, and do not spend ~42
            # minutes on a guess. The build ships whatever profile is kept.
            echo "::warning::could not list artifacts; baseline profile not regenerated this run"
            due=false
          elif [ "$newest" = 0 ]; then
            echo "no generated baseline profile is kept"; due=true
          else
            age=$(( $(date -u +%s) - newest ))
            echo "newest kept profile is $(( age / 3600 )) hours old"
            if [ "$age" -gt $(( 6 * 86400 )) ]; then due=true; else due=false; fi
          fi
          echo "due=$due"
          echo "due=$due" >> "$GITHUB_OUTPUT"

  baseline-profile:
    needs: profile-due
    if: needs.profile-due.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          # 21, the JDK Android Studio runs Gradle with and the local checks use.
          # AGP 9 needs 17 or newer; the app's bytecode target is the build's
          # compileOptions, not this.
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Command-line tools 23.0 (build 16111833, the current stable). They
          # carry the Android CLI, `android`, which tools/ci/install-sdk.sh
          # installs the NDK, CMake and build-tools with; from 23.0 sdkmanager
          # calls itself deprecated ("'android sdk' is the replacement for
          # 'sdkmanager'"). The action puts their bin/ on the PATH.
          cmdline-tools-version: '16111833'
          # platform-tools only: the emulator jobs need adb. The action's own
          # default once asked for the `tools` package Google has deleted, which
          # is what took builds down at this step in run 876.
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # THE EMULATOR NEEDS 7.2 GB OF FREE DISK AND THE RUNNER STOPPED HAVING IT.
      # Runs 795 and 796 both died with the emulator never booting, and the only
      # line that matters is buried a thousand lines above the adb retries:
      #
      #   FATAL | Not enough space to create userdata partition.
      #           Available: 6881.56 MB at /home/runner/.android/avd/test.avd,
      #           need 7372.80 MB.
      #
      # Short by 491 MB. Not KVM, not a missing system image -- and NOT anything
      # in this repository: run 794 passed with this workflow byte for byte, so
      # what changed is the hosted runner image, which keeps growing while the
      # pixel_6 userdata partition stays 7.2 GB. By the time the emulator starts
      # this job has already spent its budget on NDK 29, the CLD2 clone,
      # Gradle and the system image.
      #
      # So reclaim what a TTS build provably never touches. Every path here is a
      # preinstalled toolchain for another language or ecosystem; `|| true` on
      # each, because a path disappearing from a future image must not fail the
      # run. NEVER add /opt/hostedtoolcache/Java_* (JAVA_HOME) or
      # /usr/local/lib/android (ANDROID_HOME) to this list -- they are what the
      # job runs on.
      #
      # The `df` lines are deliberate: if this ever fails again, the log states
      # the space on both sides instead of leaving the next person to guess.
      - name: Free disk space for the emulator
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1
          # SAY IT HERE IF THERE IS NOT ENOUGH ROOM, because the emulator will not.
          # Runs 795-797 died on ONE line buried a thousand adb errors below the
          # noise:
          #     FATAL | Not enough space to create userdata partition.
          #             Available: 6881.56 MB ... need 7372.80 MB.
          # and everything after it was adb talking to a process that never
          # started. 7372.80 MB is the pixel_6 userdata partition; the margin is
          # for the system image and the build that follow it.
          #
          # This WARNS rather than fails: a manufactured red run is worse than a
          # real one, and the emulator may still manage. What it buys is that the
          # number is at the TOP of the log instead of inferred from adb noise.
          avail_mb=$(df -m / | tail -1 | awk '{print $4}')
          echo "free after cleanup: ${avail_mb} MB"
          if [ "$avail_mb" -lt 9000 ]; then
            echo "::warning::Only ${avail_mb} MB free. The pixel_6 userdata partition alone needs 7373 MB, and the system image and build come out of the same disk. If this run dies in adb, grep the log for FATAL first -- that is what runs 795-797 were."
          fi

      # The versions are the version catalog's (gradle/libs.versions.toml), and the
      # script fails HERE if a package never lands -- see tools/ci/install-sdk.sh.
      - name: Install NDK, CMake and build-tools
        timeout-minutes: 20
        run: bash tools/ci/install-sdk.sh

      # The debug APK links the same native core as the release one, so the
      # the CLD2 sources have to be here too.
      - name: Clone the CLD2 Native Library
        timeout-minutes: 12
        run: bash tools/ci/clone-cld2.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # No gradle-version: the build runs the project's own Gradle Wrapper
          # (./gradlew, through tools/ci/gradle-retry.sh), which pins the Gradle
          # version and its SHA-256 in gradle/wrapper/gradle-wrapper.properties,
          # and this action validates the wrapper jar against Gradle's own
          # published checksums before anything runs.
          #
          # cache-disabled STAYS TRUE (measured, 2026-09-10): setup-gradle writes
          # its cache only on the default branch, and every run here is a
          # workflow_dispatch on a feature branch, so a cache would never be
          # written and never be found.
          cache-disabled: true

      # THE OWNER'S RELEASE KEY (2026-10-14: "aage se ... sabhi file ko naya wala
      # keyStore se"): alias sachin, CN=Sachin Baria, certificate SHA-256
      # 1E:37:9A:EF:...:E0:B6:81:9B. It lives here, as the previous key did, not
      # in a repository secret, by the owner's choice -- and nothing reads a
      # secret for it any more, so an old secret cannot sign with the old key.
      # "Check the release signature" proves every published file carries it.
      - name: Restore Keystore
        run: |
          printf '%s' "" | base64 -d > easyvoice-release.keystore
          echo "Keystore ready"
      - name: Generate the baseline profile on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The same image as the accessibility job (34 is also the floor
          # where BaselineProfileRule collects without root: API 33+).
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # ONE more try when the device run fails (run 972: the generator's test
          # failed on the emulator, run 973 passed it with the same code). The
          # first failure is still explained in this log by why-failed.sh -- the
          # test, its message and its stack -- so a retry that passes hides nothing.
          # A compile error fails both tries the same way. The profile is an
          # optimisation the APK does not wait for (see the build job).
          script: |
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            bash tools/ci/gradle-retry.sh :app:generateBaselineProfile || { bash tools/ci/why-failed.sh; bash tools/ci/gradle-retry.sh :app:generateBaselineProfile; }
        env:
          KEYSTORE_PASSWORD: sachin96
          KEY_ALIAS: sachin
          KEY_PASSWORD: sachin96

      # The same classifier as the other two jobs.
      - name: Say WHY this went red
        if: failure()
        run: bash tools/ci/why-failed.sh

      # The NEXT build's build job takes the newest of these and compiles it
      # into its APK. Kept 7 days so a gap between builds does not lose it (a
      # few hundred KB). A failed upload (storage quota) does not fail the run:
      # the next build then takes an older one, or the hand-written profile.
      - name: Upload the generated baseline profile
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile-${{ github.run_number }}
          path: app/src/main/generated/baselineProfiles/
          retention-days: 7
          if-no-files-found: error

          "        rootColumn.addView(appBar)\n"
          "        rootColumn.addView(progressBox)\n"
          "                                val pageViewPager = androidx.viewpager2.widget.ViewPager2(themedContext).apply {\n"
          "                                    offscreenPageLimit = 4\n"
          "                                    adapter = object : androidx.recyclerview.widget.RecyclerView.Adapter<androidx.recyclerview.widget.RecyclerView.ViewHolder>() {\n"
          "                                        override fun getItemCount(): Int = pageTitles.size\n"
          "                                        override fun getItemViewType(position: Int): Int = position\n"
          "                                        override fun onCreateViewHolder(parent: android.view.ViewGroup, viewType: Int): androidx.recyclerview.widget.RecyclerView.ViewHolder {\n"
          "                                            val container = android.widget.FrameLayout(parent.context)\n"
          "                                            container.layoutParams = androidx.recyclerview.widget.RecyclerView.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.MATCH_PARENT)\n"
          "                                            return object : androidx.recyclerview.widget.RecyclerView.ViewHolder(container) {}\n"
          "                                        }\n"
          "                                        override fun onBindViewHolder(holder: androidx.recyclerview.widget.RecyclerView.ViewHolder, position: Int) {\n"
          "                                            val container = holder.itemView as android.widget.FrameLayout\n"
          "                                            if (position >= 3 && container.childCount > 0) return\n"
          "                                            container.removeAllViews()\n"
          "                                            val pageView: android.view.View = when (position) {\n"
          "                                                0 -> buildModesTabView(container.context, prefs)\n"
          "                                                1 -> buildLanguagesTabView(container.context, prefs)\n"
          "                                                2 -> buildVoicesTabView(container.context, prefs) { testTts }\n"
          "                                                3 -> buildAdvancedTabView(container.context, prefs,\n"
          "                                                        requestNotificationPermission = {\n"
          "                                                            if (android.os.Build.VERSION.SDK_INT >= 33 && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {\n"

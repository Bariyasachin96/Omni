          "        text = \"Dedicated engines\"\n"
          "        isChecked = prefs.isDedicatedEnginesEnabled()\n"
          "        isEnabled = readingMode == \"dual\" || readingMode == \"mix\" || readingMode == \"auto\"\n"
          "        setOnCheckedChangeListener { _, checked -> prefs.setDedicatedEnginesEnabled(checked) }\n"
          "    }\n"
          "    root.addView(dedicatedBox)\n"
          "    root.addView(bodyText(context, \"Use this option if YOU ARE SURE that you have dedicated tts engine for each voice AND no other apps will use them!\"))\n"
          "    // ── Language list (AutoTTS O2 spinner source: dual → eng+D having voices; google →\n"
          "    //    google-scoped scan non-disabled; auto/mix → full scan non-disabled) ──\n"
          "    fun applyLanguageList(scanned: Set<String>) {\n"
          "        val source: List<String> = if (readingMode == \"dual\") {\n"
          "            val dualIso3 = prefs.toIso3(prefs.getString(\"dual_mode_language\", \"\").ifEmpty { Locale.getDefault().language })\n"
          "            listOf(\"eng\", dualIso3).distinct().filter { it in scanned }\n"
          "        } else {\n"
          "            (if (scanned.isNotEmpty()) scanned else prefs.getLanguageList().toSet()).filter { !prefs.isLanguageDisabled(it) }\n"
          "        }\n"
          "        val collator = java.text.Collator.getInstance()\n"
          "        languageCodes = source.sortedWith { a, b -> collator.compare(collatorSortKey(displayNameFor(a)), collatorSortKey(displayNameFor(b))) }\n"
          "        val labels = languageCodes.map { Languages.label(it) }\n"
          "        val adapter = ArrayAdapter(context, android.R.layout.simple_spinner_item, labels)\n"
          "        adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)\n"
          "        languageSpinner.adapter = adapter\n"
          "        if (languageCodes.isNotEmpty()) onLanguageSelected(languageCodes[0])\n"
          "    }\n"
          "    val voicesScopedPkg = if (readingMode == \"google\") \"com.google.android.tts\" else null\n"
          "    if (voicesScopedPkg == null && EngineFinder.lastScan.isNotEmpty()) applyLanguageList(EngineFinder.lastScan)\n"
          "    else try { EngineFinder.scanLanguages(context, voicesScopedPkg) { scanned -> mainHandler.post { applyLanguageList(scanned) } } } catch (_: Exception) {}\n"
          "    return scroll\n"
          "}\n"

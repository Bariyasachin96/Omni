                  if ((cp & 0x1FFFE0) == 0xA960) return 25;          // Hangul Jamo Extended-A
                  if ((((unsigned)(cp - 0xAC00)) >> 10) < 0xB) return 25;   // Hangul syllables
                  if ((unsigned)(cp - 0xF900) < 0x200) return 5;           // CJK Compatibility Ideographs
                  if ((unsigned)(cp - 0xFB50) < 0x2B0) return 3;           // Arabic Presentation Forms-A
                  if ((unsigned)(cp - 0xFE70) < 0x90)  return 3;           // Arabic Presentation Forms-B
                  if ((unsigned)(cp - 0xFF66) < 0x38)  return 5;           // Halfwidth Katakana
                  if ((((unsigned)(cp - 0x20000)) >> 5) < 0x7D1) return 5;  // CJK Ext B..

                                            lang3, pct3, score3, nullptr, &textBytes, &reliable);
              if(!reliable) return "UNKNOWN";
              const char* code = CLD2::LanguageCode(lang3[0]);
              return code ? std::string(code) : "UNKNOWN";
          }

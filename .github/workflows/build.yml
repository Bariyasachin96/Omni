          static std::string cld3DetectRaw(const std::string& u8){
              static std::mutex g_cld3Mutex;
              static chrome_lang_id::NNetLanguageIdentifier* g_cld3 = nullptr;
              std::lock_guard<std::mutex> lk(g_cld3Mutex);
              if(!g_cld3) g_cld3 = new chrome_lang_id::NNetLanguageIdentifier(0, 1000);
              const chrome_lang_id::NNetLanguageIdentifier::Result r = g_cld3->FindLanguage(u8);
              if(!r.is_reliable || r.language == chrome_lang_id::NNetLanguageIdentifier::kUnknown) return "";
              std::string lang = r.language;
              size_t dash = lang.find('-'); if(dash != std::string::npos) lang = lang.substr(0, dash);
              std::string norm = normalizeLangCode(lang);
              if(!cld3ScriptConsistent(norm, u8)) return "";
              return norm;
          }
          static std::string cld2WindowDetectC(const std::string& u8, bool useCld3){
              if(useCld3) { std::string c3r = cld3DetectRaw(u8); return c3r.empty() ? "UNKNOWN" : c3r; }
              CLD2::CLDHints hints = {nullptr, nullptr, CLD2::UNKNOWN_ENCODING, CLD2::UNKNOWN_LANGUAGE};
              CLD2::Language lang3[3]; int pct3[3]; double score3[3];
              int textBytes=0; bool reliable=false;
              CLD2::DetectLanguageSummaryV2(u8.c_str(), (int)u8.size(), true, &hints,
                                            true, 0x4000, CLD2::UNKNOWN_LANGUAGE,
                                            lang3, pct3, score3, nullptr, &textBytes, &reliable);
              if(!reliable) return "UNKNOWN";
              const char* code = CLD2::LanguageCode(lang3[0]);
              return code ? std::string(code) : "UNKNOWN";
          }
          static std::unordered_set<std::string> jarrToSet(JNIEnv* env, jobjectArray arr){
              std::unordered_set<std::string> out;
              if(!arr) return out;
              jsize n = env->GetArrayLength(arr);
              for(jsize i=0;i<n;i++){
                  jstring js=(jstring)env->GetObjectArrayElement(arr,i);
                  if(!js) continue;
                  const char* c=env->GetStringUTFChars(js,nullptr);
                  out.insert(std::string(c));
                  env->ReleaseStringUTFChars(js,c);
                  env->DeleteLocalRef(js);
              }
              return out;
          }
          extern "C" JNIEXPORT void JNICALL
          Java_com_tts_easyvoice_NativeEngine_setIsoMap(JNIEnv* env, jclass, jobjectArray jIso2, jobjectArray jIso3){
              if(!jIso2||!jIso3) return;
              jsize n=env->GetArrayLength(jIso2); jsize m=env->GetArrayLength(jIso3);
              if(m<n) n=m;
              for(jsize i=0;i<n;i++){
                  jstring a=(jstring)env->GetObjectArrayElement(jIso2,i);
                  jstring b=(jstring)env->GetObjectArrayElement(jIso3,i);
                  if(a&&b){
                      const char* ca=env->GetStringUTFChars(a,nullptr);
                      const char* cb=env->GetStringUTFChars(b,nullptr);
                      g_iso2to3[std::string(ca)]=std::string(cb);
                      env->ReleaseStringUTFChars(a,ca); env->ReleaseStringUTFChars(b,cb);
                  }
                  if(a) env->DeleteLocalRef(a); if(b) env->DeleteLocalRef(b);
              }
          }

          "        val rootColumn = android.widget.LinearLayout(themedContext).apply { orientation = android.widget.LinearLayout.VERTICAL; fitsSystemWindows = true }\n"
          "        val appBar = android.widget.LinearLayout(themedContext).apply {\n"

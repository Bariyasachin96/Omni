          "            val legacy = prefs.getString(\"reading_mode\", \"\") ?: \"\"\n"
          "            if (legacy.isNotEmpty()) {\n"
          "                autoMode = when (legacy) { \"none\" -> 0; \"dual\" -> 1; \"auto\" -> 2; \"google\" -> 3; \"mix\" -> 4; else -> 3 }\n"
          "                prefs.edit().putInt(\"auto_mode\", autoMode).remove(\"reading_mode\").apply()\n"
          "            } else {\n"
          "                autoMode = 3  // AutoTTS k.p(): getInt(\"auto_mode\", 3) — default NOT persisted\n"
          "            }\n"
          "        }\n"
          "        if (autoMode == 3 && !isGoogleTtsInstalled()) return \"none\"  // k.p(): transient L=0 drop\n"
          "        return when (autoMode) { 0 -> \"none\"; 1 -> \"dual\"; 2 -> \"auto\"; 3 -> \"google\"; 4 -> \"mix\"; else -> \"auto\" }\n"
          "    }\n"
          "    fun setReadingMode(mode: String) {\n"
          "        // AutoTTS k.v(): the mode is persisted ONLY as the INT \"auto_mode\"\n"
          "        // (0=none,1=dual,2=auto,3=google,4=mix) — exactly AutoTTS's pref schema, no extra key.\n"
          "        val autoMode = when (mode) { \"none\" -> 0; \"dual\" -> 1; \"auto\" -> 2; \"google\" -> 3; \"mix\" -> 4; else -> 2 }\n"
          "        prefs.edit().putInt(\"auto_mode\", autoMode).remove(\"reading_mode\").apply()\n"
          "    }\n"
          "    // ── Advanced Settings flags ──\n"
          "    // AutoTTS k.r(): the ONLY key is \"strip_audio_attr\" (→ static P). One-time migration\n"
          "    // folds EasyVoice's legacy \"broken_engine_protector\" key in, then removes it — after\n"
          "    // that the pref schema is byte-for-byte AutoTTS.\n"
          "    fun isStripAudioAttr(): Boolean {\n"

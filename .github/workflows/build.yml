          "                initIsoMaps()\n"
          "                // m.o(lang): present in m.c and !e.i. Read it off the same list a0 built.\n"
          "                val detectOk = LangStore.languages.filter { !it.disabled }.map { it.iso3 }.toTypedArray()\n"
          "                // a.e(cp, m.f): m.f itself, no second test. a0() already built it from !e.i.\n"
          "                val enabledOk = enabledLangs.toTypedArray()\n"
          "                val out = NativeEngine.detectLanguageFull(text, latFall, nonLatFall, disableAdvancedFlag, detectOk, enabledOk, EasyVoiceLogger.isLoggingEnabled(), useCld3Flag)\n"
          "                val sep = out.indexOf('\\u0001')\n"
          "                if (sep >= 0) {\n"
          "                    if (sep + 1 < out.length) for (line in out.substring(sep + 1).split('\\n')) if (line.isNotEmpty()) EasyVoiceLogger.debug(EasyVoiceLogger.TAG, line)\n"
          "                    return out.substring(0, sep)\n"
          "                }\n"
          "                return out\n"
          "            } catch (_: Throwable) {  }\n"
          "        }\n"
          "        return \"UNKNOWN\"\n"
          "    }\n"
          "    private fun initIsoMaps() {\n"
          "        if (isoToIso3.isNotEmpty()) return\n"
          "        for (iso in Locale.getISOLanguages()) {\n"
          "            try {\n"
          "                val iso3 = localeIso3(Locale(iso))\n"
          "                isoToIso3[iso] = iso3\n"
          "                iso3ToIso[iso3] = iso\n"
          "            } catch (_: Exception) {}\n"
          "        }\n"
          "        try {\n"
          "            val entries = isoToIso3.entries.toList()\n"
          "            NativeEngine.setIsoMap(entries.map { it.key }.toTypedArray(), entries.map { it.value }.toTypedArray())\n"
          "        } catch (_: Throwable) {}\n"
          "    }\n"
          "    private data class MLChunk(val lang: String, val latin: Boolean, val text: String)\n"
          "    private fun isLatinCommonInherited(cp: Int): Boolean {\n"
          "        val script = Character.UnicodeScript.of(cp)\n"
          "        return script == Character.UnicodeScript.LATIN || script == Character.UnicodeScript.COMMON || script == Character.UnicodeScript.INHERITED\n"
          "    }\n"
          "    private fun multilingualChunks(text: String): List<MLChunk> {\n"
          "        if (text.isEmpty()) return listOf(MLChunk(\"un\", false, \"\"))\n"
          "        // clsCLD2.c: if (AutoTtsService.X && text.length() == 1) -> one \"un\" chunk whose\n"
          "        // latin flag is clsCLD2.d(text), and no detection at all.\n"
          "        if (quickCharacterFlag && text.length == 1) {\n"
          "            return listOf(MLChunk(\"un\", isLatinCommonInherited(text.codePointAt(0)), text))\n"
          "        }\n"
          "        val flat = try { NativeEngine.nativeGetLanguages(text, useCld3Flag) } catch (_: Throwable) { emptyArray<String>() }\n"
          "        val out = mutableListOf<MLChunk>()\n"
          "        var flatIdx = 0\n"
          "        while (flatIdx + 2 < flat.size) {\n"
          "            out.add(MLChunk(flat[flatIdx], flat[flatIdx + 1] == \"1\", flat[flatIdx + 2]))\n"
          "            flatIdx += 3\n"
          "        }\n"
          "        return out\n"
          "    }\n"
          "    // AutoTtsService O==5: lang = m.h.get(det); if null -> latin ? K : L; then\n"
          "    // if M(lang) is empty or \"Disable\" -> latin ? K : L. Two stages, both literal.\n"
          "    private fun resolveMultilingualChunk(mlChunk: MLChunk, latFall: String, nonLatFall: String): String {\n"
          "        val det = mlChunk.lang\n"
          "        var lang = if (isKnownIso2(det)) prefs.toIso3(det) else (if (mlChunk.latin) latFall else nonLatFall)\n"
          "        val eng = LangStore.engineFor(lang, modeInt)\n"
          "        if (eng.isEmpty() || eng == \"Disable\") lang = if (mlChunk.latin) latFall else nonLatFall\n"
          "        return lang\n"
          "    }\n"
          "    // AutoTTS M(lang): empty or \"Disable\" means not routable — there is no second test,\n"
          "    // and the lookup is against the shared m.c list, not SharedPreferences. The argument is\n"
          "    // handed to M() exactly as the caller has it: the multilingual branch passes the span's\n"
          "    // raw iso2, which never matches c3.e.b (iso3), and that is why such a span always falls\n"
          "    // through to detection in AutoTTS too.\n"
          "    private fun isLangRoutable(lang: String): Boolean {\n"
          "        val engine = LangStore.engineFor(lang, modeInt)\n"
          "        return engine.isNotEmpty() && engine != \"Disable\"\n"
          "    }\n"
          "    private fun isKnownIso2(code: String): Boolean = code.length == 2 && code in java.util.Locale.getISOLanguages()\n"
          "    private fun isLangRoutableRaw(lang: String): Boolean = isLangRoutable(lang)\n"
          "    private fun modeIntToLang(mode: Int, latFall: String, nonLatFall: String): String =\n"
          "        try { NativeEngine.modeLang(mode, latFall, nonLatFall) } catch (_: Throwable) {\n"
          "            when (mode) { 1 -> latFall; 2 -> nonLatFall; else -> \"auto\" }\n"
          "        }\n"
          "    private fun buildEngineList() {\n"
          "        synchronized(this) {\n"
          "            val newM = ArrayList<String>()\n"
          "            // Y() calls M(), and M() short-circuits on O == 3. Y() runs before m.p()\n"
          "            // loads O, so on a fresh process this is the still-zero static, not a pref.\n"
          "            val isGoogleMode = modeInt == 3\n"
          "            // AutoTtsService.Y(): defaultEngine = M(m.f(Locale.getDefault())), and M reads\n"
          "            // the in-memory m.c. onCreate runs Y() BEFORE a0() fills that list and before\n"
          "            // m.p() loads the mode, so in a fresh process the list is empty, O is 0, and M\n"
          "            // returns \"\" — nothing is promoted to index 0 and nothing is skipped. Only a\n"
          "            // process where the settings Activity already filled m.c, or Google mode (which\n"
          "            // short-circuits M), gets the promotion.\n"
          "            val defaultEngine = LangStore.engineFor(localeIso3(), if (isGoogleMode) 3 else 0)\n"
          "            var index = 0\n"
          "            while (true) {\n"
          "                val pkg = prefs.getString(\"engine_$n\", \"\")\n"
          "                if (pkg.isEmpty() || pkg == \"end\") break\n"
          "                if (pkg != defaultEngine) newM.add(pkg)\n"
          "                index++\n"
          "            }\n"
          "            // Y() tests exactly two things here: isEmpty() and equals(\"Disable\").\n"
          "            // M() can only ever answer \"com.google.android.tts\", \"Disable\", c3.e.f or\n"
          "            // \"\", so there is no third case to screen for.\n"
          "            if (defaultEngine.isNotEmpty() && defaultEngine != \"Disable\") {\n"
          "                newM.add(0, defaultEngine)\n"
          "            }\n"
          "            if (newM.isEmpty() && (try { packageManager.getPackageInfo(\"com.google.android.tts\", 0); true } catch (_: Exception) { false })) {\n"
          "                newM.add(\"com.google.android.tts\")\n"
          "            }\n"
          "            engineList = newM\n"
          "        }\n"
          "    }\n"
          "    // AutoTtsService.e0(). Read from the dex: \"LoadVoices\" is logged after the\n"
          "    // already-loaded gate, and every voice_N value is logged as \" -<value>\" BEFORE the\n"
          "    // isEmpty test — so the empty terminator gets a \" -\" line of its own. R\n"
          "    // (dedicated_engines) is read on the terminator, inside the loop, not afterwards.\n"
          "    private fun buildVoiceList() {\n"
          "        synchronized(this) {\n"
          "            if (!voiceList.isEmpty()) return\n"
          "            EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"LoadVoices\")\n"
          "            val sharedPrefs = getApplicationContext().getSharedPreferences(\"easy_voice_settings\", 0)\n"
          "            var index = 0\n"
          "            while (true) {\n"
          "                val voice = sharedPrefs.getString(\"voice_$n\", \"\") ?: \"\"\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \" -\" + voice)\n"
          "                if (voice.isEmpty()) {\n"
          "                    dedicatedEnginesFlag = sharedPrefs.getBoolean(\"dedicated_engines\", false)\n"
          "                    return\n"
          "                }\n"
          "                voiceList.add(voice)\n"
          "                index++\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "    private fun eagerLoadPrefs() {\n"
          "        // AutoTtsService.onCreate, in order: m.c(); Y(); e0(); a0(); X(); m.p(ctx);\n"
          "        // m.r(ctx). (U() is the licence checker and has no counterpart here.) m.c() is\n"
          "        // initIsoMaps() and already ran in onCreate. The engine list is built first, on\n"
          "        // purpose, while m.c is still empty. e0() is what sets R (dedicatedEnginesFlag),\n"
          "        // so nothing re-reads dedicated_engines afterwards.\n"
          "        buildEngineList()\n"
          "        buildVoiceList()\n"
          "        // a0() is `synchronized (this)` on the service, so the lock is taken here.\n"
          "        synchronized(this) { LangStore.loadLanguages(applicationContext) }\n"
          "        loadModeLangsOnce()\n"
          "        // m.p(ctx): auto_mode defaults to 3, a 3 with no Google TTS installed becomes 0,\n"
          "        // then locale_spans. Both in that order, and O is written before Q.\n"
          "        modeInt = when (prefs.getReadingMode()) { \"dual\" -> 1; \"auto\" -> 2; \"google\" -> 3; \"mix\" -> 4; \"multilingual\" -> 5; else -> 0 }\n"
          "        localeSpansFlag = prefs.isLocaleSpansEnabled()\n"
          "        // m.r(ctx), in its own order: S, T, U, V, W, X.\n"
          "        stripAudioAttrFlag = prefs.isStripAudioAttr()\n"
          "        forceAccessibilityFlag = prefs.isForceAccessibilityStream()\n"
          "        keepAliveFlag = prefs.isKeepAliveMode()\n"
          "        showNotificationFlag = prefs.isShowNotification()\n"
          "        disableAdvancedFlag = prefs.isDisableAdvancedDetection()\n"
          "        quickCharacterFlag = prefs.isQuickCharacterReading()\n"
          "        // Easy Voice only — the CLD3 row m.r has no counterpart for.\n"
          "        useCld3Flag = prefs.isUseCld3()\n"
          "    }\n"
          "    // AutoTtsService.X(). The first line is `if (F != null) return;` — once the mode\n"
          "    // languages have been filled they are never re-read from prefs, not even on a second\n"
          "    // onCreate in the same process. F is only ever null or a real iso3 (an empty pref\n"
          "    // falls back to m.f(Locale.getDefault())), so \"still empty\" is the same test here.\n"
          "    private fun loadModeLangsOnce() {\n"
          "        if (autoLang.isNotEmpty()) return\n"
          "        autoLang = prefs.getString(\"auto_mode_language\", \"\").ifEmpty { localeIso3() }\n"
          "        mixLatinLang = prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { localeIso3() }\n"
          "        mixNonLatinLang = prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { localeIso3() }\n"
          "        dualLang = prefs.getString(\"dual_mode_language\", \"\").ifEmpty { localeIso3() }\n"
          "        numberModeInt = prefs.getNumberModeLang()\n"
          "        puncModeInt = prefs.getPuncModeLang()\n"
          "        emojiModeInt = prefs.getEmojiModeLang()\n"
          "    }\n"
          "    private fun localeIso3(locale: java.util.Locale = java.util.Locale.getDefault()): String {\n"
          "        return try {\n"
          "            val iso3 = locale.isO3Language\n"
          "            if (iso3 in listOf(\"cmn\", \"lzh\", \"gan\", \"hak\")) \"zho\" else iso3\n"
          "        } catch (_: Exception) { \"zxx\" }\n"
          "    }\n"
          "    private fun localeMatchesP(l1: java.util.Locale?, l2: java.util.Locale?): Boolean {\n"
          "        if (l1 == null || l2 == null) return false\n"
          "        return try {\n"
          "            if (l1.isO3Language != l2.isO3Language) return false\n"
          "            val country1 = l1.isO3Country\n"
          "            if (country1.isEmpty()) return true\n"
          "            if (country1 != l2.isO3Country) return false\n"
          "            val variant1 = l1.variant\n"
          "            if (variant1.isEmpty()) return true\n"
          "            variant1 == l2.variant\n"
          "        } catch (_: Exception) { false }\n"
          "    }\n"
          "    private fun normalizeLangCode(code: String): String {\n"
          "        if (code.length <= 2) return code\n"
          "        val folded = when (code.lowercase()) { \"cmn\", \"lzh\", \"gan\", \"hak\" -> \"zho\"; else -> code.lowercase() }\n"
          "        initIsoMaps()\n"
          "        return iso3ToIso[folded] ?: code\n"
          "    }\n"
          "    override fun onSynthesizeText(request: SynthesisRequest?, callback: SynthesisCallback?) {\n"
          "        // The banner is the FIRST statement in the dex — before the foreground handling,\n"
          "        // not after it.\n"
          "        // onSynthesizeText reads O, F, G, K, L, H, I, J, Q, R, S, T, U, W and X straight off\n"
          "        // the statics. It never reloads SharedPreferences: m.p, m.q and m.r fill them once,\n"
          "        // and the settings screen writes them as the user changes each control. Reloading here\n"
          "        // would be a second source of truth and would race the screen's writes.\n"
          "        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"\\n-------------------------------\\nonSynthesizeText\")\n"
          "        if (showNotificationFlag && !isForegroundActive()) {\n"
          "            startForegroundIfPossible()\n"
          "        } else if (!showNotificationFlag && isForegroundActive()) {\n"
          "            // onSynthesizeText's else-if is a bare stopForeground(1) — no try, no log.\n"
          "            @Suppress(\"DEPRECATION\")\n"
          "            stopForeground(1)\n"
          "        }\n"
          "        synchronized(syncLock) { isStopped = false; syncLock.notifyAll() }\n"
          "        synchronized(syncLock) { isFlushed = false; syncLock.notifyAll() }\n"
          "        val rawCharSeq = request?.charSequenceText ?: \"\"\n"
          "        val rawText = rawCharSeq.toString()\n"
          "        reqRate = (request?.speechRate ?: 100) / 100.0f\n"
          "        reqPitch = (request?.pitch ?: 100) / 100.0f\n"
          "        reqParams = request?.params\n"
          "        reqVolume = reqParams?.getFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, 0f) ?: 0f; if (reqVolume == 0f) reqVolume = 1.0f\n"
          "        // c0 = j.getString(\"utteranceId\"): no default and no null check. Every use is a\n"
          "        // string concat, so a missing key becomes the four characters \"null\" — including in\n"
          "        // \"<c0>_<N>\", the utterance id the engine is given.\n"
          "        utteranceIdStr = (request?.params?.getString(\"utteranceId\")).toString()\n"
          "        if (rawText.trim().isEmpty()) {\n"
          "            // log(\"Speak text is empty\"); m0(Boolean.FALSE); K(cb, 1); return — m0 inlined,\n"
          "            // with the log lines it actually emits.\n"
          "            EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Speak text is empty\")\n"
          "            chunkQueue.clear()\n"
          "            EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"stopAllTts \" + false)\n"
          "            if (engineIndex >= 0 && engineIndex < enginePool.size) {\n"
          "                val wrapper = enginePool[engineIndex]\n"
          "                if (wrapper.state == 2 && wrapper.listenerSet && wrapper.tts?.isSpeaking == true) {\n"
          "                    try {\n"
          "                        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \" - calling speak empty for \" + wrapper.pkg)\n"
          "                        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"onSynthesizeText: \" + utteranceIdStr + \" ''\")\n"
          "                        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"speak \" + utteranceIdStr)\n"
          "                        wrapper.tts?.speak(\"\", TextToSpeech.QUEUE_FLUSH, null, null)\n"
          "                    } catch (ex: Exception) {\n"
          "                        // c(), not d() — the stop path uses d(), this one does not.\n"
          "                        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Speaking failed for \" + wrapper.pkg + \"\\n \" + ex.message)\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "            synchronized(syncLock) { isFlushed = true; syncLock.notifyAll() }\n"
          "            if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            if (callback?.hasFinished() == false) callback?.done()\n"
          "            return\n"
          "        }\n"
          "        // O, T and S — the statics, as every consumer in AutoTTS reads them.\n"
          "        val readingMode = when (modeInt) { 1 -> \"dual\"; 2 -> \"auto\"; 3 -> \"google\"; 4 -> \"mix\"; 5 -> \"multilingual\"; else -> \"none\" }\n"
          "        val isForceAccessibility  = forceAccessibilityFlag\n"
          "        val isStripAudioAttr      = stripAudioAttrFlag\n"
          "        // K, L, G and F — the statics. m.q filled them with the device-language fallback\n"
          "        // already, so there is nothing left to re-derive here.\n"
          "        val latFall = when (readingMode) {\n"
          "            \"mix\", \"multilingual\"  -> normalizeLangCode(mixLatinLang)\n"
          "            \"dual\" -> \"en\"\n"
          "            else   -> autoLang\n"
          "        }\n"
          "        val nonLatFall = when (readingMode) {\n"
          "            \"mix\", \"multilingual\"  -> normalizeLangCode(mixNonLatinLang)\n"
          "            \"dual\" -> dualLang\n"
          "            else   -> autoLang\n"
          "        }\n"
          "        scannedLangsIso3 = prefs.getScannedLangs()\n"
          "        initIsoMaps()\n"
          "        // a0(): for every entry, if (!e.i) m.f.add(m.i.get(e.b)). That is the whole of\n"
          "        // m.f — the service NEVER force-enables anything and never writes a _disabled\n"
          "        // flag; m.h/m.l do that, from the settings screen, and a0 only reads the result.\n"
          "        enabledLangs = LangStore.languages.filter { !it.disabled }.mapNotNull { iso3ToIso[it.iso3] }.toHashSet()\n"
          "        // H and I, the statics the number and punctuation spinners write.\n"
          "        val mixNumLang        = modeIntToLang(numberModeInt, latFall, nonLatFall)\n"
          "        val mixPuncLang       = modeIntToLang(puncModeInt, latFall, nonLatFall)\n"
          "        val mixEmojiLang      = \"auto\"\n"
          "        val chunks = mutableListOf<TextChunk>()\n"
          "        val trimmedText = rawText.trim()\n"
          "        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Speak: \" + trimmedText + \" id: \" + utteranceIdStr)\n"
          "        var reqLang0 = request?.language ?: \"\"\n"
          "        val bypassPrefix = trimmedText.length >= 11 && trimmedText.substring(0, 11) == \"[EasyVoice:\"\n"
          "        var bypassed = false\n"
          "        if (bypassPrefix) {\n"
          "            // Java's String.split(regex) drops trailing empty strings, so \"[EasyVoice:a:b:c]\"\n"
          "            // with nothing after the bracket splits to ONE element and takes no bypass at all.\n"
          "            // Kotlin keeps the empty tail, which would make it two and fire the bypass on text\n"
          "            // that AutoTTS treats as ordinary.\n"
          "            val splitParts = trimmedText.split(\"]\").dropLastWhile { it.isEmpty() }\n"
          "            if (splitParts.size == 2) {\n"
          "                // eng, loc and variant start as \"\" and are taken verbatim — there is no\n"
          "                // blank test. m.f(f0(loc)) then REPLACES the request language, and the FIXED\n"
          "                // line is logged here, not alongside the chunk.\n"
          "                var forcedEng = \"\"\n"
          "                var forcedLoc = \"\"\n"
          "                var forcedVariant = \"\"\n"
          "                val innerParts = splitParts[0].substring(1).split(\":\").dropLastWhile { it.isEmpty() }\n"
          "                if (innerParts.size == 4) {\n"
          "                    forcedEng     = innerParts[1]\n"
          "                    forcedLoc     = innerParts[2]\n"
          "                    forcedVariant = innerParts[3]\n"
          "                    reqLang0      = localeIso3(parseVoiceNameAsLocale(forcedLoc) ?: java.util.Locale(\"\"))\n"
          "                    EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"FIXED: \" + forcedEng + \" \" + forcedLoc + \" \" + forcedVariant)\n"
          "                }\n"
          "                val stripped = splitParts[1]\n"
          "                val baseLang: String = run {\n"
          "                    val loc = forcedLoc\n"
          "                    if (loc.isBlank()) normalizeLangCode((request?.language ?: \"\").ifBlank { latFall })\n"
          "                    else try {\n"
          "                        val localeParts = loc.split(\"_\")\n"
          "                        val locale: Locale = when (localeParts.size) {\n"
          "                            1 -> Locale(localeParts[0])\n"
          "                            2 -> Locale(localeParts[0], localeParts[1])\n"
          "                            else -> if (localeParts[2].isNotEmpty()) Locale(localeParts[0], localeParts[1], localeParts[2]) else Locale(localeParts[0], localeParts[1])\n"
          "                        }\n"
          "                        val iso3 = locale.getISO3Language()\n"
          "                        when {\n"
          "                            iso3 == \"cmn\" || iso3 == \"lzh\" || iso3 == \"gan\" || iso3 == \"hak\" -> \"zho\"\n"
          "                            iso3.isEmpty() -> latFall\n"
          "                            else -> iso3\n"
          "                        }\n"
          "                    } catch (_: Exception) { latFall }\n"
          "                }\n"
          "                if (stripped.isNotEmpty()) {\n"
          "                    chunks.add(TextChunk(stripped, baseLang,\n"
          "                        forcedEngine = forcedEng.ifEmpty { null },\n"
          "                        forcedLocale = forcedLoc.ifEmpty { null },\n"
          "                        forcedVariant = forcedVariant.ifEmpty { null }))\n"
          "                }\n"
          "                bypassed = true\n"
          "            }\n"
          "        }\n"
          "        val forceGoogle = readingMode == \"google\"\n"
          "        // AutoTTS gate: auto iff !forced && ((reqLang==\"zxx\" && O!=1) || O==2 || O==3); then O==1/4/5; else the none path\n"
          "        val effectiveMode = when {\n"
          "            (reqLang0 == \"zxx\" && readingMode != \"dual\") || readingMode == \"auto\" || readingMode == \"google\" -> \"auto\"\n"
          "            readingMode == \"dual\" -> \"dual\"\n"
          "            readingMode == \"mix\" -> \"mix\"\n"
          "            readingMode == \"multilingual\" -> \"multilingual\"\n"
          "            else -> \"none\"\n"
          "        }\n"
          "        try {\n"
          "        if (!bypassed) when (effectiveMode) {\n"
          "            \"none\" -> {\n"
          "                // The none path builds no M at all; the tail speaks v4, which for this\n"
          "                // path is the TRIMMED text — it is never reassigned from a chunk.\n"
          "                val noneLang = normalizeLangCode(request?.language ?: latFall)\n"
          "                chunks.add(TextChunk(trimmedText, noneLang))\n"
          "                    }\n"
          "            \"mix\" -> {\n"
          "                // AutoTtsService O==4 \"Mixed mode\": M.clear(); z.g(text); per-span M()/F fallback else y.g(span)\n"
          "                // The banner is logged before the synchronized(M) block, not after z.g.\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Mixed mode\")\n"
          "                val localeChunks = splitByLocaleSpans(rawCharSeq)\n"
          "                // y.g's defType: n6 = (O != 1 ? O == 4 && dev == L : dev == G) ? 2 : 1.\n"
          "                val neutralType = if (localeIso3() == prefs.toIso3(nonLatFall)) 2 else 1\n"
          "                // The type -> language step in the mixed branch is\n"
          "                //   t != 1 ? (t != 2 ? var10_15 : L) : K\n"
          "                // and var10_15 is the request's own language. A type that is neither 1 nor 2\n"
          "                // therefore falls back to what the caller asked for, not to a mode language.\n"
          "                val neutralDefault = reqLang0.ifEmpty { latFall }\n"
          "                val disableAdvDet = disableAdvancedFlag\n"
          "                // O == 4's span loop, literally:\n"
          "                //   lang = z.b(); if (lang.equalsIgnoreCase(\"unknown\") || lang.equals(\"\")) -> y.g\n"
          "                //   eng = M(lang); if (!eng.isEmpty() && !eng.equals(\"Disable\")) -> keep lang\n"
          "                //   else lang = F -> keep\n"
          "                // F is AutoTtsService.F, held as iso3. z.e(lang) stores whichever won.\n"
          "                val autoModeF = prefs.toIso3(autoLang)\n"
          "                for (spanChunk in localeChunks) {\n"
          "                    if (isFlushed) break\n"
          "                    if (!spanChunk.lang.equals(\"unknown\", ignoreCase = true) && spanChunk.lang != \"\") {\n"
          "                        val resolved = if (isLangRoutableRaw(spanChunk.lang)) spanChunk.lang else autoModeF\n"
          "                        chunks.add(TextChunk(spanChunk.text, resolved))\n"
          "                    } else {\n"
          "                        val tBytes = spanChunk.text.toByteArray(Charsets.UTF_8)\n"
          "                        val tBuf = ByteBuffer.allocateDirect(tBytes.size)\n"
          "                        tBuf.put(tBytes); tBuf.position(0)\n"
          "                        val tOut = NativeEngine.processDirect(\n"
          "                            tBuf, tBytes.size,\n"
          "                            latFall, nonLatFall, \"mix\",\n"
          "                            mixPuncLang, mixNumLang, mixEmojiLang,\n"
          "                            neutralDefault, neutralType, disableAdvDet, useCld3Flag\n"
          "                        )\n"
          "                        for (chunkStr in tOut.split(\"||\").filter { it.isNotBlank() }) {\n"
          "                            val parts = chunkStr.split(\"|\", limit = 3)\n"
          "                            if (parts.size == 3) {\n"
          "                                val zType = parts[0].toIntOrNull() ?: 0\n"
          "                                val typeFb = normalizeLangCode(parts[1])\n"
          "                                chunks.add(TextChunk(parts[2], typeFb, mixPendingDetect = true, mixTypeFallback = typeFb, mixType = zType))\n"
          "                            }\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            \"multilingual\" -> {\n"
          "                // AutoTtsService O==5 \"Multilingual mode\": M.clear(); z.g(text); routable span kept as-is else clsCLD2.c(span)\n"
          "                // The banner is logged before the synchronized(M) block, not after z.g.\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Multilingual mode\")\n"
          "                val localeChunks = splitByLocaleSpans(rawCharSeq)\n"
          "                for (spanChunk in localeChunks) {\n"
          "                    if (isFlushed) break\n"
          "                    if (!spanChunk.lang.equals(\"unknown\", ignoreCase = true) && spanChunk.lang.isNotEmpty() && isLangRoutableRaw(spanChunk.lang)) {\n"
          "                        chunks.add(TextChunk(spanChunk.text, spanChunk.lang))\n"
          "                    } else {\n"
          "                        for (mlChunk in multilingualChunks(spanChunk.text)) {\n"
          "                            chunks.add(TextChunk(mlChunk.text, resolveMultilingualChunk(mlChunk, latFall, nonLatFall)))\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "                // O == 5 is the only branch that reacts to an empty M: d(\"lstLanString is\n"
          "                // empty!\"), K(cb, 7), RETURN. The other branches just fall through to the\n"
          "                // tail with nothing queued.\n"
          "                if (chunks.isEmpty()) {\n"
          "                    EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"lstLanString is empty!\")\n"
          "                    if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                    if (callback?.hasFinished() == false) callback?.done()\n"
          "                    return\n"
          "                }\n"
          "            }\n"
          "            \"dual\" -> {\n"
          "                run {\n"
          "                    EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Dual mode\")\n"
          "                    val tBytes = trimmedText.toByteArray(Charsets.UTF_8)\n"
          "                    val tBuf = ByteBuffer.allocateDirect(tBytes.size)\n"
          "                    tBuf.put(tBytes); tBuf.position(0)\n"
          "                    // y.g: n6 = ((O != 1) ? (O == 4 && dev.equals(L)) : dev.equals(G)) ? 2 : 1.\n"
          "                    // For O == 1 the comparison is against G, the DUAL secondary language,\n"
          "                    // not L. Mixed is the branch that compares against L.\n"
          "                    val neutralType = if (localeIso3() == prefs.toIso3(dualLang)) 2 else 1\n"
          "                    // Dual makes no decision for a type that is neither 1 nor 2 — it neither\n"
          "                    // loads \"eng\" nor G, so whatever was loaded stays. The request language is\n"
          "                    // what that was, so it is what the chunk carries.\n"
          "                    val neutralDefault = reqLang0.ifEmpty { latFall }\n"
          "                    val disableAdvDet = disableAdvancedFlag\n"
          "                    val tOut = NativeEngine.processDirect(\n"
          "                        tBuf, tBytes.size,\n"
          "                        latFall, nonLatFall, \"dual\",\n"
          "                        mixPuncLang, mixNumLang, mixEmojiLang,\n"
          "                        neutralDefault, neutralType, disableAdvDet, useCld3Flag\n"
          "                    )\n"
          "                    for (chunkStr in tOut.split(\"||\").filter { it.isNotBlank() }) {\n"
          "                        val parts = chunkStr.split(\"|\", limit = 3)\n"
          "                        if (parts.size == 3) {\n"
          "                            val resolved = normalizeLangCode(parts[1])\n"
          "                            chunks.add(TextChunk(parts[2], resolved, typeCode = parts[0].toIntOrNull() ?: 0))\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "            else -> {\n"
          "                // AutoTtsService O==2/3 \"Auto mode || Google mode\": M.clear(); M.addAll(z.g(text)); per-span clsCLD2.b when unknown\n"
          "                // AutoTtsService.F — the auto-mode language, held as iso3.\n"
          "                val autoModeF = prefs.toIso3(autoLang)\n"
          "                // The banner is logged BEFORE the synchronized(M) block that clears the\n"
          "                // list and runs z.g, not after it.\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Auto mode || Google mode\")\n"
          "                val localeChunks = splitByLocaleSpans(rawCharSeq)\n"
          "                for (spanChunk in localeChunks) {\n"
          "                    if (isFlushed) break\n"
          "                    val detected = if (spanChunk.lang.equals(\"unknown\", ignoreCase = true)) {\n"
          "                        val rawDetected = detectLanguage(spanChunk.text, latFall, nonLatFall)\n"
          "                        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Cld2: \" + rawDetected + \" '\" + spanChunk.text + \"'\")\n"
          "                        if (rawDetected.length > 2) rawDetected.substring(0, 2) else rawDetected\n"
          "                    } else spanChunk.lang\n"
          "                    // m.h.get(det) -> iso3, null -> F; then M(iso3) empty or \"Disable\" -> F.\n"
          "                    // z.e() stores the ISO3 on the chunk, so that is what it carries.\n"
          "                    var resolved = if (isKnownIso2(detected)) prefs.toIso3(detected) else autoModeF\n"
          "                    val engAuto = LangStore.engineFor(resolved, modeInt)\n"
          "                    if (engAuto.isEmpty() || engAuto == \"Disable\") resolved = autoModeF\n"
          "                    chunks.add(TextChunk(spanChunk.text, resolved))\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "        } catch (ex: Exception) {\n"
          "            EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"Synthesis ended with error: \" + ex.message)\n"
          "            if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            if (callback?.hasFinished() == false) callback?.done()\n"
          "            return\n"
          "        }\n"
          "        if (forceGoogle && !bypassed) { chunks.forEach { it.forcedEngine = \"com.google.android.tts\" } }\n"
          "        // AutoTTS resolves a pending mix chunk in TWO stages, and the two call sites differ.\n"
          "        //   onSynthesizeText, first chunk : m.h.get(det) null -> type 1 K, type 2 L, else the\n"
          "        //                                   request language; then M(lang) empty/Disable ->\n"
          "        //                                   type 1 K, type 2 L, else keep.\n"
          "        //   e$a.run, every later chunk    : m.h.get(det) null -> type 1 K else L (no third case);\n"
          "        //                                   then the same M(lang) stage.\n"
          "        fun resolveMixChunk(chunk: TextChunk, first: Boolean = false) {\n"
          "            if (!chunk.mixPendingDetect) return\n"
          "            val rawDetected = detectLanguage(chunk.text, latFall, nonLatFall)\n"
          "            // The first-chunk site logs the raw detection with the text it ran on, then the\n"
          "            // resolved language, then the engine M() answered with.\n"
          "            if (first) EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"language: \" + rawDetected + \" '\" + chunk.text + \"'\")\n"
          "            val det = if (rawDetected.length > 2) rawDetected.substring(0, 2) else rawDetected\n"
          "            val chunkType = chunk.mixType\n"
          "            var resolvedLang = if (isKnownIso2(det)) prefs.toIso3(det) else null\n"
          "            if (resolvedLang == null) {\n"
          "                resolvedLang = if (first) { if (chunkType == 1) latFall else if (chunkType == 2) nonLatFall else reqLang0 }\n"
          "                     else { if (chunkType != 1) nonLatFall else latFall }\n"
          "            }\n"
          "            if (first) EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"language: \" + resolvedLang)\n"
          "            val eng = LangStore.engineFor(resolvedLang, modeInt)\n"
          "            if (first) EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"engine: \" + eng)\n"
          "            if (eng.isEmpty() || eng == \"Disable\") {\n"
          "                if (chunkType == 1) resolvedLang = latFall else if (chunkType == 2) resolvedLang = nonLatFall\n"
          "            }\n"
          "            chunk.lang = resolvedLang\n"
          "            chunk.mixPendingDetect = false\n"
          "        }\n"
          "        // Every mode branch does `if (M.isEmpty()) break blockNNN` — it SKIPS the first-chunk\n"
          "        // language load and carries on to the speak path, where the empty queue produces\n"
          "        // \"No more text to read.\" and the tail's start()/done(). It does not return here.\n"
          "        var firstChunkForced = false\n"
          "        if (chunks.isNotEmpty()) {\n"
          "            resolveMixChunk(chunks[0], first = true)\n"
          "            firstChunkForced = bypassed && (chunks[0].forcedEngine != null || chunks[0].forcedLocale != null)\n"
          "            // The lang each branch NAMES in its \"Languge is not supported\" line — dual names\n"
          "            // \"eng\" or G, never the chunk's own language.\n"
          "            var firstLoadLang = \"\"\n"
          "            // Each branch writes its own pair of lines, and they are NOT the same pair.\n"
          "            //   Auto/Google  : log(\"load \" + r), then \"Languge is not supported: …\" (typo)\n"
          "            //   Dual         : no \"load\" line,   then \"Languge is not supported: …\" (typo)\n"
          "            //   Mixed        : no \"load\" line,   then \"Languge is not supported: …\" (typo)\n"
          "            //   Multilingual : no \"load\" line,   then \"Language is not supported: …\" (correct)\n"
          "            //   Fall-through : log(\"load \" + r), then \"Language is not supported: …\" (correct)\n"
          "            // K's int argument (2/3/4/5/6/7/8/9) is never read by K, so it carries nothing.\n"
          "            var firstLoadSpelledRight = false\n"
          "            var firstLoadLogsLoad = false\n"
          "            // AutoTTS: the mode branches load with (lang, \"\", \"\"); the fall-through (none /\n"
          "            // [EasyVoice:] with no forced engine+locale) loads with the request's own language,\n"
          "            // country and variant. Dual loads by TYPE and logs the language first.\n"
          "            val firstLangLoad = when {\n"
          "                firstChunkForced -> TextToSpeech.LANG_AVAILABLE\n"
          "                bypassed || effectiveMode == \"none\" -> {\n"
          "                    firstLoadSpelledRight = true; firstLoadLogsLoad = true\n"
          "                    firstLoadLang = request?.language ?: \"\"\n"
          "                    onLoadLanguage(request?.language ?: \"\", request?.country ?: \"\", request?.variant ?: \"\")\n"
          "                }\n"
          "                effectiveMode == \"dual\" -> when (chunks[0].typeCode) {\n"
          "                    1 -> { firstLoadLang = \"eng\"; EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"language: eng\"); onLoadLanguage(\"eng\", \"\", \"\") }\n"
          "                    2 -> { firstLoadLang = dualLang; EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"language: \" + dualLang); onLoadLanguage(dualLang, \"\", \"\") }\n"
          "                    // Any other type: no onLoadLanguage at all, speak with whatever is loaded.\n"
          "                    else -> TextToSpeech.LANG_AVAILABLE\n"
          "                }\n"
          "                effectiveMode == \"multilingual\" -> {\n"
          "                    firstLoadSpelledRight = true\n"
          "                    firstLoadLang = prefs.toIso3(chunks[0].lang); onLoadLanguage(firstLoadLang, \"\", \"\")\n"
          "                }\n"
          "                effectiveMode == \"mix\" -> { firstLoadLang = prefs.toIso3(chunks[0].lang); onLoadLanguage(firstLoadLang, \"\", \"\") }\n"
          "                else -> { firstLoadLogsLoad = true; firstLoadLang = prefs.toIso3(chunks[0].lang); onLoadLanguage(firstLoadLang, \"\", \"\") }\n"
          "            }\n"
          "            if (firstLoadLogsLoad) EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"load \" + firstLangLoad)\n"
          "            if (firstLangLoad == TextToSpeech.LANG_NOT_SUPPORTED || firstLangLoad == TextToSpeech.LANG_MISSING_DATA) {\n"
          "                if (firstLoadSpelledRight) EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"Language is not supported: \" + firstLoadLang + \", text: \" + chunks[0].text)\n"
          "                else EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"Languge is not supported: \" + firstLoadLang + \", text: \" + chunks[0].text)\n"
          "                if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                if (callback?.hasFinished() == false) callback?.done()\n"
          "                return\n"
          "            }\n"
          "        }\n"
          "        val sysRate  = reqRate\n"
          "        val sysPitch = reqPitch\n"
          "        synchronized(chunkQueue) {\n"
          "            chunkQueue.clear()\n"
          "            chunkQueue.addAll(chunks.mapIndexed { chunkIdx, queued -> (chunkIdx + 1) to queued })\n"
          "        }\n"
          "        fun speakChunk(first: Boolean) {\n"
          "            if (isStopped || isFlushed) return\n"
          "            val pair = synchronized(chunkQueue) { if (chunkQueue.isEmpty()) null else chunkQueue.removeAt(0) }\n"
          "            if (pair == null) {\n"
          "                // AutoTTS e.onDone with M.size() <= 1: log then L(cb, 7) — p only, and done() only if already started\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"No more text to read.\")\n"
          "                // L(callback, 7): the log, then p = true + notifyAll, then done() only when\n"
          "                // the callback has started and has not finished.\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"endSynthesis #7\")\n"
          "                synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                if (callback?.hasStarted() == false) return\n"
          "                if (callback?.hasFinished() == true) return\n"
          "                callback?.done()\n"
          "                return\n"
          "            }\n"
          "            val (currentChunk, chunk) = pair\n"
          "            val effectiveLang = when (chunk.typeCode) {\n"
          "                1 -> \"eng\"\n"
          "                2 -> prefs.toIso3(prefs.getString(\"dual_mode_language\", \"\").ifEmpty { localeIso3() })\n"
          "                else -> prefs.toIso3(chunk.lang)\n"
          "            }\n"
          "            val chunkText = chunk.text\n"
          "            val preferredPkg = chunk.forcedEngine ?: LangStore.engineFor(effectiveLang, modeInt).ifEmpty { \"NOT_SET\" }\n"
          "            if (bypassed) {\n"
          "                val effPkg = if (preferredPkg == \"NOT_SET\") { if (engineIndex in 0 until enginePool.size) enginePool[engineIndex].pkg else \"NOT_SET\" } else preferredPkg\n"
          "                val savedLocTag = chunk.forcedLocale ?: prefs.getLocaleForLangPkg(effectiveLang, effPkg).ifEmpty { Locale.forLanguageTag(effectiveLang).toLanguageTag() }\n"
          "                val chunkLocale = parseVoiceNameAsLocale(savedLocTag) ?: Locale.forLanguageTag(effectiveLang)\n"
          "                loadVoice(effPkg, chunkLocale, chunk.forcedVariant ?: \"\", false)\n"
          "            }\n"
          "            if (engineIndex < 0 || engineIndex >= enginePool.size) {\n"
          "                // d(\"mTTSIndex out of range.\"); K(cb, 10); return — and nothing else. The\n"
          "                // stop flag is NOT raised here, so a waiter is left to its own timeout.\n"
          "                EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"mTTSIndex out of range.\")\n"
          "                if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                if (callback?.hasFinished() == false) callback?.done()\n"
          "                return\n"
          "            }\n"
          "            val wrapper = enginePool[engineIndex]\n"
          "            val tts = wrapper.tts ?: run {\n"
          "                // Same shape: d(\"mTTSIndex refers null tts.\"); K(cb, 10); return.\n"
          "                EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"mTTSIndex refers null tts.\")\n"
          "                if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                if (callback?.hasFinished() == false) callback?.done()\n"
          "                return\n"
          "            }\n"
          "            val pkg = preferredPkg\n"
          "            // AutoTtsService onSynthesizeText: O(lang) speed, R(lang) volume, N(lang) pitch —\n"
          "            // all three off the in-memory m.c, never off SharedPreferences. That matters\n"
          "            // because m.y only ever writes a value that differs from 100.\n"
          "            val appRate   = LangStore.speedFor(effectiveLang)  / 100.0f\n"
          "            val appPitch  = LangStore.pitchFor(effectiveLang)  / 100.0f\n"
          "            val appVolume = LangStore.volumeFor(effectiveLang) / 100.0f\n"
          "            val finalRate   = sysRate  * appRate\n"
          "            val finalPitch  = sysPitch * appPitch\n"
          "            val finalVolume = reqVolume * appVolume\n"
          "            tts.setSpeechRate(finalRate); tts.setPitch(finalPitch)\n"
          "            if (currentChunk == 1) chunkCounter = 1\n"
          "            val expectedId = \"${utteranceIdStr}_${chunkCounter}\"\n"
          "            val chunkHandler = android.os.Handler(android.os.Looper.getMainLooper())\n"
          "            tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {\n"
          "                override fun onStart(id: String) {\n"
          "                    EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"onStart \" + id)\n"
          "                    if (callback?.hasStarted() == false) { callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1) }\n"
          "                }\n"
          "                override fun onDone(id: String) {\n"
          "                    EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"onDone \" + id)\n"
          "                    val next = synchronized(chunkQueue) { chunkQueue.firstOrNull()?.second }\n"
          "                    if (next == null) { speakChunk(false); return }\n"
          "                    // AutoTTS e.onDone: when M still holds more than one chunk it\n"
          "                    // hands the continuation to a main-looper Handler with\n"
          "                    // postDelayed(runnable, 50L). Only the last chunk goes straight\n"
          "                    // to L(callback, 7).\n"
          "                    chunkHandler.postDelayed({\n"
          "                        chunkCounter++\n"
          "                        resolveMixChunk(next)\n"
          "                        val loadRes = onLoadLanguage(prefs.toIso3(next.lang), \"\", \"\")\n"
          "                        if (loadRes == TextToSpeech.LANG_NOT_SUPPORTED || loadRes == TextToSpeech.LANG_MISSING_DATA) {\n"
          "                            // e$a.run's failure line reads differently from the first chunk's,\n"
          "                            // and it ends with K(cb, 14) — start+done, no endSynthesis log.\n"
          "                            EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"Language \" + next.lang + \" is not supported.\\n Text: \" + next.text)\n"
          "                            if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                            if (callback?.hasFinished() == false) callback?.done()\n"
          "                        } else {\n"
          "                            speakChunk(false)\n"
          "                        }\n"
          "                    }, 50L)\n"
          "                }\n"
          "                override fun onError(id: String) {\n"
          "                    EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"onError \" + id)\n"
          "                    // L(cb, 8): the log, then p = true + notifyAll, then done() only when the\n"
          "                    // callback has started and has not finished.\n"
          "                    EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"endSynthesis #8\")\n"
          "                    synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                    if (callback?.hasStarted() == true && callback?.hasFinished() == false) { callback?.done() }\n"
          "                }\n"
          "                override fun onError(id: String, errorCode: Int) {\n"
          "                    EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"onError \" + id + \" code \" + errorCode)\n"
          "                    EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"endSynthesis #9\")\n"
          "                    synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                    if (callback?.hasStarted() == true && callback?.hasFinished() == false) { callback?.done() }\n"
          "                }\n"
          "                // e.onStop(String, boolean) is NOT empty — it logs the id and does nothing else.\n"
          "                override fun onStop(id: String, interrupted: Boolean) {\n"
          "                    EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"onStop \" + id)\n"
          "                }\n"
          "            })\n"
          "            val params = android.os.Bundle(reqParams ?: android.os.Bundle())\n"
          "            params.remove(\"pitch\"); params.remove(\"rate\")\n"
          "            params.remove(\"language\"); params.remove(\"country\")\n"
          "            params.remove(\"variant\"); params.remove(\"voiceName\"); params.remove(\"utteranceId\")\n"
          "            if (isStripAudioAttr) { params.remove(\"streamType\"); params.remove(\"audioAttributes\") }\n"
          "            if (finalVolume != 0f) { params.putFloat(TextToSpeech.Engine.KEY_PARAM_VOLUME, finalVolume) }\n"
          "            if (isStopped || isFlushed) return\n"
          "            wrapper.listenerSet = true\n"
          "            if (isForceAccessibility && !wrapper.audioAttrSet) {\n"
          "                try { tts.setAudioAttributes(android.media.AudioAttributes.Builder().setUsage(11).setContentType(1).build()); wrapper.audioAttrSet = true } catch (ex: Exception) { EasyVoiceLogger.error(EasyVoiceLogger.TAG, ex.toString()) }\n"
          "            }\n"
          "            if (first) {\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"Current engine: \" + pkg)\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, expectedId)\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"speak 1: \" + chunkText)\n"
          "            } else {\n"
          "                // e$a.run logs one line and no engine name.\n"
          "                EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"speak 2: \" + chunkText)\n"
          "            }\n"
          "            val speakRunnable = Runnable {\n"
          "                try {\n"
          "                    val speakResult = tts.speak(chunkText, TextToSpeech.QUEUE_FLUSH, params, expectedId)\n"
          "                    if (speakResult != 0) {\n"
          "                        EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"Speaking failed!!!\")\n"
          "                        if (first) EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"unlockSynthesis #12\")\n"
          "                        else EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"endSynthesis #5\")\n"
          "                        if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                        if (callback?.hasFinished() == false) callback?.done()\n"
          "                        synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                    }\n"
          "                } catch (ex: Exception) {\n"
          "                    EasyVoiceLogger.error(EasyVoiceLogger.TAG, \"onSynthesis Error: \" + ex.message)\n"
          "                    EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"unlockSynthesis #14\")\n"
          "                    if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "                    if (callback?.hasFinished() == false) callback?.done()\n"
          "                    synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "                }\n"
          "            }\n"
          "            // onSynthesizeText posts the FIRST chunk with t.postDelayed(runnable, 50).\n"
          "            // The later-chunk path speaks inline: e.onDone already posted it with its own\n"
          "            // 50 ms, so posting again would double the gap.\n"
          "            if (first) android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(speakRunnable, 50L)\n"
          "            else speakRunnable.run()\n"
          "        }\n"
          "        speakChunk(true)\n"
          "        if (keepAliveFlag) {\n"
          "            callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "            val silenceBuf = ByteArray(32)\n"
          "            val maxBuf = callback?.maxBufferSize ?: silenceBuf.size\n"
          "            keepAlive@ while (!isStopped) {\n"
          "                var off = 0\n"
          "                while (off < silenceBuf.size && !isStopped) {\n"
          "                    val index = kotlin.math.min(maxBuf, silenceBuf.size - off)\n"
          "                    if (callback?.audioAvailable(silenceBuf, off, index) != TextToSpeech.SUCCESS) break@keepAlive\n"
          "                    off += index\n"
          "                }\n"
          "                var kaInterrupted = false\n"
          "                synchronized(syncLock) { try { syncLock.wait(100) } catch (ex: InterruptedException) { kaInterrupted = true } }\n"
          "                if (kaInterrupted) break@keepAlive\n"
          "            }\n"
          "        } else {\n"
          "            synchronized(syncLock) {\n"
          "                while (!isStopped && !isFlushed) {\n"
          "                    // The InterruptedException handler LEAVES the loop in the dex — the\n"
          "                    // catch label falls straight through to the monitor-exit. Retrying\n"
          "                    // instead would spin here on a thread that keeps being interrupted.\n"
          "                    try { syncLock.wait() } catch (ex: InterruptedException) { break }\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"onSynthesizeText ended\")\n"
          "        if (callback?.hasStarted() == false) callback?.start(16000, android.media.AudioFormat.ENCODING_PCM_16BIT, 1)\n"
          "        if (callback?.hasFinished() == false) callback?.done()\n"
          "    }\n"
          "    // AutoTtsService.onDestroy(), in its order: log; one try around stopForeground(1) and\n"
          "    // abandonAudioFocusRequest with a d() on failure; then the f() == 2 shutdown loop OUTSIDE\n"
          "    // any try; then a separate try around the keep-alive unbinds that swallows silently.\n"
          "    override fun onDestroy() {\n"
          "        EasyVoiceLogger.debug(EasyVoiceLogger.TAG, \"onDestroy\")\n"
          "        try {\n"
          "            @Suppress(\"DEPRECATION\")\n"
          "            stopForeground(1)\n"
          "            audioMgr!!.abandonAudioFocusRequest(audioFocusReq!!)\n"
          "        } catch (ex: Exception) { EasyVoiceLogger.error(EasyVoiceLogger.TAG, ex.message ?: \"\") }\n"
          "        for (index in 0 until enginePool.size) { if (enginePool[index].state == 2) enginePool[index].shutdown() }\n"
          "        try { unbindAllEngineKeepAlive() } catch (_: Exception) {}\n"
          "        super.onDestroy()\n"
          "    }\n"
          "    companion object {\n"
          "        @JvmField val chunkQueue: ArrayList<Pair<Int, TextChunk>> = ArrayList()\n"
          "        @Volatile @JvmField var engineList: ArrayList<String> = ArrayList()\n"
          "        @Volatile @JvmField var voiceList: ArrayList<String> = ArrayList()\n"
          "        @JvmField var dedicatedEnginesFlag = false\n"
          "        @JvmField var lastLoadVoiceName = \"\"\n"
          "        @JvmField var chunkCounter = 0\n"
          "        @Volatile @JvmField var utteranceIdStr = \"\"\n"
          "        @JvmField var initializingTts: TextToSpeech? = null\n"
          "        @Volatile @JvmField var showNotificationFlag = false\n"
          "        @Volatile @JvmField var localeSpansFlag = false\n"
          "        @Volatile @JvmField var stripAudioAttrFlag = false\n"
          "        @Volatile @JvmField var forceAccessibilityFlag = false\n"
          "        @JvmField var numberModeInt = 0\n"
          "        @JvmField var puncModeInt = 0\n"
          "        @JvmField var emojiModeInt = 0\n"
          "        // AutoTtsService.O/F/G/K/L and U/W/X. Every one of these is a STATIC there, which is\n"
          "        // what lets the settings screen change a setting and have the running service see it\n"
          "        // without a restart. They were instance fields or absent here.\n"
          "        @Volatile @JvmField var modeInt = 0\n"
          "        @Volatile @JvmField var autoLang = \"\"\n"
          "        @Volatile @JvmField var dualLang = \"\"\n"
          "        @Volatile @JvmField var mixLatinLang = \"\"\n"
          "        @Volatile @JvmField var mixNonLatinLang = \"\"\n"
          "        @Volatile @JvmField var keepAliveFlag = false\n"
          "        @Volatile @JvmField var disableAdvancedFlag = true\n"
          "        // X's STATIC initialiser is false in <clinit>; it is m.r that reads the pref\n"
          "        // with a default of true and overwrites it. W's static initialiser really is\n"
          "        // true, which is why the two lines differ.\n"
          "        @Volatile @JvmField var quickCharacterFlag = false\n"
          "        // EasyVoice-only, but held and written exactly like the AutoTTS flags so the\n"
          "        // Advanced-tab row applies without a restart the same way they do.\n"
          "        @Volatile @JvmField var useCld3Flag = false\n"
          "    }\n"
          "}\n")

          # ── CheckVoiceData.kt ────────────────────────────────────────────────
          w("app/src/main/java/com/tts/easyvoice/CheckVoiceData.kt",
          "package com.tts.easyvoice\n"
          "import android.app.Activity\n"
          "import android.content.Intent\n"
          "import android.os.Bundle\n"
          "import android.speech.tts.TextToSpeech\n"
          "class CheckVoiceData : Activity() {\n"
          "    override fun onCreate(savedInstanceState: Bundle?) {\n"
          "        super.onCreate(savedInstanceState)\n"
          "        // c3.m.j(null, true): every non-disabled entry of m.c, by iso3, with no engine filter.\n"
          "        val available = LangStore.availableFor(null, true)\n"
          "        val data = Intent()\n"
          "        data.putStringArrayListExtra(TextToSpeech.Engine.EXTRA_AVAILABLE_VOICES, available)\n"
          "        setResult(TextToSpeech.Engine.CHECK_VOICE_DATA_PASS, data)\n"
          "        finish()\n"
          "    }\n"
          "}\n")


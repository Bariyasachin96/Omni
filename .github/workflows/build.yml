          "    private fun detectLanguage(text: String, latFall: String, nonLatFall: String): String {\n"
          "        if (text.isEmpty()) return \"UNKNOWN\"\n"
          "        // clsCLD2.b: if (text.length() == 1 && AutoTtsService.X) return \"UNKNOWN\"\n"
          "        if (text.length == 1 && quickCharacterFlag) return \"UNKNOWN\"\n"
          "        run {\n"

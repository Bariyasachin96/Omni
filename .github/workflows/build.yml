          static int jTableSizeFor(int c){ if(c<=1) return 1; int n=c-1; n|=n>>1;n|=n>>2;n|=n>>4;n|=n>>8;n|=n>>16; return n+1; }
          static std::vector<std::string> jHashSetOrder(const std::vector<std::string>& ins, int initCap){
              int cap=0, threshold=(initCap>=0?jTableSizeFor(initCap):0), size=0;
              std::vector<std::vector<std::string>> buckets; std::unordered_set<std::string> keys;
              auto resize=[&](){ int nc,nt; if(cap>0){nc=cap*2;nt=threshold*2;} else if(threshold>0){nc=threshold;nt=(int)(nc*0.75);} else {nc=16;nt=12;}
                  std::vector<std::vector<std::string>> nb(nc); for(auto&b:buckets)for(auto&k:b) nb[jSpread(jStrHash(k))&(nc-1)].push_back(k); buckets.swap(nb); cap=nc; threshold=nt; };
              for(auto& k: ins){ if(keys.count(k)) continue; if(buckets.empty()) resize(); buckets[jSpread(jStrHash(k))&(cap-1)].push_back(k); keys.insert(k); size++; if(size>threshold) resize(); }

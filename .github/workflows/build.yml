          "    }\n"
          "    override fun onIsValidVoiceName(name: String?): Int =\n"
          "        if (isKnownVoiceName(name)) TextToSpeech.SUCCESS else TextToSpeech.ERROR\n"
          "    override fun onLoadVoice(name: String?): Int =\n"
          "        if (isKnownVoiceName(name)) TextToSpeech.SUCCESS else TextToSpeech.ERROR\n"
          "    override fun onStop() {\n"
          "        VhLogger.markStop()\n"
          "        // AutoTTS e0(true): engines stopped FIRST, then isStopped notified, then isFlushed notified.\n"
          "        // f()==2 always true for enginePool entries. g==true mirrored by listenerSetEngines.\n"
          "        enginePool.forEach { (key, tts) ->\n"
          "            try { if (listenerSetEngines.contains(key) && tts.isSpeaking) tts.stop() } catch (_: Exception) {}\n"
          "        }\n"
          "        synchronized(syncLock) { isStopped = true; syncLock.notifyAll() }\n"
          "        synchronized(syncLock) { isFlushed = true; syncLock.notifyAll() }\n"
          "    }\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    // Auto TTS class t2/l.g(CharSequence):ArrayList<l>  — EXACT PORT\n"
          "    // SpannableString + LocaleSpan splitter (TalkBack passes locale hints!)\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    private fun splitByLocaleSpans(input: CharSequence): MutableList<TextChunk> {\n"
          "        val result = mutableListOf<TextChunk>()\n"
          "        // Auto TTS field G — when true, use SpannableString detection\n"
          "        // Default true for mix mode\n"
          "        val span = SpannableString(input)\n"
          "        val spans = span.getSpans(0, span.length, LocaleSpan::class.java)\n"
          "        if (spans.isEmpty()) {\n"
          "            // No locale hints — whole text as UNKNOWN\n"
          "            result.add(TextChunk(input.toString(), \"UNKNOWN\"))\n"
          "            return result\n"
          "        }\n"
          "        var prevEnd = 0\n"
          "        for (ls in spans) {\n"
          "            val start = span.getSpanStart(ls)\n"
          "            val end   = span.getSpanEnd(ls)\n"
          "            if (start > prevEnd) {\n"
          "                val txt = span.subSequence(prevEnd, start).toString()\n"
          "                if (txt.isNotEmpty()) result.add(TextChunk(txt, \"UNKNOWN\"))\n"
          "            }\n"
          "            val txt = span.subSequence(start, end).toString()\n"
          "            val lang = ls.locale?.language ?: \"UNKNOWN\"\n"
          "            if (txt.isNotEmpty()) result.add(TextChunk(txt, lang))\n"
          "            prevEnd = end\n"
          "        }\n"
          "        if (prevEnd < span.length) {\n"
          "            val txt = span.subSequence(prevEnd, span.length).toString()\n"
          "            if (txt.isNotEmpty()) result.add(TextChunk(txt, \"UNKNOWN\"))\n"
          "        }\n"
          "        return result\n"
          "    }\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    // SENTENCE SEGMENTATION HELPER (used by all 3 reading modes)\n"
          "    // Uses java.text.BreakIterator which is Unicode-aware: respects sentence\n"
          "    // boundaries in Hindi (।), Chinese (。), Arabic (؟), etc. and avoids\n"
          "    // mid-word breaks. This is a significant upgrade over AutoTTS's\n"
          "    // fixed 64-char window approach (which breaks words/sentences mid-way).\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    private fun splitSentences(text: String): List<String> {\n"
          "        if (text.isBlank()) return emptyList()\n"
          "        val result = mutableListOf<String>()\n"
          "        try {\n"
          "            val iter = java.text.BreakIterator.getSentenceInstance()\n"
          "            iter.setText(text)\n"
          "            var st = iter.first(); var en = iter.next()\n"
          "            while (en != java.text.BreakIterator.DONE) {\n"
          "                val s = text.substring(st, en).trim()\n"
          "                if (s.isNotEmpty()) result.add(s)\n"
          "                st = en; en = iter.next()\n"
          "            }\n"
          "        } catch (t: Throwable) {\n"
          "            VhLogger.d(\"[SERVICE] splitSentences failed: ${t.message} — treating as single sentence\")\n"
          "            result.add(text.trim())\n"
          "        }\n"
          "        // Safety: if BreakIterator returned nothing usable, treat input as one sentence.\n"
          "        if (result.isEmpty()) result.add(text.trim())\n"
          "        return result\n"
          "    }\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    // Auto TTS clsCLD2.b(text, R, N, ctx):String — EXACT PORT\n"
          "    // 64-char sliding window loop: per-window CLD2 + script-family fallback\n"
          "    // ─────────────────────────────────────────────────────────────────\n"
          "    private fun detectLanguage(text: String, latFall: String, nonLatFall: String): String {\n"
          "        if (text.isEmpty()) return \"UNKNOWN\"\n"
          "        VhLogger.d(\"[DETECT] start textLen=${text.length} snip='${text.take(60).replace('\\n',' ')}' latFall=$latFall nonLatFall=$nonLatFall\")\n"
          "        val isDisableAdv = prefs.isDisableAdvancedDetection()\n"
          "        val n5 = text.length\n"
          "        var n6 = 0\n"
          "        while (n6 < n5) {\n"
          "            val n7 = n6 + 64\n"
          "            val window = text.substring(n6, minOf(n7, n5))\n"
          "            try {\n"
          "                val cldResult = cld2DetectWindow(window, latFall, nonLatFall, isDisableAdv)\n"
          "                VhLogger.d(\"[DETECT] window[$n6..${minOf(n7,n5)}] CLD2='$cldResult'\")\n"
          "                if (cldResult != null && cldResult != \"UNKNOWN\") {\n"
          "                    if (isDisableAdv) {\n"
          "                        VhLogger.d(\"[DETECT] S=true → $cldResult\")\n"
          "                        return cldResult\n"
          "                    }\n"
          "                    if (isEngineAvailable(cldResult)) {\n"
          "                        VhLogger.d(\"[DETECT] CLD2=$cldResult engineOK=true → $cldResult\")\n"
          "                        return cldResult\n"
          "                    }\n"
          "                    // Engine not available — script fallback from THIS WINDOW's first codepoint\n"
          "                    // Mirrors clsCLD2.b(): n6 = clsCLD2.a(object22) i.e. first cp of the window\n"
          "                    val winCp = firstValidCodepoint(window)\n"
          "                    if (winCp != -1) {\n"
          "                        val primary = getScriptLang(winCp)\n"
          "                        if (primary != null) {\n"
          "                            if (isEngineAvailable(primary)) {\n"
          "                                VhLogger.d(\"[DETECT] CLD2=$cldResult noEngine winCp=U+${winCp.toString(16)} script=$primary → $primary\")\n"
          "                                return primary\n"
          "                            }\n"
          "                            for (fb in getScriptLangFallbacks(primary)) {\n"
          "                                if (isEngineAvailable(fb)) {\n"
          "                                    VhLogger.d(\"[DETECT] CLD2=$cldResult noEngine winCp=U+${winCp.toString(16)} script=$primary fb=$fb → $fb\")\n"
          "                                    return fb\n"
          "                                }\n"
          "                            }\n"
          "                        }\n"
          "                    }\n"
          "                    // Script family fallback also failed — continue to next window\n"
          "                }\n"
          "                // null/UNKNOWN — continue to next window\n"
          "            } catch (_: Exception) {\n"
          "                // exception on this window — continue to next window\n"
          "            }\n"
          "            n6 = n7\n"
          "        }\n"
          "        // After all windows: S=true → UNKNOWN (AutoTTS: if (AutoTtsService.S) return \"UNKNOWN\")\n"
          "        if (isDisableAdv) {\n"
          "            VhLogger.d(\"[DETECT] S=true all windows UNKNOWN → UNKNOWN\")\n"
          "            return \"UNKNOWN\"\n"
          "        }\n"
          "        // Whole-string first codepoint fallback (mirrors clsCLD2.b() final path: clsCLD2.a(string))\n"
          "        val firstCp = firstValidCodepoint(text)\n"
          "        if (firstCp == -1) {\n"
          "            VhLogger.d(\"[DETECT] no valid codepoint → UNKNOWN\")\n"
          "            return \"UNKNOWN\"\n"
          "        }\n"
          "        val primary = getScriptLang(firstCp)\n"
          "        if (primary != null) {\n"
          "            if (isEngineAvailable(primary)) {\n"
          "                VhLogger.d(\"[DETECT] script cp=U+${firstCp.toString(16)} → $primary engineOK=true\")\n"
          "                return primary\n"
          "            }\n"
          "            for (fb in getScriptLangFallbacks(primary)) {\n"
          "                if (isEngineAvailable(fb)) {\n"
          "                    VhLogger.d(\"[DETECT] script cp=U+${firstCp.toString(16)} → $primary noEngine fb=$fb → $fb\")\n"
          "                    return fb\n"
          "                }\n"
          "            }\n"
          "        }\n"
          "        VhLogger.d(\"[DETECT] all neutral → UNKNOWN\")\n"
          "        return \"UNKNOWN\"\n"
          "    }\n"
          "    // CLD2 detection for a single window — calls NativeEngine in auto mode.\n"
          "    // Returns detected lang or null if UNKNOWN/blank.\n"
          "    private fun cld2DetectWindow(window: String, latFall: String, nonLatFall: String, isDisableAdv: Boolean): String? {\n"
          "        val bytes = window.toByteArray(Charsets.UTF_8)\n"
          "        val buf = ByteBuffer.allocateDirect(bytes.size)\n"
          "        buf.put(bytes); buf.position(0)\n"
          "        val out = NativeEngine.processDirect(\n"
          "            buf, bytes.size,\n"
          "            emptyArray(), emptyArray(),\n"
          "            false, false, false,\n"
          "            latFall, nonLatFall, \"auto\",\n"
          "            \"auto\", \"auto\", \"auto\",\n"
          "            latFall,\n"
          "            isDisableAdv\n"
          "        )\n"
          "        val parts = out.split(\"|\", limit = 2)\n"

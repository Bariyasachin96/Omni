          "                        Spacer(modifier = Modifier.height(8.dp))\n"
          "                        LazyColumn(modifier=Modifier.fillMaxSize()) {\n"
          "                            items(dict.toList()) { (k,v) ->\n"
          "                                Card(modifier=Modifier.fillMaxWidth().padding(vertical=4.dp).clickable{prefs.removeDict(k);dict=prefs.getDict()}.semantics{contentDescription=\"Delete entry $k to $v\"}) {\n"
          "                                    Text(\"$k -> $v\", modifier=Modifier.padding(16.dp))\n"
          "                                }\n"
          "                            }\n"
          "                        }\n"
          "                    }\n"
          "                }\n"
          "            }\n"
          "        }\n"

          "private fun displayNameFor(code: String): String {\n"
          "    val known = Languages.map[code]\n"
          "    if (known != null) return known\n"
          "    val dn = try { Locale(code).displayLanguage } catch (_: Exception) { \"\" }\n"
          "    return if (dn.isNotBlank() && dn != code) dn else code.uppercase()\n"
          "}\n"
          "private fun collatorSortKey(text: String): String =\n"
          "    java.text.Normalizer.normalize(text, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "fun buildLanguagesTabView(context: Context, prefs: SharedPrefsManager): View {\n"
          "    val readingMode = prefs.getReadingMode()\n"
          "    val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(context, 16), dp(context, 8), dp(context, 16), dp(context, 0)) }\n"
          "    if (readingMode == \"none\" || readingMode == \"dual\") {\n"
          "        root.addView(headerText(context, \"Languages\"))\n"
          "        root.addView(labelText(context, \"Language selection is not available for \\\"None\\\" and \\\"Dual languages\\\" modes.\"))\n"
          "        return root\n"
          "    }\n"
          "    root.addView(headerText(context, \"Languages\"))\n"
          "    root.addView(bodyText(context, \"Select languages you want to work with.\\nNote: This list only includes languages supported by TTS engines on your device. If your language is missing, please install a third-party TTS engine that supports it.\"))\n"
          "    val deviceIso3 = try { Locale.getDefault().isO3Language } catch (_: Exception) { \"eng\" }\n"
          "    fun normIso3(value: String) = if (value.isEmpty()) deviceIso3 else prefs.toIso3(value)\n"
          "    val forceEnabledIso3 = HashSet<String>()\n"
          "    when (readingMode) {\n"
          "        \"auto\", \"google\" -> forceEnabledIso3.add(normIso3(prefs.getString(\"auto_mode_language\", \"\")))\n"
          "        \"mix\" -> { forceEnabledIso3.add(normIso3(prefs.getString(\"mixed_mode_latin_language\", \"\"))); forceEnabledIso3.add(normIso3(prefs.getString(\"mixed_mode_non_latin_language\", \"\"))) }\n"
          "    }\n"
          "    fun isForceEnabled(code: String) = prefs.toIso3(code) in forceEnabledIso3\n"
          "    var allEntries: List<Pair<String, String>> = emptyList()\n"
          "    val checkedCodes = HashSet<String>()\n"
          "    var filteredCodes: List<String> = emptyList()\n"
          "    var searchQuery = \"\"\n"
          "    var showSelectedOnly = false\n"
          "    val buttonRow = LinearLayout(context).apply { orientation = LinearLayout.HORIZONTAL; gravity = android.view.Gravity.CENTER }\n"
          "    val selectAllButton = android.widget.Button(context).apply { text = \"Select\\nall\" }\n"
          "    val clearAllButton = android.widget.Button(context).apply { text = \"Clear\\nall\" }\n"
          "    val showSelectedButton = android.widget.Button(context).apply { text = \"Show\\nselected\" }\n"
          "    run { val lp = { LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply { val m = dp(context, 2); leftMargin = m; rightMargin = m } }; buttonRow.addView(selectAllButton, lp()); buttonRow.addView(clearAllButton, lp()); buttonRow.addView(showSelectedButton, lp()) }\n"
          "    root.addView(buttonRow)\n"
          "    val searchView = SearchView(context).apply { queryHint = \"Search languages…\"; isIconified = false; clearFocus() }\n"
          "    root.addView(searchView)\n"
          "    val statusText = bodyText(context, \"Loading languages…\")\n"
          "    root.addView(statusText)\n"
          "    val listView = ListView(context).apply { choiceMode = ListView.CHOICE_MODE_MULTIPLE }\n"
          "    root.addView(listView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))\n"
          "    val listAdapter = ArrayAdapter<String>(context, android.R.layout.simple_list_item_multiple_choice, ArrayList())\n"
          "    listView.adapter = listAdapter\n"
          "    fun refreshList() {\n"
          "        filteredCodes = allEntries.filter { (code, label) ->\n"
          "            (searchQuery.isBlank() || label.contains(searchQuery, ignoreCase = true)) &&\n"
          "            (!showSelectedOnly || code in checkedCodes)\n"
          "        }.map { it.first }\n"
          "        val labels = filteredCodes.map { code -> allEntries.first { it.first == code }.second }\n"
          "        listAdapter.clear(); listAdapter.addAll(labels); listAdapter.notifyDataSetChanged()\n"
          "        for (index in filteredCodes.indices) listView.setItemChecked(index, filteredCodes[index] in checkedCodes)\n"
          "        statusText.visibility = if (allEntries.isEmpty()) View.VISIBLE else View.GONE\n"
          "    }\n"
          "    listView.setOnItemClickListener { _, _, position, _ ->\n"
          "        if (position !in filteredCodes.indices) return@setOnItemClickListener\n"
          "        val code = filteredCodes[position]\n"
          "        val enable = if (isForceEnabled(code)) true else code !in checkedCodes\n"
          "        prefs.setLanguageDisabled(code, !enable)\n"
          "        if (enable) checkedCodes.add(code) else checkedCodes.remove(code)\n"
          "        listView.setItemChecked(position, enable)\n"
          "    }\n"
          "    selectAllButton.setOnClickListener {\n"
          "        allEntries.forEach { prefs.setLanguageDisabled(it.first, false) }\n"
          "        checkedCodes.clear(); checkedCodes.addAll(allEntries.map { it.first })\n"
          "        refreshList()\n"
          "    }\n"
          "    clearAllButton.setOnClickListener {\n"
          "        allEntries.forEach { prefs.setLanguageDisabled(it.first, !isForceEnabled(it.first)) }\n"
          "        checkedCodes.clear(); checkedCodes.addAll(allEntries.map { it.first }.filter { isForceEnabled(it) })\n"
          "        refreshList()\n"
          "    }\n"
          "    showSelectedButton.setOnClickListener {\n"
          "        showSelectedOnly = !showSelectedOnly\n"
          "        showSelectedButton.text = if (showSelectedOnly) \"Show\\nall\" else \"Show\\nselected\"\n"
          "        refreshList()\n"
          "    }\n"
          "    searchView.setOnQueryTextListener(object : SearchView.OnQueryTextListener {\n"
          "        override fun onQueryTextSubmit(query: String?): Boolean = false\n"
          "        override fun onQueryTextChange(newText: String?): Boolean { searchQuery = newText ?: \"\"; refreshList(); return true }\n"
          "    })\n"
          "    val scopedPkg = if (readingMode == \"google\") \"com.google.android.tts\" else null\n"
          "    val mainHandler = Handler(Looper.getMainLooper())\n"
          "    fun deliverLangs(onLangs: (Set<String>) -> Unit) {\n"
          "        if (scopedPkg == null && EngineFinder.lastScan.isNotEmpty()) { onLangs(EngineFinder.lastScan); return }\n"
          "        EngineFinder.scanLanguages(context, scopedPkg) { onLangs(it) }\n"
          "    }\n"
          "    try {\n"
          "        deliverLangs { scannedLangs ->\n"
          "            mainHandler.post {\n"
          "                val collator = java.text.Collator.getInstance()\n"
          "                allEntries = scannedLangs.map { code -> Pair(code, displayNameFor(code) + \" (\" + code + \")\") }\n"
          "                    .sortedWith { a, b -> collator.compare(collatorSortKey(a.second), collatorSortKey(b.second)) }\n"
          "                for (entry in allEntries) if (isForceEnabled(entry.first) && prefs.isLanguageDisabled(entry.first)) prefs.setLanguageDisabled(entry.first, false)\n"
          "                checkedCodes.clear()\n"
          "                checkedCodes.addAll(allEntries.map { it.first }.filter { !prefs.isLanguageDisabled(it) })\n"
          "                statusText.text = \"No TTS engine languages found.\"\n"
          "                refreshList()\n"
          "            }\n"
          "        }\n"
          "    } catch (_: Exception) { statusText.text = \"No TTS engine languages found.\" }\n"
          "    return root\n"
          "}\n"
          "private fun abbreviateEngineName(name: String): String {\n"
          "    val parts = name.split(\" \")\n"
          "    if (parts.size < 2) return name\n"
          "    val headBuf = StringBuilder(parts[0])\n"
          "    val tailBuf = StringBuilder(parts[parts.size - 1])\n"
          "    var headIdx = 1\n"
          "    var tailIdx = parts.size - 2\n"
          "    var best = \"$headBuf ... $tailBuf\"\n"
          "    while (headIdx < tailIdx) {\n"
          "        if (best.length > 15) return best\n"
          "        val candidate = \"$headBuf ... $tailBuf\"\n"
          "        if (candidate.length > 15) return if (candidate.length >= 20) best else candidate\n"
          "        if (parts[headIdx].length < parts[tailIdx].length) { headBuf.append(\" \").append(parts[headIdx]); headIdx++ }\n"
          "        else { tailBuf.insert(0, parts[tailIdx] + \" \"); tailIdx-- }\n"
          "        best = candidate\n"
          "    }\n"
          "    return if (name.length >= 15) best else name\n"
          "}\n"
          "fun buildVoicesTabView(context: Context, prefs: SharedPrefsManager, testTtsProvider: () -> TextToSpeech?): View {\n"
          "    val readingMode = prefs.getReadingMode()\n"
          "    val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(context, 16), dp(context, 8), dp(context, 16), dp(context, 16)) }\n"
          "    val scroll = ScrollView(context).apply { addView(root) }\n"
          "    if (readingMode == \"none\") {\n"
          "        root.addView(headerText(context, \"Voices\"))\n"
          "        root.addView(labelText(context, \"Voices settings aren't available for \\\"None\\\" mode.\"))\n"
          "        return scroll\n"
          "    }\n"
          "    val mainHandler = Handler(Looper.getMainLooper())\n"
          "    root.addView(headerText(context, \"Voices\"))\n"
          "    root.addView(bodyText(context, \"Choose an installed voice for each language.\\nTip: To avoid switching delays, we recommend assigning only one engine per language.\"))\n"
          "    root.addView(labelText(context, \"Select language\"))\n"
          "    val languageSpinner = Spinner(context)\n"
          "    root.addView(languageSpinner)\n"
          "    root.addView(labelText(context, \"Choose a voice for language\"))\n"
          "    val voiceSpinner = Spinner(context)\n"
          "    root.addView(voiceSpinner)\n"
          "    root.addView(labelText(context, \"Choose a variant for voice\"))\n"
          "    val variantSpinner = Spinner(context)\n"
          "    root.addView(variantSpinner)\n"
          "    val testButton = android.widget.Button(context).apply { text = \"Test\"; isEnabled = false }\n"
          "    root.addView(testButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n"
          "    var persistSlider: (String, Int) -> Unit = { _, _ -> }\n"
          "    data class SliderRow(val bar: SeekBar, val prefSuffix: String)\n"
          "    val sliderRows = mutableListOf<SliderRow>()\n"
          "    fun addSliderRow(labelString: String, prefSuffix: String, maxValue: Int) {\n"
          "        root.addView(android.widget.TextView(context).apply { text = labelString; gravity = android.view.Gravity.CENTER; setPadding(0, dp(context, 10), 0, 0) })\n"
          "        val row = LinearLayout(context).apply { orientation = LinearLayout.HORIZONTAL; gravity = android.view.Gravity.CENTER_VERTICAL }\n"
          "        val minusButton = android.widget.Button(context, null, android.R.attr.buttonStyleSmall).apply { text = \"-\"; contentDescription = \"Decrease \" + labelString.lowercase() }\n"
          "        val seekBar = SeekBar(context).apply { max = maxValue; accessibilityLiveRegion = View.ACCESSIBILITY_LIVE_REGION_POLITE }\n"
          "        val plusButton = android.widget.Button(context, null, android.R.attr.buttonStyleSmall).apply { text = \"+\"; contentDescription = \"Increase \" + labelString.lowercase() }\n"
          "        row.addView(minusButton)\n"
          "        row.addView(seekBar, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))\n"
          "        row.addView(plusButton)\n"
          "        root.addView(row)\n"
          "        sliderRows.add(SliderRow(seekBar, prefSuffix))\n"
          "        seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {\n"
          "            override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {\n"
          "                val clamped = if (progress < 10) 10 else progress\n"
          "                if (clamped != progress) seekBar.progress = clamped\n"
          "                persistSlider(prefSuffix, clamped)\n"
          "                if (android.os.Build.VERSION.SDK_INT >= 30) seekBar.stateDescription = \"$clamped of $maxValue\"\n"
          "            }\n"
          "            override fun onStartTrackingTouch(bar: SeekBar?) {}\n"
          "            override fun onStopTrackingTouch(bar: SeekBar?) {}\n"
          "        })\n"
          "        minusButton.setOnClickListener { val v = maxOf(10, seekBar.progress - 5); seekBar.progress = v; persistSlider(prefSuffix, v) }\n"
          "        plusButton.setOnClickListener { val v = minOf(maxValue, seekBar.progress + 5); seekBar.progress = v; persistSlider(prefSuffix, v) }\n"
          "    }\n"
          "    val defaultButton = android.widget.Button(context).apply { text = \"Default\" }\n"
          "    var languageCodes: List<String> = emptyList()\n"
          "    var selectedIso = \"\"\n"
          "    var voiceRows: List<EngineFinder.ScanVoice?> = emptyList()\n"
          "    var selectedEnginePkg = \"NOT_SET\"\n"
          "    var selectedLocaleTag = \"\"\n"
          "    var variantOptions: List<String> = emptyList()\n"
          "    persistSlider = { prefSuffix, value -> if (selectedIso.isNotEmpty()) prefs.setInt(prefs.toIso3(selectedIso) + prefSuffix, value) }\n"
          "    fun reloadSliders() {\n"
          "        if (selectedIso.isEmpty()) return\n"
          "        val iso3 = prefs.toIso3(selectedIso)\n"
          "        for (rowInfo in sliderRows) {\n"
          "            val stored = prefs.getInt(iso3 + rowInfo.prefSuffix, 100)\n"
          "            rowInfo.bar.progress = stored.coerceIn(0, rowInfo.bar.max)\n"
          "        }\n"
          "    }\n"
          "    fun parseLocaleTag(tag: String): Locale = try {\n"
          "        val parts = tag.replace(\"-\", \"_\").split(\"_\")\n"
          "        when {\n"
          "            parts.size >= 3 && parts[2].isNotEmpty() -> Locale(parts[0], parts[1], parts[2])\n"
          "            parts.size >= 2 -> Locale(parts[0], parts[1])\n"
          "            else -> Locale(parts[0])\n"
          "        }\n"
          "    } catch (_: Exception) { Locale(tag) }\n"
          "    val rawPrefs = context.getSharedPreferences(\"easy_voice_settings\", Context.MODE_PRIVATE)\n"
          "    fun voiceOrder(key: String): Int = try { (rawPrefs.getString(key, \"1000\") ?: \"1000\").toInt() } catch (_: Exception) { 1000 }\n"
          "    fun voiceKey(row: EngineFinder.ScanVoice?): String = if (row == null) \"Disable#\" + Locale(selectedIso).toString() else row.pkg + \"#\" + row.locale.toString()\n"
          "    fun rowLabel(row: EngineFinder.ScanVoice?): String {\n"
          "        if (row == null) return \"*Disabled\"\n"
          "        val abbr = abbreviateEngineName(row.engineName)\n"
          "        return if (row.locale.country.isNotEmpty()) abbr + \", \" + row.locale.getDisplayCountry() else abbr\n"
          "    }\n"
          "    fun refreshVariantSpinner() {\n"
          "        val sel = voiceRows.firstOrNull()\n"
          "        if (sel == null) {\n"
          "            variantOptions = emptyList(); variantSpinner.adapter = null; return\n"
          "        }\n"
          "        val base = sel.variants.toList()\n"
          "        val savedVariant = prefs.getVoiceName(selectedIso)\n"
          "        val ordered = if (savedVariant.isNotEmpty()) (listOf(savedVariant) + base.filter { it != savedVariant }).toMutableList() else base.toMutableList()\n"
          "        if (ordered.size > 2) {\n"
          "            val middle = ordered.subList(1, ordered.size - 1).sorted()\n"
          "            for (i in middle.indices) ordered[1 + i] = middle[i]\n"
          "        }\n"
          "        variantOptions = ordered\n"
          "        val adapter = mediumSpinnerAdapter(context, variantOptions)\n"
          "        variantSpinner.adapter = adapter\n"
          "    }\n"
          "    fun rebuildVoiceSpinner() {\n"
          "        val adapter = mediumSpinnerAdapter(context, voiceRows.map { rowLabel(it) })\n"
          "        voiceSpinner.adapter = adapter\n"
          "    }\n"
          "    fun loadVoiceRows() {\n"
          "        if (selectedIso.isEmpty()) { voiceRows = emptyList(); return }\n"
          "        val all = EngineFinder.lastScanVoices.filter { EngineFinder.iso3Of(it.locale) == selectedIso }\n"
          "        val filtered = if (readingMode == \"google\") all.filter { it.pkg.equals(\"com.google.android.tts\", true) } else all\n"
          "        val rows = ArrayList<EngineFinder.ScanVoice?>(filtered)\n"
          "        val deviceLang = try { Locale.getDefault().language } catch (_: Exception) { \"en\" }\n"
          "        val autoModeC = prefs.toIso3(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { deviceLang })\n"
          "        val mixLatH = prefs.toIso3(prefs.getString(\"mixed_mode_latin_language\", \"\").ifEmpty { deviceLang })\n"
          "        val mixNonLatI = prefs.toIso3(prefs.getString(\"mixed_mode_non_latin_language\", \"\").ifEmpty { deviceLang })\n"
          "        if ((readingMode == \"auto\" && selectedIso != autoModeC) || (readingMode == \"mix\" && selectedIso != mixLatH && selectedIso != mixNonLatI)) rows.add(null)\n"
          "        fun effOrder(row: EngineFinder.ScanVoice?): Int = voiceOrder(voiceKey(row))\n"
          "        fun tieLabel(row: EngineFinder.ScanVoice?): String = if (row == null) \"*Disabled\" else abbreviateEngineName(row.engineName)\n"
          "        voiceRows = rows.sortedWith(compareBy({ effOrder(it) }, { tieLabel(it).lowercase() }))\n"
          "        selectedEnginePkg = voiceRows.firstOrNull()?.pkg ?: \"NOT_SET\"\n"
          "        selectedLocaleTag = voiceRows.firstOrNull()?.locale?.toString() ?: \"\"\n"
          "    }\n"
          "    fun onLanguageSelected(iso: String) {\n"
          "        selectedIso = iso\n"
          "        reloadSliders()\n"
          "        loadVoiceRows()\n"
          "        testButton.isEnabled = voiceRows.isNotEmpty() && voiceRows.firstOrNull() != null\n"
          "        rebuildVoiceSpinner()\n"
          "        refreshVariantSpinner()\n"
          "    }\n"
          "    languageSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "        override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {\n"
          "            if (position in languageCodes.indices) onLanguageSelected(languageCodes[position])\n"
          "        }\n"
          "        override fun onNothingSelected(parent: AdapterView<*>?) {}\n"
          "    }\n"
          "    voiceSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "        override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {\n"
          "            if (selectedIso.isEmpty() || position !in voiceRows.indices) return\n"
          "            if (position == 0) return\n"
          "            val reordered = ArrayList<EngineFinder.ScanVoice?>(voiceRows)\n"
          "            val sel = reordered.removeAt(position)\n"
          "            reordered.add(0, sel)\n"
          "            voiceRows = reordered\n"
          "            val ed = rawPrefs.edit()\n"
          "            for ((i, row) in voiceRows.withIndex()) {\n"
          "                ed.putString(voiceKey(row), i.toString())\n"
          "                if (i == 0) ed.putString(selectedIso, voiceKey(row))\n"
          "            }\n"
          "            ed.apply()\n"
          "            selectedEnginePkg = sel?.pkg ?: \"NOT_SET\"\n"
          "            selectedLocaleTag = sel?.locale?.toString() ?: \"\"\n"
          "            testButton.isEnabled = sel != null\n"
          "            rebuildVoiceSpinner()\n"
          "            refreshVariantSpinner()\n"
          "        }\n"
          "        override fun onNothingSelected(parent: AdapterView<*>?) {}\n"
          "    }\n"
          "    variantSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"
          "        override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {\n"
          "            if (selectedIso.isEmpty() || position !in variantOptions.indices) return\n"
          "            prefs.setVoiceName(selectedIso, variantOptions[position])\n"
          "        }\n"
          "        override fun onNothingSelected(parent: AdapterView<*>?) {}\n"
          "    }\n"
          "    testButton.setOnClickListener {\n"
          "        val testClient = testTtsProvider()\n"
          "        if (testClient != null && selectedEnginePkg != \"NOT_SET\" && selectedIso.isNotEmpty()) {\n"
          "            val voiceLocale = try { parseLocaleTag(selectedLocaleTag.ifEmpty { selectedIso }) } catch (_: Exception) { Locale(selectedIso) }\n"
          "            val qualityTag = prefs.getVoiceName(selectedIso)\n"
          "            val sample = SampleTexts.get(selectedIso)\n"
          "            val spoken = if (sample.isEmpty())\n"
          "                \"Sorry. Sample text for language \" + (try { voiceLocale.getDisplayName(Locale(\"eng\")) } catch (_: Exception) { selectedIso }) + \" is missing.\"\n"
          "            else \"[EasyVoice:\" + selectedEnginePkg + \":\" + voiceLocale.toString() + \":\" + qualityTag + \"]\" + sample\n"
          "            testClient.speak(spoken, TextToSpeech.QUEUE_FLUSH, null, \"EasyVoice_Test\")\n"
          "        }\n"
          "    }\n"
          "    addSliderRow(\"Speed\", \"_speed\", 500)\n"
          "    addSliderRow(\"Volume\", \"_volume\", 100)\n"
          "    addSliderRow(\"Pitch\", \"_pitch\", 200)\n"
          "    root.addView(defaultButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.CENTER })\n"
          "    defaultButton.setOnClickListener {\n"
          "        if (selectedIso.isEmpty()) return@setOnClickListener\n"
          "        val iso3 = prefs.toIso3(selectedIso)\n"
          "        prefs.setInt(iso3 + \"_speed\", 100); prefs.setInt(iso3 + \"_pitch\", 100); prefs.setInt(iso3 + \"_volume\", 100)\n"
          "        reloadSliders()\n"
          "    }\n"
          "    root.addView(subHeader(context, \"Experimental\"))\n"
          "    val dedicatedBox = android.widget.CheckBox(context).apply {\n"
          "        text = \"Dedicated engines\"\n"
          "        isChecked = prefs.isDedicatedEnginesEnabled()\n"
          "        isEnabled = readingMode == \"dual\" || readingMode == \"mix\" || readingMode == \"auto\"\n"
          "        setOnCheckedChangeListener { _, checked -> prefs.setDedicatedEnginesEnabled(checked) }\n"
          "    }\n"
          "    root.addView(dedicatedBox)\n"
          "    root.addView(bodyText(context, \"Only use this option if you have a dedicated TTS engine for each voice, and ensure no other apps are using them.\"))\n"
          "    fun applyLanguageList() {\n"
          "        val scan = EngineFinder.lastScanVoices\n"
          "        val byIso = LinkedHashMap<String, EngineFinder.ScanVoice>()\n"
          "        for (v in scan) { val iso3 = EngineFinder.iso3Of(v.locale); if (!byIso.containsKey(iso3)) byIso[iso3] = v }\n"
          "        val dualIso3 = prefs.toIso3(prefs.getString(\"dual_mode_language\", \"\").ifEmpty { Locale.getDefault().language })\n"
          "        val candidates: List<String> = when (readingMode) {\n"
          "            \"dual\" -> byIso.keys.filter { it == \"eng\" || it == dualIso3 }\n"
          "            \"google\" -> byIso.keys.filter { iso3 -> !prefs.isLanguageDisabled(iso3) && scan.any { it.pkg.equals(\"com.google.android.tts\", true) && EngineFinder.iso3Of(it.locale) == iso3 } }\n"
          "            else -> byIso.keys.filter { !prefs.isLanguageDisabled(it) }\n"
          "        }\n"
          "        fun disp(iso3: String): String = try { byIso[iso3]?.locale?.getDisplayLanguage()?.ifEmpty { null } ?: displayNameFor(iso3) } catch (_: Exception) { displayNameFor(iso3) }\n"
          "        val collator = java.text.Collator.getInstance()\n"
          "        languageCodes = candidates.sortedWith { a, b -> collator.compare(collatorSortKey(disp(a)), collatorSortKey(disp(b))) }\n"
          "        val labels = languageCodes.map { disp(it) + \" (\" + it + \")\" }\n"
          "        val adapter = mediumSpinnerAdapter(context, labels)\n"
          "        languageSpinner.adapter = adapter\n"
          "    }\n"
          "    applyLanguageList()\n"
          "    return scroll\n"
          "}\n"
          )

          w("app/src/main/java/com/tts/easyvoice/MainActivity.kt",
          "package com.tts.easyvoice\n"
          "import android.content.Intent\n"
          "import android.net.Uri\n"

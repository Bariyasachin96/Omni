          "    val autoIso3 = EasyVoiceTtsService.autoLang\n"
          "    val dualIso3 = EasyVoiceTtsService.dualLang\n"
          "    val mixLatIso3 = EasyVoiceTtsService.mixLatinLang\n"
          "    val mixNonIso3 = EasyVoiceTtsService.mixNonLatinLang\n"
          "    val required = LangStore.requiredLangs(modeInt, autoIso3, dualIso3, mixLatIso3, mixNonIso3)\n"
          "    // c3.j.z0.a(query, onlySelected, o0)\n"
          "    fun applyFilter() {\n"
          "        // z0.a(query, onlySelected, o0). Both folds are Java's String.toLowerCase(), which\n"
          "        // uses the DEFAULT LOCALE — not Kotlin's locale-invariant lowercase(). On a Turkish\n"
          "        // locale that is the difference between \"I\" folding to \"i\" and to \"ı\".\n"
          "        val query = (searchView.query ?: \"\").toString().lowercase(Locale.getDefault())\n"
          "        val idx = ArrayList<Int>()\n"
          "        val shown = ArrayList<String>()\n"
          "        for (index in labels.indices) {\n"
          "            val matches = query.isEmpty() || labels[index].lowercase(Locale.getDefault()).contains(query)\n"
          "            val selected = if (showSelectedOnly) (index < checkedFlags.size && checkedFlags[index]) else true\n"
          "            if (!matches || !selected) continue\n"
          "            shown.add(labels[index]); idx.add(index)\n"
          "        }\n"
          "        visibleIdx = idx\n"
          "        listAdapter.clear(); listAdapter.addAll(shown); listAdapter.notifyDataSetChanged()\n"
          "        for (index in visibleIdx.indices) {\n"
          "            val orig = visibleIdx[index]\n"
          "            if (orig < checkedFlags.size) listView.setItemChecked(index, checkedFlags[orig])\n"
          "        }\n"
          "    }\n"
          "    // j.X2()\n"
          "    fun refreshToggleText() { showSelectedButton.text = if (showSelectedOnly) \"Show\\nall\" else \"Show\\nselected\" }\n"
          "    searchView.setOnQueryTextListener(object : SearchView.OnQueryTextListener {\n"
          "        override fun onQueryTextSubmit(query: String?): Boolean = false\n"
          "        override fun onQueryTextChange(newText: String?): Boolean { applyFilter(); return true }\n"
          "    })\n"
          "    // j.T2's OnItemClickListener: the new state is read back off the ListView, o0 is set\n"
          "    // from it, and then A2(originalIndex) — which is m.c[originalIndex].b, NOT the filtered\n"
          "    // code list — decides what happens. A language in m.n() is only re-checked in the UI;\n"
          "    // its c3.e.i is not written and o0 keeps the value the click produced.\n"
          "    listView.setOnItemClickListener { _, _, position, _ ->\n"
          "        val checked = listView.checkedItemPositions.get(position)\n"
          "        if (position !in visibleIdx.indices) return@setOnItemClickListener\n"
          "        val orig = visibleIdx[position]\n"
          "        if (orig < 0) return@setOnItemClickListener\n"
          "        if (orig < checkedFlags.size) checkedFlags[orig] = checked\n"
          "        val code = (if (orig < LangStore.languages.size) LangStore.languages[orig].iso3 else null) ?: return@setOnItemClickListener\n"
          "        if (required.contains(code)) {\n"
          "            listView.setItemChecked(position, true)\n"
          "        } else {\n"
          "            // T2: m.c[j].i = !bl on the SHARED list, then m.z(ctx). The service\n"
          "            // reads that list, so the flag has to land in memory, not only in prefs.\n"
          "            for (entry in LangStore.languages) if (code.equals(entry.iso3, true)) { entry.disabled = !checked; LangStore.persistDisabled(context); break }\n"
          "        }\n"
          "    }\n"
          "    // Select all: every VISIBLE row is checked and o0 set for it, but c3.e.i is cleared on\n"
          "    // the WHOLE of m.c — j.I2 returns true on every path, so the filter it looks like it\n"
          "    // applies does nothing. m.z(ctx) runs once at the end.\n"
          "    selectAllButton.setOnClickListener {\n"
          "        for (index in visibleIdx.indices) {\n"
          "            listView.setItemChecked(index, true)\n"
          "            val orig = visibleIdx[index]\n"
          "            if (orig >= 0 && orig < checkedFlags.size) checkedFlags[orig] = true\n"
          "        }\n"
          "        for (entry in LangStore.languages) entry.disabled = false\n"
          "        LangStore.persistDisabled(context)\n"
          "    }\n"
          "    // Clear all: the visible rows and their o0 entries go off, every c3.e.i in m.c goes on,\n"
          "    // then m.n()'s languages are put back on in m.c and re-checked in o0 and in the list\n"
          "    // through z0.b(originalIndex). m.z(ctx) once, then the re-filter if \"show selected\" is on.\n"
          "    clearAllButton.setOnClickListener {\n"
          "        for (index in visibleIdx.indices) {\n"
          "            listView.setItemChecked(index, false)\n"
          "            val orig = visibleIdx[index]\n"
          "            if (orig >= 0 && orig < checkedFlags.size) checkedFlags[orig] = false\n"
          "        }\n"
          "        for (entry in LangStore.languages) entry.disabled = true\n"
          "        for (entry in LangStore.languages) if (required.contains(entry.iso3)) entry.disabled = false\n"
          "        for (index in codes.indices) {\n"
          "            if (!required.contains(codes[index])) continue\n"
          "            if (index < checkedFlags.size) checkedFlags[index] = true\n"
          "            val pos = visibleIdx.indexOf(index)\n"
          "            if (pos >= 0) listView.setItemChecked(pos, true)\n"
          "        }\n"
          "        LangStore.persistDisabled(context)\n"
          "        if (showSelectedOnly) applyFilter()\n"
          "    }\n"
          "    showSelectedButton.setOnClickListener {\n"
          "        showSelectedOnly = !showSelectedOnly\n"
          "        refreshToggleText()\n"
          "        applyFilter()\n"
          "    }\n"
          "    refreshToggleText()\n"
          "    // T2 builds the list INLINE, on the thread that creates the view: m.c.clear();\n"
          "    // m.c.addAll(m.h(ctx, false)); then m.m/m.k/m.l off that list; then m.y(ctx). It reads\n"
          "    // c3.m.d, which the Activity's own scan already filled, and it never starts a scan of its\n"
          "    // own — there is no handler, no callback and no second scan anywhere in it. Going through\n"
          "    // a scan trigger here could put a second probe run alongside the Activity's, with two sets\n"
          "    // of watchdogs on the same engines.\n"
          "    // pkg is com.google.android.tts only for O == 3; for O == 2, 4 and 5 it is null.\n"
          "    val pkgFilter = if (readingMode == \"google\") \"com.google.android.tts\" else null\n"
          "    LangStore.languages.clear()\n"
          "    LangStore.languages.addAll(LangStore.rebuildFromScan(context, false, modeInt, required, EngineFinder.lastScanVoices))\n"
          "    labels = LangStore.labelsFor(pkgFilter)\n"
          "    codes = LangStore.codesFor(pkgFilter)\n"
          "    checkedFlags.clear()\n"
          "    checkedFlags.addAll(LangStore.checkedFor(pkgFilter, modeInt, autoIso3, dualIso3, mixLatIso3, mixNonIso3))\n"
          "    // T2 calls m.y(ctx) once the three lists are built.\n"
          "    LangStore.persistLanguages(context)\n"
          "    applyFilter()\n"
          "    return root\n"
          "}\n"
          "private fun abbreviateEngineName(name: String): String {\n"
          "    // c3.w.g() starts from Java's name.split(\" \"), which with the default limit drops\n"
          "    // trailing empty strings. Kotlin's split keeps them, so an engine label with a\n"
          "    // trailing space would take a different branch here without the dropLastWhile.\n"
          "    val parts = name.split(\" \").dropLastWhile { it.isEmpty() }\n"
          "    if (parts.size < 2) return name\n"
          "    val headBuf = StringBuilder(parts[0])\n"
          "    val tailBuf = StringBuilder(parts[parts.size - 1])\n"
          "    var headIdx = 1\n"
          "    var tailIdx = parts.size - 2\n"
          "    var best = \"$headBuf ... $tailBuf\"\n"
          "    while (headIdx < tailIdx) {\n"
          "        if (best.length > 15) return best\n"
          "        val candidate = \"$headBuf ... $tailBuf\"\n"
          "        if (candidate.length > 15) return if (candidate.length >= 20) best else candidate\n"
          "        if (parts[headIdx].length < parts[tailIdx].length) { headBuf.append(\" \").append(parts[headIdx]); headIdx++ }\n"
          "        else { tailBuf.insert(0, parts[tailIdx] + \" \"); tailIdx-- }\n"
          "        best = candidate\n"
          "    }\n"
          "    return if (name.length >= 15) best else name\n"
          "}\n"
          "// Exact port of fragment_voices.xml + c3.j.V2. @id/VoiceSettings carries no padding and\n"
          "// @id/scroller is fillViewport; every gap below is the margin the XML gives that view.\n"
          "// The three sliders declare android:max=\"19\" in the XML but V2 overrides them with\n"
          "// setMax(500) speed, setMax(100) volume, setMax(200) pitch, so the code wins.\n"
          "fun buildVoicesTabView(context: Context, prefs: SharedPrefsManager, testTtsProvider: () -> TextToSpeech?): View {\n"
          "    val readingMode = prefs.getReadingMode()\n"
          "    // AutoTtsService.O\n"
          "    val modeInt = when (readingMode) { \"dual\" -> 1; \"auto\" -> 2; \"google\" -> 3; \"mix\" -> 4; \"multilingual\" -> 5; else -> 0 }\n"
          "    val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL }\n"
          "    val scroll = ScrollView(context).apply { isFillViewport = true; addView(root) }\n"
          "    val dp5 = dpToPx(context, 5); val dp2 = dpToPx(context, 2)\n"
          "    // <RelativeLayout gravity=start background=#ff293842><TextView #ffffffff Medium margin=5dip/>\n"
          "    fun addHeaderBar(parent: LinearLayout, text: String) {\n"
          "        val headerBar = android.widget.RelativeLayout(context).apply { gravity = android.view.Gravity.START; setBackgroundColor(0xff293842.toInt()) }\n"
          "        headerBar.addView(android.widget.TextView(context).apply {\n"
          "            this.text = text\n"
          "            setTextAppearance(android.R.style.TextAppearance_Medium)\n"
          "            setTextColor(0xffffffff.toInt())\n"
          "            gravity = android.view.Gravity.CENTER_VERTICAL\n"
          "        }, android.widget.RelativeLayout.LayoutParams(android.widget.RelativeLayout.LayoutParams.WRAP_CONTENT, android.widget.RelativeLayout.LayoutParams.WRAP_CONTENT).apply {\n"
          "            topMargin = dp5; bottomMargin = dp5; marginStart = dp5; marginEnd = dp5\n"
          "        })\n"
          "        parent.addView(headerBar, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n"
          "    }\n"
          "    // <TextView gravity=start fill_parent TextAppearance.Small marginTop=N marginStart=5dip>\n"
          "    fun addSmall(parent: LinearLayout, text: String, topDp: Int) {\n"
          "        parent.addView(android.widget.TextView(context).apply {\n"
          "            this.text = text\n"
          "            gravity = android.view.Gravity.START\n"
          "            setTextAppearance(android.R.style.TextAppearance_Small)\n"
          "        }, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dpToPx(context, topDp); marginStart = dp5 })\n"
          "    }\n"
          "    // @id/VoicesInactive: the same header bar plus one Small line at marginTop 10/marginStart 5.\n"
          "    // V2 returns before the reset button and the dedicated-engines checkbox are ever wired.\n"
          "    if (readingMode == \"none\") {\n"
          "        addHeaderBar(root, \"Voices\")\n"
          "        addSmall(root, \"Voices settings aren't available for \\\"None\\\" mode.\", 10)\n"
          "        return scroll\n"
          "    }\n"
          "    addHeaderBar(root, \"Voices\")\n"
          "    addSmall(root, \"Choose an installed voice for each language.\\nTip: To avoid switching delays, we recommend assigning only one engine per language.\", 10)\n"
          "    addSmall(root, \"Select language\", 5)\n"
          "    // @id/autotts_languages — fill_parent, marginTop 2dip, marginStart 5dip\n"
          "    val languageSpinner = Spinner(context)\n"
          "    root.addView(languageSpinner, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp2; marginStart = dp5 })\n"
          "    addSmall(root, \"Choose a voice for language\", 5)\n"
          "    // @id/autotts_voices — fill_parent, marginTop 2dip, and NO marginStart in the XML\n"
          "    val voiceSpinner = Spinner(context)\n"
          "    root.addView(voiceSpinner, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp2 })\n"
          "    addSmall(root, \"Choose a variant for voice\", 5)\n"
          "    // @id/autotts_voice_variant — likewise marginTop 2dip only\n"
          "    val variantSpinner = Spinner(context)\n"
          "    root.addView(variantSpinner, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp2 })\n"
          "    // @id/testbutton — fill_parent; V2 disables it immediately after findViewById\n"
          "    val testButton = android.widget.Button(context).apply { text = \"Test\"; isEnabled = false }\n"
          "    root.addView(testButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n"
          "    // c3.j.U0 (speed), V0 (volume), W0 (pitch) — the cached values the +/- buttons work on.\n"
          "    // P1 keeps them in step with the SeekBar; nothing here writes SharedPreferences, m.y is\n"
          "    // the only writer and it skips any value equal to 100.\n"
          "    var speedValue = 100\n"
          "    var volumeValue = 100\n"
          "    var pitchValue = 100\n"
          "    var cached: (String) -> Int = { _ -> 100 }\n"
          "    var setCached: (String, Int) -> Unit = { _, _ -> }\n"
          "    // The bounds-checked write P1, L1, M1 and N1 make.\n"
          "    var writeEntry: (String, Int) -> Unit = { _, _ -> }\n"
          "    // I1, J1 and K1 do m.c.get(b1) with NO bounds check — at b1 == -1 that throws, here too.\n"
          "    var writeEntryUnchecked: (String, Int) -> Unit = { _, _ -> }\n"
          "    data class SliderRow(val seekBar: SeekBar, val prefSuffix: String)\n"
          "    val sliderRows = mutableListOf<SliderRow>()\n"
          "    // fragment_voices.xml @id/params: label TextView is fill_parent + gravity center with no\n"
          "    // padding; the row is fill_parent with no gravity; buttons are wrap_content with\n"
          "    // layout_gravity start/end; the SeekBar is 0dp weight 1, gravity center,\n"
          "    // layout_gravity center, secondaryProgress 0.\n"
          "    // fragment_voices.xml wraps the three groups in @id/params, a vertical LinearLayout\n"
          "    // with layout_marginStart=\"5dip\"; the rows go into THAT, not straight into root.\n"
          "    val paramsBox = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL }\n"
          "    root.addView(paramsBox, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { marginStart = dpToPx(context, 5) })\n"
          "    fun addSliderRow(labelString: String, prefSuffix: String, maxValue: Int) {\n"
          "        paramsBox.addView(android.widget.TextView(context).apply { text = labelString; gravity = android.view.Gravity.CENTER },\n"
          "            LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n"
          "        val sliderRow = LinearLayout(context).apply { orientation = LinearLayout.HORIZONTAL }\n"
          "        val minusButton = android.widget.Button(context, null, android.R.attr.buttonStyleSmall).apply { text = \"-\"; contentDescription = \"Decrease \" + labelString.lowercase() }\n"
          "        val seekBar = SeekBar(context).apply { max = maxValue; secondaryProgress = 0; accessibilityLiveRegion = View.ACCESSIBILITY_LIVE_REGION_POLITE }\n"
          "        val plusButton = android.widget.Button(context, null, android.R.attr.buttonStyleSmall).apply { text = \"+\"; contentDescription = \"Increase \" + labelString.lowercase() }\n"
          "        sliderRow.addView(minusButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.START })\n"
          "        sliderRow.addView(seekBar, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply { gravity = android.view.Gravity.CENTER })\n"
          "        sliderRow.addView(plusButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { gravity = android.view.Gravity.END })\n"
          "        paramsBox.addView(sliderRow, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))\n"
          "        sliderRows.add(SliderRow(seekBar, prefSuffix))\n"
          "        // j.P1: the cached field takes the raw progress, is floored at 10 — and only then is\n"
          "        // the bar pushed back to 10 — and the entry is written behind the bounds check. c3.k.a\n"
          "        // then reports the CACHED value against the literal max, outside that check.\n"
          "        seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {\n"
          "            override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {\n"
          "                setCached(prefSuffix, progress)\n"
          "                if (progress < 10) { setCached(prefSuffix, 10); seekBar.progress = 10 }\n"
          "                writeEntry(prefSuffix, cached(prefSuffix))\n"
          "                if (android.os.Build.VERSION.SDK_INT >= 30) seekBar.stateDescription = cached(prefSuffix).toString() + \" of \" + maxValue\n"
          "            }\n"
          "            override fun onStartTrackingTouch(seekBar: SeekBar?) {}\n"
          "            override fun onStopTrackingTouch(seekBar: SeekBar?) {}\n"
          "        })\n"
          "        // j.K1 speed-, M1 volume-, I1 pitch-. Only M1 bounds-checks the write, and only M1\n"
          "        // and N1 write before setProgress; the others differ, so each one is spelled out.\n"
          "        minusButton.setOnClickListener {\n"
          "            when (prefSuffix) {\n"
          "                \"_speed\" -> { speedValue -= 5; if (speedValue < 10) speedValue = 10; writeEntryUnchecked(\"_speed\", speedValue); seekBar.progress = speedValue }\n"
          "                \"_volume\" -> { volumeValue -= 5; if (volumeValue < 10) volumeValue = 10; writeEntry(\"_volume\", volumeValue); seekBar.progress = volumeValue }\n"
          "                else -> { pitchValue -= 5; if (pitchValue < 10) pitchValue = 10; writeEntryUnchecked(\"_pitch\", pitchValue); seekBar.progress = pitchValue }\n"
          "            }\n"
          "        }\n"
          "        // j.L1 speed+, N1 volume+, J1 pitch+. L1 alone pushes the bar before it writes.\n"
          "        plusButton.setOnClickListener {\n"
          "            when (prefSuffix) {\n"
          "                \"_speed\" -> { speedValue += 5; if (speedValue > seekBar.max) speedValue = seekBar.max; seekBar.progress = speedValue; writeEntry(\"_speed\", speedValue) }\n"
          "                \"_volume\" -> { volumeValue += 5; if (volumeValue > seekBar.max) volumeValue = seekBar.max; writeEntry(\"_volume\", volumeValue); seekBar.progress = volumeValue }\n"
          "                else -> { pitchValue += 5; if (pitchValue > seekBar.max) pitchValue = seekBar.max; writeEntryUnchecked(\"_pitch\", pitchValue); seekBar.progress = pitchValue }\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "    val defaultButton = android.widget.Button(context, null, android.R.attr.buttonStyleSmall).apply { text = \"Default\"; contentDescription = \"Default\" }\n"
          "    var selectedIso = \"\"\n"
          "    // c3.j.b1 — the language spinner position. Every c3.e read and write in this tab goes\n"
          "    // through m.c.get(b1), never through a lookup by iso3: m.h keys its entries on the\n"
          "    // display NAME, so two entries can carry the same iso3 and only the index tells them apart.\n"
          "    var selectedLangIndex = -1\n"
          "    var voiceRows: List<EngineFinder.ScanVoice?> = emptyList()\n"
          "    var variantOptions: List<String> = emptyList()\n"
          "    // The four accessors the slider handlers use; assigned here because they close over\n"
          "    // b1, which is declared after addSliderRow. e.c is speed, e.d volume, e.e pitch.\n"
          "    cached = { suffix -> when (suffix) { \"_speed\" -> speedValue; \"_volume\" -> volumeValue; else -> pitchValue } }\n"
          "    setCached = { suffix, value -> when (suffix) { \"_speed\" -> speedValue = value; \"_volume\" -> volumeValue = value; else -> pitchValue = value } }\n"
          "    writeEntry = { suffix, value ->\n"
          "        if (selectedLangIndex >= 0 && selectedLangIndex < LangStore.languages.size) {\n"
          "            val entry = LangStore.languages[selectedLangIndex]\n"
          "            when (suffix) { \"_speed\" -> entry.speed = value; \"_volume\" -> entry.volume = value; else -> entry.pitch = value }\n"
          "        }\n"
          "    }\n"
          "    writeEntryUnchecked = { suffix, value ->\n"
          "        val entry = LangStore.languages[selectedLangIndex]\n"
          "        when (suffix) { \"_speed\" -> entry.speed = value; \"_volume\" -> entry.volume = value; else -> entry.pitch = value }\n"
          "    }\n"
          "    // AutoTTS j.O1 refreshes B0 (speed), then D0 (pitch), then C0 (volume), and hands the\n"
          "    // stored value straight to setProgress — SeekBar clamps it itself.\n"
          "    fun reloadSliders() {\n"
          "        val entry = LangStore.languages[selectedLangIndex]\n"
          "        for (suffix in listOf(\"_speed\", \"_pitch\", \"_volume\")) {\n"
          "            val rowInfo = sliderRows.firstOrNull { it.prefSuffix == suffix } ?: continue\n"
          "            rowInfo.seekBar.progress = when (suffix) {\n"
          "                \"_speed\" -> entry.speed\n"
          "                \"_pitch\" -> entry.pitch\n"
          "                else -> entry.volume\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "    val rawPrefs = context.getSharedPreferences(\"easy_voice_settings\", Context.MODE_PRIVATE)\n"
          "    // AutoTTS reads w.e (in memory). It is seeded once per voice by c3.m.a() from\n"
          "    // c3.m.s(ctx, key) = Integer.parseInt(getString(key, \"1000\")); after that only\n"
          "    // c3.w.h() changes it. Fall back to prefs the first time a key is seen.\n"
          "    fun voiceOrder(key: String): Int {\n"
          "        EngineFinder.voiceWeights[key]?.let { return it }\n"
          "        // m.s: Integer.parseInt(getString(key, \"1000\")) — no catch. A malformed\n"
          "        // stored weight throws in AutoTTS too.\n"
          "        val storedWeight = (rawPrefs.getString(key, \"1000\") ?: \"1000\").toInt()\n"
          "        EngineFinder.voiceWeights[key] = storedWeight\n"
          "        return storedWeight\n"
          "    }\n"
          "    fun voiceKey(row: EngineFinder.ScanVoice?): String = if (row == null) \"Disable#\" + Locale(selectedIso).toString() else row.pkg + \"#\" + row.locale.toString()\n"
          "    fun rowLabel(row: EngineFinder.ScanVoice?): String {\n"
          "        if (row == null) return \"*Disabled\"\n"
          "        val abbr = abbreviateEngineName(row.engineName)\n"
          "        return if (row.locale.country.isNotEmpty()) abbr + \", \" + row.locale.getDisplayCountry() else abbr\n"
          "    }\n"
          "    // AutoTTS j.Y2() variant half: nothing happens at all while m.e is empty (J0 keeps\n"
          "    // whatever adapter it had); m.e[0].d() == \"*Disabled\" -> J0.setAdapter(null);\n"
          "    // an empty m.c[b1].h is written back as \"\" before the list is built.\n"
          "    fun refreshVariantSpinner() {\n"
          "        if (voiceRows.isEmpty()) return\n"
          "        val picked = voiceRows[0]\n"
          "        if (picked == null) {\n"
          "            variantOptions = emptyList(); variantSpinner.adapter = null; return\n"
          "        }\n"
          "        val base = picked.variants.toList()\n"
          "        // Literal j.Y2: the array is sized at m.e[0].f.size(), the stored variant goes to\n"
          "        // slot 0 and every OTHER entry is appended after it, then Arrays.sort(arr, 1, n4-1)\n"
          "        // leaves both slot 0 and the last slot in place. When the stored variant is not in\n"
          "        // this voice's list the fill writes one past the end — AutoTTS throws there and O1\n"
          "        // does not catch it in the voice branch. Reproduced as-is; not \"fixed\".\n"
          "        val slotCount = base.size\n"
          "        val ordered = Array(slotCount) { \"\" }\n"
          "        // Y2 reads m.c.get(b1).h — the in-memory entry, not SharedPreferences — and when\n"
          "        // it is empty it writes \"\" back into that same entry before building the list.\n"
          "        val langEntry = LangStore.languages.getOrNull(selectedLangIndex)\n"
          "        var savedVariant = langEntry?.variant ?: \"*Default\"\n"
          "        if (savedVariant.isEmpty()) { langEntry?.variant = \"\"; savedVariant = \"\" }\n"
          "        if (savedVariant.isNotEmpty()) {\n"
          "            ordered[0] = savedVariant\n"
          "            var nextSlot = 1\n"

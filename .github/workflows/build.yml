          "    gravity = android.view.Gravity.CENTER_VERTICAL\n"
          "    setPadding(dp(context, 10), dp(context, 6), dp(context, 10), dp(context, 6))\n"
          "    layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(context, 6); bottomMargin = dp(context, 2) }\n"
          "}\n"
          "private fun bodyText(context: Context, text: String): TextView = TextView(context).apply {\n"
          "    this.text = text\n"
          "    textSize = 14f  // AutoTTS description text = TextAppearance.Small (≈14sp)\n"
          "    setPadding(0, 0, 0, dp(context, 6))\n"
          "}\n"
          "private fun labelText(context: Context, text: String): TextView = TextView(context).apply {\n"
          "    this.text = text\n"
          "    textSize = 18f  // AutoTTS field labels = TextAppearance.Medium (≈18sp)\n"
          "    setPadding(0, dp(context, 8), 0, dp(context, 2))\n"
          "}\n"
          "private fun subHeader(context: Context, text: String): TextView = TextView(context).apply {\n"
          "    // AutoTTS non-bar sub-label (\"Experimental\", auto_mode_options): TextAppearance.Medium,\n"
          "    // default text color, NO #293842 bar.\n"
          "    this.text = text\n"
          "    textSize = 18f\n"
          "    setPadding(0, dp(context, 12), 0, dp(context, 4))\n"
          "}\n"
          "private fun displayNameFor(code: String): String {\n"
          "    val known = Languages.map[code]\n"
          "    if (known != null) return known\n"
          "    val dn = try { Locale(code).displayLanguage } catch (_: Exception) { \"\" }\n"
          "    return if (dn.isNotBlank() && dn != code) dn else code.uppercase()\n"
          "}\n"
          "private fun collatorSortKey(text: String): String =\n"
          "    java.text.Normalizer.normalize(text, java.text.Normalizer.Form.NFD).replace(\"\\\\p{M}\".toRegex(), \"\")\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// Languages tab — AutoTTS fragment_languages + M2()/s2() (checkable list,\n"
          "// search, Select all / Clear all / Show selected)\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "fun buildLanguagesTabView(context: Context, prefs: SharedPrefsManager): View {\n"
          "    val readingMode = prefs.getReadingMode()\n"
          "    val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(context, 16), dp(context, 8), dp(context, 16), dp(context, 0)) }\n"
          "    if (readingMode == \"none\" || readingMode == \"dual\") {\n"
          "        // AutoTTS M2: language selection is not available in None/Dual modes.\n"
          "        root.addView(headerText(context, \"Select languages\"))\n"
          "        root.addView(labelText(context, \"Language selection is not available for \\\"None\\\" and \\\"Dual languages\\\" modes.\"))\n"
          "        return root\n"
          "    }\n"
          "    root.addView(headerText(context, \"Select languages\"))\n"
          "    root.addView(bodyText(context, \"Select all languages you'd like to work with.\"))\n"
          "    root.addView(bodyText(context, \"Noted that below list contains only languages supported by TTS engines on your device.\"))\n"
          "    // AutoTTS k.n(): the current mode's force-enabled languages cannot be disabled here.\n"
          "    val deviceIso3 = try { Locale.getDefault().isO3Language } catch (_: Exception) { \"eng\" }\n"
          "    fun normIso3(value: String) = if (value.isEmpty()) deviceIso3 else prefs.toIso3(value)\n"
          "    val forceEnabledIso3 = HashSet<String>()\n"
          "    when (readingMode) {\n"
          "        \"auto\", \"google\" -> forceEnabledIso3.add(normIso3(prefs.getString(\"auto_mode_language\", \"\")))\n"
          "        \"mix\" -> { forceEnabledIso3.add(normIso3(prefs.getString(\"mixed_mode_latin_language\", \"\"))); forceEnabledIso3.add(normIso3(prefs.getString(\"mixed_mode_non_latin_language\", \"\"))) }\n"
          "    }\n"
          "    fun isForceEnabled(code: String) = prefs.toIso3(code) in forceEnabledIso3\n"
          "    var allEntries: List<Pair<String, String>> = emptyList()   // code → display label\n"
          "    val checkedCodes = HashSet<String>()\n"
          "    var filteredCodes: List<String> = emptyList()\n"
          "    var searchQuery = \"\"\n"
          "    var showSelectedOnly = false\n"
          "    // AutoTTS fragment_languages order: description → button row → SearchView → ListView.\n"
          "    val buttonRow = LinearLayout(context).apply { orientation = LinearLayout.HORIZONTAL }\n"
          "    val selectAllButton = Button(context).apply { text = \"Select\\nall\" }\n"
          "    val clearAllButton = Button(context).apply { text = \"Clear\\nall\" }\n"
          "    val showSelectedButton = Button(context).apply { text = \"Show\\nselected\" }\n"
          "    buttonRow.addView(selectAllButton); buttonRow.addView(clearAllButton)\n"
          "    buttonRow.addView(View(context), LinearLayout.LayoutParams(0, 1, 1f))\n"
          "    buttonRow.addView(showSelectedButton)\n"
          "    root.addView(buttonRow)\n"
          "    val searchView = SearchView(context).apply { queryHint = \"Search languages\"; isIconified = false; clearFocus() }\n"
          "    root.addView(searchView)\n"
          "    val statusText = bodyText(context, \"Loading languages…\")\n"
          "    root.addView(statusText)\n"
          "    // AutoTTS Languages list (c3.i q0 adapter): a CHOICE_MODE_MULTIPLE ListView backed by an\n"
          "    // ArrayAdapter over the framework layout AutoTTS uses — super(context, 0x1090010) =\n"
          "    // simple_list_item_activated_1: a single-TextView row whose SELECTED state shows as an\n"
          "    // activated-background HIGHLIGHT (not a checkmark). CHOICE_MODE_MULTIPLE still exposes the\n"
          "    // checked state to TalkBack. (row_layout.xml is NOT used by the languages list.)\n"
          "    val listView = ListView(context).apply { choiceMode = ListView.CHOICE_MODE_MULTIPLE }\n"
          "    root.addView(listView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))\n"
          "    val listAdapter = ArrayAdapter<String>(context, android.R.layout.simple_list_item_activated_1, ArrayList())\n"
          "    listView.adapter = listAdapter\n"
          "    fun refreshList() {\n"
          "        filteredCodes = allEntries.filter { (code, label) ->\n"
          "            (searchQuery.isBlank() || label.contains(searchQuery, ignoreCase = true)) &&\n"
          "            (!showSelectedOnly || code in checkedCodes)\n"
          "        }.map { it.first }\n"
          "        val labels = filteredCodes.map { code -> allEntries.first { it.first == code }.second }\n"
          "        listAdapter.clear(); listAdapter.addAll(labels); listAdapter.notifyDataSetChanged()\n"
          "        for (index in filteredCodes.indices) listView.setItemChecked(index, filteredCodes[index] in checkedCodes)\n"
          "        statusText.visibility = if (allEntries.isEmpty()) View.VISIBLE else View.GONE\n"
          "    }\n"
          "    listView.setOnItemClickListener { _, _, position, _ ->\n"
          "        if (position !in filteredCodes.indices) return@setOnItemClickListener\n"
          "        val code = filteredCodes[position]\n"
          "        // AutoTTS onItemClick: a force-enabled (k.n) language snaps back to checked.\n"
          "        val enable = if (isForceEnabled(code)) true else code !in checkedCodes\n"
          "        prefs.setLanguageDisabled(code, !enable)\n"
          "        if (enable) checkedCodes.add(code) else checkedCodes.remove(code)\n"
          "        listView.setItemChecked(position, enable)\n"
          "    }\n"
          "    selectAllButton.setOnClickListener {\n"
          "        allEntries.forEach { prefs.setLanguageDisabled(it.first, false) }\n"
          "        checkedCodes.clear(); checkedCodes.addAll(allEntries.map { it.first })\n"
          "        refreshList()\n"
          "    }\n"
          "    clearAllButton.setOnClickListener {\n"
          "        // AutoTTS clear_all: force-enabled languages stay checked, everything else disables.\n"
          "        allEntries.forEach { prefs.setLanguageDisabled(it.first, !isForceEnabled(it.first)) }\n"
          "        checkedCodes.clear(); checkedCodes.addAll(allEntries.map { it.first }.filter { isForceEnabled(it) })\n"
          "        refreshList()\n"
          "    }\n"
          "    showSelectedButton.setOnClickListener {\n"
          "        showSelectedOnly = !showSelectedOnly\n"
          "        showSelectedButton.text = if (showSelectedOnly) \"Show\\nall\" else \"Show\\nselected\"\n"
          "        refreshList()\n"
          "    }\n"
          "    searchView.setOnQueryTextListener(object : SearchView.OnQueryTextListener {\n"
          "        override fun onQueryTextSubmit(query: String?): Boolean = false\n"
          "        override fun onQueryTextChange(newText: String?): Boolean { searchQuery = newText ?: \"\"; refreshList(); return true }\n"
          "    })\n"
          "    // AutoTTS M2(): Google mode (L=3) → only Google TTS's languages; Auto/Mix → all engines.\n"
          "    val scopedPkg = if (readingMode == \"google\") \"com.google.android.tts\" else null\n"
          "    val mainHandler = Handler(Looper.getMainLooper())\n"
          "    try {\n"
          "        EngineFinder.scanLanguages(context, scopedPkg) { scannedLangs ->\n"
          "            mainHandler.post {\n"
          "                val collator = java.text.Collator.getInstance()\n"
          "                allEntries = scannedLangs.map { code -> Pair(code, displayNameFor(code) + \" (\" + code + \")\") }\n"
          "                    .sortedWith { a, b -> collator.compare(collatorSortKey(a.second), collatorSortKey(b.second)) }\n"
          "                checkedCodes.clear()\n"
          "                checkedCodes.addAll(allEntries.map { it.first }.filter { !prefs.isLanguageDisabled(it) || isForceEnabled(it) })\n"
          "                statusText.text = \"No TTS engine languages found.\"\n"
          "                refreshList()\n"
          "            }\n"
          "        }\n"
          "    } catch (_: Exception) { statusText.text = \"No TTS engine languages found.\" }\n"
          "    return root\n"
          "}\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "// Voices tab — AutoTTS fragment_voices + O2()/O1()/R2()/w2()/P1()/P2():\n"
          "// language spinner → voice spinner → variant spinner → Test → sliders →\n"
          "// Default → Experimental/dedicated. Same structure as the previous page.\n"
          "// ─────────────────────────────────────────────────────────────────────────\n"
          "private data class EngineVoiceEntry(val pkg: String, val engineName: String, val locTag: String, val label: String)\n"
          "// AutoTTS c3.u.g(): abbreviate a multi-word engine name toward ~15 chars as \"First ... Last\".\n"
          "private fun abbreviateEngineName(name: String): String {\n"
          "    val parts = name.split(\" \")\n"
          "    if (parts.size < 2) return name\n"
          "    val headBuf = StringBuilder(parts[0])\n"
          "    val tailBuf = StringBuilder(parts[parts.size - 1])\n"
          "    var headIdx = 1\n"
          "    var tailIdx = parts.size - 2\n"
          "    var best = \"$headBuf ... $tailBuf\"\n"
          "    while (headIdx < tailIdx) {\n"
          "        if (best.length > 15) return best\n"
          "        val candidate = \"$headBuf ... $tailBuf\"\n"
          "        if (candidate.length > 15) return if (candidate.length >= 20) best else candidate\n"
          "        if (parts[headIdx].length < parts[tailIdx].length) { headBuf.append(\" \").append(parts[headIdx]); headIdx++ }\n"
          "        else { tailBuf.insert(0, parts[tailIdx] + \" \"); tailIdx-- }\n"
          "        best = candidate\n"
          "    }\n"
          "    return if (name.length >= 15) best else name\n"
          "}\n"
          "fun buildVoicesTabView(context: Context, prefs: SharedPrefsManager, testTtsProvider: () -> TextToSpeech?): View {\n"
          "    val readingMode = prefs.getReadingMode()\n"
          "    val root = LinearLayout(context).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(context, 16), dp(context, 8), dp(context, 16), dp(context, 16)) }\n"
          "    val scroll = ScrollView(context).apply { addView(root) }\n"
          "    if (readingMode == \"none\") {\n"
          "        // AutoTTS O2: Voices settings are not available in \"None\" mode.\n"
          "        root.addView(headerText(context, \"Voice Settings\"))\n"
          "        root.addView(labelText(context, \"Voices settings aren't available for \\\"None\\\" mode.\"))\n"
          "        return scroll\n"
          "    }\n"
          "    val mainHandler = Handler(Looper.getMainLooper())\n"
          "    root.addView(headerText(context, \"Voice Settings\"))\n"
          "    root.addView(bodyText(context, \"Choose an installed voice for each language.\\nRecommendation: Assign ONE engine PER language to avoid switching delay.\"))\n"
          "    // ── Select language ──\n"
          "    root.addView(labelText(context, \"Select language:\"))\n"
          "    val languageSpinner = Spinner(context)\n"
          "    root.addView(languageSpinner)\n"
          "    // ── Choose a voice (engine × locale) ──\n"
          "    root.addView(labelText(context, \"Choose a voice for above language:\"))\n"
          "    val voiceSpinner = Spinner(context)\n"
          "    root.addView(voiceSpinner)\n"
          "    // ── Choose a variant ──\n"
          "    root.addView(labelText(context, \"Choose a variant for voice:\"))\n"
          "    val variantSpinner = Spinner(context)\n"
          "    root.addView(variantSpinner)\n"
          "    // ── Test (AutoTTS P2: the persistent self-engine client speaks the bypass-tagged sample) ──\n"
          "    val testButton = Button(context).apply { text = \"Test\" }\n"
          "    root.addView(testButton)\n"
          "    // ── Sliders (AutoTTS P1/L1/J1: label + \"-\" cd Decrease + SeekBar + \"+\" cd Increase, min 10, ±5) ──\n"
          "    var persistSlider: (String, Int) -> Unit = { _, _ -> }\n"
          "    data class SliderRow(val bar: SeekBar, val prefSuffix: String)\n"
          "    val sliderRows = mutableListOf<SliderRow>()\n"
          "    fun addSliderRow(labelString: String, prefSuffix: String, maxValue: Int) {\n"
          "        root.addView(TextView(context).apply { text = labelString; gravity = android.view.Gravity.CENTER_HORIZONTAL; setPadding(0, dp(context, 10), 0, 0) })\n"
          "        val row = LinearLayout(context).apply { orientation = LinearLayout.HORIZONTAL; gravity = android.view.Gravity.CENTER_VERTICAL }\n"
          "        val minusButton = Button(context).apply { text = \"-\"; contentDescription = \"Decrease \" + labelString.lowercase() }\n"
          "        val seekBar = SeekBar(context).apply { max = maxValue }\n"
          "        val plusButton = Button(context).apply { text = \"+\"; contentDescription = \"Increase \" + labelString.lowercase() }\n"
          "        row.addView(minusButton)\n"
          "        row.addView(seekBar, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))\n"
          "        row.addView(plusButton)\n"
          "        root.addView(row)\n"
          "        sliderRows.add(SliderRow(seekBar, prefSuffix))\n"
          "        seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {\n"
          "            override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {\n"
          "                if (!fromUser) return\n"
          "                // AutoTTS P1: floored at 10 — the seekbar never persists below.\n"
          "                val clamped = if (progress < 10) 10 else progress\n"
          "                if (clamped != progress) seekBar.progress = clamped\n"
          "                persistSlider(prefSuffix, clamped)\n"
          "            }\n"
          "            override fun onStartTrackingTouch(bar: SeekBar?) {}\n"
          "            override fun onStopTrackingTouch(bar: SeekBar?) {}\n"
          "        })\n"
          "        minusButton.setOnClickListener { val v = maxOf(10, seekBar.progress - 5); seekBar.progress = v; persistSlider(prefSuffix, v) }\n"
          "        plusButton.setOnClickListener { val v = minOf(maxValue, seekBar.progress + 5); seekBar.progress = v; persistSlider(prefSuffix, v) }\n"
          "    }\n"
          "    // ── Default ──\n"
          "    val defaultButton = Button(context).apply { text = \"Default\" }\n"
          "    // ── state ──\n"
          "    var languageCodes: List<String> = emptyList()\n"
          "    var selectedIso = \"\"\n"
          "    var voiceEntries: List<EngineVoiceEntry> = emptyList()\n"
          "    var selectedEnginePkg = \"NOT_SET\"\n"
          "    var selectedLocaleTag = \"\"\n"
          "    var variantOptions: List<String> = emptyList()\n"
          "    persistSlider = { prefSuffix, value -> if (selectedIso.isNotEmpty()) prefs.setInt(prefs.toIso3(selectedIso) + prefSuffix, value) }\n"
          "    fun reloadSliders() {\n"
          "        if (selectedIso.isEmpty()) return\n"
          "        val iso3 = prefs.toIso3(selectedIso)\n"
          "        for (rowInfo in sliderRows) {\n"
          "            val stored = prefs.getInt(iso3 + rowInfo.prefSuffix, 100)\n"
          "            rowInfo.bar.progress = stored.coerceIn(0, rowInfo.bar.max)\n"
          "        }\n"
          "    }\n"
          "    // localeMatchesIso — same semantic match the Compose page used (language ISO3 + country).\n"
          "    fun localeMatchesIso(candidate: Locale, iso: String): Boolean {\n"
          "        val lang = candidate.language.lowercase()\n"
          "        val tag = try { candidate.toLanguageTag().lowercase() } catch (_: Exception) { \"\" }\n"
          "        val target = iso.lowercase()\n"
          "        if (lang == target || tag == target || tag.startsWith(\"$target-\")) return true\n"
          "        return try {\n"
          "            val targetLocale = Locale.forLanguageTag(target)\n"
          "            if (candidate.isO3Language.lowercase() != targetLocale.isO3Language.lowercase()) return false\n"
          "            if (targetLocale.country.isEmpty()) return true\n"
          "            if (candidate.country.lowercase() == targetLocale.country.lowercase()) return true\n"
          "            candidate.isO3Country.lowercase() == targetLocale.isO3Country.lowercase()\n"
          "        } catch (_: Exception) { false }\n"
          "    }\n"
          "    // AutoTTS c3.k.b() variant match: ISO3 language (zho-fold) + ISO3 country, case-insensitive.\n"
          "    fun variantLocaleMatches(voiceLocale: Locale, tag: String): Boolean = try {\n"
          "        val target = Locale.forLanguageTag(tag)\n"
          "        fun iso3Lang(l: Locale) = l.isO3Language.let { if (it == \"cmn\" || it == \"lzh\" || it == \"gan\" || it == \"hak\") \"zho\" else it }\n"
          "        fun iso3Country(l: Locale) = try { l.isO3Country } catch (_: Exception) { \"\" }\n"
          "        iso3Lang(voiceLocale).equals(iso3Lang(target), ignoreCase = true) && iso3Country(voiceLocale).equals(iso3Country(target), ignoreCase = true)\n"
          "    } catch (_: Exception) { false }\n"
          "    // Transient engine client with a watchdog — used for voice/variant enumeration.\n"
          "    fun withEngineClient(pkg: String, onReady: (TextToSpeech?) -> Unit) {\n"
          "        val holder = arrayOfNulls<TextToSpeech>(1)\n"
          "        val finished = java.util.concurrent.atomic.AtomicBoolean(false)\n"
          "        val finish: (TextToSpeech?) -> Unit = { client ->\n"
          "            if (finished.compareAndSet(false, true)) { mainHandler.post { onReady(client); try { holder[0]?.shutdown() } catch (_: Exception) {} } }\n"
          "        }\n"
          "        try {\n"
          "            holder[0] = TextToSpeech(context.applicationContext, { status -> if (status == TextToSpeech.SUCCESS) finish(holder[0]) else finish(null) }, pkg)\n"
          "            mainHandler.postDelayed({ finish(null) }, 2500L)\n"
          "        } catch (_: Exception) { finish(null) }\n"
          "    }\n"
          "    fun refreshVariantSpinner() {\n"
          "        val apply: (List<String>) -> Unit = { names ->\n"
          "            // AutoTTS R2() (:1598-1634): saved variant pinned at index 0, base list is\n"
          "            // [\"*Default\", ...names], middle range sorted (last element untouched — quirk kept).\n"
          "            val base = listOf(\"*Default\") + names\n"
          "            val savedVariant = prefs.getVoiceName(selectedIso)\n"
          "            val ordered = if (savedVariant.isNotEmpty()) (listOf(savedVariant) + base.filter { it != savedVariant }).toMutableList() else base.toMutableList()\n"
          "            if (ordered.size > 2) {\n"
          "                val middle = ordered.subList(1, ordered.size - 1).sorted()\n"
          "                for (i in middle.indices) ordered[1 + i] = middle[i]\n"
          "            }\n"
          "            variantOptions = ordered.distinct()\n"
          "            val adapter = ArrayAdapter(context, android.R.layout.simple_spinner_item, variantOptions)\n"
          "            adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)\n"
          "            variantSpinner.adapter = adapter\n"
          "            val savedIndex = variantOptions.indexOf(savedVariant)\n"
          "            if (savedIndex >= 0) variantSpinner.setSelection(savedIndex)\n"
          "        }\n"
          "        if (selectedEnginePkg == \"NOT_SET\" || selectedLocaleTag.isEmpty()) { apply(emptyList()); return }\n"
          "        withEngineClient(selectedEnginePkg) { client ->\n"
          "            val names = try { client?.voices?.filter { variantLocaleMatches(it.locale, selectedLocaleTag) }?.map { it.name }?.sorted() ?: emptyList() } catch (_: Exception) { emptyList() }\n"
          "            apply(names)\n"
          "        }\n"
          "    }\n"
          "    fun refreshVoiceSpinner() {\n"
          "        val labels = listOf(\"--- Not Set ---\") + voiceEntries.map { it.label }\n"
          "        val adapter = ArrayAdapter(context, android.R.layout.simple_spinner_item, labels)\n"
          "        adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)\n"
          "        voiceSpinner.adapter = adapter\n"
          "        // Stored selection: exact tag → semantic language+country → same engine → Not Set.\n"
          "        var selectionIndex = 0\n"
          "        val storedIdx = voiceEntries.indexOfFirst { it.pkg == selectedEnginePkg && it.locTag == selectedLocaleTag }\n"
          "        if (storedIdx >= 0) selectionIndex = storedIdx + 1\n"
          "        else {\n"
          "            val semanticIdx = voiceEntries.indexOfFirst { entry ->\n"
          "                entry.pkg == selectedEnginePkg && selectedLocaleTag.isNotEmpty() && try {\n"
          "                    val a = Locale.forLanguageTag(entry.locTag); val b = Locale.forLanguageTag(selectedLocaleTag)\n"
          "                    a.language.equals(b.language, true) && a.country.equals(b.country, true)\n"
          "                } catch (_: Exception) { false }\n"
          "            }\n"
          "            if (semanticIdx >= 0) selectionIndex = semanticIdx + 1\n"
          "            else { val pkgIdx = voiceEntries.indexOfFirst { it.pkg == selectedEnginePkg }; if (pkgIdx >= 0) selectionIndex = pkgIdx + 1 }\n"
          "        }\n"
          "        voiceSpinner.setSelection(selectionIndex)\n"
          "    }\n"
          "    fun rescanVoiceEntries() {\n"
          "        val iso = selectedIso\n"
          "        if (iso.isEmpty()) return\n"
          "        val engines = EngineFinder.getEngines(context).filter { it.pkg != \"NOT_SET\" }\n"
          "        val collected = java.util.Collections.synchronizedList(mutableListOf<EngineVoiceEntry>())\n"
          "        var remaining = engines.size\n"
          "        if (engines.isEmpty()) { voiceEntries = emptyList(); refreshVoiceSpinner(); return }\n"
          "        for (engineInfo in engines) {\n"
          "            withEngineClient(engineInfo.pkg) { client ->\n"
          "                if (client != null) {\n"
          "                    val locales = LinkedHashSet<Locale>()\n"
          "                    try { client.availableLanguages?.filter { localeMatchesIso(it, iso) }?.let { locales.addAll(it) } } catch (_: Exception) {}\n"
          "                    try { client.voices?.map { it.locale }?.filter { localeMatchesIso(it, iso) }?.let { locales.addAll(it) } } catch (_: Exception) {}\n"
          "                    val unique = locales.distinctBy { it.language.lowercase() + \"_\" + it.country.lowercase() }.sortedBy { it.displayName }\n"
          "                    for (loc in unique) {\n"
          "                        val abbr = abbreviateEngineName(engineInfo.name)\n"
          "                        val label = if (loc.country.isNotEmpty()) abbr + \", \" + loc.getDisplayCountry() else abbr\n"
          "                        collected.add(EngineVoiceEntry(engineInfo.pkg, engineInfo.name, loc.toLanguageTag(), label))\n"
          "                    }\n"
          "                }\n"
          "                remaining--\n"
          "                if (remaining <= 0) { voiceEntries = collected.toList(); refreshVoiceSpinner(); refreshVariantSpinner() }\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "    fun onLanguageSelected(iso: String) {\n"
          "        selectedIso = iso\n"
          "        selectedEnginePkg = prefs.getEngineForLanguage(iso)\n"
          "        selectedLocaleTag = prefs.getLocaleForLangPkg(iso, selectedEnginePkg)\n"
          "        reloadSliders()\n"
          "        rescanVoiceEntries()\n"
          "    }\n"
          "    languageSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {\n"

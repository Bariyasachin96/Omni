          "                } else if (!localeMatchesP(locale, curLocale)) {\n"
          "                    val r3 = wrapper.tts?.setLanguage(locale)\n"
          "                    if (r3 != null && r3 >= 0) { wrapper.localeSet = true; EasyVoiceLogger.d(\"[ENGINE] V Set voice 3 (setLanguage $locale)\") } else restoreEngine(wrapper.realPkg)\n"
          "                }\n"
          "            }\n"
          "            wrapper.locale = locale; wrapper.voiceName = effVariant\n"
          "        } else { EasyVoiceLogger.e(\"[ENGINE] V TTS is not ready engineIndex=-1\"); engineIndex = -1 }\n"
          "    }\n"
          "    private fun loadVoiceOriginal(pkg: String, locale: java.util.Locale) {\n"
          "        val normPkg = (if (pkg.isEmpty()) lastEnginePkg else { lastEnginePkg = pkg; pkg }).replace(\"-\",\"\").replace(\"_\",\"\")\n"
          "        var idx = -1\n"
          "        for (n in 0 until enginePool.size) { if (enginePool[n].pkg == normPkg && enginePool[n].state == 2) { idx = n; break } }\n"
          "        if (idx != -1) {\n"
          "            engineIndex = idx; val wrapper = enginePool[idx]\n"
          "            val wLoc = wrapper.locale\n"
          "            if (wLoc != null) {\n"
          "                val reqCountry = try { locale.isO3Country } catch (_: Exception) { \"\" }\n"
          "                val storedCountry = try { wLoc.isO3Country } catch (_: Exception) { \"\" }\n"
          "                if (localeIso3(wLoc) == localeIso3(locale) && (storedCountry == reqCountry || reqCountry.isEmpty())) return\n"
          "            }\n"
          "            val r0 = wrapper.tts?.setLanguage(locale)\n"
          "            if (r0 != null && r0 >= 0) { wrapper.localeSet = true; wrapper.locale = locale; wrapper.voiceName = \"\" } else restoreEngine(wrapper.realPkg)\n"
          "        } else { engineIndex = -1 }\n"
          "    }\n"
          "    private fun loadVoiceDedicated(pkg: String, locale: java.util.Locale, variant: String, dedicated: Boolean) {\n"
          "        EasyVoiceLogger.d(\"[ENGINE] loadVoice_Secondary $pkg $locale $variant\")\n"
          "        val normPkg = (if (pkg.isEmpty()) lastEnginePkg else { lastEnginePkg = pkg; pkg }).replace(\"-\",\"\").replace(\"_\",\"\")\n"
          "        var idx = -1\n"
          "        for (n in 0 until enginePool.size) { if (enginePool[n].pkg == normPkg && enginePool[n].state == 2) { idx = n; break } }\n"
          "        if (idx == -1) { EasyVoiceLogger.e(\"[ENGINE] loadVoice_Secondary TTS not ready engineIndex=-1\"); engineIndex = -1; return }\n"
          "        val prevD = engineIndex\n"
          "        engineIndex = idx\n"
          "        val wrapper = enginePool[idx]\n"
          "        if (dedicated && wrapper.localeSet) return\n"
          "        val engineVoice = try { wrapper.tts?.voice } catch (_: Exception) { null }\n"
          "        val engineLocale = engineVoice?.locale ?: java.util.Locale(\"zxx\")\n"
          "        val engineName = engineVoice?.name ?: \"\"\n"
          "        if (prevD == engineIndex && engineVoice != null &&\n"
          "            localeMatchesP(locale, engineLocale) &&\n"
          "            (engineName == variant || variant == \"*Default\" || variant.isEmpty())) {\n"
          "            EasyVoiceLogger.d(\"[ENGINE] loadVoice_Secondary *0 Do nothing\"); return\n"
          "        }\n"
          "        var effVariant = variant\n"
          "        run {\n"
          "            for (n in 0 until voiceList.size) {\n"
          "                val parts = voiceList[n].split(\"#\")\n"
          "                if (parts.size < 2 || parts[0] != normPkg) continue\n"
          "                for (iso in prefs.getLanguageList()) {\n"
          "                    val cp = prefs.getString(iso, \"\").split(\"#\", limit = 2)\n"
          "                    if (cp.size != 2 || cp[0] != normPkg) continue\n"
          "                    val dLoc = parseVoiceNameAsLocale(cp[1])\n"
          "                    val savedVariant = prefs.getVoiceName(iso)\n"
          "                    if (dLoc == null || !localeMatchesP(locale, dLoc) || savedVariant.isEmpty()) continue\n"
          "                    effVariant = savedVariant\n"
          "                    break\n"
          "                }\n"
          "                break\n"
          "            }\n"
          "        }\n"
          "        EasyVoiceLogger.d(\"[ENGINE] loadVoice_Secondary Variant $effVariant Locale $locale\")\n"
          "        if ((effVariant == \"*Default\" || effVariant.isEmpty()) && !localeMatchesP(locale, engineLocale)) {\n"
          "            EasyVoiceLogger.d(\"[ENGINE] loadVoice_Secondary *1 setLanguage $locale\")\n"
          "            val rd1 = wrapper.tts?.setLanguage(locale)\n"
          "            if (rd1 != null && rd1 >= 0) { wrapper.localeSet = true; wrapper.locale = locale; wrapper.voiceName = locale.variant } else restoreEngine(wrapper.realPkg)\n"
          "            return\n"
          "        }\n"
          "        if (engineVoice != null &&\n"
          "            localeMatchesP(locale, engineLocale) &&\n"
          "            (engineName == effVariant || effVariant == \"*Default\" || effVariant.isEmpty())) {\n"
          "            EasyVoiceLogger.d(\"[ENGINE] loadVoice_Secondary *2.1 Do nothing\"); return\n"
          "        }\n"
          "        val voices = try { wrapper.tts?.voices } catch (_: Exception) { null }\n"
          "        if (voices != null) {\n"
          "            for (voiceObj in voices) {\n"
          "                if (!voiceObj.name.equals(effVariant, ignoreCase = true)) continue\n"
          "                val rd2 = try { wrapper.tts?.setVoice(voiceObj) } catch (_: Exception) { null }\n"
          "                if (rd2 != null && rd2 >= 0) {\n"
          "                    EasyVoiceLogger.d(\"[ENGINE] loadVoice_Secondary Set voice 2: ${voiceObj.name}\")\n"
          "                    wrapper.locale = voiceObj.locale; wrapper.voiceName = effVariant; wrapper.localeSet = true\n"
          "                    return\n"
          "                }\n"
          "                restoreEngine(wrapper.realPkg)\n"
          "                break\n"
          "            }\n"
          "        }\n"
          "        if (!localeMatchesP(locale, engineLocale)) {\n"
          "            val rd3 = wrapper.tts?.setLanguage(locale)\n"
          "            if (rd3 != null && rd3 >= 0) { wrapper.locale = locale; wrapper.voiceName = locale.variant; wrapper.localeSet = true; EasyVoiceLogger.d(\"[ENGINE] loadVoice_Secondary Set voice 3\") } else restoreEngine(wrapper.realPkg)\n"
          "        }\n"
          "    }\n"
          "    private fun initAllTTS() {\n"
          "        synchronized(this) {\n"
          "            EasyVoiceLogger.d(\"[SERVICE] initAllTTS (AutoTTS N()) — enginePool.size=${enginePool.size} engineList=$engineList\")\n"
          "            var n = 0\n"
          "            while (n < enginePool.size) { val w0 = enginePool[n]; val ae = w0.tts; w0.stopExec.execute { try { ae?.stop() } catch (_: Exception) {}; try { ae?.shutdown() } catch (_: Exception) {} }; n++ }\n"
          "            enginePool.clear(); initIndex = 0\n"
          "            if (!engineList.isEmpty()) {\n"
          "                enginePool.add(EngineWrapper(engineList[0]))\n"
          "                bindEngineKeepAlive(engineList[0])\n"
          "                try { initializingTts = TextToSpeech(applicationContext, OnInitListenerImpl(), engineList[0]) } catch (_: Exception) {}\n"
          "            }\n"
          "        }\n"
          "    }\n"
          "    inner class OnInitListenerImpl : TextToSpeech.OnInitListener {\n"
          "        override fun onInit(status: Int) {\n"
          "            if (initIndex >= engineList.size) { EasyVoiceLogger.d(\"[SERVICE] All engines initialized (1)\"); return }\n"
          "            EasyVoiceLogger.d(\"[ENGINE] onInit initIndex=$initIndex pkg=${if(initIndex<enginePool.size) enginePool[initIndex].pkg else \"?\"} status=$status\")\n"
          "            if (status == TextToSpeech.SUCCESS) {\n"
          "                if (forceAccessibilityFlag) { try { val aa = android.media.AudioAttributes.Builder().setUsage(11).setContentType(1).build(); initializingTts?.setAudioAttributes(aa); if (initIndex < enginePool.size) enginePool[initIndex].audioAttrSet = true } catch (_: Exception) {} }\n"
          "                if (initIndex < enginePool.size) { enginePool[initIndex].tts = initializingTts; enginePool[initIndex].state = 2 }\n"
          "                if (engineList[initIndex] == \"com.google.android.tts\") googleEngineIdx = initIndex\n"
          "                EasyVoiceLogger.d(\"[ENGINE] Init success initIndex=$initIndex pkg=${if(initIndex<enginePool.size) enginePool[initIndex].pkg else \"?\"}\")\n"
          "            } else {\n"
          "                if (initIndex < enginePool.size) { enginePool[initIndex].tts = initializingTts; enginePool[initIndex].state = -1 }\n"
          "                EasyVoiceLogger.d(\"[ENGINE] Init failed initIndex=$initIndex\")\n"
          "            }\n"
          "            initIndex++\n"
          "            while (initIndex < engineList.size) {\n"
          "                enginePool.add(EngineWrapper(engineList[initIndex]))\n"
          "                bindEngineKeepAlive(engineList[initIndex])\n"
          "                try { initializingTts = TextToSpeech(applicationContext, OnInitListenerImpl(), engineList[initIndex]); break } catch (_: Exception) { initIndex++ }\n"
          "            }\n"
          "            if (initIndex >= engineList.size) { EasyVoiceLogger.d(\"[SERVICE] All engines initialized (2)\") }\n"
          "        }\n"
          "    }\n"
          "    private fun restoreEngine(pkg: String?) {\n"
          "        synchronized(this) {\n"
          "            if (pkg == null || pkg.isEmpty()) return\n"
          "            EasyVoiceLogger.d(\"[ENGINE] restoreTts $pkg (AutoTTS i0)\")\n"
          "            if (restoringIndex != -1) { EasyVoiceLogger.d(\"[ENGINE] -Restoring in progress...\"); return }\n"
          "            // AutoTTS i0 matches f0.e() (the NORMALIZED pkg) against the raw incoming name, ignoring case\n"
          "            var idx = -1\n"
          "            for (n in 0 until enginePool.size) { EasyVoiceLogger.d(\"[ENGINE] -${enginePool[n].pkg}\"); if (enginePool[n].pkg.equals(pkg, ignoreCase = true)) { idx = n; break } }\n"
          "            if (idx == -1) { EasyVoiceLogger.d(\"[ENGINE] -restore package name is not found\"); return }\n"
          "            val wrapper = enginePool[idx]\n"
          "            // f0.h(): k == 0 || ((nanoTime - j)/1e6 > 3000 && k < 10)\n"
          "            if (!(wrapper.restoreCount == 0 || ((System.nanoTime() - wrapper.lastRestoreTime) / 1000000.0 > 3000.0 && wrapper.restoreCount < 10))) { EasyVoiceLogger.d(\"[ENGINE] -restore is not applicable!\"); return }\n"
          "            wrapper.lastRestoreTime = System.nanoTime(); wrapper.restoreCount++\n"
          "            restoringIndex = idx\n"
          "            EasyVoiceLogger.d(\"[ENGINE] restoreTts ${wrapper.pkg}\")\n"
          "            val old = wrapper.tts\n"
          "            try {\n"
          "                wrapper.stopExec.execute { try { old?.stop() } catch (_: Exception) {} }\n"
          "                wrapper.stopExec.execute { try { old?.shutdown() } catch (_: Exception) {} }\n"
          "            } catch (_: Exception) {}\n"
          "            initializingTts = TextToSpeech(applicationContext, RestoreInitListener(), wrapper.pkg)\n"
          "        }\n"
          "    }\n"
          "    inner class RestoreInitListener : TextToSpeech.OnInitListener {\n"
          "        override fun onInit(status: Int) {\n"
          "            val u = restoringIndex\n"
          "            if (u >= 0 && u < enginePool.size) {\n"
          "                val w = enginePool[u]\n"
          "                EasyVoiceLogger.d(\"[ENGINE] Restore ${w.pkg} res $status\")\n"
          "                if (status == TextToSpeech.SUCCESS) {\n"
          "                    if (forceAccessibilityFlag) { try { val aa = android.media.AudioAttributes.Builder().setUsage(11).setContentType(1).build(); initializingTts?.setAudioAttributes(aa); w.audioAttrSet = true } catch (_: Exception) {} }\n"
          "                    w.tts = initializingTts\n"
          "                    w.state = 2\n"
          "                    w.voiceName = \"\"\n"
          "                    w.locale = null\n"
          "                } else {\n"
          "                    w.tts = initializingTts\n"
          "                    w.state = -1\n"
          "                }\n"
          "            } else { EasyVoiceLogger.d(\"[ENGINE] ttsInitListener_restore invalid index\") }\n"
          "            restoringIndex = -1\n"
          "        }\n"
          "    }\n"
          "    private fun bindEngineKeepAlive(pkg: String) {\n"
          "        if (pkg.isEmpty() || engineBinders.containsKey(pkg)) return\n"
          "        try {\n"
          "            val intent = android.content.Intent(\"android.intent.action.TTS_SERVICE\").setPackage(pkg)\n"
          "            val ri = packageManager.resolveService(intent, 0)\n"
          "            if (ri == null || ri.serviceInfo == null) { EasyVoiceLogger.d(\"[ENGINE] No TTS service found in $pkg\"); return }\n"
          "            intent.component = android.content.ComponentName(ri.serviceInfo.packageName, ri.serviceInfo.name)\n"
          "            val conn = object : android.content.ServiceConnection {\n"
          "                override fun onServiceConnected(name: android.content.ComponentName?, service: android.os.IBinder?) { EasyVoiceLogger.d(\"[ENGINE] Keep-alive bound to $pkg\") }\n"
          "                override fun onServiceDisconnected(name: android.content.ComponentName?) { EasyVoiceLogger.d(\"[ENGINE] Engine process died: $pkg\"); restoreEngine(pkg) }\n"
          "                override fun onBindingDied(name: android.content.ComponentName?) { EasyVoiceLogger.d(\"[ENGINE] Binding died: $pkg\"); unbindEngineKeepAlive(pkg); bindEngineKeepAlive(pkg) }\n"
          "                override fun onNullBinding(name: android.content.ComponentName?) { EasyVoiceLogger.d(\"[ENGINE] Service returned null binding: $pkg\"); unbindEngineKeepAlive(pkg) }\n"
          "            }\n"
          "            val ok = try { bindService(intent, conn, android.content.Context.BIND_AUTO_CREATE or android.content.Context.BIND_IMPORTANT) } catch (_: Exception) { false }\n"
          "            if (ok) engineBinders[pkg] = conn else EasyVoiceLogger.d(\"[ENGINE] bindService failed for $pkg\")\n"
          "        } catch (_: Exception) { EasyVoiceLogger.e(\"[ENGINE] bindService error for $pkg\") }\n"
          "    }\n"
          "    private fun unbindEngineKeepAlive(pkg: String) {\n"
          "        val conn = engineBinders.remove(pkg) ?: return\n"
          "        try { unbindService(conn) } catch (_: Exception) {}\n"
          "    }\n"
          "    private fun unbindAllEngineKeepAlive() { for (k in engineBinders.keys.toList()) unbindEngineKeepAlive(k) }\n"
          "    override fun onGetLanguage(): Array<String> {\n"
          "        val locale = try { java.util.Locale.getDefault() } catch (_: Exception) { return arrayOf(\"zxx\") }\n"
          "        if (locale == null) return arrayOf(\"zxx\")\n"
          "        val iso3 = try { locale.isO3Language } catch (_: Exception) { \"zxx\" }\n"
          "        return arrayOf(when (iso3) { \"cmn\", \"lzh\", \"gan\", \"hak\" -> \"zho\"; else -> iso3 })\n"
          "    }\n"
          "    override fun onIsLanguageAvailable(l: String?, c: String?, v: String?): Int {\n"
          "        EasyVoiceLogger.d(\"[LANG] onIsLanguageAvailable l=$l c=$c v=$v\")\n"
          "        val raw = l ?: \"\"\n"
          "        val result = if (prefs.getLanguageList().contains(raw) && !prefs.isLanguageDisabled(raw)) TextToSpeech.LANG_AVAILABLE else TextToSpeech.LANG_NOT_SUPPORTED\n"
          "        EasyVoiceLogger.d(\"[LANG] onIsLanguageAvailable l=$l → result=$result\")\n"
          "        return result\n"
          "    }\n"
          "    override fun onLoadLanguage(l: String?, c: String?, v: String?): Int {\n"
          "        EasyVoiceLogger.d(\"[LANG] onLoadLanguage l=$l c=$c v=$v\")\n"
          "        return synchronized(this) {\n"
          "            val result = onIsLanguageAvailable(l, c, v)\n"
          "            EasyVoiceLogger.d(\"[LANG] onLoadLanguage isAvail=$result l=$l\")\n"
          "            if ((result == TextToSpeech.LANG_AVAILABLE || result == TextToSpeech.LANG_COUNTRY_AVAILABLE || result == TextToSpeech.LANG_COUNTRY_VAR_AVAILABLE) && !l.isNullOrEmpty() && ::prefs.isInitialized) {\n"
          "                val lang = prefs.toIso3(l.lowercase())\n"
          "                if (modeInt == 3) {\n"
          "                    try { loadVoice(\"com.google.android.tts\", Locale(lang), v ?: \"\", dedicatedEnginesFlag) } catch (_: Exception) {}\n"
          "                    EasyVoiceLogger.d(\"[LANG] onLoadLanguage modeInt=3 → loadVoice(google, $lang) engineIndex=$engineIndex\")\n"
          "                    return@synchronized result\n"
          "                }\n"
          "                val vStr = v ?: \"\"\n"
          "                val paramVariant = if (vStr.isEmpty()) prefs.getVoiceName(lang) else vStr\n"
          "                try {\n"
          "                    var enginePkg = prefs.getEngineForLanguage(lang)\n"
          "                    var voiceLang = lang\n"
          "                    if (enginePkg == \"NOT_SET\") {\n"
          "                        val cLang = prefs.toIso3(prefs.getString(\"auto_mode_language\", \"\").ifEmpty { localeIso3() })\n"
          "                        enginePkg = prefs.getEngineForLanguage(cLang)\n"
          "                        voiceLang = cLang\n"
          "                    }\n"
          "                    val savedLocTag = prefs.getLocaleForLangPkg(voiceLang, enginePkg)\n"
          "                    val saved = parseVoiceNameAsLocale(savedLocTag) ?: return@synchronized TextToSpeech.LANG_NOT_SUPPORTED\n"
          "                    val savedLangMatches = try { localeIso3(saved).lowercase() == lang } catch (_: Exception) { false }\n"
          "                    if (savedLangMatches) {\n"
          "                        EasyVoiceLogger.d(\"[LANG] onLoadLanguage V pkg=$enginePkg locale=$saved variant=$paramVariant dedicatedEnginesFlag=$dedicatedEnginesFlag\")\n"
          "                        loadVoice(if (enginePkg == \"NOT_SET\") \"\" else enginePkg, saved, paramVariant, dedicatedEnginesFlag)\n"
          "                    } else {\n"
          "                        val langOnly = Locale(lang)\n"
          "                        val foundPkg = findEngineForLocale(langOnly)\n"
          "                        EasyVoiceLogger.d(\"[LANG] onLoadLanguage saved-lang mismatch → findEngineForLocale scan pkg='$foundPkg' locale=$langOnly\")\n"
          "                        loadVoice(foundPkg, langOnly, paramVariant, dedicatedEnginesFlag)\n"
          "                    }\n"
          "                } catch (_: Exception) {}\n"
          "            }\n"
          "            EasyVoiceLogger.d(\"[LANG] onLoadLanguage l=$l → $result engineIndex=$engineIndex\")\n"
          "            result\n"
          "        }\n"
          "    }\n"
          "    override fun onGetDefaultVoiceNameFor(l: String?, c: String?, v: String?): String {\n"

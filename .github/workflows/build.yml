          "                                    if (!(localeMatches && (currentVoiceName == voiceName || voiceName == \"*Default\" || voiceName.isEmpty()))) {\n"
          "                                        if (voiceName != \"*Default\" && voiceName.isNotEmpty()) {\n"
          "                                            val match: Voice? = voiceListCache[cacheKey]?.get(voiceName.lowercase())\n"
          "                                                ?: try { tts.voices?.firstOrNull { it.name.equals(voiceName, ignoreCase = true) } } catch (_: Exception) { null }\n"
          "                                            if (match != null) tts.voice = match\n"

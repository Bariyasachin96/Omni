              const jchar* chars = env->GetStringChars(jText, nullptr);
              int textLen = (int)env->GetStringLength(jText);
              const char* latC = jLat?env->GetStringUTFChars(jLat,nullptr):nullptr; std::string latFall(latC?latC:""); if(latC) env->ReleaseStringUTFChars(jLat,latC);
              const char* nlC = jNonLat?env->GetStringUTFChars(jNonLat,nullptr):nullptr; std::string nonLatFall(nlC?nlC:""); if(nlC) env->ReleaseStringUTFChars(jNonLat,nlC);
              bool disableAdv = (jDisableAdv==JNI_TRUE);

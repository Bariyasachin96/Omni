name: Build Easy Voice Native
on:
  push:
    branches: ["main", "master"]
  # No inputs. A dispatch through the API does not reliably apply a declared
  # input default -- run 730 skipped the release step for exactly that reason
  # and left only the R8 mapping to download -- so publishing is unconditional.
  workflow_dispatch:
# ACTION MAJORS, AND WHY THEY MOVED TOGETHER (2026-09-10).
# checkout, setup-java, upload-artifact and action-gh-release v2/v4 all run on
# the Node 20 runtime GitHub has DEPRECATED -- action-gh-release's own README
# says v2 "is no longer maintained or supported. It uses the Node 20 runtime
# deprecated by GitHub Actions", and that is the step that publishes the APK.
# This is a deadline rather than a preference: when the runtime is switched off,
# the build stops producing anything.
#
# Every input this workflow passes was checked against each action's own README
# before bumping, rather than assumed:
#   gradle/actions/setup-gradle v3 -> v6   gradle-version and cache-disabled survive
#   softprops/action-gh-release  v2 -> v3   tag_name/name/body/files/make_latest/
#                                           fail_on_unmatched_files unchanged, and
#                                           token defaults to github.token
#   actions/checkout             v4 -> v7   no inputs passed here at all
#   actions/setup-java           v4 -> v6   java-version and distribution unchanged
#   actions/upload-artifact      v4 -> v7   name/path/retention-days/if-no-files-found
#   android-actions/setup-android v3 -> v4  the one real risk was the cmdline-tools
#                                           path, closed by resolving sdkmanager
#                                           from PATH. It takes ONE input now --
#                                           `packages` -- because its default asks
#                                           for a package Google has deleted; the
#                                           reasoning is at the step itself.
# reactivecircus/android-emulator-runner is ALREADY current at v2 (2.38.0) and is
# deliberately untouched.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # DROP THE DEAD `tools` PACKAGE. This input's default is
          # `tools platform-tools` (the action's own action.yml), and Google has
          # REMOVED `tools` from the SDK repository -- proven rather than
          # inferred: repository2-3.xml today contains zero `path="tools"` and
          # one `path="platform-tools"`. So the action ran `sdkmanager tools`,
          # got "Warning: Failed to find package 'tools'", exited 1, and took
          # BOTH jobs down at step 4 before a single line of ours ran. That is
          # build 876, and build 875 passed on the identical pin five days
          # earlier -- nothing in this repo changed, the SDK repository did.
          #
          # platform-tools stays because the emulator job needs adb. Everything
          # else this build uses -- the NDK, CMake, build-tools, the platform --
          # is installed by the next step, which resolves sdkmanager from PATH
          # and therefore does not care that the runner image has moved
          # cmdline-tools again (it is 20.0 now, not the 16.0 the v4 bump
          # predicted).
          packages: platform-tools

      - name: Install NDK and CMake
        run: |
          # RESOLVED FROM PATH FIRST, then the absolute path as a fallback.
          # setup-android v3 puts cmdline-tools under .../latest/ and v4's own
          # README documents .../16.0/bin on the PATH instead, so hard-coding
          # "latest" made this step depend on the action's major version. Both
          # shapes work now, and the fallback keeps the exact old behaviour when
          # sdkmanager is not on the PATH at all.
          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "using sdkmanager: $SDKMANAGER"
          install_pkgs() {
            echo "y" | "$SDKMANAGER" \
              "ndk;30.0.16248370" "cmake;4.1.2" "build-tools;37.0.0" --sdk_root=$ANDROID_HOME
          }
          n=0
          until [ $n -ge 5 ]; do
            if install_pkgs && [ -d "$ANDROID_HOME/ndk/30.0.16248370" ]; then
              echo "NDK + CMake installed successfully."; break
            fi
            n=$((n+1))
            echo "::warning::NDK/CMake install attempt $n failed (likely corrupt download) — clearing caches and retrying..."
            rm -rf "$ANDROID_HOME/ndk/30.0.16248370" 2>/dev/null || true
            rm -rf "$HOME/.android/cache" "$HOME/.cache/Google/AndroidStudio"*/ 2>/dev/null || true
            sleep $((n * 5))
          done
          if [ ! -d "$ANDROID_HOME/ndk/30.0.16248370" ]; then
            echo "::error::NDK install failed after $n retries."; exit 1
          fi
          # compileSdk 37 needs the platform. Best effort only: AGP downloads a
          # missing platform itself, and a bad package name here must never take
          # the NDK install down with it (that is how run 711 failed).
          echo "y" | "$SDKMANAGER" \
            "platforms;android-37" --sdk_root=$ANDROID_HOME \
            || echo "::warning::platforms;android-37 not available from sdkmanager; letting AGP fetch it"

      # Run 738 sat on this step for 33 minutes -- it normally takes 45 seconds --
      # because a clone hung with no timeout to kill it. Each fetch now gets its
      # own timeout and three tries, and the step as a whole fails fast instead
      # of burning the job's 6-hour budget.
      - name: Clone the CLD2 Native Library
        timeout-minutes: 12
        run: |
          set -e
          mkdir -p app/src/main/cpp
          clone() {
            url=$1; dir=$2; shift 2
            n=0
            until [ $n -ge 3 ]; do
              rm -rf "$dir"
              if timeout 240 git clone --depth 1 "$@" "$url" "$dir"; then return 0; fi
              n=$((n+1)); echo "clone attempt $n failed for $url, retrying"; sleep $((n * 5))
            done
            echo "giving up on $url"; return 1
          }
          clone https://github.com/CLD2Owners/cld2.git app/src/main/cpp/cld2_src

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 9.7.1 because AGP 9.4 requires Gradle 9.6.0 as a MINIMUM (its own
          # release notes), so this is not an independent bump -- the two move
          # together or the build fails at configuration. It is also not new
          # ground: builds 849-857 ran on 9.7.1, and build 857 is what proved
          # Gradle was innocent of the accessibility job's dependency failure.
          gradle-version: '9.7.1'
          # cache-disabled STAYS TRUE, and it is now a measured decision rather
          # than an unexamined default (2026-09-10). Enabling it looked like the
          # biggest remaining lever -- every run re-downloads the whole
          # buildscript classpath, which is exactly what flaked in build 866 --
          # until setup-gradle's own docs settled it:
          #
          #   "By default, the setup-gradle action will only WRITE to the cache
          #    for builds run on the default (master/main) branch"
          #   "cache entries written for a Git branch are not visible from
          #    actions running against different branches or tags. Entries
          #    written for the default branch are visible to all."
          #
          # Every run of this workflow is a workflow_dispatch on
          # claude/yaml-file-nk3czh, a FEATURE branch. So it would write nothing
          # (read-only off the default branch) and find nothing to read (main
          # never populated one). Turning it on buys a cache-restore attempt that
          # misses, every run, for ever.
          #
          # The transient failure it would have prevented is handled at the
          # symptom instead, by tools/ci/gradle-retry.sh -- which is the right
          # place for it here, because the cause cannot be removed on a branch.
          cache-disabled: true

      - name: Restore Keystore
        run: |
          KSBASE64="${{ secrets.KEYSTORE_BASE64 }}"
          if [ -z "$KSBASE64" ]; then
            KSBASE64=""
          fi
          printf '%s' "$KSBASE64" | base64 -d > easyvoice-release.keystore
          echo "Keystore ready" 
      - name: Build APK
        # tools/ci/gradle-retry.sh, not an inline function: this same retry was
        # written inline first and broke the accessibility job, because the
        # emulator action runs its script with /usr/bin/sh (dash) one line at a
        # time and `set -o pipefail` is not POSIX. A file with its own shebang
        # runs under bash whatever the caller is, and the caller's line stays
        # self-contained. It retries ONLY a transient repository failure; a real
        # compile error exits on the first attempt.
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash tools/ci/gradle-retry.sh assembleRelease -PevAbiSplit
        env:
          # Read by defaultConfig.versionCode, so the Advanced tab's "Build number"
          # is this run's number rather than a frozen 1.
          EV_BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'sachin1211' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'sachin' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sachin1211' }}

      # Every build ships the same way: clearly named APKs on the release page.
      # "app-release.apk" collided in the Downloads folder and was hard to tell
      # apart from the mapping artifact.
      #
      # -PevAbiSplit turns on the ABI split, so the release variant now produces
      # THREE files instead of one (there is no app-release.apk any more):
      #
      #   EasyVoice-<n>.apk              the universal build, every ABI --
      #                                  the SAME NAME it has always had, so a
      #                                  bookmark or a habit still works
      #   EasyVoice-<n>-arm64-v8a.apk    64-bit, which is every phone since
      #                                  about 2015 -- roughly HALF the size
      #   EasyVoice-<n>-armeabi-v7a.apk  32-bit-only phones
      #
      # The universal one stays first and stays the safe answer; the other two
      # are there for anyone who wants the smaller download. Nothing is dropped
      # -- a device that could install build 859 can install one of these.
      - name: Name the APKs after the build
        run: |
          set -e
          out=app/build/outputs/apk/release
          ls -l "$out"
          cp "$out/app-universal-release.apk"    "EasyVoice-${{ github.run_number }}.apk"
          cp "$out/app-arm64-v8a-release.apk"    "EasyVoice-${{ github.run_number }}-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk"  "EasyVoice-${{ github.run_number }}-armeabi-v7a.apk"
          ls -l EasyVoice-${{ github.run_number }}*.apk

      # THE EXACT SOURCE OF THIS BUILD, PUBLISHED BESIDE IT (owner, 2026-09-11:
      # "har build ke sath pura jo latest build ka source code hai vah bhi a jana
      # chahie").
      #
      # `git archive` is what makes this the build rather than a snapshot of
      # something near it: it reads TRACKED files out of the commit that was just
      # compiled, so build output, tools/.cache, Gradle's caches and everything
      # gitignored are structurally incapable of getting in, and the archive is
      # reproducible from the commit for as long as the repo exists. The one
      # exclusion, autotts_reference/, is declared in .gitattributes with the
      # reasoning beside it -- not here, so it cannot drift from the archive.
      #
      # GitHub already attaches its own "Source code (zip)" to a tag. This is
      # still worth its own asset: it is NAMED after the build, so it sits beside
      # the APKs under the same number, and it carries BUILD-INFO.txt stamping
      # which run, commit and branch produced it -- which the auto-generated one
      # cannot.
      - name: Archive the source of this build
        run: |
          set -e
          n=${{ github.run_number }}
          cat > BUILD-INFO.txt <<INFO
          Easy Voice - source of build #$n
          Commit:   ${{ github.sha }}
          Ref:      ${{ github.ref_name }}
          Workflow: ${{ github.workflow }} run ${{ github.run_id }}
          Built:    $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          This is every tracked file at that commit, straight out of git, so it
          builds the APK published in the same release. Build it with:
            ./gradlew assembleRelease -PevAbiSplit
          INFO
          git archive --format=zip -9 \
            --prefix="EasyVoice-$n-source/" \
            HEAD -o "EasyVoice-$n-source.zip"
          # BUILD-INFO goes in with plain `zip` rather than git archive's own
          # --add-file, which only exists from git 2.38. The runner image is far
          # newer than that today, but a source archive is not worth making the
          # publish step depend on a runner's git version, and appending to a zip
          # is the same one command everywhere.
          mkdir -p "EasyVoice-$n-source"
          mv BUILD-INFO.txt "EasyVoice-$n-source/BUILD-INFO.txt"
          zip -q -9 "EasyVoice-$n-source.zip" "EasyVoice-$n-source/BUILD-INFO.txt"
          rm -rf "EasyVoice-$n-source"
          ls -l "EasyVoice-$n-source.zip"
          # A source archive that does not contain the app is worse than none at
          # all, because nobody opens it until they need it. Assert the two things
          # that would actually be missing if git archive ever changed under us.
          unzip -Z1 "EasyVoice-$n-source.zip" | grep -q "EasyVoice-$n-source/app/src/main/java/com/sachinbaria/easyvoice/EasyVoiceTtsService.kt" \
            || { echo "source archive is missing the service"; exit 1; }
          unzip -Z1 "EasyVoice-$n-source.zip" | grep -q "EasyVoice-$n-source/app/src/main/cpp/tts_engine_core.cpp" \
            || { echo "source archive is missing the native core"; exit 1; }

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Easy Voice build #${{ github.run_number }}
          body: |
            Build #${{ github.run_number }}
            Commit: ${{ github.sha }}

            **EasyVoice-${{ github.run_number }}.apk** works on every phone.
            The two smaller files below are the same build with only one CPU's
            code in it -- `arm64-v8a` is the one for any phone from about 2015
            onwards, and it is roughly half the download.

            **EasyVoice-${{ github.run_number }}-source.zip** is the complete
            source this build was compiled from, taken straight out of the commit
            above. It excludes only `autotts_reference/`, which is a third-party
            app kept in the repo for comparison and is not part of Easy Voice.
          files: |
            EasyVoice-${{ github.run_number }}.apk
            EasyVoice-${{ github.run_number }}-arm64-v8a.apk
            EasyVoice-${{ github.run_number }}-armeabi-v7a.apk
            EasyVoice-${{ github.run_number }}-source.zip
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ONE LINE SAYING WHICH KIND OF FAILURE THIS WAS, before anyone reads a
      # thousand log lines. Every failure this pipeline has had since run 795 was
      # infrastructure rather than a real defect, and all of them looked the same
      # from outside: one red X. Twice that cost a wrong diagnosis.
      - name: Say WHY this went red
        if: failure()
        run: bash tools/ci/why-failed.sh

      # Backup copy, so the APK is reachable even if the release step ever fails.
      - name: Upload APK (backup)
        uses: actions/upload-artifact@v7
        with:
          name: easy-voice-apk-${{ github.run_number }}
          path: EasyVoice-${{ github.run_number }}*.apk
          retention-days: 7
          if-no-files-found: error

      # mapping.txt must never ship publicly - it undoes the obfuscation.
      # Kept as a repo-private build artifact so only we can retrace a crash.
      - name: Upload R8 mapping (private)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r8-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

  # Google's Accessibility Test Framework over every screen -- labels, colour
  # contrast, touch target size, traversal order. See
  # app/src/androidTest/.../AccessibilityChecksTest.kt for what it covers.
  #
  # THIS JOB FAILING FAILS THE RUN. It is a separate job only so that it runs in
  # PARALLEL with the APK build -- an accessibility regression is a real defect
  # and must be seen and fixed, not tolerated because the APK happened to build.
  # Do not add continue-on-error, and do not make anything here optional.
  #
  # API 34 is the floor: enableAccessibilityChecks() requires it and is a no-op
  # below. The AVD needs KVM, which ubuntu-latest has once the udev rule below
  # grants access to it -- that step is from the emulator action's own README.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # DROP THE DEAD `tools` PACKAGE. This input's default is
          # `tools platform-tools` (the action's own action.yml), and Google has
          # REMOVED `tools` from the SDK repository -- proven rather than
          # inferred: repository2-3.xml today contains zero `path="tools"` and
          # one `path="platform-tools"`. So the action ran `sdkmanager tools`,
          # got "Warning: Failed to find package 'tools'", exited 1, and took
          # BOTH jobs down at step 4 before a single line of ours ran. That is
          # build 876, and build 875 passed on the identical pin five days
          # earlier -- nothing in this repo changed, the SDK repository did.
          #
          # platform-tools stays because the emulator job needs adb. Everything
          # else this build uses -- the NDK, CMake, build-tools, the platform --
          # is installed by the next step, which resolves sdkmanager from PATH
          # and therefore does not care that the runner image has moved
          # cmdline-tools again (it is 20.0 now, not the 16.0 the v4 bump
          # predicted).
          packages: platform-tools

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # THE EMULATOR NEEDS 7.2 GB OF FREE DISK AND THE RUNNER STOPPED HAVING IT.
      # Runs 795 and 796 both died with the emulator never booting, and the only
      # line that matters is buried a thousand lines above the adb retries:
      #
      #   FATAL | Not enough space to create userdata partition.
      #           Available: 6881.56 MB at /home/runner/.android/avd/test.avd,
      #           need 7372.80 MB.
      #
      # Short by 491 MB. Not KVM, not a missing system image -- and NOT anything
      # in this repository: run 794 passed with this workflow byte for byte, so
      # what changed is the hosted runner image, which keeps growing while the
      # pixel_6 userdata partition stays 7.2 GB. By the time the emulator starts
      # this job has already spent its budget on NDK 29, the CLD2 clone,
      # Gradle and the system image.
      #
      # So reclaim what a TTS build provably never touches. Every path here is a
      # preinstalled toolchain for another language or ecosystem; `|| true` on
      # each, because a path disappearing from a future image must not fail the
      # run. NEVER add /opt/hostedtoolcache/Java_* (JAVA_HOME) or
      # /usr/local/lib/android (ANDROID_HOME) to this list -- they are what the
      # job runs on.
      #
      # The `df` lines are deliberate: if this ever fails again, the log states
      # the space on both sides instead of leaving the next person to guess.
      - name: Free disk space for the emulator
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1
          # SAY IT HERE IF THERE IS NOT ENOUGH ROOM, because the emulator will not.
          # Runs 795-797 died on ONE line buried a thousand adb errors below the
          # noise:
          #     FATAL | Not enough space to create userdata partition.
          #             Available: 6881.56 MB ... need 7372.80 MB.
          # and everything after it was adb talking to a process that never
          # started. 7372.80 MB is the pixel_6 userdata partition; the margin is
          # for the system image and the build that follow it.
          #
          # This WARNS rather than fails: a manufactured red run is worse than a
          # real one, and the emulator may still manage. What it buys is that the
          # number is at the TOP of the log instead of inferred from adb noise.
          avail_mb=$(df -m / | tail -1 | awk '{print $4}')
          echo "free after cleanup: ${avail_mb} MB"
          if [ "$avail_mb" -lt 9000 ]; then
            echo "::warning::Only ${avail_mb} MB free. The pixel_6 userdata partition alone needs 7373 MB, and the system image and build come out of the same disk. If this run dies in adb, grep the log for FATAL first -- that is what runs 795-797 were."
          fi

      - name: Install NDK and CMake
        timeout-minutes: 20
        run: |
          # PATH first, absolute path as the fallback -- the same reason as the
          # build job's copy: setup-android v4 documents cmdline-tools/16.0/bin
          # rather than .../latest/, and this step must not depend on which.
          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "using sdkmanager: $SDKMANAGER"
          # THIS STEP USED TO PASS WHEN THE NDK WAS NOT THERE (fixed 2026-09-10).
          # It looped three times and then simply ended -- no check that the NDK
          # had actually landed, and no non-zero exit if all three attempts
          # failed. So a failed or CORRUPT download left this step GREEN and the
          # real failure surfaced three minutes later, inside the emulator, as an
          # opaque CMake or Gradle error with nothing pointing back here.
          #
          # The build job has always verified the directory and errored. This is
          # that, byte for byte, including clearing the sdkmanager caches between
          # attempts -- the build job's comment records that a corrupt download
          # is the usual reason a retry is needed at all.
          install_pkgs() {
            echo "y" | "$SDKMANAGER" \
              "ndk;30.0.16248370" "cmake;4.1.2" "build-tools;37.0.0" \
              --sdk_root=$ANDROID_HOME
          }
          n=0
          until [ $n -ge 3 ]; do
            if install_pkgs && [ -d "$ANDROID_HOME/ndk/30.0.16248370" ]; then
              echo "NDK + CMake installed successfully."; break
            fi
            n=$((n+1))
            echo "::warning::NDK/CMake install attempt $n failed; clearing caches and retrying"
            rm -rf "$ANDROID_HOME/ndk/30.0.16248370" 2>/dev/null || true
            rm -rf "$HOME/.android/cache" "$HOME/.cache/Google/AndroidStudio"*/ 2>/dev/null || true
            sleep $((n * 10))
          done
          if [ ! -d "$ANDROID_HOME/ndk/30.0.16248370" ]; then
            echo "::error::NDK install failed after $n retries. Failing HERE rather than letting the emulator step fail three minutes later with an unrelated message."
            exit 1
          fi

      # The debug APK links the same native core as the release one, so the
      # the CLD2 sources have to be here too.
      - name: Clone the CLD2 Native Library
        timeout-minutes: 12
        run: |
          set -e
          mkdir -p app/src/main/cpp
          clone() {
            url=$1; dir=$2; shift 2
            n=0
            until [ $n -ge 3 ]; do
              rm -rf "$dir"
              if timeout 240 git clone --depth 1 "$@" "$url" "$dir"; then return 0; fi
              n=$((n+1)); echo "clone attempt $n failed for $url, retrying"; sleep $((n * 5))
            done
            echo "giving up on $url"; return 1
          }
          clone https://github.com/CLD2Owners/cld2.git app/src/main/cpp/cld2_src

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 9.7.1 because AGP 9.4 requires Gradle 9.6.0 as a MINIMUM (its own
          # release notes), so this is not an independent bump -- the two move
          # together or the build fails at configuration. It is also not new
          # ground: builds 849-857 ran on 9.7.1, and build 857 is what proved
          # Gradle was innocent of the accessibility job's dependency failure.
          gradle-version: '9.7.1'
          # cache-disabled STAYS TRUE, and it is now a measured decision rather
          # than an unexamined default (2026-09-10). Enabling it looked like the
          # biggest remaining lever -- every run re-downloads the whole
          # buildscript classpath, which is exactly what flaked in build 866 --
          # until setup-gradle's own docs settled it:
          #
          #   "By default, the setup-gradle action will only WRITE to the cache
          #    for builds run on the default (master/main) branch"
          #   "cache entries written for a Git branch are not visible from
          #    actions running against different branches or tags. Entries
          #    written for the default branch are visible to all."
          #
          # Every run of this workflow is a workflow_dispatch on
          # claude/yaml-file-nk3czh, a FEATURE branch. So it would write nothing
          # (read-only off the default branch) and find nothing to read (main
          # never populated one). Turning it on buys a cache-restore attempt that
          # misses, every run, for ever.
          #
          # The transient failure it would have prevented is handled at the
          # symptom instead, by tools/ci/gradle-retry.sh -- which is the right
          # place for it here, because the cause cannot be removed on a branch.
          cache-disabled: true

      - name: Run accessibility checks on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # 34, and NOT the app's targetSdk. This is the API of the throwaway
          # emulator the tests run on; it has nothing to do with which Android
          # the app targets or installs on.
          #
          # 34 is the FLOOR that matters: enableAccessibilityChecks() is
          # @RequiresApi(34) and a documented no-op below it, which is what
          # @SdkSuppress(minSdkVersion = 34) on the test class guards.
          #
          # 37 WAS TRIED AND DOES NOT EXIST HERE. Run 788: the emulator action
          # runs its own `sdkmanager --install ... 'platforms;android-37'` and
          # answered "Warning: Failed to find package 'platforms;android-37'",
          # so no emulator ever booted and no test ran. The same sdkmanager also
          # warns that it "only understands SDK XML versions up to 3 but an SDK
          # XML file of version 4 was encountered", which is why the newest
          # packages are invisible to it. Before raising this again, check that
          # exact line in the log rather than assuming an image exists.
          #
          # There is nothing to gain by chasing it either: ATF's checks are
          # library code and give the same answers at 34 as at 37.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            bash tools/ci/gradle-retry.sh connectedDebugAndroidTest

      # Uploaded on failure too -- the HTML report names the exact node and the
      # exact check, which is the only way to fix a failure you cannot reproduce
      # locally without an emulator.
      # The same classifier as the build job. This is the job that has produced
      # EVERY red run since 795, and not one of them was a real accessibility
      # regression -- so "is this the app or the pipeline?" is the first question
      # every single time, and it now has an answer at the top of the log.
      - name: Say WHY this went red
        if: failure()
        run: bash tools/ci/why-failed.sh

      - name: Upload the accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn

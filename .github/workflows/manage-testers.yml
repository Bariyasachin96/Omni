name: Manage Testers

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Tester email (e.g. name@gmail.com)'
        required: true
        type: string
      action:
        description: 'Action'
        required: true
        type: choice
        options:
          - add
          - remove

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Add or Remove Tester
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TESTER_EMAIL: ${{ inputs.email }}
          ACTION: ${{ inputs.action }}
        run: |
          pip3 install firebase-admin -q
          python3 - << 'PYEOF'
          import json, os
          import firebase_admin
          from firebase_admin import credentials, db

          sa = json.loads(os.environ['FIREBASE_SA'])
          email = os.environ['TESTER_EMAIL'].strip()
          action = os.environ['ACTION']

          cred = credentials.Certificate(sa)
          firebase_admin.initialize_app(cred, {
              'databaseURL': f'https://{sa["project_id"]}-default-rtdb.firebaseio.com'
          })

          rtdb_key = email.replace('.', ',')
          ref = db.reference(f'/testers/{rtdb_key}')

          if action == 'add':
              ref.set({'active': True})
              print(f'SUCCESS: {email} added as tester')
          elif action == 'remove':
              ref.delete()
              print(f'SUCCESS: {email} removed from testers')
          PYEOF
